    <script>
    // Глобальные переменные, утилиты, навигация, профиль, чаты
    // ... (весь код из предыдущей версии) ...
    // Добавлена функция для удаления уведомлений из истории
    function deleteBroadcastItem(index) {
        broadcastHistory.splice(index, 1);
        localStorage.setItem('arizona_broadcast_history', JSON.stringify(broadcastHistory));
        renderBroadcastHistory();
    }
    function clearBroadcastHistory() {
        if (confirm('Очистить всю историю уведомлений?')) {
            broadcastHistory = [];
            localStorage.setItem('arizona_broadcast_history', JSON.stringify(broadcastHistory));
            renderBroadcastHistory();
        }
    }
    function renderBroadcastHistory() {
        const cont = document.getElementById('broadcastHistoryContainer');
        if (broadcastHistory.length === 0) {
            cont.innerHTML = '<p style="font-size:12px;">История пуста</p>';
            return;
        }
        cont.innerHTML = broadcastHistory.map((item, index) => `
            <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--app-card-border);">
                <span style="font-size:12px;">${item}</span>
                <button onclick="deleteBroadcastItem(${index})" style="background:none;border:none;color:var(--app-accent);font-size:14px;">✕</button>
            </div>
        `).join('');
    }
    // Также обновляем updateBroadcastMessage, чтобы добавлять в историю
    function updateBroadcastMessage() {
        const text = document.getElementById('newBroadcastInput').value.trim();
        if (text) {
            localStorage.setItem('arizona_broadcast_text', text);
            // Добавляем в историю
            broadcastHistory.unshift(`📢 ${new Date().toLocaleString()}: ${text}`);
            localStorage.setItem('arizona_broadcast_history', JSON.stringify(broadcastHistory));
            showBroadcastBanner(text);
            document.getElementById('newBroadcastInput').value = '';
            playSfx('success');
        }
    }
    </script>
