<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дурак (офлайн)</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; min-height: 100vh;
            background: #1a3a1a;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        #app {
            width: 100%; max-width: 800px; height: 100vh; max-height: 900px;
            background: #2a6b2a; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            border: 8px solid #5a3a1a;
        }
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; gap: 20px; padding: 20px;
        }
        #menu h1 { color: #ffd700; font-size: 3em; text-shadow: 0 0 20px #000; margin: 0; }
        #menu label {
            color: #fff; font-size: 1.3em; background: rgba(0,0,0,0.5); padding: 10px 30px;
            border-radius: 40px; display: flex; align-items: center; gap: 15px; cursor: pointer;
            transition: 0.2s;
        }
        #menu label:hover { background: rgba(255,215,0,0.3); }
        #menu label input { transform: scale(1.5); cursor: pointer; }
        #menu button {
            font-size: 1.8em; padding: 15px 60px; background: #ffd700; border: none;
            border-radius: 60px; color: #1a3a1a; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 0 #b8860b; transition: 0.1s linear;
        }
        #menu button:active { transform: translateY(5px); box-shadow: 0 0 0 #b8860b; }
        #menu .info { color: #ddd; font-size: 0.9em; margin-top: 10px; text-align: center; }

        #table {
            flex: 1; position: relative; background: radial-gradient(circle at 20% 30%, #3a8a3a, #1e5a1e);
            border-radius: 20px; margin: 8px; box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
            min-height: 0; display: flex; flex-direction: column;
        }
        .zone {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 4px; padding: 4px; position: relative;
        }
        #bot-zone {
            flex: 0 0 80px; border-bottom: 2px dashed rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.15); border-radius: 12px 12px 0 0;
        }
        #center-zone {
            flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 12px; padding: 10px; min-height: 120px; position: relative;
        }
        .card-pair {
            display: inline-flex; position: relative; width: 70px; height: 95px;
            flex-shrink: 0; transition: transform 0.2s;
        }
        .card-pair .card {
            position: absolute; width: 60px; height: 84px;
            transition: left 0.3s, top 0.3s, opacity 0.3s, transform 0.2s;
            cursor: default; pointer-events: none;
        }
        .card-pair .card.attack-card { left: 0; top: 0; z-index: 1; border-color: #d44; box-shadow: 0 0 10px rgba(200,50,50,0.5); }
        .card-pair .card.defense-card { left: 18px; top: 14px; z-index: 2; border-color: #44d; box-shadow: 0 0 10px rgba(50,100,200,0.5); }
        .card-pair .card.attack-only { left: 0; top: 0; z-index: 1; border-color: #d44; box-shadow: 0 0 10px rgba(200,50,50,0.5); }
        .card-pair .card { animation: cardAppear 0.25s ease-out; }
        @keyframes cardAppear { 0% { opacity: 0; transform: scale(0.8) translateY(-10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        #player-zone { flex: 0 0 110px; border-top: 2px dashed rgba(255,255,255,0.2); background: rgba(0,0,0,0.15); border-radius: 0 0 12px 12px; }
        .turn-indicator {
            position: absolute; top: -10px; right: 10px; background: #ffd700; color: #1a3a1a;
            font-weight: bold; padding: 2px 12px; border-radius: 30px; font-size: 0.8em;
            box-shadow: 0 0 15px #ffd700; z-index: 5;
        }
        #deck-area {
            position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 10;
        }
        #deck-area .card {
            width: 50px; height: 70px; font-size: 1.2em; background: #1a3a8a; color: #fff;
            border: 2px solid #aaa; border-radius: 8px; display: flex; justify-content: center;
            align-items: center; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        #trump-info { color: #fff; font-weight: bold; text-shadow: 0 0 8px #000; font-size: 1.1em; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 20px; text-align: center; }

        .card {
            width: 60px; height: 84px; background: #fff; border-radius: 8px; border: 2px solid #333;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.4); display: inline-flex; flex-direction: column;
            justify-content: space-between; padding: 4px 6px; font-size: 1.1em; font-weight: bold;
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; position: relative;
            cursor: pointer; flex-shrink: 0;
        }
        .card .top { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; }
        .card .bottom { display: flex; flex-direction: column; align-items: flex-end; transform: rotate(180deg); line-height: 1.1; }
        .card .suit { font-size: 1.2em; }
        .card.red { color: #c00; }
        .card.black { color: #000; }
        .card.back {
            background: linear-gradient(135deg, #1a3a8a, #2a5a9a); border-color: #0a1a4a;
            color: transparent; background-image: repeating-linear-gradient(45deg, #3a6aba 0px, #3a6aba 4px, #4a7aca 4px, #4a7aca 8px);
            cursor: default;
        }
        .card.back .top, .card.back .bottom { display: none; }
        .card.highlight { box-shadow: 0 0 15px 5px #ffd700; transform: scale(1.05); border-color: #ffd700; }
        .card.suggest { animation: pulse-gold 1s infinite alternate; border-color: #ffaa00; }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 5px 2px #ffaa00; transform: scale(1); } 100% { box-shadow: 0 0 20px 10px #ffd700; transform: scale(1.08); } }
        .card.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.6); }
        .card.trump-card { border: 3px solid gold; }
        .card.shake { animation: shake 0.3s ease; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

        #controls {
            display: flex; justify-content: center; gap: 8px; padding: 8px 10px 10px;
            background: rgba(0,0,0,0.3); border-radius: 40px; margin: 0 12px 10px; flex-wrap: wrap;
        }
        #controls button {
            padding: 8px 14px; border: none; border-radius: 40px; font-size: 0.95em;
            font-weight: bold; background: #ffd700; color: #1a3a1a; cursor: pointer;
            box-shadow: 0 3px 0 #b8860b; transition: 0.1s linear; min-width: 60px;
        }
        #controls button:active { transform: translateY(3px); box-shadow: none; }
        #controls button:disabled { opacity: 0.4; transform: translateY(3px); box-shadow: none; pointer-events: none; }
        #controls button.secondary { background: #ddd; color: #222; box-shadow: 0 3px 0 #999; }
        #controls button.hint { background: #5a9; color: #fff; box-shadow: 0 3px 0 #2a6a4a; }

        #status {
            color: #fff; font-size: 1.2em; text-align: center; text-shadow: 0 0 12px #000;
            padding: 5px; min-height: 2.2em; background: rgba(0,0,0,0.3); border-radius: 30px;
            margin: 0 12px 4px; font-weight: 500;
        }
        #table-count {
            color: #fff; background: rgba(0,0,0,0.4); padding: 2px 12px; border-radius: 20px;
            font-size: 0.8em; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; z-index: 5;
        }
        @media (max-width: 600px) {
            .card { width: 48px; height: 67px; font-size: 0.9em; padding: 3px 4px; }
            .card-pair { width: 56px; height: 76px; }
            .card-pair .card.defense-card { left: 14px; top: 11px; }
            #bot-zone { flex-basis: 65px; }
            #player-zone { flex-basis: 85px; }
            #deck-area .card { width: 40px; height: 56px; font-size: 1em; }
            #controls button { padding: 6px 10px; font-size: 0.85em; min-width: 50px; }
            #menu h1 { font-size: 2em; }
        }
        @media (max-width: 420px) {
            .card { width: 40px; height: 56px; font-size: 0.75em; padding: 2px 3px; }
            .card-pair { width: 48px; height: 64px; }
            .card-pair .card.defense-card { left: 12px; top: 9px; }
            #bot-zone { flex-basis: 55px; }
            #player-zone { flex-basis: 70px; }
            #center-zone { min-height: 90px; gap: 8px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="menu">
        <h1>♠ Дурак ♥</h1>
        <label><input type="radio" name="mode" value="podkid" checked> Подкидной</label>
        <label><input type="radio" name="mode" value="perevod"> Переводной</label>
        <button id="startBtn">Начать игру</button>
        <div class="info">Офлайн‑версия. Вы играете против компьютера.</div>
    </div>

    <div id="table">
        <div id="bot-zone" class="zone">
            <span class="turn-indicator" id="botTurnIndicator" style="display:none;">🤖 ходит</span>
        </div>
        <div id="center-zone">
            <div id="pairs-container" style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; width:100%;"></div>
            <div id="deck-area">
                <div class="card back" id="deckCard"></div>
                <div id="trump-info">♠</div>
            </div>
            <div id="table-count"></div>
        </div>
        <div id="player-zone" class="zone">
            <span class="turn-indicator" id="playerTurnIndicator" style="display:none;">👤 ваш ход</span>
        </div>
    </div>

    <div id="status">Нажмите «Начать игру»</div>
    <div id="controls">
        <button id="btnPass" disabled>Отбой</button>
        <button id="btnTake" disabled>Взять</button>
        <button id="btnAdd" disabled>Подкинуть</button>
        <button id="btnHint" class="hint" disabled>Подсказка</button>
        <button id="btnNewGame" class="secondary">Новая игра</button>
    </div>
</div>

<script>
    // ================== КЛАСС КАРТЫ ==================
    class Card {
        constructor(suit, rank) {
            this.suit = suit; this.rank = rank; this.id = suit + rank;
        }
        get name() {
            const names = { 6:'6',7:'7',8:'8',9:'9',10:'10',11:'В',12:'Д',13:'К',14:'Т' };
            return names[this.rank] || this.rank;
        }
        get isRed() { return this.suit === '♥' || this.suit === '♦'; }
        get suitSymbol() { return this.suit; }
        beats(other, trumpSuit) {
            if (this.suit === trumpSuit && other.suit !== trumpSuit) return true;
            if (this.suit !== trumpSuit && other.suit === trumpSuit) return false;
            if (this.suit === other.suit) return this.rank > other.rank;
            return false;
        }
        // Сравнение для сортировки по силе (чем больше ранг, тем сильнее)
        static compareStrength(a, b) {
            return a.rank - b.rank;
        }
    }

    // ================== КОЛОДА ==================
    function createDeck() {
        const suits = ['♠','♥','♦','♣'];
        const ranks = [6,7,8,9,10,11,12,13,14];
        const deck = [];
        for (let s of suits) for (let r of ranks) deck.push(new Card(s, r));
        return deck;
    }
    function shuffle(arr) { for (let i=arr.length-1; i>0; i--) { let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

    // ================== ИГРА ==================
    class Game {
        constructor(mode) {
            this.mode = mode;
            this.deck = [];
            this.trumpSuit = null;
            this.trumpCard = null;
            this.playerHand = [];
            this.botHand = [];
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.isPlayerTurn = true;
            this.isAttacking = true;
            this.gameOver = false;
            this.waitingForPlayerAction = false;
            this.waitingForPass = false;
            this.cardsToDeal = 6;
            this.maxTableCards = 6;
            this.suggestedCards = [];
        }

        init() {
            this.deck = shuffle(createDeck());
            this.trumpCard = this.deck.pop();
            this.trumpSuit = this.trumpCard.suit;
            this.playerHand = [];
            this.botHand = [];
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.gameOver = false;
            this.isPlayerTurn = true;
            this.isAttacking = true;
            this.suggestedCards = [];
            this.waitingForPass = false;
            this.waitingForPlayerAction = false;

            for (let i=0; i<this.cardsToDeal; i++) {
                if (this.deck.length===0) break;
                this.playerHand.push(this.deck.pop());
                if (this.deck.length===0) break;
                this.botHand.push(this.deck.pop());
            }
            this.sortHand(this.playerHand);
            this.sortHand(this.botHand);
            this.updateUI();
            this.checkGameOver();
            if (!this.gameOver) {
                this.startPlayerTurn();
            }
        }

        sortHand(hand) {
            const order = { '♠':0, '♥':1, '♦':2, '♣':3 };
            hand.sort((a,b) => {
                if (a.suit === this.trumpSuit && b.suit !== this.trumpSuit) return -1;
                if (a.suit !== this.trumpSuit && b.suit === this.trumpSuit) return 1;
                if (a.suit !== b.suit) return order[a.suit] - order[b.suit];
                return b.rank - a.rank;
            });
        }

        // ----- Вспомогательные -----
        getPossibleAttackCards() {
            if (this.attackingCards.length === 0) return this.playerHand.slice();
            const ranks = this.attackingCards.map(c => c.rank);
            return this.playerHand.filter(c => ranks.includes(c.rank));
        }
        getPossibleDefendCards() {
            const idx = this.defendingCards.length;
            if (idx >= this.attackingCards.length) return [];
            const target = this.attackingCards[idx];
            return this.playerHand.filter(c => c.beats(target, this.trumpSuit));
        }
        getPossibleCards() {
            if (this.isAttacking && this.isPlayerTurn) return this.getPossibleAttackCards();
            if (!this.isAttacking && this.isPlayerTurn) return this.getPossibleDefendCards();
            return [];
        }
        canPlayerAdd() {
            if (this.attackingCards.length === 0) return false;
            const ranks = this.attackingCards.map(c => c.rank);
            return this.playerHand.some(c => ranks.includes(c.rank));
        }

        // ----- Лучший выбор для бота -----
        // Выбор карты для атаки: самая слабая не-козырь, иначе самый слабый козырь
        botChooseAttackCard() {
            const nonTrump = this.botHand.filter(c => c.suit !== this.trumpSuit);
            if (nonTrump.length > 0) {
                nonTrump.sort((a,b) => a.rank - b.rank);
                return nonTrump[0];
            } else {
                this.botHand.sort((a,b) => a.rank - b.rank);
                return this.botHand[0];
            }
        }

        // Выбор защитной карты для бота: самая слабая карта, которая бьёт атакующую (стараясь не использовать козыри, если есть альтернатива)
        botChooseDefenseCard(attackCard) {
            // Собираем все карты, которые могут побить
            const candidates = this.botHand.filter(c => c.beats(attackCard, this.trumpSuit));
            if (candidates.length === 0) return null;
            // Сортируем по силе (возрастание) – выбираем самую слабую
            candidates.sort((a,b) => a.rank - b.rank);
            // Если есть не-козырь, предпочитаем его (даже если он слабее козыря)
            const nonTrump = candidates.filter(c => c.suit !== this.trumpSuit);
            if (nonTrump.length > 0) {
                // берём самую слабую не-козырь
                nonTrump.sort((a,b) => a.rank - b.rank);
                return nonTrump[0];
            } else {
                // все кандидаты - козыри, берём самый слабый
                return candidates[0];
            }
        }

        // ----- Начало хода игрока -----
        startPlayerTurn() {
            this.isPlayerTurn = true;
            this.isAttacking = true;
            this.waitingForPlayerAction = true;
            this.waitingForPass = false;
            this.enableControls(false, false, false, true);
            this.setStatus('Ваш ход. Выберите карту для атаки.');
            this.highlightPossibleCards();
            this.updateUI();
        }

        // ----- Ход игрока (атака) -----
        playerAttack(card) {
            if (!this.waitingForPlayerAction || !this.isAttacking || !this.isPlayerTurn || this.gameOver) return false;
            if (this.tableCards.length >= this.maxTableCards) {
                this.setStatus('На столе уже ' + this.maxTableCards + ' карт, больше нельзя.');
                return false;
            }
            const idx = this.playerHand.indexOf(card);
            if (idx === -1) return false;
            if (this.tableCards.length > 0) {
                const ranks = this.attackingCards.map(c => c.rank);
                if (!ranks.includes(card.rank)) {
                    this.setStatus('Можно подкинуть только карту того же достоинства.');
                    this.shakeCard(card);
                    return false;
                }
            }
            this.playerHand.splice(idx, 1);
            this.tableCards.push(card);
            this.attackingCards.push(card);
            this.suggestedCards = [];
            this.updateUI();

            const canAdd = this.canPlayerAdd() && this.tableCards.length < this.maxTableCards;
            if (canAdd) {
                this.waitingForPlayerAction = true;
                this.enableControls(true, false, true, true);
                this.setStatus('Подкиньте ещё или нажмите "Отбой".');
                this.highlightPossibleCards();
            } else {
                this.playerPassAttack();
            }
            return true;
        }

        playerPassAttack() {
            if (this.gameOver) return;
            this.waitingForPlayerAction = false;
            this.waitingForPass = false;
            this.enableControls(false, false, false, false);
            this.setStatus('Бот защищается...');
            this.botDefend();
        }

        // ----- Защита бота (улучшенная) -----
        botDefend() {
            if (this.gameOver) return;
            const attackCards = this.attackingCards;
            let defense = [];
            let usedIndices = [];
            let success = true;

            for (let atk of attackCards) {
                // Ищем самую слабую подходящую карту
                let bestCard = null;
                let bestIdx = -1;
                for (let i=0; i<this.botHand.length; i++) {
                    if (usedIndices.includes(i)) continue;
                    const candidate = this.botHand[i];
                    if (candidate.beats(atk, this.trumpSuit)) {
                        // Выбираем самую слабую (по рангу), и если есть не-козырь, предпочитаем его
                        if (!bestCard) {
                            bestCard = candidate;
                            bestIdx = i;
                        } else {
                            // Сравниваем: предпочитаем не-козырь, затем меньший ранг
                            const bestIsTrump = bestCard.suit === this.trumpSuit;
                            const candIsTrump = candidate.suit === this.trumpSuit;
                            if (bestIsTrump && !candIsTrump) {
                                bestCard = candidate;
                                bestIdx = i;
                            } else if (!bestIsTrump && candIsTrump) {
                                // оставляем текущий
                            } else {
                                // оба козыри или оба не-козыри, выбираем меньший ранг
                                if (candidate.rank < bestCard.rank) {
                                    bestCard = candidate;
                                    bestIdx = i;
                                }
                            }
                        }
                    }
                }
                if (bestCard && bestIdx !== -1) {
                    defense.push(bestCard);
                    usedIndices.push(bestIdx);
                } else {
                    success = false;
                    break;
                }
            }

            if (success) {
                // Бот отбился
                for (let card of defense) {
                    const idx = this.botHand.indexOf(card);
                    if (idx !== -1) this.botHand.splice(idx, 1);
                }
                this.tableCards.push(...defense);
                this.defendingCards.push(...defense);
                this.updateUI();
                this.clearTable();
                this.setStatus('Бот отбился!');
                this.finishTurn(false);
            } else {
                // Бот не может отбиться – берёт карты
                this.botHand.push(...this.tableCards);
                this.tableCards = [];
                this.attackingCards = [];
                this.defendingCards = [];
                this.updateUI();
                this.setStatus('Бот взял карты. Завершите ход, нажав "Отбой".');
                this.waitingForPlayerAction = false;
                this.waitingForPass = true;
                this.enableControls(true, false, false, false);
            }
        }

        // ----- Игрок нажимает "Отбой" после того, как бот взял карты -----
        playerPassAfterBotTake() {
            if (!this.waitingForPass || this.gameOver) return;
            this.waitingForPass = false;
            this.enableControls(false, false, false, false);
            this.setStatus('Ход завершён.');
            this.finishTurn(false);
        }

        // ----- Ход бота (улучшенный) -----
        botTurn() {
            if (this.gameOver) return;
            if (this.isPlayerTurn) return;
            if (this.botHand.length === 0) { this.checkGameOver(); return; }

            this.isAttacking = true;
            const card = this.botChooseAttackCard();
            if (!card) return;
            const idx = this.botHand.indexOf(card);
            if (idx === -1) return;
            this.botHand.splice(idx, 1);
            this.tableCards.push(card);
            this.attackingCards.push(card);
            this.updateUI();
            this.setStatus('Бот атакует картой ' + card.name + card.suit);

            // Игрок должен защищаться
            this.isPlayerTurn = true;
            this.isAttacking = false;
            this.waitingForPlayerAction = true;
            this.waitingForPass = false;
            this.enableControls(false, true, false, true);
            this.setStatus('Отбейтесь или нажмите "Взять".');
            this.highlightPossibleCards();
            this.updateUI();
        }

        // ----- Защита игрока -----
        playerDefend(card) {
            if (!this.waitingForPlayerAction || this.isAttacking || !this.isPlayerTurn || this.gameOver) return false;
            const attackCards = this.attackingCards;
            const idxDef = this.defendingCards.length;
            if (idxDef >= attackCards.length) {
                this.setStatus('Все карты уже отбиты.');
                return false;
            }
            const target = attackCards[idxDef];
            if (!card.beats(target, this.trumpSuit)) {
                this.setStatus('Эта карта не бьёт ' + target.name + target.suit);
                this.shakeCard(card);
                return false;
            }
            const idx = this.playerHand.indexOf(card);
            if (idx === -1) return false;
            this.playerHand.splice(idx, 1);
            this.defendingCards.push(card);
            this.tableCards.push(card);
            this.suggestedCards = [];
            this.updateUI();

            if (this.defendingCards.length === this.attackingCards.length) {
                this.clearTable();
                this.setStatus('Вы отбились!');
                this.finishTurn(true);
            } else {
                this.waitingForPlayerAction = true;
                this.enableControls(false, true, false, true);
                this.setStatus('Отбейте следующую карту или нажмите "Взять".');
                this.highlightPossibleCards();
                this.updateUI();
            }
            return true;
        }

        // ----- Игрок нажимает "Взять" -----
        playerTake() {
            if (!this.waitingForPlayerAction || this.isAttacking || !this.isPlayerTurn || this.gameOver) return;
            this.playerHand.push(...this.tableCards);
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.suggestedCards = [];
            this.updateUI();
            this.setStatus('Вы взяли карты.');
            this.finishTurn(true);
        }

        // ----- Завершение хода (общая) -----
        finishTurn(nextIsPlayer) {
            this.waitingForPlayerAction = false;
            this.waitingForPass = false;
            this.enableControls(false, false, false, false);

            this.dealCards();
            this.updateUI();
            this.checkGameOver();
            if (this.gameOver) return;

            this.isPlayerTurn = nextIsPlayer;
            this.isAttacking = true;
            if (this.isPlayerTurn) {
                this.startPlayerTurn();
            } else {
                this.botTurn();
            }
        }

        // ----- Добирание карт -----
        dealCards() {
            while (this.playerHand.length < 6 && this.deck.length > 0) {
                this.playerHand.push(this.deck.pop());
            }
            while (this.botHand.length < 6 && this.deck.length > 0) {
                this.botHand.push(this.deck.pop());
            }
            this.sortHand(this.playerHand);
            this.sortHand(this.botHand);
        }

        // ----- Очистка стола -----
        clearTable() {
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.suggestedCards = [];
            this.updateUI();
        }

        // ----- Проверка окончания игры -----
        checkGameOver() {
            if (this.deck.length === 0 && (this.playerHand.length === 0 || this.botHand.length === 0)) {
                this.gameOver = true;
                this.waitingForPlayerAction = false;
                this.waitingForPass = false;
                this.enableControls(false, false, false, false);
                if (this.playerHand.length === 0) this.setStatus('🎉 Вы выиграли!');
                else if (this.botHand.length === 0) this.setStatus('😞 Бот выиграл.');
                else this.setStatus('Ничья?');
                this.updateUI();
                return true;
            }
            return false;
        }

        // ----- UI -----
        setStatus(msg) { document.getElementById('status').textContent = msg; }
        enableControls(pass, take, add, hint) {
            document.getElementById('btnPass').disabled = !pass;
            document.getElementById('btnTake').disabled = !take;
            document.getElementById('btnAdd').disabled = !add;
            document.getElementById('btnHint').disabled = !hint;
        }

        highlightPossibleCards() {
            document.querySelectorAll('#player-zone .card.highlight, #player-zone .card.suggest').forEach(el => {
                el.classList.remove('highlight', 'suggest');
            });
            if (!this.waitingForPlayerAction) return;
            const possible = this.getPossibleCards();
            if (possible.length === 0) return;
            const cards = document.querySelectorAll('#player-zone .card');
            for (let el of cards) {
                const text = el.textContent.replace(/\s/g, '');
                for (let card of possible) {
                    if (text.includes(card.name) && text.includes(card.suitSymbol)) {
                        el.classList.add('highlight');
                        break;
                    }
                }
            }
        }

        shakeCard(card) {
            const cards = document.querySelectorAll('#player-zone .card');
            for (let el of cards) {
                const text = el.textContent.replace(/\s/g, '');
                if (text.includes(card.name) && text.includes(card.suitSymbol)) {
                    el.classList.add('shake');
                    setTimeout(() => el.classList.remove('shake'), 300);
                    break;
                }
            }
        }

        hint() {
            if (!this.waitingForPlayerAction && !this.waitingForPass) return;
            if (this.waitingForPass) {
                this.setStatus('Нажмите "Отбой" для завершения хода.');
                return;
            }
            const possible = this.getPossibleCards();
            if (possible.length === 0) {
                this.setStatus('Нет подходящих карт.');
                return;
            }
            const card = possible[0];
            this.suggestedCards = [card];
            this.updateUI();
            const cards = document.querySelectorAll('#player-zone .card');
            for (let el of cards) {
                const text = el.textContent.replace(/\s/g, '');
                if (text.includes(card.name) && text.includes(card.suitSymbol)) {
                    el.classList.add('suggest');
                    break;
                }
            }
            this.setStatus('Подсказка: сыграйте ' + card.name + card.suit);
        }

        // ----- Отрисовка -----
        updateUI() {
            this.renderPlayerHand();
            this.renderBotHand();
            this.renderTable();
            this.renderDeck();
            const botInd = document.getElementById('botTurnIndicator');
            const playerInd = document.getElementById('playerTurnIndicator');
            if (this.gameOver) {
                botInd.style.display = 'none';
                playerInd.style.display = 'none';
            } else if (this.isPlayerTurn) {
                botInd.style.display = 'none';
                playerInd.style.display = 'block';
            } else {
                botInd.style.display = 'block';
                playerInd.style.display = 'none';
            }
        }

        renderPlayerHand() {
            const zone = document.getElementById('player-zone');
            const indicator = zone.querySelector('.turn-indicator');
            zone.innerHTML = '';
            zone.appendChild(indicator);
            this.playerHand.forEach((card, idx) => {
                const el = this.createCardElement(card, false);
                el.dataset.index = idx;
                el.addEventListener('click', () => this.onCardClick(card));
                zone.appendChild(el);
            });
            if (this.suggestedCards.length > 0) {
                const cards = zone.querySelectorAll('.card');
                for (let el of cards) {
                    const text = el.textContent.replace(/\s/g, '');
                    for (let card of this.suggestedCards) {
                        if (text.includes(card.name) && text.includes(card.suitSymbol)) {
                            el.classList.add('suggest');
                            break;
                        }
                    }
                }
            }
        }

        renderBotHand() {
            const zone = document.getElementById('bot-zone');
            const indicator = zone.querySelector('.turn-indicator');
            zone.innerHTML = '';
            zone.appendChild(indicator);
            this.botHand.forEach((card) => {
                const el = this.createCardElement(card, true);
                zone.appendChild(el);
            });
            const count = document.createElement('div');
            count.style.cssText = 'color:#fff; font-weight:bold; background:rgba(0,0,0,0.5); padding:2px 12px; border-radius:20px; font-size:0.8em; margin-left:4px;';
            count.textContent = this.botHand.length + ' карт';
            zone.appendChild(count);
        }

        renderTable() {
            const container = document.getElementById('pairs-container');
            container.innerHTML = '';
            const pairs = [];
            for (let i=0; i<this.attackingCards.length; i++) {
                const atk = this.attackingCards[i];
                const def = (i < this.defendingCards.length) ? this.defendingCards[i] : null;
                pairs.push({ atk, def });
            }
            for (let pair of pairs) {
                const div = document.createElement('div');
                div.className = 'card-pair';
                const atkEl = this.createCardElement(pair.atk, false);
                atkEl.classList.add(pair.def ? 'attack-card' : 'attack-only');
                atkEl.style.pointerEvents = 'none';
                div.appendChild(atkEl);
                if (pair.def) {
                    const defEl = this.createCardElement(pair.def, false);
                    defEl.classList.add('defense-card');
                    defEl.style.pointerEvents = 'none';
                    div.appendChild(defEl);
                }
                container.appendChild(div);
            }
            document.getElementById('table-count').textContent = 'На столе: ' + this.tableCards.length + ' / ' + this.maxTableCards;
        }

        renderDeck() {
            const deckCard = document.getElementById('deckCard');
            if (this.deck.length > 0) {
                deckCard.style.display = 'flex';
                deckCard.textContent = this.deck.length;
            } else deckCard.style.display = 'none';
            document.getElementById('trump-info').textContent = 'Козырь: ' + this.trumpSuit;
        }

        createCardElement(card, hidden) {
            const div = document.createElement('div');
            div.className = 'card';
            if (hidden) { div.classList.add('back'); return div; }
            div.classList.add(card.isRed ? 'red' : 'black');
            if (card.suit === this.trumpSuit) div.classList.add('trump-card');
            const top = document.createElement('div'); top.className = 'top';
            top.innerHTML = `<span>${card.name}</span><span class="suit">${card.suitSymbol}</span>`;
            const bottom = document.createElement('div'); bottom.className = 'bottom';
            bottom.innerHTML = `<span>${card.name}</span><span class="suit">${card.suitSymbol}</span>`;
            div.appendChild(top); div.appendChild(bottom);
            return div;
        }

        onCardClick(card) {
            if (this.gameOver) return;
            if (this.waitingForPass) {
                this.setStatus('Сначала нажмите "Отбой".');
                return;
            }
            if (!this.waitingForPlayerAction) {
                this.setStatus('Сейчас не ваш ход.');
                return;
            }
            this.suggestedCards = [];
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerAttack(card);
            } else if (!this.isAttacking && this.isPlayerTurn) {
                this.playerDefend(card);
            } else {
                this.setStatus('Нельзя сыграть этой картой сейчас.');
            }
        }

        onPass() {
            if (this.waitingForPass) {
                this.playerPassAfterBotTake();
                return;
            }
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerPassAttack();
            } else {
                this.setStatus('Сейчас нельзя нажать "Отбой".');
            }
        }

        onTake() {
            if (!this.isAttacking && this.isPlayerTurn) {
                this.playerTake();
            } else {
                this.setStatus('Сейчас нельзя взять карты.');
            }
        }

        onAdd() {
            if (this.isAttacking && this.isPlayerTurn) {
                if (this.canPlayerAdd() && this.tableCards.length < this.maxTableCards) {
                    this.setStatus('Выберите карту для подкидывания.');
                    this.highlightPossibleCards();
                } else {
                    this.setStatus('Нет карт для подкидывания или стол полон.');
                }
            } else {
                this.setStatus('Сейчас нельзя подкинуть.');
            }
        }

        onHint() {
            this.hint();
        }
    }

    // ================== ЗАПУСК ==================
    let game = null;
    function startGame(mode) {
        game = new Game(mode);
        game.init();
        document.getElementById('menu').style.display = 'none';
        document.getElementById('btnPass').onclick = () => { if (game) game.onPass(); };
        document.getElementById('btnTake').onclick = () => { if (game) game.onTake(); };
        document.getElementById('btnAdd').onclick = () => { if (game) game.onAdd(); };
        document.getElementById('btnHint').onclick = () => { if (game) game.onHint(); };
        document.getElementById('btnNewGame').onclick = () => {
            document.getElementById('menu').style.display = 'flex';
            game = null;
        };
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        startGame(mode);
    });
    document.getElementById('menu').style.display = 'flex';
</script>
