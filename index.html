<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс (Full)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ ========== */
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width); margin: 0 auto; padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width 0.3s;
        }
        @media (min-width:768px) { :root { --container-width:720px; } .ads-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; } .ad-card { width:100%; } }
        @media (min-width:1024px) { :root { --container-width:1200px; } .ads-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width:420px) {
            .header-title { font-size:15px; } .header-logo { width:30px; height:30px; border-radius:6px; }
            .nav-item .nav-icon { font-size:18px; } .nav-item { font-size:9px; padding:2px 4px; min-height:36px; }
            .ad-card-img { width:60px; height:80px; } .ad-card-title { font-size:13px; } .ad-card-price { font-size:14px; }
            .card { padding:10px; } .modal { padding:14px; max-width:98%; } .category-grid { grid-template-columns:repeat(2,1fr); }
            .grid-tiles { grid-template-columns:repeat(2,1fr); } .btn { padding:8px 14px; font-size:12px; min-height:36px; }
            .form-group input, .form-group select, .form-group textarea { padding:8px 10px; font-size:13px; }
        }
        @media (min-width:1200px) { .container { padding-left:20px; padding-right:20px; } .ads-grid { gap:16px; } .ad-card-img { width:100px; height:130px; } }
        @media (max-width:360px) {
            .header-title { font-size:13px; } .nav-item .nav-icon { font-size:16px; } .nav-item { font-size:8px; min-height:32px; }
            .ad-card-img { width:50px; height:66px; } .ad-card-title { font-size:12px; } .badge { font-size:8px; padding:1px 6px; }
        }
        /* Хедер */
        .header { position:fixed; top:0; left:0; right:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:8px 12px; height:var(--header-height); gap:8px; transition:background 0.3s, border-color 0.3s; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
        .header-logo { width:36px; height:36px; border-radius:8px; overflow:hidden; flex-shrink:0; cursor:pointer; transition:transform 0.2s; }
        .header-logo:active { transform:scale(0.9); }
        .header-logo img { width:100%; height:100%; object-fit:cover; }
        .header-title { font-weight:800; font-size:18px; color:var(--text); white-space:nowrap; flex-shrink:0; }
        .header-search { flex:1; min-width:0; cursor:pointer; }
        .header-search input { width:100%; padding:8px 12px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; outline:none; transition:border-color 0.3s, background 0.3s, color 0.3s; pointer-events:none; }
        .theme-toggle { background:none; border:none; font-size:22px; cursor:pointer; padding:4px; border-radius:8px; transition:transform 0.2s; flex-shrink:0; }
        .theme-toggle:active { transform:scale(0.9); }
        /* Навигация */
        .nav-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; background:var(--bg); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; height:var(--nav-height); padding-bottom:env(safe-area-inset-bottom); transition:background 0.3s, border-color 0.3s; }
        .nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; padding:4px 8px; border-radius:8px; transition:color 0.3s, transform 0.2s, background 0.2s; flex:1; max-width:80px; min-height:var(--btn-min-height); }
        .nav-item .nav-icon { font-size:22px; line-height:1; }
        .nav-item.active { color:var(--accent); background:rgba(0,91,255,0.08); }
        .nav-item:active { transform:scale(0.92); }
        /* Секции */
        .section { display:none; opacity:0; transform:translateY(10px); transition:opacity var(--transition-speed) ease, transform var(--transition-speed) ease; }
        .section.active { display:block; opacity:1; transform:translateY(0); }
        /* Карточки */
        .card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); padding:12px; margin-bottom:10px; transition:background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s, opacity 0.3s; cursor:pointer; }
        .card:active { transform:scale(0.98); }
        .card.inactive-card { background:rgba(128,128,128,0.12) !important; opacity:0.75; }
        [data-theme="dark"] .card.inactive-card { background:rgba(255,255,255,0.04) !important; opacity:0.65; }
        .ad-card { display:flex; gap:10px; align-items:flex-start; }
        .ad-card-img { width:80px; height:100px; border-radius:8px; object-fit:cover; background:var(--border); flex-shrink:0; }
        .ad-card-info { flex:1; min-width:0; }
        .ad-card-title { font-weight:700; font-size:15px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ad-card-price { font-weight:800; font-size:16px; color:var(--accent); margin-bottom:4px; }
        .ad-card-badges { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
        .badge { padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700; background:var(--border); color:var(--text); white-space:nowrap; }
        .badge.sell { background:#34c759; color:#fff; }
        .badge.buy { background:#ff9500; color:#fff; }
        .badge.server { background:var(--gold); color:#1a1a1a; }
        .badge.category { background:var(--accent); color:#fff; }
        .badge.status-pending { background:#ffcc00; color:#1a1a1a; }
        .badge.status-deleted { background:#ff3b30; color:#fff; }
        .badge.status-approved { background:#34c759; color:#fff; }
        .badge.active { background:var(--accent); color:#fff; }
        .ad-card-author { font-size:11px; color:var(--muted); }
        .countdown-timer { font-size:11px; color:var(--muted); margin-top:2px; }
        /* Кнопки */
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 18px; border-radius:var(--radius); border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; transition:transform 0.2s, opacity 0.2s, background 0.3s; touch-action:manipulation; min-height:var(--btn-min-height); }
        .btn:active { transform:scale(0.96); }
        .btn.secondary { background:var(--border); color:var(--text); }
        .btn.danger { background:#ff3b30; color:#fff; }
        .btn.gold { background:var(--gold); color:#1a1a1a; }
        .btn.success { background:#34c759; color:#fff; }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .btn.w-full { width:100%; }
        .btn svg { width:18px; height:18px; fill:currentColor; }
        /* Модалки */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; transition:opacity 0.25s ease; }
        .modal-overlay.show { opacity:1; }
        .modal { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:0 8px 30px rgba(0,0,0,0.2); width:100%; max-width:520px; max-height:85vh; overflow-y:auto; padding:20px; position:relative; transform:translateY(20px); transition:transform 0.25s ease, background 0.3s, border-color 0.3s; }
        .modal-overlay.show .modal { transform:translateY(0); }
        .modal-close { position:absolute; top:12px; right:12px; background:none; border:none; font-size:24px; cursor:pointer; color:var(--muted); padding:4px; line-height:1; z-index:5; transition:transform 0.2s; }
        .modal-close:active { transform:scale(0.9); }
        .modal-title { font-weight:800; font-size:18px; margin-bottom:16px; padding-right:30px; }
        /* Формы */
        .form-group { margin-bottom:14px; }
        .form-group label { display:block; font-weight:600; font-size:13px; margin-bottom:4px; color:var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 12px; border-radius:var(--radius); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; transition:border-color 0.3s, background 0.3s, color 0.3s; font-family:var(--font); }
        .form-group textarea { min-height:80px; resize:vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }
        /* Пустое состояние */
        .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-weight:500; }
        /* Туториал */
        .tutorial-overlay, .fullscreen-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; transition:background 0.3s; }
        .tutorial-slide { max-width:420px; width:100%; }
        .tutorial-slide h2 { font-weight:900; font-size:24px; margin-bottom:12px; }
        .tutorial-slide p { font-size:15px; color:var(--muted); line-height:1.6; margin-bottom:20px; }
        .tutorial-nav { display:flex; gap:10px; margin-top:15px; }
        /* Звёзды */
        .star-rating { display:flex; gap:4px; font-size:28px; cursor:pointer; }
        .star-rating span { color:var(--border); transition:color 0.2s, transform 0.2s; }
        .star-rating span.active { color:var(--gold); }
        .star-rating span:hover { transform:scale(1.2); }
        /* Отзывы */
        .review-item { border-bottom:1px solid var(--border); padding:10px 0; }
        .review-item:last-child { border-bottom:none; }
        /* Игра */
        .game-click-area { width:100%; max-width:250px; aspect-ratio:1; margin:0 auto 20px; cursor:pointer; border-radius:50%; overflow:hidden; border:4px solid var(--border); transition:transform 0.1s, border-color 0.3s; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
        .game-click-area:active { transform:scale(0.92); }
        .game-click-area img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
        /* Апгрейды */
        .upgrade-card { display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; background:var(--card); transition:background 0.3s, border-color 0.3s; }
        .upgrade-info { flex:1; }
        .upgrade-name { font-weight:700; font-size:14px; }
        .upgrade-cost { font-size:12px; color:var(--muted); }
        /* Прогресс-бар */
        .progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:6px 0; }
        .progress-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 0.3s; }
        /* Категории */
        .category-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
        .category-tile { padding:12px 8px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); text-align:center; cursor:pointer; font-weight:600; font-size:11px; transition:transform 0.2s, border-color 0.3s, background 0.3s; }
        .category-tile:active { transform:scale(0.95); }
        .category-tile .cat-icon { font-size:24px; display:block; margin-bottom:4px; }
        /* Поиск */
        .search-suggestion { padding:8px 12px; border-radius:8px; cursor:pointer; font-size:13px; transition:background 0.2s; }
        .search-suggestion:hover, .search-suggestion:active { background:var(--border); }
        /* Плитки */
        .grid-tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .grid-tile { padding:16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); text-align:center; cursor:pointer; font-weight:700; font-size:13px; transition:transform 0.2s, border-color 0.3s, background 0.3s; }
        .grid-tile:active { transform:scale(0.95); }
        .grid-tile .tile-icon { font-size:32px; display:block; margin-bottom:8px; }
        /* Галерея */
        .image-gallery { display:flex; overflow-x:auto; gap:8px; margin-bottom:12px; scroll-snap-type:x mandatory; }
        .image-gallery img { width:200px; height:150px; object-fit:cover; border-radius:8px; scroll-snap-align:start; flex-shrink:0; background:var(--border); cursor:pointer; transition:transform 0.2s; }
        .image-gallery img:active { transform:scale(0.96); }
        /* Утилиты */
        .hidden { display:none !important; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        .mt-8 { margin-top:8px; } .mt-12 { margin-top:12px; } .mb-8 { margin-bottom:8px; } .mb-12 { margin-bottom:12px; }
        .w-full { width:100%; } .gap-8 { gap:8px; } .gap-12 { gap:12px; } .text-center { text-align:center; }
        /* Авторизация */
        .auth-container { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .auth-box { width:100%; max-width:400px; background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:24px; box-shadow:var(--shadow); }
        .auth-tab { flex:1; padding:8px; background:none; border:none; cursor:pointer; font-weight:700; transition:color 0.2s, border-color 0.2s; }
        .auth-tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }
        .auth-tab:not(.active) { color:var(--muted); border-bottom:2px solid transparent; }
        /* Категории в хедере */
        #homeCategories { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
        #homeCategories::-webkit-scrollbar { display:none; }
        #homeCategories .badge { cursor:pointer; padding:6px 12px; flex-shrink:0; }
        #homeCategories .badge.active { background:var(--accent); color:#fff; }
        #homeCategories .badge:not(.active) { background:var(--border); color:var(--text); }
        /* Анимация загрузки */
        .loader { border:3px solid var(--border); border-top:3px solid var(--accent); border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; margin:20px auto; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--border); border-radius:4px; }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
        /* Toast */
        .toast-container { position:fixed; top:70px; right:12px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:320px; }
        .toast { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; box-shadow:var(--shadow); font-size:13px; font-weight:500; color:var(--text); animation:slideIn 0.3s ease; }
        .toast.success { border-left:4px solid #34c759; }
        .toast.error { border-left:4px solid #ff3b30; }
        .toast.info { border-left:4px solid var(--accent); }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        /* Прелоадер */
        #preloader { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:2000; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; transition:opacity 0.3s; }
        #preloader.hidden { opacity:0; pointer-events:none; }
        .loader-text { font-weight:600; color:var(--muted); }
        /* Оверлей для ссылок */
        .links-list { display:flex; flex-direction:column; gap:10px; }
        .link-item { display:flex; align-items:center; gap:10px; padding:12px; background:var(--bg); border-radius:var(--radius); border:1px solid var(--border); cursor:pointer; transition:transform 0.2s, background 0.2s; }
        .link-item:active { transform:scale(0.97); }
        .link-item .link-icon { font-size:24px; width:40px; text-align:center; }
        .link-item .link-label { flex:1; font-weight:600; }
        .link-item .link-value { color:var(--accent); font-size:13px; }
    </style>
</head>
<body>

    <!-- Прелоадер -->
    <div id="preloader">
        <div class="loader"></div>
        <div class="loader-text">Загрузка...</div>
    </div>

    <!-- ХЕДЕР -->
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" autocomplete="off" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <main class="container" id="mainContainer">

        <!-- ГЛАВНАЯ -->
        <section class="section active" id="section-home">
            <div id="serverSelector" style="margin-bottom:12px;">
                <button class="btn secondary w-full" id="serverSelectBtn">Выберите сервер: Все сервера</button>
            </div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>

        <!-- КОРЗИНА -->
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <!-- ОТПРАВКА -->
        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group"><label>Тип сделки</label><select id="sendType"><option value="sell">Продажа</option><option value="buy">Покупка</option></select></div>
                <div class="form-group"><label>Категория</label><select id="sendCategory"></select></div>
                <div class="form-group"><label>Название</label><input type="text" id="sendName" placeholder="Введите название"></div>
                <div class="form-group"><label>Цена</label><input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text"></div>
                <div class="form-group"><label>Описание</label><textarea id="sendDescription" placeholder="Подробное описание"></textarea></div>
                <div class="form-group"><label>Скриншоты (ссылки через запятую, до 20, необязательно)</label><input type="text" id="sendImages" placeholder="https://..."><div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div></div>
                <div class="form-group"><label>Сервер</label><select id="sendServer"></select></div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>

        <!-- АДМИН -->
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <!-- ВСЕ РАЗДЕЛЫ -->
        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <!-- НАВИГАЦИЯ -->
    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Все разделы</span></button>
    </nav>

    <!-- КОНТЕЙНЕРЫ -->
    <div id="modalContainer"></div>
    <div id="tutorialContainer"></div>
    <div id="authContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInputHandler(e) {

                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            async function loadHomeFeed(reset = true) {
                if (reset) feedPage = 0;
                const container = document.getElementById('homeFeed');
                if (reset) container.innerHTML = '<div class="loader"></div>';
                try {
                    let query = supabaseClient.from('ads')
                        .select('*')
                        .eq('status', 'approved')
                        .order('created_at', { ascending: false })
                        .range(feedPage * FEED_PAGE_SIZE, (feedPage + 1) * FEED_PAGE_SIZE - 1);

                    if (currentFilterServer) {
                        query = query.eq('server', currentFilterServer);
                    }

                    const { data, error } = await withTimeout(query, 8000);
                    if (error) throw error;
                    const newAds = data || [];
                    // Фильтруем истёкшие объявления
                    const validAds = newAds.filter(ad => !ad.expires_at || new Date(ad.expires_at) > new Date());
                    if (reset) homeAds = validAds;
                    else homeAds = [...homeAds, ...validAds];
                    renderHomeFeed();
                    feedPage++;
                } catch (e) {
                    console.warn('loadHomeFeed error', e);
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки. Проверьте интернет.</div>';
                }
            }

            function renderHomeFeed() {
                const container = document.getElementById('homeFeed');
                if (!homeAds.length) {
                    container.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>';
                    return;
                }
                let html = '';
                homeAds.forEach(ad => {
                    const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                    const imgSrc = firstImg || DEFAULT_AD_IMAGE;
                    const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                    const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                    // Таймер автоудаления
                    const expiresAt = ad.expires_at ? new Date(ad.expires_at) : null;
                    let countdownHtml = '';
                    if (expiresAt) {
                        const now = new Date();
                        const diff = expiresAt - now;
                        if (diff > 0) {
                            const totalSeconds = Math.floor(diff / 1000);
                            const hours = Math.floor(totalSeconds / 3600);
                            const minutes = Math.floor((totalSeconds % 3600) / 60);
                            const seconds = totalSeconds % 60;
                            countdownHtml = `<div class="countdown-timer">⏳ Удаление через: ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}</div>`;
                        } else {
                            countdownHtml = '<div class="countdown-timer">⚠️ Удалено</div>';
                        }
                    }
                    html += `
                        <div class="card ad-card" data-ad-id="${ad.id}">
                            <img class="ad-card-img" src="${imgSrc}" loading="lazy" onerror="this.src='${DEFAULT_AD_IMAGE}'" alt="">
                            <div class="ad-card-info">
                                <div class="ad-card-title">${ad.item_name || 'Без названия'}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)}</div>
                                <div class="ad-card-badges">
                                    ${modeBadge}
                                    <span class="badge server">${ad.server}</span>
                                    <span class="badge category">${catLabel}</span>
                                </div>
                                <div class="ad-card-author">Автор: ${ad.author_username || ad.author_id}</div>
                                ${countdownHtml}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                container.querySelectorAll('.ad-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.adId;
                        const ad = homeAds.find(a => a.id == id);
                        if (ad) openAdDetail(ad);
                    });
                });
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.className = 'btn secondary w-full mt-12';
                loadMoreBtn.textContent = 'Загрузить ещё';
                loadMoreBtn.addEventListener('click', () => loadHomeFeed(false));
                container.appendChild(loadMoreBtn);
            }

                    return;

                container.innerHTML = '<div class="loader"></div>';
                try {
                    const { data, error } = await withTimeout(
                        supabaseClient.from('ads').select('*').eq('author_id', currentAuthUser.id).order('created_at', { ascending: false }),
                        5000
                    );
                    if (error) throw error;
                    myAds = data || [];
                    if (!myAds.length) {
                        container.innerHTML = '<div class="empty-state">У вас пока нет объявлений</div>';
                        return;
                    }
                    let html = '';
                    myAds.forEach(ad => {
                        let statusBadge = '';
                        if (ad.status === 'pending') statusBadge = '<span class="badge status-pending">🟡 На модерации</span>';
                        else if (ad.status === 'deleted') statusBadge = '<span class="badge status-deleted">🔴 Удалено</span>';
                        else statusBadge = '<span class="badge status-approved">🟢 Висит</span>';
                        const cardClass = ad.status === 'deleted' ? 'card inactive-card' : 'card';
                        html += `
                            <div class="${cardClass}">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                        <div style="margin-top:4px;">${statusBadge}</div>
                                    </div>
                                    <div class="flex-between gap-8">
                                        <button class="btn danger" data-permanent-delete="${ad.id}">🗑 Удалить</button>
                                        ${ad.status === 'deleted' ? `<button class="btn gold" data-appeal-ad="${ad.id}">📨 Апелляция</button>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-permanent-delete]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            showConfirm('Удаление', 'Стереть объявление из базы навсегда?', async () => {
                                await supabaseClient.from('ads').delete().eq('id', btn.dataset.permanentDelete);
                                await supabaseClient.from('favorites').delete().eq('ad_id', btn.dataset.permanentDelete);
                                playSfx('click');
                                loadMyAds();
                            });
                        });
                    });
                    container.querySelectorAll('[data-appeal-ad]').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            appealAdId = btn.dataset.appealAd;
                            openAppealModal();
                        });
                    });
                } catch (e) {
                    console.warn('loadMyAds error', e);
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
                }
            }

            // =========================================================================
            // 16. АПЕЛЛЯЦИИ
            // =========================================================================
            let appealAdId = null;

            function openAppealModal() {
                if (!appealAdId) return;
                showModal(`
                    <h3 class="modal-title">📨 Апелляция</h3>
                    <div class="form-group"><label>Причина</label><select id="appealReason">${APPEAL_REASONS.map(r => `<option>${r}</option>`).join('')}</select></div>
                    <div class="form-group"><label>Доказательства (ссылки)</label><input type="text" id="appealEvidence" placeholder="https://..."></div>
                    <button class="btn w-full" id="appealSubmitBtn">Отправить</button>
                `);
                document.getElementById('appealSubmitBtn').addEventListener('click', async () => {
                    const reason = document.getElementById('appealReason').value;
                    const evidence = document.getElementById('appealEvidence').value.trim();
                    const linkCheck = checkLinksString(evidence);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await supabaseClient.from('appeals').insert({
                        ad_id: appealAdId,
                        author_id: currentAuthUser.id,
                        reason,
                        evidence,
                        status: 'pending',
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    showAlert('Успех', 'Апелляция отправлена');
                    document.getElementById('modalOverlay').remove();
                });
            }

            // =========================================================================
            // 17. АДМИН-ПАНЕЛЬ (одобрение с expires_at)
            // =========================================================================
            async function loadAdminPanel() {
                const container = document.getElementById('adminPanelContent');
                if (!isAdmin) { container.innerHTML = '<div class="empty-state">Нет доступа</div>'; return; }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const [pendingRes, appealsRes, reportsRes] = await Promise.all([
                        withTimeout(supabaseClient.from('ads').select('*').eq('status', 'pending').order('created_at', { ascending: false }), 5000),
                        withTimeout(supabaseClient.from('appeals').select('*').eq('status', 'pending').order('created_at', { ascending: false }), 5000),
                        withTimeout(supabaseClient.from('reports').select('*').eq('status', 'pending').order('created_at', { ascending: false }), 5000)
                    ]);
                    if (pendingRes.error) throw pendingRes.error;
                    if (appealsRes.error) throw appealsRes.error;
                    if (reportsRes.error) throw reportsRes.error;
                    pendingAds = pendingRes.data || [];
                    pendingAppeals = appealsRes.data || [];
                    pendingReports = reportsRes.data || [];

                    let html = '<h3>📋 Объявления на модерации</h3>';
                    if (!pendingAds.length) html += '<div class="empty-state">Нет объявлений</div>';
                    else pendingAds.forEach(ad => {
                        html += `
                            <div class="card">
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:12px;color:var(--muted);">${ad.server} • ${ad.author_username || ad.author_id} • ${formatPrice(ad.price)}</div>
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve="${ad.id}">✅ Одобрить</button>
                                    <button class="btn danger" data-reject="${ad.id}">❌ Отклонить</button>
                                    <button class="btn secondary" data-edit-ad="${ad.id}">✏️ Редактировать</button>
                                </div>
                            </div>
                        `;
                    });

                    html += '<h3 style="margin-top:20px;">📨 Апелляции</h3>';
                    if (!pendingAppeals.length) html += '<div class="empty-state">Нет апелляций</div>';
                    else pendingAppeals.forEach(appeal => {
                        html += `
                            <div class="card">
                                <div style="font-weight:700;">Объявление ID: ${appeal.ad_id}</div>
                                <div style="font-size:12px;color:var(--muted);">Автор: ${appeal.author_username || appeal.author_id}</div>
                                <div style="font-size:12px;color:var(--muted);">Причина: ${appeal.reason}</div>
                                ${appeal.evidence ? `<div style="font-size:11px;color:var(--accent);">Доказательства: ${appeal.evidence}</div>` : ''}
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve-appeal="${appeal.id}">✅ Одобрить</button>
                                    <button class="btn danger" data-reject-appeal="${appeal.id}">❌ Отклонить</button>
                                </div>
                            </div>
                        `;
                    });

                    html += '<h3 style="margin-top:20px;">🚨 Жалобы</h3>';
                    if (!pendingReports.length) html += '<div class="empty-state">Нет жалоб</div>';
                    else pendingReports.forEach(report => {
                        html += `
                            <div class="card">
                                <div style="font-weight:700;">Объявление ID: ${report.ad_id}</div>
                                <div style="font-size:12px;color:var(--muted);">От: ${report.reporter_username || report.reporter_id}</div>
                                <div style="font-size:12px;color:var(--muted);">Причина: ${report.reason}</div>
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve-report="${report.id}">✅ Принять</button>
                                    <button class="btn danger" data-reject-report="${report.id}">❌ Отклонить</button>
                                </div>
                            </div>
                        `;
                    });

                    if (isOwner) {
                        html += `
                            <h3 style="margin-top:20px;">👤 Управление пользователями</h3>
                            <div class="form-group"><input type="text" id="adminUsernameInput" placeholder="username или ID"></div>
                            <div class="flex-between gap-8 mb-8">
                                <button class="btn danger w-full" id="adminBanBtn">🔨 Забанить</button>
                                <button class="btn success w-full" id="adminUnbanBtn">🔓 Разбанить</button>
                            </div>
                            <div class="flex-between gap-8 mb-8">
                                <button class="btn w-full" id="adminMakeAdminBtn">👑 Сделать админом</button>
                                <button class="btn secondary w-full" id="adminRemoveAdminBtn">⬇️ Снять админа</button>
                            </div>
                            <button class="btn danger w-full mt-8" id="adminClearFeedBtn">🧹 Очистить ленту</button>
                        `;
                    }
                    container.innerHTML = html;
                    bindAdminEvents();
                } catch (e) {
                    console.warn('loadAdminPanel error', e);
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
                }
            }

            function bindAdminEvents() {
                document.querySelectorAll('[data-approve]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
                        await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', btn.dataset.approve);
                        playSfx('success');
                        loadAdminPanel();
                        loadHomeFeed();
                    });
                });
                document.querySelectorAll('[data-reject]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-edit-ad]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const ad = pendingAds.find(a => a.id == btn.dataset.editAd);
                        if (ad) openAdminEditModal(ad);
                    });
                });
                document.querySelectorAll('[data-approve-appeal]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const appeal = pendingAppeals.find(a => a.id == btn.dataset.approveAppeal);
                        if (appeal) {
                            const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
                            await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', appeal.ad_id);
                        }
                        await supabaseClient.from('appeals').update({ status: 'approved' }).eq('id', btn.dataset.approveAppeal);
                        playSfx('success');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-reject-appeal]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('appeals').update({ status: 'rejected' }).eq('id', btn.dataset.rejectAppeal);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-approve-report]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const report = pendingReports.find(r => r.id == btn.dataset.approveReport);
                        if (report) {
                            await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', report.ad_id);
                        }
                        await supabaseClient.from('reports').update({ status: 'approved' }).eq('id', btn.dataset.approveReport);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-reject-report]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('reports').update({ status: 'rejected' }).eq('id', btn.dataset.rejectReport);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });

                if (isOwner) {
                    const banBtn = document.getElementById('adminBanBtn');
                    const unbanBtn = document.getElementById('adminUnbanBtn');
                    const makeAdminBtn = document.getElementById('adminMakeAdminBtn');
                    const removeAdminBtn = document.getElementById('adminRemoveAdminBtn');
                    const clearFeedBtn = document.getElementById('adminClearFeedBtn');
                    if (banBtn) banBtn.addEventListener('click', () => adminUserAction('ban'));
                    if (unbanBtn) unbanBtn.addEventListener('click', () => adminUserAction('unban'));
                    if (makeAdminBtn) makeAdminBtn.addEventListener('click', () => adminUserAction('make_admin'));
                    if (removeAdminBtn) removeAdminBtn.addEventListener('click', () => adminUserAction('remove_admin'));
                    if (clearFeedBtn) {
                        clearFeedBtn.addEventListener('click', async () => {
                            showConfirm('Очистка', 'Удалить ВСЕ объявления из ленты?', async () => {
                                await supabaseClient.from('ads').delete().neq('id', 0);
                                await supabaseClient.from('favorites').delete().neq('id', 0);
                                playSfx('click');
                                loadAdminPanel();
                                loadHomeFeed();
                            });
                        });
                    }
                }
            }

            async function adminUserAction(action) {
                const target = document.getElementById('adminUsernameInput').value.trim();
                if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
                try {
                    let query = supabaseClient.from('app_users').select('*');
                    if (!isNaN(target)) query = query.eq('id', target);
                    else query = query.eq('username', target);
                    const { data: users, error } = await withTimeout(query, 5000);
                    if (error) throw error;
                    if (!users.length) { showAlert('Ошибка', 'Пользователь не найден'); return; }
                    const user = users[0];
                    let updates = {};
                    if (action === 'ban') updates.banned = true;
                    else if (action === 'unban') updates.banned = false;
                    else if (action === 'make_admin') updates.is_admin = true;
                    else if (action === 'remove_admin') updates.is_admin = false;
                    await supabaseClient.from('app_users').update(updates).eq('id', user.id);
                    playSfx('success');
                    showAlert('Успех', 'Действие выполнено');
                    loadAdminPanel();
                } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
            }

            function openAdminEditModal(ad) {
                showModal(`
                    <h3 class="modal-title">✏️ Редактирование</h3>
                    <div class="form-group"><label>Название</label><input type="text" id="editAdminName" value="${ad.item_name || ''}"></div>
                    <div class="form-group"><label>Цена</label><input type="text" id="editAdminPrice" value="${ad.price || ''}"></div>
                    <div class="form-group"><label>Описание</label><textarea id="editAdminDesc">${ad.description || ''}</textarea></div>
                    <div class="form-group"><label>Скриншоты</label><input type="text" id="editAdminImgs" value="${ad.images || ''}"></div>
                    <button class="btn w-full" id="editAdminSaveBtn">Сохранить и одобрить</button>
                `);
                document.getElementById('editAdminSaveBtn').addEventListener('click', async () => {
                    const item_name = document.getElementById('editAdminName').value.trim();
                    const price = parsePriceToNumber(document.getElementById('editAdminPrice').value);
                    const description = document.getElementById('editAdminDesc').value.trim();
                    const images = document.getElementById('editAdminImgs').value.trim();
                    const linkCheck = checkLinksString(images);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
                    await supabaseClient.from('ads').update({ item_name, price, description, images, status: 'approved', expires_at: expiresAt }).eq('id', ad.id);
                    playSfx('success');
                    document.getElementById('modalOverlay').remove();
                    loadAdminPanel();
                    loadHomeFeed();
                });
            }

            // =========================================================================
            // 18. ДЕТАЛИ ОБЪЯВЛЕНИЯ
            // =========================================================================
            async function openAdDetail(ad) {
                const images = ad.images ? ad.images.split(',').map(s => s.trim()).filter(s => s) : [];
                const galleryHtml = images.length ?
                    '<div class="image-gallery">' + images.map(img => `<img src="${img}" loading="lazy" onerror="this.style.display='none'">`).join('') + '</div>' : '';
                const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';

                let statusHtml = '';
                if (ad.status === 'pending') {
                    statusHtml = '<div class="empty-state">⏳ Объявление на модерации</div>';
                } else if (ad.status === 'deleted') {
                    statusHtml = '<div class="empty-state">🗑️ Объявление удалено</div>';
                    if (ad.author_id === currentAuthUser.id) {
                        statusHtml += '<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Подать апелляцию</button>';
                    }
                } else {
                    statusHtml = `
                        <button class="btn w-full mb-8" id="detailContactBtn">💬 Написать</button>
                        <button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 Корзина</button>
                        <button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ Отзывы</button>
                        ${ad.author_id === currentAuthUser.id ? '<button class="btn danger w-full" id="detailDeleteBtn">🗑 Удалить</button>' : ''}
                        <button class="btn secondary w-full mt-8" id="detailReportBtn">🚨 Пожаловаться</button>
                    `;
                }

                const isFav = await checkIfInCart(ad.id);

                showModal(`
                    <h3 class="modal-title">${ad.item_name}</h3>
                    <div class="ad-card-badges mb-8">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span></div>
                    ${galleryHtml}
                    <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px;">${formatPrice(ad.price)}</div>
                    <p style="color:var(--muted);margin-bottom:12px;">${ad.description || 'Нет описания'}</p>
                    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Автор: <span style="color:var(--text);cursor:pointer;" id="detailAuthorLink">${ad.author_username || ad.author_id}</span></div>
                    ${statusHtml}
                    <div id="detailReviewsSection"></div>
                    <h4 style="margin:16px 0 8px;">📌 Похожие объявления</h4>
                    <div id="detailSimilarAds"></div>
                `);

                const overlay = document.getElementById('modalOverlay');

                if (ad.status === 'approved') {
                    document.getElementById('detailContactBtn').addEventListener('click', () => {
                        const contact = ad.author_username || ad.author_id;
                        window.open(`https://t.me/${contact}`, '_blank');
                    });
                    const cartBtn = document.getElementById('detailCartToggleBtn');
                    cartBtn.textContent = isFav ? '🛒 Убрать из корзины' : '🛒 В корзину';
                    cartBtn.addEventListener('click', async () => {
                        if (isFav) {
                            await supabaseClient.from('favorites').delete().eq('user_id', currentAuthUser.id).eq('ad_id', ad.id);
                            cartBtn.textContent = '🛒 В корзину';
                        } else {
                            await supabaseClient.from('favorites').insert({ user_id: currentAuthUser.id, ad_id: ad.id });
                            cartBtn.textContent = '🛒 Убрать из корзины';
                        }
                        playSfx('click');
                        loadCart();
                    });
                    document.getElementById('detailReviewsBtn').addEventListener('click', () => openReviewsModal(ad.id));
                    if (ad.author_id === currentAuthUser.id) {
                        document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
                            showConfirm('Удаление', 'Удалить объявление?', async () => {
                                await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', ad.id);
                                playSfx('click');
                                overlay.remove();
                                loadHomeFeed();
                            });
                        });
                    }
                    document.getElementById('detailReportBtn').addEventListener('click', () => {
                        showModal(`
                            <h3 class="modal-title">🚨 Пожаловаться</h3>
                            <div class="form-group"><label>Причина</label><textarea id="reportReason" placeholder="Опишите причину жалобы"></textarea></div>
                            <button class="btn w-full" id="reportSubmitBtn">Отправить жалобу</button>
                        `);
                        document.getElementById('reportSubmitBtn').addEventListener('click', async () => {
                            const reason = document.getElementById('reportReason').value.trim();
                            if (!reason) { showAlert('Ошибка', 'Введите причину'); return; }
                            await supabaseClient.from('reports').insert({
                                ad_id: ad.id,
                                reporter_id: currentAuthUser.id,
                                reporter_username: currentAuthUser.username,
                                reason,
                                status: 'pending',
                                created_at: new Date().toISOString()
                            });
                            playSfx('success');
                            showAlert('Успех', 'Жалоба отправлена');
                            document.getElementById('modalOverlay').remove();
                        });
                    });
                }
                if (ad.status === 'deleted' && ad.author_id === currentAuthUser.id) {
                    const appealBtn = document.getElementById('detailAppealBtn');
                    if (appealBtn) appealBtn.addEventListener('click', () => { appealAdId = ad.id; openAppealModal(); });
                }
                document.getElementById('detailAuthorLink').addEventListener('click', () => openProfileModal(ad.author_id));
                loadReviews(ad.id);
                loadSimilarAds(ad.category, ad.id);
            }

            async function checkIfInCart(adId) {
                if (!currentAuthUser) return false;
                const { data, error } = await supabaseClient
                    .from('favorites')
                    .select('*')
                    .eq('user_id', currentAuthUser.id)
                    .eq('ad_id', adId)
                    .maybeSingle();
                if (error) return false;
                return !!data;
            }

            // =========================================================================
            // 19. ОТЗЫВЫ
            // =========================================================================
            async function loadReviews(adId) {
                const container = document.getElementById('detailReviewsSection');
                if (!container) return;
                try {
                    const { data: reviews, error } = await withTimeout(
                        supabaseClient.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false }),
                        5000
                    );
                    if (error) throw error;
                    const reviewsData = reviews || [];
                    if (!reviewsData.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">⭐ Отзывов пока нет</p>';
                        return;
                    }
                    const avg = reviewsData.reduce((s, r) => s + r.stars, 0) / reviewsData.length;
                    let html = `<div style="font-size:20px;font-weight:800;margin-bottom:8px;">⭐ ${avg.toFixed(1)} (${reviewsData.length})</div>`;
                    html += '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>';
                    reviewsData.forEach(r => {
                        const canEdit = r.author_id === currentAuthUser.id && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                        html += `
                            <div class="review-item">
                                <div style="font-weight:600;">${r.author_username || r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
                                <div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
                                <p style="font-size:13px;margin:4px 0;">${r.text || ''}</p>
                                ${r.media_links ? `<div style="font-size:11px;color:var(--accent);">${r.media_links}</div>` : ''}
                                ${canEdit ? `<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-delete-review="${r.id}">🗑</button></div>` : ''}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-edit-review]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const rev = reviewsData.find(r => r.id == btn.dataset.editReview);
                            if (rev) openEditReviewModal(rev);
                        });
                    });
                    container.querySelectorAll('[data-delete-review]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('reviews').delete().eq('id', btn.dataset.deleteReview);
                            playSfx('click');
                            loadReviews(adId);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:var(--muted);">⚠️ Не удалось загрузить отзывы</p>';
                }
            }

            async function loadSimilarAds(category, currentAdId) {
                const container = document.getElementById('detailSimilarAds');
                if (!container) return;
                try {
                    const { data } = await withTimeout(

            async function loadGameState() {
                if (!currentAuthUser) return;
                if (barygaStateLoaded) return;
                const { data, error } = await withTimeout(
                    supabaseClient.from('baryga').select('*').eq('user_id', currentAuthUser.id).maybeSingle(),
                    5000
                );
                if (error) console.warn('loadGameState error', error);
                if (data) {
                    gameState = {
                        money: data.money || 0,
                        clickPower: data.click_power || 1,
                        clickCost: data.click_cost || 50,
                        autoIncome: data.auto_income || 0,
                        autoCost: data.auto_cost || 200,
                        proCost: data.pro_cost || 800,
                        shopCost: data.shop_cost || 3000,
                        eliteCost: data.elite_cost || 10000,
                        oilCost: data.oil_cost || 35000,
                        cryptoCost: data.crypto_cost || 150000,
                        scrapCost: data.scrap_cost || 500,
                        last_seen: data.last_seen || new Date().toISOString()
                    };
                    const lastSeen = new Date(gameState.last_seen).getTime();
                    const now = Date.now();
                    const diffSec = Math.min((now - lastSeen) / 1000, 3600);
                    if (diffSec > 0 && gameState.autoIncome > 0) {
                        gameState.money += gameState.autoIncome * diffSec;
                        gameState.last_seen = new Date().toISOString();
                        saveGameState();
                    }
                } else {
                    gameState = { ...gameState, user_id: currentAuthUser.id, last_seen: new Date().toISOString() };
                    await supabaseClient.from('baryga').insert(gameState);
                }
                barygaStateLoaded = true;
            }

            function openBarygaGame() {
                loadGameState().then(() => {
                    showModal(`
                        <h3 class="modal-title">🎮 Игра «Барыга»</h3>
                        <div style="text-align:center;font-size:24px;font-weight:900;margin-bottom:8px;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div>
                        <div class="game-click-area" id="gameClickArea">
                            <img src="https://i.postimg.cc/3RnGkVNw/4827782b1f3adf82a5db028d6ed0e8a7.jpg" alt="Клик">
                        </div>
                        <div style="font-size:12px;color:var(--muted);text-align:center;" id="gameStatsDisplay">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div>
                        <div class="mt-12" id="gameUpgradesContainer"></div>
                        <div class="mt-8 flex-between gap-8">
                            <button class="btn secondary" id="gameResetBtn">🔄 Сброс</button>
                            <button class="btn danger" id="gameSaveBtn">💾 Сохранить</button>
                        </div>
                    `);

                    const clickArea = document.getElementById('gameClickArea');
                    const upgradesContainer = document.getElementById('gameUpgradesContainer');
                    upgradesContainer.innerHTML = renderUpgrades();

                    let lastAutoIncomeUpdate = Date.now();
                    function gameLoop() {
                        if (!document.getElementById('gameClickArea')) return;
                        const now = Date.now();
                        if (now - lastAutoIncomeUpdate >= 1000) {
                            if (gameState.autoIncome > 0) {
                                gameState.money += gameState.autoIncome;
                                gameState.last_seen = new Date().toISOString();
                                updateGameUIFast();
                                saveGameStateDebounced();
                            }
                            lastAutoIncomeUpdate = now;
                        }
                        requestAnimationFrame(gameLoop);
                    }
                    requestAnimationFrame(gameLoop);

                    clickArea.addEventListener('click', () => {
                        gameState.money += gameState.clickPower;
                        updateGameUIFast();
                        playSfx('click');
                        saveGameStateDebounced();
                        clickArea.style.transform = 'scale(0.92)';
                        setTimeout(() => clickArea.style.transform = '', 80);
                    });

                    upgradesContainer.addEventListener('click', (e) => {
                        const btn = e.target.closest('[data-upgrade]');
                        if (!btn) return;
                        const idx = parseInt(btn.dataset.upgrade);
                        const upgrade = getUpgradesList()[idx];
                        if (gameState.money >= upgrade.cost) {
                            gameState.money -= upgrade.cost;
                            upgrade.action();
                            updateGameUIFast();
                            saveGameStateDebounced();
                            playSfx('buy');
                        }
                    });

                    document.getElementById('gameResetBtn').addEventListener('click', () => {
                        showConfirm('Сброс', 'Сбросить прогресс игры?', async () => {
                            gameState = { money: 0, clickPower: 1, clickCost: 50, autoIncome: 0, autoCost: 200, proCost: 800, shopCost: 3000, eliteCost: 10000, oilCost: 35000, cryptoCost: 150000, scrapCost: 500, last_seen: new Date().toISOString() };
                            await supabaseClient.from('baryga').update(gameState).eq('user_id', currentAuthUser.id);
                            updateGameUIFast();
                            upgradesContainer.innerHTML = renderUpgrades();
                            playSfx('click');
                        });
                    });

                    document.getElementById('gameSaveBtn').addEventListener('click', () => {
                        saveGameState();
                        showToast('Сохранено', 'success');
                    });
                });
            }

            function getUpgradesList() {
                return [
                    { name: 'Клик +1', cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                    { name: 'Про +20/сек', cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } },
                    { name: 'Элита: клик +10', cost: gameState.eliteCost, action: () => { gameState.clickPower += 10; gameState.eliteCost *= 2; } },
                    { name: 'Нефть +200/сек', cost: gameState.oilCost, action: () => { gameState.autoIncome += 200; gameState.oilCost *= 2; } },
                    { name: 'Крипта +1000/сек', cost: gameState.cryptoCost, action: () => { gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } },
                    { name: 'Скупка лома +500/сек', cost: gameState.scrapCost, action: () => { gameState.autoIncome += 500; gameState.scrapCost *= 2; } }
                ];
            }

            function renderUpgrades() {
                return getUpgradesList().map((u, i) => `
                    <div class="upgrade-card">
                        <div class="upgrade-info"><div class="upgrade-name">${u.name}</div><div class="upgrade-cost" data-cost-idx="${i}">💰 ${formatPrice(u.cost)}</div></div>
                        <button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button>
                    </div>
                `).join('');
            }

            function updateGameUIFast() {
                const moneyEl = document.getElementById('gameMoneyDisplay');
                if (moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money);
                const statsEl = document.getElementById('gameStatsDisplay');
                if (statsEl) statsEl.textContent = `Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек`;
                const upgrades = getUpgradesList();
                upgrades.forEach((u, i) => {
                    const btn = document.querySelector(`[data-upgrade="${i}"]`);
                    const costEl = document.querySelector(`[data-cost-idx="${i}"]`);
                    if (btn && costEl) {
                        costEl.textContent = '💰 ' + formatPrice(u.cost);
                        if (gameState.money < u.cost) btn.setAttribute('disabled', 'true');
                        else btn.removeAttribute('disabled');
                    }
                });
            }

            function saveGameStateDebounced() {
                if (saveGameTimeout) clearTimeout(saveGameTimeout);
                saveGameTimeout = setTimeout(saveGameState, 1000);
            }

            async function saveGameState() {
                if (!currentAuthUser) return;
                try {
                    const { data } = await supabaseClient.from('baryga').select('id').eq('user_id', currentAuthUser.id).single();
                    if (data) {
                        await supabaseClient.from('baryga').update({
                            money: gameState.money,
                            click_power: gameState.clickPower,
                            click_cost: gameState.clickCost,
                            auto_income: gameState.autoIncome,
                            auto_cost: gameState.autoCost,
                            pro_cost: gameState.proCost,
                            shop_cost: gameState.shopCost,
                            elite_cost: gameState.eliteCost,
                            oil_cost: gameState.oilCost,
                            crypto_cost: gameState.cryptoCost,
                            scrap_cost: gameState.scrapCost,
                            last_seen: new Date().toISOString()
                        }).eq('id', data.id);
                    } else {
                        await supabaseClient.from('baryga').insert({ ...gameState, user_id: currentAuthUser.id });
                    }
                } catch (e) { console.warn('saveGameState error', e); }
            }

            function openSearchModal() {

                    <div id="searchHistory"></div>
                    <div id="searchResults"></div>
                `);
                const input = document.getElementById('searchInput');
                setTimeout(() => input.focus(), 100);
                const suggestions = document.getElementById('searchSuggestions');
                const results = document.getElementById('searchResults');
                const history = document.getElementById('searchHistory');

                function renderHistory() {
                    if (!searchHistory.length) { history.innerHTML = ''; return; }
                    history.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📜 История:</div>' +
                        searchHistory.map(h => `<span class="badge" style="cursor:pointer;margin:2px;" data-hist="${h}">${h}</span>`).join('');
                    history.querySelectorAll('[data-hist]').forEach(el => {
                        el.addEventListener('click', () => { input.value = el.dataset.hist; input.dispatchEvent(new Event('input')); });
                    });
                }
                renderHistory();

                input.addEventListener('input', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) { suggestions.innerHTML = ''; results.innerHTML = ''; return; }
                    const { data, error } = await withTimeout(
                        supabaseClient.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(5),
                        5000
                    );
                    if (error) return;
                    const items = data || [];
                    suggestions.innerHTML = items.map(ad => `<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`).join('');
                    suggestions.querySelectorAll('[data-sug]').forEach(el => {
                        el.addEventListener('click', () => {
                            const ad = items.find(a => a.id == el.dataset.sug);
                            if (ad) {
                                saveSearchQuery(q);
                                document.getElementById('modalOverlay').remove();
                                openAdDetail(ad);
                            }
                        });
                    });
                });

                document.getElementById('searchItemBtn').addEventListener('click', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) return;
                    saveSearchQuery(q);
                    const { data, error } = await withTimeout(
                        supabaseClient.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`),
                        5000
                    );
                    if (error) return;
                    const items = data || [];
                    if (!items.length) { results.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
                    results.innerHTML = items.map(ad => `
                        <div class="card" data-res-id="${ad.id}">
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                        </div>
                    `).join('');
                    results.querySelectorAll('[data-res-id]').forEach(card => {
                        card.addEventListener('click', () => {
                            const ad = items.find(a => a.id == card.dataset.resId);
                            if (ad) { document.getElementById('modalOverlay').remove(); openAdDetail(ad); }
                        });
                    });
                });

                document.getElementById('searchProfileBtn').addEventListener('click', () => {
                    const q = input.value.trim();
                    if (q) openProfileModal(q);
                });
            }

            async function openProfileModal(authorIdOrUsername) {
                let userId = authorIdOrUsername;
                if (typeof authorIdOrUsername === 'string' && authorIdOrUsername.startsWith('@')) {
                    const username = authorIdOrUsername.substring(1);
                    const { data } = await supabaseClient.from('app_users').select('id').eq('username', username).maybeSingle();
                    if (data) userId = data.id;
                    else userId = null;
                }
                showModal(`<h3 class="modal-title">👤 Профиль: ${authorIdOrUsername}</h3><div id="profileAdsList"><div class="loader"></div></div>`);
                if (!userId) {
                    document.getElementById('profileAdsList').innerHTML = '<div class="empty-state">Пользователь не найден</div>';
                    return;
                }
                try {
                    const { data } = await withTimeout(
                        supabaseClient.from('ads').select('*').eq('status', 'approved').eq('author_id', userId).order('created_at', { ascending: false }),
                        5000
                    );
                    const ads = data || [];
                    const { count: totalCount } = await supabaseClient.from('ads').select('*', { count: 'exact', head: true }).eq('author_id', userId);
                    const { data: reviews } = await supabaseClient.from('reviews').select('stars').eq('ad_id', userId);
                    const avgRating = reviews && reviews.length ? (reviews.reduce((s, r) => s + r.stars, 0) / reviews.length).toFixed(1) : '—';
                    const container = document.getElementById('profileAdsList');
                    let html = `<div style="margin-bottom:16px;"><strong>Объявлений:</strong> ${totalCount || 0} • <strong>Средняя оценка:</strong> ⭐${avgRating}</div>`;
                    if (!ads.length) {
                        html += '<div class="empty-state">Нет активных объявлений</div>';
                    } else {
                        html += ads.map(ad => `
                            <div class="card" data-prof-ad="${ad.id}">
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                            </div>
                        `).join('');
                    }
                    container.innerHTML = html;
                    container.querySelectorAll('[data-prof-ad]').forEach(card => {
                        card.addEventListener('click', () => {
                            const ad = ads.find(a => a.id == card.dataset.profAd);
