<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Улучшенная синхронизация</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============ CSS ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ ============ */
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width var(--transition);
            will-change: transform;
        }
        @media (min-width: 768px) {
            :root { --container-width: 720px; }
            .ads-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .ad-card { width: 100%; }
        }
        @media (min-width: 1024px) {
            :root { --container-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }
        /* Шапка */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            height: var(--header-height);
            gap: 8px;
            transition: background var(--transition), border-color var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            will-change: transform;
        }
        .header-logo {
            width: 36px; height: 36px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform var(--transition);
        }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title {
            font-weight: 800;
            font-size: 18px;
            color: var(--text);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-search { flex: 1; min-width: 0; }
        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition), background var(--transition), color var(--transition);
        }
        .header-search input::placeholder { color: var(--muted); }
        .header-search input:focus { border-color: var(--accent); }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: transform var(--transition);
            flex-shrink: 0;
        }
        .theme-toggle:active { transform: scale(0.9); }
        /* Навигация */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background var(--transition), border-color var(--transition);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: color var(--transition), transform var(--transition), background var(--transition);
            flex: 1;
            max-width: 80px;
            min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active {
            color: var(--accent);
            background: rgba(0, 91, 255, 0.08);
        }
        .nav-item:active { transform: scale(0.92); }
        /* Секции */
        .section {
            display: none;
            animation: fadeIn 0.25s ease;
            contain: content;
        }
        .section.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Карточки */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px;
            margin-bottom: 10px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform 0.15s;
            cursor: pointer;
            will-change: transform;
        }
        .card:active { transform: scale(0.98); }
        .ad-card {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .ad-card-img {
            width: 80px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ad-card-price {
            font-weight: 800;
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .ad-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: var(--border);
            color: var(--text);
            white-space: nowrap;
        }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }
        .ad-card-author {
            font-size: 11px;
            color: var(--muted);
        }
        /* Кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform var(--transition), opacity var(--transition), background var(--transition);
            touch-action: manipulation;
            min-height: var(--btn-min-height);
            will-change: transform;
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
            padding: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            animation: slideUp 0.3s ease;
            transition: background var(--transition), border-color var(--transition);
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 12px; right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            line-height: 1;
            z-index: 5;
            transition: transform var(--transition);
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-title {
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 16px;
            padding-right: 30px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition), background var(--transition), color var(--transition);
            font-family: var(--font);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { border-color: var(--accent); }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-weight: 500;
        }
        /* Туториал */
        .tutorial-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: background var(--transition);
        }
        .tutorial-slide { max-width: 420px; width: 100%; }
        .tutorial-slide h2 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .tutorial-slide p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            text-align: center;
            transition: background var(--transition);
        }
        /* Звёзды */
        .star-rating {
            display: flex;
            gap: 4px;
            font-size: 28px;
            cursor: pointer;
        }
        .star-rating span { color: var(--border); transition: color var(--transition), transform var(--transition); }
        .star-rating span.active { color: var(--gold); }
        .star-rating span:hover { transform: scale(1.2); }
        .review-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .review-item:last-child { border-bottom: none; }
        /* Игра */
        .game-click-area {
            width: 100%;
            max-width: 250px;
            aspect-ratio: 1;
            margin: 0 auto 20px;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--border);
            transition: transform 0.1s, border-color var(--transition);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            will-change: transform;
        }
        .game-click-area:active { transform: scale(0.92); }
        .game-click-area img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .upgrade-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: var(--card);
            transition: background var(--transition), border-color var(--transition);
        }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: 700; font-size: 14px; }
        .upgrade-cost { font-size: 12px; color: var(--muted); }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
        /* Категории */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .category-tile {
            padding: 12px 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: transform var(--transition), border-color var(--transition), background var(--transition);
        }
        .category-tile:active { transform: scale(0.95); }
        .category-tile .cat-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        /* Поиск */
        .search-suggestion { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: background var(--transition); }
        .search-suggestion:hover, .search-suggestion:active { background: var(--border); }
        /* Сетки */
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile {
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: transform var(--transition), border-color var(--transition), background var(--transition);
        }
        .grid-tile:active { transform: scale(0.95); }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        /* Галерея */
        .image-gallery {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }
        .image-gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            scroll-snap-align: start;
            flex-shrink: 0;
            background: var(--border);
        }
        /* Админка */
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .admin-table th, .admin-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
        .admin-table th { font-weight: 700; color: var(--muted); }
        /* Прочее */
        @media (max-width: 480px) {
            .modal { padding: 16px; }
            .grid-tiles { grid-template-columns: repeat(2, 1fr); }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .text-muted { color: var(--muted); }
        .text-accent { color: var(--accent); }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }
        .w-full { width: 100%; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .text-center { text-align: center; }
        .relative { position: relative; }
        .overflow-hidden { overflow: hidden; }
    </style>
</head>
<body>
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search">
            <input type="text" id="globalSearchInput" placeholder="🔍 Поиск товаров" autocomplete="off">
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>
    <main class="container" id="mainContainer">
        <!-- Секции -->
        <section class="section active" id="section-home">
            <div id="homeFeed" class="ads-grid"></div>
        </section>
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType">
                        <option value="sell">Продажа</option>
                        <option value="buy">Покупка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую, до 20, необязательно)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                    <div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div>
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить на модерацию</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>
    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-section="cart">
            <span class="nav-icon">🛒</span>
            <span>Корзина</span>
        </button>
        <button class="nav-item" data-section="send">
            <span class="nav-icon">➕</span>
            <span>Отправка</span>
        </button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin">
            <span class="nav-icon">🛡️</span>
            <span>Админ</span>
        </button>
        <button class="nav-item" data-section="all">
            <span class="nav-icon">☰</span>
            <span>Все разделы</span>
        </button>
    </nav>
    <div id="modalContainer"></div>

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return base;
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInput(input) {
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

            async function loadAdminReports() {
                const container = document.getElementById('adminReportsList');
                if (!container) return;
                try {
                    const { data, error } = await withTimeout(
                        supabase.from('reports').select('*').eq('status', 'pending').order('created_at', { ascending: false })
                    );
                    if (error) throw error;
                    const reports = data || [];
                    if (!reports.length) {
                        container.innerHTML = '<div class="empty-state">Жалоб нет</div>';
                        return;
                    }
                    container.innerHTML = reports.map(report => `
                        <div class="card">
                            <div style="font-size:12px;color:var(--muted);">Объявление ID: ${report.ad_id} • Автор жалобы: @${escapeHtml(report.reporter_username)}</div>
                            <div>Причина: ${escapeHtml(report.reason)}</div>
                            <div class="flex-between gap-8 mt-8">
                                <button class="btn success" data-resolve-report="${report.id}" style="background:#34c759;">Решено</button>
                                <button class="btn danger" data-dismiss-report="${report.id}">Отклонить</button>
                            </div>
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-resolve-report]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('reports').update({ status: 'resolved' }).eq('id', btn.dataset.resolveReport));
                            playSfx('success'); loadAdminReports();
                        });
                    });
                    container.querySelectorAll('[data-dismiss-report]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('reports').update({ status: 'dismissed' }).eq('id', btn.dataset.dismissReport));
                            playSfx('click'); loadAdminReports();
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки жалоб</div>';
                }
            }

            async function adminUserAction(action) {
                const username = document.getElementById('adminUsernameInput').value.trim().replace('@', '');
                if (!username) { showAlert('Ошибка', 'Введите username'); return; }
                try {
                    const { data: user, error } = await withTimeout(
                        supabase.from('users').select('*').eq('username', username).maybeSingle()
                    );
                    if (error) throw error;
                    if (!user) { showAlert('Ошибка', 'Пользователь не найден'); return; }
                    let updates = {};
                    if (action === 'ban') updates.banned = true;
                    else if (action === 'unban') updates.banned = false;
                    else if (action === 'make_admin') updates.is_admin = true;
                    else if (action === 'remove_admin') updates.is_admin = false;
                    await withTimeout(supabase.from('users').update(updates).eq('id', user.id));
                    playSfx('success'); showAlert('Успех', 'Действие выполнено'); loadAdminPanel();
                } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
            }

                    { icon: '📦', label: 'Мои объявления', action: () => switchSection('send') },

                    { icon: '📩', label: 'Менеджер', action: openManagerModal },
                    { icon: '💬', label: 'Переписки', action: openChatsModal },

            // ===== КАТАЛОГ =====

                overlay.querySelectorAll('.category-tile').forEach(tile => {
                    tile.addEventListener('click', () => {

                        switchSection('home');

            // ===== ДЕТАЛИ ОБЪЯВЛЕНИЯ =====
            async function openAdDetail(ad) {
                let galleryHtml = '';
                const images = ad.images ? ad.images.split(',').map(s => s.trim()).filter(s => s) : [];
                if (images.length) {
                    galleryHtml = '<div class="image-gallery">' + images.map(img => `<img src="${img}" loading="lazy" onerror="this.style.display='none'">`).join('') + '</div>';
                }
                const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                let statusHtml = '';
                if (ad.status === 'pending') statusHtml = '<div class="empty-state">Объявление находится на модерации</div>';
                else if (ad.status === 'deleted') {
                    statusHtml = '<div class="empty-state">Объявление удалено</div>';
                    if (ad.author_id === currentUser.id.toString()) {
                        statusHtml += '<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Апелляция</button>';
                    }
                } else {
                    statusHtml = `
                        <button class="btn w-full mb-8" id="detailContactBtn">💬 Написать</button>
                        <button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 Корзина</button>
                        <button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ Отзывы</button>
                        <button class="btn secondary w-full mb-8" id="detailReportBtn">🚩 Пожаловаться</button>
                        ${ad.author_id === currentUser.id.toString() ? '<button class="btn danger w-full" id="detailDeleteBtn">🗑 Удалить объявление</button>' : ''}
                    `;
                }
                const isFav = await checkIfInCart(ad.id);
                showModal(`
                    <h3 class="modal-title">${escapeHtml(ad.item_name)}</h3>
                    <div class="ad-card-badges mb-8">${modeBadge}<span class="badge server">${escapeHtml(ad.server)}</span><span class="badge category">${escapeHtml(catLabel)}</span></div>
                    ${galleryHtml}
                    <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px;">${formatPrice(ad.price)}</div>
                    <p style="color:var(--muted);margin-bottom:12px;">${escapeHtml(ad.description || 'Нет описания')}</p>
                    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Автор: <span style="color:var(--text);cursor:pointer;" id="detailAuthorLink">@${escapeHtml(ad.author_username || ad.author_id)}</span></div>
                    ${statusHtml}
                    <div id="detailReviewsSection"></div>
                    <h4 style="margin:16px 0 8px;">Похожие объявления</h4>
                    <div id="detailSimilarAds"></div>
                `);
                const overlay = document.getElementById('modalOverlay');
                if (ad.status === 'approved') {
                    document.getElementById('detailContactBtn').addEventListener('click', () => {
                        window.open(`https://t.me/${ad.author_username || ad.author_id}`, '_blank');
                    });
                    const cartBtn = document.getElementById('detailCartToggleBtn');
                    cartBtn.textContent = isFav ? '🛒 Убрать из корзины' : '🛒 В корзину';
                    cartBtn.addEventListener('click', async () => {
                        if (isFav) {
                            await withTimeout(supabase.from('favorites').delete().eq('user_id', currentUser.id.toString()).eq('ad_id', ad.id));
                            cartBtn.textContent = '🛒 В корзину';
                        } else {
                            await withTimeout(supabase.from('favorites').insert({ user_id: currentUser.id.toString(), ad_id: ad.id }));
                            cartBtn.textContent = '🛒 Убрать из корзины';
                        }
                        playSfx('click'); loadCart();
                    });
                    document.getElementById('detailReviewsBtn').addEventListener('click', () => openReviewsModal(ad.id));
                    document.getElementById('detailReportBtn').addEventListener('click', () => openReportModal(ad.id));
                    if (ad.author_id === currentUser.id.toString()) {
                        document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
                            showConfirm('Удаление', 'Удалить объявление?', async () => {
                                await withTimeout(supabase.from('ads').update({ status: 'deleted' }).eq('id', ad.id));
                                playSfx('click'); overlay.remove(); loadHomeFeed(true);
                            });
                        });
                    }
                }
                if (ad.status === 'deleted' && ad.author_id === currentUser.id.toString()) {
                    const appealBtn = document.getElementById('detailAppealBtn');
                    if (appealBtn) appealBtn.addEventListener('click', () => { appealAdId = ad.id; openAppealModal(); });
                }
                document.getElementById('detailAuthorLink').addEventListener('click', () => openProfileModal(ad.author_id, ad.author_username));
                loadReviews(ad.id);
                loadSimilarAds(ad.category, ad.id);
            }

            async function checkIfInCart(adId) {
                if (!supabase) return false;
                try {
                    const { data } = await withTimeout(
                        supabase.from('favorites').select('*').eq('user_id', currentUser.id.toString()).eq('ad_id', adId).maybeSingle()
                    );
                    return !!data;
                } catch (e) { return false; }
            }

            // ===== ОТЗЫВЫ =====
            async function loadReviews(adId) {
                const container = document.getElementById('detailReviewsSection');
                if (!container) return;
                try {
                    const { data: reviews, error } = await withTimeout(
                        supabase.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false })
                    );
                    if (error) throw error;
                    const reviewsData = reviews || [];
                    if (!reviewsData.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Отзывов пока нет</p>';
                        return;
                    }
                    const avg = reviewsData.reduce((s, r) => s + r.stars, 0) / reviewsData.length;
                    let html = `<div style="font-size:20px;font-weight:800;margin-bottom:8px;">⭐ ${avg.toFixed(1)} (${reviewsData.length})</div>`;
                    html += '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>';
                    reviewsData.forEach(r => {
                        const canEdit = r.author_id === currentUser.id.toString() && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                        html += `
                            <div class="review-item">
                                <div style="font-weight:600;">@${escapeHtml(r.author_username || r.author_id)} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
                                <div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
                                <p style="font-size:13px;margin:4px 0;">${escapeHtml(r.text || '')}</p>
                                ${r.media_links ? `<div style="font-size:11px;color:var(--accent);">${escapeHtml(r.media_links)}</div>` : ''}
                                ${canEdit ? `<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-delete-review="${r.id}">🗑</button></div>` : ''}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-edit-review]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const rev = reviewsData.find(r => r.id == btn.dataset.editReview);
                            if (rev) openEditReviewModal(rev);
                        });
                    });
                    container.querySelectorAll('[data-delete-review]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('reviews').delete().eq('id', btn.dataset.deleteReview));
                            playSfx('click'); loadReviews(adId);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:var(--muted);">Не удалось загрузить отзывы</p>';
                }
            }

            async function loadSimilarAds(category, currentAdId) {
                const container = document.getElementById('detailSimilarAds');
                if (!container) return;
                try {
                    const { data } = await withTimeout(
                        supabase.from('ads').select('*').eq('status', 'approved').eq('category', category).neq('id', currentAdId).limit(3).order('created_at', { ascending: false })
                    );
                    const similar = data || [];
                    if (!similar.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Похожих нет</p>';
                        return;
                    }
                    container.innerHTML = similar.map(ad => `
                        <div class="card" style="cursor:pointer;" data-sim="${ad.id}">
                            <span style="font-weight:700;">${escapeHtml(ad.item_name)}</span> • ${formatPrice(ad.price)}
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-sim]').forEach(el => {
                        el.addEventListener('click', () => {
                            const found = similar.find(a => a.id == el.dataset.sim);
                            if (found) {
                                const overlay = document.getElementById('modalOverlay');
                                if (overlay) overlay.remove();
                                openAdDetail(found);
                            }
                        });
                    });
                } catch (e) {}
            }

            function openReviewsModal(adId) {
                showModal(`
                    <h3 class="modal-title">⭐ Отзывы</h3>
                    <div class="form-group">
                        <label>Оценка</label>
                        <div class="star-rating" id="reviewStars">
                            ${[1,2,3,4,5].map(i => `<span data-star="${i}">☆</span>`).join('')}
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ссылки (до 20, через запятую)</label>
                        <input type="text" id="reviewMedia" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Текст отзыва</label>
                        <textarea id="reviewText" placeholder="Ваш отзыв"></textarea>
                    </div>
                    <button class="btn w-full" id="reviewSubmitBtn">Отправить отзыв</button>
                `);
                let selectedStars = 0;
                const starsContainer = document.getElementById('reviewStars');
                starsContainer.querySelectorAll('span').forEach(span => {
                    span.addEventListener('click', () => {
                        selectedStars = parseInt(span.dataset.star);
                        updateStars(starsContainer, selectedStars);
                    });
                });
                document.getElementById('reviewSubmitBtn').addEventListener('click', async () => {
                    if (!selectedStars) { showAlert('Ошибка', 'Выберите оценку'); return; }
                    const text = document.getElementById('reviewText').value.trim();
                    const media = document.getElementById('reviewMedia').value.trim();
                    const linkCheck = checkLinksString(media);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    try {
                        await withTimeout(supabase.from('reviews').insert({
                            ad_id: adId, author_id: currentUser.id.toString(),
                            author_username: currentUser.username || '',
                            stars: selectedStars, text: text, media_links: media,
                            created_at: new Date().toISOString()
                        }));
                        playSfx('success'); showAlert('Успех', 'Отзыв отправлен');
                        document.getElementById('modalOverlay').remove();
                        loadReviews(adId);
                    } catch (e) { showAlert('Ошибка', 'Не удалось отправить'); }
                });
            }

            function updateStars(container, selected) {
                container.querySelectorAll('span').forEach(span => {
                    span.textContent = parseInt(span.dataset.star) <= selected ? '★' : '☆';
                    span.classList.toggle('active', parseInt(span.dataset.star) <= selected);
                });
            }

            function openEditReviewModal(review) {
                showModal(`
                    <h3 class="modal-title">✏️ Редактировать отзыв</h3>
                    <div class="form-group">
                        <label>Оценка</label>
                        <div class="star-rating" id="editReviewStars">
                            ${[1,2,3,4,5].map(i => `<span data-star="${i}" class="${i <= review.stars ? 'active' : ''}">${i <= review.stars ? '★' : '☆'}</span>`).join('')}
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ссылки</label>
                        <input type="text" id="editReviewMedia" value="${escapeHtml(review.media_links || '')}">
                    </div>
                    <div class="form-group">
                        <label>Текст</label>
                        <textarea id="editReviewText">${escapeHtml(review.text || '')}</textarea>
                    </div>
                    <button class="btn w-full" id="editReviewSubmitBtn">Сохранить</button>
                `);
                let selectedStars = review.stars;
                const starsContainer = document.getElementById('editReviewStars');
                starsContainer.querySelectorAll('span').forEach(span => {
                    span.addEventListener('click', () => {
                        selectedStars = parseInt(span.dataset.star);
                        updateStars(starsContainer, selectedStars);
                    });
                });
                document.getElementById('editReviewSubmitBtn').addEventListener('click', async () => {
                    const text = document.getElementById('editReviewText').value.trim();
                    const media = document.getElementById('editReviewMedia').value.trim();
                    const linkCheck = checkLinksString(media);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await withTimeout(supabase.from('reviews').update({ stars: selectedStars, text, media_links: media }).eq('id', review.id));
                    playSfx('success'); document.getElementById('modalOverlay').remove();
                    loadReviews(review.ad_id);
                });
            }

            // ===== АПЕЛЛЯЦИИ =====
            function openAppealModal() {
                if (!appealAdId) return;
                showModal(`
                    <h3 class="modal-title">📨 Апелляция</h3>
                    <div class="form-group">
                        <label>Причина</label>
                        <select id="appealReason">${APPEAL_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
                    </div>
                    <div class="form-group">
                        <label>Доказательства (ссылки до 20)</label>
                        <input type="text" id="appealEvidence" placeholder="https://...">
                    </div>
                    <button class="btn w-full" id="appealSubmitBtn">Отправить</button>
                `);
                document.getElementById('appealSubmitBtn').addEventListener('click', async () => {
                    const reason = document.getElementById('appealReason').value;
                    const evidence = document.getElementById('appealEvidence').value.trim();
                    const linkCheck = checkLinksString(evidence);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    try {
                        await withTimeout(supabase.from('appeals').insert({
                            ad_id: appealAdId, author_id: currentUser.id.toString(),
                            author_username: currentUser.username || '',
                            reason: reason, evidence: evidence,
                            status: 'pending', created_at: new Date().toISOString()
                        }));
                        playSfx('success'); showAlert('Успех', 'Апелляция отправлена');
                        document.getElementById('modalOverlay').remove();
                    } catch (e) { showAlert('Ошибка', 'Не удалось отправить'); }
                });

            function renderUpgrades() {
                const upgrades = [
                    { name: 'Клик +1', cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                    { name: 'Про +20/сек', cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } },
                    { name: 'Элита: клик +10', cost: gameState.eliteCost, action: () => { gameState.clickPower += 10; gameState.eliteCost *= 2; gameState.elitePurchased = true; } },
                    { name: 'Нефть +200/сек', cost: gameState.oilCost, action: () => { gameState.autoIncome += 200; gameState.oilCost *= 2; } },
                    { name: 'Крипта +1000/сек', cost: gameState.cryptoCost, action: () => { gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } },
                    { name: 'Скупка лома +500/сек', cost: gameState.scrapCost, action: () => { gameState.autoIncome += 500; gameState.scrapCost *= 2; } }
                ];
                return upgrades.map((u, i) => `
                    <div class="upgrade-card">
                        <div class="upgrade-info">
                            <div class="upgrade-name">${u.name}</div>
                            <div class="upgrade-cost">💰 ${formatPrice(u.cost)}</div>
                        </div>
                        <button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button>
                    </div>
                `).join('');
            }

            function updateGameUI() {
                const moneyEl = document.getElementById('gameMoneyDisplay');
                if (moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money);
                const upgradesContainer = document.getElementById('gameUpgrades');
                if (upgradesContainer) {
                    upgradesContainer.innerHTML = renderUpgrades();
                    upgradesContainer.querySelectorAll('[data-upgrade]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const idx = parseInt(btn.dataset.upgrade);
                            const upgrades = [
                                { cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                                { cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                                { cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                                { cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } },
                                { cost: gameState.eliteCost, action: () => { gameState.clickPower += 10; gameState.eliteCost *= 2; gameState.elitePurchased = true; } },
                                { cost: gameState.oilCost, action: () => { gameState.autoIncome += 200; gameState.oilCost *= 2; } },
                                { cost: gameState.cryptoCost, action: () => { gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } },
                                { cost: gameState.scrapCost, action: () => { gameState.autoIncome += 500; gameState.scrapCost *= 2; } }
                            ];
                            const upgrade = upgrades[idx];
                            if (gameState.money >= upgrade.cost) {
                                gameState.money -= upgrade.cost;
                                upgrade.action();
                                updateGameUI();
                                saveGameState();
                                playSfx('buy');
                            }
                        });
                    });
                }
            }

            function openSearchModal() {
                showModal(`
                    <h3 class="modal-title">🔍 Поиск</h3>
                    <div class="form-group">

                    </div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="searchItemBtn">📦 Предмет</button>
                        <button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button>
                    </div>
                    <div id="searchSuggestions"></div>
                    <div id="searchHistory"></div>
                    <div id="searchResults"></div>
                `);
                const input = document.getElementById('searchInput');
                const suggestions = document.getElementById('searchSuggestions');
                const results = document.getElementById('searchResults');
                const history = document.getElementById('searchHistory');
                function renderHistory() {
                    if (!searchHistory.length) { history.innerHTML = ''; return; }
                    history.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">История:</div>' + searchHistory.map(h => `<span class="badge" style="cursor:pointer;margin:2px;" data-hist="${h}">${h}</span>`).join('');
                    history.querySelectorAll('[data-hist]').forEach(el => {
                        el.addEventListener('click', () => {
                            input.value = el.dataset.hist;
                            input.dispatchEvent(new Event('input'));
                        });
                    });
                }
                renderHistory();
                // Debounce для поиска
                let debounceTimer;
                input.addEventListener('input', () => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(async () => {
                        const q = input.value.trim().toLowerCase();
                        if (!q) { suggestions.innerHTML = ''; results.innerHTML = ''; return; }
                        try {
                            const { data } = await withTimeout(
                                supabase.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(5)
                            );
                            const items = data || [];
                            suggestions.innerHTML = items.map(ad => `<div class="search-suggestion" data-sug="${ad.id}">📦 ${escapeHtml(ad.item_name)} • ${formatPrice(ad.price)}</div>`).join('');
                            suggestions.querySelectorAll('[data-sug]').forEach(el => {
                                el.addEventListener('click', () => {
                                    const ad = items.find(a => a.id == el.dataset.sug);
                                    if (ad) { document.getElementById('modalOverlay').remove(); openAdDetail(ad); }
                                });
                            });
                        } catch (e) { suggestions.innerHTML = ''; }
                    }, 300);
                });
                document.getElementById('searchItemBtn').addEventListener('click', async () => {
                    const q = input.value.trim();
                    if (!q) return;
                    if (!searchHistory.includes(q)) {
                        searchHistory.unshift(q);
                        if (searchHistory.length > 10) searchHistory.pop();
                        localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
                        renderHistory();
                    }
                    try {
                        const { data } = await withTimeout(
                            supabase.from('ads').select('*').eq('status', 'approved').or(`item_name.ilike.%${q}%,description.ilike.%${q}%`).limit(20)
                        );
                        results.innerHTML = '<div style="font-weight:700;margin:8px 0;">Результаты:</div>' + (data && data.length ? data.map(ad => `<div class="card" style="cursor:pointer;" data-res="${ad.id}">${escapeHtml(ad.item_name)} • ${formatPrice(ad.price)}</div>`).join('') : '<div class="empty-state">Ничего не найдено</div>');
                        results.querySelectorAll('[data-res]').forEach(el => {
                            el.addEventListener('click', () => {
                                const ad = data.find(a => a.id == el.dataset.res);
                                if (ad) { document.getElementById('modalOverlay').remove(); openAdDetail(ad); }
                            });
                        });
                    } catch (e) {}
                });
                document.getElementById('searchProfileBtn').addEventListener('click', () => {
                    const username = input.value.trim().replace('@', '');
                    if (username) { document.getElementById('modalOverlay').remove(); openProfileModal(null, username); }
                });
            }

                    { title: 'Готовы?', text: 'Вы изучили все основные разделы! Нажмите «Начать», чтобы перейти к использованию.' }
                ];
                let currentSlide = 0;
                const overlay = document.createElement('div');
                overlay.className = 'tutorial-overlay';
                overlay.id = 'tutorialOverlay';
                let tutorialTimerDone = false;
                function renderSlide() {
                    const slide = slides[currentSlide];
                    const isLast = currentSlide === slides.length - 1;
                    const isFirst = currentSlide === 0;
                    const btnDisabled = isFirst && !tutorialTimerDone;
                    overlay.innerHTML = `
                        <div class="tutorial-slide">
                            <h2>${slide.title}</h2>
                            <p>${slide.text}</p>
                            ${isFirst && !tutorialTimerDone ? '<div style="font-size:20px;font-weight:900;color:var(--accent);margin-bottom:16px;" id="tutorialTimer">60</div>' : ''}

                                <button class="btn" id="tutorialNextBtn" ${btnDisabled ? 'disabled' : ''}>${isLast ? 'Начать' : 'Продолжить'}</button>

                        </div>
                    `;
                    document.body.appendChild(overlay);
                    if (isFirst && !tutorialTimerDone) {
                        let timer = 60;

                renderSlide();
            }

            // ===== REALTIME =====
            function setupRealtime() {
                if (!supabase) return;
                try {
                    realtimeChannel = supabase.channel('ads-changes')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'ads' }, () => {
                            if (currentSection === 'home') loadHomeFeed(true);
                            if (currentSection === 'send') loadMyAds();
                            if (currentSection === 'admin') loadAdminPanel();
                            if (currentSection === 'cart') loadCart();
                        })
                        .subscribe();
                } catch (e) {}
            }

            // ===== ОТПРАВКА ОБЪЯВЛЕНИЯ =====
            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!supabase) { showAlert('Ошибка', 'Нет подключения к базе'); return; }
                const now = new Date();
                const hour = now.getUTCHours() + 3;
                const isAdminUser = isAdmin || isOwner;
                if (!isAdminUser && (hour < 9 || hour >= 22)) {
                    showAlert('Ошибка', 'Отправка возможна только с 09:00 до 22:00 МСК');
                    return;
                }
                if (!isAdminUser && Date.now() - lastAdSubmitTime < 120000) {
                    showAlert('Ошибка', 'Кулдаун 2 минуты между объявлениями');
                    return;
                }
                const type = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const name = document.getElementById('sendName').value.trim();
                const priceStr = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const imagesStr = document.getElementById('sendImages').value.trim();
                const server = document.getElementById('sendServer').value;
                if (!name || !priceStr || !description) {
                    showAlert('Ошибка', 'Заполните обязательные поля (название, цена, описание)');
                    return;
                }
                const price = parsePriceToNumber(priceStr);
                if (price <= 0) { showAlert('Ошибка', 'Некорректная цена'); return; }
                const linkCheck = checkLinksString(imagesStr);
                if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                try {
                    await withTimeout(supabase.from('ads').insert({
                        mode: type, category: category, item_name: name, price: price,
                        description: description, images: linkCheck.links.join(','), server: server,
                        author_id: currentUser.id.toString(), author_username: currentUser.username || '',
                        status: 'pending', created_at: new Date().toISOString()
                    }));
                    lastAdSubmitTime = Date.now();
                    playSfx('success');
                    showAlert('Успех', 'Объявление отправлено на модерацию');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) { showAlert('Ошибка', 'Не удалось отправить'); }
            });

                        <label>Описание</label>
                        <textarea id="adminEditDescription">${escapeHtml(ad.description || '')}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Ссылки</label>

                    </div>
                    <div class="form-group">
                        <label>Сервер</label>

                    </div>
                    <button class="btn w-full" id="adminEditSaveBtn">Сохранить и одобрить</button>
                `);
                document.getElementById('adminEditSaveBtn').addEventListener('click', async () => {
                    const name = document.getElementById('adminEditName').value.trim();
                    const price = parsePriceToNumber(document.getElementById('adminEditPrice').value);
                    const description = document.getElementById('adminEditDescription').value.trim();
                    const images = document.getElementById('adminEditImages').value.trim();
                    const server = document.getElementById('adminEditServer').value;
                    const linkCheck = checkLinksString(images);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await withTimeout(supabase.from('ads').update({
                        item_name: name, price: price, description: description,
                        images: linkCheck.links.join(','), server: server, status: 'approved'
                    }).eq('id', ad.id));
                    playSfx('success');
                    document.getElementById('modalOverlay').remove();
                    loadAdminPanel(); loadHomeFeed(true);
                });
            }

            // ===== ИНИЦИАЛИЗАЦИЯ =====
            async function initApp() {
                applyTheme();
                setupBackgroundMusic();
                if (!currentUser.username) {
                    showNoUsernameScreen();
                    return;
                }
                await loadCurrentUserData();
                if (currentUserData && currentUserData.banned) {
                    showBanScreen();
                    return;
                }
                showTutorial();
                switchSection('home');
                setupRealtime();
                setupEventListeners();
                requestWakeLock();
            }

            function setupEventListeners() {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', () => switchSection(btn.dataset.section));
                });
                document.getElementById('themeToggleBtn').addEventListener('click', () => {
                    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                    saveTheme(); applyTheme(); playSfx('click');
                });
                document.getElementById('logoBtn').addEventListener('click', openLogoModal);
                document.getElementById('globalSearchInput').addEventListener('focus', () => {
                    document.getElementById('globalSearchInput').blur();
                    openSearchModal();
                });
                window.addEventListener('resize', () => {
                    if (currentSection === 'home') renderHomeFeed(true);
                });
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') requestWakeLock();
                });
                // Очистка интервала игры при закрытии модалки
                document.addEventListener('click', (e) => {
                    if (e.target.id === 'modalCloseBtn' && window.gameInterval) {
                        clearInterval(window.gameInterval);
                        delete window.gameInterval;
                    }
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }
        })();
    </script>
