<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona Online — Маркетплейс и Дурак</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ ========== */
        :root {
            --bg: #F9FAFB;
            --card: #FFFFFF;
            --border: #E5E7EB;
            --accent: #4F46E5;
            --accent-hover: #4338CA;
            --gold: #F59E0B;
            --text: #111827;
            --muted: #6B7280;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --radius: 16px;
            --radius-sm: 10px;
            --btn-min-height: 48px;
            --container-width: 480px;
            --nav-height: 64px;
            --header-height: 60px;
            --font: 'Inter', sans-serif;
            --transition: 0.2s ease;
            --base-font-size: 16px;
            --logo-light: url('https://i.postimg.cc/nV1HDjcb/1788346659518.jpg');
            --logo-dark: url('https://i.postimg.cc/zfWNX3c5/1788346752679.jpg');
        }
        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --border: #334155;
            --accent: #818CF8;
            --accent-hover: #6366F1;
            --gold: #FBBF24;
            --text: #F1F5F9;
            --muted: #94A3B8;
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        html { font-size: var(--base-font-size); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            font-size: clamp(0.875rem, 0.8rem + 0.5vw, 1rem);
        }
        .container {
            max-width: min(100% - 2rem, var(--container-width)); margin: 0 auto; padding: 0 1rem;
            padding-top: calc(var(--header-height) + 1rem);
            padding-bottom: calc(var(--nav-height) + 2rem);
            transition: max-width 0.3s;
        }
        @media (min-width: 768px) { :root { --container-width:720px; --base-font-size:17px; } .ads-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; } .ad-card { width:100%; } }
        @media (min-width: 1024px) { :root { --container-width:1200px; --base-font-size:18px; } .ads-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width: 420px) {
            :root { --base-font-size:15px; --btn-min-height:44px; --header-height:56px; --nav-height:60px; }
            .header-title { font-size: clamp(1rem, 4vw, 1.3rem); }
            .header-logo { width:32px; height:32px; border-radius:8px; }
            .nav-item .nav-icon { font-size:20px; }
            .nav-item { font-size: clamp(0.65rem, 2.5vw, 0.8rem); min-height:40px; }
            .ad-card-img { width:64px; height:84px; }
            .ad-card-title { font-size: clamp(0.8rem, 3vw, 1rem); }
            .ad-card-price { font-size: clamp(0.9rem, 3.5vw, 1.1rem); }
            .card { padding:0.8rem; }
            .modal { padding:1rem; max-width:100%; }
            .grid-tiles { grid-template-columns:repeat(2,1fr); gap:0.8rem; }
            .btn { padding:0.7rem 1rem; font-size:0.85rem; min-height:42px; }
            .form-group input, .form-group select, .form-group textarea { padding:0.7rem 0.9rem; font-size:0.9rem; }
        }
        @media (max-width: 360px) {
            :root { --base-font-size:14px; }
            .header-title { font-size: clamp(0.9rem, 4vw, 1.1rem); }
            .nav-item .nav-icon { font-size:18px; }
            .nav-item { font-size:0.7rem; min-height:36px; }
            .ad-card-img { width:54px; height:70px; }
            .ad-card-title { font-size:0.75rem; }
            .badge { font-size:0.65rem; padding:2px 8px; }
        }
        /* ========== HEADER ========== */
        .header { position:fixed; top:0; left:0; right:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0.6rem 1rem; height:var(--header-height); gap:0.6rem; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        .header-logo { width:36px; height:36px; border-radius:10px; overflow:hidden; flex-shrink:0; cursor:pointer; transition:transform 0.2s; }
        .header-logo img { width:100%; height:100%; object-fit:cover; display:block; }
        .header-title { font-weight:800; font-size:clamp(1rem, 4vw, 1.5rem); white-space:nowrap; letter-spacing:-0.02em; }
        .header-search { flex:1; min-width:0; cursor:pointer; }
        .header-search input { width:100%; padding:0.6rem 1rem; border-radius:50px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:0.9rem; outline:none; pointer-events:none; box-shadow:var(--shadow); }
        .theme-toggle { background:none; border:none; font-size:1.5rem; cursor:pointer; padding:0.2rem; border-radius:8px; flex-shrink:0; }
        /* ========== BOTTOM NAV ========== */
        .nav-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; background:var(--bg); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; height:var(--nav-height); padding-bottom:env(safe-area-inset-bottom); }
        .nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--muted); font-size:clamp(0.65rem, 2vw, 0.8rem); font-weight:600; cursor:pointer; padding:0.25rem 0.3rem; border-radius:12px; transition:color 0.2s, transform 0.1s; flex:1; max-width:80px; min-height:48px; }
        .nav-item .nav-icon { font-size:clamp(1.2rem, 5vw, 1.6rem); line-height:1; }
        .nav-item.active { color:var(--accent); background:rgba(79,70,229,0.08); }
        .nav-item:active { transform:scale(0.92); }
        /* ========== SECTIONS ========== */
        .section { display:none; opacity:0; transform:translateY(10px); transition:opacity 0.25s, transform 0.25s; }
        .section.active { display:block; opacity:1; transform:translateY(0); }
        /* ========== CARDS ========== */
        .card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); padding:0.9rem; margin-bottom:0.9rem; transition:background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s; cursor:pointer; }
        .card:active { transform:scale(0.98); }
        .card.inactive-card { opacity:0.7; background:rgba(128,128,128,0.06); }
        [data-theme="dark"] .card.inactive-card { background:rgba(255,255,255,0.03); }
        .ad-card { display:flex; gap:0.8rem; align-items:flex-start; }
        .ad-card-img { width:80px; height:100px; border-radius:12px; object-fit:cover; background:var(--border); flex-shrink:0; }
        .ad-card-info { flex:1; min-width:0; }
        .ad-card-title { font-weight:700; font-size:clamp(0.8rem, 2.5vw, 1rem); margin-bottom:0.2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ad-card-price { font-weight:800; font-size:clamp(0.9rem, 3vw, 1.2rem); color:var(--accent); margin-bottom:0.2rem; }
        .ad-card-badges { display:flex; flex-wrap:wrap; gap:0.25rem; margin-bottom:0.2rem; }
        .badge { padding:0.15rem 0.6rem; border-radius:20px; font-size:0.7rem; font-weight:700; background:var(--border); color:var(--text); white-space:nowrap; }
        .badge.sell { background:#10B981; color:#fff; }
        .badge.buy { background:#F97316; color:#fff; }
        .badge.server { background:var(--gold); color:#1a1a1a; }
        .badge.category { background:var(--accent); color:#fff; }
        .badge.status-pending { background:#FBBF24; color:#1a1a1a; }
        .badge.status-deleted { background:#EF4444; color:#fff; }
        .badge.status-approved { background:#10B981; color:#fff; }
        .ad-card-author { font-size:0.7rem; color:var(--muted); }
        .countdown-timer { font-size:0.7rem; color:var(--muted); margin-top:0.2rem; font-weight:500; }
        /* ========== BUTTONS ========== */
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.4rem; padding:0.7rem 1.1rem; border-radius:var(--radius-sm); border:none; background:var(--accent); color:#fff; font-weight:700; font-size:clamp(0.8rem, 2.5vw, 0.95rem); cursor:pointer; transition:background 0.2s, transform 0.1s, opacity 0.2s; touch-action:manipulation; min-height:var(--btn-min-height); }
        .btn:hover { background:var(--accent-hover); }
        .btn:active { transform:scale(0.97); }
        .btn.secondary { background:var(--border); color:var(--text); }
        .btn.danger { background:#EF4444; color:#fff; }
        .btn.gold { background:var(--gold); color:#1a1a1a; }
        .btn.success { background:#10B981; color:#fff; }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .btn.w-full { width:100%; }
        /* ========== MODAL ========== */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:1rem; opacity:0; transition:opacity 0.25s; backdrop-filter:blur(4px); }
        .modal-overlay.show { opacity:1; }
        .modal { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:85vh; overflow-y:auto; padding:1.5rem; position:relative; transform:translateY(20px); transition:transform 0.25s; }
        .modal-overlay.show .modal { transform:translateY(0); }
        .modal-close { position:absolute; top:0.7rem; right:0.7rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--muted); padding:0.2rem; line-height:1; z-index:5; }
        .modal-title { font-weight:800; font-size:clamp(1rem, 3vw, 1.4rem); margin-bottom:1rem; padding-right:2rem; letter-spacing:-0.02em; }
        /* ========== FORMS ========== */
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; font-weight:600; font-size:0.8rem; margin-bottom:0.3rem; color:var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:0.7rem 1rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.9rem; outline:none; transition:border-color 0.2s, background 0.3s; font-family:var(--font); }
        .form-group textarea { min-height:100px; resize:vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }
        /* ========== AUTH ========== */
        .auth-container { position:fixed; top:0; left:0; right:0; bottom:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:1rem; overflow:hidden; }
        .auth-background { position:absolute; top:0; left:0; right:0; bottom:0; background-position:center; background-size:cover; z-index:-1; }
        .auth-box { width:100%; max-width:400px; background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:1.8rem; box-shadow:var(--shadow-lg); position:relative; z-index:1; }
        .auth-tab { flex:1; padding:0.6rem; background:none; border:none; cursor:pointer; font-weight:700; transition:color 0.2s, border-color 0.2s; }
        .auth-tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }
        .auth-tab:not(.active) { color:var(--muted); border-bottom:2px solid transparent; }
        .auth-theme-toggle { position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; z-index:2; }
        /* ========== SPLASH ========== */
        #splash-screen { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.8rem; transition:opacity 0.5s ease, visibility 0.5s; }
        #splash-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .splash-icon { width:clamp(72px, 20vw, 120px); height:clamp(72px, 20vw, 120px); border-radius:24px; overflow:hidden; box-shadow:var(--shadow-lg); animation:splashZoom 1.2s ease-out; }
        .splash-icon img { width:100%; height:100%; object-fit:cover; display:block; }
        .splash-title { font-weight:900; font-size:clamp(1.5rem, 6vw, 2.5rem); color:var(--text); letter-spacing:-0.02em; animation:splashFadeUp 1s ease 0.3s both; }
        .splash-subtitle { font-size:clamp(0.9rem, 3vw, 1.2rem); color:var(--muted); font-weight:600; animation:splashFadeUp 1s ease 0.6s both; }
        @keyframes splashZoom { 0% { transform:scale(0.3); opacity:0; } 100% { transform:scale(1); opacity:1; } }
        @keyframes splashFadeUp { 0% { transform:translateY(20px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }
        /* ========== TOAST ========== */
        .toast-container { position:fixed; top:70px; right:1rem; z-index:999; display:flex; flex-direction:column; gap:0.5rem; max-width:320px; }
        .toast { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.8rem 1rem; box-shadow:var(--shadow-lg); font-size:0.8rem; font-weight:500; color:var(--text); animation:slideIn 0.3s ease; }
        .toast.success { border-left:4px solid #10B981; }
        .toast.error { border-left:4px solid #EF4444; }
        .toast.info { border-left:4px solid var(--accent); }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        /* ========== SKELETON ========== */
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--card) 50%, var(--border) 75%); background-size:200% 100%; animation:skeleton-loading 1.5s infinite; border-radius:var(--radius-sm); }
        @keyframes skeleton-loading { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
        .img-container { position:relative; overflow:hidden; }
        .img-container img { opacity:0; transition:opacity 0.3s; }
        .img-container img.loaded { opacity:1; }
        /* ========== LINKS ========== */
        .links-list { display:flex; flex-direction:column; gap:0.6rem; }
        .link-item { display:flex; align-items:center; gap:0.8rem; padding:0.8rem; background:var(--bg); border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; transition:transform 0.2s, background 0.2s; }
        .link-item:active { transform:scale(0.97); }
        .link-item .link-icon { font-size:1.5rem; width:2.2rem; text-align:center; }
        .link-item .link-label { flex:1; font-weight:600; }
        .link-item .link-value { color:var(--accent); font-size:0.8rem; display:none; }
        /* ========== LOADER ========== */
        .loader { border:3px solid var(--border); border-top:3px solid var(--accent); border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; margin:20px auto; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--border); border-radius:4px; }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
        /* ========== GRID TILES ========== */
        .grid-tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:0.8rem; }
        .grid-tile { padding:1rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); text-align:center; cursor:pointer; font-weight:700; font-size:0.8rem; transition:transform 0.2s, border-color 0.2s, background 0.2s; }
        .grid-tile:active { transform:scale(0.95); }
        .grid-tile .tile-icon { font-size:2rem; display:block; margin-bottom:0.4rem; }
        .grid-tile.active { border-color:var(--accent); background:rgba(79,70,229,0.08); }
        /* ========== SEARCH ========== */
        .search-suggestion { padding:0.6rem 0.9rem; border-radius:8px; cursor:pointer; font-size:0.8rem; transition:background 0.2s; }
        .search-suggestion:hover, .search-suggestion:active { background:var(--border); }
        /* ========== UTILITIES ========== */
        .hidden { display:none!important; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; }
        .mt-8 { margin-top:0.5rem; }
        .mt-12 { margin-top:0.8rem; }
        .mb-8 { margin-bottom:0.5rem; }
        .mb-12 { margin-bottom:0.8rem; }
        .w-full { width:100%; }
        .gap-8 { gap:0.5rem; }
        .gap-12 { gap:0.8rem; }
        .text-center { text-align:center; }
        /* ========== BAN ========== */
        .ban-image { width:100%; max-width:300px; margin:0 auto; border-radius:var(--radius); overflow:hidden; }
        .ban-image img { width:100%; height:auto; display:block; }
        /* ========== КОНТЕЙНЕР ИГРЫ (ДУРАК) ========== */
        #durak-game-container {
            display:none;
            position:fixed;
            top:0; left:0;
            width:100%; height:100%;
            z-index:5000;
            background:#060b13;
            overflow:hidden;
        }
        #durak-game-container iframe {
            width:100%;
            height:100%;
            border:none;
        }
    </style>
</head>
<body>

    <!-- Сплэш-экран -->
    <div id="splash-screen">
        <div class="splash-icon">
            <img src="https://i.postimg.cc/mgk2RL4g/1788361335674.jpg" alt="Arizona Online" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="splash-title">Arizona Online</div>
        <div class="splash-subtitle">Market &amp; Durak</div>
    </div>

    <!-- Хедер -->
    <header class="header" id="appHeader" style="display:none;">
        <div class="header-logo" id="logoBtn">
            <img id="headerLogoImg" src="https://i.postimg.cc/nV1HDjcb/1788346659518.jpg" alt="Arizona Online" loading="lazy">
        </div>
        <div class="header-title">Arizona Online</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn">🌓</button>
    </header>

    <!-- Основной контейнер -->
    <main class="container" id="mainContainer" style="display:none;">
        <section class="section active" id="section-home">
            <div id="serverSelector" style="margin-bottom:1rem;">
                <button class="btn secondary w-full" id="serverSelectBtn">🌐 Все сервера</button>
            </div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:1rem;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <section class="section" id="section-send">
            <h2 style="margin-bottom:1rem;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group"><label>Тип сделки</label><button class="btn secondary w-full" id="sendTypeBtn">Продажа</button></div>
                <div class="form-group"><label>Категория</label><button class="btn secondary w-full" id="sendCategoryBtn">Выберите категорию</button></div>
                <div class="form-group"><label>Название</label><input type="text" id="sendName" placeholder="Введите название"></div>
                <div class="form-group"><label>Цена</label><input type="text" id="sendPrice" placeholder="Например: 5к или 1000000"></div>
                <div class="form-group"><label>Описание</label><textarea id="sendDescription" placeholder="Подробное описание"></textarea></div>
                <div class="form-group"><label>Скриншоты (ссылки через запятую)</label><input type="text" id="sendImages" placeholder="https://..."><div style="margin-top:0.3rem;font-size:0.7rem;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div></div>
                <div class="form-group"><label>Сервер</label><button class="btn secondary w-full" id="sendServerBtn">Выберите сервер</button></div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
        </section>
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:1rem;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 style="margin-bottom:1rem;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
            <h3 style="margin:1.5rem 0 0.8rem;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>
    </main>

    <!-- Нижняя навигация -->
    <nav class="nav-bar" id="navBar" style="display:none;">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Все</span></button>
    </nav>

    <!-- Контейнеры -->
    <div id="modalContainer"></div>
    <div id="authContainer"></div>

            // ===================== УТИЛИТЫ =====================
            function withTimeout(promise, ms=10000) { return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),ms))]); }

            function playSfx(type='click') {
                if(!sfxEnabled) return;
                try {
                    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                    if(audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click:800, success:1200, error:300, buy:1000, splash:600 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 0.005);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.04);
                } catch(e) { console.warn('Sfx error:', e); }
            }
            function playSplashSound() { playSfx('splash'); }
            function hapticFeedback(style='light') { if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(style); } catch(e) {} } }
            function showToast(message, type='info') {
                const cont = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast '+type; toast.textContent = message;
                cont.appendChild(toast);
                setTimeout(()=>{ toast.style.opacity='0'; toast.style.transform='translateX(100%)'; setTimeout(()=>toast.remove(),300); },3000);
            }
            function applyTheme() {
                document.documentElement.setAttribute('data-theme', currentTheme);
                const logoImg = document.getElementById('headerLogoImg');
                if (logoImg) { logoImg.src = currentTheme === 'dark' ? 'https://i.postimg.cc/zfWNX3c5/1788346752679.jpg' : 'https://i.postimg.cc/nV1HDjcb/1788346659518.jpg'; }

                if (authBg) { authBg.style.backgroundImage = currentTheme === 'dark' ? "url('https://i.postimg.cc/yNhGbRG4/1788346347547.jpg')" : "url('https://i.postimg.cc/x8phPS4J/1788346275828.jpg')"; }
                if (tg && tg.setHeaderColor) tg.setHeaderColor(currentTheme === 'dark' ? '#0F172A' : '#F9FAFB');
                if (tg && tg.setBackgroundColor) tg.setBackgroundColor(currentTheme === 'dark' ? '#0F172A' : '#F9FAFB');
            }
            function formatPrice(value) {
                if(!value) return '0';
                let num = typeof value==='string'? value.toLowerCase() : value.toString();
                if(num.includes('к')) {
                    let base = parseFloat(num.split('к')[0])||0;
                    let kCount = (num.match(/к/g)||[]).length;
                    if(kCount===1) base*=1000; else if(kCount===2) base*=1000000; else if(kCount===3) base*=1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num)||0;
                if(num>=1000000000) return (num/1000000000).toFixed(num%1000000000===0?0:2)+'ккк';
                if(num>=1000000) return (num/1000000).toFixed(num%1000000===0?0:1)+'кк';
                if(num>=1000) return (num/1000).toFixed(num%1000===0?0:1)+'к';
                return num.toString();
            }
            function parsePriceToNumber(str) {
                if(!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g,''))||0;
                let kCount = (str.match(/к/g)||[]).length;
                if(kCount===1) num*=1000;
                else if(kCount===2) num*=1000000;
                else if(kCount===3) num*=1000000000;
                return num;
            }
            function formatPriceInputHandler(e) {
                const input = e.target;
                let val = input.value.toLowerCase().replace(/[^0-9к]/g,'');
                if(!val){ input.value=''; return; }
                let num = parseInt(val.replace(/к/g,''))||0;
                let kCount = (val.match(/к/g)||[]).length;
                if(kCount===1) num*=1000;
                else if(kCount===2) num*=1000000;
                else if(kCount===3) num*=1000000000;
                input.value = formatPrice(num);
            }
            function isAllowedLink(url) {
                try { const u = new URL(url); const host = u.hostname.replace('www.',''); return ALLOWED_DOMAINS.some(d=>host===d||host.endsWith('.'+d)); } catch(e){ return false; }
            }
            function checkLinksString(str) {
                if(!str.trim()) return {valid:true, links:[]};
                const links = str.split(',').map(s=>s.trim()).filter(s=>s.length>0);
                if(links.length>20) return {valid:false, message:'Максимум 20 ссылок'};
                for(let link of links){ if(!isAllowedLink(link)) return {valid:false, message:`Ссылка ${link} не разрешена`}; }
                return {valid:true, links};
            }
            function getUserIdentifier() { return currentAuthUser?.username ? '@'+currentAuthUser.username : (currentUser.username? '@'+currentUser.username : 'ID:'+currentUser.id); }
            function getUserId() { return currentAuthUser ? currentAuthUser.id : currentUser.id; }
            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
            }

            // ===================== ГЛОБАЛЬНЫЙ ОБРАБОТЧИК КЛИКОВ =====================
            document.addEventListener('click', function(e) {

                    '.btn', '.nav-item', '.card', '.grid-tile', '.link-item', '.search-suggestion',

            // ===================== МОДАЛКИ =====================
            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal"><button class="modal-close" id="modalCloseBtn">✕</button>${html}</div></div>`;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                setTimeout(()=>overlay.classList.add('show'),10);
                function closeModal(){ overlay.classList.remove('show'); setTimeout(()=>{ overlay.remove(); if(onClose) onClose(); },250); }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
                return { overlay, closeModal };
            }
            function showAlert(title, message, type='info') {
                const icon = type==='success'?'✅':type==='error'?'❌':'ℹ️';

                document.getElementById('alertOkBtn').addEventListener('click', closeModal);
            }
            function showConfirm(title, message, onConfirm) {
                const { closeModal } = showModal(`<div style="text-align:center;"><div style="font-size:2.5rem;margin-bottom:0.5rem;">⚠️</div><h3 class="modal-title" style="text-align:center;">${title}</h3><p style="color:var(--muted);margin-bottom:1rem;">${message}</p><div class="flex-between gap-12"><button class="btn secondary w-full" id="confirmCancelBtn">Отмена</button><button class="btn danger w-full" id="confirmOkBtn">Подтвердить</button></div></div>`);
                document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
                document.getElementById('confirmOkBtn').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
            }

            // ===================== АУТЕНТИФИКАЦИЯ =====================
            async function checkAuth() {
                if (!supabaseClient) { if(!initSupabase()) return; }
                const savedUser = localStorage.getItem('arizona_current_user_full');
                if (savedUser) {
                    try {
                        const parsed = JSON.parse(savedUser);
                        if (parsed && parsed.id) {
                            currentAuthUser = parsed;
                            isAdmin = parsed.is_admin || parsed.username === OWNER_USERNAME;
                            isOwner = parsed.username === OWNER_USERNAME;
                            await loadUserSettingsAndProgress();
                            hideSplashAndShowApp();
                            setTimeout(async () => {
                                try {
                                    const { data, error } = await withTimeout(
                                        supabaseClient.from('app_users').select('*').eq('id', parsed.id).maybeSingle(), 5000);
                                    if (!error && data) {
                                        if (data.banned) { showBanScreen(); return; }
                                        if (data.telegram_id !== currentUser.id) {
                                            localStorage.removeItem('arizona_current_user_full');
                                            localStorage.removeItem('arizona_current_user');
                                            currentAuthUser = null;
                                            hideSplashAndShowAuth();
                                            return;
                                        }
                                        currentAuthUser = data;
                                        localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                                        localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                                        isAdmin = data.is_admin || data.username === OWNER_USERNAME;
                                        isOwner = data.username === OWNER_USERNAME;
                                        document.getElementById('adminNavBtn').classList.toggle('hidden', !isAdmin);
                                    } else {
                                        localStorage.removeItem('arizona_current_user_full');
                                        localStorage.removeItem('arizona_current_user');
                                        currentAuthUser = null;
                                        hideSplashAndShowAuth();
                                    }
                                } catch(e) {}
                            }, 0);
                            return;
                        }
                    } catch(e) { console.warn('Ошибка парсинга сохранённого пользователя', e); }
                }
                const saved = localStorage.getItem('arizona_current_user');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const { data, error } = await withTimeout(supabaseClient.from('app_users').select('*').eq('id', parsed.id).maybeSingle(),5000);
                        if (!error && data) {
                            if (data.telegram_id !== currentUser.id) {
                                localStorage.removeItem('arizona_current_user');
                                localStorage.removeItem('arizona_current_user_full');
                            } else {
                                if (data.banned) { showBanScreen(); return; }
                                currentAuthUser = data;
                                localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                                localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                                await loadUserSettingsAndProgress();
                                hideSplashAndShowApp();
                                return;
                            }
                        } else {
                            localStorage.removeItem('arizona_current_user');
                            localStorage.removeItem('arizona_current_user_full');
                        }
                    } catch(e) { console.warn('checkAuth restore error', e); localStorage.removeItem('arizona_current_user'); }
                }
                if (currentUser.id) {
                    try {
                        const { data, error } = await withTimeout(supabaseClient.from('app_users').select('*').eq('telegram_id', currentUser.id).maybeSingle(),5000);
                        if (!error && data) {
                            if (data.banned) { showBanScreen(); return; }
                            currentAuthUser = data;
                            localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                            localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                            await loadUserSettingsAndProgress();
                            hideSplashAndShowApp();
                            return;
                        }
                    } catch(e) { console.warn('checkAuth telegram error', e); }
                }
                hideSplashAndShowAuth();
            }

            function hideSplashAndShowApp() {
                document.getElementById('splash-screen').classList.add('hidden');
                document.getElementById('appHeader').style.display = 'flex';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('navBar').style.display = 'flex';
                initApp();
            }
            function hideSplashAndShowAuth() {
                document.getElementById('splash-screen').classList.add('hidden');
                showAuthScreen();
            }

            async function loadUserSettingsAndProgress() {
                if(!currentAuthUser) return;
                try {
                    const { data:sd, error:se } = await withTimeout(supabaseClient.from('user_settings').select('*').eq('user_id', currentAuthUser.id).maybeSingle(),5000);
                    if(se) throw se;
                    if(sd) { userSettings = sd; currentTheme = sd.theme||'light'; sfxEnabled = sd.sfx_enabled!==false; }
                    else { await supabaseClient.from('user_settings').insert({user_id:currentAuthUser.id, theme:'light', sfx_enabled:true, admin_password_hash:null}); currentTheme='light'; sfxEnabled=true; }
                    const { data:pd, error:pe } = await withTimeout(supabaseClient.from('user_progress').select('*').eq('user_id', currentAuthUser.id).maybeSingle(),5000);
                    if(pe) throw pe; userProgress = pd||{};
                } catch(e) { console.warn('loadUserSettings error',e); currentTheme='light'; sfxEnabled=true; userProgress={}; }
                applyTheme();
            }

            function showBanScreen() {
                document.body.innerHTML = `
                    <div class="fullscreen-overlay" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; text-align:center; padding:1rem;">
                        <div class="ban-image"><img src="https://i.postimg.cc/QxHPzc8j/67a0788c2bc6a08c9814c8ddb26768ca.jpg" alt="Бан"></div>
                        <h1 style="color:#EF4444;">🚫 Вы забанены</h1>
                        <p style="color:var(--muted);">Ваш аккаунт заблокирован администрацией.</p>
                        <button class="btn mt-12" onclick="window.open('https://t.me/${OWNER_USERNAME}','_blank')">Связаться с поддержкой</button>
                    </div>`;
            }

            function showAuthScreen() {
                const container = document.getElementById('authContainer');
                let mode = 'login';
                let isSubmitting = false;
                function renderAuthForm(errorMsg) {
                    container.innerHTML = `
                    <div class="auth-container">
                        <div class="auth-background" style="background-image: url('${currentTheme === 'dark' ? 'https://i.postimg.cc/yNhGbRG4/1788346347547.jpg' : 'https://i.postimg.cc/x8phPS4J/1788346275828.jpg'}');"></div>
                        <button class="auth-theme-toggle" id="authThemeToggle">🌓</button>
                        <div class="auth-box">
                            <h2 style="text-align:center;margin-bottom:0.3rem;">Arizona Online</h2>
                            <p style="text-align:center;font-size:0.8rem;color:var(--muted);margin-bottom:1.2rem;">Маркетплейс для Arizona RP</p>
                            <div style="display:flex;margin-bottom:1.2rem;border-bottom:1px solid var(--border);">
                                <button class="auth-tab ${mode==='login'?'active':''}" id="authTabLogin">Вход</button>
                                <button class="auth-tab ${mode==='register'?'active':''}" id="authTabRegister">Создать</button>
                            </div>
                            <div class="form-group"><label>Логин</label><input type="text" id="authUsername" placeholder="Введите логин"></div>
                            <div class="form-group"><label>Пароль</label><input type="password" id="authPassword" placeholder="Введите пароль"></div>
                            <button class="btn w-full" id="authSubmitBtn" ${isSubmitting?'disabled':''}>${isSubmitting?'⏳ Загрузка...':(mode==='login'?'Войти':'Создать аккаунт')}</button>
                            <p id="authError" style="color:#EF4444;font-size:0.75rem;margin-top:0.6rem;text-align:center;">${errorMsg||''}</p>
                        </div>
                    </div>`;
                    document.getElementById('authThemeToggle').addEventListener('click', ()=>{
                        currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                        applyTheme();
                        renderAuthForm();
                    });
                    document.getElementById('authTabLogin').addEventListener('click', ()=>{ if(mode!=='login'){ mode='login'; isSubmitting=false; renderAuthForm(); }});
                    document.getElementById('authTabRegister').addEventListener('click', ()=>{ if(mode!=='register'){ mode='register'; isSubmitting=false; renderAuthForm(); }});
                    document.getElementById('authSubmitBtn').addEventListener('click', async ()=>{
                        if(isSubmitting) return; const errEl = document.getElementById('authError'); errEl.textContent = '';
                        const username = document.getElementById('authUsername').value.trim().toLowerCase(); const password = document.getElementById('authPassword').value.trim();
                        if(!username||!password){ errEl.textContent='Заполните все поля'; return; }
                        isSubmitting = true; const btn = document.getElementById('authSubmitBtn'); btn.disabled = true; btn.textContent='⏳ Загрузка...';
                        try {
                            const hashedPassword = await hashPassword(password);
                            if(mode==='login') {
                                const { data, error } = await withTimeout(supabaseClient.from('app_users').select('*').eq('username',username).maybeSingle(),5000);
                                if(error) throw error;
                                if(!data){ errEl.textContent='Пользователь не найден. Зарегистрируйтесь.'; isSubmitting=false; btn.disabled=false; btn.textContent='Войти'; return; }
                                if(data.password_hash!==hashedPassword){ errEl.textContent='Неверный логин или пароль'; isSubmitting=false; btn.disabled=false; btn.textContent='Войти'; return; }
                                if(data.banned){ showBanScreen(); return; }
                                currentAuthUser = data;
                                localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                                localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                                await loadUserSettingsAndProgress(); playSfx('success'); container.innerHTML=''; hideSplashAndShowApp();
                            } else {
                                const { data: existingTelegram } = await withTimeout(supabaseClient.from('app_users').select('id').eq('telegram_id', currentUser.id).maybeSingle(),5000);
                                if(existingTelegram){ errEl.textContent='Этот Telegram уже привязан к аккаунту. Войдите.'; isSubmitting=false; btn.disabled=false; btn.textContent='Создать аккаунт'; return; }
                                const { data: existing } = await withTimeout(supabaseClient.from('app_users').select('id').eq('username',username).maybeSingle(),5000);
                                if(existing){ errEl.textContent='Такой пользователь уже существует'; isSubmitting=false; btn.disabled=false; btn.textContent='Создать аккаунт'; return; }
                                const newUser = { username, password_hash:hashedPassword, telegram_id: currentUser.id||null, telegram_username: currentUser.username||null, banned:false, is_admin: username===OWNER_USERNAME, created_at:new Date().toISOString() };
                                const { data: inserted, error: insertErr } = await withTimeout(supabaseClient.from('app_users').insert(newUser).select().single(),5000);
                                if(insertErr) throw insertErr;
                                currentAuthUser = inserted;
                                localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                                localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                                await supabaseClient.from('user_settings').insert({user_id:currentAuthUser.id, theme:'light', sfx_enabled:true, admin_password_hash:null});
                                await supabaseClient.from('user_progress').insert({user_id:currentAuthUser.id, tutorial_completed:false, admin_tutorial_completed:false});
                                await loadUserSettingsAndProgress(); playSfx('success'); container.innerHTML=''; hideSplashAndShowApp();
                            }
                        } catch(e) { console.error('Auth error',e); let msg='Ошибка соединения.'; if(e.message==='Timeout') msg='Превышено время ожидания.'; errEl.textContent=msg; isSubmitting=false; btn.disabled=false; btn.textContent = mode==='login'?'Войти':'Создать аккаунт'; }
                    });
                }
                renderAuthForm();
            }

            // ===================== ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ =====================
            async function initApp(isFirstLogin=false) {
                if(!currentAuthUser){ showAuthScreen(); return; }
                isAdmin = currentAuthUser.is_admin || (currentAuthUser.username===OWNER_USERNAME);
                isOwner = currentAuthUser.username===OWNER_USERNAME;
                document.getElementById('adminNavBtn').classList.toggle('hidden', !isAdmin);
                await loadSearchHistory(); await loadNotificationsCount();
                if (isFirstLogin || !userProgress.tutorial_completed) { showUserTutorial(); }
                switchSection('home');
                requestWakeLock();

            async function loadHomeFeed(reset=true){
                if(reset) feedPage = 0;

                if(reset) cont.innerHTML = '<div class="loader"></div>';
                try{
                    let query = supabaseClient.from('ads').select('*').eq('status','approved').order('created_at',{ascending:false}).range(feedPage*FEED_PAGE_SIZE,(feedPage+1)*FEED_PAGE_SIZE-1);
                    if(currentFilterServer) query = query.eq('server', currentFilterServer);
                    const { data, error } = await withTimeout(query, 8000);
                    if(error) throw error;
                    const newAds = data || [];
                    const validAds = newAds.filter(ad => !ad.expires_at || new Date(ad.expires_at) > new Date());
                    if(reset) homeAds = validAds;
                    else homeAds = [...homeAds, ...validAds];
                    renderHomeFeed();
                    feedPage++;

            function renderHomeFeed(){
                const cont = document.getElementById('homeFeed');
                if(!homeAds.length){ cont.innerHTML='<div class="empty-state">📭 Объявлений пока нет</div>'; return; }
                let html = '';
                homeAds.forEach(ad=>{
                    const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                    const img = firstImg || DEFAULT_AD_IMAGE;
                    const modeBadge = ad.mode==='sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                    const catLabel = ALL_CATEGORIES.find(c=>c.id===ad.category)?.label || ad.category;
                    let timer = '';
                    if(ad.expires_at){
                        const diff = new Date(ad.expires_at) - new Date();
                        if(diff > 0){
                            const total = Math.floor(diff/1000);
                            const h = Math.floor(total/3600);
                            const m = Math.floor((total%3600)/60);
                            const s = total%60;
                            timer = `<div class="countdown-timer">⏳ Удаление через: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}</div>`;
                        } else { timer = '<div class="countdown-timer">⚠️ Удалено</div>'; }
                    }
                    html += `<div class="card ad-card" data-ad-id="${ad.id}">
                        <div class="img-container" style="width:80px;height:100px;border-radius:12px;flex-shrink:0;background:var(--border);">

                            <img src="${img}" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;" onload="this.classList.add('loaded')" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--border);border-radius:12px;z-index:0;">📷</div>
                        </div>
                        <div class="ad-card-info">

                            <div class="ad-card-author">Автор: ${ad.author_username || ad.author_id}</div>
                            ${timer}
                        </div>
                    </div>`;
                });
                cont.innerHTML = html;
                cont.querySelectorAll('.ad-card').forEach(card=>card.addEventListener('click', ()=>{
                    const id = card.dataset.adId;
                    const ad = homeAds.find(a=>a.id == id);
                    if(ad) openAdDetail(ad);

                loadMore.className = 'btn secondary w-full mt-12';
                loadMore.textContent = 'Загрузить ещё';
                loadMore.addEventListener('click', ()=>loadHomeFeed(false));
                cont.appendChild(loadMore);
            }

            // ===================== АПЕЛЛЯЦИЯ =====================
            let appealAdId = null;
            function openAppealModal(){
                if(!appealAdId) return;
                showModal(`<h3 class="modal-title">📨 Апелляция</h3>
                    <div class="form-group"><label>Причина</label><select id="appealReasonSelect">${APPEAL_REASONS.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>
                    <div class="form-group"><label>Доказательства</label><input type="text" id="appealEvidence" placeholder="https://..."></div>

                        evidence,
                        status:'pending',
