<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width 0.3s;
        }
        @media (min-width: 768px) {
            :root { --container-width: 720px; }
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .ad-card { width: 100%; }
        }
        @media (min-width: 1024px) {
            :root { --container-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            height: var(--header-height);
            gap: 8px;
            transition: background 0.3s, border-color 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-logo {
            width: 36px; height: 36px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; cursor: pointer; }
        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
            pointer-events: none;
        }
        .theme-toggle {
            background: none; border: none; font-size: 22px; cursor: pointer;
            padding: 4px; border-radius: 8px; transition: transform 0.2s; flex-shrink: 0;
        }
        .theme-toggle:active { transform: scale(0.9); }
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            z-index: 100; background: var(--bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            height: var(--nav-height); padding-bottom: env(safe-area-inset-bottom);
            transition: background 0.3s, border-color 0.3s;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; background: none; border: none; color: var(--muted); font-size: 10px;
            font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 8px;
            transition: color 0.3s, transform 0.2s, background 0.2s; flex: 1; max-width: 80px; min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0, 91, 255, 0.08); }
        .nav-item:active { transform: scale(0.92); }
        .section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }
        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px;
            margin-bottom: 10px;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s, opacity 0.3s;
            cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .card.inactive-card {
            background: rgba(128, 128, 128, 0.12) !important;
            opacity: 0.75;
        }
        [data-theme="dark"] .card.inactive-card {
            background: rgba(255, 255, 255, 0.04) !important;
            opacity: 0.65;
        }
        .ad-card { display: flex; gap: 10px; align-items: flex-start; }
        .ad-card-img { width: 80px; height: 100px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--border); color: var(--text); white-space: nowrap; }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }
        .ad-card-author { font-size: 11px; color: var(--muted); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 18px; border-radius: var(--radius); border: none; background: var(--accent);
            color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, background 0.3s; touch-action: manipulation; min-height: var(--btn-min-height);
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 200; display: flex;
            align-items: center; justify-content: center; padding: 16px;
            opacity: 0; transition: opacity 0.25s ease;
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2); width: 100%; max-width: 520px; max-height: 85vh;
            overflow-y: auto; padding: 20px; position: relative;
            transform: translateY(20px); transition: transform 0.25s ease, background 0.3s, border-color 0.3s;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 12px; right: 12px; background: none; border: none;
            font-size: 24px; cursor: pointer; color: var(--muted); padding: 4px; line-height: 1; z-index: 5; transition: transform 0.2s;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 16px; padding-right: 30px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 14px; outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s; font-family: var(--font);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 500; }
        .tutorial-overlay, .fullscreen-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 500; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px; text-align: center; transition: background 0.3s;
        }
        .tutorial-slide { max-width: 420px; width: 100%; }
        .tutorial-slide h2 { font-weight: 900; font-size: 24px; margin-bottom: 12px; }
        .tutorial-slide p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .tutorial-nav { display: flex; gap: 10px; margin-top: 15px; }
        .star-rating { display: flex; gap: 4px; font-size: 28px; cursor: pointer; }
        .star-rating span { color: var(--border); transition: color 0.2s, transform 0.2s; }
        .star-rating span.active { color: var(--gold); }
        .star-rating span:hover { transform: scale(1.2); }
        .review-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .review-item:last-child { border-bottom: none; }
        .game-click-area {
            width: 100%; max-width: 250px; aspect-ratio: 1; margin: 0 auto 20px; cursor: pointer;
            border-radius: 50%; overflow: hidden; border: 4px solid var(--border);
            transition: transform 0.1s, border-color 0.3s; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .game-click-area:active { transform: scale(0.92); }
        .game-click-area img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .upgrade-card {
            display: flex; justify-content: space-between; align-items: center; padding: 12px;
            border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px;
            background: var(--card); transition: background 0.3s, border-color 0.3s;
        }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: 700; font-size: 14px; }
        .upgrade-cost { font-size: 12px; color: var(--muted); }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .category-tile {
            padding: 12px 8px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--card); text-align: center; cursor: pointer; font-weight: 600; font-size: 11px;
            transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .category-tile:active { transform: scale(0.95); }
        .category-tile .cat-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .search-suggestion { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .search-suggestion:hover, .search-suggestion:active { background: var(--border); }
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile {
            padding: 16px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--card); text-align: center; cursor: pointer; font-weight: 700; font-size: 13px;
            transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .grid-tile:active { transform: scale(0.95); }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .image-gallery { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; scroll-snap-type: x mandatory; }
        .image-gallery img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; scroll-snap-align: start; flex-shrink: 0; background: var(--border); cursor: pointer; transition: transform 0.2s; }
        .image-gallery img:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }
        .w-full { width: 100%; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
    </style>
</head>
<body>
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" autocomplete="off" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>
    <main class="container" id="mainContainer">
        <section class="section active" id="section-home">
            <div id="homeCategories" style="margin-bottom: 12px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;"></div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType">
                        <option value="sell">Продажа</option>
                        <option value="buy">Покупка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую, до 20, необязательно)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                    <div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div>
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>
    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-section="cart">
            <span class="nav-icon">🛒</span>
            <span>Корзина</span>
        </button>
        <button class="nav-item" data-section="send">
            <span class="nav-icon">➕</span>
            <span>Отправка</span>
        </button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin">
            <span class="nav-icon">🛡️</span>
            <span>Админ</span>
        </button>
        <button class="nav-item" data-section="all">
            <span class="nav-icon">☰</span>
            <span>Все разделы</span>
        </button>
    </nav>
    <div id="modalContainer"></div>
    <div id="tutorialContainer"></div>
    <script>
        (function() {
            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Phoenix', 'Tucson', 'Scottdale', 'Chandler', 'Brainburg', 'Saint-Rose', 'Mesa', 'Red-Rock', 'Yuma',
                'Surprise', 'Prescott', 'Glendale', 'Kingman', 'Winslow', 'Payson', 'Gilbert', 'Show-Low', 'Casa-Grande',
                'Page', 'Sun-City', 'Queen-Creek', 'Sedona', 'Holiday', 'Wednesday', 'Yava', 'Faraway', 'Bumble-Bee',
                'Christmas', 'Mirage', 'Love', 'Drake', 'Space', 'Home', 'Mobile I', 'Mobile II', 'Mobile III'
            ];
            const ALL_CATEGORIES = [
                { id: 'accessories', label: '💍 Аксессуары и вещи' },
                { id: 'transport', label: '🚗 Транспорт' },
                { id: 'realestate', label: '🏠 Недвижимость' },
                { id: 'business', label: '💼 Бизнесы' },
                { id: 'weapons', label: '🔫 Оружие и материалы' },
                { id: 'clothing', label: '👕 Одежда' },
                { id: 'electronics', label: '📱 Электроника' }
            ];
            const APPEAL_REASONS = [
                'Несправедливая блокировка', 'Ошибка модерации', 'Объявление удалили по ошибке',
                'Нарушение правил другой стороной', 'Техническая проблема', 'Возврат средств',
                'Жалоба на пользователя', 'Взлом аккаунта', 'Другое', 'Не знаю'
            ];
            const ALLOWED_DOMAINS = [
                'youtube.com', 'youtu.be', 'radikal.cloud', 'allwebs.ru', 'postimages.org', 'ru.imgbb.com'
            ];
            const DEFAULT_AD_IMAGE = 'https://i.postimg.cc/zDwTPKwq/0465dd7cc4f5446e5e908000ec4379bb.jpg';
            const SUPABASE_URL = 'https://sbtitlayqkpllnaiyeld.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_bVZYBWwjdsPMfbbRglAFbw_fP-8ClPO';

            let tg = null;
            let currentAuthUser = JSON.parse(localStorage.getItem('arizona_current_user') || 'null');
            let currentUser = { id: 123456789, username: 'testuser', first_name: 'Тест' };

            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    tg = window.Telegram.WebApp;
                    tg.expand();
                    tg.ready();
                    const initData = tg.initDataUnsafe || {};
                    if (initData.user) {
                        currentUser = {
                            id: initData.user.id || currentUser.id,
                            username: initData.user.username || '',
                            first_name: initData.user.first_name || currentUser.first_name
                        };
                    }
                }
            } catch (e) { console.warn('Telegram WebApp not available', e); }

            let supabase = null;
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            } catch (e) { console.warn('Supabase init error', e); }

            let currentSection = 'home';
            let currentTheme = localStorage.getItem('theme') || 'light';
            let sfxEnabled = localStorage.getItem('sfx') !== 'off';
            let currentFilterCategory = null;
            let currentUserServer = ALL_SERVERS[0];
            let currentUserData = null;
            let isAdmin = false;
            let isOwner = false;
            let lastAdSubmitTime = 0;
            let wakeLock = null;
            let audioCtx = null;
            let gameState = {
                money: 0, clickPower: 1, clickCost: 50, autoIncome: 0, autoCost: 200, proCost: 800,
                shopCost: 3000, eliteCost: 10000, oilCost: 35000, cryptoCost: 150000, scrapCost: 500,
                elitePurchased: false
            };
            let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            let appealAdId = null;
            let cartAds = [];
            let myAds = [];
            let pendingAds = [];
            let pendingAppeals = [];
            let homeAds = [];

            function getUserIdentifier() {
                if (currentAuthUser && currentAuthUser.username) return `@${currentAuthUser.username}`;
                if (currentUser.username) return `@${currentUser.username}`;
                return `ID: ${currentUser.id}`;
            }
            let userIdentifier = getUserIdentifier();

            function withTimeout(promise, ms = 8000) {
                return Promise.race([
                    promise,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))
                ]);
            }

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return base;
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function formatPriceInput(input) {
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

            function isAllowedLink(url) {
                try {
                    const u = new URL(url);
                    const host = u.hostname.replace('www.', '');
                    return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                } catch (e) { return false; }
            }

            function checkLinksString(str) {
                if (!str.trim()) return { valid: true, links: [] };
                const links = str.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
                for (let link of links) {
                    if (!isAllowedLink(link)) return { valid: false, message: `Ссылка ${link} не разрешена` };
                }
                return { valid: true, links };
            }

            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div class="modal-overlay" id="modalOverlay">

                            <button class="modal-close" id="modalCloseBtn">✕</button>
                            ${html}
                        </div>
                    </div>
                `;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                setTimeout(() => overlay.classList.add('show'), 10);
                
                function closeModal() {
                    overlay.classList.remove('show');
                    setTimeout(() => {
                        overlay.remove();
                        if (onClose) onClose();
                    }, 250);
                }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
                return { overlay, closeModal };
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            async function adminUserAction(action) {
                const target = document.getElementById('adminUsernameInput').value.trim();
                if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
                try {
                    let query = supabase.from('users').select('*');
                    if (target.startsWith('@')) {
                        query = query.eq('username', target.replace('@', ''));
                    } else if (!isNaN(target)) {
                        query = query.eq('id', target);
                    } else {
                        query = query.eq('username', target);
                    }
                    const { data: user, error } = await withTimeout(query.maybeSingle());
                    if (error) throw error;
                    if (!user) { showAlert('Ошибка', 'Пользователь не найден'); return; }

                    let updates = {};
                    if (action === 'ban') updates.banned = true;
                    else if (action === 'unban') updates.banned = false;
                    else if (action === 'make_admin') updates.is_admin = true;
                    else if (action === 'remove_admin') updates.is_admin = false;

                    await withTimeout(supabase.from('users').update(updates).eq('id', user.id));
                    playSfx('success'); showAlert('Успех', 'Действие выполнено'); loadAdminPanel();
                } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
            }

                        supabase.from('favorites').select('*').eq('user_id', userIdKey).eq('ad_id', adId).maybeSingle()

            // ===== Отзывы =====
            async function loadReviews(adId) {
                const container = document.getElementById('detailReviewsSection');
                if (!container) return;
                try {
                    const { data: reviews, error } = await withTimeout(
                        supabase.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false })
                    );
                    if (error) throw error;
                    const reviewsData = reviews || [];
                    if (!reviewsData.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Отзывов пока нет</p>';
                        return;
                    }
                    const avg = reviewsData.reduce((s, r) => s + r.stars, 0) / reviewsData.length;
                    let html = `<div style="font-size:20px;font-weight:800;margin-bottom:8px;">⭐ ${avg.toFixed(1)} (${reviewsData.length})</div>`;
                    html += '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>';
                    reviewsData.forEach(r => {
                        const canEdit = r.author_id === userIdentifier && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                        html += `
                            <div class="review-item">
                                <div style="font-weight:600;">${r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
                                <div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
                                <p style="font-size:13px;margin:4px 0;">${r.text || ''}</p>
                                ${r.media_links ? `<div style="font-size:11px;color:var(--accent);">${r.media_links}</div>` : ''}
                                ${canEdit ? `<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-delete-review="${r.id}">🗑</button></div>` : ''}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-edit-review]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const rev = reviewsData.find(r => r.id == btn.dataset.editReview);
                            if (rev) openEditReviewModal(rev);
                        });
                    });
                    container.querySelectorAll('[data-delete-review]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('reviews').delete().eq('id', btn.dataset.deleteReview));
                            playSfx('click'); loadReviews(adId);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:var(--muted);">Не удалось загрузить отзывы</p>';
                }
            }

            async function loadSimilarAds(category, currentAdId) {
                const container = document.getElementById('detailSimilarAds');
                if (!container) return;
                try {
                    const { data } = await withTimeout(
                        supabase.from('ads').select('*').eq('status', 'approved').eq('category', category).neq('id', currentAdId).limit(3).order('created_at', { ascending: false })
                    );
                    const similar = data || [];
                    if (!similar.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Похожих нет</p>';
                        return;
                    }
                    container.innerHTML = similar.map(ad => `
                        <div class="card" style="cursor:pointer;" data-sim="${ad.id}">
                            <span style="font-weight:700;">${ad.item_name}</span> • ${formatPrice(ad.price)}
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-sim]').forEach(el => {
                        el.addEventListener('click', () => {
                            const found = similar.find(a => a.id == el.dataset.sim);
                            if (found) {
                                const overlay = document.getElementById('modalOverlay');
                                if (overlay) {
                                    overlay.classList.remove('show');
                                    setTimeout(() => overlay.remove(), 250);
                                }
                                openAdDetail(found);
                            }
                        });
                    });
                } catch (e) {}
            }

            function openReviewsModal(adId) {
                showModal(`
                    <h3 class="modal-title">⭐ Отзывы</h3>
                    <div class="form-group">
                        <label>Оценка</label>
                        <div class="star-rating" id="reviewStars">
                            ${[1,2,3,4,5].map(i => `<span data-star="${i}">☆</span>`).join('')}
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ссылки (до 20, через запятую)</label>
                        <input type="text" id="reviewMedia" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Текст отзыва</label>
                        <textarea id="reviewText" placeholder="Ваш отзыв"></textarea>
                    </div>
                    <button class="btn w-full" id="reviewSubmitBtn">Отправить отзыв</button>
                `);
                let selectedStars = 0;
                const starsContainer = document.getElementById('reviewStars');
                starsContainer.querySelectorAll('span').forEach(span => {
                    span.addEventListener('click', () => {
                        selectedStars = parseInt(span.dataset.star);
                        updateStars(starsContainer, selectedStars);
                    });
                });
                document.getElementById('reviewSubmitBtn').addEventListener('click', async () => {
                    if (!selectedStars) { showAlert('Ошибка', 'Выберите оценку'); return; }
                    const text = document.getElementById('reviewText').value.trim();
                    const media = document.getElementById('reviewMedia').value.trim();
                    const linkCheck = checkLinksString(media);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    try {
                        await withTimeout(supabase.from('reviews').insert({
                            ad_id: adId, author_id: userIdentifier, stars: selectedStars,
                            text: text, media_links: media, created_at: new Date().toISOString()
                        }));
                        playSfx('success'); showAlert('Успех', 'Отзыв отправлен');
                        const overlay = document.getElementById('modalOverlay');
                        overlay.classList.remove('show');
                        setTimeout(() => overlay.remove(), 250);
                        loadReviews(adId);
                    } catch (e) { showAlert('Ошибка', 'Не удалось отправить'); }
                });
            }

            function updateStars(container, selected) {
                container.querySelectorAll('span').forEach(span => {
                    span.textContent = parseInt(span.dataset.star) <= selected ? '★' : '☆';
                    span.classList.toggle('active', parseInt(span.dataset.star) <= selected);
                });
            }

            function openEditReviewModal(review) {
                showModal(`
                    <h3 class="modal-title">✏️ Редактировать отзыв</h3>
                    <div class="form-group">
                        <label>Оценка</label>
                        <div class="star-rating" id="editReviewStars">
                            ${[1,2,3,4,5].map(i => `<span data-star="${i}" class="${i <= review.stars ? 'active' : ''}">${i <= review.stars ? '★' : '☆'}</span>`).join('')}
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ссылки</label>
                        <input type="text" id="editReviewMedia" value="${review.media_links || ''}">
                    </div>
                    <div class="form-group">
                        <label>Текст</label>
                        <textarea id="editReviewText">${review.text || ''}</textarea>
                    </div>
                    <button class="btn w-full" id="editReviewSubmitBtn">Сохранить</button>
                `);
                let selectedStars = review.stars;
                const starsContainer = document.getElementById('editReviewStars');
                starsContainer.querySelectorAll('span').forEach(span => {
                    span.addEventListener('click', () => {
                        selectedStars = parseInt(span.dataset.star);
                        updateStars(starsContainer, selectedStars);
                    });
                });
                document.getElementById('editReviewSubmitBtn').addEventListener('click', async () => {
                    const text = document.getElementById('editReviewText').value.trim();
                    const media = document.getElementById('editReviewMedia').value.trim();
                    const linkCheck = checkLinksString(media);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await withTimeout(supabase.from('reviews').update({ stars: selectedStars, text, media_links: media }).eq('id', review.id));
                    playSfx('success');
                    const overlay = document.getElementById('modalOverlay');
                    overlay.classList.remove('show');
                    setTimeout(() => overlay.remove(), 250);
                    loadReviews(review.ad_id);
                });
            }

            function openAppealModal() {
                if (!appealAdId) return;
                showModal(`
                    <h3 class="modal-title">📨 Апелляция</h3>
                    <div class="form-group">
                        <label>Причина</label>
                        <select id="appealReason">${APPEAL_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
                    </div>
                    <div class="form-group">
                        <label>Доказательства (ссылки до 20)</label>
                        <input type="text" id="appealEvidence" placeholder="https://...">
                    </div>
                    <button class="btn w-full" id="appealSubmitBtn">Отправить</button>
                `);
                document.getElementById('appealSubmitBtn').addEventListener('click', async () => {
                    const reason = document.getElementById('appealReason').value;
                    const evidence = document.getElementById('appealEvidence').value.trim();
                    const linkCheck = checkLinksString(evidence);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    try {
                        await withTimeout(supabase.from('appeals').insert({
                            ad_id: appealAdId, author_id: userIdentifier, reason: reason,
                            evidence: evidence, status: 'pending', created_at: new Date().toISOString()
                        }));
                        playSfx('success'); showAlert('Успех', 'Апелляция отправлена');
                        const overlay = document.getElementById('modalOverlay');
                        overlay.classList.remove('show');
                        setTimeout(() => overlay.remove(), 250);
                    } catch (e) { showAlert('Ошибка', 'Не удалось отправить'); }
                });
            }

            // ===== Барыга Игра =====
            async function loadGameState() {
                if (!supabase) return;
                try {
                    const userIdKey = currentAuthUser ? currentAuthUser.username : currentUser.id.toString();
                    const { data } = await withTimeout(
                        supabase.from('baryga').select('*').eq('user_id', userIdKey).maybeSingle()
                    );
                    if (data) {
                        gameState = { ...gameState, ...data };
                    } else {
                        await withTimeout(supabase.from('baryga').insert({ user_id: userIdKey, money: 0, click_power: 1, click_cost: 50, auto_income: 0, auto_cost: 200, pro_cost: 800, shop_cost: 3000, elite_cost: 10000, oil_cost: 35000, crypto_cost: 150000, scrap_cost: 500 }));
                    }
                } catch (e) {}
            }

            function openBarygaGame() {
                loadGameState().then(() => {
                    showModal(`
                        <h3 class="modal-title">🎮 Игра «Барыга»</h3>
                        <div style="text-align:center;font-size:24px;font-weight:900;margin-bottom:8px;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div>
                        <div class="game-click-area" id="gameClickArea">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FF9900'/%3E%3Ctext x='50' y='60' font-size='40' text-anchor='middle' fill='white'%3E💰%3C/text%3E%3C/svg%3E" alt="Клик">
                        </div>
                        <div style="font-size:12px;color:var(--muted);text-align:center;" id="gameStatsDisplay">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div>
                        <div class="mt-12" id="gameUpgradesContainer"></div>
                    `);
                    
                    const clickArea = document.getElementById('gameClickArea');
                    const upgradesContainer = document.getElementById('gameUpgradesContainer');
                    upgradesContainer.innerHTML = renderUpgrades();

                    clickArea.addEventListener('click', () => {
                        gameState.money += gameState.clickPower;
                        updateGameUIFast();
                        playSfx('click');
                        saveGameStateDebounced();
                        clickArea.style.transform = 'scale(0.92)';
                        setTimeout(() => clickArea.style.transform = '', 80);
                    });

                    upgradesContainer.addEventListener('click', (e) => {
                        const btn = e.target.closest('[data-upgrade]');
                        if (!btn) return;
                        const idx = parseInt(btn.dataset.upgrade);
                        const upgradesList = getUpgradesList();
                        const upgrade = upgradesList[idx];
                        if (gameState.money >= upgrade.cost) {
                            gameState.money -= upgrade.cost;
                            upgrade.action();
                            updateGameUIFast();
                            saveGameStateDebounced();
                            playSfx('buy');
                        }
                    });

                    const gameInterval = setInterval(() => {
                        if (!document.getElementById('gameClickArea')) {
                            clearInterval(gameInterval);
                            return;
                        }
                        if (gameState.autoIncome > 0) {
                            gameState.money += gameState.autoIncome / 10;
                            updateGameUIFast();
                        }
                    }, 100);
                });
            }

            function getUpgradesList() {
                return [
                    { name: 'Клик +1', cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                    { name: 'Про +20/сек', cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } },
                    { name: 'Элита: клик +10', cost: gameState.eliteCost, action: () => { gameState.clickPower += 10; gameState.eliteCost *= 2; gameState.elitePurchased = true; } },
                    { name: 'Нефть +200/сек', cost: gameState.oilCost, action: () => { gameState.autoIncome += 200; gameState.oilCost *= 2; } },
                    { name: 'Крипта +1000/сек', cost: gameState.cryptoCost, action: () => { gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } },
                    { name: 'Скупка лома +500/сек', cost: gameState.scrapCost, action: () => { gameState.autoIncome += 500; gameState.scrapCost *= 2; } }
                ];
            }

            function renderUpgrades() {
                const upgrades = getUpgradesList();
                return upgrades.map((u, i) => `
                    <div class="upgrade-card" data-upgrade-card="${i}">
                        <div class="upgrade-info">
                            <div class="upgrade-name">${u.name}</div>
                            <div class="upgrade-cost" data-cost-idx="${i}">💰 ${formatPrice(u.cost)}</div>
                        </div>
                        <button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button>
                    </div>
                `).join('');
            }

            function updateGameUIFast() {
                const moneyEl = document.getElementById('gameMoneyDisplay');
                if (moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money);
                const statsEl = document.getElementById('gameStatsDisplay');
                if (statsEl) statsEl.textContent = `Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек`;

                const upgrades = getUpgradesList();
                upgrades.forEach((u, i) => {
                    const btn = document.querySelector(`[data-upgrade="${i}"]`);
                    const costEl = document.querySelector(`[data-cost-idx="${i}"]`);
                    if (btn && costEl) {
                        costEl.textContent = '💰 ' + formatPrice(u.cost);
                        if (gameState.money < u.cost) {
                            if (!btn.hasAttribute('disabled')) btn.setAttribute('disabled', 'true');
                        } else {
                            if (btn.hasAttribute('disabled')) btn.removeAttribute('disabled');
                        }
                    }
                });
            }

            let saveTimeout = null;
            function saveGameStateDebounced() {
                if (saveTimeout) clearTimeout(saveTimeout);
                saveTimeout = setTimeout(saveGameState, 1000);
            }

            async function saveGameState() {
                if (!supabase) return;
                try {
                    const userIdKey = currentAuthUser ? currentAuthUser.username : currentUser.id.toString();
                    await withTimeout(supabase.from('baryga').update({
                        money: gameState.money, click_power: gameState.clickPower, click_cost: gameState.clickCost,
                        auto_income: gameState.autoIncome, auto_cost: gameState.autoCost, pro_cost: gameState.proCost,
                        shop_cost: gameState.shopCost, elite_cost: gameState.eliteCost, oil_cost: gameState.oilCost,
                        crypto_cost: gameState.cryptoCost, scrap_cost: gameState.scrapCost
                    }).eq('user_id', userIdKey));
                } catch (e) {}
            }

            // ===== Поиск =====
            function openSearchModal() {
                showModal(`
                    <h3 class="modal-title">🔍 Поиск</h3>
                    <div class="form-group">
                        <input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off">
                    </div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="searchItemBtn">📦 Предмет</button>
                        <button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button>
                    </div>
                    <div id="searchSuggestions"></div>
                    <div id="searchHistory"></div>
                    <div id="searchResults"></div>
                `);
                const input = document.getElementById('searchInput');
                const suggestions = document.getElementById('searchSuggestions');
                const results = document.getElementById('searchResults');
                const history = document.getElementById('searchHistory');

                setTimeout(() => input.focus(), 100);

                function renderHistory() {
                    if (!searchHistory.length) { history.innerHTML = ''; return; }
                    history.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">История:</div>' + searchHistory.map(h => `<span class="badge" style="cursor:pointer;margin:2px;" data-hist="${h}">${h}</span>`).join('');
                    history.querySelectorAll('[data-hist]').forEach(el => {
                        el.addEventListener('click', () => {
                            input.value = el.dataset.hist;
                            input.dispatchEvent(new Event('input'));
                        });
                    });
                }
                renderHistory();

                input.addEventListener('input', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) { suggestions.innerHTML = ''; results.innerHTML = ''; return; }
                    try {
                        const { data } = await withTimeout(
                            supabase.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(5)
                        );
                        const items = data || [];
                        suggestions.innerHTML = items.map(ad => `<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`).join('');
                        suggestions.querySelectorAll('[data-sug]').forEach(el => {
                            el.addEventListener('click', () => {
                                const ad = items.find(a => a.id == el.dataset.sug);
                                if (ad) {
                                    if (!searchHistory.includes(q)) {
                                        searchHistory.unshift(q);
                                        if (searchHistory.length > 10) searchHistory.pop();
                                        localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
                                    }
                                    const overlay = document.getElementById('modalOverlay');
                                    overlay.classList.remove('show');
                                    setTimeout(() => overlay.remove(), 250);
                                    openAdDetail(ad);
                                }
                            });
                        });
                    } catch (e) {}
                });

                document.getElementById('searchItemBtn').addEventListener('click', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) return;
                    try {
                        const { data } = await withTimeout(
                            supabase.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`)
                        );
                        const items = data || [];
                        if (!items.length) { results.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
                        results.innerHTML = items.map(ad => `
                            <div class="card" data-res-id="${ad.id}">
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                            </div>
                        `).join('');
                        results.querySelectorAll('[data-res-id]').forEach(card => {
                            card.addEventListener('click', () => {
                                const ad = items.find(a => a.id == card.dataset.resId);
                                if (ad) {
                                    const overlay = document.getElementById('modalOverlay');
                                    overlay.classList.remove('show');
                                    setTimeout(() => overlay.remove(), 250);
                                    openAdDetail(ad);
                                }
                            });
                        });
                    } catch (e) {}
                });

                document.getElementById('searchProfileBtn').addEventListener('click', async () => {
                    const q = input.value.trim();
                    if (!q) return;
                    openProfileModal(q);
                });
            }

            async function openProfileModal(authorId) {
                showModal(`
                    <h3 class="modal-title">👤 Профиль: ${authorId}</h3>
                    <div id="profileAdsList"><div class="empty-state">Загрузка...</div></div>
                `);
                try {
                    const { data } = await withTimeout(
                        supabase.from('ads').select('*').eq('status', 'approved').eq('author_id', authorId).order('created_at', { ascending: false })
                    );
                    const ads = data || [];
                    const container = document.getElementById('profileAdsList');
                    if (!ads.length) { container.innerHTML = '<div class="empty-state">У пользователя нет активных объявлений</div>'; return; }
                    container.innerHTML = ads.map(ad => `
                        <div class="card" data-prof-ad="${ad.id}">
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-prof-ad]').forEach(card => {
                        card.addEventListener('click', () => {
                            const ad = ads.find(a => a.id == card.dataset.profAd);
                            if (ad) {
                                const overlay = document.getElementById('modalOverlay');
                                overlay.classList.remove('show');
                                setTimeout(() => overlay.remove(), 250);
                                openAdDetail(ad);
                            }
                        });
                    });
                } catch (e) {
                    document.getElementById('profileAdsList').innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
                }
            }

            // ===== Все разделы и Дополнительные модули =====
            function loadAllTiles() {
                const tiles = [
                    { id: 'baryga', icon: '🎮', label: 'Игра «Барыга»' },
                    { id: 'looks', icon: '📸', label: 'Лента луков' },
                    { id: 'travelers', icon: '🚗', label: 'Попутчики' },
                    { id: 'music', icon: '🎵', label: 'Музыка' },
                    { id: 'settings', icon: '⚙️', label: 'Настройки' },
                    { id: 'support', icon: '💬', label: 'Связь с менеджером' },
                    { id: 'logout', icon: '🚪', label: 'Сменить аккаунт' }
                ];
                const container = document.getElementById('allTiles');
                container.innerHTML = tiles.map(t => `
                    <div class="grid-tile" data-tile="${t.id}">
                        <span class="tile-icon">${t.icon}</span>
                        <span>${t.label}</span>
                    </div>
                `).join('');

                container.querySelectorAll('[data-tile]').forEach(tile => {
                    tile.addEventListener('click', () => {
                        const id = tile.dataset.tile;
                        if (id === 'baryga') openBarygaGame();
                        if (id === 'looks') showAlert('Лента луков', 'Скоро открытие раздела');
                        if (id === 'travelers') showAlert('Попутчики', 'Скоро открытие раздела');
                        if (id === 'music') openMusicModal();
                        if (id === 'settings') openSettingsModal();
                        if (id === 'support') window.open('https://t.me/' + OWNER_USERNAME, '_blank');
                        if (id === 'logout') {
                            localStorage.removeItem('arizona_current_user');
                            location.reload();
                        }
                    });
                });
            }

            function openMusicModal() {
                showModal(`
                    <h3 class="modal-title">🎵 Музыка</h3>
                    <p style="color:var(--muted);margin-bottom:12px;">Плейлист радио Arizona RP</p>
                    <div class="card flex-between">
                        <div>
                            <div style="font-weight:700;">Arizona Hot Radio</div>
                            <div style="font-size:12px;color:var(--muted);">Прямой эфир</div>
                        </div>
                        <button class="btn" id="playRadioBtn">▶️ Играть</button>
                    </div>
                `);
                document.getElementById('playRadioBtn').addEventListener('click', () => {
                    showAlert('Радио', 'Воспроизведение потока временно недоступно в WebApp');
                });
            }

            function openSettingsModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group flex-between">
                        <label>Звуковые эффекты (SFX)</label>
                        <button class="btn secondary" id="toggleSfxBtn">${sfxEnabled ? 'Включены' : 'Выключены'}</button>
                    </div>
                `);
                document.getElementById('toggleSfxBtn').addEventListener('click', () => {
                    sfxEnabled = !sfxEnabled;
                    localStorage.setItem('sfx', sfxEnabled ? 'on' : 'off');
                    document.getElementById('toggleSfxBtn').textContent = sfxEnabled ? 'Включены' : 'Выключены';
                    playSfx('click');
                });
            }

            // Запуск авторизации при загрузке скрипта
            checkAuth();
        })();
    </script>
</body>
