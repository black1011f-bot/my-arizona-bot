<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width 0.3s;
        }
        @media (min-width: 768px) {
            :root {
                --container-width: 720px;
            }
            .ads-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .ad-card {
                width: 100%;
            }
        }
        @media (min-width: 1024px) {
            :root {
                --container-width: 1200px;
            }
            .ads-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            height: var(--header-height);
            gap: 8px;
            transition: background 0.3s, border-color 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-logo:active {
            transform: scale(0.9);
        }
        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-title {
            font-weight: 800;
            font-size: 18px;
            color: var(--text);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-search {
            flex: 1;
            min-width: 0;
        }
        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
        }
        .header-search input::placeholder {
            color: var(--muted);
        }
        .header-search input:focus {
            border-color: var(--accent);
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .theme-toggle:active {
            transform: scale(0.9);
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background 0.3s, border-color 0.3s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: color 0.3s, transform 0.2s, background 0.2s;
            flex: 1;
            max-width: 80px;
        }
        .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1;
        }
        .nav-item.active {
            color: var(--accent);
            background: rgba(0, 91, 255, 0.08);
        }
        .nav-item:active {
            transform: scale(0.92);
        }
        .section {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px;
            margin-bottom: 10px;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s;
            cursor: pointer;
        }
        .card:active {
            transform: scale(0.98);
        }
        .ad-card {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .ad-card-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
        .ad-card-info {
            flex: 1;
            min-width: 0;
        }
        .ad-card-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ad-card-price {
            font-weight: 800;
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .ad-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: var(--border);
            color: var(--text);
            white-space: nowrap;
        }
        .badge.sell {
            background: #34c759;
            color: #fff;
        }
        .badge.buy {
            background: #ff9500;
            color: #fff;
        }
        .badge.server {
            background: var(--gold);
            color: #1a1a1a;
        }
        .badge.category {
            background: var(--accent);
            color: #fff;
        }
        .badge.status-pending {
            background: #ffcc00;
            color: #1a1a1a;
        }
        .badge.status-deleted {
            background: #ff3b30;
            color: #fff;
        }
        .badge.status-approved {
            background: #34c759;
            color: #fff;
        }
        .ad-card-author {
            font-size: 11px;
            color: var(--muted);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, background 0.3s;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn.danger {
            background: #ff3b30;
            color: #fff;
        }
        .btn.gold {
            background: var(--gold);
            color: #1a1a1a;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
            padding: 16px;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            animation: slideUp 0.3s ease;
            transition: background 0.3s, border-color 0.3s;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            line-height: 1;
            z-index: 5;
            transition: transform 0.2s;
        }
        .modal-close:active {
            transform: scale(0.9);
        }
        .modal-title {
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 16px;
            padding-right: 30px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
            font-family: var(--font);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-weight: 500;
        }
        .tutorial-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 300;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: background 0.3s;
        }
        .tutorial-slide {
            max-width: 420px;
            width: 100%;
        }
        .tutorial-slide h2 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .tutorial-slide p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 24px;
            text-align: center;
            transition: background 0.3s;
        }
        .star-rating {
            display: flex;
            gap: 4px;
            font-size: 28px;
            cursor: pointer;
        }
        .star-rating span {
            color: var(--border);
            transition: color 0.2s, transform 0.2s;
        }
        .star-rating span.active {
            color: var(--gold);
        }
        .star-rating span:hover {
            transform: scale(1.2);
        }
        .review-item {
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .game-click-area {
            width: 100%;
            max-width: 250px;
            aspect-ratio: 1;
            margin: 0 auto 20px;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--border);
            transition: transform 0.1s, border-color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .game-click-area:active {
            transform: scale(0.92);
        }
        .game-click-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .upgrade-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: var(--card);
            transition: background 0.3s, border-color 0.3s;
        }
        .upgrade-info {
            flex: 1;
        }
        .upgrade-name {
            font-weight: 700;
            font-size: 14px;
        }
        .upgrade-cost {
            font-size: 12px;
            color: var(--muted);
        }
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin: 6px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .category-tile {
            padding: 12px 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .category-tile:active {
            transform: scale(0.95);
        }
        .category-tile .cat-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }
        .search-suggestion {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .search-suggestion:hover,
        .search-suggestion:active {
            background: var(--border);
        }
        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .grid-tile {
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .grid-tile:active {
            transform: scale(0.95);
        }
        .grid-tile .tile-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }
        .image-gallery {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 12px;
            scroll-snap-type: x mandatory;
        }
        .image-gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            scroll-snap-align: start;
            flex-shrink: 0;
            background: var(--border);
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .admin-table th,
        .admin-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .admin-table th {
            font-weight: 700;
            color: var(--muted);
        }
        @media (max-width: 480px) {
            .modal {
                padding: 16px;
            }
            .grid-tiles {
                grid-template-columns: repeat(2, 1fr);
            }
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .hidden {
            display: none !important;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .text-muted {
            color: var(--muted);
        }
        .text-accent {
            color: var(--accent);
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .w-full {
            width: 100%;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .text-center {
            text-align: center;
        }
        .relative {
            position: relative;
        }
        .overflow-hidden {
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23005BFF'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3EAZ%3C/text%3E%3C/svg%3E" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search">
            <input type="text" id="globalSearchInput" placeholder="🔍 Поиск товаров" autocomplete="off">
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>

    <main class="container" id="mainContainer">
        <!-- Главная -->
        <section class="section active" id="section-home">
            <div class="ads-grid" id="homeFeed"></div>
        </section>
        <!-- Корзина -->
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <!-- Отправка -->
        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType">
                        <option value="sell">Продажа</option>
                        <option value="buy">Покупка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую, до 20)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                    <div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div>
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить на модерацию</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>
        <!-- Админ -->
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <!-- Все разделы -->
        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-section="cart">
            <span class="nav-icon">🛒</span>
            <span>Корзина</span>
        </button>
        <button class="nav-item" data-section="send">
            <span class="nav-icon">➕</span>
            <span>Отправка</span>
        </button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin">
            <span class="nav-icon">🛡️</span>
            <span>Админ</span>
        </button>
        <button class="nav-item" data-section="all">
            <span class="nav-icon">☰</span>
            <span>Все разделы</span>
        </button>
    </nav>

    <div id="modalContainer"></div>

    <script>
        (function() {
            // ===== Глобальные константы =====
            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Arizona RP 01', 'Arizona RP 02', 'Arizona RP 03', 'Arizona RP 04', 'Arizona RP 05',

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    const freq = freqs[type] || 600;
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let parts = num.split('к');
                    let base = parseFloat(parts[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return base;
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInput(input) {
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

                const overlay = document.getElementById('modalOverlay');

                function closeModal() {
                    overlay.remove();
                    if (onClose) onClose();

            async function adminUserAction(action) {
                const username = document.getElementById('adminUsernameInput').value.trim().replace('@', '');
                if (!username) { showAlert('Ошибка', 'Введите username'); return; }
                try {
                    const { data: user, error } = await withTimeout(
                        supabase.from('users').select('*').eq('username', username).maybeSingle()
                    );
                    if (error) throw error;
                    if (!user) {
                        showAlert('Ошибка', 'Пользователь не найден');
                        return;
                    }
                    let updates = {};
                    if (action === 'ban') updates.banned = true;
                    else if (action === 'unban') updates.banned = false;
                    else if (action === 'make_admin') updates.is_admin = true;
                    else if (action === 'remove_admin') updates.is_admin = false;
                    await withTimeout(supabase.from('users').update(updates).eq('id', user.id));
                    playSfx('success');
                    showAlert('Успех', 'Действие выполнено');
                    loadAdminPanel();
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось выполнить');
                }
            }

            async function checkIfInCart(adId) {
                if (!supabase) return false;
                try {
                    const { data } = await withTimeout(
                        supabase.from('favorites').select('*').eq('user_id', currentUser.id.toString()).eq('ad_id', adId).maybeSingle()

            async function loadReviews(adId) {
                const container = document.getElementById('detailReviewsSection');
                if (!container) return;
                try {
                    const { data: reviews, error } = await withTimeout(
                        supabase.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false })
                    );
                    if (error) throw error;
                    const reviewsData = reviews || [];
                    if (!reviewsData.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Отзывов пока нет</p>';
                        return;
                    }
                    const avg = reviewsData.reduce((s, r) => s + r.stars, 0) / reviewsData.length;
                    let html = `<div style="font-size:20px;font-weight:800;margin-bottom:8px;">⭐ ${avg.toFixed(1)} (${reviewsData.length})</div>`;
                    html += '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>';
                    reviewsData.forEach(r => {
                        const canEdit = r.author_id === currentUser.id.toString() && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                        html += `
                            <div class="review-item">
                                <div style="font-weight:600;">${r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
                                <div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
                                <p style="font-size:13px;margin:4px 0;">${r.text || ''}</p>
                                ${r.media_links ? `<div style="font-size:11px;color:var(--accent);">${r.media_links}</div>` : ''}
                                ${canEdit ? `<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-delete-review="${r.id}">🗑</button></div>` : ''}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-edit-review]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const rev = reviewsData.find(r => r.id == btn.dataset.editReview);
                            if (rev) openEditReviewModal(rev);
                        });
                    });
                    container.querySelectorAll('[data-delete-review]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('reviews').delete().eq('id', btn.dataset.deleteReview));
                            playSfx('click');
                            loadReviews(adId);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:var(--muted);">Не удалось загрузить отзывы</p>';
                }
            }

            function openBarygaGame() {
                loadGameState().then(() => {
                    showModal(`

                        </div>

                            ${renderUpgrades()}

                    `);

                    clickArea.addEventListener('click', () => {

                        saveGameState();

                        setTimeout(() => clickArea.style.transform = '', 100);
                    });
                    setInterval(() => {

                            gameState.money += gameState.autoIncome / 10;
                            updateGameUI();
                            saveGameState();
                        }
                    }, 100);

            function renderUpgrades() {
                const upgrades = [
                    { name: 'Клик +1', cost: gameState.clickCost, key: 'clickCost', action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost, key: 'autoCost', action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                    { name: 'Про +20/сек', cost: gameState.proCost, key: 'proCost', action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost, key: 'shopCost', action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } },
                    { name: 'Элита: клик +10', cost: gameState.eliteCost, key: 'eliteCost', action: () => { gameState.clickPower += 10; gameState.eliteCost *= 2; gameState.elitePurchased = true; } },
                    { name: 'Нефть +200/сек', cost: gameState.oilCost, key: 'oilCost', action: () => { gameState.autoIncome += 200; gameState.oilCost *= 2; } },
                    { name: 'Крипта +1000/сек', cost: gameState.cryptoCost, key: 'cryptoCost', action: () => { gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } },
                    { name: 'Скупка лома +500/сек', cost: gameState.scrapCost, key: 'scrapCost', action: () => { gameState.autoIncome += 500; gameState.scrapCost *= 2; } }
                ];
                return upgrades.map((u, i) => `
                    <div class="upgrade-card">
                        <div class="upgrade-info">
                            <div class="upgrade-name">${u.name}</div>
                            <div class="upgrade-cost">💰 ${formatPrice(u.cost)}</div>
                        </div>
                        <button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button>
                    </div>
                `).join('');
            }

            function updateGameUI() {
                const moneyEl = document.querySelector('#gameClickArea')?.parentElement?.querySelector('div');
                if (moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money);
                const upgradesContainer = document.getElementById('gameUpgrades');
                if (upgradesContainer) upgradesContainer.innerHTML = renderUpgrades();
                document.querySelectorAll('[data-upgrade]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.upgrade);
                        const upgrades = [
                            { cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                            { cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                            { cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                            { cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } },
                            { cost: gameState.eliteCost, action: () => { gameState.clickPower += 10; gameState.eliteCost *= 2; gameState.elitePurchased = true; } },
                            { cost: gameState.oilCost, action: () => { gameState.autoIncome += 200; gameState.oilCost *= 2; } },
                            { cost: gameState.cryptoCost, action: () => { gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } },
                            { cost: gameState.scrapCost, action: () => { gameState.autoIncome += 500; gameState.scrapCost *= 2; } }
                        ];
                        const upgrade = upgrades[idx];
                        if (gameState.money >= upgrade.cost) {
                            gameState.money -= upgrade.cost;
                            upgrade.action();
                            updateGameUI();
                            saveGameState();
                            playSfx('buy');
                        }
                    });
                });
            }

                        });

                    <h2 style="font-weight:900;margin-bottom:8px;">Установите username</h2>
                    <p style="color:var(--muted);margin-bottom:16px;">Для использования приложения необходимо установить username в Telegram</p>
                    <p style="color:var(--muted);font-size:13px;">Настройки → Изменить профиль → Имя пользователя</p>
                `;
                document.body.appendChild(overlay);
            }

            // ===== Realtime =====
            function setupRealtime() {
                if (!supabase) return;
                try {
                    realtimeChannel = supabase.channel('ads-changes')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'ads' }, (payload) => {
                            if (currentSection === 'home') loadHomeFeed();
                            if (currentSection === 'send') loadMyAds();
                            if (currentSection === 'admin') loadAdminPanel();
                            if (currentSection === 'cart') loadCart();
                        })
                        .subscribe();
                } catch (e) {}
            }

            // ===== Отправка объявления =====
            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!supabase) { showAlert('Ошибка', 'Нет подключения к базе'); return; }
                const now = new Date();
                const hour = now.getUTCHours() + 3; // МСК
                const isAdminUser = isAdmin || isOwner;
                if (!isAdminUser && (hour < 9 || hour >= 22)) {
                    showAlert('Ошибка', 'Отправка возможна только с 09:00 до 22:00 МСК');
                    return;
                }
                if (!isAdminUser && Date.now() - lastAdSubmitTime < 120000) {
                    showAlert('Ошибка', 'Кулдаун 2 минуты между объявлениями');
                    return;
                }
                const type = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const name = document.getElementById('sendName').value.trim();
                const priceStr = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const imagesStr = document.getElementById('sendImages').value.trim();
                const server = document.getElementById('sendServer').value;
                if (!name || !priceStr || !description || !imagesStr) {
                    showAlert('Ошибка', 'Заполните все обязательные поля');
                    return;
                }
                const price = parsePriceToNumber(priceStr);
                if (price <= 0) { showAlert('Ошибка', 'Некорректная цена'); return; }
                const linkCheck = checkLinksString(imagesStr);
                if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                try {
                    await withTimeout(supabase.from('ads').insert({
                        mode: type,
                        category: category,
                        item_name: name,
                        price: price,
                        description: description,
                        images: linkCheck.links.join(','),
                        server: server,
                        author_id: currentUser.id.toString(),
                        status: 'pending',
                        created_at: new Date().toISOString()
                    }));
                    lastAdSubmitTime = Date.now();
                    playSfx('success');
                    showAlert('Успех', 'Объявление отправлено на модерацию');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось отправить');
                }
            });

            // ===== Админ редактирование =====
            function openAdminEditModal(ad) {
                showModal(`
                    <h3 class="modal-title">✏️ Редактировать объявление</h3>
                    <div class="form-group">
                        <label>Название</label>
                        <input type="text" id="adminEditName" value="${ad.item_name}">
                    </div>
                    <div class="form-group">
                        <label>Цена</label>
                        <input type="text" id="adminEditPrice" value="${formatPrice(ad.price)}">
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea id="adminEditDescription">${ad.description || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Ссылки</label>
                        <input type="text" id="adminEditImages" value="${ad.images || ''}">
                    </div>
                    <div class="form-group">
                        <label>Сервер</label>
                        <select id="adminEditServer">${ALL_SERVERS.map(s => `<option value="${s}" ${s === ad.server ? 'selected' : ''}>${s}</option>`).join('')}</select>
                    </div>
                    <button class="btn w-full" id="adminEditSaveBtn">Сохранить и одобрить</button>
                `);
                document.getElementById('adminEditSaveBtn').addEventListener('click', async () => {
                    const name = document.getElementById('adminEditName').value.trim();
                    const price = parsePriceToNumber(document.getElementById('adminEditPrice').value);
                    const description = document.getElementById('adminEditDescription').value.trim();
                    const images = document.getElementById('adminEditImages').value.trim();
                    const server = document.getElementById('adminEditServer').value;
                    const linkCheck = checkLinksString(images);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await withTimeout(supabase.from('ads').update({
                        item_name: name,
                        price: price,
                        description: description,
                        images: linkCheck.links.join(','),
                        server: server,
                        status: 'approved'
                    }).eq('id', ad.id));
                    playSfx('success');
                    document.getElementById('modalOverlay').remove();
                    loadAdminPanel();
                    loadHomeFeed();
                });
            }

            // ===== Настройка цен в форме =====
            const sendPriceInput = document.getElementById('sendPrice');
            sendPriceInput.addEventListener('input', () => formatPriceInput(sendPriceInput));

            // ===== Инициализация приложения =====
            async function initApp() {
                applyTheme();
                setupBackgroundMusic();
                if (!currentUser.username) {
                    showNoUsernameScreen();
                    return;
                }
                await loadCurrentUserData();
                if (currentUserData && currentUserData.banned) {
                    showBanScreen();
                    return;
                }
                showTutorial();
                switchSection('home');
                setupRealtime();
                setupEventListeners();
                requestWakeLock();
                if (isAdmin) {
                    setTimeout(() => showAdminTutorial(), 500);
                }
            }

            function setupEventListeners() {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', () => {
                        switchSection(btn.dataset.section);
                    });
                });
                document.getElementById('themeToggleBtn').addEventListener('click', () => {
                    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                    saveTheme();
                    applyTheme();
                    playSfx('click');
                });
                document.getElementById('logoBtn').addEventListener('click', openLogoModal);
                document.getElementById('globalSearchInput').addEventListener('focus', () => {
                    document.getElementById('globalSearchInput').blur();
                    openSearchModal();
                });
                window.addEventListener('resize', () => {
                    if (currentSection === 'home') renderHomeFeed();
                });
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        requestWakeLock();
                    }
                });
            }

            // Запуск
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }
        })();
    </script>
</body>
                </html>
