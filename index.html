<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ ========== */
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* ========== СБРОС ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* ========== КОНТЕЙНЕР ========== */
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width 0.3s;
        }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (min-width: 768px) {
            :root { --container-width: 720px; }
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .ad-card { width: 100%; }
        }
        @media (min-width: 1024px) {
            :root { --container-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 420px) {
            .header-title { font-size: 15px; }
            .header-logo { width: 30px; height: 30px; }
            .nav-item .nav-icon { font-size: 18px; }
            .nav-item { font-size: 9px; padding: 2px 4px; min-height: 36px; }
            .ad-card-img { width: 60px; height: 80px; }
            .ad-card-title { font-size: 13px; }
            .ad-card-price { font-size: 14px; }
            .card { padding: 10px; }
            .modal { padding: 14px; max-width: 98%; }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-tiles { grid-template-columns: repeat(2, 1fr); }
            .btn { padding: 8px 14px; font-size: 12px; min-height: 36px; }
            .form-group input, .form-group select, .form-group textarea { padding: 8px 10px; font-size: 13px; }
        }

        /* ========== ХЕДЕР ========== */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 8px 12px; height: var(--header-height); gap: 8px;
            transition: background 0.3s, border-color 0.3s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .header-logo { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; cursor: pointer; }
        .header-search input {
            width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-size: 14px; outline: none; pointer-events: none;
        }
        .theme-toggle { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; flex-shrink: 0; }

        /* ========== НАВИГАЦИЯ ========== */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600;
            cursor: pointer; padding: 4px 8px; border-radius: 8px; flex: 1; max-width: 80px; min-height: var(--btn-min-height);
            transition: color 0.3s, background 0.2s;
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0, 91, 255, 0.08); }

        /* ========== СЕКЦИИ ========== */
        .section { display: none; opacity: 0; transform: translateY(10px); transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* ========== КАРТОЧКИ ========== */
        .card {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px; cursor: pointer;
            transition: transform 0.15s, opacity 0.3s;
        }
        .card:active { transform: scale(0.98); }
        .card.inactive-card { background: rgba(128, 128, 128, 0.12) !important; opacity: 0.75; }
        
        .ad-card { display: flex; gap: 10px; align-items: flex-start; }
        .ad-card-img { width: 80px; height: 100px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        
        .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--border); color: var(--text); white-space: nowrap; }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }

        /* ========== КНОПКИ ========== */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 18px; border-radius: var(--radius); border: none; background: var(--accent);
            color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
            min-height: var(--btn-min-height); touch-action: manipulation;
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn.success { background: #34c759; color: #fff; }
        .btn.w-full { width: 100%; }

        /* ========== МОДАЛКИ ========== */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6);
            z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; transition: opacity 0.25s ease;
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); width: 100%; max-width: 520px; max-height: 85vh;
            overflow-y: auto; padding: 20px; position: relative; transform: translateY(20px); transition: transform 0.25s ease;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); z-index: 5; }
        .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 16px; padding-right: 30px; }

        /* ========== ФОРМЫ ========== */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 14px; outline: none; font-family: var(--font);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }

        /* ========== ПРОЧЕЕ ========== */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 500; }
        .tutorial-overlay, .fullscreen-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
            z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
        }
        .tutorial-slide { max-width: 420px; width: 100%; }
        .tutorial-slide h2 { font-weight: 900; font-size: 24px; margin-bottom: 12px; }
        .tutorial-slide p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .tutorial-nav { display: flex; gap: 10px; margin-top: 15px; }

        .star-rating { display: flex; gap: 4px; font-size: 28px; cursor: pointer; }
        .star-rating span { color: var(--border); transition: color 0.2s, transform 0.2s; }
        .star-rating span.active { color: var(--gold); }
        .review-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }

        .image-gallery { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; scroll-snap-type: x mandatory; }
        .image-gallery img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; scroll-snap-align: start; flex-shrink: 0; background: var(--border); }

        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }

        .auth-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
            z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-box { width: 100%; max-width: 400px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; box-shadow: var(--shadow); }
        .auth-tab { flex: 1; padding: 8px; background: none; border: none; cursor: pointer; font-weight: 700; transition: color 0.2s; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .auth-tab:not(.active) { color: var(--muted); border-bottom: 2px solid transparent; }

        #homeCategories { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        #homeCategories::-webkit-scrollbar { display: none; }
        #homeCategories .badge { cursor: pointer; padding: 6px 12px; flex-shrink: 0; }
        #homeCategories .badge.active { background: var(--accent); color: #fff; }
        #homeCategories .badge:not(.active) { background: var(--border); color: var(--text); }

        .loader { border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" autocomplete="off" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>

    <main class="container" id="mainContainer">
        <section class="section active" id="section-home">
            <div id="homeCategories" style="margin-bottom:12px;"></div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>

        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType"><option value="sell">Продажа</option><option value="buy">Покупка</option></select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую, до 20, необязательно)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>

        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"><div class="card">Раздел в разработке</div></div>
        </section>
    </main>

    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Все разделы</span></button>
    </nav>

    <div id="modalContainer"></div>
    <div id="tutorialContainer"></div>
    <div id="authContainer"></div>

    <script>
        (function() {
            'use strict';

            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Phoenix', 'Tucson', 'Scottdale', 'Chandler', 'Brainburg', 'Saint-Rose', 'Mesa', 'Red-Rock', 'Yuma',
                'Surprise', 'Prescott', 'Glendale', 'Kingman', 'Winslow', 'Payson', 'Gilbert', 'Show-Low', 'Casa-Grande',
                'Page', 'Sun-City', 'Queen-Creek', 'Sedona', 'Holiday', 'Wednesday', 'Yava', 'Faraway', 'Bumble-Bee',
                'Christmas', 'Mirage', 'Love', 'Drake', 'Space', 'Home', 'Mobile I', 'Mobile II', 'Mobile III'
            ];
            const ALL_CATEGORIES = [
                { id: 'accessories', label: '💍 Аксессуары и вещи' },
                { id: 'transport', label: '🚗 Транспорт' },
                { id: 'realestate', label: '🏠 Недвижимость' },
                { id: 'business', label: '💼 Бизнесы' },
                { id: 'weapons', label: '🔫 Оружие и материалы' },
                { id: 'clothing', label: '👕 Одежда' },
                { id: 'electronics', label: '📱 Электроника' }
            ];
            const APPEAL_REASONS = [
                'Несправедливая блокировка', 'Ошибка модерации', 'Объявление удалили по ошибке',
                'Нарушение правил другой стороной', 'Техническая проблема', 'Возврат средств',
                'Жалоба на пользователя', 'Взлом аккаунта', 'Другое', 'Не знаю'
            ];
            const ALLOWED_DOMAINS = ['youtube.com', 'youtu.be', 'radikal.cloud', 'allwebs.ru', 'postimages.org', 'ru.imgbb.com'];
            const DEFAULT_AD_IMAGE = 'https://i.postimg.cc/zDwTPKwq/0465dd7cc4f5446e5e908000ec4379bb.jpg';
            const SUPABASE_URL = 'https://sbtitlayqkpllnaiyeld.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_bVZYBWwjdsPMfbbRglAFbw_fP-8ClPO';

            let tg = null;
            let supabaseClient = null;
            let currentAuthUser = null;
            let currentUser = { id: 0, username: '', first_name: '' };
            let currentSection = 'home';
            let currentTheme = localStorage.getItem('theme') || 'light';
            let sfxEnabled = localStorage.getItem('sfx') !== 'off';
            let currentFilterCategory = null;
            let currentUserServer = ALL_SERVERS[0];
            let isAdmin = false;
            let isOwner = false;
            let audioCtx = null;
            let userIdentifier = '';

            let homeAds = [];
            let cartAds = [];
            let myAds = [];
            let pendingAds = [];
            let pendingAppeals = [];

            function initSupabase() {
                try {
                    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                        showFatalError('Не удалось загрузить библиотеку Supabase.');
                        return false;
                    }
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false }
                    });
                    return true;
                } catch (e) {
                    showFatalError('Ошибка подключения к серверу.');
                    return false;
                }
            }

            function showFatalError(msg) {
                document.body.innerHTML = `<div class="fullscreen-overlay"><h1 style="color:#ff3b30;">⚠️ Ошибка</h1><p style="color:var(--muted);">${msg}</p><button class="btn mt-12" onclick="location.reload()">Повторить</button></div>`;
            }

            function initTelegram() {
                try {
                    if (window.Telegram && window.Telegram.WebApp) {
                        tg = window.Telegram.WebApp;
                        tg.expand();
                        tg.ready();
                        const initData = tg.initDataUnsafe || {};
                        if (initData.user) {
                            currentUser = {
                                id: initData.user.id || 0,
                                username: initData.user.username || '',
                                first_name: initData.user.first_name || 'Пользователь'
                            };
                        }
                    }
                } catch (e) {}
                if (!currentUser.id) {
                    currentUser = {
                        id: Math.floor(Math.random() * 900000000) + 100000000,
                        username: 'guest_' + Math.floor(Math.random() * 10000),
                        first_name: 'Гость'
                    };
                }
            }

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.frequency.value = type === 'success' ? 1200 : 800;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function applyTheme() { document.documentElement.setAttribute('data-theme', currentTheme); }
            applyTheme();

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(0) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(0) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(0) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInputHandler(e) {
                const input = e.target;
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                input.value = val;
            }

            function isAllowedLink(url) {
                try {
                    const u = new URL(url);
                    const host = u.hostname.replace('www.', '');
                    return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                } catch (e) { return false; }
            }

            function checkLinksString(str) {
                if (!str.trim()) return { valid: true, links: [] };
                const links = str.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
                for (let link of links) {
                    if (!isAllowedLink(link)) return { valid: false, message: `Ссылка не разрешена: ${link}` };
                }
                return { valid: true, links };
            }

            function getUserIdentifier() {
                if (currentAuthUser && currentAuthUser.username) return `@${currentAuthUser.username}`;
                if (currentUser.username) return `@${currentUser.username}`;
                return `ID:${currentUser.id}`;
            }

            function getUserId() {
                return currentAuthUser ? currentAuthUser.id : currentUser.id;
            }

            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div class="modal-overlay" id="modalOverlay">
                        <div class="modal" id="modalBox">
                            <button class="modal-close" id="modalCloseBtn">✕</button>
                            ${html}
                        </div>
                    </div>
                `;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                setTimeout(() => overlay.classList.add('show'), 10);

                function closeModal() {
                    overlay.classList.remove('show');
                    setTimeout(() => { overlay.remove(); if (onClose) onClose(); }, 250);
                }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
            }

            function showAlert(title, message, type = 'info') {
                showModal(`
                    <div style="text-align:center;">
                        <h3 class="modal-title" style="text-align:center;">${title}</h3>
                        <p style="color:var(--muted);margin-bottom:16px;">${message}</p>
                        <button class="btn w-full" id="alertOkBtn">ОК</button>
                    </div>
                `);
                document.getElementById('alertOkBtn').addEventListener('click', () => document.getElementById('modalOverlay').remove());
            }

            function showConfirm(title, message, onConfirm) {
                showModal(`
                    <div style="text-align:center;">
                        <h3 class="modal-title" style="text-align:center;">${title}</h3>
                        <p style="color:var(--muted);margin-bottom:16px;">${message}</p>
                        <div class="flex-between gap-8">
                            <button class="btn secondary w-full" id="confirmCancelBtn">Отмена</button>
                            <button class="btn danger w-full" id="confirmOkBtn">Подтвердить</button>
                        </div>
                    </div>
                `);
                document.getElementById('confirmCancelBtn').addEventListener('click', () => document.getElementById('modalOverlay').remove());
                document.getElementById('confirmOkBtn').addEventListener('click', () => { document.getElementById('modalOverlay').remove(); onConfirm(); });
            }

            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function checkAuth() {
                if (!supabaseClient) {
                    if (!initSupabase()) return;
                }

                const saved = localStorage.getItem('arizona_current_user');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const { data, error } = await supabaseClient
                            .from('app_users')
                            .select('*')
                            .eq('id', parsed.id)
                            .maybeSingle();
                        if (!error && data) {
                            currentAuthUser = data;
                            userIdentifier = getUserIdentifier();
                            if (data.banned) { showBanScreen(); return; }
                            await initApp();
                            return;
                        }
                    } catch (e) {
                        localStorage.removeItem('arizona_current_user');
                    }
                }
                showAuthScreen();
            }

            function showBanScreen() {
                document.body.innerHTML = `<div class="fullscreen-overlay"><h1 style="color:#ff3b30;">🚫 Вы забанены</h1><p style="color:var(--muted);">Ваш аккаунт заблокирован администрацией.</p></div>`;
            }

            function showAuthScreen() {
                const container = document.getElementById('authContainer');
                let mode = 'login';

                function renderAuthForm() {
                    container.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-box">
                                <h2 style="text-align:center;margin-bottom:4px;">Arizona RP</h2>
                                <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px;">Маркетплейс</p>
                                <div style="display:flex;margin-bottom:16px;border-bottom:1px solid var(--border);">
                                    <button type="button" class="auth-tab ${mode === 'login' ? 'active' : ''}" id="authTabLogin">Вход</button>
                                    <button type="button" class="auth-tab ${mode === 'register' ? 'active' : ''}" id="authTabRegister">Регистрация</button>
                                </div>
                                <div class="form-group">
                                    <label>Логин</label>
                                    <input type="text" id="authUsername" placeholder="Введите логин" autocomplete="off" value="${currentUser.username || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Пароль</label>
                                    <input type="password" id="authPassword" placeholder="Введите пароль">
                                </div>
                                <button type="button" class="btn w-full" id="authSubmitBtn">${mode === 'login' ? 'Войти' : 'Зарегистрироваться'}</button>
                                <p id="authError" style="color:#ff3b30;font-size:12px;margin-top:8px;text-align:center;"></p>
                            </div>
                        </div>
                    `;

                    document.getElementById('authTabLogin').addEventListener('click', () => { mode = 'login'; renderAuthForm(); });
                    document.getElementById('authTabRegister').addEventListener('click', () => { mode = 'register'; renderAuthForm(); });

                    document.getElementById('authSubmitBtn').addEventListener('click', async () => {
                        const errorEl = document.getElementById('authError');
                        errorEl.textContent = '';
                        const username = document.getElementById('authUsername').value.trim().toLowerCase();
                        const password = document.getElementById('authPassword').value.trim();

                        if (!username || !password) {
                            errorEl.textContent = 'Заполните все поля';
                            return;
                        }

                        try {
                            const hashedPassword = await hashPassword(password);
                            if (mode === 'login') {
                                const { data, error } = await supabaseClient
                                    .from('app_users')
                                    .select('*')
                                    .eq('username', username)
                                    .maybeSingle();

                                if (error || !data || data.password_hash !== hashedPassword) {
                                    errorEl.textContent = 'Неверный логин или пароль';
                                    return;
                                }
                                if (data.banned) { showBanScreen(); return; }

                                currentAuthUser = data;
                                localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                                userIdentifier = getUserIdentifier();
                                playSfx('success');
                                container.innerHTML = '';
                                await initApp();
                            } else {
                                const { data: existing } = await supabaseClient
                                    .from('app_users')
                                    .select('id')
                                    .eq('username', username)
                                    .maybeSingle();

                                if (existing) {
                                    errorEl.textContent = 'Такой логин уже занят';
                                    return;
                                }

                                const newUser = {
                                    username: username,
                                    password_hash: hashedPassword,
                                    telegram_id: currentUser.id || null,
                                    telegram_username: currentUser.username || null,
                                    banned: false,
                                    is_admin: username === OWNER_USERNAME,
                                    created_at: new Date().toISOString()
                                };

                                const { data: inserted, error: insertErr } = await supabaseClient
                                    .from('app_users')
                                    .insert(newUser)
                                    .select()
                                    .single();

                                if (insertErr) throw insertErr;

                                currentAuthUser = inserted;
                                localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                                userIdentifier = getUserIdentifier();
                                playSfx('success');
                                container.innerHTML = '';
                                await initApp();
                            }
                        } catch (e) {
                            console.error(e);
                            errorEl.textContent = 'Ошибка сохранения данных в базу';
                        }
                    });
                }
                renderAuthForm();
            }

            async function initApp() {
                if (!currentAuthUser) { showAuthScreen(); return; }
                userIdentifier = getUserIdentifier();
                await loadUserData();
                switchSection('home');
            }

            async function loadUserData() {
                try {
                    const { data } = await supabaseClient
                        .from('app_users')
                        .select('*')
                        .eq('id', currentAuthUser.id)
                        .single();
                    if (data) {
                        currentAuthUser = data;
                        isAdmin = data.is_admin || (data.username === OWNER_USERNAME);
                        isOwner = data.username === OWNER_USERNAME;
                    }
                } catch (e) {}
                const adminBtn = document.getElementById('adminNavBtn');
                if (isAdmin) adminBtn.classList.remove('hidden');
                else adminBtn.classList.add('hidden');
            }

            function switchSection(section) {
                currentSection = section;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById('section-' + section).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
                if (navBtn) navBtn.classList.add('active');

                if (section === 'home') loadHomeFeed();
                if (section === 'cart') loadCart();
                if (section === 'send') { populateSendForm(); loadMyAds(); }
                if (section === 'admin') loadAdminPanel();
                playSfx('click');
            }

            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = btn.dataset.section;
                    if (sec === 'admin' && !isAdmin) return;
                    switchSection(sec);
                });
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', currentTheme);
                applyTheme();
            });

            document.getElementById('logoBtn').addEventListener('click', () => { currentFilterCategory = null; switchSection('home'); });

            async function loadHomeFeed() {
                const catContainer = document.getElementById('homeCategories');
                catContainer.innerHTML = `
                    <button class="badge ${!currentFilterCategory ? 'active' : ''}" data-cat-filter="">Все</button>
                    ${ALL_CATEGORIES.map(c => `<button class="badge ${currentFilterCategory === c.id ? 'active' : ''}" data-cat-filter="${c.id}">${c.label}</button>`).join('')}
                `;
                catContainer.querySelectorAll('[data-cat-filter]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentFilterCategory = btn.dataset.catFilter || null;
                        loadHomeFeed();
                    });
                });

                const container = document.getElementById('homeFeed');
                container.innerHTML = '<div class="loader"></div>';
                try {
                    let query = supabaseClient.from('ads').select('*').eq('status', 'approved').order('created_at', { ascending: false });
                    if (currentFilterCategory) query = query.eq('category', currentFilterCategory);
                    const { data } = await query;
                    homeAds = data || [];
                    renderHomeFeed();
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки ленты.</div>';
                }
            }

            function renderHomeFeed() {
                const container = document.getElementById('homeFeed');
                if (!homeAds.length) {
                    container.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>';
                    return;
                }
                let html = '';
                homeAds.forEach(ad => {
                    const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                    const imgSrc = firstImg || DEFAULT_AD_IMAGE;
                    const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                    const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                    html += `
                        <div class="card ad-card" data-ad-id="${ad.id}">
                            <img class="ad-card-img" src="${imgSrc}" onerror="this.src='${DEFAULT_AD_IMAGE}'" alt="">
                            <div class="ad-card-info">
                                <div class="ad-card-title">${ad.item_name || 'Без названия'}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)}</div>
                                <div class="ad-card-badges">
                                    ${modeBadge}
                                    <span class="badge server">${ad.server}</span>
                                    <span class="badge category">${catLabel}</span>
                                </div>
                                <div style="font-size:11px;color:var(--muted);">Автор: ${ad.author_id}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                container.querySelectorAll('.ad-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const ad = homeAds.find(a => a.id == card.dataset.adId);
                        if (ad) openAdDetail(ad);
                    });
                });
            }

            async function loadCart() {
                const container = document.getElementById('cartList');
                if (!currentAuthUser) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const { data: favs } = await supabaseClient.from('favorites').select('ad_id').eq('user_id', getUserId().toString());
                    const adIds = (favs || []).map(f => f.ad_id);
                    if (!adIds.length) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }
                    
                    const { data: ads } = await supabaseClient.from('ads').select('*').in('id', adIds);
                    cartAds = ads || [];
                    if (!cartAds.length) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }
                    
                    let html = '';
                    cartAds.forEach(ad => {
                        html += `
                            <div class="card" data-ad-id="${ad.id}">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:13px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                    </div>
                                    <button class="btn danger" data-remove-cart="${ad.id}">Удалить</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-remove-cart]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            await supabaseClient.from('favorites').delete().eq('user_id', getUserId().toString()).eq('ad_id', btn.dataset.removeCart);
                            loadCart();
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки корзины</div>';
                }
            }

            function populateSendForm() {
                document.getElementById('sendCategory').innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                document.getElementById('sendServer').innerHTML = ALL_SERVERS.map(s => `<option value="${s}">${s}</option>`).join('');
            }

            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!currentAuthUser) return;
                const mode = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const itemName = document.getElementById('sendName').value.trim();
                const priceRaw = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const images = document.getElementById('sendImages').value.trim();
                const server = document.getElementById('sendServer').value;

                if (!itemName || !priceRaw || !description) {
                    showAlert('Ошибка', 'Заполните обязательные поля');
                    return;
                }

                const newAd = {
                    mode, category,
                    item_name: itemName,
                    price: parsePriceToNumber(priceRaw),
                    description, images, server,
                    author_id: userIdentifier,
                    author_user_id: getUserId().toString(),
                    status: 'pending',
                    created_at: new Date().toISOString()
                };

                try {
                    await supabaseClient.from('ads').insert(newAd);
                    playSfx('success');
                    showAlert('Успех', 'Объявление отправлено на модерацию', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось отправить объявление');
                }
            });

            async function loadMyAds() {
                const container = document.getElementById('myAdsList');
                if (!currentAuthUser) return;
                try {
                    const { data } = await supabaseClient.from('ads').select('*').eq('author_id', userIdentifier).order('created_at', { ascending: false });
                    myAds = data || [];
                    if (!myAds.length) { container.innerHTML = '<div class="empty-state">У вас нет объявлений</div>'; return; }
                    
                    let html = '';
                    myAds.forEach(ad => {
                        let statusBadge = ad.status === 'pending' ? '<span class="badge status-pending">На модерации</span>' : '<span class="badge status-approved">Одобрено</span>';
                        html += `
                            <div class="card">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                        <div style="margin-top:4px;">${statusBadge}</div>
                                    </div>
                                    <button class="btn danger" data-del-my="${ad.id}">Удалить</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-del-my]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('ads').delete().eq('id', btn.dataset.delMy);
                            loadMyAds();
                        });
                    });
                } catch (e) {}
            }

            async function loadAdminPanel() {
                const container = document.getElementById('adminPanelContent');
                if (!isAdmin) { container.innerHTML = '<div class="empty-state">Нет доступа</div>'; return; }
                try {
                    const { data } = await supabaseClient.from('ads').select('*').eq('status', 'pending');
                    pendingAds = data || [];
                    let html = '<h3>📋 На модерации</h3>';
                    if (!pendingAds.length) html += '<div class="empty-state">Нет объявлений</div>';
                    else pendingAds.forEach(ad => {
                        html += `
                            <div class="card">
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:12px;color:var(--muted);">${ad.server} • ${ad.author_id} • ${formatPrice(ad.price)}</div>
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success w-full" data-approve="${ad.id}">Одобрить</button>
                                    <button class="btn danger w-full" data-reject="${ad.id}">Отклонить</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-approve]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('ads').update({ status: 'approved' }).eq('id', btn.dataset.approve);
                            loadAdminPanel();
                        });
                    });
                    container.querySelectorAll('[data-reject]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
                            loadAdminPanel();
                        });
                    });
                } catch (e) {}
            }

            async function openAdDetail(ad) {
                const images = ad.images ? ad.images.split(',').map(s => s.trim()).filter(Boolean) : [];
                const galleryHtml = images.length ? '<div class="image-gallery">' + images.map(img => `<img src="${img}">`).join('') + '</div>' : '';
                
                showModal(`
                    <h3 class="modal-title">${ad.item_name}</h3>
                    ${galleryHtml}
                    <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px;">${formatPrice(ad.price)}</div>
                    <p style="color:var(--muted);margin-bottom:12px;">${ad.description || 'Нет описания'}</p>
                    <button class="btn w-full mb-8" id="contactAuthorBtn">Связаться в Telegram</button>
                    <button class="btn secondary w-full" id="addToCartBtn">В корзину</button>
                `);

                document.getElementById('contactAuthorBtn').addEventListener('click', () => {
                    window.open(`https://t.me/${ad.author_id.replace('@', '')}`, '_blank');
                });
                document.getElementById('addToCartBtn').addEventListener('click', async () => {
                    await supabaseClient.from('favorites').insert({ user_id: getUserId().toString(), ad_id: ad.id });
                    playSfx('success');
                    showAlert('Успех', 'Добавлено в корзину', 'success');
                });
            }

            if (initSupabase()) {
                initTelegram();
                checkAuth();
            }
        })();
    </script>
</body>
</html>
