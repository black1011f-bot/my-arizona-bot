<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF; --card: #FFFFFF; --border: #E8E8EC; --accent: #005BFF; --gold: #FF9900;
            --text: #1A1A1A; --muted: #8A8A8E; --shadow: 0 2px 12px rgba(0,0,0,0.08);
            --radius: 12px; --btn-min-height: 44px; --container-width: 480px; --nav-height: 60px;
            --header-height: 56px; --font: 'Montserrat', sans-serif; --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E; --card: #2C2C2E; --border: #3A3A3C; --accent: #0A84FF; --gold: #FFD60A;
            --text: #FFFFFF; --muted: #A0A0A5; --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width); margin: 0 auto; padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px); padding-bottom: calc(var(--nav-height) + 20px); transition: max-width 0.3s;
        }
        @media (min-width: 768px) { 
            :root { --container-width: 720px; } 
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; } 
            .ad-card { width: 100%; } 
        }
        @media (min-width: 1024px) { 
            :root { --container-width: 1200px; } 
            .ads-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; } 
        }
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--bg);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 8px 12px;
            height: var(--header-height); gap: 8px; transition: background 0.3s, border-color 0.3s;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .header-logo { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; cursor: pointer; }
        .header-search input {
            width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-size: 14px; outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s; pointer-events: none;
        }
        .theme-toggle { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; transition: transform 0.2s; flex-shrink: 0; }
        .theme-toggle:active { transform: scale(0.9); }
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center; height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom); transition: background 0.3s, border-color 0.3s;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer;
            padding: 4px 8px; border-radius: 8px; transition: color 0.3s, transform 0.2s, background 0.2s;
            flex: 1; max-width: 80px; min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0, 91, 255, 0.08); }
        .nav-item:active { transform: scale(0.92); }
        .section { display: none; opacity: 0; transform: translateY(10px); transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }
        .card {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow);
            padding: 12px; margin-bottom: 10px; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s, opacity 0.3s; cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .card.inactive-card { background: rgba(128,128,128,0.12) !important; opacity: 0.75; }
        [data-theme="dark"] .card.inactive-card { background: rgba(255,255,255,0.04) !important; opacity: 0.65; }
        .ad-card { display: flex; gap: 10px; align-items: flex-start; }
        .ad-card-img { width: 80px; height: 100px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--border); color: var(--text); white-space: nowrap; }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }
        .ad-card-author { font-size: 11px; color: var(--muted); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px;
            border-radius: var(--radius); border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
            cursor: pointer; transition: transform 0.2s, opacity 0.2s, background 0.3s; touch-action: manipulation; min-height: var(--btn-min-height);
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn.success { background: #34c759; color: #fff; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 200;
            display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; transition: opacity 0.25s ease;
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative;
            transform: translateY(20px); transition: transform 0.25s ease, background 0.3s, border-color 0.3s;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 24px; cursor: pointer;
            color: var(--muted); padding: 4px; line-height: 1; z-index: 5; transition: transform 0.2s;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 16px; padding-right: 30px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 14px; outline: none; transition: border-color 0.3s, background 0.3s, color 0.3s;
            font-family: var(--font);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 500; }
        .tutorial-overlay, .fullscreen-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; transition: background 0.3s;
        }
        .tutorial-slide { max-width: 420px; width: 100%; }
        .tutorial-slide h2 { font-weight: 900; font-size: 24px; margin-bottom: 12px; }
        .tutorial-slide p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .tutorial-nav { display: flex; gap: 10px; margin-top: 15px; }
        .game-click-area {
            width: 100%; max-width: 220px; aspect-ratio: 1; margin: 0 auto 20px; cursor: pointer; border-radius: 50%;
            overflow: hidden; border: 4px solid var(--border); transition: transform 0.1s, border-color 0.3s;
            user-select: none; -webkit-user-select: none; touch-action: manipulation; box-shadow: var(--shadow);
        }
        .game-click-area:active { transform: scale(0.92); }
        .game-click-area img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile {
            padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card);
            text-align: center; cursor: pointer; font-weight: 700; font-size: 13px; transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .grid-tile:active { transform: scale(0.95); }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; }
        .w-full { width: 100%; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
        .auth-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 1000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-box {
            width: 100%; max-width: 400px; background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); padding: 24px; box-shadow: var(--shadow);
        }
    </style>
</head>
<body>
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" autocomplete="off" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>

    <main class="container" id="mainContainer">
        <section class="section active" id="section-home">
            <div id="homeCategories" style="margin-bottom: 12px; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;"></div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>

        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group"><label>Тип сделки</label><select id="sendType"><option value="sell">Продажа</option><option value="buy">Покупка</option></select></div>
                <div class="form-group"><label>Категория</label><select id="sendCategory"></select></div>
                <div class="form-group"><label>Название</label><input type="text" id="sendName" placeholder="Введите название товара"></div>
                <div class="form-group"><label>Цена</label><input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text"></div>
                <div class="form-group"><label>Описание</label><textarea id="sendDescription" placeholder="Подробное описание"></textarea></div>
                <div class="form-group"><label>Скриншоты (ссылки через запятую, до 20)</label><input type="text" id="sendImages" placeholder="https://..."><div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div></div>
                <div class="form-group"><label>Сервер</label><select id="sendServer"></select></div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>

        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Все разделы</span></button>
    </nav>

    <div id="modalContainer"></div>
    <div id="tutorialContainer"></div>
    <div id="authContainer"></div>

    <script>
        (function() {
            // =========================================================================
            // КОНСТАНТЫ И НАСТРОЙКИ
            // =========================================================================
            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Phoenix','Tucson','Scottdale','Chandler','Brainburg','Saint-Rose','Mesa','Red-Rock','Yuma',
                'Surprise','Prescott','Glendale','Kingman','Winslow','Payson','Gilbert','Show-Low','Casa-Grande',
                'Page','Sun-City','Queen-Creek','Sedona','Holiday','Wednesday','Yava','Faraway','Bumble-Bee',
                'Christmas','Mirage','Love','Drake','Space','Home','Mobile I','Mobile II','Mobile III'
            ];
            const ALL_CATEGORIES = [
                { id: 'accessories', label: '💍 Аксессуары' },
                { id: 'transport', label: '🚗 Транспорт' },
                { id: 'realestate', label: '🏠 Недвижимость' },
                { id: 'business', label: '💼 Бизнесы' },
                { id: 'weapons', label: '🔫 Оружие' },
                { id: 'clothing', label: '👕 Одежда' },
                { id: 'electronics', label: '📱 Электроника' }
            ];
            const ALLOWED_DOMAINS = ['youtube.com','youtu.be','radikal.cloud','allwebs.ru','postimages.org','ru.imgbb.com'];
            const DEFAULT_AD_IMAGE = 'https://i.postimg.cc/zDwTPKwq/0465dd7cc4f5446e5e908000ec4379bb.jpg';
            const SUPABASE_URL = 'https://sbtitlayqkpllnaiyeld.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_bVZYBWwjdsPMfbbRglAFbw_fP-8ClPO';

            // =========================================================================
            // ГЛОБАЛЬНОЕ СОСТОЯНИЕ
            // =========================================================================
            let tg = window.Telegram?.WebApp || null;
            let supabase = null;
            let currentAuthUser = JSON.parse(localStorage.getItem('arizona_current_user') || 'null');
            let currentSection = 'home';
            let currentTheme = localStorage.getItem('theme') || 'light';
            let sfxEnabled = localStorage.getItem('sfx') !== 'off';
            let currentFilterCategory = null;
            let isAdmin = false;
            let isOwner = false;
            let audioCtx = null;
            let gameState = { money: 0, clickPower: 1, clickCost: 50, autoIncome: 0, autoCost: 200 };
            let homeAds = [], cartAds = [], myAds = [];

            // =========================================================================
            // ИНИЦИАЛИЗАЦИЯ SUPABASE
            // =========================================================================
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                } else {
                    console.error('Supabase SDK не найден в window');
                }
            } catch (e) {
                console.error('Ошибка инициализации Supabase:', e);
            }

            // =========================================================================
            // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
            // =========================================================================
            function withTimeout(promise, ms = 8000) {
                return Promise.race([
                    promise,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Превышено время ожидания сервера')), ms))
                ]);
            }

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300 };
                    osc.frequency.value = freqs[type] || 600;
                    gain.gain.value = 0.08;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                } catch (e) {}
            }

            function applyTheme() { document.documentElement.setAttribute('data-theme', currentTheme); }
            applyTheme();

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', currentTheme);
                applyTheme();
                playSfx('click');
            });

            document.getElementById('logoBtn').addEventListener('click', () => { currentFilterCategory = null; switchSection('home'); });

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000; else if (kCount === 2) base *= 1000000; else if (kCount === 3) base *= 1000000000;
                    return base;
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'к';
                return num.toString();
            }

            function isAllowedLink(url) {
                try {
                    const u = new URL(url);
                    const host = u.hostname.replace('www.', '');
                    return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                } catch (e) { return false; }
            }

            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div class="modal-overlay" id="modalOverlay">
                        <div class="modal" id="modalBox">
                            <button class="modal-close" id="modalCloseBtn">✕</button>
                            ${html}
                        </div>
                    </div>
                `;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                setTimeout(() => overlay.classList.add('show'), 10);
                function closeModal() {
                    overlay.classList.remove('show');
                    setTimeout(() => { overlay.remove(); if (onClose) onClose(); }, 250);
                }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
                return { overlay, closeModal };
            }

            function showAlert(title, message, type = 'info') {
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                const { closeModal } = showModal(`
                    <div style="text-align:center;">
                        <div style="font-size:40px;margin-bottom:10px;">${icon}</div>
                        <h3 class="modal-title" style="text-align:center;">${title}</h3>
                        <p style="color:var(--muted);margin-bottom:16px;font-size:14px;">${message}</p>
                        <button class="btn w-full" id="alertOkBtn">ОК</button>
                    </div>
                `);
                document.getElementById('alertOkBtn').addEventListener('click', closeModal);
            }

            // =========================================================================
            // ВХОД И АВТОРИЗАЦИЯ
            // =========================================================================
            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function initAuth() {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const tgUser = tg.initDataUnsafe.user;
                    const tgId = tgUser.id.toString();
                    const tgUsername = (tgUser.username || `tg_${tgId}`).toLowerCase();

                    if (supabase) {
                        try {
                            let { data } = await supabase.from('app_users').select('*').eq('telegram_id', tgId).maybeSingle();
                            if (!data) {
                                const { data: newUser } = await supabase.from('app_users').insert({
                                    telegram_id: tgId,
                                    username: tgUsername,
                                    is_admin: tgUsername === OWNER_USERNAME,
                                    banned: false
                                }).select().single();
                                data = newUser;
                            }
                            currentAuthUser = data;
                            localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                        } catch (e) { console.warn('TG Sync Error', e); }
                    }
                }

                if (!currentAuthUser) {
                    showAuthScreen();
                } else {
                    await startApp();
                }
            }

            function showAuthScreen() {
                const container = document.getElementById('authContainer');
                let mode = 'login';
                function renderForm() {
                    container.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-box">
                                <h2 style="text-align:center; margin-bottom:8px;">Arizona RP</h2>
                                <p style="text-align:center; font-size:13px; color:var(--muted); margin-bottom:20px;">
                                    Синхронизация данных между вашими устройствами
                                </p>
                                <div style="display:flex; margin-bottom:16px; border-bottom:1px solid var(--border);">
                                    <button type="button" id="tabLogin" style="flex:1; padding:8px; background:none; border:none; cursor:pointer; font-weight:700; color:${mode === 'login' ? 'var(--accent)' : 'var(--muted)'}; border-bottom:2px solid ${mode === 'login' ? 'var(--accent)' : 'transparent'};">Вход</button>
                                    <button type="button" id="tabRegister" style="flex:1; padding:8px; background:none; border:none; cursor:pointer; font-weight:700; color:${mode === 'register' ? 'var(--accent)' : 'var(--muted)'}; border-bottom:2px solid ${mode === 'register' ? 'var(--accent)' : 'transparent'};">Регистрация</button>
                                </div>
                                <div class="form-group"><label>Логин / Username</label><input type="text" id="authUsername" placeholder="Введите логин"></div>
                                <div class="form-group"><label>Пароль</label><input type="password" id="authPassword" placeholder="Введите пароль"></div>
                                <button type="button" class="btn w-full" id="authSubmitBtn">${mode === 'login' ? 'Войти' : 'Создать аккаунт'}</button>
                                <p id="authError" style="color:#ff3b30; font-size:12px; margin-top:10px; text-align:center;"></p>
                            </div>
                        </div>
                    `;
                    document.getElementById('tabLogin').addEventListener('click', () => { mode = 'login'; renderForm(); });
                    document.getElementById('tabRegister').addEventListener('click', () => { mode = 'register'; renderForm(); });

                    document.getElementById('authSubmitBtn').addEventListener('click', async () => {
                        const err = document.getElementById('authError');
                        err.textContent = '';
                        const username = document.getElementById('authUsername').value.trim().toLowerCase();
                        const password = document.getElementById('authPassword').value.trim();
                        if (!username || !password) { err.textContent = 'Заполните все поля'; return; }

                        if (!supabase) { err.textContent = 'Ошибка подключения к серверу'; return; }

                        try {
                            const pwdHash = await hashPassword(password);
                            if (mode === 'login') {
                                const { data } = await supabase.from('app_users').select('*').eq('username', username).maybeSingle();
                                if (!data || data.password_hash !== pwdHash) { err.textContent = 'Неверный логин или пароль'; return; }
                                if (data.banned) { showAlert('Ошибка', 'Ваш аккаунт заблокирован', 'error'); return; }
                                currentAuthUser = data;
                            } else {
                                const { data: existing } = await supabase.from('app_users').select('id').eq('username', username).maybeSingle();
                                if (existing) { err.textContent = 'Логин уже занят'; return; }
                                const { data: inserted } = await supabase.from('app_users').insert({
                                    username, password_hash: pwdHash, is_admin: username === OWNER_USERNAME, banned: false
                                }).select().single();
                                currentAuthUser = inserted;
                            }
                            localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                            container.innerHTML = '';
                            await startApp();
                        } catch (e) {
                            err.textContent = ' Ошибка авторизации: ' + e.message;
                        }
                    });
                }
                renderForm();
            }

            async function startApp() {
                if (currentAuthUser) {
                    isAdmin = currentAuthUser.is_admin || currentAuthUser.username === OWNER_USERNAME;
                    isOwner = currentAuthUser.username === OWNER_USERNAME;
                    if (isAdmin) document.getElementById('adminNavBtn').classList.remove('hidden');
                }
                populateSendForm();
                switchSection('home');
            }

            // =========================================================================
            // НАВИГАЦИЯ
            // =========================================================================
            function switchSection(section) {
                currentSection = section;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                const target = document.getElementById('section-' + section);
                if (target) target.classList.add('active');

                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
                if (navBtn) navBtn.classList.add('active');

                if (section === 'home') loadHomeFeed();
                if (section === 'cart') loadCart();
                if (section === 'send') loadMyAds();
                if (section === 'admin' && isAdmin) loadAdminPanel();
                if (section === 'all') loadAllTiles();

                playSfx('click');
            }

            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => switchSection(btn.dataset.section));
            });

            // =========================================================================
            // ГЛАВНАЯ ЛЕНТА
            // =========================================================================
            async function loadHomeFeed() {
                const catContainer = document.getElementById('homeCategories');
                catContainer.innerHTML = `
                    <button class="badge category ${!currentFilterCategory ? 'active' : ''}" style="cursor:pointer;padding:6px 12px;" data-cat="">Все</button>
                    ${ALL_CATEGORIES.map(c => `<button class="badge category ${currentFilterCategory === c.id ? 'active' : ''}" style="cursor:pointer;padding:6px 12px;" data-cat="${c.id}">${c.label}</button>`).join('')}
                `;
                catContainer.querySelectorAll('[data-cat]').forEach(b => {
                    b.addEventListener('click', () => { currentFilterCategory = b.dataset.cat || null; loadHomeFeed(); });
                });

                const container = document.getElementById('homeFeed');
                container.innerHTML = '<div class="empty-state">Загрузка объявлений...</div>';

                if (!supabase) { container.innerHTML = '<div class="empty-state">Офлайн режим. Сервер недоступен.</div>'; return; }

                try {
                    let q = supabase.from('ads').select('*').eq('status', 'approved').order('created_at', { ascending: false });
                    if (currentFilterCategory) q = q.eq('category', currentFilterCategory);
                    const { data, error } = await withTimeout(q);
                    if (error) throw error;
                    homeAds = data || [];
                    renderHomeFeed();
                } catch (e) {
                    container.innerHTML = `<div class="empty-state">Ошибка загрузки: ${e.message}</div>`;
                }
            }

            function renderHomeFeed() {
                const container = document.getElementById('homeFeed');
                if (!homeAds.length) { container.innerHTML = '<div class="empty-state">Объявлений пока нет</div>'; return; }
                container.innerHTML = homeAds.map(ad => {
                    const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                    const imgSrc = firstImg || DEFAULT_AD_IMAGE;
                    const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                    return `
                        <div class="card ad-card" data-ad-id="${ad.id}">
                            <img class="ad-card-img" src="${imgSrc}" onerror="this.src='${DEFAULT_AD_IMAGE}'" alt="">
                            <div class="ad-card-info">
                                <div class="ad-card-title">${ad.item_name}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)}</div>
                                <div class="ad-card-badges">
                                    <span class="badge ${ad.type === 'sell' ? 'sell' : 'buy'}">${ad.type === 'sell' ? 'Продажа' : 'Покупка'}</span>
                                    <span class="badge server">${ad.server}</span>
                                    <span class="badge category">${catLabel}</span>
                                </div>
                                <div class="ad-card-author">Автор: @${ad.author_username || 'пользователь'}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.ad-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const ad = homeAds.find(a => a.id == card.dataset.adId);
                        if (ad) openAdDetail(ad);
                    });
                });
            }

            function openAdDetail(ad) {
                showModal(`
                    <div>
                        <h3 class="modal-title">${ad.item_name}</h3>
                        <div style="font-size:20px;font-weight:800;color:var(--accent);margin-bottom:12px;">${formatPrice(ad.price)}</div>
                        <p style="margin-bottom:12px;white-space:pre-wrap;">${ad.description || 'Без описания'}</p>
                        <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Сервер: ${ad.server} • Автор: @${ad.author_username}</div>
                        <button class="btn w-full gold mb-8" id="addToCartBtn">🛒 Добавить в корзину</button>
                        <a class="btn w-full success" href="https://t.me/${ad.author_username}" target="_blank" style="text-decoration:none;">💬 Написать продавцу</a>
                    </div>
                `);

                document.getElementById('addToCartBtn').addEventListener('click', async () => {
                    if (!supabase || !currentAuthUser) return;
                    await supabase.from('favorites').insert({ user_id: currentAuthUser.id, ad_id: ad.id });
                    showAlert('Успех', 'Объявление добавлено в корзину!', 'success');
                });
            }

            // =========================================================================
            // КОРЗИНА
            // =========================================================================
            async function loadCart() {
                const container = document.getElementById('cartList');
                container.innerHTML = '<div class="empty-state">Загрузка корзины...</div>';
                if (!supabase || !currentAuthUser) return;

                try {
                    const { data: favs } = await supabase.from('favorites').select('ad_id').eq('user_id', currentAuthUser.id);
                    if (!favs || !favs.length) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }
                    
                    const adIds = favs.map(f => f.ad_id);
                    const { data: ads } = await supabase.from('ads').select('*').in('id', adIds);
                    cartAds = ads || [];

                    container.innerHTML = cartAds.map(ad => `
                        <div class="card flex-between">
                            <div>
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:13px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                            </div>
                            <button class="btn danger" data-remove-fav="${ad.id}">Удалить</button>
                        </div>
                    `).join('');

                    container.querySelectorAll('[data-remove-fav]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabase.from('favorites').delete().eq('user_id', currentAuthUser.id).eq('ad_id', btn.dataset.removeFav);
                            loadCart();
                        });
                    });
                } catch (e) { container.innerHTML = '<div class="empty-state">Ошибка загрузки корзины</div>'; }
            }

            // =========================================================================
            // ПОДАЧА И МОИ ОБЪЯВЛЕНИЯ
            // =========================================================================
            function populateSendForm() {
                document.getElementById('sendCategory').innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                document.getElementById('sendServer').innerHTML = ALL_SERVERS.map(s => `<option value="${s}">${s}</option>`).join('');
            }

            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                const name = document.getElementById('sendName').value.trim();
                const price = document.getElementById('sendPrice').value.trim();
                const desc = document.getElementById('sendDescription').value.trim();
                const images = document.getElementById('sendImages').value.trim();
                const type = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const server = document.getElementById('sendServer').value;

                if (!name || !price) { showAlert('Ошибка', 'Введите название и цену', 'error'); return; }

                if (images) {
                    const links = images.split(',').map(s => s.trim());
                    for (let l of links) {
                        if (l && !isAllowedLink(l)) {
                            showAlert('Ошибка', `Ссылка ${l} не разрешена! Используйте только допустимые хостинги.`, 'error');
                            return;
                        }
                    }
                }

                if (!supabase || !currentAuthUser) return;

                try {
                    await supabase.from('ads').insert({
                        author_id: currentAuthUser.id,
                        author_username: currentAuthUser.username,
                        type, category, item_name: name, price, description: desc, images, server, status: 'pending'
                    });
                    showAlert('Успех', 'Объявление отправлено на модерацию!', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) { showAlert('Ошибка', 'Не удалось отправить: ' + e.message, 'error'); }
            });

            async function loadMyAds() {
                const container = document.getElementById('myAdsList');
                if (!supabase || !currentAuthUser) return;
                const { data } = await supabase.from('ads').select('*').eq('author_id', currentAuthUser.id).order('created_at', { ascending: false });
                myAds = data || [];
                if (!myAds.length) { container.innerHTML = '<div class="empty-state">Вы ещё не отправляли объявлений</div>'; return; }

                container.innerHTML = myAds.map(ad => `
                    <div class="card flex-between">
                        <div>
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                            <div style="margin-top:4px;">
                                <span class="badge status-${ad.status}">${ad.status === 'pending' ? 'На модерации' : ad.status === 'approved' ? 'Одобрено' : 'Отклонено'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            // =========================================================================
            // АДМИН-ПАНЕЛЬ
            // =========================================================================
            async function loadAdminPanel() {
                const container = document.getElementById('adminPanelContent');
                if (!isAdmin) { container.innerHTML = '<div class="empty-state">У вас нет прав администратора</div>'; return; }
                container.innerHTML = '<div class="empty-state">Загрузка заявок...</div>';

                const { data: pending } = await supabase.from('ads').select('*').eq('status', 'pending').order('created_at', { ascending: false });
                if (!pending || !pending.length) { container.innerHTML = '<div class="empty-state">Нет объявлений на модерации</div>'; return; }

                container.innerHTML = pending.map(ad => `
                    <div class="card" style="margin-bottom:12px;">
                        <div style="font-weight:800;font-size:16px;">${ad.item_name}</div>
                        <div style="font-size:14px;color:var(--accent);margin:4px 0;">${formatPrice(ad.price)} (${ad.server})</div>
                        <p style="font-size:13px;margin-bottom:10px;">${ad.description || 'Без описания'}</p>
                        <div class="flex-between gap-8">
                            <button class="btn success w-full" data-approve="${ad.id}">✅ Одобрить</button>
                            <button class="btn danger w-full" data-reject="${ad.id}">❌ Отклонить</button>
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('[data-approve]').forEach(b => {
                    b.addEventListener('click', async () => {
                        await supabase.from('ads').update({ status: 'approved' }).eq('id', b.dataset.approve);
                        loadAdminPanel();
                    });
                });

                container.querySelectorAll('[data-reject]').forEach(b => {
                    b.addEventListener('click', async () => {
                        await supabase.from('ads').update({ status: 'deleted' }).eq('id', b.dataset.reject);
                        loadAdminPanel();
                    });
                });
            }

            // =========================================================================
            // ВСЕ РАЗДЕЛЫИ ИГРА «БАРЫГА»
            // =========================================================================
            function loadAllTiles() {
                const container = document.getElementById('allTiles');
                container.innerHTML = `
                    <div class="grid-tile" id="tileBaryga"><span class="tile-icon">💰</span>Игра «Барыга»</div>
                    <div class="grid-tile" id="tileLooks"><span class="tile-icon">👕</span>Лента Луков</div>
                    <div class="grid-tile" id="tileTravel"><span class="tile-icon">🚗</span>Попутчики</div>
                    <div class="grid-tile" id="tileMusic"><span class="tile-icon">🎵</span>Музыка</div>
                `;

                document.getElementById('tileBaryga').addEventListener('click', openBarygaGame);
                document.getElementById('tileLooks').addEventListener('click', () => showAlert('Раздел', 'Лента луков доступна в следующем обновлении'));
                document.getElementById('tileTravel').addEventListener('click', () => showAlert('Раздел', 'Раздел Попутчики в разработке'));
                document.getElementById('tileMusic').addEventListener('click', () => showAlert('Музыка', 'Фоновая музыка активна'));
            }

            function openBarygaGame() {
                showModal(`
                    <div style="text-align:center;">
                        <h3 class="modal-title">💰 Игра «Барыга»</h3>
                        <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:16px;" id="gameMoney">$${gameState.money}</div>
                        <div class="game-click-area" id="clickArea">
                            <img src="https://i.postimg.cc/3RnGkVNw/4827782b1f3adf82a5db028d6ed0e8a7.jpg" alt="Барыга">
                        </div>
                        <button class="btn w-full gold mb-8" id="upgradeClickBtn">Улучшить клик (Cost: $${gameState.clickCost})</button>
                    </div>
                `);

                const moneyEl = document.getElementById('gameMoney');
                const clickArea = document.getElementById('clickArea');
                const upgradeBtn = document.getElementById('upgradeClickBtn');

                clickArea.addEventListener('click', () => {
                    gameState.money += gameState.clickPower;
                    moneyEl.textContent = `$${gameState.money}`;
                    playSfx('click');
                });

                upgradeBtn.addEventListener('click', () => {
                    if (gameState.money >= gameState.clickCost) {
                        gameState.money -= gameState.clickCost;
                        gameState.clickPower += 1;
                        gameState.clickCost = Math.floor(gameState.clickCost * 1.8);
                        moneyEl.textContent = `$${gameState.money}`;
                        upgradeBtn.textContent = `Улучшить клик (Cost: $${gameState.clickCost})`;
                        playSfx('success');
                    } else {
                        showAlert('Ошибка', 'Недостаточно средств', 'error');
                    }
                });
            }

            // =========================================================================
            // ЗАПУСК
            // =========================================================================
            initAuth();
        })();
    </script>
</body>
</html>
