<!DOCTYPE html>
<html lang="ru" data-font-size="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arizona Online × Bounty Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0F0A1E;--bg-2:#150F28;--card:#1A1230;--card-2:#221844;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
  --text:#F5F1FA;--text-soft:#D4CCE8;--muted:#8A7FA8;--muted-2:#5A517A;
  --accent:#8B5CF6;--accent-2:#22D3EE;--accent-3:#EC4899;
  --accent-soft:rgba(139,92,246,.18);--accent-glow:rgba(139,92,246,.45);
  --cyan-soft:rgba(34,211,238,.15);--pink-soft:rgba(236,72,153,.15);
  --success:#22C55E;--success-soft:rgba(34,197,94,.15);
  --danger:#EF4444;--danger-soft:rgba(239,68,68,.18);
  --warning:#F59E0B;--warning-soft:rgba(245,158,11,.15);
  --info:#3B82F6;--info-soft:rgba(59,130,246,.15);
  --grad-aurora:linear-gradient(135deg,#8B5CF6,#22D3EE);
  --grad-sunset:linear-gradient(135deg,#F97316,#EC4899 50%,#8B5CF6);
  --grad-mix:linear-gradient(135deg,#8B5CF6,#EC4899 50%,#F97316);
  --grad-flow:linear-gradient(90deg,#8B5CF6,#22D3EE,#EC4899,#F97316,#8B5CF6);
  --glass:rgba(26,18,48,.75);--glass-2:rgba(255,255,255,.04);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-md:0 8px 24px rgba(0,0,0,.5);
  --shadow-lg:0 20px 60px rgba(0,0,0,.65);
  --radius:18px;--radius-sm:12px;--radius-xs:8px;--radius-pill:999px;
  --btn-min-height:48px;--header-height:64px;--nav-height:68px;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Space Grotesk',monospace;
  --fs-base:16px;--fs-sm:.72rem;--fs-lg:1.05rem;
}
[data-theme="light"]{
  --bg:#FFF8F5;--bg-2:#FDF2F8;--card:#FFFFFF;--card-2:#FEF8FE;
  --border:rgba(15,10,30,.08);--border-strong:rgba(15,10,30,.16);
  --text:#1A0F2E;--text-soft:#3D2E5C;--muted:#7A6B94;--muted-2:#B0A2C9;
  --accent:#7C3AED;--accent-2:#0891B2;--accent-3:#DB2777;
  --accent-soft:rgba(124,58,237,.10);--accent-glow:rgba(124,58,237,.30);
  --cyan-soft:rgba(8,145,178,.10);--pink-soft:rgba(219,39,119,.10);
  --success:#16A34A;--success-soft:rgba(22,163,74,.12);
  --danger:#DC2626;--danger-soft:rgba(220,38,38,.12);
  --warning:#D97706;--warning-soft:rgba(217,119,6,.12);
  --info:#2563EB;--info-soft:rgba(37,99,235,.12);
  --glass:rgba(255,255,255,.78);--glass-2:rgba(15,10,30,.03);
  --shadow-sm:0 1px 2px rgba(15,10,30,.06);
  --shadow:0 4px 16px rgba(15,10,30,.08);
  --shadow-md:0 8px 24px rgba(15,10,30,.10);
  --shadow-lg:0 20px 60px rgba(15,10,30,.14);
}
html[data-font-size="small"]{--fs-base:14px;--fs-sm:.66rem;--fs-lg:.95rem}
html[data-font-size="medium"]{--fs-base:16px;--fs-sm:.72rem;--fs-lg:1.05rem}
html[data-font-size="large"]{--fs-base:18px;--fs-sm:.82rem;--fs-lg:1.18rem}
html.theme-changing *,html.theme-changing *::before,html.theme-changing *::after{transition:none !important;animation-duration:0s !important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:var(--font-body)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;touch-action:manipulation;font-size:var(--fs-base);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
::selection{background:var(--accent-soft);color:var(--accent)}
@keyframes brand-shift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.brand-animated{background:var(--grad-flow);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand-shift 5s linear infinite}
.brand-team-animated{background:var(--grad-flow);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand-shift 6s linear infinite reverse}
#splash-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;transition:opacity .4s,visibility .4s}
#splash-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-icon{width:88px;height:88px;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px var(--accent-glow),0 0 0 2px var(--border-strong);animation:splash-zoom 1.2s ease-out}
.splash-icon img{width:100%;height:100%;object-fit:cover}
.splash-title{font-weight:800;font-size:1.8rem;letter-spacing:-.02em;margin-top:.4rem}
.splash-subtitle{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
@keyframes splash-zoom{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.loader-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.loader-overlay.show{opacity:1;visibility:visible}
.loader-spinner-big{width:54px;height:54px;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent-2);border-radius:50%;animation:spin .9s linear infinite}
.loader-overlay-text{color:#fff;font-size:.88rem;font-weight:600;letter-spacing:.05em}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{border:2px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent-2);border-radius:50%;width:30px;height:30px;animation:spin .9s linear infinite;margin:20px auto}
.top-progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--grad-aurora);z-index:9997;transform:scaleX(0);transform-origin:left;transition:transform .25s,opacity .25s;opacity:0}
.top-progress.active{transform:scaleX(1);opacity:1}
.offline-banner{position:fixed;top:0;left:0;right:0;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--danger);color:#fff;font-size:.75rem;font-weight:600;text-align:center;z-index:9998;transform:translateY(-100%);transition:transform .25s}
.offline-banner.visible{transform:translateY(0)}
.guest-banner{position:fixed;top:calc(var(--header-height) + env(safe-area-inset-top));left:0;right:0;padding:8px 12px;background:var(--grad-sunset);color:#fff;font-size:.75rem;font-weight:600;text-align:center;z-index:99;display:none}
.guest-banner.visible{display:block}
.guest-banner button{background:rgba(255,255,255,.25);border:none;color:#fff;padding:.25rem .6rem;border-radius:6px;font-weight:700;font-size:.7rem;margin-left:.5rem;cursor:pointer}
.back-to-top{position:fixed;bottom:calc(var(--nav-height) + 14px + env(safe-area-inset-bottom));right:14px;width:42px;height:42px;border-radius:12px;background:var(--grad-aurora);color:#fff;border:none;box-shadow:0 4px 16px var(--accent-glow);cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;visibility:hidden;transform:translateY(15px);transition:opacity .25s,visibility .25s,transform .25s}
.back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
.container{max-width:100%;margin:0 auto;padding:.85rem;padding-top:calc(var(--header-height) + .85rem);padding-bottom:calc(var(--nav-height) + 1.5rem + env(safe-area-inset-bottom))}
@media(min-width:640px){.container{max-width:640px;padding:1rem;padding-top:calc(var(--header-height) + 1rem)}}
@media(min-width:900px){.container{max-width:900px}.ads-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.ads-grid .card{margin-bottom:0}}
@media(min-width:1200px){.container{max-width:1200px}.ads-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1500px){.container{max-width:1440px}.ads-grid{grid-template-columns:repeat(4,1fr)}}
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:.5rem .85rem;padding-top:calc(.5rem + env(safe-area-inset-top));height:calc(var(--header-height) + env(safe-area-inset-top));gap:.6rem}
.header-logo{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;cursor:pointer;border:1.5px solid var(--accent);transition:transform .2s}
.header-logo:active{transform:scale(.92)}
.header-logo img{width:100%;height:100%;object-fit:cover}
.header-brand{display:flex;align-items:center;gap:.5rem;flex-shrink:0;cursor:pointer;min-width:0}
.header-brand-text{display:flex;flex-direction:column;line-height:1}
.header-title{font-weight:800;font-size:.95rem;letter-spacing:-.02em;line-height:1.15}
.header-team{margin-top:3px;font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;line-height:1;white-space:nowrap}
@media(max-width:400px){.header-logo{width:34px;height:34px}.header-title{font-size:.85rem}.header-team{font-size:.55rem}}
.header-search{flex:1;cursor:pointer;min-width:0;position:relative}
.header-search input{width:100%;padding:.55rem .9rem;padding-right:4rem;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.82rem;outline:none;pointer-events:none}
.voice-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--accent-soft);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:.95rem;cursor:pointer;padding:4px 8px;z-index:2;font-family:inherit}
.voice-btn:active{transform:translateY(-50%) scale(.92)}
.voice-btn.listening{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse-rec 1s infinite}
@keyframes pulse-rec{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.1)}}
.theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:.95rem;cursor:pointer;flex-shrink:0;color:var(--text)}

/* ============================================================
   НИЖНИЙ ТАББАР — SVG-иконки с автоподсветкой
   ============================================================ */
.nav-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;height:var(--nav-height);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;
  color:var(--muted); /* базовый серый цвет — SVG наследует через currentColor */
  font-size:.62rem;font-weight:600;cursor:pointer;
  padding:.3rem .3rem;border-radius:10px;flex:1;max-width:78px;min-height:46px;
  position:relative;transition:color .2s ease, background .2s ease;
}
.nav-item:active{transform:scale(.95)}
.nav-item .nav-icon{
  width:22px;height:22px;flex-shrink:0;
  display:block;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .2s ease, filter .2s ease;
  opacity:.85;
}
.nav-item .nav-label{
  font-size:.62rem;
  font-weight:600;
  letter-spacing:.02em;
  color:currentColor;
  transition:color .2s ease;
}
/* Активная вкладка — цветная */
.nav-item.active{
  color:var(--accent);
  background:var(--accent-soft);
}
.nav-item.active .nav-icon{
  opacity:1;
  transform:scale(1.1) translateY(-1px);
  filter:drop-shadow(0 0 6px var(--accent-glow));
}
/* Полоска сверху для активной */
.nav-item.active::after{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:2px;border-radius:0 0 2px 2px;
  background:var(--accent);
  box-shadow:0 0 8px var(--accent-glow);
}

.section{display:none}
.section.active{display:block}
.section h2{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.9rem}
.section h3{font-size:1rem;font-weight:700;margin:1.2rem 0 .6rem}
@keyframes cardSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardSlideLeft{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes cardScaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes cardBlurIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:.9rem;margin-bottom:.75rem;cursor:pointer;transition:transform .12s,border-color .15s;position:relative}
.card:hover{border-color:var(--border-strong)}
.card:active{transform:scale(.99)}
.card.inactive-card{opacity:.55}
.card.viewed{opacity:.75}
.card.anim-0{animation:cardSlideUp .4s ease backwards}
.card.anim-1{animation:cardSlideLeft .4s ease backwards}
.card.anim-2{animation:cardScaleIn .4s ease backwards}
.card.anim-3{animation:cardBlurIn .4s ease backwards}
.ad-card{display:flex;gap:.75rem;align-items:flex-start;position:relative}
.ad-card-info{flex:1;min-width:0}
.ad-card-title{font-weight:700;font-size:.95rem;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.ad-card-price{font-family:var(--font-mono);font-weight:700;font-size:1.15rem;background:var(--grad-mix);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em;line-height:1.15}
.ad-card-badges{display:flex;gap:.25rem;flex-wrap:wrap;margin:.35rem 0 .25rem}
.ad-card-author{font-size:.7rem;color:var(--muted);margin-top:.2rem;font-weight:500;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.ad-card-rating{display:inline-flex;align-items:center;gap:.1rem;font-size:.66rem;color:var(--warning);font-weight:700}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;background:var(--grad-aurora);border-radius:50%;color:#fff;font-size:.5rem;font-weight:900}
.fav-heart{position:absolute;top:0;right:0;width:28px;height:28px;border-radius:8px;background:var(--glass-2);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;z-index:2}
.fav-heart.active{background:var(--pink-soft);color:var(--accent-3);border-color:var(--accent-3)}
.badge{display:inline-flex;align-items:center;padding:.18rem .55rem;border-radius:6px;font-size:.62rem;font-weight:700;background:var(--glass-2);color:var(--text-soft);white-space:nowrap;letter-spacing:.03em;line-height:1.3;text-transform:uppercase;border:1px solid var(--border)}
.badge.sell{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.buy{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.server{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.category{background:var(--cyan-soft);color:var(--accent-2);border-color:transparent}
.badge.status-pending{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.badge.status-deleted{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.status-approved{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.video{background:linear-gradient(135deg,rgba(239,68,68,.18),rgba(236,72,153,.18));color:#F87171;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:.82rem;cursor:pointer;min-height:var(--btn-min-height);transition:transform .12s,background .15s,border-color .15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--grad-aurora);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--glass-2);color:var(--text);border-color:var(--border)}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.gold{background:var(--grad-sunset);color:#fff;border-color:transparent}
.btn.success{background:transparent;color:var(--success);border-color:var(--success)}
.btn.success:hover{background:var(--success);color:#fff}
.btn.w-full{width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .18s;overscroll-behavior:contain}
.modal-overlay.show{opacity:1}
.modal{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:1.4rem;position:relative;transform:translateY(12px);transition:transform .2s;-webkit-overflow-scrolling:touch}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-close{position:absolute;top:.7rem;right:.7rem;background:var(--glass-2);border:1px solid var(--border);width:30px;height:30px;border-radius:8px;font-size:.9rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;z-index:2}
.modal-close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-title{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-bottom:.9rem;padding-right:2.2rem}
.form-group{margin-bottom:.85rem}
.form-group label{display:block;font-weight:600;font-size:.7rem;margin-bottom:.35rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.7rem .9rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:.88rem;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{min-height:90px;resize:vertical;font-family:inherit}
.input-with-voice{position:relative}
.input-with-voice input,.input-with-voice textarea{padding-right:2.6rem}
.voice-input-btn{position:absolute;right:6px;top:8px;background:var(--accent-soft);border:1px solid var(--border);color:var(--accent);width:30px;height:30px;border-radius:8px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;z-index:3}
.voice-input-btn.listening{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse-rec 1s infinite}
.auth-container{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--bg);overflow-y:auto}
.auth-background{position:absolute;inset:0;background-position:center;background-size:cover;z-index:-1}
.auth-background::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,10,30,.35),rgba(15,10,30,.55))}
[data-theme="light"] .auth-background::after{background:linear-gradient(135deg,rgba(255,248,245,.35),rgba(253,242,248,.55))}
.auth-box{width:100%;max-width:400px;background:var(--card);border-radius:20px;border:1px solid var(--border);padding:1.8rem 1.6rem;position:relative;z-index:1;margin:auto}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.4rem}
.auth-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid transparent;background-image:linear-gradient(var(--card),var(--card)),var(--grad-aurora);background-origin:border-box;background-clip:padding-box,border-box;padding:2px;flex-shrink:0}
.auth-brand-text{display:flex;flex-direction:column;line-height:1}
.auth-title{font-weight:800;font-size:1.3rem;letter-spacing:-.03em;line-height:1.1}
.auth-team{font-family:var(--font-mono);font-weight:700;font-size:.72rem;letter-spacing:.14em;margin-top:4px}
.auth-tabs{display:flex;margin-bottom:1.2rem;background:var(--glass-2);border-radius:10px;padding:3px}
.auth-tab{flex:1;padding:.6rem .4rem;background:none;border:none;cursor:pointer;font-weight:700;font-size:.8rem;color:var(--muted);letter-spacing:.03em;border-radius:8px;font-family:inherit}
.auth-tab.active{color:#fff;background:var(--grad-aurora)}

function launchConfetti(duration){
  duration=duration||2800;
  const cv=$('confetti-canvas');if(!cv||confettiActive)return;
  confettiActive=true;
  const ctx=cv.getContext('2d');
  let w=cv.width=window.innerWidth,h=cv.height=window.innerHeight;
  const colors=['#8B5CF6','#22D3EE','#EC4899','#F97316','#FACC15','#22C55E'];
  const parts=[];
  for(let i=0;i<120;i++)parts.push({x:Math.random()*w,y:-20-Math.random()*h*.4,vx:(Math.random()-.5)*6,vy:2+Math.random()*4,r:4+Math.random()*6,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,shape:Math.random()<.5?'rect':'circle'});
  const start=Date.now();
  function draw(){
    const el=Date.now()-start;
    if(el>duration){ctx.clearRect(0,0,w,h);confettiActive=false;return}
    ctx.clearRect(0,0,w,h);
    parts.forEach(p=>{p.vy+=.1;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;if(p.shape==='rect')ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4);else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill()}ctx.restore()});
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize',()=>{w=cv.width=window.innerWidth;h=cv.height=window.innerHeight},{once:true});
}

async function ensureMicPermission(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return{ok:false,reason:'unsupported'};
  if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return{ok:false,reason:'https'};
  try{
    if(navigator.permissions&&navigator.permissions.query){
      const p=await navigator.permissions.query({name:'microphone'});
      if(p.state==='granted')return{ok:true};
    }
  }catch(e){}
  try{
    showToast('🎤 '+t('voice_requesting'),'info',2000);
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(tr=>tr.stop());
    return{ok:true};
  }catch(err){
    warn('getUserMedia error:',err.name,err.message);
    if(err.name==='NotAllowedError'||err.name==='PermissionDeniedError')return{ok:false,reason:'denied'};
    if(err.name==='NotFoundError'||err.name==='DevicesNotFoundError')return{ok:false,reason:'no-device'};
    return{ok:false,reason:'unknown',message:err.message};
  }
}

}

    const searchBtn=e.target.closest('#voiceSearchBtn');
    if(searchBtn){e.preventDefault();e.stopPropagation();startVoiceForSearch(searchBtn);return}
    const fieldBtn=e.target.closest('.voice-input-btn');
    if(fieldBtn){
      e.preventDefault();e.stopPropagation();
      const targetId=fieldBtn.dataset.target;
      if(!targetId){showToast('Поле не указано','error');return}
      let target=null;
      const modal=fieldBtn.closest('.modal');
      if(modal)target=modal.querySelector('#'+targetId);
      if(!target)target=document.getElementById(targetId);
      if(!target){showToast('Поле не найдено','error');return}
      startVoiceForField(target,fieldBtn);
    }
  },true);
  document.addEventListener('keydown',function(e){
    const tag=(e.target&&e.target.tagName||'').toLowerCase();
    const isInInput=tag==='input'||tag==='textarea'||tag==='select'||(e.target&&e.target.isContentEditable);
    if(e.key==='Escape'){if(activeModal){try{activeModal.closeModal()}catch(x){}}if(voiceIsListening){stopVoice()}return}
    if(isInInput)return;
    if(!e.ctrlKey&&!e.metaKey)return;
    const code=e.code||'';const key=(e.key||'').toLowerCase();
    function matches(sk){
      if(!sk)return false;
      const s=sk.toLowerCase();
      if(code.startsWith('Key')){if(code.slice(3).toLowerCase()===s)return true}
      if(code.startsWith('Digit')){if(code.slice(5)===s)return true}
      if(key===s)return true;
      return false;
    }
    if(matches(shortcutMap.search)){e.preventDefault();e.stopPropagation();showShortcutToast('Ctrl+'+shortcutMap.search.toUpperCase()+' — '+t('search'));openSearchModal();return false}
    if(matches(shortcutMap.new)){e.preventDefault();e.stopPropagation();showShortcutToast('Ctrl+'+shortcutMap.new.toUpperCase()+' — '+t('send'));if(isGuest){showToast(t('login_required'),'info');return false}if(!currentUser){showToast(t('login_required'),'info');return false}switchSection('send');return false}
    if(matches(shortcutMap.home)){e.preventDefault();e.stopPropagation();showShortcutToast('Ctrl+'+shortcutMap.home.toUpperCase()+' — '+t('home'));switchSection('home');return false}
    if(matches(shortcutMap.cart)){e.preventDefault();e.stopPropagation();showShortcutToast('Ctrl+'+shortcutMap.cart.toUpperCase()+' — '+t('cart'));if(isGuest){showToast(t('login_required'),'info');return false}switchSection('cart');return false}
    if(matches(shortcutMap.settings)){e.preventDefault();e.stopPropagation();showShortcutToast('Ctrl+'+shortcutMap.settings.toUpperCase()+' — '+t('settings'));openSettingsModal();return false}
    if(shortcutMap.help==='/'&&(code==='Slash'||key==='/')){e.preventDefault();e.stopPropagation();openShortcutsModal();return false}
  },true);
}

function levenshtein(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++){if(b.charAt(i-1)===a.charAt(j-1))m[i][j]=m[i-1][j-1];else m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1)}return m[b.length][a.length]}
function smartMatch(query,text){if(!query||!text)return false;const q=query.toLowerCase().trim();const tx=text.toLowerCase();if(tx.indexOf(q)!==-1)return true;if(q.length<3)return false;const words=tx.split(/\s+/);const qWords=q.split(/\s+/).filter(w=>w.length>2);return qWords.some(qw=>words.some(tw=>levenshtein(qw,tw)<=2||tw.indexOf(qw)!==-1))}
function findSuggestions(q){if(!q||q.length<3)return null;const known=[];ALL_CATEGORIES.forEach(c=>c.label.split(' ').forEach(w=>{if(w.length>3)known.push(w.toLowerCase())}));ALL_SERVERS.forEach(s=>known.push(s.toLowerCase()));const ql=q.toLowerCase();const words=ql.split(/\s+/);let fixed=null;for(const w of words){if(w.length<3)continue;let best=null,bestDist=3;for(const k of known){const d=levenshtein(w,k);if(d<bestDist){bestDist=d;best=k}}if(best&&best!==w&&bestDist<=2){fixed=best;break}}return fixed}

  $('sendServerBtn').onclick=()=>{

  };
  $('sendSubmitBtn').onclick=async()=>{
    if(isGuest||!currentUser){showAlert(t('error'),t('login_required'));return}
    const itemName=$('sendName').value.trim();
    const priceRaw=$('sendPrice').value.trim();
    const description=$('sendDescription').value.trim();
    const images=$('sendImages').value.trim();
    const video=$('sendVideo').value.trim();
    if(!itemName||!priceRaw||!description){showAlert(t('error'),t('fill_fields'));return}
    const fb=checkForbiddenWords(itemName+' '+description);if(fb){showAlert(t('error'),fb);return}
    const lc=checkLinksString(images);if(!lc.valid){showAlert(t('error'),lc.message);return}
    if(video&&!isVideoLink(video)){showAlert(t('error'),t('video_only'));return}
    const last=localStorage.getItem('arizona_last_submit_time');
    if(last){const d=Date.now()-parseInt(last);if(d<SUBMIT_COOLDOWN_MS){showAlert(t('wait'),t('next_send')+' '+Math.ceil((SUBMIT_COOLDOWN_MS-d)/1000)+' '+t('sec'));return}}

    await submitAd(itemName,priceRaw,description,images,video,sendFormData);
  };
}
async function submitAd(itemName,priceRaw,description,images,video,formData){
  const isFirst=!localStorage.getItem('az_first_ad_done_v5');
  const na={mode:formData.type,category:formData.category,item_name:itemName,price:parsePriceToNumber(priceRaw),description,images,video_url:video||null,server:formData.server,author_id:currentUser.id,author_username:currentUser.username,status:'pending',created_at:new Date().toISOString(),expires_at:null,hidden:false};
  try{
    showLoader(t('send_loading'));
    const r=await withTimeout(supabaseClient.from('ads').insert(na),8000);
    hideLoader();
    if(r.error)throw r.error;
    localStorage.setItem('arizona_last_submit_time',Date.now().toString());
    playSfx('success');showToast(t('ad_sent'),'success');
    if(isFirst){localStorage.setItem('az_first_ad_done_v5','1');launchConfetti();setTimeout(()=>showAlert(t('first_ad'),t('first_ad_text'),'success'),800)}
    $('sendName').value='';$('sendPrice').value='';$('sendDescription').value='';$('sendImages').value='';$('sendVideo').value='';
    sendFormData={type:'sell',category:null,server:null,video:''};
    $('sendTypeBtn').textContent=t('sell');$('sendCategoryBtn').textContent=t('choose_category');$('sendServerBtn').textContent=t('choose_server');
    if(currentSection==='all')loadMyAds();
  }catch(e){hideLoader();warn('submit',e);showAlert(t('error'),t('cannot_send'))}
}

async function adminUserAction(action){
  const target=$('adminUsernameInput').value.trim();
  if(!target){showAlert(t('error'),'username');return}
  try{
    let q=supabaseClient.from('app_users').select('*');
    if(!isNaN(target))q=q.eq('id',target);else q=q.eq('username',target);
    const r=await withTimeout(q,5000);
    if(r.error||!r.data||!r.data.length){showAlert(t('error'),t('not_found'));return}
    const u=r.data[0];
    if(action==='ban')await supabaseClient.from('app_users').update({banned:true}).eq('id',u.id);
    else if(action==='unban')await supabaseClient.from('app_users').update({banned:false}).eq('id',u.id);
    else if(action==='make_admin')await supabaseClient.from('app_users').update({is_admin:true}).eq('id',u.id);
    else if(action==='remove_admin')await supabaseClient.from('app_users').update({is_admin:false}).eq('id',u.id);
    else if(action==='verify'){try{await supabaseClient.from('app_users').update({is_verified:true}).eq('id',u.id)}catch(e){}verifiedUsers.add(u.id)}
    else if(action==='unverify'){try{await supabaseClient.from('app_users').update({is_verified:false}).eq('id',u.id)}catch(e){}verifiedUsers.delete(u.id)}
    await logModeratorAction(action,u.id);playSfx('success');showAlert(t('success'),t('success'));loadAdminPanel();
  }catch(e){showAlert(t('error'),t('error'))}
}

async function loadReviews(adId){
  const c=$('detailReviewsSection');if(!c)return;
  try{
    const r=await withTimeout(supabaseClient.from('reviews').select('*').eq('ad_id',adId).order('created_at',{ascending:false}),5000);
    if(r.error)throw r.error;
    const revs=r.data||[];
    if(!revs.length){c.innerHTML='<p style="color:var(--muted);font-size:.82rem;margin-top:.8rem;">'+t('no_reviews')+'</p>';return}
    const avg=revs.reduce((s,x)=>s+x.stars,0)/revs.length;
    let h='<div style="margin-top:1rem;"><div style="font-size:1rem;font-weight:800;">⭐ '+avg.toFixed(1)+' <span style="color:var(--muted);font-size:.78rem;font-weight:500;">('+revs.length+')</span></div><div class="progress-bar mb-12"><div class="progress-fill" style="width:'+(avg/5*100)+'%;"></div></div></div>';
    revs.forEach(rv=>{
      const canEdit=currentUser&&!isGuest&&rv.author_id===currentUser.id&&(Date.now()-new Date(rv.created_at).getTime())<7*24*60*60*1000;
      const canDelete=currentUser&&!isGuest&&(rv.author_id===currentUser.id||isOwner);
      const isSeller=currentUser&&!isGuest&&rv.author_id===currentUser.id;
      h+='<div class="review-item"><div style="font-weight:600;font-size:.85rem;">'+escapeHtml(rv.author_username||rv.author_id)+' <span style="color:var(--accent);">'+'★'.repeat(rv.stars)+'☆'.repeat(5-rv.stars)+'</span></div><div style="font-size:.68rem;color:var(--muted);">'+new Date(rv.created_at).toLocaleDateString('ru-RU')+'</div><p style="font-size:.78rem;margin:.25rem 0;white-space:pre-wrap;word-break:break-word;">'+escapeHtml(rv.text||'')+'</p>'+(rv.media_links?'<div style="font-size:.68rem;color:var(--accent);word-break:break-all;">'+escapeHtml(rv.media_links)+'</div>':'');
      if(rv.reply_text)h+='<div style="margin-left:.8rem;padding:.4rem;background:var(--glass-2);border-radius:6px;margin-top:.3rem;border-left:2px solid var(--accent);"><strong style="font-size:.7rem;color:var(--accent);">'+t('answer')+':</strong><div style="font-size:.75rem;">'+escapeHtml(rv.reply_text)+'</div></div>';
      else if(!isGuest&&(isSeller||isOwner))h+='<button class="btn secondary mt-8" data-reply-review="'+rv.id+'" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">💬</button>';
      if(!isGuest&&(canEdit||canDelete)){h+='<div class="flex-between gap-8 mt-8" style="justify-content:flex-start;">';if(canEdit)h+='<button class="btn secondary" data-edit-review="'+rv.id+'" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">✏️</button>';if(canDelete)h+='<button class="btn danger" data-del-review="'+rv.id+'" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">🗑</button>';h+='</div>'}
      h+='</div>';
    });
    c.innerHTML=h;
    c.querySelectorAll('[data-edit-review]').forEach(b=>b.addEventListener('click',()=>{const rv=revs.find(x=>x.id==b.dataset.editReview);if(rv)openEditReviewModal(rv)}));
    c.querySelectorAll('[data-del-review]').forEach(b=>b.addEventListener('click',async()=>{await supabaseClient.from('reviews').delete().eq('id',b.dataset.delReview);loadReviews(adId)}));
    c.querySelectorAll('[data-reply-review]').forEach(b=>b.addEventListener('click',()=>{const rv=revs.find(x=>x.id==b.dataset.replyReview);if(rv)openReplyModal(rv)}));
  }catch(e){}
}

function openMusicModal(){
  if(musicAudio){try{musicAudio.pause()}catch(e){}musicAudio=null}
  showModal('<h3 class="modal-title">'+t('music_title')+'</h3>'+
    '<div class="music-player">'+
      '<div class="music-track-info"><div class="music-track-icon">🎵</div><div style="min-width:0;flex:1;"><div class="music-track-name" id="musicTrackName">'+t('track_not_selected')+'</div><div class="music-track-status" id="musicTrackStatus">'+t('choose_source')+'</div></div></div>'+
      '<div class="music-progress" id="musicProgressBar"><div class="music-progress-fill" id="musicProgressFill"></div></div>'+
      '<div class="music-controls"><button class="btn primary" id="musicPlayBtn">'+t('play')+'</button><button class="btn secondary" id="musicPauseBtn">'+t('pause')+'</button><button class="btn danger" id="musicStopBtn">'+t('reset')+'</button></div>'+
    '</div>'+
    '<div class="form-group mt-12"><label>'+t('link_track')+'</label><input type="text" id="musicUrl" placeholder="https://example.com/song.mp3"></div>'+
    '<label class="file-upload-btn" for="musicFile"><span>'+t('upload_file')+'</span><input type="file" id="musicFile" accept="audio/*"></label>');
  const tn=$('musicTrackName'),ts=$('musicTrackStatus'),pf=$('musicProgressFill'),pb=$('musicProgressBar');
  function setTrack(n,s){tn.textContent=n;ts.textContent=s}
  function stopProg(){if(musicProgressInterval){clearInterval(musicProgressInterval);musicProgressInterval=null}}
  function startProg(){stopProg();musicProgressInterval=setInterval(()=>{if(musicAudio&&musicAudio.duration&&isFinite(musicAudio.duration)){const pct=(musicAudio.currentTime/musicAudio.duration)*100;pf.style.width=pct+'%'}},300)}
  function playAudio(url,name,isObjectUrl){
    if(musicAudio){try{musicAudio.pause()}catch(e){}}
    if(musicObjectUrl&&musicObjectUrl!==url){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}musicObjectUrl=null}
    if(isObjectUrl)musicObjectUrl=url;
    musicAudio=new Audio();musicAudio.preload='auto';musicAudio.src=url;
    musicAudio.addEventListener('ended',()=>{ts.textContent=t('finished');stopProg();pf.style.width='0%'});
    musicAudio.addEventListener('play',()=>{ts.textContent=t('playing')});
    musicAudio.addEventListener('pause',()=>{if(musicAudio&&!musicAudio.ended)ts.textContent=t('paused')});
    setTrack(name,t('loading'));
    const promise=musicAudio.play();
    if(promise&&promise.then)promise.then(()=>{ts.textContent=t('playing');startProg()}).catch(err=>{ts.textContent=t('audio_error');showToast(t('audio_error')+': '+(err.message||''),'error',3500)});
    else{ts.textContent=t('playing');startProg()}
  }
  $('musicPlayBtn').addEventListener('click',()=>{const url=$('musicUrl').value.trim();if(url){playAudio(url,url.split('/').pop()||'URL')}else if(musicAudio&&musicAudio.src){musicAudio.play().catch(()=>showToast(t('audio_error'),'error'))}else showToast(t('choose_source'),'info')});
  $('musicPauseBtn').addEventListener('click',()=>{if(musicAudio)musicAudio.pause()});
  $('musicStopBtn').addEventListener('click',()=>{if(musicAudio){try{musicAudio.pause()}catch(e){}musicAudio=null}if(musicObjectUrl){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}musicObjectUrl=null}stopProg();pf.style.width='0%';setTrack(t('track_not_selected'),t('choose_source'));$('musicUrl').value='';const fi=$('musicFile');if(fi)fi.value=''});
  pb.addEventListener('click',(e)=>{if(!musicAudio||!musicAudio.duration||!isFinite(musicAudio.duration))return;const rect=pb.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));musicAudio.currentTime=pct*musicAudio.duration});
  $('musicFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f){showToast(t('file_not_selected'),'error');return}if(f.size>50*1024*1024){showToast(t('file_too_big'),'error');return}try{const url=URL.createObjectURL(f);playAudio(url,f.name,true)}catch(err){showToast(t('error')+': '+err.message,'error')}});
}

function openSearchModal(){openSearchModalWithQuery('')}
async function openSearchModalWithQuery(initial){
  const ref=showModal('<h3 class="modal-title">🔍 '+t('search')+'</h3><div class="form-group"><div class="input-with-voice"><input type="text" id="searchInput" placeholder="'+t('search')+'" autocomplete="off" value="'+escapeHtml(initial)+'"><button class="voice-input-btn" data-target="searchInput" type="button">🎤</button></div></div><div class="flex-between gap-8 mb-12"><button class="btn primary w-full" id="searchItemBtn">📦</button><button class="btn secondary w-full" id="searchProfileBtn">👤</button></div><div id="searchSuggestions"></div><div id="searchHistory"></div><div id="searchResults"></div>');
  const input=$('searchInput');setTimeout(()=>input.focus(),150);
  const sugg=$('searchSuggestions'),res=$('searchResults'),hist=$('searchHistory');
  function renderHist(){if(!searchHistory.length){hist.innerHTML='';return}hist.innerHTML='<div style="font-size:.72rem;color:var(--muted);margin-bottom:.4rem;">'+t('history')+'</div>'+searchHistory.map(h=>'<span class="badge" style="cursor:pointer;margin:.12rem;background:var(--accent-soft);color:var(--accent);" data-hist="'+escapeHtml(h)+'">'+escapeHtml(h)+'</span>').join('');hist.querySelectorAll('[data-hist]').forEach(el=>el.addEventListener('click',()=>{input.value=el.dataset.hist;input.dispatchEvent(new Event('input'))}))}
  renderHist();
  async function doSearch(q){if(!q)return[];try{const r=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('hidden',false),5000);if(r.error||!r.data)return[];return r.data.filter(ad=>smartMatch(q,ad.item_name||'')||smartMatch(q,ad.description||''))}catch(e){return[]}}
  input.addEventListener('input',async()=>{
    const q=input.value.trim().toLowerCase();
    if(!q){sugg.innerHTML='';res.innerHTML='';return}
    const fixed=findSuggestions(q);
    const items=await doSearch(q);const top=items.slice(0,5);
    let hint=fixed&&fixed!==q?'<div class="search-hint">'+t('you_meant')+' <strong style="color:var(--accent);">'+escapeHtml(fixed)+'</strong></div>':'';
    sugg.innerHTML=hint+top.map(ad=>'<div class="search-suggestion" data-sug="'+ad.id+'">📦 '+escapeHtml(ad.item_name)+' • '+formatPrice(ad.price)+'</div>').join('');
    sugg.querySelectorAll('[data-sug]').forEach(el=>el.addEventListener('click',()=>{const ad=items.find(a=>a.id==el.dataset.sug);if(ad){if(currentUser&&!isGuest)saveSearchQuery(q);ref.closeModal();openAdDetail(ad)}}));
  });
  $('searchItemBtn').addEventListener('click',async()=>{
    const q=input.value.trim().toLowerCase();if(!q)return;
    if(currentUser&&!isGuest)saveSearchQuery(q);
    const items=await doSearch(q);
    if(!items.length){const fixed=findSuggestions(q);if(fixed&&fixed!==q){res.innerHTML='<div class="empty-state">'+t('found_nothing')+'. '+t('try_this')+': <strong style="color:var(--accent);">'+escapeHtml(fixed)+'</strong></div>';return}res.innerHTML='<div class="empty-state">'+t('found_nothing')+'</div>';return}
    res.innerHTML=items.map(ad=>'<div class="card" data-res-id="'+ad.id+'" style="padding:.65rem;"><div style="font-weight:700;">'+escapeHtml(ad.item_name)+'</div><div style="font-size:.72rem;color:var(--muted);">'+ad.server+' • '+formatPrice(ad.price)+'</div></div>').join('');
    res.querySelectorAll('[data-res-id]').forEach(card=>card.addEventListener('click',()=>{const ad=items.find(a=>a.id==card.dataset.resId);if(ad){ref.closeModal();openAdDetail(ad)}}));
  });
  $('searchProfileBtn').addEventListener('click',()=>{const q=input.value.trim();if(q){ref.closeModal();openProfileModal(q)}});
  if(initial){input.dispatchEvent(new Event('input'));setTimeout(()=>$('searchItemBtn').click(),300)}
}

function detectDesktop(){
  const ua=navigator.userAgent.toLowerCase();
  const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
  const isMobile=/android|iphone|ipad|ipod|mobile|webos|blackberry|opera mini|iemobile/i.test(ua);
  isDesktop=!isTouch&&!isMobile;
}
function bootApp(){
  detectDesktop();
  loadShortcuts();
  bindGlobalHandlers();
  const tgUser=initTelegram();
  const supOk=initSupabase();
  if(!supOk){setTimeout(()=>{hideSplash();document.body.innerHTML='<div style="text-align:center;margin-top:50vh;padding:2rem;color:#EF4444;font-family:sans-serif;">'+t('error_connection')+'</div>'},SPLASH_DURATION);return}
  setTimeout(async()=>{
    hideSplash();
    const saved=localStorage.getItem('arizona_current_user');
    if(!saved){showAuthScreen(tgUser||'');return}
    try{
      currentUser=JSON.parse(saved);
      const r=await supabaseClient.from('app_users').select('*').eq('id',currentUser.id).maybeSingle();
      if(r.error||!r.data||r.data.banned){if(r.data&&r.data.banned){showBanScreen();return}localStorage.removeItem('arizona_current_user');currentUser=null;showAuthScreen(tgUser||'');return}
      currentUser=r.data;addAccountToStorage(currentUser);
      showApp();
      try{initApp()}catch(e){warn('init',e)}
    }catch(e){warn('boot',e);localStorage.removeItem('arizona_current_user');currentUser=null;showAuthScreen(tgUser||'')}
  },SPLASH_DURATION);
}
document.addEventListener('click',e=>{
  const tt=e.target.closest('.btn,.nav-item,.card,.grid-tile,.link-item,.search-suggestion,.theme-toggle,.header-logo,.header-search,.modal-close,.auth-theme-toggle,.star-rating span,.auth-tab,.back-to-top,.fav-heart,.file-upload-btn,.shortcut-key,.account-row,.auth-guest-btn');
  if(tt){playSfx('click');haptic('light')}
},{passive:true});
document.addEventListener('touchmove',e=>{if(document.querySelector('.modal-overlay.show')&&!e.target.closest('.modal'))e.preventDefault()},{passive:false});
window.addEventListener('DOMContentLoaded',bootApp);

})();
</script>
</body>
