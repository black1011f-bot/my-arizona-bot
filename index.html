<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дурак Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            touch-action: manipulation;
        }

        /* Игровой стол с деревянной текстурой */
        #app {
            width: 100%; height: 100%; max-width: 500px; margin: 0 auto;
            background: #2b1d14 url('https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative; overflow: hidden;
        }

        /* Плашки игроков */
        .player-badge {
            position: absolute; background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px;
            color: #fff; padding: 4px 8px; font-size: 12px; min-width: 90px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20;
        }
        .player-badge .name { font-weight: bold; margin-bottom: 2px; }
        .player-badge .info { display: flex; justify-content: space-between; align-items: center; color: #ccc; }
        .player-badge .status-icon { font-size: 12px; }

        #badge-bot1 { top: 40px; left: 10px; }
        #badge-bot2 { top: 180px; left: 10px; }
        #badge-bot3 { top: 180px; right: 10px; }
        #badge-player { bottom: 140px; left: 10px; }

        /* Зона колоды и козыря */
        #deck-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }
        .deck-card {
            width: 65px; height: 90px; border-radius: 6px;
            background: url('https://i.postimg.cc/BQv12ZJj/1788423565409.jpg') center/cover no-repeat;
            border: 1px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            position: relative;
        }
        .deck-count {
            position: absolute; top: -5px; right: -5px; background: #fff;
            color: #000; font-weight: bold; font-size: 12px; padding: 2px 6px;
            border-radius: 4px; border: 1px solid #000;
        }
        .trump-card-bg {
            width: 65px; height: 90px; margin-top: -65px; transform: rotate(90deg);
            z-index: -1; opacity: 0.9;
        }

        /* Игровое поле (стол) */
        #table-field {
            flex: 1; margin-top: 130px; margin-bottom: 150px;
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 12px; padding: 10px; z-index: 5;
        }
        .card-pair { position: relative; width: 65px; height: 92px; }

        /* Карты */
        .card {
            width: 65px; height: 92px; background: #fff; border-radius: 6px;
            border: 1px solid #ccc; box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            position: absolute; display: flex; flex-direction: column;
            justify-content: space-between; padding: 3px 5px;
            background-size: cover; background-position: center;
        }
        .card.back {
            background-image: url('https://i.postimg.cc/BQv12ZJj/1788423565409.jpg') !important;
            border: 1px solid #fff;
        }
        .card-center-logo {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32px; height: 32px;
            background: url('https://i.postimg.cc/0ycmL6ZT/1788346659518.jpg') center/contain no-repeat;
            pointer-events: none; opacity: 0.85;
        }
        .card .corner { font-size: 11px; font-weight: bold; line-height: 1; text-align: center; }
        .card .corner .suit { font-size: 12px; }
        .card.red { color: #d32f2f; }
        .card.black { color: #111; }
        .card.bottom-corner { transform: rotate(180deg); }

        .card-pair .attack-card { left: 0; top: 0; z-index: 1; }
        .card-pair .defense-card { left: 14px; top: 14px; z-index: 2; }

        /* Веер карт игрока */
        #player-hand {
            position: absolute; bottom: -20px; left: 0; width: 100%; height: 150px;
            display: flex; justify-content: center; align-items: flex-end; z-index: 30;
        }
        #player-hand .card {
            position: absolute; cursor: pointer; transition: transform 0.2s ease, bottom 0.2s ease;
            transform-origin: bottom center;
        }
        #player-hand .card:active, #player-hand .card.selected {
            bottom: 25px !important; box-shadow: 0 0 12px #ffd700;
        }

        /* Элементы управления и статусы */
        #controls {
            position: absolute; bottom: 150px; right: 15px;
            display: flex; flex-direction: column; gap: 8px; z-index: 40;
        }
        .action-btn {
            padding: 10px 20px; background: rgba(0,0,0,0.8); color: #fff;
            border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
            font-weight: bold; font-size: 13px; cursor: pointer; backdrop-filter: blur(4px);
        }
        .action-btn:disabled { opacity: 0.3; pointer-events: none; }

        #status-msg {
            position: absolute; top: 115px; width: 100%; text-align: center;
            color: #ffd700; font-size: 13px; font-weight: bold;
            text-shadow: 0 2px 4px #000; z-index: 15;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Игроки -->
    <div class="player-badge" id="badge-bot1">
        <div class="name">Евклид</div>
        <div class="info"><span id="count-bot1">6</span> <span class="status-icon" id="status-bot1">🛡️</span></div>
    </div>
    <div class="player-badge" id="badge-bot2">
        <div class="name">Платон</div>
        <div class="info"><span id="count-bot2">6</span> <span class="status-icon" id="status-bot2"></span></div>
    </div>
    <div class="player-badge" id="badge-bot3">
        <div class="name">Сократ</div>
        <div class="info"><span id="count-bot3">6</span> <span class="status-icon" id="status-bot3"></span></div>
    </div>
    <div class="player-badge" id="badge-player">
        <div class="name">Игрок</div>
        <div class="info"><span id="count-player">6</span> <span class="status-icon" id="status-player">⚔️</span></div>
    </div>

    <!-- Колода и козырь -->
    <div id="deck-container">
        <div class="deck-card" id="deck-el">
            <div class="deck-count" id="deck-count">28</div>
        </div>
        <div id="trump-card-slot"></div>
    </div>

    <div id="status-msg">Ваш ход</div>

    <!-- Стол -->
    <div id="table-field"></div>

    <!-- Кнопки управления -->
    <div id="controls">
        <button class="action-btn" id="btn-action" disabled>Отбой</button>
        <button class="action-btn" id="btn-take" disabled>Взять</button>
    </div>

    <!-- Рука игрока -->
    <div id="player-hand"></div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    class Card {
        constructor(suit, rank) {
            this.suit = suit; this.rank = rank;
            this.id = suit + rank;
        }
        get name() {
            const names = { 6:'6',7:'7',8:'8',9:'9',10:'10',11:'В',12:'Д',13:'К',14:'Т' };
            return names[this.rank] || this.rank;
        }
        get isRed() { return this.suit === '♥' || this.suit === '♦'; }
        beats(other, trumpSuit) {
            if (this.suit === trumpSuit && other.suit !== trumpSuit) return true;
            if (this.suit !== trumpSuit && other.suit === trumpSuit) return false;
            if (this.suit === other.suit) return this.rank > other.rank;
            return false;
        }
    }

    function createDeck() {
        const suits = ['♠','♥','♦','♣'], ranks = [6,7,8,9,10,11,12,13,14], deck = [];
        for (let s of suits) for (let r of ranks) deck.push(new Card(s, r));
        return deck.sort(() => Math.random() - 0.5);
    }

    class Game {
        constructor() {
            this.deck = createDeck();
            this.trumpCard = this.deck[0];
            this.trumpSuit = this.trumpCard.suit;
            this.playerHand = [];
            this.bot1Hand = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.isPlayerTurn = true;
            this.isAttacking = true;
            this.gameOver = false;
        }

        init() {
            for (let i = 0; i < 6; i++) {
                if (this.deck.length) this.playerHand.push(this.deck.pop());
                if (this.deck.length) this.bot1Hand.push(this.deck.pop());
            }
            this.sortHands();
            this.renderTrumpCard();
            this.updateUI();
        }

        sortHands() {
            const score = c => (c.suit === this.trumpSuit ? 100 : 0) + c.rank;
            this.playerHand.sort((a,b) => score(a) - score(b));
        }

        renderTrumpCard() {
            const slot = document.getElementById('trump-card-slot');
            slot.innerHTML = '';
            const el = this.createCardEl(this.trumpCard);
            el.classList.add('trump-card-bg');
            slot.appendChild(el);
        }

        createCardEl(card) {
            const div = document.createElement('div');
            div.className = `card ${card.isRed ? 'red' : 'black'}`;
            div.innerHTML = `
                <div class="corner"><div class="rank">${card.name}</div><div class="suit">${card.suit}</div></div>
                <div class="card-center-logo"></div>
                <div class="corner bottom-corner"><div class="rank">${card.name}</div><div class="suit">${card.suit}</div></div>
            `;
            return div;
        }

        playCard(card) {
            if (this.gameOver) return;

            if (this.isPlayerTurn && this.isAttacking) {
                if (this.attackingCards.length > 0) {
                    const activeRanks = [...this.attackingCards, ...this.defendingCards].map(c => c.rank);
                    if (!activeRanks.includes(card.rank)) return;
                }
                this.playerHand = this.playerHand.filter(c => c !== card);
                this.attackingCards.push(card);
                this.updateUI();
                document.getElementById('status-msg').textContent = 'Евклид отбивается...';
                setTimeout(() => this.botDefend(), 800);
            } else if (!this.isPlayerTurn && !this.isAttacking) {
                const target = this.attackingCards[this.defendingCards.length];
                if (card.beats(target, this.trumpSuit)) {
                    this.playerHand = this.playerHand.filter(c => c !== card);
                    this.defendingCards.push(card);
                    this.updateUI();
                    if (this.defendingCards.length === this.attackingCards.length) {
                        document.getElementById('status-msg').textContent = 'Вы отбились! Нажмите "Отбой"';
                        document.getElementById('btn-action').disabled = false;
                        document.getElementById('btn-take').disabled = true;
                    }
                }
            }
        }

        botDefend() {
            const target = this.attackingCards[this.defendingCards.length];
            const card = this.bot1Hand.find(c => c.beats(target, this.trumpSuit));

            if (card) {
                this.bot1Hand = this.bot1Hand.filter(c => c !== card);
                this.defendingCards.push(card);
                this.updateUI();
                if (this.defendingCards.length === this.attackingCards.length) {
                    document.getElementById('btn-action').disabled = false;
                    document.getElementById('status-msg').textContent = 'Евклид отбился. Можно подкинуть или Отбой.';
                } else {
                    setTimeout(() => this.botDefend(), 600);
                }
            } else {
                document.getElementById('status-msg').textContent = 'Евклид берет карты!';
                this.bot1Hand.push(...this.attackingCards, ...this.defendingCards);
                this.attackingCards = []; this.defendingCards = [];
                setTimeout(() => this.finishTurn(true), 1200);
            }
        }

        onAction() {
            this.finishTurn(!this.isPlayerTurn);
        }

        onTake() {
            this.playerHand.push(...this.attackingCards, ...this.defendingCards);
            this.attackingCards = []; this.defendingCards = [];
            this.finishTurn(false);
        }

        finishTurn(nextIsPlayer) {
            this.attackingCards = []; this.defendingCards = [];
            while (this.playerHand.length < 6 && this.deck.length) this.playerHand.push(this.deck.pop());
            while (this.bot1Hand.length < 6 && this.deck.length) this.bot1Hand.push(this.deck.pop());

            this.sortHands();
            this.isPlayerTurn = nextIsPlayer;
            this.isAttacking = true;
            document.getElementById('btn-action').disabled = true;
            document.getElementById('btn-take').disabled = true;
            document.getElementById('status-msg').textContent = this.isPlayerTurn ? 'Ваш ход' : 'Ход Евклида';
            this.updateUI();
        }

        updateUI() {
            // Рука игрока
            const handContainer = document.getElementById('player-hand');
            handContainer.innerHTML = '';
            const total = this.playerHand.length;
            this.playerHand.forEach((card, idx) => {
                const el = this.createCardEl(card);
                const angle = (idx - (total - 1) / 2) * 8;
                const offsetX = (idx - (total - 1) / 2) * 30;
                el.style.transform = `translateX(${offsetX}px) rotate(${angle}deg)`;
                el.onclick = () => this.playCard(card);
                handContainer.appendChild(el);
            });

            // Счетчики карт
            document.getElementById('count-player').textContent = this.playerHand.length;
            document.getElementById('count-bot1').textContent = this.bot1Hand.length;
            document.getElementById('deck-count').textContent = this.deck.length;

            // Стол
            const table = document.getElementById('table-field');
            table.innerHTML = '';
            this.attackingCards.forEach((atk, i) => {
                const pair = document.createElement('div');
                pair.className = 'card-pair';
                const atkEl = this.createCardEl(atk);
                atkEl.classList.add('attack-card');
                pair.appendChild(atkEl);

                if (this.defendingCards[i]) {
                    const defEl = this.createCardEl(this.defendingCards[i]);
                    defEl.classList.add('defense-card');
                    pair.appendChild(defEl);
                }
                table.appendChild(pair);
            });
        }
    }

    const game = new Game();
    game.init();

    document.getElementById('btn-action').onclick = () => game.onAction();
    document.getElementById('btn-take').onclick = () => game.onTake();
</script>
</body>
</html>
