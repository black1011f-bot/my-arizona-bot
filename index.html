<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arizona RP Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18191a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--tg-theme-hint-color, #ffaa00);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: var(--tg-theme-secondary-bg-color, #242526);
            color: var(--tg-theme-text-color, #ffffff);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #ffaa00);
            color: var(--tg-theme-button-text-color, #000000);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .warning-box {
            background-color: rgba(255, 170, 0, 0.1);
            border-left: 4px solid #ffaa00;
            padding: 10px;
            font-size: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Arizona RP Объявления</h2>
        
        <div class="warning-box">
            ⚠️ <b>Безопасность и ответственность:</b> Администрация бота не несет никакой ответственности за ваши сделки, обмены и договоренности. Все действия вы совершаете на свой страх и риск! Отправка доступна с <b>08:00 до 22:00 МСК</b>.
        </div>
        
        <div class="form-group">
            <label for="mode">Режим:</label>
            <select id="mode" onchange="toggleMode()">
                <option value="sell">Продажа</option>
                <option value="buy">Скупка</option>
                <option value="auction">Аукцион</option>
                <option value="barter">Бартер / Обмен</option>
            </select>
        </div>

        <div class="form-group" id="categoryGroup">
            <label for="category">Категория:</label>
            <select id="category">
                <option value="💍 Аксессуары и вещи">💍 Аксессуары и вещи</option>
                <option value="🚗 Транспорт и тюнинг">🚗 Транспорт и тюнинг</option>
                <option value="👕 Скины и охранники">👕 Скины и охранники</option>
                <option value="🏠 Недвижимость и бизнесы">🏠 Недвижимость и бизнесы</option>
                <option value="📦 Ресурсы и материалы">📦 Ресурсы и материалы</option>
            </select>
        </div>

        <div class="form-group" id="itemGroup" style="display:none;">
            <label for="itemName">Название товара:</label>
            <input type="text" id="itemName" placeholder="Например: Шар +12">
        </div>

        <div class="form-group" id="priceGroup" style="display:none;">
            <label for="price">Стартовая цена ($):</label>
            <input type="number" id="price" placeholder="50000000">
        </div>

        <div class="form-group" id="textGroup">
            <label for="text">Текст объявления:</label>
            <textarea id="text" rows="4" placeholder="Опишите ваш товар или условия обмена..."></textarea>
        </div>

        <div class="form-group">
            <label for="server">Игровой сервер:</label>
            <select id="server">
                <option value="🔥 Phoenix">🔥 Phoenix</option>
                <option value="🌴 Tucson">🌴 Tucson</option>
                <option value="🌵 Scottdale">🌵 Scottdale</option>
                <option value="⚜️ Chandler">⚜️ Chandler</option>
                <option value="❄️ Brainburg">❄️ Brainburg</option>
                <option value="🌊 Yuma">🌊 Yuma</option>
                <option value="✨ Saint-Rose">✨ Saint-Rose</option>
                <option value="🏛 Mesa">🏛 Mesa</option>
                <option value="❤️ Red-Rock">❤️ Red-Rock</option>
                <option value="🍀 Surprise">🍀 Surprise</option>
                <option value="⚡️ Prescott">⚡️ Prescott</option>
                <option value="🌲 Glendale">🌲 Glendale</option>
                <option value="👑 Kingman">👑 Kingman</option>
                <option value="⚓️ Winslow">⚓️ Winslow</option>
                <option value="🌴 Payson">🌴 Payson</option>
                <option value="💎 Gilbert">💎 Gilbert</option>
                <option value="🔥 Show-Low">🔥 Show-Low</option>
                <option value="🌴 Casa-Grande">🌴 Casa-Grande</option>
                <option value="📜 Page">📜 Page</option>
                <option value="☀️ Sun-City">☀️ Sun-City</option>
                <option value="👑 Queen-Creek">👑 Queen-Creek</option>
                <option value="🌵 Sedona">🌵 Sedona</option>
                <option value="🎄 Holiday">🎄 Holiday</option>
                <option value="🍀 Wednesday">🍀 Wednesday</option>
                <option value="⚡️ Yava">⚡️ Yava</option>
                <option value="🌌 Faraway">🌌 Faraway</option>
                <option value="🎁 Christmas">🎁 Christmas</option>
                <option value="🐝 Bumble Bee">🐝 Bumble Bee</option>
                <option value="🪞 Mirage">🪞 Mirage</option>
                <option value="💖 Love">💖 Love</option>
                <option value="📱 Mobile I">📱 Mobile I</option>
                <option value="📱 Mobile II">📱 Mobile II</option>
                <option value="📱 Mobile III">📱 Mobile III</option>
            </select>
        </div>

        <button onclick="submitData()">Отправить в бот</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function toggleMode() {
            let mode = document.getElementById('mode').value;
            if (mode === 'auction') {
                document.getElementById('categoryGroup').style.display = 'none';
                document.getElementById('textGroup').style.display = 'none';
                document.getElementById('itemGroup').style.display = 'block';
                document.getElementById('priceGroup').style.display = 'block';
            } else if (mode === 'barter') {
                document.getElementById('categoryGroup').style.display = 'none';
                document.getElementById('itemGroup').style.display = 'none';
                document.getElementById('priceGroup').style.display = 'none';
                document.getElementById('textGroup').style.display = 'block';
            } else {
                document.getElementById('categoryGroup').style.display = 'block';
                document.getElementById('textGroup').style.display = 'block';
                document.getElementById('itemGroup').style.display = 'none';
                document.getElementById('priceGroup').style.display = 'none';
            }
        }

        function submitData() {
            let mode = document.getElementById('mode').value;
            let server = document.getElementById('server').value;
            let data = { action: 'create_post', mode: mode, server: server };

            if (mode === 'auction') {
                data.itemName = document.getElementById('itemName').value;
                data.price = parseInt(document.getElementById('price').value) || 0;
            } else if (mode === 'barter') {
                data.text = document.getElementById('text').value;
            } else {
                data.category = document.getElementById('category').value;
                data.text = document.getElementById('text').value;
            }

            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
