<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arizona Market Web</title>
    <style>
        /* Основные стили: черный фон, голубой текст */
        body {
            background-color: #000000;
            color: #00BFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        /* Время по МСК */
        #msk-time {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 0 0 5px #00BFFF;
        }

        /* Сетка кнопок (аналог ReplyKeyboardMarkup) */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        /* Стили кнопок: прозрачный фон, голубая обводка и текст */
        button {
            background-color: transparent;
            border: 2px solid #00BFFF;
            color: #00BFFF;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        button:hover {
            background-color: #00BFFF;
            color: #000000;
        }

        /* Кнопки на всю ширину (как в боте) */
        .full-width {
            grid-column: span 2;
        }

        /* Консоль для вывода ответов */
        .output-area {
            margin-top: 30px;
            width: 100%;
            max-width: 600px;
            border: 1px dashed #00BFFF;
            padding: 15px;
            border-radius: 8px;
            min-height: 100px;
            background-color: #0a0a0a;
            box-sizing: border-box;
            max-height: 200px;
            overflow-y: auto;
        }

        .output-area p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Бот Объявлений Arizona RP</h1>
        <div id="msk-time">Загрузка времени...</div>
    </div>

    <!-- Главное меню -->
    <div class="menu-grid">
        <button class="full-width" onclick="simAction('🌐 Открыто меню выбора сервера...')">🌐 Сменить игровой сервер</button>
        
        <button onclick="simAction('💍 Открыта категория: Аксессуары и вещи')">💍 Аксессуары и вещи</button>
        <button onclick="simAction('🚗 Открыта категория: Транспорт и тюнинг')">🚗 Транспорт и тюнинг</button>
        
        <button onclick="simAction('👕 Открыта категория: Скины и охранники')">👕 Скины и охранники</button>
        <button onclick="simAction('🏠 Открыта категория: Недвижимость и бизнесы')">🏠 Недвижимость и бизнесы</button>
        
        <button class="full-width" onclick="simAction('📦 Открыта категория: Ресурсы и материалы')">📦 Ресурсы и материалы</button>
        
        <!-- Кнопки под продажу аккаунтов и скупку -->
        <button onclick="simAction('📤 Подача объявления: Выставление товара или аккаунтов (до 4 лвл без привязок)...')">📤 Продать товар</button>
        <button onclick="simAction('📥 Подача объявления о скупке. Введите данные...')">📥 Скупить товар</button>
        
        <button onclick="simAction('🔄 Открыт раздел Бартер / Обмен')">🔄 Бартер / Обмен</button>
        <button onclick="simAction('🏛 Открыта система аукционов')">🏛 Аукционы</button>
        
        <button onclick="simAction('👥 Ваша реферальная ссылка и ежедневные бонусы!')">👥 Рефералы и Бонусы</button>
        <button onclick="calcVC()">💱 Курс VC и калькулятор</button>
        
        <button onclick="simAction('🔍 Введите название предмета для чека цен...')">🔍 Найти товар в базе</button>
        <button onclick="simAction('❤️ Ваши сохраненные объявления')">❤️ Сохраненные</button>
        
        <button onclick="simAction('📋 Ваши активные публикации на сервере')">📋 Мои публикации</button>
        <button onclick="simAction('📊 Анализ цен: Загрузка средней стоимости...')">📊 Анализ цен на сервере</button>
        
        <button onclick="simAction('💎 Статус: VIP (Купить за Stars)')">💎 VIP-статус</button>
        <button onclick="simAction('💬 Связаться с менеджером: @bounqy31')">💬 Связаться с менеджером</button>
        
        <button class="full-width" style="border-color: #ff3333; color: #ff3333;" onclick="simAction('👑 Админ-панель открыта')">👑 Админ-панель</button>
    </div>

    <!-- Вывод системных сообщений -->
    <div class="output-area" id="output">
        <p style="color: #00BFFF;">[Система] Добро пожаловать. Интерфейс загружен.</p>
    </div>

    <script>
        // Функция для работы часов по МСК
        function updateTimeMSK() {
            const options = { 
                timeZone: 'Europe/Moscow', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            const formatter = new Intl.DateTimeFormat('ru-RU', options);
            document.getElementById('msk-time').innerText = 'Время МСК: ' + formatter.format(new Date());
        }
        
        // Обновляем часы каждую секунду
        setInterval(updateTimeMSK, 1000);
        updateTimeMSK();

        // Логика вывода текста (заменяет safe_send_message из питона)
        function simAction(text) {
            const output = document.getElementById('output');
            const timeNow = new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(new Date());
            
            output.innerHTML += `<p>[${timeNow}] ${text}</p>`;
            output.scrollTop = output.scrollHeight; // Автоскролл вниз
        }

        // Пример логики калькулятора VC
        function calcVC() {
            const amount = prompt("💱 Введите сумму в $ для перевода в VC (Курс 95,000):");
            if (amount) {
                let parsed = parseFloat(amount.replace(/кк/g, '000000').replace(/к/g, '000'));
                if (!isNaN(parsed)) {
                    let vc = parsed / 95000;
                    simAction(`💵 Сумма: ${parsed} $ => 💎 Получается: ${vc.toFixed(2)} VC`);
                } else {
                    simAction("⚠️ Ошибка: Введите корректное число.");
                }
            }
        }
    </script>
</body>
</html>
