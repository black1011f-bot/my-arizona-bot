<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition: 0.25s ease;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width var(--transition), opacity var(--transition), transform var(--transition);
        }
        .section {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            height: var(--header-height);
            gap: 8px;
            transition: background var(--transition), border-color var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title {
            font-weight: 800;
            font-size: 18px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-search {
            flex: 1;
            min-width: 0;
        }
        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition), background var(--transition), color var(--transition);
        }
        .header-search input:focus { border-color: var(--accent); }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .theme-toggle:active { transform: scale(0.9); }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background var(--transition), border-color var(--transition);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: color var(--transition), transform 0.2s, background 0.2s;
            flex: 1;
            max-width: 80px;
            min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active {
            color: var(--accent);
            background: rgba(0, 91, 255, 0.08);
        }
        .nav-item:active { transform: scale(0.92); }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px;
            margin-bottom: 10px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform 0.15s;
            cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .card.deleted { background: rgba(128, 128, 128, 0.1); border-color: #ff3b30; }
        .ad-card { display: flex; gap: 10px; align-items: flex-start; }
        .ad-card-img {
            width: 80px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: var(--border);
            color: var(--text);
            white-space: nowrap;
        }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }
        .ad-card-author { font-size: 11px; color: var(--muted); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, background var(--transition);
            touch-action: manipulation;
            min-height: var(--btn-min-height);
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn.success { background: #34c759; color: #fff; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
            padding: 16px;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            animation: slideUp 0.3s ease;
            transition: background var(--transition), border-color var(--transition), transform var(--transition), opacity var(--transition);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            line-height: 1;
            z-index: 5;
            transition: transform 0.2s;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 16px; padding-right: 30px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition), background var(--transition), color var(--transition);
            font-family: var(--font);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { border-color: var(--accent); }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-weight: 500;
        }
        .tutorial-overlay,
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: background var(--transition);
        }
        .tutorial-slide {
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }
        .tutorial-slide h2 { font-weight: 900; font-size: 24px; margin-bottom: 12px; }
        .tutorial-slide p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .tutorial-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            gap: 8px;
        }
        .star-rating { display: flex; gap: 4px; font-size: 28px; cursor: pointer; }
        .star-rating span { color: var(--border); transition: color 0.2s, transform 0.2s; }
        .star-rating span.active { color: var(--gold); }
        .star-rating span:hover { transform: scale(1.2); }
        .review-item { border-bottom: 1px solid var(--border); padding: 10px 0; transition: border-color var(--transition); }
        .review-item:last-child { border-bottom: none; }
        .game-click-area {
            width: 100%;
            max-width: 250px;
            aspect-ratio: 1;
            margin: 0 auto 20px;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--border);
            transition: transform 0.1s, border-color var(--transition);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .game-click-area:active { transform: scale(0.92); }
        .game-click-area img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .upgrade-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: var(--card);
            transition: background var(--transition), border-color var(--transition);
        }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: 700; font-size: 14px; }
        .upgrade-cost { font-size: 12px; color: var(--muted); }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; transition: background var(--transition); }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .category-tile {
            padding: 12px 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: transform 0.2s, border-color var(--transition), background var(--transition);
        }
        .category-tile:active { transform: scale(0.95); }
        .category-tile .cat-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .search-suggestion {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .search-suggestion:hover,
        .search-suggestion:active { background: var(--border); }
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile {
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: transform 0.2s, border-color var(--transition), background var(--transition);
        }
        .grid-tile:active { transform: scale(0.95); }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .image-gallery {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 12px;
            scroll-snap-type: x mandatory;
        }
        .image-gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            scroll-snap-align: start;
            flex-shrink: 0;
            background: var(--border);
            transition: opacity 0.3s;
        }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }
        .w-full { width: 100%; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background var(--transition);
        }
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: var(--shadow);
            animation: slideUp 0.4s ease;
            transition: background var(--transition), border-color var(--transition);
        }
        .auth-tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
        .auth-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    </style>
</head>
<body>
    <!-- Шапка -->
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search">
            <input type="text" id="globalSearchInput" placeholder="🔍 Поиск товаров" autocomplete="off" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>

    <!-- Основной контент -->
    <main class="container" id="mainContainer">
        <section class="section active" id="section-home">
            <div class="ads-grid" id="homeFeed"></div>
        </section>
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType">
                        <option value="sell">Продажа</option>
                        <option value="buy">Покупка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000" inputmode="text">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую, до 20, необязательно)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                    <div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div>
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить на модерацию</button>
            </div>
        </section>
        <section class="section" id="section-my-ads">
            <h2 style="margin-bottom:12px;font-weight:800;">📦 Мои объявления</h2>
            <div id="myAdsList"></div>
        </section>
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <!-- Нижняя навигация -->
    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-section="cart">
            <span class="nav-icon">🛒</span>
            <span>Корзина</span>
        </button>
        <button class="nav-item" data-section="send">
            <span class="nav-icon">➕</span>
            <span>Отправка</span>
        </button>
        <button class="nav-item" data-section="my-ads">
            <span class="nav-icon">📦</span>
            <span>Мои</span>
        </button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin">
            <span class="nav-icon">🛡️</span>
            <span>Админ</span>
        </button>
        <button class="nav-item" data-section="all">
            <span class="nav-icon">☰</span>
            <span>Все</span>
        </button>
    </nav>

    <!-- Контейнеры -->
    <div id="modalContainer"></div>
    <div id="tutorialContainer"></div>
    <div id="authContainer"></div>

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

            }

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return base;
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function formatPriceInput(input) {
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

                                if (timerDisplay) timerDisplay.remove();
                            }
                        }, 1000);
                    }
                    const prevBtn = document.getElementById('tutPrevBtn');
                    const nextBtn = document.getElementById('tutNextBtn');
                    const finishBtn = document.getElementById('tutFinishBtn');
                    if (prevBtn) prevBtn.addEventListener('click', () => {
                        if (currentSlide > 0) { currentSlide--; renderSlide(); }
                    });
                    if (nextBtn) nextBtn.addEventListener('click', () => {
                        if (timeLeft > 0) {
                            showAlert('Подождите', 'Необходимо дождаться окончания таймера', 'error');
                            return;
                        }
                        currentSlide++;
                        renderSlide();
                    });
                    if (finishBtn) finishBtn.addEventListener('click', () => {
                        localStorage.setItem(`arizona_${userKey}_admin_tutorial_completed`, '1');
                        container.innerHTML = '';
                        activeTutorialType = null;
                    });
                }
                renderSlide();
            }

            // ==================== НАВИГАЦИЯ ====================
            function switchSection(section) {
                currentSection = section;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById('section-' + section).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
                if (navBtn) navBtn.classList.add('active');
                // Плавная прокрутка к началу контента
                window.scrollTo({ top: 0, behavior: 'smooth' });
                if (section === 'home') loadHomeFeed();
                if (section === 'cart') loadCart();
                if (section === 'send') populateSendForm();
                if (section === 'my-ads') loadMyAds();
                if (section === 'admin') {
                    loadAdminPanel();
                    const adminTutDone = localStorage.getItem(`arizona_${currentUser.id}_admin_tutorial_completed`) === '1';
                    if (isAdmin && !adminTutDone) showAdminTutorial();
                }
                if (section === 'all') loadAllTiles();
                playSfx('click');
                requestWakeLock();
            }
            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = btn.dataset.section;
                    if (sec === 'admin' && !isAdmin) return;
                    switchSection(sec);
                });

            // ==================== ЗАГРУЗКА ПОЛЬЗОВАТЕЛЯ ====================
            async function loadCurrentUserFromSession() {
                const userId = getSessionUserId();
                if (!userId) return null;
                if (!supabase) return null;
                try {
                    const { data, error } = await withTimeout(
                        supabase.from('app_users').select('*').eq('id', userId).maybeSingle()
                    );
                    if (error) throw error;
                    if (data) {
                        if (data.banned) {
                            showBanScreen();
                            return null;
                        }
                        return data;
                    }
                } catch (e) {
                    console.warn('loadCurrentUserFromSession error', e);
                }
                return null;
            }

            async function initApp() {
                // Проверяем, есть ли сессия
                let user = await loadCurrentUserFromSession();

                    user = await showAuthScreen();
                    if (!user) return;
                }
                currentUser = user;

            function populateSendForm() {

                catSelect.innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                const serverSelect = document.getElementById('sendServer');

                const priceInput = document.getElementById('sendPrice');

            function formatPriceInputHandler(e) { formatPriceInput(e.target); }

            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!currentUser) return;
                const mode = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const itemName = document.getElementById('sendName').value.trim();
                const priceRaw = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const images = document.getElementById('sendImages').value.trim();
                const server = document.getElementById('sendServer').value;
                if (!itemName) { showAlert('Ошибка', 'Введите название'); return; }
                if (!priceRaw) { showAlert('Ошибка', 'Введите цену'); return; }
                if (!description) { showAlert('Ошибка', 'Введите описание'); return; }
                const now = new Date();
                const mskHour = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' })).getHours();
                if (mskHour < 9 || mskHour >= 22) {
                    showAlert('Ошибка', 'Объявления принимаются только с 09:00 до 22:00 по МСК');
                    return;
                }
                if (Date.now() - lastAdSubmitTime < 120000) {
                    showAlert('Ошибка', 'Подождите 2 минуты перед отправкой следующего объявления');
                    return;
                }
                const linkCheck = checkLinksString(images);
                if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                const priceNum = parsePriceToNumber(priceRaw);
                const newAd = {
                    mode,
                    category,
                    item_name: itemName,
                    price: priceNum,
                    description,
                    images,
                    server,
                    author_id: currentUser.username, // используем логин
                    status: 'pending',
                    created_at: new Date().toISOString()
                };
                try {
                    await withTimeout(supabase.from('ads').insert(newAd));
                    lastAdSubmitTime = Date.now();
                    playSfx('success');
                    showAlert('Успех', 'Ваше объявление отправлено на модерацию', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось отправить объявление');
                }
            });

            async function adminUserAction(action) {
                const target = document.getElementById('adminUsernameInput').value.trim();
                if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
                try {
                    let query = supabase.from('app_users').select('*');
                    if (!isNaN(target)) {
                        query = query.eq('id', target);
                    } else {
                        query = query.eq('username', target);
                    }
                    const { data: user, error } = await withTimeout(query.maybeSingle());
                    if (error) throw error;
                    if (!user) { showAlert('Ошибка', 'Пользователь не найден'); return; }
                    let updates = {};
                    if (action === 'ban') updates.banned = true;
                    else if (action === 'unban') updates.banned = false;
                    else if (action === 'make_admin') updates.is_admin = true;
                    else if (action === 'remove_admin') updates.is_admin = false;
                    await withTimeout(supabase.from('app_users').update(updates).eq('id', user.id));
                    playSfx('success');
                    showAlert('Успех', 'Действие выполнено');
                    loadAdminPanel();
                } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
            }

            // ==================== ДЕТАЛИ ОБЪЯВЛЕНИЯ ====================
            async function openAdDetail(ad) {
                if (!currentUser) return;
                let galleryHtml = '';
                const images = ad.images ? ad.images.split(',').map(s => s.trim()).filter(s => s) : [];
                if (images.length) {
                    galleryHtml = '<div class="image-gallery">' + images.map(img => `<img src="${img}" onerror="this.style.display='none'">`).join('') + '</div>';
                }
                const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                let statusHtml = '';
                if (ad.status === 'pending') statusHtml = '<div class="empty-state">Объявление находится на модерации</div>';
                else if (ad.status === 'deleted') {
                    statusHtml = '<div class="empty-state">Объявление удалено</div>';
                    if (ad.author_id === currentUser.username) {
                        statusHtml += '<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Апелляция</button>';
                    }
                } else {
                    statusHtml = `
                        <button class="btn w-full mb-8" id="detailContactBtn">💬 Написать / Связаться</button>
                        <button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 Корзина</button>
                        <button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ Отзывы</button>
                        ${ad.author_id === currentUser.username ? '<button class="btn danger w-full" id="detailDeleteBtn">🗑 Удалить объявление</button>' : ''}
                    `;
                }
                const isFav = await checkIfInCart(ad.id);
                const { overlay, closeModal } = showModal(`
                    <h3 class="modal-title">${ad.item_name}</h3>
                    <div class="ad-card-badges mb-8">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span></div>
                    ${galleryHtml}
                    <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px;">${formatPrice(ad.price)}</div>
                    <p style="color:var(--muted);margin-bottom:12px;">${ad.description || 'Нет описания'}</p>
                    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Автор: <span style="color:var(--text);cursor:pointer;" id="detailAuthorLink">${ad.author_id}</span></div>
                    ${statusHtml}
                    <div id="detailReviewsSection"></div>
                    <h4 style="margin:16px 0 8px;">Похожие объявления</h4>
                    <div id="detailSimilarAds"></div>
                `);
                if (ad.status === 'approved') {
                    document.getElementById('detailContactBtn').addEventListener('click', () => {
                        let contact = ad.author_id;
                        if (contact.startsWith('@')) {
                            window.open(`https://t.me/${contact.replace('@', '')}`, '_blank');
                        } else {
                            // Попробуем найти telegram username в app_users
                            supabase.from('app_users').select('telegram_username').eq('username', contact).maybeSingle().then(({ data }) => {
                                if (data && data.telegram_username) {
                                    window.open(`https://t.me/${data.telegram_username.replace('@', '')}`, '_blank');
                                } else {
                                    showAlert('Контакт', `Автор: ${contact}`);
                                }
                            }).catch(() => showAlert('Контакт', `Автор: ${contact}`));
                        }
                    });
                    const cartBtn = document.getElementById('detailCartToggleBtn');
                    cartBtn.textContent = isFav ? '🛒 Убрать из корзины' : '🛒 Корзина';
                    cartBtn.addEventListener('click', async () => {
                        if (isFav) {
                            await withTimeout(supabase.from('favorites').delete().eq('user_id', currentUser.id).eq('ad_id', ad.id));
                            cartBtn.textContent = '🛒 Корзина';
                        } else {
                            await withTimeout(supabase.from('favorites').insert({ user_id: currentUser.id, ad_id: ad.id }));
                            cartBtn.textContent = '🛒 Убрать из корзины';
                        }
                        playSfx('click');
                        loadCart();
                    });
                    document.getElementById('detailReviewsBtn').addEventListener('click', () => openReviewsModal(ad.id));
                    if (ad.author_id === currentUser.username) {
                        document.getElementById('detailDeleteBtn').addEventListener('click', async () => {
                            showConfirm('Удаление', 'Удалить объявление?', async () => {
                                await withTimeout(supabase.from('ads').update({ status: 'deleted' }).eq('id', ad.id));
                                playSfx('click');
                                closeModal();
                                loadHomeFeed();
                            });
                        });
                    }
                }
                if (ad.status === 'deleted' && ad.author_id === currentUser.username) {
                    const appealBtn = document.getElementById('detailAppealBtn');
                    if (appealBtn) appealBtn.addEventListener('click', () => {
                        appealAdId = ad.id;
                        openAppealModal();
                    });
                }
                document.getElementById('detailAuthorLink').addEventListener('click', () => openProfileModal(ad.author_id));
                loadReviews(ad.id);
                loadSimilarAds(ad.category, ad.id);
            }

            async function checkIfInCart(adId) {
                if (!supabase || !currentUser) return false;
                try {
                    const { data } = await withTimeout(
                        supabase.from('favorites').select('*').eq('user_id', currentUser.id).eq('ad_id', adId).maybeSingle()
                    );
                    return !!data;
                } catch (e) { return false; }
            }

            // ==================== ОТЗЫВЫ ====================
            async function loadReviews(adId) {
                const container = document.getElementById('detailReviewsSection');
                if (!container) return;
                try {
                    const { data: reviews, error } = await withTimeout(
                        supabase.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false })
                    );
                    if (error) throw error;
                    const reviewsData = reviews || [];
                    if (!reviewsData.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Отзывов пока нет</p>';
                        return;
                    }
                    const avg = reviewsData.reduce((s, r) => s + r.stars, 0) / reviewsData.length;
                    let html = `<div style="font-size:20px;font-weight:800;margin-bottom:8px;">⭐ ${avg.toFixed(1)} (${reviewsData.length})</div>`;
                    html += '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>';
                    reviewsData.forEach(r => {
                        const canEdit = r.author_id === currentUser.username && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                        html += `
                            <div class="review-item">
                                <div style="font-weight:600;">${r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
                                <div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
                                <p style="font-size:13px;margin:4px 0;">${r.text || ''}</p>
                                ${r.media_links ? `<div style="font-size:11px;color:var(--accent);">${r.media_links}</div>` : ''}
                                ${canEdit ? `<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-delete-review="${r.id}">🗑</button></div>` : ''}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-edit-review]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const rev = reviewsData.find(r => r.id == btn.dataset.editReview);
                            if (rev) openEditReviewModal(rev);
                        });
                    });
                    container.querySelectorAll('[data-delete-review]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('reviews').delete().eq('id', btn.dataset.deleteReview));
                            playSfx('click');
                            loadReviews(adId);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:var(--muted);">Не удалось загрузить отзывы</p>';
                }
            }

            async function loadSimilarAds(category, currentAdId) {
                const container = document.getElementById('detailSimilarAds');
                if (!container) return;
                try {
                    const { data } = await withTimeout(
                        supabase.from('ads').select('*').eq('status', 'approved').eq('category', category).neq('id', currentAdId).limit(3).order('created_at', { ascending: false })
                    );
                    const similar = data || [];
                    if (!similar.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Похожих нет</p>';
                        return;
                    }
                    container.innerHTML = similar.map(ad => `
                        <div class="card" style="cursor:pointer;" data-sim="${ad.id}">
                            <span style="font-weight:700;">${ad.item_name}</span> • ${formatPrice(ad.price)}
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-sim]').forEach(el => {
                        el.addEventListener('click', () => {
                            const found = similar.find(a => a.id == el.dataset.sim);
                            if (found) {
                                const overlay = document.getElementById('modalOverlay');
                                if (overlay) overlay.remove();
                                openAdDetail(found);
                            }
                        });
                    });
                } catch (e) {}
            }

            function updateStars(container, selected) {
                container.querySelectorAll('span').forEach(span => {
                    span.textContent = parseInt(span.dataset.star) <= selected ? '★' : '☆';
                    span.classList.toggle('active', parseInt(span.dataset.star) <= selected);
                });
            }

            function openBarygaGame() {
                if (!currentUser) return;
                loadGameState().then(() => {
                    const { closeModal } = showModal(`
                        <h3 class="modal-title">🎮 Игра «Барыга»</h3>
                        <div style="text-align:center;font-size:24px;font-weight:900;margin-bottom:8px;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div>
                        <div class="game-click-area" id="gameClickArea">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FF9900'/%3E%3Ctext x='50' y='60' font-size='40' text-anchor='middle' fill='white'%3E💰%3C/text%3E%3C/svg%3E" alt="Клик">
                        </div>
                        <div style="font-size:12px;color:var(--muted);text-align:center;">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div>
                        <div class="mt-12" id="gameUpgrades"></div>
                    `);
                    // Делегирование для кликов по области
                    const clickArea = document.getElementById('gameClickArea');
                    clickArea.addEventListener('click', () => {
                        gameState.money += gameState.clickPower;
                        updateGameUI();
                        playSfx('click');
                        saveGameState();
                        clickArea.style.transform = 'scale(0.9)';
                        setTimeout(() => clickArea.style.transform = '', 100);
                    });
                    // Делегирование для апгрейдов
                    const upgradesContainer = document.getElementById('gameUpgrades');
                    upgradesContainer.addEventListener('click', (e) => {
                        const btn = e.target.closest('[data-upgrade]');
                        if (!btn) return;
                        const idx = parseInt(btn.dataset.upgrade);
                        const upgrades = getUpgradeList();
                        const upgrade = upgrades[idx];
                        if (gameState.money >= upgrade.cost) {
                            gameState.money -= upgrade.cost;
                            upgrade.action();
                            updateGameUI();
                            saveGameState();
                            playSfx('buy');
                        }
                    });
                    updateGameUI();
                    // Авто-доход каждую секунду
                    if (gameLoopInterval) clearInterval(gameLoopInterval);
                    gameLoopInterval = setInterval(() => {
                        if (gameState.autoIncome > 0) {
                            gameState.money += gameState.autoIncome;
                            updateGameUI();
                            saveGameState();
                        }
                    }, 1000);
                    // Очистка интервала при закрытии
                    const modalOverlay = document.getElementById('modalOverlay');
                    if (modalOverlay) {
                        modalOverlay.addEventListener('click', (e) => {
                            if (e.target === modalOverlay) {
                                if (gameLoopInterval) clearInterval(gameLoopInterval);
                            }
                        });
                        const closeBtn = document.getElementById('modalCloseBtn');
                        if (closeBtn) closeBtn.addEventListener('click', () => {
                            if (gameLoopInterval) clearInterval(gameLoopInterval);
                        });
                    }
                });
            }

            function getUpgradeList() {
                return [
                    { name: 'Клик +1', cost: gameState.clickCost, action: () => { gameState.clickPower += 1;
                            gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost, action: () => { gameState.autoIncome += 5;
                            gameState.autoCost *= 2; } },
                    { name: 'Про +20/сек', cost: gameState.proCost, action: () => { gameState.autoIncome += 20;
                            gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost, action: () => { gameState.autoIncome += 50;
                            gameState.shopCost *= 2; } },
                    { name: 'Элита: клик +10', cost: gameState.eliteCost, action: () => { gameState.clickPower += 10;
                            gameState.eliteCost *= 2;

                    { name: 'Нефть +200/сек', cost: gameState.oilCost, action: () => { gameState.autoIncome += 200;

                    { name: 'Крипта +1000/сек', cost: gameState.cryptoCost, action: () => { gameState.autoIncome += 1000;

            }

            function updateGameUI() {
                const moneyEl = document.getElementById('gameMoneyDisplay');

                if (upgradesContainer) {

                if (infoEl) infoEl.textContent = `Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек`;
            }

                            description: desc,
                            created_at: new Date().toISOString()
                        }));
                        playSfx('success');
                        showAlert('Успех', 'Лук опубликован');
                        document.getElementById('fashionNick').value = '';
                        document.getElementById('fashionImg').value = '';
                        document.getElementById('fashionDesc').value = '';
                        loadFashionList();
                    } catch (e) { showAlert('Ошибка', 'Не удалось опубликовать'); }
                });
            }

            async function loadFashionList() {
                const container = document.getElementById('fashionList');
                if (!container) return;
                try {
                    const { data, error } = await withTimeout(
                        supabase.from('looks').select('*').order('created_at', { ascending: false }).limit(20)
                    );
                    if (error) throw error;
                    const looks = data || [];
                    if (!looks.length) {
                        container.innerHTML = '<div class="empty-state">Луков пока нет</div>';
                        return;
                    }
                    container.innerHTML = looks.map(l => `
                        <div class="card" style="margin-bottom:8px;">
                            <img src="${l.image_url}" onerror="this.style.display='none'" style="width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-bottom:8px;">
                            <div style="font-weight:700;">${l.nick}</div>
                            ${l.description ? `<div style="font-size:13px;color:var(--muted);">${l.description}</div>` : ''}
                            <div style="font-size:11px;color:var(--muted);">Автор: ${l.author_id} • ${new Date(l.created_at).toLocaleDateString('ru-RU')}</div>
                            ${l.author_id === currentUser.username ? `<button class="btn danger mt-8" data-delete-look="${l.id}">🗑 Удалить</button>` : ''}
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-delete-look]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('looks').delete().eq('id', btn.dataset.deleteLook));
                            playSfx('click');
                            loadFashionList();
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
                }
            }

            function openTravelModal() {
                const { closeModal } = showModal(`
                    <h3 class="modal-title">🤝 Попутчики</h3>
                    <div class="form-group">
                        <label>Ваш ник</label>
                        <input type="text" id="travelNick" placeholder="Введите ник">
                    </div>
                    <div class="form-group">
                        <label>Откуда</label>
                        <input type="text" id="travelFrom" placeholder="Город отправления">
                    </div>
                    <div class="form-group">
                        <label>Куда</label>
                        <input type="text" id="travelTo" placeholder="Город назначения">
                    </div>
                    <div class="form-group">
                        <label>Дата и время</label>
                        <input type="text" id="travelDate" placeholder="Например: завтра в 18:00">
                    </div>
                    <div class="form-group">
                        <label>Комментарий (необязательно)</label>
                        <textarea id="travelComment" placeholder="Дополнительная информация"></textarea>
                    </div>
                    <button class="btn w-full" id="travelSubmit">Найти попутчиков</button>
                    <div id="travelList" class="mt-12"></div>
                `);
                loadTravelList();
                document.getElementById('travelSubmit').addEventListener('click', async () => {
                    const nick = document.getElementById('travelNick').value.trim();
                    const from = document.getElementById('travelFrom').value.trim();
                    const to = document.getElementById('travelTo').value.trim();
                    const date = document.getElementById('travelDate').value.trim();
                    const comment = document.getElementById('travelComment').value.trim();
                    if (!nick || !from || !to || !date) { showAlert('Ошибка', 'Заполните все обязательные поля'); return; }
                    try {
                        await withTimeout(supabase.from('travel_partners').insert({
                            author_id: currentUser.username,
                            nick: nick,
                            from_city: from,
                            to_city: to,
                            travel_date: date,
                            comment: comment,
                            created_at: new Date().toISOString()
                        }));
                        playSfx('success');
                        showAlert('Успех', 'Заявка опубликована');
                        document.getElementById('travelNick').value = '';
                        document.getElementById('travelFrom').value = '';
                        document.getElementById('travelTo').value = '';
                        document.getElementById('travelDate').value = '';
                        document.getElementById('travelComment').value = '';
                        loadTravelList();
                    } catch (e) { showAlert('Ошибка', 'Не удалось опубликовать'); }
                });
            }

            async function loadTravelList() {
                const container = document.getElementById('travelList');
                if (!container) return;
                try {
                    const { data, error } = await withTimeout(
                        supabase.from('travel_partners').select('*').order('created_at', { ascending: false }).limit(20)
                    );
                    if (error) throw error;
                    const travels = data || [];
                    if (!travels.length) {
                        container.innerHTML = '<div class="empty-state">Заявок пока нет</div>';
                        return;
                    }
                    container.innerHTML = travels.map(t => `
                        <div class="card" style="margin-bottom:8px;">
                            <div style="font-weight:700;">${t.nick}</div>
                            <div style="font-size:13px;">${t.from_city} → ${t.to_city}</div>
                            <div style="font-size:13px;color:var(--muted);">📅 ${t.travel_date}</div>
                            ${t.comment ? `<div style="font-size:13px;color:var(--muted);">${t.comment}</div>` : ''}
                            <div style="font-size:11px;color:var(--muted);">Автор: ${t.author_id}</div>
                            ${t.author_id === currentUser.username ? `<button class="btn danger mt-8" data-delete-travel="${t.id}">🗑 Удалить</button>` : ''}
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-delete-travel]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await withTimeout(supabase.from('travel_partners').delete().eq('id', btn.dataset.deleteTravel));
                            playSfx('click');
                            loadTravelList();
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
                }

            function openMusicModal() {
                const { closeModal } = showModal(`
                    <h3 class="modal-title">🎵 Музыка</h3>
                    <div class="form-group">
                        <label>Ссылка на аудио (mp3, ogg)</label>
                        <input type="text" id="musicUrl" placeholder="https://example.com/music.mp3">
                    </div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="musicPlayBtn">▶️ Играть</button>
                        <button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button>
                        <button class="btn danger w-full" id="musicStopBtn">⏹ Сброс</button>
                    </div>
                    <div id="musicStatus" style="text-align:center;color:var(--muted);"></div>
                `);
                const savedMusic = localStorage.getItem('arizona_music_url');
                if (savedMusic) {
                    document.getElementById('musicUrl').value = savedMusic;
                }
                document.getElementById('musicPlayBtn').addEventListener('click', () => {
                    const url = document.getElementById('musicUrl').value.trim();
                    if (!url) { showAlert('Ошибка', 'Введите ссылку'); return; }
                    if (!isAllowedLink(url)) { showAlert('Ошибка', 'Ссылка не разрешена'); return; }
                    localStorage.setItem('arizona_music_url', url);
                    playBackgroundMusic(url);
                });
                document.getElementById('musicPauseBtn').addEventListener('click', () => {
                    if (bgMusic) bgMusic.pause();
                    document.getElementById('musicStatus').textContent = 'Пауза';
                });
                document.getElementById('musicStopBtn').addEventListener('click', () => {
                    if (bgMusic) {
                        bgMusic.pause();
                        bgMusic = null;
                    }
                    localStorage.removeItem('arizona_music_url');
                    document.getElementById('musicStatus').textContent = 'Музыка остановлена';
                });
            }

            function playBackgroundMusic(url) {
                try {
                    if (bgMusic) {
                        bgMusic.pause();
                        bgMusic = null;
                    }
                    bgMusic = new Audio(url);
                    bgMusic.loop = true;
                    bgMusic.volume = 0.5;
                    bgMusic.play().then(() => {
                        document.getElementById('musicStatus').textContent = 'Играет: ' + url;
                    }).catch(e => {
                        document.getElementById('musicStatus').textContent = 'Ошибка воспроизведения';
                    });
                } catch (e) {
                    document.getElementById('musicStatus').textContent = 'Ошибка';
                }
            }

            function initMusicFromStorage() {
                const url = localStorage.getItem('arizona_music_url');
                if (url && !bgMusic) {
                    bgMusic = new Audio(url);
                    bgMusic.loop = true;
                    bgMusic.volume = 0.5;
                    bgMusic.play().catch(() => {});
                }
            }

            function openSettingsModal() {
                const { closeModal } = showModal(`
                    <h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group flex-between">
                        <label>Звуки (SFX)</label>
                        <input type="checkbox" id="settingsSfxToggle" ${sfxEnabled ? 'checked' : ''} style="width:auto;">
                    </div>
                    <div class="form-group flex-between">
                        <label>Тема</label>
                        <button class="btn secondary" id="settingsThemeBtn">${currentTheme === 'light' ? '🌙 Тёмная' : '☀️ Светлая'}</button>
                    </div>
                    <button class="btn danger w-full" id="settingsResetBtn">Сбросить все данные</button>
                `);
                document.getElementById('settingsSfxToggle').addEventListener('change', (e) => {
                    sfxEnabled = e.target.checked;
                    localStorage.setItem('sfx', sfxEnabled ? 'on' : 'off');
                });
                document.getElementById('settingsThemeBtn').addEventListener('click', () => {
                    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                    localStorage.setItem('theme', currentTheme);
                    applyTheme();
                    document.getElementById('settingsThemeBtn').textContent = currentTheme === 'light' ? '🌙 Тёмная' : '☀️ Светлая';
                });
                document.getElementById('settingsResetBtn').addEventListener('click', () => {
                    showConfirm('Сброс', 'Удалить все локальные данные? Это действие необратимо.', () => {
                        localStorage.clear();
                        clearSession();
                        location.reload();
                    });
                });
            }

            function openManagerModal() {
                showModal(`
                    <h3 class="modal-title">📩 Связь с менеджером</h3>
                    <p style="color:var(--muted);margin-bottom:12px;">Напишите владельцу:</p>
                    <a href="https://t.me/${OWNER_USERNAME}" target="_blank" class="btn w-full" style="text-decoration:none;">@${OWNER_USERNAME}</a>
                `);
            }

            function openChatsModal() {
                showModal(`
                    <h3 class="modal-title">💬 Переписки</h3>
                    <div class="empty-state">
                        Переписки временно недоступны в приложении.<br>
                        Используйте Telegram для общения с продавцами.
                    </div>
                    <a href="https://t.me/azrp_market" target="_blank" class="btn w-full mt-12" style="text-decoration:none;">Перейти в Telegram-канал</a>
                `);
            }

            // ==================== ПОИСК ====================
            function openSearchModal() {
                const { closeModal } = showModal(`
                    <h3 class="modal-title">🔍 Поиск</h3>
                    <div class="form-group">
                        <input type="text" id="searchInput" placeholder="Введите запрос...">
                    </div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="searchItemBtn">📦 Предмет</button>
                        <button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button>
                    </div>
                    <div id="searchSuggestions"></div>
                    <div id="searchHistory"></div>
                    <div id="searchResults"></div>
                `);
                const input = document.getElementById('searchInput');
                const suggestions = document.getElementById('searchSuggestions');
                const results = document.getElementById('searchResults');
                const history = document.getElementById('searchHistory');

                function renderHistory() {
                    if (!searchHistory.length) { history.innerHTML = ''; return; }
                    history.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">История:</div>' +
                        searchHistory.map(h => `<span class="badge" style="cursor:pointer;margin:2px;" data-hist="${h}">${h}</span>`).join('');
                    history.querySelectorAll('[data-hist]').forEach(el => {
                        el.addEventListener('click', () => {
                            input.value = el.dataset.hist;
                            input.dispatchEvent(new Event('input'));
                        });
                    });
                }
                renderHistory();
                input.addEventListener('input', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) { suggestions.innerHTML = '';
                        results.innerHTML = ''; return; }
                    try {
                        const { data } = await withTimeout(
                            supabase.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(5)
                        );
                        const items = data || [];
                        suggestions.innerHTML = items.map(ad => `<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`).join('');
                        suggestions.querySelectorAll('[data-sug]').forEach(el => {
                            el.addEventListener('click', () => {
                                const ad = items.find(a => a.id == el.dataset.sug);
                                if (ad) {
                                    if (!searchHistory.includes(q)) {
                                        searchHistory.unshift(q);
                                        if (searchHistory.length > 10) searchHistory.pop();
                                        localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
                                    }
                                    closeModal();
                                    openAdDetail(ad);
                                }
                            });
                        });
                    } catch (e) {}
                });
                document.getElementById('searchItemBtn').addEventListener('click', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) return;
                    try {
                        const { data } = await withTimeout(
                            supabase.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`)
                        );
                        const items = data || [];
                        if (!items.length) { results.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
                        results.innerHTML = items.map(ad => `
                            <div class="card" data-res-id="${ad.id}">
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                            </div>
                        `).join('');
                        results.querySelectorAll('[data-res-id]').forEach(card => {
                            card.addEventListener('click', () => {
                                const ad = items.find(a => a.id == card.dataset.resId);
                                if (ad) { closeModal();
                                    openAdDetail(ad); }
                            });
                        });
                    } catch (e) {}
                });
                document.getElementById('searchProfileBtn').addEventListener('click', async () => {
                    const q = input.value.trim();
                    if (!q) return;
                    openProfileModal(q);
                });
            }

            async function openProfileModal(authorId) {
                const { closeModal } = showModal(`
                    <h3 class="modal-title">👤 Профиль: ${authorId}</h3>
                    <div id="profileAdsList"><div class="empty-state">Загрузка...</div></div>
                `);
                try {
                    const { data } = await withTimeout(
                        supabase.from('ads').select('*').eq('status', 'approved').eq('author_id', authorId).order('created_at', { ascending: false })
                    );
                    const ads = data || [];
                    const container = document.getElementById('profileAdsList');
                    if (!ads.length) {
                        container.innerHTML = '<div class="empty-state">У пользователя нет активных объявлений</div>';
                        return;
                    }
                    container.innerHTML = ads.map(ad => `
                        <div class="card" data-prof-ad="${ad.id}">
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-prof-ad]').forEach(card => {
                        card.addEventListener('click', () => {
                            const ad = ads.find(a => a.id == card.dataset.profAd);
                            if (ad) { closeModal();
                                openAdDetail(ad); }
                        });
                    });
                } catch (e) {
                    document.getElementById('profileAdsList').innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
                }
            }

            // ==================== КАТАЛОГ ====================
            function openCatalogModal() {
                const { closeModal } = showModal(`
                    <h3 class="modal-title">📂 Каталог</h3>
                    <div class="category-grid">
                        ${ALL_CATEGORIES.map(cat => `
                            <div class="category-tile" data-cat="${cat.id}">
                                <span class="cat-icon">${cat.label.split(' ')[0]}</span>
                                ${cat.label}
                            </div>
                        `).join('')}
                    </div>
                `);
                document.querySelectorAll('.category-tile').forEach(tile => {
                    tile.addEventListener('click', () => {
                        currentFilterCategory = tile.dataset.cat;
                        closeModal();
                        switchSection('home');
                    });
                });
            }

            // ==================== ВСЕ РАЗДЕЛЫ (СЕТКА) ====================
            function loadAllTiles() {
                const container = document.getElementById('allTiles');
                const tiles = [
                    { icon: '📦', label: 'Мои объявления', action: () => switchSection('my-ads') },
                    { icon: '📂', label: 'Каталог', action: openCatalogModal },
                    { icon: '🎮', label: 'Игра «Барыга»', action: openBarygaGame },
                    { icon: '🔍', label: 'Поиск', action: openSearchModal },
                    { icon: '📸', label: 'Лента «Луков»', action: openFashionModal },
                    { icon: '🤝', label: 'Попутчики', action: openTravelModal },
                    { icon: '🎵', label: 'Музыка', action: openMusicModal },
                    { icon: '⚙️', label: 'Настройки', action: openSettingsModal },
                    { icon: '📩', label: 'Менеджер', action: openManagerModal },
                    { icon: '💬', label: 'Переписки', action: openChatsModal }
                ];
                container.innerHTML = tiles.map(t => `
                    <div class="grid-tile" data-action="${t.label}">
                        <span class="tile-icon">${t.icon}</span>
                        ${t.label}
                    </div>
                `).join('');
                container.querySelectorAll('.grid-tile').forEach(tile => {
                    tile.addEventListener('click', () => {
                        const found = tiles.find(t => t.label === tile.dataset.action);
                        if (found) found.action();
                    });
                });
            }

            // ==================== ГЛОБАЛЬНЫЙ ПОИСК В ШАПКЕ ====================
            document.getElementById('logoBtn').addEventListener('click', () => {
                currentFilterCategory = null;
                switchSection('home');
            });
            document.getElementById('globalSearchInput').addEventListener('focus', () => {
                openSearchModal();
            });

            // ==================== ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ ====================
            document.addEventListener('DOMContentLoaded', () => {
                initApp();
            });

            // Запускаем инициализацию сразу, если DOM уже загружен
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                initApp();
            }
        })();
    </script>
