<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; overflow-x: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        .container { max-width: var(--container-width); margin: 0 auto; padding: 0 12px; padding-top: calc(var(--header-height) + 10px); padding-bottom: calc(var(--nav-height) + 20px); }
        @media (min-width: 768px) { :root { --container-width: 720px; } .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        @media (min-width: 1024px) { :root { --container-width: 1200px; } .ads-grid { grid-template-columns: repeat(3, 1fr); } }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 8px 12px; height: var(--header-height); gap: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .header-logo { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; cursor: pointer; }
        .header-search input { width: 100%; padding: 8px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; outline: none; pointer-events: none; }
        .theme-toggle { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; flex-shrink: 0; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; height: var(--nav-height); padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 8px; flex: 1; max-width: 80px; min-height: var(--btn-min-height); }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0, 91, 255, 0.08); }
        .section { display: none; opacity: 0; transform: translateY(10px); transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }
        .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px; cursor: pointer; }
        .card.inactive-card { background: rgba(128, 128, 128, 0.12) !important; opacity: 0.75; }
        .ad-card { display: flex; gap: 10px; align-items: flex-start; }
        .ad-card-img { width: 80px; height: 100px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--border); color: var(--text); white-space: nowrap; }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }
        .ad-card-author { font-size: 11px; color: var(--muted); }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: var(--radius); border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; min-height: var(--btn-min-height); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn.success { background: #34c759; color: #fff; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn.w-full { width: 100%; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; transition: opacity 0.25s ease; }
        .modal-overlay.show { opacity: 1; }
        .modal { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; padding: 20px; position: relative; transform: translateY(20px); transition: transform 0.25s ease; }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); z-index: 5; }
        .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 16px; padding-right: 30px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; font-family: var(--font); }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 500; }
        .tutorial-overlay, .fullscreen-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
        .tutorial-slide { max-width: 420px; width: 100%; }
        .tutorial-slide h2 { font-weight: 900; font-size: 24px; margin-bottom: 12px; }
        .tutorial-slide p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .tutorial-nav { display: flex; gap: 10px; margin-top: 15px; }
        .star-rating { display: flex; gap: 4px; font-size: 28px; cursor: pointer; }
        .star-rating span { color: var(--border); }
        .star-rating span.active { color: var(--gold); }
        .review-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .game-click-area { width: 100%; max-width: 250px; aspect-ratio: 1; margin: 0 auto 20px; cursor: pointer; border-radius: 50%; overflow: hidden; border: 4px solid var(--border); }
        .game-click-area img { width: 100%; height: 100%; object-fit: cover; }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile { padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); text-align: center; cursor: pointer; font-weight: 700; font-size: 13px; }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .image-gallery { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; scroll-snap-type: x mandatory; }
        .image-gallery img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; scroll-snap-align: start; flex-shrink: 0; background: var(--border); }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .w-full { width: 100%; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; } .text-center { text-align: center; }
        .auth-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-box { width: 100%; max-width: 400px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; box-shadow: var(--shadow); }
        .auth-tab { flex: 1; padding: 8px; background: none; border: none; cursor: pointer; font-weight: 700; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
        .auth-tab:not(.active) { color: var(--muted); border-bottom: 2px solid transparent; }
        #homeCategories { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        #homeCategories::-webkit-scrollbar { display: none; }
        #homeCategories .badge { cursor: pointer; padding: 6px 12px; flex-shrink: 0; }
        #homeCategories .badge.active { background: var(--accent); color: #fff; }
        .loader { border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast-container { position: fixed; top: 70px; right: 12px; z-index: 999; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
        .toast { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); font-size: 13px; font-weight: 500; color: var(--text); }
        .toast.success { border-left: 4px solid #34c759; } .toast.error { border-left: 4px solid #ff3b30; } .toast.info { border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" autocomplete="off" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Переключить тему">🌓</button>
    </header>

    <main class="container" id="mainContainer">
        <section class="section active" id="section-home">
            <div id="homeCategories" style="margin-bottom:12px;"></div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>

        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType"><option value="sell">Продажа</option><option value="buy">Покупка</option></select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>

        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Все разделы</span></button>
    </nav>

    <div id="modalContainer"></div>
    <div id="tutorialContainer"></div>
    <div id="authContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Phoenix', 'Tucson', 'Scottdale', 'Chandler', 'Brainburg', 'Saint-Rose', 'Mesa', 'Red-Rock', 'Yuma',
                'Surprise', 'Prescott', 'Glendale', 'Kingman', 'Winslow', 'Payson', 'Gilbert', 'Show-Low', 'Casa-Grande',
                'Page', 'Sun-City', 'Queen-Creek', 'Sedona', 'Holiday', 'Wednesday', 'Yava', 'Faraway', 'Bumble-Bee',
                'Christmas', 'Mirage', 'Love', 'Drake', 'Space', 'Home', 'Mobile I', 'Mobile II', 'Mobile III'
            ];
            const ALL_CATEGORIES = [
                { id: 'accessories', label: '💍 Аксессуары и вещи' },
                { id: 'transport', label: '🚗 Транспорт' },
                { id: 'realestate', label: '🏠 Недвижимость' },
                { id: 'business', label: '💼 Бизнесы' },
                { id: 'weapons', label: '🔫 Оружие и материалы' },
                { id: 'clothing', label: '👕 Одежда' },
                { id: 'electronics', label: '📱 Электроника' }
            ];
            const APPEAL_REASONS = [
                'Несправедливая блокировка', 'Ошибка модерации', 'Объявление удалили по ошибке',
                'Нарушение правил другой стороной', 'Техническая проблема', 'Возврат средств',
                'Жалоба на пользователя', 'Взлом аккаунта', 'Другое', 'Не знаю'
            ];
            const ALLOWED_DOMAINS = ['youtube.com', 'youtu.be', 'radikal.cloud', 'allwebs.ru', 'postimages.org', 'ru.imgbb.com'];
            const DEFAULT_AD_IMAGE = 'https://i.postimg.cc/zDwTPKwq/0465dd7cc4f5446e5e908000ec4379bb.jpg';

            // ИСПРАВЛЕННЫЕ ДАННЫЕ ПОД ТВОЙ FLUXBASE
            const SUPABASE_URL = 'http://localhost:8000'; // Если Fluxbase на сервере, укажи IP/домен (например, http://YOUR_IP:8000)
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsInRva2VuX3R5cGUiOiJhY2Nlc3MiLCJpc3MiOiJmbHV4YmFzZSIsImlhdCI6MTc4ODE2Mzc3MSwiZXhwIjoxODE5Njk5NzcxfQ.ZAuap5unaubwTZRyyiGlh5qmBUXuGNd1ePKR7JPgEY0';

            let supabaseClient = null;
            let currentAuthUser = null;
            let currentUser = { id: 0, username: '', first_name: '' };
            let currentSection = 'home';
            let currentTheme = localStorage.getItem('theme') || 'light';
            let sfxEnabled = localStorage.getItem('sfx') !== 'off';
            let currentFilterCategory = null;
            let currentUserServer = ALL_SERVERS[0];
            let isAdmin = false;
            let isOwner = false;
            let audioCtx = null;
            let userIdentifier = '';

            let gameState = { money: 0, clickPower: 1, clickCost: 50, autoIncome: 0, autoCost: 200 };
            let homeAds = [], cartAds = [], myAds = [], pendingAds = [], pendingAppeals = [];

            function initSupabase() {
                try {
                    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                        showFatalError('Не удалось загрузить библиотеку Supabase.');
                        return false;
                    }
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: { persistSession: false }
                    });
                    return true;
                } catch (e) {
                    showFatalError('Ошибка подключения к серверу Fluxbase.');
                    return false;
                }
            }

            function showFatalError(msg) {
                document.body.innerHTML = `<div class="fullscreen-overlay"><h1 style="color:#ff3b30;">⚠️ Ошибка</h1><p style="color:var(--muted);">${msg}</p><button class="btn mt-12" onclick="location.reload()">Повторить</button></div>`;
            }

            function initTelegram() {
                try {
                    if (window.Telegram && window.Telegram.WebApp) {
                        const tg = window.Telegram.WebApp;
                        tg.expand();
                        tg.ready();
                        const initData = tg.initDataUnsafe || {};
                        if (initData.user) {
                            currentUser = { id: initData.user.id || 0, username: initData.user.username || '', first_name: initData.user.first_name || 'Пользователь' };
                        }
                    }
                } catch (e) {}
                if (!currentUser.id) {
                    currentUser = { id: Math.floor(Math.random() * 900000000) + 100000000, username: 'guest_' + Math.floor(Math.random() * 10000), first_name: 'Гость' };
                }
            }

            function withTimeout(promise, ms = 10000) {
                return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))]);
            }

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            }

            function applyTheme() { document.documentElement.setAttribute('data-theme', currentTheme); }
            applyTheme();

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInputHandler(e) {
                const input = e.target;
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                input.value = formatPrice(val);
            }

            function isAllowedLink(url) {
                try {
                    const u = new URL(url);
                    const host = u.hostname.replace('www.', '');
                    return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                } catch (e) { return false; }
            }

            function checkLinksString(str) {
                if (!str.trim()) return { valid: true, links: [] };
                const links = str.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
                for (let link of links) {
                    if (!isAllowedLink(link)) return { valid: false, message: `Ссылка ${link} не разрешена` };
                }
                return { valid: true, links };
            }

            function getUserIdentifier() {
                if (currentAuthUser && currentAuthUser.username) return `@${currentAuthUser.username}`;
                if (currentUser.username) return `@${currentUser.username}`;
                return `ID:${currentUser.id}`;
            }

            function getUserId() { return currentAuthUser ? currentAuthUser.id : currentUser.id; }

            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"><button class="modal-close" id="modalCloseBtn">✕</button>${html}</div></div>`;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                setTimeout(() => overlay.classList.add('show'), 10);
                function closeModal() { overlay.classList.remove('show'); setTimeout(() => { overlay.remove(); if (onClose) onClose(); }, 250); }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
                return { overlay, closeModal };
            }

            function showAlert(title, message, type = 'info') {
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                const { closeModal } = showModal(`<div style="text-align:center;"><div style="font-size:48px;margin-bottom:12px;">${icon}</div><h3 class="modal-title" style="text-align:center;">${title}</h3><p style="color:var(--muted);margin-bottom:16px;">${message}</p><button class="btn w-full" id="alertOkBtn">ОК</button></div>`);
                document.getElementById('alertOkBtn').addEventListener('click', closeModal);
            }

            function showConfirm(title, message, onConfirm) {
                const { closeModal } = showModal(`<div style="text-align:center;"><div style="font-size:40px;margin-bottom:12px;">⚠️</div><h3 class="modal-title" style="text-align:center;">${title}</h3><p style="color:var(--muted);margin-bottom:16px;">${message}</p><div class="flex-between gap-12"><button class="btn secondary w-full" id="confirmCancelBtn">Отмена</button><button class="btn danger w-full" id="confirmOkBtn">Подтвердить</button></div></div>`);
                document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
                document.getElementById('confirmOkBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
            }

            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function checkAuth() {
                if (!supabaseClient && !initSupabase()) return;

                const saved = localStorage.getItem('arizona_current_user');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const { data, error } = await withTimeout(supabaseClient.from('app_users').select('*').eq('id', parsed.id).maybeSingle(), 5000);
                        if (!error && data) {
                            currentAuthUser = data;
                            userIdentifier = getUserIdentifier();
                            if (data.banned) { showBanScreen(); return; }
                            await initApp();
                            return;
                        } else {
                            localStorage.removeItem('arizona_current_user');
                        }
                    } catch (e) {
                        localStorage.removeItem('arizona_current_user');
                    }
                }

                if (currentUser.id) {
                    try {
                        const { data, error } = await withTimeout(supabaseClient.from('app_users').select('*').eq('telegram_id', currentUser.id).maybeSingle(), 5000);
                        if (!error && data) {
                            currentAuthUser = data;
                            localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                            userIdentifier = getUserIdentifier();
                            if (data.banned) { showBanScreen(); return; }
                            await initApp();
                            return;
                        }
                    } catch (e) {}
                }

                showAuthScreen();
            }

            function showBanScreen() {
                document.body.innerHTML = `<div class="fullscreen-overlay"><h1 style="color:#ff3b30;margin-bottom:12px;">🚫 Вы забанены</h1><p style="color:var(--muted);">Ваш аккаунт заблокирован администрацией.</p><button class="btn mt-12" onclick="window.open('https://t.me/${OWNER_USERNAME}','_blank')">Связаться с поддержкой</button></div>`;
            }

            function showAuthScreen() {
                const container = document.getElementById('authContainer');
                let mode = 'login';
                let isSubmitting = false;

                function renderAuthForm(errorMsg) {
                    const hasTelegram = currentUser.id > 0 && currentUser.username;
                    const telegramHint = hasTelegram ? `<p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Вы вошли как <strong>@${currentUser.username}</strong>.</p>` : '<p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Войдите или зарегистрируйтесь.</p>';

                    container.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-box">
                                <h2 style="text-align:center;margin-bottom:4px;">Arizona RP</h2>
                                <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px;">Маркетплейс</p>
                                ${telegramHint}
                                <div style="display:flex;margin-bottom:16px;border-bottom:1px solid var(--border);">
                                    <button type="button" class="auth-tab ${mode === 'login' ? 'active' : ''}" id="authTabLogin">Вход</button>
                                    <button type="button" class="auth-tab ${mode === 'register' ? 'active' : ''}" id="authTabRegister">Регистрация</button>
                                </div>
                                <div class="form-group"><label>Логин</label><input type="text" id="authUsername" value="${hasTelegram ? currentUser.username : ''}"></div>
                                <div class="form-group"><label>Пароль</label><input type="password" id="authPassword"></div>
                                <button type="button" class="btn w-full" id="authSubmitBtn" ${isSubmitting ? 'disabled' : ''}>${isSubmitting ? '⏳ Загрузка...' : (mode === 'login' ? 'Войти' : 'Создать аккаунт')}</button>
                                <p id="authError" style="color:#ff3b30;font-size:12px;margin-top:8px;text-align:center;">${errorMsg || ''}</p>
                            </div>
                        </div>
                    `;

                    document.getElementById('authTabLogin').addEventListener('click', () => { if (mode !== 'login') { mode = 'login'; renderAuthForm(); } });
                    document.getElementById('authTabRegister').addEventListener('click', () => { if (mode !== 'register') { mode = 'register'; renderAuthForm(); } });

                    document.getElementById('authSubmitBtn').addEventListener('click', async () => {
                        if (isSubmitting) return;
                        const username = document.getElementById('authUsername').value.trim().toLowerCase();
                        const password = document.getElementById('authPassword').value.trim();
                        const errorEl = document.getElementById('authError');
                        if (!username || !password) { errorEl.textContent = 'Заполните все поля'; return; }

                        isSubmitting = true;
                        renderAuthForm();

                        try {
                            const hashedPassword = await hashPassword(password);
                            if (mode === 'login') {
                                const { data, error } = await withTimeout(supabaseClient.from('app_users').select('*').eq('username', username).maybeSingle(), 5000);
                                if (error || !data || data.password_hash !== hashedPassword) {
                                    renderAuthForm('Неверный логин или пароль');
                                    return;
                                }
                                if (data.banned) { showBanScreen(); return; }
                                currentAuthUser = data;
                                localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                                userIdentifier = getUserIdentifier();
                                container.innerHTML = '';
                                await initApp(true);
                            } else {
                                const { data: existing } = await withTimeout(supabaseClient.from('app_users').select('id').eq('username', username).maybeSingle(), 5000);
                                if (existing) {
                                    renderAuthForm('Пользователь уже существует');
                                    return;
                                }
                                const newUser = {
                                    username,
                                    password_hash: hashedPassword,
                                    telegram_id: currentUser.id || null,
                                    telegram_username: currentUser.username || null,
                                    banned: false,
                                    is_admin: username === OWNER_USERNAME,
                                    created_at: new Date().toISOString()
                                };
                                const { data: inserted, error: insertErr } = await withTimeout(supabaseClient.from('app_users').insert(newUser).select().single(), 5000);
                                if (insertErr) throw insertErr;
                                currentAuthUser = inserted;
                                localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                                userIdentifier = getUserIdentifier();
                                container.innerHTML = '';
                                await initApp(true);
                            }
                        } catch (e) {
                            renderAuthForm('Ошибка соединения с базой данных.');
                        }
                    });
                }
                renderAuthForm();
            }

            async function initApp(isFirstLogin = false) {
                if (!currentAuthUser) { showAuthScreen(); return; }
                userIdentifier = getUserIdentifier();
                await loadUserData();
                switchSection('home');
            }

            async function loadUserData() {
                try {
                    const { data } = await withTimeout(supabaseClient.from('app_users').select('*').eq('id', currentAuthUser.id).single(), 5000);
                    if (data) currentAuthUser = data;
                    isAdmin = currentAuthUser.is_admin || (currentAuthUser.username === OWNER_USERNAME);
                    isOwner = currentAuthUser.username === OWNER_USERNAME;
                } catch (e) {
                    isAdmin = currentAuthUser?.username === OWNER_USERNAME;
                    isOwner = isAdmin;
                }
                const adminBtn = document.getElementById('adminNavBtn');
                if (isAdmin) adminBtn.classList.remove('hidden');
                else adminBtn.classList.add('hidden');
            }

            function switchSection(section) {
                currentSection = section;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById('section-' + section).classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
                if (navBtn) navBtn.classList.add('active');

                if (section === 'home') loadHomeFeed();
                if (section === 'cart') loadCart();
                if (section === 'send') { populateSendForm(); loadMyAds(); }
                if (section === 'admin') loadAdminPanel();
                if (section === 'all') loadAllTiles();
                playSfx('click');
            }

            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = btn.dataset.section;
                    if (sec === 'admin' && !isAdmin) return;
                    switchSection(sec);
                });
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', currentTheme);
                applyTheme();
            });

            document.getElementById('headerSearchTrigger').addEventListener('click', () => openSearchModal());
            document.getElementById('logoBtn').addEventListener('click', () => { currentFilterCategory = null; switchSection('home'); });

            async function loadHomeFeed() {
                const catContainer = document.getElementById('homeCategories');
                catContainer.innerHTML = `<button class="badge ${!currentFilterCategory ? 'active' : ''}" data-cat-filter="">Все</button>` +
                    ALL_CATEGORIES.map(c => `<button class="badge ${currentFilterCategory === c.id ? 'active' : ''}" data-cat-filter="${c.id}">${c.label}</button>`).join('');
                
                catContainer.querySelectorAll('[data-cat-filter]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentFilterCategory = btn.dataset.catFilter || null;
                        loadHomeFeed();
                    });
                });

                const container = document.getElementById('homeFeed');
                container.innerHTML = '<div class="loader"></div>';
                try {
                    let query = supabaseClient.from('ads').select('*').eq('status', 'approved').order('created_at', { ascending: false });
                    if (currentFilterCategory) query = query.eq('category', currentFilterCategory);
                    const { data } = await withTimeout(query, 8000);
                    homeAds = data || [];
                    renderHomeFeed();
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки.</div>';
                }
            }

            function renderHomeFeed() {
                const container = document.getElementById('homeFeed');
                if (!homeAds.length) { container.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>'; return; }
                container.innerHTML = homeAds.map(ad => {
                    const imgSrc = (ad.images ? ad.images.split(',')[0].trim() : '') || DEFAULT_AD_IMAGE;
                    const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                    const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                    return `
                        <div class="card ad-card" data-ad-id="${ad.id}">
                            <img class="ad-card-img" src="${imgSrc}" onerror="this.src='${DEFAULT_AD_IMAGE}'">
                            <div class="ad-card-info">
                                <div class="ad-card-title">${ad.item_name}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)}</div>
                                <div class="ad-card-badges">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span></div>
                                <div class="ad-card-author">Автор: ${ad.author_id}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.ad-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const ad = homeAds.find(a => a.id == card.dataset.adId);
                        if (ad) openAdDetail(ad);
                    });
                });
            }

            async function loadCart() {
                const container = document.getElementById('cartList');
                if (!currentAuthUser) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const userId = getUserId().toString();
                    const { data: favs } = await withTimeout(supabaseClient.from('favorites').select('ad_id').eq('user_id', userId), 5000);
                    const adIds = (favs || []).map(f => f.ad_id);
                    if (!adIds.length) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }
                    
                    const { data: ads } = await withTimeout(supabaseClient.from('ads').select('*').in('id', adIds), 5000);
                    cartAds = ads || [];
                    if (!cartAds.length) { container.innerHTML = '<div class="empty-state">Корзина пуста</div>'; return; }

                    container.innerHTML = cartAds.map(ad => `
                        <div class="card ${ad.status === 'deleted' ? 'inactive-card' : ''}" data-ad-id="${ad.id}">
                            <div class="flex-between">
                                <div>
                                    <div style="font-weight:700;">${ad.item_name}</div>
                                    <div style="font-size:13px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                </div>
                                <button class="btn danger" data-remove-cart="${ad.id}">Удалить</button>
                            </div>
                        </div>
                    `).join('');

                    container.querySelectorAll('[data-remove-cart]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            await supabaseClient.from('favorites').delete().eq('user_id', userId).eq('ad_id', btn.dataset.removeCart);
                            loadCart();
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">Ошибка загрузки корзины</div>';
                }
            }

            function populateSendForm() {
                document.getElementById('sendCategory').innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                document.getElementById('sendServer').innerHTML = ALL_SERVERS.map(s => `<option value="${s}">${s}</option>`).join('');
                const priceInput = document.getElementById('sendPrice');
                priceInput.removeEventListener('input', formatPriceInputHandler);
                priceInput.addEventListener('input', formatPriceInputHandler);
            }

            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!currentAuthUser) return;
                const itemName = document.getElementById('sendName').value.trim();
                const priceRaw = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const images = document.getElementById('sendImages').value.trim();

                if (!itemName || !priceRaw || !description) { showAlert('Ошибка', 'Заполните все поля'); return; }
                const linkCheck = checkLinksString(images);
                if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }

                const newAd = {
                    mode: document.getElementById('sendType').value,
                    category: document.getElementById('sendCategory').value,
                    item_name: itemName,
                    price: parsePriceToNumber(priceRaw),
                    description,
                    images,
                    server: document.getElementById('sendServer').value,
                    author_id: userIdentifier,
                    author_user_id: getUserId().toString(),
                    status: 'pending',
                    created_at: new Date().toISOString()
                };

                try {
                    await withTimeout(supabaseClient.from('ads').insert(newAd), 5000);
                    showToast('Объявление отправлено на модерацию', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось отправить');
                }
            });

            async function loadMyAds() {
                const container = document.getElementById('myAdsList');
                if (!currentAuthUser) { container.innerHTML = ''; return; }
                try {
                    const { data } = await withTimeout(supabaseClient.from('ads').select('*').eq('author_id', userIdentifier), 5000);
                    myAds = data || [];
                    if (!myAds.length) { container.innerHTML = '<div class="empty-state">Нет объявлений</div>'; return; }
                    container.innerHTML = myAds.map(ad => `
                        <div class="card ${ad.status === 'deleted' ? 'inactive-card' : ''}">
                            <div class="flex-between">
                                <div>
                                    <div style="font-weight:700;">${ad.item_name}</div>
                                    <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                </div>
                                <button class="btn danger" data-del-my="${ad.id}">🗑</button>
                            </div>
                        </div>
                    `).join('');

                    container.querySelectorAll('[data-del-my]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('ads').delete().eq('id', btn.dataset.delMy);
                            loadMyAds();
                        });
                    });
                } catch (e) {}
            }

            async function loadAdminPanel() {
                const container = document.getElementById('adminPanelContent');
                if (!isAdmin) { container.innerHTML = 'Нет доступа'; return; }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const { data } = await withTimeout(supabaseClient.from('ads').select('*').eq('status', 'pending'), 5000);
                    pendingAds = data || [];
                    if (!pendingAds.length) { container.innerHTML = '<div class="empty-state">Нет заявок на модерацию</div>'; return; }
                    container.innerHTML = pendingAds.map(ad => `
                        <div class="card">
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${ad.author_id} • ${formatPrice(ad.price)}</div>
                            <div class="flex-between gap-8 mt-8">
                                <button class="btn success w-full" data-approve="${ad.id}">Одобрить</button>
                                <button class="btn danger w-full" data-reject="${ad.id}">Отклонить</button>
                            </div>
                        </div>
                    `).join('');

                    container.querySelectorAll('[data-approve]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('ads').update({ status: 'approved' }).eq('id', btn.dataset.approve);
                            loadAdminPanel();
                        });
                    });
                    container.querySelectorAll('[data-reject]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
                            loadAdminPanel();
                        });
                    });
                } catch (e) {
                    container.innerHTML = 'Ошибка загрузки админ-панели';
                }
            }

            async function openAdDetail(ad) {
                const images = ad.images ? ad.images.split(',').map(s => s.trim()).filter(Boolean) : [];
                const galleryHtml = images.length ? '<div class="image-gallery">' + images.map(img => `<img src="${img}" onerror="this.style.display='none'">`).join('') + '</div>' : '';
                
                showModal(`
                    <h3 class="modal-title">${ad.item_name}</h3>
                    ${galleryHtml}
                    <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px;">${formatPrice(ad.price)}</div>
                    <p style="color:var(--muted);margin-bottom:12px;">${ad.description || 'Нет описания'}</p>
                    <button class="btn w-full mb-8" id="detailContactBtn">💬 Написать автору</button>
                `);

                document.getElementById('detailContactBtn').addEventListener('click', () => {
                    window.open(`https://t.me/${ad.author_id.replace('@', '')}`, '_blank');
                });
            }

            function openSearchModal() {
                showModal(`
                    <h3 class="modal-title">🔍 Поиск</h3>
                    <div class="form-group"><input type="text" id="modalSearchInput" placeholder="Введите название..."></div>
                    <div id="searchResults"></div>
                `);
                const input = document.getElementById('modalSearchInput');
                input.focus();
                input.addEventListener('input', async () => {
                    const q = input.value.trim().toLowerCase();
                    const container = document.getElementById('searchResults');
                    if (!q) { container.innerHTML = ''; return; }
                    const { data } = await supabaseClient.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(10);
                    const results = data || [];
                    container.innerHTML = results.map(ad => `<div class="card" data-search-ad="${ad.id}"><div style="font-weight:700;">${ad.item_name}</div>${formatPrice(ad.price)}</div>`).join('');
                    container.querySelectorAll('[data-search-ad]').forEach(el => {
                        el.addEventListener('click', () => {
                            const ad = results.find(a => a.id == el.dataset.searchAd);
                            if (ad) { document.getElementById('modalOverlay').remove(); openAdDetail(ad); }
                        });
                    });
                });
            }

            function loadAllTiles() {
                document.getElementById('allTiles').innerHTML = `
                    <div class="grid-tile" id="tileGame"><span class="tile-icon">💰</span>Барыга (Игра)</div>
                    <div class="grid-tile" id="tileSettings"><span class="tile-icon">⚙️</span>Настройки</div>
                `;
                document.getElementById('tileGame').addEventListener('click', () => openGameModal());
                document.getElementById('tileSettings').addEventListener('click', () => openSettingsModal());
            }

            function openGameModal() {
                showModal(`
                    <h3 class="modal-title text-center">Симулятор Барыги</h3>
                    <div style="text-align:center;font-size:24px;font-weight:900;color:var(--accent);margin-bottom:12px;" id="gameMoney">0 $</div>
                    <div class="game-click-area" id="gameClickBtn"><img src="${DEFAULT_AD_IMAGE}"></div>
                `);
                document.getElementById('gameClickBtn').addEventListener('click', () => {
                    gameState.money += gameState.clickPower;
                    document.getElementById('gameMoney').textContent = formatPrice(gameState.money) + ' $';
                });
            }

            function openSettingsModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group"><button class="btn danger w-full" id="logoutBtn">🚪 Выйти из аккаунта</button></div>
                `);
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('arizona_current_user');
                    location.reload();
                });
            }

            window.addEventListener('DOMContentLoaded', () => {
                initTelegram();
                if (initSupabase()) checkAuth();
            });

        })();
    </script>
</body>
</html>
