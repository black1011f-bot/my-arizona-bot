                        });
                    });
                } catch (e) {
                    document.getElementById('profileAdsList').innerHTML = '<div class="empty-state">⚠️ Ошибка</div>';

                    <div id="companionsList"><div class="loader"></div></div>
                `);
                loadCompanionsFeed();
                document.getElementById('compSubmitBtn').addEventListener('click', async () => {
                    const target = document.getElementById('compTarget').value.trim();
                    const contact = document.getElementById('compContact').value.trim();
                    if (!target || !contact) { showAlert('Ошибка', 'Заполните все поля'); return; }
                    await supabaseClient.from('companions').insert({
                        author_id: currentAuthUser.id,
                        author_username: currentAuthUser.username,
                        target,
                        contact,
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    document.getElementById('compTarget').value = '';
                    document.getElementById('compContact').value = '';
                    loadCompanionsFeed();
                });
            }

            async function loadCompanionsFeed() {
                const container = document.getElementById('companionsList');
                if (!container) return;
                const { data, error } = await withTimeout(
                    supabaseClient.from('companions').select('*').order('created_at', { ascending: false }),
                    5000
                );
                if (error) { container.innerHTML = '<div class="empty-state">⚠️ Ошибка</div>'; return; }
                const comps = data || [];
                if (!comps.length) { container.innerHTML = '<div class="empty-state">👥 Заявок нет</div>'; return; }
                container.innerHTML = comps.map(c => `
                    <div class="card">
                        <div style="font-weight:700;">${c.target}</div>
                        <div style="font-size:12px;color:var(--muted);">Автор: ${c.author_username || c.author_id} • Контакт: ${c.contact}</div>
                        ${c.author_id === currentAuthUser.id ? `<button class="btn danger mt-8" data-delete-comp="${c.id}">🗑 Удалить</button>` : ''}
                    </div>
                `).join('');
                container.querySelectorAll('[data-delete-comp]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('companions').delete().eq('id', btn.dataset.deleteComp);
                        playSfx('click');
                        loadCompanionsFeed();
                    });
                });
            }

            // =========================================================================
            // 25. МУЗЫКА
            // =========================================================================
            function openMusicModal() {
                showModal(`
                    <h3 class="modal-title">🎵 Музыка</h3>
                    <div class="form-group"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://..."></div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="musicPlayBtn">▶️ Играть</button>
                        <button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button>
                    </div>
                    <button class="btn danger w-full" id="musicResetBtn">⏹ Сбросить</button>
                `);
                let activeAudio = window.appCurrentAudio || null;
                document.getElementById('musicPlayBtn').addEventListener('click', () => {
                    const url = document.getElementById('musicUrl').value.trim();
                    if (url) {
                        if (activeAudio) activeAudio.pause();
                        activeAudio = new Audio(url);
                        window.appCurrentAudio = activeAudio;
                        activeAudio.play().catch(() => showAlert('Ошибка', 'Не удалось воспроизвести'));
                    } else if (activeAudio) activeAudio.play();
                });
                document.getElementById('musicPauseBtn').addEventListener('click', () => { if (activeAudio) activeAudio.pause(); });
                document.getElementById('musicResetBtn').addEventListener('click', () => {
                    if (activeAudio) { activeAudio.pause(); window.appCurrentAudio = null; }
                    document.getElementById('musicUrl').value = '';
                });
            }

            // =========================================================================
            // 26. НАСТРОЙКИ
            // =========================================================================
            function openSettingsModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group flex-between">
                        <label>🔊 Звуки в приложении</label>
                        <input type="checkbox" id="settingsSfx" ${sfxEnabled ? 'checked' : ''} style="width:24px;height:24px;cursor:pointer;">
                    </div>
                    <div class="form-group flex-between">
                        <label>🌙 Тёмная тема</label>
                        <input type="checkbox" id="settingsDark" ${currentTheme === 'dark' ? 'checked' : ''} style="width:24px;height:24px;cursor:pointer;">
                    </div>
                    <button class="btn secondary w-full mt-12" id="settingsLogoutBtn">🚪 Выйти с аккаунта</button>
                    <button class="btn danger w-full mt-8" id="settingsDeleteAccountBtn">🗑 Удалить аккаунт</button>
                `);
                document.getElementById('settingsSfx').addEventListener('change', async (e) => {
                    sfxEnabled = e.target.checked;
                    if (currentAuthUser) {
                        await supabaseClient.from('user_settings').update({ sfx_enabled: sfxEnabled }).eq('user_id', currentAuthUser.id);
                    }
                });
                document.getElementById('settingsDark').addEventListener('change', async (e) => {
                    currentTheme = e.target.checked ? 'dark' : 'light';
                    applyTheme();
                    if (currentAuthUser) {
                        await supabaseClient.from('user_settings').update({ theme: currentTheme }).eq('user_id', currentAuthUser.id);
                    }
                });
                document.getElementById('settingsLogoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('arizona_current_user');
                    currentAuthUser = null;
                    document.getElementById('modalOverlay').remove();
                    showAuthScreen();
                });
                document.getElementById('settingsDeleteAccountBtn').addEventListener('click', () => {
                    showDeleteAccountModal();
                });
            }

            function showDeleteAccountModal() {
                showModal(`
                    <h3 class="modal-title">🗑 Удаление аккаунта</h3>
                    <p style="color:var(--muted);margin-bottom:16px;">Введите пароль для подтверждения удаления аккаунта. Все данные будут удалены безвозвратно.</p>
                    <div class="form-group"><label>Пароль</label><input type="password" id="deletePassInput" placeholder="Введите пароль"></div>
                    <button class="btn danger w-full" id="confirmDeleteBtn">Удалить аккаунт</button>
                    <p id="deleteError" style="color:#ff3b30;font-size:12px;margin-top:8px;"></p>
                `);
                document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
                    const pass = document.getElementById('deletePassInput').value.trim();
                    const errorEl = document.getElementById('deleteError');
                    if (!pass) { errorEl.textContent = 'Введите пароль'; return; }
                    const hash = await hashPassword(pass);
                    if (hash !== currentAuthUser.password_hash) {
                        errorEl.textContent = 'Неверный пароль';
                        return;
                    }
                    showConfirm('Вы уверены?', 'Это действие необратимо. Удалить аккаунт и все данные?', async () => {
                        try {
                            await supabaseClient.from('app_users').delete().eq('id', currentAuthUser.id);
                            await supabaseClient.from('user_settings').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('user_progress').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('ads').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('favorites').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('search_history').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('baryga').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('looks').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('companions').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('notifications').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('reviews').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('appeals').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('reports').delete().eq('reporter_id', currentAuthUser.id);
                            localStorage.removeItem('arizona_current_user');
                            currentAuthUser = null;
                            playSfx('success');
                            document.getElementById('modalOverlay').remove();
                            showAuthScreen();
                            showToast('Аккаунт удалён', 'success');
                        } catch (e) {
                            console.error('Delete account error', e);
                            showAlert('Ошибка', 'Не удалось удалить аккаунт');
                        }
                    });
                });
            }

            // =========================================================================
            // 27. МЕНЕДЖЕР
            // =========================================================================
            function openManagerModal() {
                showModal(`
                    <h3 class="modal-title">👨‍💼 Менеджер / Поддержка</h3>
                    <p style="color:var(--muted);margin-bottom:16px;">Свяжитесь с администрацией для решения вопросов.</p>
                    <button class="btn w-full" id="managerContactBtn">📨 Написать в Telegram</button>
                `);
                document.getElementById('managerContactBtn').addEventListener('click', () => {
                    window.open(`https://t.me/${OWNER_USERNAME}`, '_blank');
                });
            }

            // =========================================================================
            // 28. ПЕРЕПИСКИ
            // =========================================================================
            function openChatModal() {
                showModal(`
                    <h3 class="modal-title">💬 Переписки</h3>
                    <div class="empty-state">Переписки ведутся напрямую в Telegram. Перейдите в чат с продавцом через карточку товара.</div>
                    <button class="btn w-full mt-12" id="chatTgBtn">📱 Перейти в Telegram</button>
                `);
                document.getElementById('chatTgBtn').addEventListener('click', () => window.open('https://t.me/', '_blank'));
            }

            // =========================================================================
            // 29. УВЕДОМЛЕНИЯ
            // =========================================================================
            async function openNotificationsModal() {
                showModal(`<h3 class="modal-title">🔔 Уведомления</h3><div id="notificationsList"><div class="loader"></div></div>`);
                try {
                    const { data, error } = await withTimeout(
                        supabaseClient.from('notifications').select('*').eq('user_id', currentAuthUser.id).order('created_at', { ascending: false }),
                        5000
                    );
                    if (error) throw error;
                    const notif = data || [];
                    const container = document.getElementById('notificationsList');
                    if (!notif.length) {
                        container.innerHTML = '<div class="empty-state">Нет уведомлений</div>';
                        return;
                    }
                    container.innerHTML = notif.map(n => `
                        <div class="card ${!n.read ? 'inactive-card' : ''}" data-notif-id="${n.id}">
                            <div style="font-weight:600;">${n.message}</div>
                            <div style="font-size:11px;color:var(--muted);">${new Date(n.created_at).toLocaleString('ru-RU')}</div>
                        </div>
                    `).join('');
                    await supabaseClient.from('notifications').update({ read: true }).eq('user_id', currentAuthUser.id).eq('read', false);
                    unreadNotifications = 0;
                } catch (e) {
                    document.getElementById('notificationsList').innerHTML = '<div class="empty-state">⚠️ Ошибка</div>';
                }
            }

            async function addNotification(userId, message) {
                if (!userId) return;
                await supabaseClient.from('notifications').insert({
                    user_id: userId,
                    message,
                    read: false,
                    created_at: new Date().toISOString()
                });
                if (userId === currentAuthUser?.id) {
                    unreadNotifications++;
                }
            }

            // =========================================================================
            // 30. ДОСТИЖЕНИЯ
            // =========================================================================
            async function openAchievementsModal() {
                showModal(`<h3 class="modal-title">🏆 Достижения</h3><div id="achievementsList"><div class="loader"></div></div>`);
                try {
                    const { data: userAds } = await supabaseClient.from('ads').select('id').eq('author_id', currentAuthUser.id);
                    const { data: userReviews } = await supabaseClient.from('reviews').select('id').eq('author_id', currentAuthUser.id);
                    const { data: userFavs } = await supabaseClient.from('favorites').select('id').eq('user_id', currentAuthUser.id);
                    const { data: userLooks } = await supabaseClient.from('looks').select('id').eq('author_id', currentAuthUser.id);
                    const { data: userCompanions } = await supabaseClient.from('companions').select('id').eq('author_id', currentAuthUser.id);

                    const achievements = [
                        { name: 'Новичок', desc: 'Создайте первое объявление', achieved: (userAds?.length || 0) >= 1, icon: '📝' },
                        { name: 'Активный', desc: 'Создайте 10 объявлений', achieved: (userAds?.length || 0) >= 10, icon: '📈' },
                        { name: 'Критик', desc: 'Оставьте первый отзыв', achieved: (userReviews?.length || 0) >= 1, icon: '⭐' },
                        { name: 'Коллекционер', desc: 'Добавьте 5 в корзину', achieved: (userFavs?.length || 0) >= 5, icon: '🛒' },
                        { name: 'Модник', desc: 'Опубликуйте свой лук', achieved: (userLooks?.length || 0) >= 1, icon: '📸' },
                        { name: 'Компаньон', desc: 'Найдите попутчика', achieved: (userCompanions?.length || 0) >= 1, icon: '👥' }
                    ];
                    const container = document.getElementById('achievementsList');
                    container.innerHTML = achievements.map(a => `
                        <div class="card" style="opacity:${a.achieved ? '1' : '0.5'};">
                            <div class="flex-between">
                                <div><span style="font-size:24px;">${a.icon}</span> <strong>${a.name}</strong></div>
                                <span>${a.achieved ? '✅' : '🔒'}</span>
                            </div>
                            <div style="font-size:12px;color:var(--muted);">${a.desc}</div>
                        </div>
                    `).join('');
                } catch (e) {
                    document.getElementById('achievementsList').innerHTML = '<div class="empty-state">⚠️ Ошибка</div>';
                }
            }

            // =========================================================================
            // 31. ЗАПУСК
            // =========================================================================
            const telegramOk = initTelegram();
            if (!telegramOk) return;
            if (!initSupabase()) return;
            checkAuth();

            window.addEventListener('online', () => {
                console.log('Online');
                if (currentSection === 'home') loadHomeFeed();
            });

            // Настройка выбора сервера после загрузки DOM
            document.addEventListener('DOMContentLoaded', () => {
                setupServerSelector();
            });

            console.log('Arizona RP App fully initialized');
        })();
    </script>
</body>
    </html>
