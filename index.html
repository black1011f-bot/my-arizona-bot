                    const removeAdminBtn = document.getElementById('adminRemoveAdminBtn');
                    const clearFeedBtn = document.getElementById('adminClearFeedBtn');

                    if (banBtn) banBtn.addEventListener('click', () => adminUserAction('ban'));

                    if (makeAdminBtn) makeAdminBtn.addEventListener('click', () => adminUserAction('make_admin'));
                    if (removeAdminBtn) removeAdminBtn.addEventListener('click', () => adminUserAction('remove_admin'));
                    if (clearFeedBtn) {
                        clearFeedBtn.addEventListener('click', async () => {
                            showConfirm('Очистка', 'Удалить ВСЕ объявления из ленты?', async () => {
                                await supabaseClient.from('ads').delete().neq('id', 0);
                                await supabaseClient.from('favorites').delete().neq('id', 0);
                                playSfx('click');
                                loadAdminPanel();
                                loadHomeFeed();
                            });
                        });
                    }
                }

            async function adminUserAction(action) {
                const target = document.getElementById('adminUsernameInput').value.trim();
                if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
                try {
                    let query = supabaseClient.from('app_users').select('*');
                    if (!isNaN(target)) query = query.eq('id', target);
                    else query = query.eq('username', target);
                    const { data: users, error } = await query;
                    if (error) throw error;
                    if (!users.length) { showAlert('Ошибка', 'Пользователь не найден'); return; }
                    const user = users[0];
                    let updates = {};
                    if (action === 'ban') updates.banned = true;
                    else if (action === 'unban') updates.banned = false;
                    else if (action === 'make_admin') updates.is_admin = true;
                    else if (action === 'remove_admin') updates.is_admin = false;
                    await supabaseClient.from('app_users').update(updates).eq('id', user.id);
                    playSfx('success');
                    showAlert('Успех', 'Действие выполнено');
                    loadAdminPanel();
                } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
            }

            // =========================================================================
            // 16. ДЕТАЛИ ОБЪЯВЛЕНИЯ
            // =========================================================================
            async function openAdDetail(ad) {
                const images = ad.images ? ad.images.split(',').map(s => s.trim()).filter(s => s) : [];
                const galleryHtml = images.length ?
                    '<div class="image-gallery">' + images.map(img =>
                        `<img src="${img}" onerror="this.style.display='none'">`).join('') + '</div>' :
                    '';
                const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' :
                    '<span class="badge buy">Покупка</span>';

                let statusHtml = '';
                if (ad.status === 'pending') {
                    statusHtml = '<div class="empty-state">⏳ Объявление на модерации</div>';
                } else if (ad.status === 'deleted') {
                    statusHtml = '<div class="empty-state">🗑️ Объявление удалено</div>';
                    if (ad.author_id === userIdentifier) {
                        statusHtml += '<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Подать апелляцию</button>';
                    }
                } else {
                    statusHtml = `
                        <button class="btn w-full mb-8" id="detailContactBtn">💬 Написать</button>
                        <button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 Корзина</button>
                        <button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ Отзывы</button>
                        ${ad.author_id === userIdentifier ? '<button class="btn danger w-full" id="detailDeleteBtn">🗑 Удалить</button>' : ''}
                    `;
                }

                const isFav = await checkIfInCart(ad.id);

                showModal(`
                    <h3 class="modal-title">${ad.item_name}</h3>
                    <div class="ad-card-badges mb-8">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span></div>
                    ${galleryHtml}
                    <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px;">${formatPrice(ad.price)}</div>
                    <p style="color:var(--muted);margin-bottom:12px;">${ad.description || 'Нет описания'}</p>
                    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Автор: <span style="color:var(--text);cursor:pointer;" id="detailAuthorLink">${ad.author_id}</span></div>
                    ${statusHtml}
                    <div id="detailReviewsSection"></div>
                    <h4 style="margin:16px 0 8px;">📌 Похожие объявления</h4>
                    <div id="detailSimilarAds"></div>
                `);

                const overlay = document.getElementById('modalOverlay');

                if (ad.status === 'approved') {
                    document.getElementById('detailContactBtn').addEventListener('click', () => {
                        let contact = ad.author_id.replace('@', '');
                        window.open(`https://t.me/${contact}`, '_blank');
                    });
                    const cartBtn = document.getElementById('detailCartToggleBtn');
                    cartBtn.textContent = isFav ? '🛒 Убрать из корзины' : '🛒 В корзину';
                    cartBtn.addEventListener('click', async () => {
                        const userId = getUserId().toString();
                        if (isFav) {
                            await supabaseClient.from('favorites').delete().eq('user_id', userId).eq('ad_id', ad
                            .id);
                            cartBtn.textContent = '🛒 В корзину';
                        } else {
                            await supabaseClient.from('favorites').insert({ user_id: userId, ad_id: ad.id });

                        playSfx('click');

            async function checkIfInCart(adId) {
                if (!currentAuthUser) return false;
                const { data, error } = await supabaseClient
                    .from('favorites')
                    .select('*')
                    .eq('user_id', getUserId().toString())
                    .eq('ad_id', adId)
                    .maybeSingle();
                if (error) return false;
                return !!data;
            }

            // =========================================================================
            // 17. ОТЗЫВЫ
            // =========================================================================
            async function loadReviews(adId) {
                const container = document.getElementById('detailReviewsSection');
                if (!container) return;
                try {
                    const { data: reviews, error } = await supabaseClient
                        .from('reviews')
                        .select('*')
                        .eq('ad_id', adId)
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    const reviewsData = reviews || [];
                    if (!reviewsData.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">⭐ Отзывов пока нет</p>';
                        return;
                    }
                    const avg = reviewsData.reduce((s, r) => s + r.stars, 0) / reviewsData.length;
                    let html =
                        `<div style="font-size:20px;font-weight:800;margin-bottom:8px;">⭐ ${avg.toFixed(1)} (${reviewsData.length})</div>`;
                    html += '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) +
                        '%;"></div></div>';
                    reviewsData.forEach(r => {
                        const canEdit = r.author_id === userIdentifier && (Date.now() - new Date(r.created_at)
                            .getTime()) < 7 * 24 * 60 * 60 * 1000;
                        html += `
                            <div class="review-item">
                                <div style="font-weight:600;">${r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span></div>
                                <div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
                                <p style="font-size:13px;margin:4px 0;">${r.text || ''}</p>
                                ${r.media_links ? `<div style="font-size:11px;color:var(--accent);">${r.media_links}</div>` : ''}
                                ${canEdit ? `<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-delete-review="${r.id}">🗑</button></div>` : ''}
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-edit-review]').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const rev = reviewsData.find(r => r.id == btn.dataset.editReview);
                            if (rev) openEditReviewModal(rev);
                        });
                    });
                    container.querySelectorAll('[data-delete-review]').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            await supabaseClient.from('reviews').delete().eq('id', btn.dataset.deleteReview);
                            playSfx('click');
                            loadReviews(adId);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p style="color:var(--muted);">⚠️ Не удалось загрузить отзывы</p>';
                }
            }

            async function loadSimilarAds(category, currentAdId) {
                const container = document.getElementById('detailSimilarAds');
                if (!container) return;
                try {
                    const { data } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .eq('status', 'approved')
                        .eq('category', category)
                        .neq('id', currentAdId)
                        .limit(3)
                        .order('created_at', { ascending: false });
                    const similar = data || [];
                    if (!similar.length) {
                        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Похожих нет</p>';
                        return;
                    }
                    container.innerHTML = similar.map(ad => `
                        <div class="card" data-sim="${ad.id}">
                            <span style="font-weight:700;">${ad.item_name}</span> • ${formatPrice(ad.price)}
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-sim]').forEach(el => {
                        el.addEventListener('click', () => {
                            const found = similar.find(a => a.id == el.dataset.sim);
                            if (found) {
                                document.getElementById('modalOverlay').remove();
                                openAdDetail(found);
                            }
                        });
                    });
                } catch (e) {}
            }

            function openReviewsModal(adId) {
                showModal(`
                    <h3 class="modal-title">⭐ Оставить отзыв</h3>
                    <div class="form-group"><label>Оценка</label><div class="star-rating" id="reviewStars">${[1,2,3,4,5].map(i => `<span data-star="${i}">☆</span>`).join('')}</div></div>
                    <div class="form-group"><label>Ссылки (до 20, через запятую)</label><input type="text" id="reviewMedia" placeholder="https://..."></div>
                    <div class="form-group"><label>Текст отзыва</label><textarea id="reviewText" placeholder="Ваш отзыв"></textarea></div>
                    <button class="btn w-full" id="reviewSubmitBtn">Отправить отзыв</button>
                `);
                let selectedStars = 0;
                const starsContainer = document.getElementById('reviewStars');
                starsContainer.querySelectorAll('span').forEach(span => {
                    span.addEventListener('click', () => {
                        selectedStars = parseInt(span.dataset.star);
                        updateStars(starsContainer, selectedStars);
                    });
                });
                document.getElementById('reviewSubmitBtn').addEventListener('click', async () => {
                    if (!selectedStars) { showAlert('Ошибка', 'Выберите оценку'); return; }
                    const text = document.getElementById('reviewText').value.trim();
                    const media = document.getElementById('reviewMedia').value.trim();
                    const linkCheck = checkLinksString(media);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    try {
                        await supabaseClient.from('reviews').insert({
                            ad_id: adId,
                            author_id: userIdentifier,
                            stars: selectedStars,
                            text,
                            media_links: media,
                            created_at: new Date().toISOString()
                        });
                        playSfx('success');
                        showAlert('Успех', 'Отзыв отправлен');
                        document.getElementById('modalOverlay').remove();
                        loadReviews(adId);
                    } catch (e) { showAlert('Ошибка', 'Не удалось отправить отзыв'); }
                });
            }

            function updateStars(container, selected) {
                container.querySelectorAll('span').forEach(span => {
                    span.textContent = parseInt(span.dataset.star) <= selected ? '★' : '☆';
                    span.classList.toggle('active', parseInt(span.dataset.star) <= selected);
                });
            }

            function openEditReviewModal(review) {
                showModal(`
                    <h3 class="modal-title">✏️ Редактировать отзыв</h3>
                    <div class="form-group"><label>Оценка</label><div class="star-rating" id="editReviewStars">${[1,2,3,4,5].map(i => `<span data-star="${i}" class="${i <= review.stars ? 'active' : ''}">${i <= review.stars ? '★' : '☆'}</span>`).join('')}</div></div>
                    <div class="form-group"><label>Ссылки</label><input type="text" id="editReviewMedia" value="${review.media_links || ''}"></div>
                    <div class="form-group"><label>Текст</label><textarea id="editReviewText">${review.text || ''}</textarea></div>
                    <button class="btn w-full" id="editReviewSubmitBtn">Сохранить</button>
                `);
                let selectedStars = review.stars;
                const starsContainer = document.getElementById('editReviewStars');
                starsContainer.querySelectorAll('span').forEach(span => {
                    span.addEventListener('click', () => {
                        selectedStars = parseInt(span.dataset.star);
                        updateStars(starsContainer, selectedStars);
                    });
                });
                document.getElementById('editReviewSubmitBtn').addEventListener('click', async () => {
                    const text = document.getElementById('editReviewText').value.trim();
                    const media = document.getElementById('editReviewMedia').value.trim();
                    const linkCheck = checkLinksString(media);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await supabaseClient.from('reviews').update({ stars: selectedStars, text,
                        media_links: media }).eq('id', review.id);
                    playSfx('success');
                    document.getElementById('modalOverlay').remove();
                    loadReviews(review.ad_id);
                });

            // =========================================================================
            // 18. ИГРА «БАРЫГА»
            // =========================================================================
            async function loadGameState() {
                if (!currentAuthUser) return;
                const { data, error } = await supabaseClient
                    .from('baryga')
                    .select('*')
                    .eq('user_id', getUserId().toString())
                    .maybeSingle();
                if (error) console.warn('loadGameState error', error);
                if (data) {
                    gameState = {
                        money: data.money || 0,
                        clickPower: data.click_power || 1,
                        clickCost: data.click_cost || 50,
                        autoIncome: data.auto_income || 0,
                        autoCost: data.auto_cost || 200,
                        proCost: data.pro_cost || 800,
                        shopCost: data.shop_cost || 3000,
                        eliteCost: data.elite_cost || 10000,
                        oilCost: data.oil_cost || 35000,
                        cryptoCost: data.crypto_cost || 150000,
                        scrapCost: data.scrap_cost || 500
                    };
                } else {
                    await supabaseClient.from('baryga').insert({ user_id: getUserId().toString(), ...gameState });
                }
            }

            function openBarygaGame() {
                loadGameState().then(() => {
                    showModal(`
                        <h3 class="modal-title">🎮 Игра «Барыга»</h3>
                        <div style="text-align:center;font-size:24px;font-weight:900;margin-bottom:8px;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div>
                        <div class="game-click-area" id="gameClickArea">
                            <img src="https://i.postimg.cc/3RnGkVNw/4827782b1f3adf82a5db028d6ed0e8a7.jpg" alt="Клик">
                        </div>
                        <div style="font-size:12px;color:var(--muted);text-align:center;" id="gameStatsDisplay">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div>
                        <div class="mt-12" id="gameUpgradesContainer"></div>
                    `);

                    const clickArea = document.getElementById('gameClickArea');
                    const upgradesContainer = document.getElementById('gameUpgradesContainer');
                    upgradesContainer.innerHTML = renderUpgrades();

                    clickArea.addEventListener('click', () => {
                        gameState.money += gameState.clickPower;
                        updateGameUIFast();
                        playSfx('click');
                        saveGameStateDebounced();
                        clickArea.style.transform = 'scale(0.92)';
                        setTimeout(() => clickArea.style.transform = '', 80);
                    });

                    upgradesContainer.addEventListener('click', (e) => {
                        const btn = e.target.closest('[data-upgrade]');
                        if (!btn) return;
                        const idx = parseInt(btn.dataset.upgrade);
                        const upgrade = getUpgradesList()[idx];
                        if (gameState.money >= upgrade.cost) {
                            gameState.money -= upgrade.cost;
                            upgrade.action();
                            updateGameUIFast();
                            saveGameStateDebounced();
                            playSfx('buy');
                        }
                    });

                    const interval = setInterval(() => {
                        if (!document.getElementById('gameClickArea')) { clearInterval(interval); return; }
                        if (gameState.autoIncome > 0) {
                            gameState.money += gameState.autoIncome / 10;
                            updateGameUIFast();
                        }
                    }, 100);
                });
            }

            function getUpgradesList() {
                return [
                    { name: 'Клик +1', cost: gameState.clickCost,
                    action: () => { gameState.clickPower += 1;
                            gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost,
                    action: () => { gameState.autoIncome += 5;
                            gameState.autoCost *= 2; } },
                    { name: 'Про +20/сек', cost: gameState.proCost,
                    action: () => { gameState.autoIncome += 20;
                            gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost,
                    action: () => { gameState.autoIncome += 50;
                            gameState.shopCost *= 2; } },
                    { name: 'Элита: клик +10', cost: gameState.eliteCost,
                    action: () => { gameState.clickPower += 10;
                            gameState.eliteCost *= 2; } },
                    { name: 'Нефть +200/сек', cost: gameState.oilCost,
                    action: () => { gameState.autoIncome += 200;
                            gameState.oilCost *= 2; } },
                    { name: 'Крипта +1000/сек', cost: gameState.cryptoCost,
                    action: () => { gameState.autoIncome += 1000;
                            gameState.cryptoCost *= 2; } },
                    { name: 'Скупка лома +500/сек', cost: gameState.scrapCost,
                    action: () => { gameState.autoIncome += 500;
                            gameState.scrapCost *= 2; } }
                ];
            }

            function renderUpgrades() {
                return getUpgradesList().map((u, i) => `
                    <div class="upgrade-card">
                        <div class="upgrade-info"><div class="upgrade-name">${u.name}</div><div class="upgrade-cost" data-cost-idx="${i}">💰 ${formatPrice(u.cost)}</div></div>
                        <button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button>
                    </div>
                `).join('');
            }

            function updateGameUIFast() {
                const moneyEl = document.getElementById('gameMoneyDisplay');
                if (moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money);
                const statsEl = document.getElementById('gameStatsDisplay');
                if (statsEl) statsEl.textContent = `Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек`;
                const upgrades = getUpgradesList();
                upgrades.forEach((u, i) => {
                    const btn = document.querySelector(`[data-upgrade="${i}"]`);
                    const costEl = document.querySelector(`[data-cost-idx="${i}"]`);
                    if (btn && costEl) {
                        costEl.textContent = '💰 ' + formatPrice(u.cost);
                        if (gameState.money < u.cost) btn.setAttribute('disabled', 'true');
                        else btn.removeAttribute('disabled');
                    }
                });
            }

            function saveGameStateDebounced() {
                if (saveGameTimeout) clearTimeout(saveGameTimeout);
                saveGameTimeout = setTimeout(saveGameState, 1000);
            }

            async function saveGameState() {
                if (!currentAuthUser) return;
                try {
                    const { data } = await supabaseClient.from('baryga').select('id').eq('user_id', getUserId().toString())
                        .single();
                    if (data) {
                        await supabaseClient.from('baryga').update({
                            money: gameState.money,
                            click_power: gameState.clickPower,
                            click_cost: gameState.clickCost,
                            auto_income: gameState.autoIncome,
                            auto_cost: gameState.autoCost,
                            pro_cost: gameState.proCost,
                            shop_cost: gameState.shopCost,
                            elite_cost: gameState.eliteCost,
                            oil_cost: gameState.oilCost,
                            crypto_cost: gameState.cryptoCost,
                            scrap_cost: gameState.scrapCost
                        }).eq('id', data.id);
                    } else {
                        await supabaseClient.from('baryga').insert({ user_id: getUserId().toString(), ...gameState });
                    }
                } catch (e) { console.warn('saveGameState error', e); }
            }

            // =========================================================================
            // 19. ПОИСК
            // =========================================================================
            function openSearchModal() {
                showModal(`
                    <h3 class="modal-title">🔍 Поиск</h3>
                    <div class="form-group"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off"></div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="searchItemBtn">📦 Предмет</button>
                        <button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button>
                    </div>
                    <div id="searchSuggestions"></div>
                    <div id="searchHistory"></div>
                    <div id="searchResults"></div>
                `);
                const input = document.getElementById('searchInput');
                setTimeout(() => input.focus(), 100);
                const suggestions = document.getElementById('searchSuggestions');
                const results = document.getElementById('searchResults');
                const history = document.getElementById('searchHistory');

                function renderHistory() {
                    if (!searchHistory.length) { history.innerHTML = ''; return; }
                    history.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📜 История:</div>' +
                        searchHistory.map(h =>
                            `<span class="badge" style="cursor:pointer;margin:2px;" data-hist="${h}">${h}</span>`).join('');
                    history.querySelectorAll('[data-hist]').forEach(el => {
                        el.addEventListener('click', () => { input.value = el.dataset.hist;
                            input.dispatchEvent(new Event('input')); });
                    });
                }
                renderHistory();

                input.addEventListener('input', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) { suggestions.innerHTML = '';
                        results.innerHTML = ''; return; }
                    const { data, error } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .eq('status', 'approved')
                        .ilike('item_name', `%${q}%`)
                        .limit(5);
                    if (error) return;
                    const items = data || [];
                    suggestions.innerHTML = items.map(ad =>
                        `<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`
                        ).join('');
                    suggestions.querySelectorAll('[data-sug]').forEach(el => {
                        el.addEventListener('click', () => {
                            const ad = items.find(a => a.id == el.dataset.sug);
                            if (ad) {
                                if (!searchHistory.includes(q)) { searchHistory.unshift(q); if (searchHistory
                                        .length > 10) searchHistory.pop();
                                    localStorage.setItem('searchHistory', JSON.stringify(searchHistory)); }
                                document.getElementById('modalOverlay').remove();
                                openAdDetail(ad);
                            }
                        });
                    });
                });

                document.getElementById('searchItemBtn').addEventListener('click', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) return;
                    const { data, error } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .eq('status', 'approved')
                        .ilike('item_name', `%${q}%`);
                    if (error) return;
                    const items = data || [];
                    if (!items.length) { results.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
                    results.innerHTML = items.map(ad => `
                        <div class="card" data-res-id="${ad.id}">
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                        </div>
                    `).join('');
                    results.querySelectorAll('[data-res-id]').forEach(card => {
                        card.addEventListener('click', () => {
                            const ad = items.find(a => a.id == card.dataset.resId);
                            if (ad) { document.getElementById('modalOverlay').remove();
                                openAdDetail(ad); }
                        });
                    });
                });

                document.getElementById('searchProfileBtn').addEventListener('click', () => {
                    const q = input.value.trim();
                    if (q) openProfileModal(q);
                });
            }

            async function openProfileModal(authorId) {
                showModal(
                    `<h3 class="modal-title">👤 Профиль: ${authorId}</h3><div id="profileAdsList"><div class="loader"></div></div>`
                    );
                try {
                    const { data } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .eq('status', 'approved')
                        .eq('author_id', authorId)
                        .order('created_at', { ascending: false });
                    const ads = data || [];
                    const container = document.getElementById('profileAdsList');
                    if (!ads.length) {
                        container.innerHTML = '<div class="empty-state">Нет активных объявлений</div>';
                        return;
                    }
                    container.innerHTML = ads.map(ad => `
                        <div class="card" data-prof-ad="${ad.id}">
                            <div style="font-weight:700;">${ad.item_name}</div>
                            <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                        </div>
                    `).join('');
                    container.querySelectorAll('[data-prof-ad]').forEach(card => {
                        card.addEventListener('click', () => {
                            const ad = ads.find(a => a.id == card.dataset.profAd);
                            if (ad) { document.getElementById('modalOverlay').remove();
                                openAdDetail(ad); }
                        });
                    });
                } catch (e) { document.getElementById('profileAdsList').innerHTML =
                    '<div class="empty-state">⚠️ Ошибка</div>'; }
            }

            // =========================================================================
            // 20. ВСЕ РАЗДЕЛЫ
            // =========================================================================
            function loadAllTiles() {
                const tiles = [
                    { id: 'looks', icon: '📸', label: 'Лента «Луков»' },
                    { id: 'companions', icon: '👥', label: 'Попутчики' },
                    { id: 'music', icon: '🎵', label: 'Музыка' },
                    { id: 'baryga', icon: '🎮', label: 'Игра «Барыга»' },
                    { id: 'settings', icon: '⚙️', label: 'Настройки' },
                    { id: 'manager', icon: '👨‍💼', label: 'Менеджер' },
                    { id: 'chat', icon: '💬', label: 'Переписки' }
                ];
                const container = document.getElementById('allTiles');
                container.innerHTML = tiles.map(t =>
                    `<div class="grid-tile" data-tile="${t.id}"><span class="tile-icon">${t.icon}</span><span>${t.label}</span></div>`
                    ).join('');
                container.querySelectorAll('[data-tile]').forEach(tile => {
                    tile.addEventListener('click', () => {
                        const id = tile.dataset.tile;
                        if (id === 'looks') openLooksModal();
                        if (id === 'companions') openCompanionsModal();
                        if (id === 'music') openMusicModal();
                        if (id === 'baryga') openBarygaGame();
                        if (id === 'settings') openSettingsModal();
                        if (id === 'manager') openManagerModal();
                        if (id === 'chat') openChatModal();
                    });
                });
            }

            // =========================================================================
            // 21. ЛУКИ
            // =========================================================================
            function openLooksModal() {
                showModal(`
                    <h3 class="modal-title">📸 Лента «Луков»</h3>
                    <div class="form-group"><label>Ссылка на фото</label><input type="text" id="lookImg" placeholder="https://..."></div>
                    <div class="form-group"><label>Описание</label><input type="text" id="lookDesc" placeholder="Мой лук"></div>
                    <button class="btn w-full mb-12" id="lookSubmitBtn">Опубликовать</button>
                    <div id="looksList"><div class="loader"></div></div>
                `);
                loadLooksFeed();
                document.getElementById('lookSubmitBtn').addEventListener('click', async () => {
                    const img = document.getElementById('lookImg').value.trim();
                    const desc = document.getElementById('lookDesc').value.trim();
                    const linkCheck = checkLinksString(img);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await supabaseClient.from('looks').insert({
                        author_id: userIdentifier,
                        image_url: img,
                        description: desc,
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    document.getElementById('lookImg').value = '';
                    document.getElementById('lookDesc').value = '';
                    loadLooksFeed();
                });
            }

            async function loadLooksFeed() {
                const container = document.getElementById('looksList');
                if (!container) return;
                const { data, error } = await supabaseClient.from('looks').select('*').order('created_at', { ascending: false });
                if (error) { container.innerHTML = '<div class="empty-state">⚠️ Ошибка</div>'; return; }
                const looks = data || [];
                if (!looks.length) { container.innerHTML = '<div class="empty-state">📸 Образов пока нет</div>'; return; }
                container.innerHTML = looks.map(l => `
                    <div class="card">
                        <img src="${l.image_url}" style="width:100%;height:200px;object-fit:cover;border-radius:8px;margin-bottom:8px;" onerror="this.style.display='none'">
                        <div style="font-weight:700;font-size:13px;">${l.author_id}</div>
                        <p style="font-size:13px;color:var(--muted);">${l.description || ''}</p>
                        ${l.author_id === userIdentifier ? `<button class="btn danger mt-8" data-delete-look="${l.id}">🗑 Удалить</button>` : ''}
                    </div>
                `).join('');
                container.querySelectorAll('[data-delete-look]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('looks').delete().eq('id', btn.dataset.deleteLook);
                        playSfx('click');
                        loadLooksFeed();
                    });
                });
            }

            // =========================================================================
            // 22. ПОПУТЧИКИ
            // =========================================================================
            function openCompanionsModal() {
                showModal(`
                    <h3 class="modal-title">👥 Попутчики</h3>
                    <div class="form-group"><label>Цель / Направление</label><input type="text" id="compTarget" placeholder="Например: еду на шахту"></div>
                    <div class="form-group"><label>Контакты</label><input type="text" id="compContact" placeholder="@username"></div>
                    <button class="btn w-full mb-12" id="compSubmitBtn">Найти напарника</button>
                    <div id="companionsList"><div class="loader"></div></div>
                `);
                loadCompanionsFeed();
                document.getElementById('compSubmitBtn').addEventListener('click', async () => {
                    const target = document.getElementById('compTarget').value.trim();
                    const contact = document.getElementById('compContact').value.trim();
                    if (!target || !contact) { showAlert('Ошибка', 'Заполните все поля'); return; }
                    await supabaseClient.from('companions').insert({
                        author_id: userIdentifier,
                        target,
                        contact,
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    document.getElementById('compTarget').value = '';
                    document.getElementById('compContact').value = '';
                    loadCompanionsFeed();
                });
            }

            async function loadCompanionsFeed() {
                const container = document.getElementById('companionsList');
                if (!container) return;
                const { data, error } = await supabaseClient.from('companions').select('*').order('created_at', { ascending: false });
                if (error) { container.innerHTML = '<div class="empty-state">⚠️ Ошибка</div>'; return; }
                const comps = data || [];
                if (!comps.length) { container.innerHTML = '<div class="empty-state">👥 Заявок нет</div>'; return; }
                container.innerHTML = comps.map(c => `
                    <div class="card">
                        <div style="font-weight:700;">${c.target}</div>
                        <div style="font-size:12px;color:var(--muted);">Автор: ${c.author_id} • Контакт: ${c.contact}</div>
                        ${c.author_id === userIdentifier ? `<button class="btn danger mt-8" data-delete-comp="${c.id}">🗑 Удалить</button>` : ''}
                    </div>
                `).join('');
                container.querySelectorAll('[data-delete-comp]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('companions').delete().eq('id', btn.dataset.deleteComp);
                        playSfx('click');
                        loadCompanionsFeed();
                    });
                });
            }

            // =========================================================================
            // 23. МУЗЫКА
            // =========================================================================
            function openMusicModal() {
                showModal(`
                    <h3 class="modal-title">🎵 Музыка</h3>
                    <div class="form-group"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://..."></div>
                    <div class="flex-between gap-8 mb-12">
                        <button class="btn w-full" id="musicPlayBtn">▶️ Играть</button>
                        <button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button>
                    </div>
                    <button class="btn danger w-full" id="musicResetBtn">⏹ Сбросить</button>
                `);
                let activeAudio = window.appCurrentAudio || null;
                document.getElementById('musicPlayBtn').addEventListener('click', () => {
                    const url = document.getElementById('musicUrl').value.trim();
                    if (url) {
                        if (activeAudio) activeAudio.pause();
                        activeAudio = new Audio(url);
                        window.appCurrentAudio = activeAudio;
                        activeAudio.play().catch(() => showAlert('Ошибка', 'Не удалось воспроизвести'));
                    } else if (activeAudio) activeAudio.play();
                });
                document.getElementById('musicPauseBtn').addEventListener('click', () => { if (activeAudio) activeAudio
                        .pause(); });
                document.getElementById('musicResetBtn').addEventListener('click', () => {
                    if (activeAudio) { activeAudio.pause();
                        window.appCurrentAudio = null; }
                    document.getElementById('musicUrl').value = '';
                });
            }

            // =========================================================================
            // 24. НАСТРОЙКИ
            // =========================================================================
            function openSettingsModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group flex-between">
                        <label>🔊 Звуки в приложении</label>
                        <input type="checkbox" id="settingsSfx" ${sfxEnabled ? 'checked' : ''} style="width:24px;height:24px;cursor:pointer;">
                    </div>
                    <button class="btn danger w-full mt-12" id="settingsResetDataBtn">🔄 Сбросить все данные</button>
                `);
                document.getElementById('settingsSfx').addEventListener('change', (e) => {
                    sfxEnabled = e.target.checked;
                    localStorage.setItem('sfx', sfxEnabled ? 'on' : 'off');
                });
                document.getElementById('settingsResetDataBtn').addEventListener('click', () => {
                    showConfirm('Сброс', 'Очистить все локальные данные и выйти?', () => {
                        localStorage.clear();
                        window.location.reload();
                    });
                });
            }

            // =========================================================================
            // 25. МЕНЕДЖЕР
            // =========================================================================
            function openManagerModal() {
                showModal(`
                    <h3 class="modal-title">👨‍💼 Менеджер / Поддержка</h3>
                    <p style="color:var(--muted);margin-bottom:16px;">Свяжитесь с администрацией для решения вопросов.</p>
                    <button class="btn w-full" id="managerContactBtn">📨 Написать в Telegram</button>
                `);
                document.getElementById('managerContactBtn').addEventListener('click', () => {
                    window.open(`https://t.me/${OWNER_USERNAME}`, '_blank');
                });
            }

            // =========================================================================
            // 26. ПЕРЕПИСКИ
            // =========================================================================
            function openChatModal() {
                showModal(`
                    <h3 class="modal-title">💬 Переписки</h3>
                    <div class="empty-state">Переписки ведутся напрямую в Telegram. Перейдите в чат с продавцом через карточку товара.</div>
                    <button class="btn w-full mt-12" id="chatTgBtn">📱 Перейти в Telegram</button>
                `);
                document.getElementById('chatTgBtn').addEventListener('click', () => window.open('https://t.me/', '_blank'));
            }

            // =========================================================================
            // 27. ЗАПУСК
            // =========================================================================
            // Инициализация
            initTelegram();

            // Пробуем инициализировать Supabase
            if (!initSupabase()) {
                // ошибка уже показана
                return;
            }

            // Запускаем проверку авторизации
            checkAuth();

            // Обработка ошибок сети
            window.addEventListener('online', () => {
                console.log('Online');
                if (currentSection === 'home') loadHomeFeed();
            });

            console.log('Arizona RP App initialized');
        })();
    </script>
