            // ===================== АДМИН-ПАНЕЛЬ =====================
            async function loadAdminPanel(){
                const cont = document.getElementById('adminPanelContent');
                if(!isAdmin){ cont.innerHTML='<div class="empty-state">Нет доступа</div>'; return; }
                cont.innerHTML = '<div class="loader"></div>';
                try{
                    const [pr, ar, rr] = await Promise.all([
                        withTimeout(supabaseClient.from('ads').select('*').eq('status','pending').order('created_at',{ascending:false}), 5000),
                        withTimeout(supabaseClient.from('appeals').select('*').eq('status','pending').order('created_at',{ascending:false}), 5000),
                        withTimeout(supabaseClient.from('reports').select('*').eq('status','pending').order('created_at',{ascending:false}), 5000)
                    ]);
                    if(pr.error) throw pr.error;
                    if(ar.error) throw ar.error;
                    if(rr.error) throw rr.error;
                    pendingAds = pr.data || [];
                    pendingAppeals = ar.data || [];
                    pendingReports = rr.data || [];
                    let html = '<h3>📋 Объявления на модерации</h3>';
                    if(!pendingAds.length) html += '<div class="empty-state">Нет объявлений</div>';
                    else pendingAds.forEach(ad=>{
                        html += `<div class="card"><div style="font-weight:700;">${ad.item_name}</div><div style="font-size:0.75rem;color:var(--muted);">${ad.server} • ${ad.author_username||ad.author_id} • ${formatPrice(ad.price)}</div><div class="flex-between gap-8 mt-8"><button class="btn success" data-approve="${ad.id}">✅</button><button class="btn danger" data-reject="${ad.id}">❌</button><button class="btn secondary" data-edit-ad="${ad.id}">✏️</button></div></div>`;
                    });
                    html += '<h3 style="margin-top:1rem;">📨 Апелляции</h3>';
                    if(!pendingAppeals.length) html += '<div class="empty-state">Нет апелляций</div>';
                    else pendingAppeals.forEach(ap=>{
                        html += `<div class="card"><div style="font-weight:700;">Объявление ID: ${ap.ad_id}</div><div style="font-size:0.75rem;color:var(--muted);">Автор: ${ap.author_username||ap.author_id}</div><div style="font-size:0.8rem;">Причина: ${ap.reason}</div><div class="flex-between gap-8 mt-8"><button class="btn success" data-approve-appeal="${ap.id}">✅</button><button class="btn danger" data-reject-appeal="${ap.id}">❌</button></div></div>`;
                    });
                    html += '<h3 style="margin-top:1rem;">🚨 Жалобы</h3>';
                    if(!pendingReports.length) html += '<div class="empty-state">Нет жалоб</div>';
                    else pendingReports.forEach(rp=>{
                        html += `<div class="card"><div style="font-weight:700;">Объявление ID: ${rp.ad_id}</div><div style="font-size:0.75rem;color:var(--muted);">От: ${rp.reporter_username||rp.reporter_id}</div><div style="font-size:0.8rem;">Причина: ${rp.reason}</div><div class="flex-between gap-8 mt-8"><button class="btn success" data-approve-report="${rp.id}">✅</button><button class="btn danger" data-reject-report="${rp.id}">❌</button></div></div>`;
                    });
                    if(isOwner){
                        html += `<h3 style="margin-top:1rem;">👤 Управление пользователями</h3><div class="form-group"><input type="text" id="adminUsernameInput" placeholder="username или ID"></div><div class="flex-between gap-8 mb-8"><button class="btn danger w-full" id="adminBanBtn">🔨 Забанить</button><button class="btn success w-full" id="adminUnbanBtn">🔓 Разбанить</button></div><div class="flex-between gap-8 mb-8"><button class="btn w-full" id="adminMakeAdminBtn">👑 Сделать админом</button><button class="btn secondary w-full" id="adminRemoveAdminBtn">⬇️ Снять админа</button></div><button class="btn danger w-full mt-8" id="adminClearFeedBtn">🧹 Очистить ленту</button>`;
                    }
                    cont.innerHTML = html;
                    bindAdminEvents();
                } catch(e) { cont.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>'; }
            }
            function bindAdminEvents(){
                document.querySelectorAll('[data-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS*60*60*1000).toISOString();
                    await supabaseClient.from('ads').update({status:'approved', expires_at: expiresAt}).eq('id', btn.dataset.approve);
                    loadAdminPanel(); loadHomeFeed();
                }));
                document.querySelectorAll('[data-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    await supabaseClient.from('ads').update({status:'deleted'}).eq('id', btn.dataset.reject);
                    loadAdminPanel();
                }));
                document.querySelectorAll('[data-edit-ad]').forEach(btn=>btn.addEventListener('click', ()=>{
                    const ad = pendingAds.find(a=>a.id == btn.dataset.editAd);
                    if(ad) openAdminEditModal(ad);
                }));
                document.querySelectorAll('[data-approve-appeal]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    const ap = pendingAppeals.find(a=>a.id == btn.dataset.approveAppeal);
                    if(ap){
                        const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS*60*60*1000).toISOString();
                        await supabaseClient.from('ads').update({status:'approved', expires_at: expiresAt}).eq('id', ap.ad_id);
                    }
                    await supabaseClient.from('appeals').update({status:'approved'}).eq('id', btn.dataset.approveAppeal);
                    loadAdminPanel();
                }));
                document.querySelectorAll('[data-reject-appeal]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    await supabaseClient.from('appeals').update({status:'rejected'}).eq('id', btn.dataset.rejectAppeal);
                    loadAdminPanel();
                }));
                document.querySelectorAll('[data-approve-report]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    const rp = pendingReports.find(r=>r.id == btn.dataset.approveReport);
                    if(rp) await supabaseClient.from('ads').update({status:'deleted'}).eq('id', rp.ad_id);
                    await supabaseClient.from('reports').update({status:'approved'}).eq('id', btn.dataset.approveReport);
                    loadAdminPanel();
                }));
                document.querySelectorAll('[data-reject-report]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    await supabaseClient.from('reports').update({status:'rejected'}).eq('id', btn.dataset.rejectReport);
                    loadAdminPanel();
                }));
                if(isOwner){
                    document.getElementById('adminBanBtn')?.addEventListener('click', ()=>adminUserAction('ban'));
                    document.getElementById('adminUnbanBtn')?.addEventListener('click', ()=>adminUserAction('unban'));
                    document.getElementById('adminMakeAdminBtn')?.addEventListener('click', ()=>adminUserAction('make_admin'));
                    document.getElementById('adminRemoveAdminBtn')?.addEventListener('click', ()=>adminUserAction('remove_admin'));
                    document.getElementById('adminClearFeedBtn')?.addEventListener('click', async ()=>{
                        showConfirm('Очистка','Удалить ВСЕ объявления?', async ()=>{
                            await supabaseClient.from('ads').delete().neq('id', 0);
                            await supabaseClient.from('favorites').delete().neq('id', 0);
                            loadAdminPanel(); loadHomeFeed();
                        });
                    });
                }
            }
            async function adminUserAction(action){
                const target = document.getElementById('adminUsernameInput').value.trim();
                if(!target){ showAlert('Ошибка','Введите username или ID'); return; }
                try{
                    let q = supabaseClient.from('app_users').select('*');
                    if(!isNaN(target)) q = q.eq('id', target);
                    else q = q.eq('username', target);
                    const { data: users, error } = await withTimeout(q, 5000);
                    if(error) throw error;
                    if(!users.length){ showAlert('Ошибка','Пользователь не найден'); return; }
                    const user = users[0];
                    let updates = {};
                    if(action==='ban') updates.banned = true;
                    else if(action==='unban') updates.banned = false;
                    else if(action==='make_admin') updates.is_admin = true;
                    else if(action==='remove_admin') updates.is_admin = false;
                    await supabaseClient.from('app_users').update(updates).eq('id', user.id);
                    playSfx('success');
                    showAlert('Успех','Действие выполнено');
                    loadAdminPanel();
                } catch(e) { showAlert('Ошибка','Не удалось выполнить'); }
            }
            function openAdminEditModal(ad){
                showModal(`<h3 class="modal-title">✏️ Редактирование</h3><div class="form-group"><label>Название</label><input type="text" id="editAdminName" value="${ad.item_name||''}"></div><div class="form-group"><label>Цена</label><input type="text" id="editAdminPrice" value="${ad.price||''}"></div><div class="form-group"><label>Описание</label><textarea id="editAdminDesc">${ad.description||''}</textarea></div><div class="form-group"><label>Скриншоты</label><input type="text" id="editAdminImgs" value="${ad.images||''}"></div><button class="btn w-full" id="editAdminSaveBtn">Сохранить и одобрить</button>`);
                document.getElementById('editAdminSaveBtn').addEventListener('click', async ()=>{
                    const item_name = document.getElementById('editAdminName').value.trim();
                    const price = parsePriceToNumber(document.getElementById('editAdminPrice').value);
                    const description = document.getElementById('editAdminDesc').value.trim();
                    const images = document.getElementById('editAdminImgs').value.trim();
                    const lc = checkLinksString(images);
                    if(!lc.valid){ showAlert('Ошибка', lc.message); return; }
                    const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS*60*60*1000).toISOString();
                    await supabaseClient.from('ads').update({ item_name, price, description, images, status:'approved', expires_at: expiresAt }).eq('id', ad.id);
                    playSfx('success');
                    document.getElementById('modalOverlay').remove();
                    loadAdminPanel();
                    loadHomeFeed();
                });
            }

            // ===================== ДЕТАЛИ ОБЪЯВЛЕНИЯ =====================
            async function openAdDetail(ad){
                const images = ad.images ? ad.images.split(',').map(s=>s.trim()).filter(s=>s) : [];
                const gallery = images.length ? '<div class="image-gallery">'+images.map(img=>`<img src="${img}" loading="lazy" onerror="this.style.display='none'">`).join('')+'</div>' : '';
                const catLabel = ALL_CATEGORIES.find(c=>c.id===ad.category)?.label || ad.category;
                const modeBadge = ad.mode==='sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                let statusHtml = '';
                if(ad.status==='pending') statusHtml = '<div class="empty-state">⏳ На модерации</div>';
                else if(ad.status==='deleted'){
                    statusHtml = '<div class="empty-state">🗑️ Объявление удалено</div>';
                    if(ad.author_id === currentAuthUser.id) statusHtml += '<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Подать апелляцию</button>';
                } else {
                    statusHtml = `<button class="btn w-full mb-8" id="detailContactBtn">💬 Написать</button><button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 Корзина</button><button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ Отзывы</button>${ad.author_id===currentAuthUser.id?'<button class="btn danger w-full" id="detailDeleteBtn">🗑 Удалить</button>':''}<button class="btn secondary w-full mt-8" id="detailReportBtn">🚨 Пожаловаться</button>`;
                }
                const isFav = await checkIfInCart(ad.id);
                showModal(`<h3 class="modal-title">${ad.item_name}</h3><div class="ad-card-badges mb-8">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span></div>${gallery}<div style="font-size:1.5rem;font-weight:900;color:var(--accent);margin-bottom:0.5rem;">${formatPrice(ad.price)}</div><p style="color:var(--muted);margin-bottom:0.8rem;">${ad.description||'Нет описания'}</p><div style="font-size:0.75rem;color:var(--muted);margin-bottom:1rem;">Автор: <span id="detailAuthorLink" style="cursor:pointer;color:var(--text);">${ad.author_username||ad.author_id}</span></div>${statusHtml}<div id="detailReviewsSection"></div><h4 style="margin:1rem 0 0.5rem;">📌 Похожие</h4><div id="detailSimilarAds"></div>`);
                const overlay = document.getElementById('modalOverlay');
                if(ad.status==='approved'){
                    document.getElementById('detailContactBtn').addEventListener('click', ()=>window.open(`https://t.me/${ad.author_username||ad.author_id}`,'_blank'));
                    const cartBtn = document.getElementById('detailCartToggleBtn');
                    cartBtn.textContent = isFav ? '🛒 Убрать из корзины' : '🛒 В корзину';
                    cartBtn.addEventListener('click', async ()=>{
                        if(isFav){
                            await supabaseClient.from('favorites').delete().eq('user_id', currentAuthUser.id).eq('ad_id', ad.id);
                            cartBtn.textContent = '🛒 В корзину';
                        } else {
                            await supabaseClient.from('favorites').insert({ user_id: currentAuthUser.id, ad_id: ad.id });
                            cartBtn.textContent = '🛒 Убрать из корзины';
                        }
                        loadCart();
                    });
                    document.getElementById('detailReviewsBtn').addEventListener('click', ()=>openReviewsModal(ad.id));
                    if(ad.author_id === currentAuthUser.id){
                        document.getElementById('detailDeleteBtn').addEventListener('click', async ()=>{
                            showConfirm('Удаление','Удалить объявление?', async ()=>{
                                await supabaseClient.from('ads').update({status:'deleted'}).eq('id', ad.id);
                                overlay.remove();
                                loadHomeFeed();
                            });
                        });
                    }
                    document.getElementById('detailReportBtn').addEventListener('click', ()=>{
                        showModal(`<h3 class="modal-title">🚨 Пожаловаться</h3><div class="form-group"><label>Причина</label><textarea id="reportReason"></textarea></div><button class="btn w-full" id="reportSubmitBtn">Отправить</button>`);
                        document.getElementById('reportSubmitBtn').addEventListener('click', async ()=>{
                            const reason = document.getElementById('reportReason').value.trim();
                            if(!reason){ showAlert('Ошибка','Введите причину'); return; }
                            await supabaseClient.from('reports').insert({
                                ad_id: ad.id,
                                reporter_id: currentAuthUser.id,
                                reporter_username: currentAuthUser.username,
                                reason,
                                status:'pending',
                                created_at:new Date().toISOString()
                            });
                            showAlert('Успех','Жалоба отправлена');
                            document.getElementById('modalOverlay').remove();
                        });
                    });
                }
                if(ad.status==='deleted' && ad.author_id===currentAuthUser.id){
                    document.getElementById('detailAppealBtn')?.addEventListener('click', ()=>{
                        appealAdId = ad.id;
                        openAppealModal();
                    });
                }
                document.getElementById('detailAuthorLink').addEventListener('click', ()=>openProfileModal(ad.author_id));
                loadReviews(ad.id);
                loadSimilarAds(ad.category, ad.id);
            }
            async function checkIfInCart(adId){
                if(!currentAuthUser) return false;
                const { data, error } = await supabaseClient.from('favorites').select('*').eq('user_id', currentAuthUser.id).eq('ad_id', adId).maybeSingle();
                if(error) return false;
                return !!data;
            }
            async function loadReviews(adId){
                const cont = document.getElementById('detailReviewsSection');
                if(!cont) return;
                try{
                    const { data: reviews, error } = await withTimeout(supabaseClient.from('reviews').select('*').eq('ad_id', adId).order('created_at',{ascending:false}), 5000);
                    if(error) throw error;
                    const revs = reviews || [];
                    if(!revs.length){ cont.innerHTML='<p style="color:var(--muted);">⭐ Отзывов пока нет</p>'; return; }
                    const avg = revs.reduce((s,r)=>s+r.stars,0)/revs.length;
                    let html = `<div style="font-size:1.2rem;font-weight:800;">⭐ ${avg.toFixed(1)} (${revs.length})</div><div class="progress-bar mb-12"><div class="progress-fill" style="width:${(avg/5*100)}%;"></div></div>`;
                    revs.forEach(r=>{
                        const canEdit = r.author_id===currentAuthUser.id && (Date.now()-new Date(r.created_at).getTime()) < 7*24*60*60*1000;
                        html += `<div class="review-item"><div style="font-weight:600;">${r.author_username||r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div><div style="font-size:0.7rem;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div><p style="font-size:0.8rem;margin:0.3rem 0;">${r.text||''}</p>${r.media_links?`<div style="font-size:0.7rem;color:var(--accent);">${r.media_links}</div>`:''}${canEdit?`<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-del-review="${r.id}">🗑</button></div>`:''}</div>`;
                    });
                    cont.innerHTML = html;
                    cont.querySelectorAll('[data-edit-review]').forEach(btn=>btn.addEventListener('click', ()=>{
                        const r = revs.find(x=>x.id==btn.dataset.editReview);
                        if(r) openEditReviewModal(r);
                    }));
                    cont.querySelectorAll('[data-del-review]').forEach(btn=>btn.addEventListener('click', async ()=>{
                        await supabaseClient.from('reviews').delete().eq('id', btn.dataset.delReview);
                        loadReviews(adId);
                    }));
                } catch(e) { cont.innerHTML='<p style="color:var(--muted);">⚠️ Не удалось загрузить отзывы</p>'; }
            }
            async function loadSimilarAds(category, currentId){
                const cont = document.getElementById('detailSimilarAds');
                if(!cont) return;
                try{
                    const { data } = await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('category',category).neq('id',currentId).limit(3).order('created_at',{ascending:false}), 5000);
                    const similar = data || [];
                    if(!similar.length){ cont.innerHTML='<p style="color:var(--muted);">Похожих нет</p>'; return; }
                    cont.innerHTML = similar.map(ad=>`<div class="card" data-sim="${ad.id}"><span style="font-weight:700;">${ad.item_name}</span> • ${formatPrice(ad.price)}</div>`).join('');
                    cont.querySelectorAll('[data-sim]').forEach(el=>el.addEventListener('click', ()=>{
                        const found = similar.find(a=>a.id==el.dataset.sim);
                        if(found){
                            document.getElementById('modalOverlay').remove();
                            openAdDetail(found);
                        }
                    }));
                } catch(e){}
            }
            function openReviewsModal(adId){
                showModal(`<h3 class="modal-title">⭐ Оставить отзыв</h3><div class="form-group"><label>Оценка</label><div class="star-rating" id="reviewStars">${[1,2,3,4,5].map(i=>`<span data-star="${i}">☆</span>`).join('')}</div></div><div class="form-group"><label>Ссылки</label><input type="text" id="reviewMedia" placeholder="https://..."></div><div class="form-group"><label>Текст</label><textarea id="reviewText"></textarea></div><button class="btn w-full" id="reviewSubmitBtn">Отправить</button>`);
                let selected = 0;
                const stars = document.getElementById('reviewStars');
                stars.querySelectorAll('span').forEach(s=>s.addEventListener('click', ()=>{
                    selected = parseInt(s.dataset.star);
                    updateStars(stars, selected);
                }));
                document.getElementById('reviewSubmitBtn').addEventListener('click', async ()=>{
                    if(!selected){ showAlert('Ошибка','Выберите оценку'); return; }
                    const text = document.getElementById('reviewText').value.trim();
                    const media = document.getElementById('reviewMedia').value.trim();
                    const lc = checkLinksString(media);
                    if(!lc.valid){ showAlert('Ошибка', lc.message); return; }
                    try{
                        await supabaseClient.from('reviews').insert({
                            ad_id: adId,
                            author_id: currentAuthUser.id,
                            author_username: currentAuthUser.username,
                            stars: selected,
                            text,
                            media_links: media,
                            created_at:new Date().toISOString()
                        });
                        playSfx('success');
                        showAlert('Успех','Отзыв отправлен');
                        document.getElementById('modalOverlay').remove();
                        loadReviews(adId);
                    } catch(e){ showAlert('Ошибка','Не удалось отправить отзыв'); }
                });
            }
            function updateStars(container, selected){
                container.querySelectorAll('span').forEach(s=>{
                    s.textContent = parseInt(s.dataset.star) <= selected ? '★' : '☆';
                    s.classList.toggle('active', parseInt(s.dataset.star) <= selected);
                });
            }
            function openEditReviewModal(review){
                showModal(`<h3 class="modal-title">✏️ Редактировать отзыв</h3><div class="form-group"><label>Оценка</label><div class="star-rating" id="editReviewStars">${[1,2,3,4,5].map(i=>`<span data-star="${i}" class="${i<=review.stars?'active':''}">${i<=review.stars?'★':'☆'}</span>`).join('')}</div></div><div class="form-group"><label>Ссылки</label><input type="text" id="editReviewMedia" value="${review.media_links||''}"></div><div class="form-group"><label>Текст</label><textarea id="editReviewText">${review.text||''}</textarea></div><button class="btn w-full" id="editReviewSubmitBtn">Сохранить</button>`);
                let selected = review.stars;
                const stars = document.getElementById('editReviewStars');
                stars.querySelectorAll('span').forEach(s=>s.addEventListener('click', ()=>{
                    selected = parseInt(s.dataset.star);
                    updateStars(stars, selected);
                }));
                document.getElementById('editReviewSubmitBtn').addEventListener('click', async ()=>{
                    const text = document.getElementById('editReviewText').value.trim();
                    const media = document.getElementById('editReviewMedia').value.trim();
                    const lc = checkLinksString(media);
                    if(!lc.valid){ showAlert('Ошибка', lc.message); return; }
                    await supabaseClient.from('reviews').update({ stars:selected, text, media_links: media }).eq('id', review.id);
                    playSfx('success');
                    document.getElementById('modalOverlay').remove();
                    loadReviews(review.ad_id);
                });
            }

            // ===================== ИГРА "ДУРАК" =====================
            function openDurakGame() {
                const container = document.getElementById('durak-game-container');
                container.style.display = 'block';
                document.body.style.overflow = 'hidden';
                // Загружаем iframe с игрой, если ещё не загружен
                if (!container.querySelector('iframe')) {
                    const iframe = document.createElement('iframe');
                    iframe.src = 'durak.html';
                    iframe.allow = 'autoplay; encrypted-media';
                    iframe.setAttribute('allowfullscreen', 'true');
                    container.appendChild(iframe);
                    // Сохраняем ссылку для возможного управления
                    window.durakFrame = iframe;
                }
                // Добавляем кнопку выхода поверх iframe (маленькая, в углу)
                let exitBtn = document.getElementById('durak-exit-btn');
                if (!exitBtn) {
                    exitBtn = document.createElement('button');
                    exitBtn.id = 'durak-exit-btn';
                    exitBtn.textContent = '✕';
                    exitBtn.style.cssText = `
                        position: fixed; top: 10px; right: 10px; z-index: 6000;
                        background: rgba(0,0,0,0.7); color: #ffd700; border: 1px solid #ffd700;
                        border-radius: 50%; width: 36px; height: 36px; font-size: 18px;
                        cursor: pointer; font-weight: bold;
                    `;
                    document.body.appendChild(exitBtn);
                    exitBtn.addEventListener('click', closeDurakGame);
                }
                exitBtn.style.display = 'block';
            }
            function closeDurakGame() {
                const container = document.getElementById('durak-game-container');
                container.style.display = 'none';
                document.body.style.overflow = '';
                const exitBtn = document.getElementById('durak-exit-btn');
                if (exitBtn) exitBtn.style.display = 'none';
                // Останавливаем iframe (перезагружаем при следующем открытии)
                const iframe = container.querySelector('iframe');
                if (iframe) {
                    iframe.remove();
                    window.durakFrame = null;
                }
            }

            // ===================== ПОИСК И ПРОФИЛЬ =====================
            function openSearchModal(){
                showModal(`<h3 class="modal-title">🔍 Поиск</h3><div class="form-group"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off"></div><div class="flex-between gap-8 mb-12"><button class="btn w-full" id="searchItemBtn">📦 Предмет</button><button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button></div><div id="searchSuggestions"></div><div id="searchHistory"></div><div id="searchResults"></div>`);
                const input = document.getElementById('searchInput');
                setTimeout(()=>input.focus(),100);
                const sugg = document.getElementById('searchSuggestions');
                const res = document.getElementById('searchResults');
                const hist = document.getElementById('searchHistory');
                function renderHist(){
                    if(!searchHistory.length){ hist.innerHTML=''; return; }
                    hist.innerHTML = '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:0.5rem;">📜 История:</div>' + searchHistory.map(h=>`<span class="badge" style="cursor:pointer;margin:0.15rem;" data-hist="${h}">${h}</span>`).join('');
                    hist.querySelectorAll('[data-hist]').forEach(el=>el.addEventListener('click', ()=>{
                        input.value = el.dataset.hist;
                        input.dispatchEvent(new Event('input'));
                    }));
                }
                renderHist();
                input.addEventListener('input', async ()=>{
                    const q = input.value.trim().toLowerCase();
                    if(!q){ sugg.innerHTML=''; res.innerHTML=''; return; }
                    const { data, error } = await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').ilike('item_name', `%${q}%`).limit(5), 5000);
                    if(error) return;
                    const items = data || [];
                    sugg.innerHTML = items.map(ad=>`<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`).join('');
                    sugg.querySelectorAll('[data-sug]').forEach(el=>el.addEventListener('click', ()=>{
                        const ad = items.find(a=>a.id == el.dataset.sug);
                        if(ad){
                            saveSearchQuery(q);
                            document.getElementById('modalOverlay').remove();
                            openAdDetail(ad);
                        }
                    }));
                });
                document.getElementById('searchItemBtn').addEventListener('click', async ()=>{
                    const q = input.value.trim().toLowerCase();
                    if(!q) return;
                    saveSearchQuery(q);
                    const { data, error } = await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').ilike('item_name', `%${q}%`), 5000);
                    if(error) return;
                    const items = data || [];
                    if(!items.length){ res.innerHTML='<div class="empty-state">Ничего не найдено</div>'; return; }
                    res.innerHTML = items.map(ad=>`<div class="card" data-res-id="${ad.id}"><div style="font-weight:700;">${ad.item_name}</div><div style="font-size:0.75rem;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div></div>`).join('');
                    res.querySelectorAll('[data-res-id]').forEach(card=>card.addEventListener('click', ()=>{
                        const ad = items.find(a=>a.id == card.dataset.resId);
                        if(ad){
                            document.getElementById('modalOverlay').remove();
                            openAdDetail(ad);
                        }
                    }));
                });
                document.getElementById('searchProfileBtn').addEventListener('click', ()=>{
                    const q = input.value.trim();
                    if(q) openProfileModal(q);
                });
            }
            async function openProfileModal(authorIdOrUsername){
                let userId = authorIdOrUsername;
                if(typeof authorIdOrUsername==='string' && authorIdOrUsername.startsWith('@')){
                    const username = authorIdOrUsername.substring(1);
                    const { data } = await supabaseClient.from('app_users').select('id').eq('username', username).maybeSingle();
                    if(data) userId = data.id;
                    else userId = null;
                }
                showModal(`<h3 class="modal-title">👤 Профиль: ${authorIdOrUsername}</h3>
                    <div class="links-list mb-12">
                        <div class="link-item" data-link="https://t.me/bounqy31"><span class="link-icon">👨‍💼</span><span class="link-label">Менеджер</span></div>
                        <div class="link-item" data-link="https://t.me/Bounty_Squad31"><span class="link-icon">📣</span><span class="link-label">Телеграм канал</span></div>
                        <div class="link-item" data-link="https://vk.com/bountyarz"><span class="link-icon">📢</span><span class="link-label">ВК канал</span></div>
                    </div>
                    <div id="profileAdsList"><div class="loader"></div></div>`);
                document.querySelectorAll('.link-item').forEach(item=>item.addEventListener('click', ()=>window.open(item.dataset.link,'_blank')));
                if(!userId){
                    document.getElementById('profileAdsList').innerHTML='<div class="empty-state">Пользователь не найден</div>';
                    return;
                }
                try{
                    const { data } = await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('author_id', userId).order('created_at',{ascending:false}), 5000);
                    const ads = data || [];
                    const { count } = await supabaseClient.from('ads').select('*',{ count:'exact', head:true }).eq('author_id', userId);
                    const { data: reviews } = await supabaseClient.from('reviews').select('stars').eq('ad_id', userId);
                    const avg = reviews && reviews.length ? (reviews.reduce((s,r)=>s+r.stars,0)/reviews.length).toFixed(1) : '—';
                    const cont = document.getElementById('profileAdsList');
                    let html = `<div style="margin-bottom:1rem;"><strong>Объявлений:</strong> ${count||0} • <strong>Средняя оценка:</strong> ⭐${avg}</div>`;
                    if(!ads.length) html += '<div class="empty-state">Нет активных объявлений</div>';
                    else html += ads.map(ad=>`<div class="card" data-prof-ad="${ad.id}"><div style="font-weight:700;">${ad.item_name}</div><div style="font-size:0.75rem;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div></div>`).join('');
                    cont.innerHTML = html;
                    cont.querySelectorAll('[data-prof-ad]').forEach(card=>card.addEventListener('click', ()=>{
                        const ad = ads.find(a=>a.id == card.dataset.profAd);
                        if(ad){
                            document.getElementById('modalOverlay').remove();
                            openAdDetail(ad);
                        }
                    }));
                } catch(e){
                    document.getElementById('profileAdsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>';
                }
            }

            // ===================== ВСЕ РАЗДЕЛЫ =====================
            function loadAllTiles(){
                const tiles = [
                    { id:'looks', icon:'📸', label:'Лента «Луков»' },
                    { id:'companions', icon:'👥', label:'Попутчики' },
                    { id:'music', icon:'🎵', label:'Музыка' },
                    { id:'durak', icon:'🃏', label:'Игра «Дурак»' },
                    { id:'settings', icon:'⚙️', label:'Настройки' },
                    { id:'chat', icon:'💬', label:'Переписки' },
                    { id:'notifications', icon:'🔔', label:'Уведомления' }
                ];
                const cont = document.getElementById('allTiles');
                cont.innerHTML = tiles.map(t=>`<div class="grid-tile" data-tile="${t.id}"><span class="tile-icon">${t.icon}</span><span>${t.label}</span></div>`).join('');
                cont.querySelectorAll('[data-tile]').forEach(tile=>tile.addEventListener('click', ()=>{
                    const id = tile.dataset.tile;
                    if(id==='looks') openLooksModal();
                    if(id==='companions') openCompanionsModal();
                    if(id==='music') openMusicModal();
                    if(id==='durak') openDurakGame();
                    if(id==='settings') openSettingsModal();
                    if(id==='chat') openChatModal();
                    if(id==='notifications') openNotificationsModal();
                }));
            }

            // ===================== ЛУКИ, ПОПУТЧИКИ, МУЗЫКА =====================
            function openLooksModal(){
                showModal(`<h3 class="modal-title">📸 Лента «Луков»</h3><div class="form-group"><label>Ссылка на фото</label><input type="text" id="lookImg" placeholder="https://..."></div><div class="form-group"><label>Описание</label><input type="text" id="lookDesc" placeholder="Мой лук"></div><button class="btn w-full mb-12" id="lookSubmitBtn">Опубликовать</button><div id="looksList"><div class="loader"></div></div>`);
                loadLooksFeed();
                document.getElementById('lookSubmitBtn').addEventListener('click', async ()=>{
                    const img = document.getElementById('lookImg').value.trim();
                    const desc = document.getElementById('lookDesc').value.trim();
                    const lc = checkLinksString(img);
                    if(!lc.valid){ showAlert('Ошибка', lc.message); return; }
                    await supabaseClient.from('looks').insert({
                        author_id: currentAuthUser.id,
                        author_username: currentAuthUser.username,
                        image_url: img,
                        description: desc,
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    document.getElementById('lookImg').value='';
                    document.getElementById('lookDesc').value='';
                    loadLooksFeed();
                });
            }
            async function loadLooksFeed(){
                const cont = document.getElementById('looksList');
                if(!cont) return;
                const { data, error } = await withTimeout(supabaseClient.from('looks').select('*').order('created_at',{ascending:false}), 5000);
                if(error){ cont.innerHTML='<div class="empty-state">⚠️ Ошибка</div>'; return; }
                const looks = data || [];
                if(!looks.length){ cont.innerHTML='<div class="empty-state">📸 Образов пока нет</div>'; return; }
                cont.innerHTML = looks.map(l=>`<div class="card"><div class="img-container" style="height:200px;border-radius:12px;background:var(--border);"><div class="skeleton" style="position:absolute;inset:0;border-radius:12px;"></div><img src="${l.image_url}" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;" onload="this.classList.add('loaded')" onerror="this.style.display='none';"></div><div style="font-weight:700;font-size:0.85rem;">${l.author_username||l.author_id}</div><p style="font-size:0.8rem;color:var(--muted);">${l.description||''}</p>${l.author_id===currentAuthUser.id?`<button class="btn danger mt-8" data-del-look="${l.id}">🗑</button>`:''}</div>`).join('');
                cont.querySelectorAll('[data-del-look]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    await supabaseClient.from('looks').delete().eq('id', btn.dataset.delLook);
                    loadLooksFeed();
                }));
            }
            function openCompanionsModal(){
                showModal(`<h3 class="modal-title">👥 Попутчики</h3><div class="form-group"><label>Цель</label><input type="text" id="compTarget" placeholder="Например: еду на шахту"></div><div class="form-group"><label>Контакты</label><input type="text" id="compContact" placeholder="@username"></div><button class="btn w-full mb-12" id="compSubmitBtn">Найти напарника</button><div id="companionsList"><div class="loader"></div></div>`);
                loadCompanionsFeed();
                document.getElementById('compSubmitBtn').addEventListener('click', async ()=>{
                    const target = document.getElementById('compTarget').value.trim();
                    const contact = document.getElementById('compContact').value.trim();
                    if(!target || !contact){ showAlert('Ошибка','Заполните все поля'); return; }
                    await supabaseClient.from('companions').insert({
                        author_id: currentAuthUser.id,
                        author_username: currentAuthUser.username,
                        target,
                        contact,
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    document.getElementById('compTarget').value='';
                    document.getElementById('compContact').value='';
                    loadCompanionsFeed();
                });
            }
            async function loadCompanionsFeed(){
                const cont = document.getElementById('companionsList');
                if(!cont) return;
                const { data, error } = await withTimeout(supabaseClient.from('companions').select('*').order('created_at',{ascending:false}), 5000);
                if(error){ cont.innerHTML='<div class="empty-state">⚠️ Ошибка</div>'; return; }
                const comps = data || [];
                if(!comps.length){ cont.innerHTML='<div class="empty-state">👥 Заявок нет</div>'; return; }
                cont.innerHTML = comps.map(c=>`<div class="card"><div style="font-weight:700;">${c.target}</div><div style="font-size:0.75rem;color:var(--muted);">Автор: ${c.author_username||c.author_id} • Контакт: ${c.contact}</div>${c.author_id===currentAuthUser.id?`<button class="btn danger mt-8" data-del-comp="${c.id}">🗑</button>`:''}</div>`).join('');
                cont.querySelectorAll('[data-del-comp]').forEach(btn=>btn.addEventListener('click', async ()=>{
                    await supabaseClient.from('companions').delete().eq('id', btn.dataset.delComp);
                    loadCompanionsFeed();
                }));
            }
            function openMusicModal(){
                showModal(`<h3 class="modal-title">🎵 Музыка</h3><div class="form-group"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://..."></div><div class="flex-between gap-8 mb-12"><button class="btn w-full" id="musicPlayBtn">▶️ Играть</button><button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button></div><button class="btn danger w-full" id="musicResetBtn">⏹ Сбросить</button>`);
                let activeAudio = window.appCurrentAudio || null;
                document.getElementById('musicPlayBtn').addEventListener('click', ()=>{
                    const url = document.getElementById('musicUrl').value.trim();
                    if(url){
                        if(activeAudio) activeAudio.pause();
                        activeAudio = new Audio(url);
                        window.appCurrentAudio = activeAudio;
                        activeAudio.play().catch(()=>showAlert('Ошибка','Не удалось воспроизвести'));
                    } else if(activeAudio) activeAudio.play();
                });
                document.getElementById('musicPauseBtn').addEventListener('click', ()=>{ if(activeAudio) activeAudio.pause(); });
                document.getElementById('musicResetBtn').addEventListener('click', ()=>{
                    if(activeAudio){ activeAudio.pause(); window.appCurrentAudio = null; }
                    document.getElementById('musicUrl').value='';
                });
            }

            // ===================== НАСТРОЙКИ =====================
            function openSettingsModal(){
                showModal(`<h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group flex-between"><label>🔊 Звуки</label><input type="checkbox" id="settingsSfx" ${sfxEnabled?'checked':''} style="width:1.5rem;height:1.5rem;"></div>
                    <div class="form-group flex-between"><label>🌙 Тёмная тема</label><input type="checkbox" id="settingsDark" ${currentTheme==='dark'?'checked':''} style="width:1.5rem;height:1.5rem;"></div>
                    <button class="btn secondary w-full mt-12" id="settingsLogoutBtn">🚪 Выйти</button>
                    <button class="btn danger w-full mt-8" id="settingsDeleteBtn">🗑 Удалить аккаунт</button>`);
                document.getElementById('settingsSfx').addEventListener('change', async (e)=>{
                    sfxEnabled = e.target.checked;
                    if(currentAuthUser) await supabaseClient.from('user_settings').update({ sfx_enabled: sfxEnabled }).eq('user_id', currentAuthUser.id);
                });
                document.getElementById('settingsDark').addEventListener('change', async (e)=>{
                    currentTheme = e.target.checked ? 'dark' : 'light';
                    applyTheme();
                    if(currentAuthUser) await supabaseClient.from('user_settings').update({ theme: currentTheme }).eq('user_id', currentAuthUser.id);
                });
                document.getElementById('settingsLogoutBtn').addEventListener('click', ()=>{
                    localStorage.removeItem('arizona_current_user');
                    localStorage.removeItem('arizona_current_user_full');
                    sessionStorage.clear();
                    currentAuthUser = null;
                    document.getElementById('modalOverlay').remove();
                    showAuthScreen();
                });
                document.getElementById('settingsDeleteBtn').addEventListener('click', showDeleteAccountModal);
            }
            function showDeleteAccountModal(){
                showModal(`<h3 class="modal-title">🗑 Удаление аккаунта</h3><p style="color:var(--muted);margin-bottom:1rem;">Введите пароль для подтверждения.</p><div class="form-group"><label>Пароль</label><input type="password" id="deletePassInput"></div><button class="btn danger w-full" id="confirmDeleteBtn">Удалить</button><p id="deleteError" style="color:#EF4444;font-size:0.75rem;margin-top:0.4rem;"></p>`);
                document.getElementById('confirmDeleteBtn').addEventListener('click', async ()=>{
                    const pass = document.getElementById('deletePassInput').value.trim();
                    const errEl = document.getElementById('deleteError');
                    if(!pass){ errEl.textContent='Введите пароль'; return; }
                    const hash = await hashPassword(pass);
                    if(hash !== currentAuthUser.password_hash){ errEl.textContent='Неверный пароль'; return; }
                    showConfirm('Удаление','Удалить аккаунт и все данные?', async ()=>{
                        try{
                            await supabaseClient.from('app_users').delete().eq('id', currentAuthUser.id);
                            await supabaseClient.from('user_settings').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('user_progress').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('ads').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('favorites').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('search_history').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('baryga').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('looks').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('companions').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('notifications').delete().eq('user_id', currentAuthUser.id);
                            await supabaseClient.from('reviews').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('appeals').delete().eq('author_id', currentAuthUser.id);
                            await supabaseClient.from('reports').delete().eq('reporter_id', currentAuthUser.id);
                            localStorage.removeItem('arizona_current_user');
                            localStorage.removeItem('arizona_current_user_full');
                            currentAuthUser = null;
                            document.getElementById('modalOverlay').remove();
                            showAuthScreen();
                            showToast('Аккаунт удалён','success');
                        } catch(e){ showAlert('Ошибка','Не удалось удалить аккаунт'); }
                    });
                });
            }

            // ===================== ЧАТ =====================
            function openChatModal(){
                showModal(`<h3 class="modal-title">💬 Переписки</h3><div class="empty-state">Переписки ведутся напрямую в Telegram.</div><button class="btn w-full mt-12" id="chatTgBtn">📱 Перейти в Telegram</button>`);
                document.getElementById('chatTgBtn').addEventListener('click', ()=>window.open('https://t.me/','_blank'));
            }

            // ===================== УВЕДОМЛЕНИЯ =====================
            async function openNotificationsModal(){
                showModal(`<h3 class="modal-title">🔔 Уведомления</h3><div id="notificationsList"><div class="loader"></div></div>`);
                try{
                    const { data, error } = await withTimeout(supabaseClient.from('notifications').select('*').eq('user_id', currentAuthUser.id).order('created_at',{ascending:false}), 5000);
                    if(error) throw error;
                    const notif = data || [];
                    const cont = document.getElementById('notificationsList');
                    if(!notif.length){ cont.innerHTML='<div class="empty-state">Нет уведомлений</div>'; return; }
                    cont.innerHTML = notif.map(n=>`<div class="card ${!n.read?'inactive-card':''}"><div style="font-weight:600;">${n.message}</div><div style="font-size:0.7rem;color:var(--muted);">${new Date(n.created_at).toLocaleString('ru-RU')}</div></div>`).join('');
                    await supabaseClient.from('notifications').update({ read:true }).eq('user_id', currentAuthUser.id).eq('read', false);
                    unreadNotifications = 0;
                } catch(e){
                    document.getElementById('notificationsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>';
                }
            }

            // ===================== ЗАПУСК =====================
            const telegramOk = initTelegram();
            if (!telegramOk) return;
            if (!initSupabase()) return;
            playSplashSound();
            setTimeout(() => { checkAuth(); }, 2000);
            window.addEventListener('online', () => { if (currentSection === 'home') loadHomeFeed(); });
            document.addEventListener('DOMContentLoaded', () => setupServerSelector());
            console.log('Arizona Online App fully initialized');
        })();
    </script>
</body>
</html>
