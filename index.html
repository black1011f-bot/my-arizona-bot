<script>
    let tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : {};
    if (typeof tg.expand === 'function') {
        tg.expand();
    }

    let currentUser = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : { id: 0, username: '' };
    const OWNER_USERNAME = 'bounqy';
    
    let isOwner = currentUser.username && currentUser.username.toLowerCase() === OWNER_USERNAME.toLowerCase();
    
    // Безопасная проверка админов (например, по ID или username, а не хардкод true для всех)
    // Укажите список ID администраторов или проверку на бэкенде
    const ADMIN_USERNAMES = ['bounqy']; // добавьте юзернеймы админов при необходимости
    let isAdmin = isOwner || (currentUser.username && ADMIN_USERNAMES.includes(currentUser.username.toLowerCase()));

    if (isAdmin || isOwner) {
        let adminBtn = document.getElementById('adminTabBtn');
        if (adminBtn) adminBtn.style.display = 'block';
        if (isOwner) {
            let ownerSec = document.getElementById('ownerSection');
            if (ownerSec) ownerSec.style.display = 'block';
        }
    }

    function switchTab(tabName) {
        let tabs = document.querySelectorAll('.nav-tab');
        tabs.forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

        if (tabName === 'app') {
            tabs[0].classList.add('active');
            document.getElementById('tabApp').classList.add('active');
        } else if (tabName === 'myAds') {
            tabs[1].classList.add('active');
            document.getElementById('tabMyAds').classList.add('active');
            renderMyAds();
        } else if (tabName === 'feed') {
            tabs[2].classList.add('active');
            document.getElementById('tabFeed').classList.add('active');
            renderFeed();
        } else if (tabName === 'admin') {
            if (!isAdmin && !isOwner) {
                alert('У вас нет доступа к этой вкладке!');
                switchTab('app');
                return;
            }
            tabs[3].classList.add('active');
            document.getElementById('tabAdmin').classList.add('active');
        }
    }

    function toggleMode() {
        let mode = document.getElementById('mode').value;
        let catGroup = document.getElementById('categoryGroup');
        let itemGroup = document.getElementById('itemGroup');
        let priceGroup = document.getElementById('priceGroup');
        let textGroup = document.getElementById('textGroup');

        if (mode === 'auction') {
            catGroup.style.display = 'none';
            textGroup.style.display = 'none';
            itemGroup.style.display = 'block';
            priceGroup.style.display = 'block';
        } else if (mode === 'barter') {
            catGroup.style.display = 'none';
            itemGroup.style.display = 'none';
            priceGroup.style.display = 'none';
            textGroup.style.display = 'block';
        } else {
            catGroup.style.display = 'block';
            textGroup.style.display = 'block';
            itemGroup.style.display = 'none';
            priceGroup.style.display = 'none';
        }
    }

    let pendingData = null;

    function submitData() {
        let mode = document.getElementById('mode').value;
        let server = document.getElementById('server').value;
        let textContent = '';
        
        if (mode === 'auction') {
            let itemName = document.getElementById('itemName').value.trim();
            let price = document.getElementById('price').value.trim();
            if (!itemName || !price) {
                alert('Пожалуйста, укажите название товара и стартовую цену!');
                return;
            }
            textContent = `Аукцион: ${itemName} (Старт: ${price}$)`;
        } else {
            textContent = document.getElementById('text').value.trim();
            if (!textContent) {
                alert('Пожалуйста, введите текст объявления!');
                return;
            }
        }

        let adItem = {
            id: 'ad_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            mode: mode,
            server: server,
            category: document.getElementById('category').value,
            text: textContent,
            author: currentUser.username ? '@' + currentUser.username : (currentUser.first_name || 'Игрок'),
            date: new Date().toLocaleString()
        };

        try {
            let pendingAds = JSON.parse(localStorage.getItem('arizona_pending_ads') || '[]');
            pendingAds.unshift(adItem);
            localStorage.setItem('arizona_pending_ads', JSON.stringify(pendingAds));

            let myAds = JSON.parse(localStorage.getItem('my_arizona_ads') || '[]');
            myAds.unshift(adItem);
            localStorage.setItem('my_arizona_ads', JSON.stringify(myAds));
        } catch (e) {}

        pendingData = adItem;
        document.getElementById('successModal').style.display = 'flex';
    }

    function closeSuccessModal() {
        document.getElementById('successModal').style.display = 'none';
        document.getElementById('itemName').value = '';
        document.getElementById('price').value = '';
        document.getElementById('text').value = '';

        if (pendingData && typeof tg.sendData === 'function') {
            try { tg.sendData(JSON.stringify(pendingData)); } catch (e) {}
        }
        pendingData = null;
    }

    let currentModType = '';
    let selectedAdId = null;

    function openModerationSelector(type) {
        currentModType = type;
        document.getElementById('selectorTitle').innerText = type === 'sell' ? 'Модерация продажи' : 'Модерация скупки';
        renderPendingAdsList();
        document.getElementById('adSelectorModal').style.display = 'flex';
    }

    function closeAdSelectorModal() {
        document.getElementById('adSelectorModal').style.display = 'none';
    }

    function renderPendingAdsList() {
        let container = document.getElementById('pendingAdsList');
        let pendingAds = [];
        try {
            pendingAds = JSON.parse(localStorage.getItem('arizona_pending_ads') || '[]');
        } catch (e) {}

        let filtered = pendingAds.filter(ad => ad.mode === currentModType);

        if (filtered.length === 0) {
            container.innerHTML = '<div class="access-denied">Нет объявлений для модерации в этой категории.</div>';
            return;
        }

        let html = '';
        filtered.forEach(ad => {
            html += `
                <div class="ad-card">
                    <div class="ad-header">
                        <span><b>${ad.server}</b> | От: ${ad.author}</span>
                        <span>${ad.date}</span>
                    </div>
                    <div style="margin-bottom: 8px;"><b>Текст:</b> ${ad.text}</div>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn-success" style="margin:0; padding:6px; font-size:11px;" onclick="startEditAd('${ad.id}')">✏️ Редактировать</button>
                        <button class="btn-danger" style="margin:0; padding:6px; font-size:11px;" onclick="deletePendingAd('${ad.id}')">🗑 Удалить</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function startEditAd(id) {
        selectedAdId = id;
        let pendingAds = [];
        try { pendingAds = JSON.parse(localStorage.getItem('arizona_pending_ads') || '[]'); } catch (e) {}
        
        let ad = pendingAds.find(a => a.id === id);
        if (!ad) return;

        document.getElementById('modEditText').value = ad.text;
        document.getElementById('adSelectorModal').style.display = 'none';
        document.getElementById('moderationModal').style.display = 'flex';
    }

    function closeModerationEdit() {
        document.getElementById('moderationModal').style.display = 'none';
        document.getElementById('adSelectorModal').style.display = 'flex';
    }

    function submitModerationEdit() {
        let newText = document.getElementById('modEditText').value.trim();
        document.getElementById('moderationModal').style.display = 'none';

        let pendingAds = [];
        try { pendingAds = JSON.parse(localStorage.getItem('arizona_pending_ads') || '[]'); } catch (e) {}

        let index = pendingAds.findIndex(a => a.id === selectedAdId);
        if (index !== -1) {
            let ad = pendingAds[index];
            ad.text = newText;
            
            pendingAds.splice(index, 1);
            localStorage.setItem('arizona_pending_ads', JSON.stringify(pendingAds));

            let feedItem = {
                ...ad,
                editor: currentUser.username ? '@' + currentUser.username : 'Админ',
                date: new Date().toLocaleString()
            };

            try {
                let feed = JSON.parse(localStorage.getItem('arizona_global_feed') || '[]');
                feed.unshift(feedItem);
                localStorage.setItem('arizona_global_feed', JSON.stringify(feed));
            } catch(e){}

            if (typeof tg.sendData === 'function') {
                try {
                    tg.sendData(JSON.stringify({
                        action: 'approve_and_edit_ad',
                        id: selectedAdId,
                        edited_text: newText,
                        mode: currentModType
                    }));
                } catch(e){}
            }
        }

        document.getElementById('praiseText').innerText = 'Молодец! Ты успешно отредактировал объявление, проверил его на маты и отправил в ленту. Порядок наведен!';
        document.getElementById('praiseModal').style.display = 'flex';
    }

    function deletePendingAd(id) {
        if (!confirm('Вы уверены, что хотите удалить это объявление из-за матов/нарушений?')) return;

        let pendingAds = [];
        try { pendingAds = JSON.parse(localStorage.getItem('arizona_pending_ads') || '[]'); } catch (e) {}

        pendingAds = pendingAds.filter(a => a.id !== id);
        localStorage.setItem('arizona_pending_ads', JSON.stringify(pendingAds));

        renderPendingAdsList();

        if (typeof tg.sendData === 'function') {
            try {
                tg.sendData(JSON.stringify({ action: 'delete_pending_ad', id: id }));
            } catch(e){}
        }
    }

    function closePraiseModal() {
        document.getElementById('praiseModal').style.display = 'none';
        if (currentModType) {
            openModerationSelector(currentModType);
        }
    }

    function renderMyAds() {
        let container = document.getElementById('myAdsContainer');
        if (!container) return;

        let myAds = [];
        try { myAds = JSON.parse(localStorage.getItem('my_arizona_ads') || '[]'); } catch (e) {}

        if (myAds.length === 0) {
            container.innerHTML = '<div class="access-denied">У вас пока нет отправленных объявлений.</div>';
            return;
        }

        let html = '';
        myAds.forEach(ad => {
            let modeName = { 'sell': 'Продажа', 'buy': 'Скупка', 'auction': 'Аукцион', 'barter': 'Бартер / Обмен' }[ad.mode] || ad.mode;
            html += `
                <div class="ad-card" id="card_${ad.id}">
                    <div class="ad-header">
                        <span><b>${ad.server}</b> (${modeName})</span>
                        <span>${ad.date}</span>
                    </div>
                    <div><b>Текст:</b> ${ad.text}</div>
                    ${isOwner ? `<button class="btn-danger" style="margin-top:8px; padding:6px; font-size:11px;" onclick="ownerDeleteAd('${ad.id}', 'my')">🗑 Удалить (Владелец)</button>` : ''}
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderFeed() {
        let container = document.getElementById('feedContainer');
        if (!container) return;

        let feed = [];
        try { feed = JSON.parse(localStorage.getItem('arizona_global_feed') || '[]'); } catch (e) {}

        if (feed.length === 0) {
            container.innerHTML = '<div class="access-denied">В ленте пока нет отредактированных объявлений.</div>';
            return;
        }

        let html = '';
        feed.forEach(ad => {
            html += `
                <div class="ad-card" id="card_feed_${ad.id}">
                    <div class="ad-header">
                        <span><b>${ad.server}</b> | Модератор: ${ad.editor || 'Система'}</span>
                        <span>${ad.date}</span>
                    </div>
                    <div><b>Текст:</b> ${ad.text}</div>
                    ${isOwner ? `<button class="btn-danger" style="margin-top:8px; padding:6px; font-size:11px;" onclick="ownerDeleteAd('${ad.id}', 'feed')">🗑 Удалить (Владелец)</button>` : ''}
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function ownerDeleteAd(id, type) {
        if (!isOwner) return;
        if (!confirm('Вы уверены, что хотите удалить это объявление как владелец (@bounqy)?')) return;

        if (type === 'feed') {
            let feed = [];
            try { feed = JSON.parse(localStorage.getItem('arizona_global_feed') || '[]'); } catch (e) {}
            feed = feed.filter(a => a.id !== id);
            localStorage.setItem('arizona_global_feed', JSON.stringify(feed));
            renderFeed();
        } else {
            let myAds = [];
            try { myAds = JSON.parse(localStorage.getItem('my_arizona_ads') || '[]'); } catch (e) {}
            myAds = myAds.filter(a => a.id !== id);
            localStorage.setItem('my_arizona_ads', JSON.stringify(myAds));
            renderMyAds();
        }

        if (typeof tg.sendData === 'function') {
            try {
                tg.sendData(JSON.stringify({ action: 'owner_delete_ad', id: id, list_type: type }));
            } catch(e){}
        }
    }

    function clearMyAds() {
        if (confirm('Очистить историю ваших объявлений?')) {
            localStorage.removeItem('my_arizona_ads');
            renderMyAds();
        }
    }

    function sendAdminAction(actionType) {
        if (typeof tg.sendData === 'function') {
            try { tg.sendData(JSON.stringify({ action: actionType })); } catch (e) {}
        }
    }

    function sendTargetAction(actionType) {
        let targetInput = document.getElementById('targetUser');
        if (!targetInput) return;
        let target = targetInput.value.trim();
        if (!target) { alert('Введите ID или @username!'); return; }
        if (typeof tg.sendData === 'function') {
            try { tg.sendData(JSON.stringify({ action: actionType, target: target })); } catch (e) {}
        }
    }

    function sendBroadcast() {
        let text = document.getElementById('broadcastText').value.trim();
        if (!text) { alert('Введите текст!'); return; }
        if (typeof tg.sendData === 'function') {
            try { tg.sendData(JSON.stringify({ action: 'broadcast', text: text })); } catch (e) {}
        }
    }
</script>
