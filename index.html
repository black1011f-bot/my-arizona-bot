<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Arizona Online — Маркетплейс</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           ARIZONA ONLINE — HUNTER THEME
           Тёмная база + золото + serif заголовки
           ============================================================ */

        :root {
            /* === БАЗОВЫЕ === */
            --bg:            #0D0D0D;
            --bg-deep:       #050505;
            --card:          #1A1A1A;
            --card-hi:       #212121;
            --border:        rgba(212,175,55,.20);
            --border-strong: rgba(212,175,55,.40);

            /* === ТЕКСТ === */
            --text:          #F5E6D3;
            --text-soft:     #C9B896;
            --muted:         #8A7B5C;
            --muted-deep:    #5A5040;

            /* === АКЦЕНТЫ === */
            --accent:        #D4AF37;      /* Золото */
            --accent-hi:     #E8C860;      /* Светлое золото */
            --accent-deep:   #A88B2A;      /* Тёмное золото */
            --copper:        #B87333;      /* Медь */
            --accent-soft:   rgba(212,175,55,.10);
            --accent-glow:   rgba(212,175,55,.35);

            /* === СЕМАНТИКА === */
            --success:       #7CB342;
            --success-soft:  rgba(124,179,66,.12);
            --danger:        #C62828;
            --danger-soft:   rgba(198,40,40,.12);
            --warning:       #D4AF37;
            --info:          #5D8AA8;
            --info-soft:     rgba(93,138,168,.12);

            /* === ТЕНИ === */
            --shadow-sm:     0 1px 2px rgba(0,0,0,.6);
            --shadow:        0 2px 12px rgba(0,0,0,.65);
            --shadow-md:     0 4px 20px rgba(0,0,0,.75);
            --shadow-lg:     0 12px 40px rgba(0,0,0,.85);
            --shadow-gold:   0 0 20px rgba(212,175,55,.25);

            /* === ГЕОМЕТРИЯ === */
            --radius:        14px;
            --radius-sm:     8px;
            --radius-xs:     6px;
            --radius-pill:   999px;

            --btn-min-height: 48px;
            --header-height:  62px;
            --nav-height:     66px;

            /* === ШРИФТЫ === */
            --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;
        }

        /* === СВЕТЛАЯ ТЕМА (для тех, кто переключит) === */
        [data-theme="light"] {
            --bg:            #F5F1E8;
            --bg-deep:       #EBE4D5;
            --card:          #FFFCF5;
            --card-hi:       #FFFFFF;
            --border:        rgba(138,106,35,.20);
            --border-strong: rgba(138,106,35,.40);
            --text:          #2A2418;
            --text-soft:     #4A3F26;
            --muted:         #8A7B5C;
            --muted-deep:    #B0A17E;
            --accent:        #8A6A23;
            --accent-hi:     #A88B2A;
            --accent-deep:   #6B5219;
            --copper:        #8B5A2B;
            --accent-soft:   rgba(138,106,35,.10);
            --accent-glow:   rgba(138,106,35,.30);
            --success:       #4F7B1F;
            --danger:        #A01F1F;
            --shadow:        0 2px 12px rgba(138,106,35,.12);
            --shadow-md:     0 4px 20px rgba(138,106,35,.18);
            --shadow-lg:     0 12px 40px rgba(138,106,35,.22);
        }

        /* ============================================================
           БАЗА
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-body);
        }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s ease, color .3s ease;
            overflow-x: hidden;
            touch-action: manipulation;
            font-size: 16px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            background-image:
                radial-gradient(1200px 600px at 50% -10%, rgba(212,175,55,.06), transparent 70%),
                radial-gradient(800px 400px at 50% 110%, rgba(184,115,51,.04), transparent 70%);
            background-attachment: fixed;
        }
        button, input, textarea, select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }
        a { color: var(--accent); text-decoration: none; }
        img { max-width: 100%; display: block; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-deep); }
        ::selection { background: var(--accent-soft); color: var(--accent-hi); }

        /* ============================================================
           ПРЕЛОАДЕР (улучшенный из присланного)
           ============================================================ */
        #preloader {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity .6s ease, visibility .6s ease;
            background-image:
                radial-gradient(800px 400px at 50% 40%, rgba(212,175,55,.08), transparent 70%);
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .preloader-container {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preloader-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            animation: preloader-pulse 2s infinite ease-in-out;
            box-shadow:
                0 0 40px rgba(212,175,55,.25),
                0 10px 30px rgba(0,0,0,.6),
                inset 0 0 0 2px rgba(212,175,55,.4);
            border: 2px solid var(--accent);
        }
        .preloader-spinner {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 3px solid rgba(212,175,55,.08);
            border-top: 3px solid var(--accent);
            border-right: 3px solid var(--accent-hi);
            border-radius: 50%;
            animation: preloader-spin 1.2s linear infinite;
            box-shadow: 0 0 30px rgba(212,175,55,.15);
        }
        .preloader-spinner::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(212,175,55,.15);
            border-radius: 50%;
            border-top-color: var(--accent-deep);
            animation: preloader-spin 2s linear infinite reverse;
        }
        .preloader-title {
            margin-top: 28px;
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: .06em;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(212,175,55,.3);
        }
        .preloader-text {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: preloader-fade 1.6s infinite ease-in-out;
        }
        .preloader-line {
            margin-top: 24px;
            width: 180px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: .5;
        }
        @keyframes preloader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes preloader-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes preloader-fade {
            0%, 100% { opacity: .4; }
            50% { opacity: 1; }
        }

        /* ============================================================
           КОНТЕЙНЕР
           ============================================================ */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
            padding-top: calc(var(--header-height) + 1rem);
            padding-bottom: calc(var(--nav-height) + 2rem + env(safe-area-inset-bottom));
        }
        @media (min-width: 768px) {
            .container { max-width: 720px; }
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }
        @media (min-width: 1024px) {
            .container { max-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* ============================================================
           ХЕДЕР
           ============================================================ */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: saturate(180%) blur(16px);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: .6rem 1rem;
            padding-top: calc(.6rem + env(safe-area-inset-top));
            height: calc(var(--header-height) + env(safe-area-inset-top));
            gap: .6rem;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
            pointer-events: none;
        }
        .header-logo {
            width: 40px; height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 0 0 1px var(--border-strong), 0 0 15px rgba(212,175,55,.15);
            transition: transform .2s ease, box-shadow .3s ease;
        }
        .header-logo:hover { box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--accent-glow); }
        .header-logo:active { transform: scale(.92); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: .02em;
            white-space: nowrap;
            background: linear-gradient(135deg, var(--accent-hi), var(--accent-deep));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-search { flex: 1; cursor: pointer; }
        .header-search input {
            width: 100%;
            padding: .6rem 1rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: .85rem;
            outline: none;
            pointer-events: none;
            transition: border-color .2s ease;
            letter-spacing: .01em;
        }
        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all .2s ease;
            flex-shrink: 0;
            color: var(--accent);
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-soft);
        }
        .theme-toggle:active { transform: scale(.92); }

        /* ============================================================
           НИЖНЯЯ НАВИГАЦИЯ
           ============================================================ */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 92%, transparent);
            backdrop-filter: saturate(180%) blur(16px);
            -webkit-backdrop-filter: saturate(180%) blur(16px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-bar::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
            pointer-events: none;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: .66rem;
            font-weight: 600;
            cursor: pointer;
            padding: .3rem .35rem;
            border-radius: 10px;
            flex: 1;
            max-width: 84px;
            min-height: 48px;
            transition: color .2s ease, background .2s ease, transform .1s ease;
            position: relative;
            letter-spacing: .02em;
        }
        .nav-item:active { transform: scale(.94); }
        .nav-item .nav-icon {
            font-size: 1.3rem;
            transition: transform .2s ease, filter .2s ease;
            filter: grayscale(1) brightness(1.4);
        }
        .nav-item.active {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .nav-item.active .nav-icon {
            transform: scale(1.12);
            filter: none;
            text-shadow: 0 0 12px var(--accent-glow);
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        /* ============================================================
           СЕКЦИИ
           ============================================================ */
        .section {
            display: none;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .3s ease, transform .3s ease;
        }
        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .section h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: .01em;
            margin-bottom: 1rem;
            padding-bottom: .5rem;
            position: relative;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(212,175,55,.15);
        }
        .section h2::after {
            content: '';
            position: absolute;
            left: 0; bottom: 0;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }
        .section h3 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: .01em;
            margin: 1.4rem 0 .7rem;
            color: var(--accent-hi);
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        /* ============================================================
           КАРТОЧКИ
           ============================================================ */
        .card {
            background: linear-gradient(135deg, var(--card), var(--bg-deep));
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow:
                inset 0 1px 0 rgba(212,175,55,.06),
                var(--shadow);
            padding: 1rem;
            margin-bottom: .9rem;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .25s ease, border-color .25s ease;
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            border-top: 1px solid var(--border-strong);
            border-right: 1px solid var(--border-strong);
            opacity: .5;
            pointer-events: none;
        }
        .card::after {
            content: '';
            position: absolute;
            bottom: 6px; left: 6px;
            width: 8px; height: 8px;
            border-bottom: 1px solid var(--border-strong);
            border-left: 1px solid var(--border-strong);
            opacity: .5;
            pointer-events: none;
        }
        .card:hover {
            box-shadow:
                inset 0 1px 0 rgba(212,175,55,.12),
                var(--shadow-md),
                0 0 20px rgba(212,175,55,.08);
            border-color: var(--border-strong);
        }
        .card:active { transform: scale(.985); }
        .card.inactive-card {
            opacity: .55;
            background: color-mix(in srgb, var(--card) 80%, transparent);
        }

        /* ============================================================
           AD-CARD
           ============================================================ */
        .ad-card {
            display: flex;
            gap: .85rem;
            align-items: flex-start;
        }
        .ad-card-img {
            width: 86px; height: 106px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: .2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -.01em;
            color: var(--text);
        }
        .ad-card-price {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--accent-hi), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: .01em;
            line-height: 1.1;
        }
        .ad-card-badges {
            display: flex;
            gap: .3rem;
            flex-wrap: wrap;
            margin: .4rem 0 .3rem;
        }
        .ad-card-author {
            font-size: .72rem;
            color: var(--muted);
            margin-top: .25rem;
            font-style: italic;
        }

        /* ============================================================
           БЕЙДЖИ
           ============================================================ */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: .2rem .6rem;
            border-radius: var(--radius-pill);
            font-size: .66rem;
            font-weight: 700;
            background: var(--border);
            color: var(--text-soft);
            white-space: nowrap;
            letter-spacing: .04em;
            line-height: 1.3;
            text-transform: uppercase;
            border: 1px solid transparent;
        }
        .badge.sell {
            background: var(--success-soft);
            color: #A4D96C;
            border-color: rgba(124,179,66,.35);
        }
        .badge.buy {
            background: var(--info-soft);
            color: #8BB4D0;
            border-color: rgba(93,138,168,.35);
        }
        .badge.server {
            background: var(--accent-soft);
            color: var(--accent-hi);
            border-color: var(--border);
        }
        .badge.category {
            background: rgba(184,115,51,.12);
            color: var(--copper);
            border-color: rgba(184,115,51,.3);
        }
        .badge.status-pending {
            background: rgba(212,175,55,.15);
            color: var(--accent);
            border-color: var(--border-strong);
        }
        .badge.status-deleted {
            background: var(--danger-soft);
            color: #E57373;
            border-color: rgba(198,40,40,.35);
        }
        .badge.status-approved {
            background: var(--success-soft);
            color: #A4D96C;
            border-color: rgba(124,179,66,.35);
        }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            padding: .75rem 1.15rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--accent);
            background: transparent;
            color: var(--accent);
            font-weight: 700;
            font-size: .85rem;
            cursor: pointer;
            min-height: var(--btn-min-height);
            transition: transform .12s ease, box-shadow .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
            letter-spacing: .06em;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-hi));
            opacity: 0;
            transition: opacity .25s ease;
            z-index: -1;
        }
        .btn:hover {
            background: var(--accent);
            color: var(--bg-deep);
            box-shadow: 0 0 25px var(--accent-glow);
        }
        .btn:active { transform: scale(.97); }
        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-deep));
            color: var(--bg-deep);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(212,175,55,.25);
        }
        .btn.primary:hover {
            background: linear-gradient(135deg, var(--accent-hi), var(--accent));
            box-shadow: 0 0 35px rgba(212,175,55,.45);
        }
        .btn.secondary {
            background: var(--card);
            color: var(--text);
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
            text-transform: none;
            letter-spacing: .02em;
        }
        .btn.secondary:hover {
            background: var(--card-hi);
            color: var(--accent);
            border-color: var(--border-strong);
            box-shadow: var(--shadow);
        }
        .btn.danger {
            background: transparent;
            color: #E57373;
            border-color: rgba(198,40,40,.5);
        }
        .btn.danger:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 0 25px rgba(198,40,40,.4);
        }
        .btn.gold {
            background: linear-gradient(135deg, var(--accent), var(--copper));
            color: var(--bg-deep);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(212,175,55,.3);
        }
        .btn.success {
            background: transparent;
            color: #A4D96C;
            border-color: rgba(124,179,66,.5);
        }
        .btn.success:hover {
            background: var(--success);
            color: var(--bg-deep);
            box-shadow: 0 0 25px var(--success-soft);
        }
        .btn.w-full { width: 100%; }

        /* ============================================================
           МОДАЛКИ
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity .3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

    function playSfx(type) {
        type = type || 'click';
        if (!sfxEnabled) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const freqs = { click: 800, success: 1200, error: 300, buy: 1000, splash: 600 };
            osc.frequency.value = freqs[type] || 600;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.04);
        } catch (e) { /* silent */ }
    }

    /* ---------- SHA-256 (c fallback) ---------- */
    const SALT = 'ArizonaOnlineSalt_2024';

    function sha256Fallback(ascii) {
        function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
        const mathPow = Math.pow;
        const maxWord = mathPow(2, 32);
        let result = '';
        const words = [];
        const asciiBitLength = ascii.length * 8;

        let hash = sha256Fallback.h = sha256Fallback.h || [];
        const k = sha256Fallback.k = sha256Fallback.k || [];
        let primeCounter = k.length;

        const isComposite = {};
        for (let candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
                for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
            }
        }
        ascii += '\x80';
        while (ascii.length % 64 - 56) ascii += '\x00';
        for (let i = 0; i < ascii.length; i++) {
            const j = ascii.charCodeAt(i);
            if (j >> 8) return '';
            words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words.length] = (asciiBitLength / maxWord) | 0;
        words[words.length] = asciiBitLength;

        for (let j = 0; j < words.length;) {
            const w = words.slice(j, j += 16);
            const oldHash = hash;
            hash = hash.slice(0, 8);
            for (let i = 0; i < 64; i++) {
                const w15 = w[i - 15], w2 = w[i - 2];
                const a = hash[0], e = hash[4];
                const temp1 = hash[7]
                    + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                    + ((e & hash[5]) ^ ((~e) & hash[6]))
                    + k[i]
                    + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16]
                        + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                        + w[i - 7]
                        + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                    ) | 0);
                const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                    + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                hash = [(temp1 + temp2) | 0].concat(hash);
                hash[4] = (hash[4] + temp1) | 0;
            }
            for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
        }
        for (let i = 0; i < 8; i++) {
            for (let j = 3; j + 1; j--) {
                const b = (hash[i] >> (j * 8)) & 255;
                result += ((b < 16) ? 0 : '') + b.toString(16);
            }
        }
        return result;
    }

    async function hashPassword(password) {
        const data = SALT + password;
        if (window.crypto && window.crypto.subtle && typeof window.crypto.subtle.digest === 'function') {
            try {
                const buf = new TextEncoder().encode(data);
                const hashBuffer = await window.crypto.subtle.digest('SHA-256', buf);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            } catch (e) {
                warn('crypto.subtle упал, fallback:', e);
            }
        }
        return sha256Fallback(unescape(encodeURIComponent(data)));
    }

    /* ---------- ЦЕНА ---------- */
    function formatPrice(value) {
        if (!value && value !== 0) return '0';
        let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
        if (num.indexOf('к') !== -1) {
            let base = parseFloat(num.split('к')[0]) || 0;
            let kCount = (num.match(/к/g) || []).length;
            if (kCount === 1) base *= 1000;
            else if (kCount === 2) base *= 1000000;
            else if (kCount === 3) base *= 1000000000;
            return Math.floor(base).toString();
        }
        num = parseInt(num) || 0;
        if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
        if (num >= 1000000)    return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
        if (num >= 1000)       return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
        return num.toString();
    }

    function parsePriceToNumber(str) {
        if (!str) return 0;
        str = str.toLowerCase().trim();
        let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
        let kCount = (str.match(/к/g) || []).length;
        if (kCount === 1) num *= 1000;
        else if (kCount === 2) num *= 1000000;
        else if (kCount === 3) num *= 1000000000;
        return num;
    }

    function formatPriceInputHandler(e) {
        const input = e.target;
        let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
        if (!val) { input.value = ''; return; }
        let num = parseInt(val.replace(/к/g, '')) || 0;
        let kCount = (val.match(/к/g) || []).length;
        if (kCount === 1) num *= 1000;
        else if (kCount === 2) num *= 1000000;
        else if (kCount === 3) num *= 1000000000;
        input.value = formatPrice(num);
    }

    /* ---------- ССЫЛКИ ---------- */
    function isAllowedLink(url) {
        try {
            const u = new URL(url);
            const host = u.hostname.replace('www.', '');
            return ALLOWED_DOMAINS.some(function(d) { return host === d || host.endsWith('.' + d); });
        } catch (e) { return false; }
    }

    function checkLinksString(str) {
        if (!str || !str.trim()) return { valid: true, links: [] };
        const links = str.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
        if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
        for (let i = 0; i < links.length; i++) {
            if (!isAllowedLink(links[i])) return { valid: false, message: 'Ссылка ' + links[i] + ' не разрешена' };
        }
        return { valid: true, links: links };
    }

    function checkForbiddenWords(text) {
        if (!text) return null;
        const lower = text.toLowerCase();
        const found = FORBIDDEN_WORDS.some(function(word) { return lower.indexOf(word) !== -1; });
        return found ? '⚠️ Текст содержит запрещённые слова' : null;
    }

    async function checkLinkSafety(url) {
        const suspiciousDomains = ['phishing.com', 'malware.org', 'scam.net'];
        try {
            const domain = new URL(url).hostname.replace('www.', '');
            if (suspiciousDomains.some(function(d) { return domain.indexOf(d) !== -1; })) {
                return { safe: false, message: '⚠️ Ссылка может быть опасной' };
            }
            return { safe: true };
        } catch (e) { return { safe: false, message: 'Некорректная ссылка' }; }
    }

    function showModal(html, onClose) {
        const container = document.getElementById('modalContainer');
        container.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal"><button class="modal-close" id="modalCloseBtn" aria-label="Закрыть">✕</button>' + html + '</div></div>';

        setTimeout(function() { overlay.classList.add('show'); }, 10);

            overlay.classList.remove('show');
            setTimeout(function() {

                if (onClose) onClose();
            }, 300);

    async function loginWithUsername(username, password) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            showToast('Логин: 3-20 символов (латиница, цифры, _)', 'error');
            return false;
        }
        if (!password || password.length < 6) {
            showToast('Пароль не короче 6 символов', 'error');
            return false;
        }
        try {
            log('Логин:', username);
            const hashedPassword = await hashPassword(password);

            const res = await withTimeout(
                supabaseClient.from('app_users').select('*').eq('username', username).maybeSingle(),
                8000
            );
            const user = res.data;
            const error = res.error;

            if (error) {
                warn('Ошибка запроса:', error);
                if (error.message && error.message.indexOf('relation') !== -1) {
                    showAlert('Ошибка БД', 'Таблица app_users не создана в Supabase', 'error');
                } else {
                    showAlert('Ошибка соединения', error.message || 'Не удалось запросить пользователя', 'error');
                }
                return false;
            }
            if (!user) {
                showAlert('Пользователь не найден', 'Проверьте логин или зарегистрируйтесь', 'error');
                return false;
            }
            if (user.password_hash !== hashedPassword) {
                showAlert('Неверный пароль', 'Попробуйте ещё раз', 'error');
                return false;
            }
            if (user.banned) {
                showBanScreen();
                return false;
            }
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && user.telegram_id !== tg.initDataUnsafe.user.id) {
                try {
                    await supabaseClient.from('app_users').update({
                        telegram_id: tg.initDataUnsafe.user.id,
                        telegram_username: tg.initDataUnsafe.user.username
                    }).eq('id', user.id);
                } catch (e) { warn('Ошибка обновления tg_id:', e); }
            }
            currentUser = user;
            localStorage.setItem('arizona_current_user', JSON.stringify(user));
            log('Успешный вход:', user.username);
            return true;
        } catch (e) {
            warn('Login error:', e);
            showToast('Ошибка соединения: ' + (e.message || 'неизвестно'), 'error');
            return false;
        }
    }

    async function registerUser(username, password) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            showToast('Логин: 3-20 символов (латиница, цифры, _)', 'error');
            return false;
        }
        if (!password || password.length < 6) {
            showToast('Пароль не короче 6 символов', 'error');
            return false;
        }
        try {
            log('Регистрация:', username);
            const hashedPassword = await hashPassword(password);

            const checkRes = await withTimeout(
                supabaseClient.from('app_users').select('id').eq('username', username).maybeSingle(),
                8000
            );
            if (checkRes.error) {
                warn('Ошибка проверки:', checkRes.error);
                showAlert('Ошибка соединения', checkRes.error.message, 'error');
                return false;
            }
            if (checkRes.data) {
                showAlert('Ошибка', 'Пользователь с таким именем уже существует', 'error');
                return false;
            }

            const newUser = {
                username: username,
                password_hash: hashedPassword,
                telegram_id: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null,
                telegram_username: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.username : null,
                banned: false,
                is_admin: username === OWNER_USERNAME,
                created_at: new Date().toISOString()
            };

            const insertRes = await withTimeout(
                supabaseClient.from('app_users').insert(newUser).select().single(),
                8000
            );
            if (insertRes.error) {
                warn('Ошибка вставки:', insertRes.error);
                showAlert('Ошибка БД', insertRes.error.message || 'Не удалось создать аккаунт', 'error');
                return false;
            }
            currentUser = insertRes.data;
            localStorage.setItem('arizona_current_user', JSON.stringify(currentUser));
            log('Регистрация успешна:', currentUser.username);

            try {
                await supabaseClient.from('user_settings').insert({
                    user_id: currentUser.id, theme: 'dark', sfx_enabled: true, admin_password_hash: null
                });
            } catch (e) { warn('user_settings insert failed:', e); }
            try {
                await supabaseClient.from('user_progress').insert({
                    user_id: currentUser.id, tutorial_completed: false, admin_tutorial_completed: false
                });
            } catch (e) { warn('user_progress insert failed:', e); }

            return true;
        } catch (e) {
            warn('Register error:', e);
            showToast('Ошибка соединения: ' + (e.message || 'неизвестно'), 'error');
            return false;
        }
    }

                            '<button class="auth-tab ' + (mode === 'login' ? 'active' : '') + '" id="authTabLogin" type="button">Вход</button>' +

                            '<label>Пароль</label>' +

                        '</button>' +
                        '<p class="auth-error" id="authError">' + errorMsg + '</p>' +
                        '<p class="auth-hint">' + (mode === 'login' ? 'Введите свои данные' : 'Придумайте уникальный логин') + '</p>' +
                    '</div>' +
                '</div>'
            );

            document.getElementById('authThemeToggle').addEventListener('click', function() {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                applyTheme();
                renderAuthForm();
            });

            document.getElementById('authTabLogin').addEventListener('click', function() {
                if (mode !== 'login') { mode = 'login'; isSubmitting = false; initialPrefill = ''; renderAuthForm(); }
            });
            document.getElementById('authTabRegister').addEventListener('click', function() {
                if (mode !== 'register') { mode = 'register'; isSubmitting = false; initialPrefill = ''; renderAuthForm(); }
            });

            const submitBtn = document.getElementById('authSubmitBtn');
            submitBtn.addEventListener('click', async function() {
                if (isSubmitting) return;
                const errEl = document.getElementById('authError');
                errEl.textContent = '';

                const username = (document.getElementById('authUsername').value || '').trim().toLowerCase();
                const password = (document.getElementById('authPassword').value || '').trim();

                if (!username) { errEl.textContent = 'Введите логин'; return; }
                if (!password) { errEl.textContent = 'Введите пароль'; return; }

                isSubmitting = true;
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Загрузка...';

                try {
                    let success = false;
                    if (mode === 'login') success = await loginWithUsername(username, password);
                    else success = await registerUser(username, password);

                    if (success) {
                        container.innerHTML = '';
                        hidePreloaderAndShowApp();
                        return;
                    }
                } catch (e) {
                    warn('Auth handler error:', e);
                    errEl.textContent = 'Ошибка: ' + (e.message || 'неизвестно');
                } finally {
                    isSubmitting = false;
                    if (document.getElementById('authSubmitBtn')) {

    function setupInfiniteScroll() {
        const trigger = document.getElementById('loadMoreTrigger');
        if (!trigger) return;
        if (feedObserver) feedObserver.disconnect();
        feedObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting && !isLoadingFeed && hasMoreAds) loadHomeFeed(false);
            });
        }, { rootMargin: '200px' });
        feedObserver.observe(trigger);
    }

    async function loadHomeFeed(reset) {
        if (reset === undefined) reset = true;
        if (isLoadingFeed) return;
        isLoadingFeed = true;
        if (reset) {
            feedPage = 0;
            homeAds = [];
            hasMoreAds = true;
            document.getElementById('homeFeed').innerHTML = '<div class="loader"></div>';
        }
        try {
            const from = feedPage * FEED_PAGE_SIZE;
            const to = from + FEED_PAGE_SIZE - 1;
            let query = supabaseClient.from('ads').select('*')
                .eq('status', 'approved')
                .eq('hidden', false)
                .order('created_at', { ascending: false })
                .range(from, to);
            if (currentFilterServer) query = query.eq('server', currentFilterServer);
            const res = await withTimeout(query, 8000);
            if (res.error) throw res.error;
            const newAds = res.data || [];
            const validAds = newAds.filter(function(ad) {
                return !ad.expires_at || new Date(ad.expires_at) > new Date();
            });
            homeAds = reset ? validAds : homeAds.concat(validAds);
            if (newAds.length < FEED_PAGE_SIZE) hasMoreAds = false;
            renderHomeFeed();
            feedPage++;
        } catch (e) {
            warn('loadHomeFeed error:', e);
            if (reset) {
                document.getElementById('homeFeed').innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
            } else {
                showToast('Не удалось загрузить ещё объявления', 'error');
            }
        } finally {
            isLoadingFeed = false;
        }
    }

    function renderHomeFeed() {
        const cont = document.getElementById('homeFeed');
        if (!homeAds.length) {
            cont.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>';
            return;
        }
        let html = '';
        homeAds.forEach(function(ad) {
            const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
            const img = firstImg || DEFAULT_AD_IMAGE;
            const modeBadge = ad.mode === 'sell'
                ? '<span class="badge sell">Продажа</span>'
                : '<span class="badge buy">Покупка</span>';
            const cat = ALL_CATEGORIES.find(function(c) { return c.id === ad.category; });
            const catLabel = cat ? cat.label : (ad.category || '');
            let timer = '';
            if (ad.expires_at) {
                const diff = new Date(ad.expires_at) - new Date();
                if (diff > 0) {
                    const total = Math.floor(diff / 1000);
                    const h = Math.floor(total / 3600);
                    const m = Math.floor((total % 3600) / 60);
                    const s = total % 60;
                    timer = '<div class="countdown-timer">⏳ ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '</div>';
                } else {
                    timer = '<div class="countdown-timer">⚠️ Удалено</div>';
                }
            }
            html += (
                '<div class="card ad-card" data-ad-id="' + ad.id + '">' +
                    '<div class="img-container" style="width:86px;height:106px;border-radius:8px;flex-shrink:0;background:var(--border);">' +
                        '<div class="skeleton" style="position:absolute;inset:0;border-radius:8px;"></div>' +
                        '<img src="' + img + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;border-radius:8px;" onload="this.classList.add(\'loaded\');this.previousElementSibling&&this.previousElementSibling.remove();" onerror="this.style.display=\'none\';">' +
                    '</div>' +
                    '<div class="ad-card-info">' +
                        '<div class="ad-card-title">' + (ad.item_name || 'Без названия') + '</div>' +
                        '<div class="ad-card-price">' + formatPrice(ad.price) + '</div>' +
                        '<div class="ad-card-badges">' + modeBadge + '<span class="badge server">' + ad.server + '</span></div>' +
                        '<div class="ad-card-badges"><span class="badge category">' + catLabel + '</span></div>' +
                        '<div class="ad-card-author">— ' + (ad.author_username || ad.author_id) + '</div>' +
                        timer +
                    '</div>' +
                '</div>'
            );
        });
        cont.innerHTML = html;
        const cards = cont.querySelectorAll('.ad-card');
        for (let i = 0; i < cards.length; i++) {
            (function(card) {
                card.addEventListener('click', function() {
                    const id = card.dataset.adId;
                    const ad = homeAds.find(function(a) { return a.id == id; });
                    if (ad) openAdDetail(ad);
                });
            })(cards[i]);
        }
    }

                if (!safety.safe) { showAlert('Ошибка', safety.message); return; }
            }

            const last = localStorage.getItem('arizona_last_submit_time');
            if (last) {
                const diff = Date.now() - parseInt(last);
                if (diff < SUBMIT_COOLDOWN_MS) {
                    showAlert('Подождите', 'Следующая отправка через ' + Math.ceil((SUBMIT_COOLDOWN_MS - diff) / 1000) + ' сек.');
                    return;
                }
            }
            if (!sendFormData.category || !sendFormData.server) {
                showAlert('Ошибка', 'Выберите категорию и сервер');
                return;
            }

            const userAge = Date.now() - new Date(currentUser.created_at).getTime();
            const isNewUser = userAge < 24 * 60 * 60 * 1000;
            if (isNewUser) {
                try {
                    const cRes = await supabaseClient.from('ads')
                        .select('*', { count: 'exact', head: true }).eq('author_id', currentUser.id);
                    if (cRes.count >= NEW_USER_LIMIT) {
                        showAlert('Лимит', 'Новые пользователи могут размещать не более ' + NEW_USER_LIMIT + ' объявлений в первые 24 часа.');
                        return;
                    }
                } catch (e) { warn('limit check failed', e); }
            }

            await submitAd(itemName, priceRaw, description, images, sendFormData);
        };
    }

    async function submitAd(itemName, priceRaw, description, images, formData) {
        const newAd = {
            mode: formData.type,
            category: formData.category,
            item_name: itemName,
            price: parsePriceToNumber(priceRaw),
            description: description,
            images: images,
            server: formData.server,
            author_id: currentUser.id,
            author_username: currentUser.username,
            status: 'pending',
            created_at: new Date().toISOString(),
            expires_at: null,
            hidden: false
        };
        try {
            const res = await withTimeout(supabaseClient.from('ads').insert(newAd), 8000);
            if (res.error) throw res.error;
            localStorage.setItem('arizona_last_submit_time', Date.now().toString());
            playSfx('success');
            showToast('Объявление отправлено на модерацию', 'success');
            document.getElementById('sendName').value = '';
            document.getElementById('sendPrice').value = '';
            document.getElementById('sendDescription').value = '';
            document.getElementById('sendImages').value = '';
            sendFormData = { type: 'sell', category: null, server: null };
            document.getElementById('sendTypeBtn').textContent = 'Продажа';
            document.getElementById('sendCategoryBtn').textContent = 'Выберите категорию';
            document.getElementById('sendServerBtn').textContent = 'Выберите сервер';
            if (currentSection === 'all') loadMyAds();
        } catch (e) {
            warn('submitAd error:', e);
            showAlert('Ошибка', 'Не удалось отправить: ' + (e.message || ''));
        }
    }

                    e.stopPropagation();

                    const ad = myAds.find(function(a) { return a.id == card.dataset.adId; });
                    if (ad) openAdDetail(ad);
                });

            warn('loadMyAds error', e);

    function bindAdminEvents() {
        document.querySelectorAll('[data-approve]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
                await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', btn.dataset.approve);
                await logModeratorAction('approve_ad', btn.dataset.approve);
                loadAdminPanel();
                loadHomeFeed(true);
            });
        });
        document.querySelectorAll('[data-reject]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
                await logModeratorAction('reject_ad', btn.dataset.reject);
                loadAdminPanel();
            });
        });
        document.querySelectorAll('[data-edit-ad]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const ad = pendingAds.find(function(a) { return a.id == btn.dataset.editAd; });
                if (ad) openAdminEditModal(ad);
            });
        });
        document.querySelectorAll('[data-approve-appeal]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                const ap = pendingAppeals.find(function(a) { return a.id == btn.dataset.approveAppeal; });
                if (ap) {
                    const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
                    await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', ap.ad_id);
                }
                await supabaseClient.from('appeals').update({ status: 'approved' }).eq('id', btn.dataset.approveAppeal);
                await logModeratorAction('approve_appeal', btn.dataset.approveAppeal);
                loadAdminPanel();
            });
        });
        document.querySelectorAll('[data-reject-appeal]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                await supabaseClient.from('appeals').update({ status: 'rejected' }).eq('id', btn.dataset.rejectAppeal);
                await logModeratorAction('reject_appeal', btn.dataset.rejectAppeal);
                loadAdminPanel();
            });
        });
        document.querySelectorAll('[data-approve-report]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                const rp = pendingReports.find(function(r) { return r.id == btn.dataset.approveReport; });

        document.querySelectorAll('[data-reject-report]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                await supabaseClient.from('reports').update({ status: 'rejected' }).eq('id', btn.dataset.rejectReport);

                loadAdminPanel();
            });
        });

            btn.addEventListener('click', async function() {
                await supabaseClient.from('user_reports').update({ status: 'rejected' }).eq('id', btn.dataset.ignoreUserReport);
                loadAdminPanel();
            });
        });
        if (isOwner) {
            const bb = document.getElementById('adminBanBtn');
            if (bb) bb.addEventListener('click', function() { adminUserAction('ban'); });
            const ub = document.getElementById('adminUnbanBtn');
            if (ub) ub.addEventListener('click', function() { adminUserAction('unban'); });
            const ma = document.getElementById('adminMakeAdminBtn');
            if (ma) ma.addEventListener('click', function() { adminUserAction('make_admin'); });
            const ra = document.getElementById('adminRemoveAdminBtn');

            if (af) af.addEventListener('click', openAdminAllFunctions);

            if (cf) cf.addEventListener('click', function() {

                    await supabaseClient.from('ads').delete().neq('id', 0);

                    await logModeratorAction('clear_feed', 'all');
                    loadAdminPanel();
                    loadHomeFeed(true);
                });
            });
            document.querySelectorAll('[data-ban-user]').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    await supabaseClient.from('app_users').update({ banned: true }).eq('id', btn.dataset.banUser);
                    await supabaseClient.from('user_reports').update({ status: 'approved' }).eq('reported_user_id', btn.dataset.banUser);

    async function loadModeratorLogsForUser(username) {
        username = username || '';
        let query = supabaseClient.from('moderator_logs').select('*').order('created_at', { ascending: false }).limit(100);
        if (username) query = query.or('details.ilike.%' + username + '%,moderator_username.ilike.%' + username + '%');

        if (res.error) { showAlert('Ошибка', 'Не удалось загрузить журнал'); return; }
        const logs = res.data || [];
        if (!logs.length) { showAlert('Пусто', 'Записей не найдено'); return; }
        const html = logs.map(function(log) {
            const time = new Date(log.created_at).toLocaleString('ru-RU');
            return (
                '<div class="card" style="cursor:default;">' +
                    '<div><strong>' + (log.moderator_username || log.moderator_id) + '</strong> (ID: ' + log.moderator_id + ')</div>' +
                    '<div style="font-size:.8rem;">Действие: ' + log.action + '</div>' +
                    '<div style="font-size:.75rem;color:var(--muted);">Детали: ' + log.details + '</div>' +
                    '<div style="font-size:.7rem;color:var(--muted);">' + time + '</div>' +
                '</div>'
            );
        }).join('');
        showModal('<h3 class="modal-title">📜 Журнал модераторов</h3>' + html);
    }

    async function loadAdminAuditForUser(username) {
        username = username || '';
        let query = supabaseClient.from('moderator_logs').select('*').order('created_at', { ascending: false }).limit(500);
        if (username) query = query.or('details.ilike.%' + username + '%,moderator_username.ilike.%' + username + '%');
        const res = await withTimeout(query, 5000);
        if (res.error) { showAlert('Ошибка', 'Не удалось загрузить аудит'); return; }
        const logs = res.data || [];
        if (!logs.length) { showAlert('Пусто', 'Действий не найдено'); return; }
        const stats = {};
        logs.forEach(function(log) { stats[log.action] = (stats[log.action] || 0) + 1; });
        let html = '<h4 style="margin-bottom:.5rem;">Статистика действий</h4>';
        for (const action in stats) html += '<div style="font-size:.85rem;">' + action + ': ' + stats[action] + '</div>';
        html += '<div class="ornament">◈ ◈ ◈</div>';
        html += logs.slice(0, 20).map(function(log) {
            return '<div style="font-size:.75rem;padding:.3rem 0;">' +
                log.moderator_username + ' — ' + log.action + ' — ' + log.details + ' — ' +
                new Date(log.created_at).toLocaleString('ru-RU') + '</div>';
        }).join('');
        showModal('<h3 class="modal-title">🔍 Аудит модераторов</h3>' + html);
    }

    async function adminUserAction(action) {
        const target = document.getElementById('adminUsernameInput').value.trim();
        if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
        try {
            let q = supabaseClient.from('app_users').select('*');
            if (!isNaN(target)) q = q.eq('id', target);
            else q = q.eq('username', target);
            const res = await withTimeout(q, 5000);
            if (res.error) throw res.error;
            if (!res.data || !res.data.length) { showAlert('Ошибка', 'Пользователь не найден'); return; }
            const user = res.data[0];
            if (action === 'ban') await supabaseClient.from('app_users').update({ banned: true }).eq('id', user.id);
            else if (action === 'unban') await supabaseClient.from('app_users').update({ banned: false }).eq('id', user.id);
            else if (action === 'make_admin') await supabaseClient.from('app_users').update({ is_admin: true }).eq('id', user.id);
            else if (action === 'remove_admin') await supabaseClient.from('app_users').update({ is_admin: false }).eq('id', user.id);
            await logModeratorAction(action, user.id);
            playSfx('success');
            showAlert('Успех', 'Действие выполнено');
            loadAdminPanel();
        } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
    }

    async function openAdDetail(ad) {
        const images = ad.images ? ad.images.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; }) : [];
        const gallery = images.length
            ? '<div class="image-gallery">' + images.map(function(img) { return '<img src="' + img + '" loading="lazy" onerror="this.style.display=\'none\'">'; }).join('') + '</div>'
            : '';
        const cat = ALL_CATEGORIES.find(function(c) { return c.id === ad.category; });
        const catLabel = cat ? cat.label : (ad.category || '');
        const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';

        let statusHtml = '';
        if (ad.status === 'pending') statusHtml = '<div class="empty-state">⏳ На модерации</div>';
        else if (ad.status === 'deleted') {
            statusHtml = '<div class="empty-state">🗑️ Объявление удалено</div>';
            if (ad.author_id === currentUser.id) statusHtml += '<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Подать апелляцию</button>';
        } else {
            statusHtml = (
                '<button class="btn primary w-full mb-8" id="detailContactBtn">💬 Написать автору</button>' +
                '<button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 В корзину</button>' +
                '<button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ Отзывы</button>' +
                (ad.author_id === currentUser.id ? '<button class="btn danger w-full mb-8" id="detailDeleteBtn">🗑 Удалить</button>' : '') +
                '<div class="ornament">◈ ◈ ◈</div>' +
                '<button class="btn secondary w-full mt-8" id="detailReportBtn">🚨 Пожаловаться</button>' +
                '<button class="btn secondary w-full mt-8" id="detailReportUserBtn">👤 Жалоба на автора</button>' +
                '<button class="btn secondary w-full mt-8" id="detailShareBtn">📤 Поделиться</button>'
            );
        }

        const isFav = await checkIfInCart(ad.id);

        const ref = showModal(
            '<h3 class="modal-title">' + ad.item_name + '</h3>' +
            '<div class="ad-card-badges mb-8">' + modeBadge + '<span class="badge server">' + ad.server + '</span><span class="badge category">' + catLabel + '</span></div>' +
            gallery +
            '<div class="ad-card-price" style="font-size:1.8rem;margin-bottom:.6rem;">' + formatPrice(ad.price) + '</div>' +
            '<p style="color:var(--muted);margin-bottom:.9rem;white-space:pre-wrap;word-break:break-word;line-height:1.6;">' + (ad.description || 'Нет описания') + '</p>' +
            '<div style="font-size:.75rem;color:var(--muted);margin-bottom:1rem;font-style:italic;">Автор: <span id="detailAuthorLink" style="cursor:pointer;color:var(--accent);font-weight:600;font-style:normal;">' + (ad.author_username || ad.author_id) + '</span></div>' +
            statusHtml +
            '<div id="detailReviewsSection"></div>' +
            '<div class="ornament" style="margin-top:1.2rem;">◈ ◈ ◈</div>' +
            '<h4 style="margin:.5rem 0 .7rem;font-family:var(--font-display);color:var(--accent-hi);">📌 Похожие</h4>' +
            '<div id="detailSimilarAds"></div>'
        );

        if (ad.status === 'approved') {
            const cb = document.getElementById('detailContactBtn');
            if (cb) cb.addEventListener('click', function() {
                window.open('https://t.me/' + (ad.author_username || ad.author_id), '_blank');
            });
            const cartBtn = document.getElementById('detailCartToggleBtn');
            if (cartBtn) {
                cartBtn.textContent = isFav ? '🛒 Убрать из корзины' : '🛒 В корзину';

                    try {
                        if (isFav) {

                            cartBtn.textContent = '🛒 В корзину';
                            isFav = false;
                        } else {
                            await supabaseClient.from('favorites').insert({ user_id: currentUser.id, ad_id: ad.id });
                            cartBtn.textContent = '🛒 Убрать из корзины';
                            isFav = true;
                        }
                        loadCart();

                });

            if (rb) rb.addEventListener('click', function() { openReviewsModal(ad.id); });
            if (ad.author_id === currentUser.id) {
                const db = document.getElementById('detailDeleteBtn');
                if (db) db.addEventListener('click', async function() {
                    showConfirm('Удаление', 'Удалить объявление?', async function() {
                        await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', ad.id);
                        ref.closeModal();

                    });
                });

                    '<h3 class="modal-title">🚨 Пожаловаться</h3>' +

            });

        const al = document.getElementById('detailAuthorLink');
        if (al) al.addEventListener('click', function() { openProfileModal(ad.author_id); });

        loadSimilarAds(ad.category, ad.id);

    async function checkIfInCart(adId) {
        if (!currentUser) return false;
        try {
            const res = await supabaseClient.from('favorites').select('*').eq('user_id', currentUser.id).eq('ad_id', adId).maybeSingle();
            return !!res.data;
        } catch (e) { return false; }
    }

    async function loadReviews(adId) {
        const cont = document.getElementById('detailReviewsSection');
        if (!cont) return;
        try {
            const res = await withTimeout(
                supabaseClient.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false }),
                5000
            );
            if (res.error) throw res.error;
            const revs = res.data || [];
            if (!revs.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:.85rem;margin-top:1rem;font-style:italic;">⭐ Отзывов пока нет</p>'; return; }
            const avg = revs.reduce(function(s, r) { return s + r.stars; }, 0) / revs.length;
            let html = (
                '<div style="margin-top:1.2rem;">' +
                    '<div style="font-size:1.1rem;font-weight:800;font-family:var(--font-display);color:var(--accent);">⭐ ' + avg.toFixed(1) + ' <span style="color:var(--muted);font-size:.85rem;font-weight:500;">(' + revs.length + ')</span></div>' +
                    '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>' +
                '</div>'
            );
            revs.forEach(function(r) {
                const canEdit = r.author_id === currentUser.id && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                const canDelete = r.author_id === currentUser.id || isOwner;
                const isSeller = r.author_id === currentUser.id;
                html += (
                    '<div class="review-item">' +
                        '<div style="font-weight:600;font-size:.9rem;">' + (r.author_username || r.author_id) +
                            ' <span style="color:var(--accent);">' + '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars) + '</span>' +
                        '</div>' +
                        '<div style="font-size:.7rem;color:var(--muted);">' + new Date(r.created_at).toLocaleDateString('ru-RU') + '</div>' +
                        '<p style="font-size:.82rem;margin:.3rem 0;white-space:pre-wrap;word-break:break-word;">' + (r.text || '') + '</p>' +
                        (r.media_links ? '<div style="font-size:.7rem;color:var(--accent);word-break:break-all;">' + r.media_links + '</div>' : '')
                );
                if (r.reply_text) {
                    html += '<div style="margin-left:1rem;padding:.5rem;background:var(--bg-deep);border-radius:6px;margin-top:.4rem;border-left:2px solid var(--accent);"><strong style="font-size:.75rem;color:var(--accent-hi);">Ответ продавца:</strong><div style="font-size:.8rem;">' + r.reply_text + '</div></div>';
                } else if (isSeller || isOwner) {
                    html += '<button class="btn secondary mt-8" data-reply-review="' + r.id + '" style="min-height:34px;padding:.35rem .8rem;font-size:.72rem;">💬 Ответить</button>';
                }
                if (canEdit || canDelete) {
                    html += '<div class="flex-between gap-8 mt-8" style="justify-content:flex-start;">';
                    if (canEdit) html += '<button class="btn secondary" data-edit-review="' + r.id + '" style="min-height:34px;padding:.35rem .8rem;font-size:.72rem;">✏️</button>';
                    if (canDelete) html += '<button class="btn danger" data-del-review="' + r.id + '" style="min-height:34px;padding:.35rem .8rem;font-size:.72rem;">🗑</button>';
                    html += '</div>';
                }
                html += '</div>';
            });
            cont.innerHTML = html;
            cont.querySelectorAll('[data-edit-review]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const r = revs.find(function(x) { return x.id == btn.dataset.editReview; });
                    if (r) openEditReviewModal(r);
                });
            });
            cont.querySelectorAll('[data-del-review]').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    await supabaseClient.from('reviews').delete().eq('id', btn.dataset.delReview);
                    loadReviews(adId);
                });
            });
            cont.querySelectorAll('[data-reply-review]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const r = revs.find(function(x) { return x.id == btn.dataset.replyReview; });
                    if (r) openReplyModal(r);
                });
            });
        } catch (e) {
            warn('loadReviews error', e);
            cont.innerHTML = '<p style="color:var(--muted);font-size:.85rem;">⚠️ Не удалось загрузить отзывы</p>';
        }
    }

    async function loadSimilarAds(category, currentId) {
        const cont = document.getElementById('detailSimilarAds');
        if (!cont) return;
        try {
            const res = await withTimeout(
                supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false)
                    .eq('category', category).neq('id', currentId).limit(3).order('created_at', { ascending: false }),
                5000
            );

            if (!similar.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:.85rem;font-style:italic;">Похожих нет</p>'; return; }
            cont.innerHTML = similar.map(function(ad) {
                return '<div class="card" data-sim="' + ad.id + '" style="cursor:pointer;margin-bottom:.5rem;padding:.75rem;">' +
                    '<span style="font-weight:700;">' + ad.item_name + '</span> • ' +

                '</div>';
            }).join('');
            cont.querySelectorAll('[data-sim]').forEach(function(el) {
                el.addEventListener('click', function() {

    function openReviewsModal(adId) {
        const ref = showModal(
            '<h3 class="modal-title">⭐ Оставить отзыв</h3>' +
            '<div class="form-group"><label>Оценка</label>' +
                '<div class="star-rating" id="reviewStars">' +
                    [1, 2, 3, 4, 5].map(function(i) { return '<span data-star="' + i + '">☆</span>'; }).join('') +
                '</div>' +
            '</div>' +
            '<div class="form-group"><label>Ссылки на медиа (опционально)</label><input type="text" id="reviewMedia" placeholder="https://..."></div>' +
            '<div class="form-group"><label>Текст</label><textarea id="reviewText" placeholder="Поделитесь впечатлением..."></textarea></div>' +
            '<button class="btn primary w-full" id="reviewSubmitBtn">Отправить</button>'
        );
        let selected = 0;
        const stars = document.getElementById('reviewStars');
        stars.querySelectorAll('span').forEach(function(s) {
            s.addEventListener('click', function() {
                selected = parseInt(s.dataset.star);
                updateStars(stars, selected);
            });
        });
        document.getElementById('reviewSubmitBtn').addEventListener('click', async function() {
            if (!selected) { showAlert('Ошибка', 'Выберите оценку'); return; }
            const text = document.getElementById('reviewText').value.trim();
            const forbidden = checkForbiddenWords(text);
            if (forbidden) { showAlert('Ошибка', forbidden); return; }
            const media = document.getElementById('reviewMedia').value.trim();
            const lc = checkLinksString(media);
            if (!lc.valid) { showAlert('Ошибка', lc.message); return; }
            for (let i = 0; i < lc.links.length; i++) {
                const safety = await checkLinkSafety(lc.links[i]);
                if (!safety.safe) { showAlert('Ошибка', safety.message); return; }
            }
            try {
                await supabaseClient.from('reviews').insert({
                    ad_id: adId, author_id: currentUser.id, author_username: currentUser.username,
                    stars: selected, text: text, media_links: media, created_at: new Date().toISOString()
                });
                playSfx('success');
                showAlert('Успех', 'Отзыв отправлен');
                ref.closeModal();
                loadReviews(adId);
            } catch (e) { showAlert('Ошибка', 'Не удалось отправить отзыв'); }
        });
    }

    function updateStars(container, selected) {
        container.querySelectorAll('span').forEach(function(s) {
            const v = parseInt(s.dataset.star);
            s.textContent = v <= selected ? '★' : '☆';
            s.classList.toggle('active', v <= selected);
        });
    }

        const ref = showModal(
