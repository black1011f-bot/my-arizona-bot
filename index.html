<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс (Full Production)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ И ТЕМЫ ========== */
        :root {
            --bg: #F7F7F9;
            --card: #FFFFFF;
            --border: #E4E4E8;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #111115;
            --muted: #7E7E85;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --radius: 14px;
            --btn-min-height: 46px;
            --container-width: 480px;
            --nav-height: 64px;
            --header-height: 58px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #121214;
            --card: #1C1C1E;
            --border: #2C2C2E;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #F2F2F7;
            --muted: #8E8E93;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width); margin: 0 auto; padding: 0 12px;
            padding-top: calc(var(--header-height) + 12px);
            padding-bottom: calc(var(--nav-height) + 24px);
            transition: max-width 0.3s;
        }
        @media (min-width:768px) { :root { --container-width:720px; } .ads-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; } .ad-card { width:100%; } }
        @media (min-width:1024px) { :root { --container-width:1200px; } .ads-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width:420px) {
            .header-title { font-size:16px; } .header-logo { width:32px; height:32px; }
            .nav-item .nav-icon { font-size:20px; } .nav-item { font-size:9px; padding:2px 4px; min-height:38px; }
            .ad-card-img { width:70px; height:90px; } .ad-card-title { font-size:14px; } .ad-card-price { font-size:15px; }
            .card { padding:12px; } .modal { padding:16px; max-width:98%; } .category-grid { grid-template-columns:repeat(2,1fr); }
            .grid-tiles { grid-template-columns:repeat(2,1fr); } .btn { padding:10px 16px; font-size:13px; min-height:40px; }
            .form-group input, .form-group select, .form-group textarea { padding:10px 12px; font-size:14px; }
        }

        /* ХЕДЕР */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 8px 12px; height: var(--header-height); gap: 10px;
            transition: background 0.3s, border-color 0.3s; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .header-logo {
            width: 32px; height: 32px; border-radius: 8px; overflow: hidden;
            flex-shrink: 0; cursor: pointer; transition: transform 0.2s; border: 1px solid var(--border);
        }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 800; font-size: 17px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; cursor: pointer; }
        .header-search input {
            width: 100%; padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--card); color: var(--text); font-size: 14px; outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s; pointer-events: none;
        }
        .theme-toggle { background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; transition: transform 0.2s; flex-shrink: 0; }
        .theme-toggle:active { transform: scale(0.9); }

        /* НАВИГАЦИЯ */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            height: var(--nav-height); padding-bottom: env(safe-area-inset-bottom);
            transition: background 0.3s, border-color 0.3s;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; background: none; border: none; color: var(--muted); font-size: 10px;
            font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 10px;
            transition: color 0.3s, transform 0.2s, background 0.2s; flex: 1; max-width: 80px; min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0,91,255,0.08); }
        .nav-item:active { transform: scale(0.92); }

        /* СЕКЦИИ */
        .section { display: none; opacity: 0; transform: translateY(10px); transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* КАРТОЧКИ */
        .card {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s, opacity 0.3s; cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .card.inactive-card { background: rgba(128,128,128,0.1) !important; opacity: 0.7; }
        [data-theme="dark"] .card.inactive-card { background: rgba(255,255,255,0.03) !important; opacity: 0.6; }
        .ad-card { display: flex; gap: 12px; align-items: flex-start; }
        .ad-card-img { width: 85px; height: 110px; border-radius: 10px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 6px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--border); color: var(--text); white-space: nowrap; }
        .badge.sell { background: #34C759; color: #fff; }
        .badge.buy { background: #FF9500; color: #fff; }
        .badge.server { background: var(--gold); color: #111; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #FFCC00; color: #111; }
        .badge.status-deleted { background: #FF3B30; color: #fff; }
        .badge.status-approved { background: #34C759; color: #fff; }
        .ad-card-author { font-size: 11px; color: var(--muted); }

        /* КНОПКИ */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 12px 20px; border-radius: var(--radius); border: none; background: var(--accent);
            color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, background 0.3s; touch-action: manipulation; min-height: var(--btn-min-height);
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #FF3B30; color: #fff; }
        .btn.gold { background: var(--gold); color: #111; }
        .btn.success { background: #34C759; color: #fff; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn.w-full { width: 100%; }
        .btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* МОДАЛКИ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65); z-index: 200; display: flex; align-items: center;
            justify-content: center; padding: 16px; opacity: 0; transition: opacity 0.25s ease;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.25); width: 100%; max-width: 520px; max-height: 85vh;
            overflow-y: auto; padding: 22px; position: relative; transform: translateY(20px);
            transition: transform 0.25s ease, background 0.3s, border-color 0.3s;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 14px; right: 14px; background: none; border: none;
            font-size: 24px; cursor: pointer; color: var(--muted); padding: 4px; line-height: 1; z-index: 5; transition: transform 0.2s;
        }
        .modal-close:active { transform: scale(0.9); }
        .modal-title { font-weight: 800; font-size: 19px; margin-bottom: 16px; padding-right: 30px; }

        /* ФОРМЫ */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 14px; outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s; font-family: var(--font);
        }
        .form-group textarea { min-height: 90px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }

        /* ИГРА БАРЫГА */
        .game-click-area {
            width: 220px; height: 220px; margin: 0 auto 20px; cursor: pointer;
            border-radius: 50%; overflow: hidden; border: 5px solid var(--accent);
            box-shadow: 0 0 30px rgba(0,91,255,0.3); transition: transform 0.1s, border-color 0.3s;
            user-select: none; -webkit-user-select: none; touch-action: manipulation; background: var(--card);
        }
        .game-click-area:active { transform: scale(0.93); }
        .game-click-area img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .upgrade-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px; border: 1px solid var(--border); border-radius: var(--radius);
            margin-bottom: 10px; background: var(--card); transition: background 0.3s, border-color 0.3s;
        }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: 700; font-size: 14px; }
        .upgrade-cost { font-size: 12px; color: var(--muted); margin-top: 2px; }

        /* КАТЕГОРИИ И ПЛИТКИ */
        .grid-tiles { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; }
        .grid-tile {
            padding: 20px 14px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--card); text-align: center; cursor: pointer; font-weight: 700;
            font-size: 14px; transition: transform 0.2s, border-color 0.3s, background 0.3s, box-shadow 0.2s;
            box-shadow: var(--shadow);
        }
        .grid-tile:active { transform: scale(0.95); }
        .grid-tile .tile-icon { font-size: 36px; display: block; margin-bottom: 10px; }

        /* СЕРВЕРА В ХЕДЕРЕ ЛЕНТЫ */
        #homeServers { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-bottom: 14px; }
        #homeServers::-webkit-scrollbar { display: none; }
        #homeServers .badge { cursor: pointer; padding: 8px 14px; flex-shrink: 0; font-size: 12px; }
        #homeServers .badge.active { background: var(--accent); color: #fff; }
        #homeServers .badge:not(.active) { background: var(--card); border: 1px solid var(--border); color: var(--text); }

        /* УТИЛИТЫ */
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; }
        .w-full { width: 100%; } .text-center { text-align: center; }
        .loader { border: 3px solid var(--border); border-top: 3px solid var(--accent); border-radius: 50%; width: 34px; height: 34px; animation: spin 0.8s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        .empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-weight: 500; font-size: 15px; }

        /* ТОСТЫ */
        .toast-container { position: fixed; top: 72px; right: 12px; z-index: 999; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
        .toast { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 18px; box-shadow: var(--shadow); font-size: 13px; font-weight: 600; color: var(--text); animation: slideIn 0.3s ease; }
        .toast.success { border-left: 4px solid #34C759; }
        .toast.error { border-left: 4px solid #FF3B30; }
        .toast.info { border-left: 4px solid var(--accent); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* МОДАЛКА ЛОГОТИПА И КОНТАКТОВ */
        .contact-link-card { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); margin-bottom: 10px; text-decoration: none; color: var(--text); font-weight: 600; transition: background 0.2s; }
        .contact-link-card:active { background: var(--border); }
        .contact-link-card span { color: var(--accent); font-size: 14px; }
    </style>
</head>
<body>

    <!-- ХЕДЕР -->
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn" title="Контакты и ресурсы">

        <button class="theme-toggle" id="themeToggleBtn" title="Сменить тему">🌓</button>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <main class="container" id="mainContainer">

        <!-- ГЛАВНАЯ ЛЕНТА -->
        <section class="section active" id="section-home">
            <div id="homeServers"></div>
            <div class="ads-grid" id="homeFeed"></div>

        <!-- КОРЗИНА -->
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:14px;font-weight:800;font-size:20px;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <!-- ОТПРАВКА ОБЪЯВЛЕНИЯ -->
        <section class="section" id="section-send">
            <h2 style="margin-bottom:14px;font-weight:800;font-size:20px;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group"><label>Тип сделки</label><select id="sendType"><option value="sell">Продажа</option><option value="buy">Покупка</option></select></div>
                <div class="form-group"><label>Категория</label><select id="sendCategory"></select></div>
                <div class="form-group"><label>Название</label><input type="text" id="sendName" placeholder="Введите название предмета"></div>
                <div class="form-group"><label>Цена</label><input type="text" id="sendPrice" placeholder="Например: 5к или 1500000" inputmode="text"></div>
                <div class="form-group"><label>Описание</label><textarea id="sendDescription" placeholder="Подробное описание товара"></textarea></div>
                <div class="form-group"><label>Скриншоты (ссылки через запятую, до 20, необязательно)</label><input type="text" id="sendImages" placeholder="https://..."><div style="margin-top:6px;font-size:11px;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div></div>
                <div class="form-group"><label>Сервер</label><select id="sendServer"></select></div>
                <button class="btn w-full mt-8" id="sendSubmitBtn">Отправить объявление</button>
            </div>
            <h3 style="margin:20px 0 10px;font-weight:800;font-size:18px;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>

        <!-- АДМИН-ПАНЕЛЬ -->
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:14px;font-weight:800;font-size:20px;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <!-- ВСЕ РАЗДЕЛЫ -->
        <section class="section" id="section-all">
            <h2 style="margin-bottom:14px;font-weight:800;font-size:20px;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <!-- НАВИГАЦИЯ -->
    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Разделы</span></button>
    </nav>

    <div id="tutorialContainer"></div>
    <div id="authContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.08;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.12);
                } catch (e) {}
            }

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInputHandler(e) {
                const input = e.target;
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

            function isAllowedLink(url) {

                } catch (e) { return false; }
            }

            function checkLinksString(str) {
                if (!str.trim()) return { valid: true, links: [] };
                const links = str.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
                for (let link of links) {
                    if (!isAllowedLink(link)) return { valid: false, message: `Ссылка ${link} не разрешена` };
                }
                return { valid: true, links };
            }

            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

                    } catch (e) {
                        errEl.textContent = 'Ошибка сброса пароля';

            function showRecreateAccountModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Пересоздание аккаунта</h3>
                    <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Если ваш аккаунт был утерян или заблокирован, вы можете пересоздать его заново с вашим логином.</p>
                    <div class="form-group"><label>Логин</label><input type="text" id="recreateUsername" placeholder="Ваш логин"></div>
                    <div class="form-group"><label>Новый пароль</label><input type="password" id="recreatePass" placeholder="Пароль"></div>
                    <button class="btn danger w-full" id="doRecreateBtn">Пересоздать аккаунт</button>
                    <p id="recreateErr" style="color:#FF3B30;font-size:12px;margin-top:8px;"></p>
                `);
                document.getElementById('doRecreateBtn').addEventListener('click', async () => {
                    const uname = document.getElementById('recreateUsername').value.trim().toLowerCase();
                    const pass = document.getElementById('recreatePass').value.trim();
                    const errEl = document.getElementById('recreateErr');
                    if (!uname || pass.length < 4) {
                        errEl.textContent = 'Заполните все поля';
                        return;
                    }
                    try {
                        const newHash = await hashPassword(pass);
                        // Удаляем старый если есть и создаем заново
                        await supabaseClient.from('app_users').delete().eq('username', uname);
                        const newUser = {
                            username: uname,
                            password_hash: newHash,
                            telegram_id: currentUser.id || null,
                            telegram_username: currentUser.username || null,
                            banned: false,
                            is_admin: uname === OWNER_USERNAME,
                            created_at: new Date().toISOString()
                        };
                        const { data, error } = await supabaseClient.from('app_users').insert(newUser).select().single();
                        if (error) throw error;
                        currentAuthUser = data;
                        localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                        playSfx('success');
                        document.getElementById('modalOverlay').remove();
                        location.reload();
                    } catch (e) {
                        errEl.textContent = 'Ошибка пересоздания аккаунта';
                    }
                });
            }

            // =========================================================================
            // 6. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
            // =========================================================================
            async function initApp(isFirstLogin = false) {
                if (!currentAuthUser) { showAuthScreen(); return; }
                isAdmin = currentAuthUser.is_admin || (currentAuthUser.username === OWNER_USERNAME);
                isOwner = currentAuthUser.username === OWNER_USERNAME;
                const adminBtn = document.getElementById('adminNavBtn');
                if (isAdmin) adminBtn.classList.remove('hidden');
                else adminBtn.classList.add('hidden');

                await loadSearchHistory();
                switchSection('home');
            }

            async function loadSearchHistory() {
                if (!currentAuthUser) return;
                try {
                    const { data } = await supabaseClient.from('search_history').select('query').eq('user_id', currentAuthUser.id).order('created_at', { ascending: false }).limit(10);
                    searchHistory = data ? data.map(i => i.query) : [];
                } catch (e) { searchHistory = []; }
            }

            // =========================================================================
            // 7. НАВИГАЦИЯ ПО РАЗДЕЛАМ
            // =========================================================================
            function switchSection(section) {
                currentSection = section;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                const target = document.getElementById('section-' + section);
                if (target) target.classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
                if (navBtn) navBtn.classList.add('active');

                if (section === 'home') loadHomeFeed();
                if (section === 'cart') loadCart();
                if (section === 'send') { populateSendForm(); loadMyAds(); }
                if (section === 'admin') loadAdminPanel();
                if (section === 'all') loadAllTiles();
                playSfx('click');
            }

            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = btn.dataset.section;
                    if (sec === 'admin' && !isAdmin) return;
                    switchSection(sec);
                });
            });

            document.getElementById('themeToggleBtn').addEventListener('click', async () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                applyTheme();
                if (currentAuthUser) {
                    await supabaseClient.from('user_settings').update({ theme: currentTheme }).eq('user_id', currentAuthUser.id);
                }
                playSfx('click');
            });

            document.getElementById('headerSearchTrigger').addEventListener('click', () => openSearchModal());
            document.getElementById('logoBtn').addEventListener('click', () => { currentFilterServer = null; switchSection('home'); });

            // =========================================================================
            // 8. ГЛАВНАЯ ЛЕНТА (С фильтром серверов от Phoenix до Mobile III)
            // =========================================================================
            let feedPage = 0;
            const FEED_PAGE_SIZE = 20;

            async function loadHomeFeed(reset = true) {
                if (reset) feedPage = 0;
                const serverContainer = document.getElementById('homeServers');
                serverContainer.innerHTML = `
                    <button class="badge ${!currentFilterServer ? 'active' : ''}" data-server-filter="">Все сервера</button>
                    ${ARIZONA_SERVERS.map(s => `<button class="badge ${currentFilterServer === s ? 'active' : ''}" data-server-filter="${s}">${s}</button>`).join('')}
                `;
                serverContainer.querySelectorAll('[data-server-filter]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentFilterServer = btn.dataset.serverFilter || null;
                        loadHomeFeed();
                    });
                });

                const container = document.getElementById('homeFeed');
                if (reset) container.innerHTML = '<div class="loader"></div>';

                try {
                    let query = supabaseClient.from('ads').select('*').eq('status', 'approved').order('created_at', { ascending: false }).range(feedPage * FEED_PAGE_SIZE, (feedPage + 1) * FEED_PAGE_SIZE - 1);
                    if (currentFilterServer) query = query.eq('server', currentFilterServer);
                    const { data, error } = await withTimeout(query, 8000);
                    if (error) throw error;
                    const newAds = data || [];
                    if (reset) homeAds = newAds;
                    else homeAds = [...homeAds, ...newAds];
                    renderHomeFeed();
                    feedPage++;
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки ленты.</div>';
                }
            }

            function renderHomeFeed() {
                const container = document.getElementById('homeFeed');
                if (!homeAds.length) {
                    container.innerHTML = '<div class="empty-state">📭 На этом сервере пока нет объявлений</div>';
                    return;
                }
                let html = '';
                homeAds.forEach(ad => {
                    const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                    const imgSrc = firstImg || DEFAULT_AD_IMAGE;
                    const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                    const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                    html += `
                        <div class="card ad-card" data-ad-id="${ad.id}">
                            <img class="ad-card-img" src="${imgSrc}" onerror="this.src='${DEFAULT_AD_IMAGE}'" alt="">
                            <div class="ad-card-info">
                                <div class="ad-card-title">${ad.item_name || 'Без названия'}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)}</div>
                                <div class="ad-card-badges">
                                    ${modeBadge}
                                    <span class="badge server">${ad.server}</span>
                                    <span class="badge category">${catLabel}</span>
                                </div>
                                <div class="ad-card-author">Автор: ${ad.author_username || ad.author_id}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                container.querySelectorAll('.ad-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.adId;
                        const ad = homeAds.find(a => a.id == id);
                        if (ad) openAdDetail(ad);
                    });
                });
            }

                showModal(`
                    <h3 class="modal-title">${ad.item_name}</h3>
                    ${imgHtml}
                    <div style="margin:12px 0;">
                        <p style="font-size:18px;font-weight:800;color:var(--accent);margin-bottom:6px;">Цена: ${formatPrice(ad.price)}</p>
                        <p style="font-size:14px;color:var(--muted);margin-bottom:6px;">Сервер: <strong>${ad.server}</strong></p>
                        <p style="font-size:14px;color:var(--muted);margin-bottom:12px;">Автор: @${ad.author_username || ad.author_id}</p>

                    </div>

                document.getElementById('addToCartModalBtn').addEventListener('click', async () => {
                    if (!currentAuthUser) return;
                    await supabaseClient.from('favorites').insert({ user_id: currentAuthUser.id, ad_id: ad.id });
                    playSfx('success');
                    showToast('Добавлено в корзину', 'success');
                    document.getElementById('modalOverlay').remove();
                });

                document.getElementById('reportAdModalBtn').addEventListener('click', () => {
                    document.getElementById('modalOverlay').remove();

            function openReportModal(adId) {
                showModal(`
                    <h3 class="modal-title">🚨 Жалоба на объявление</h3>
                    <div class="form-group"><label>Причина</label><select id="reportReason"><option>Скам / Мошенничество</option><option>Неверная цена</option><option>Запрещенный товар</option><option>Другое</option></select></div>
                    <button class="btn danger w-full" id="sendReportBtn">Отправить жалобу</button>
                `);
                document.getElementById('sendReportBtn').addEventListener('click', async () => {
                    const reason = document.getElementById('reportReason').value;
                    await supabaseClient.from('reports').insert({
                        ad_id: adId, reporter_id: currentAuthUser.id, reporter_username: currentAuthUser.username, reason, status: 'pending', created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    showAlert('Успех', 'Жалоба отправлена модераторам');
                    document.getElementById('modalOverlay').remove();

            async function loadCart() {
                const container = document.getElementById('cartList');
                if (!currentAuthUser) { container.innerHTML = '<div class="empty-state">🛒 Корзина пуста</div>'; return; }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const { data: favs } = await supabaseClient.from('favorites').select('ad_id').eq('user_id', currentAuthUser.id);
                    const adIds = favs ? favs.map(f => f.ad_id) : [];
                    if (!adIds.length) { container.innerHTML = '<div class="empty-state">🛒 Корзина пуста</div>'; return; }
                    const { data: ads } = await supabaseClient.from('ads').select('*').in('id', adIds).order('created_at', { ascending: false });
                    cartAds = ads || [];
                    if (!cartAds.length) { container.innerHTML = '<div class="empty-state">🛒 Корзина пуста</div>'; return; }
                    
                    let html = '';
                    cartAds.forEach(ad => {
                        const isDeleted = ad.status === 'deleted';
                        const statusBadge = isDeleted ? '<span class="badge status-deleted">🔴 Удалено</span>' : '<span class="badge status-approved">🟢 Активно</span>';
                        html += `
                            <div class="card ${isDeleted ? 'inactive-card' : ''}" data-ad-id="${ad.id}">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:13px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                        <div style="margin-top:4px;">${statusBadge}</div>
                                    </div>
                                    <button class="btn danger" data-remove-cart="${ad.id}">${icon('delete')} Удалить</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-remove-cart]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            await supabaseClient.from('favorites').delete().eq('user_id', currentAuthUser.id).eq('ad_id', btn.dataset.removeCart);
                            playSfx('click');
                            loadCart();
                        });
                    });
                    container.querySelectorAll('.card[data-ad-id]').forEach(card => {
                        card.addEventListener('click', (e) => {
                            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                            const ad = cartAds.find(a => a.id == card.dataset.adId);
                            if (ad) openAdDetail(ad);
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки корзины</div>';
                }
            }

            // =========================================================================
            // 10. ОТПРАВКА ОБЪЯВЛЕНИЙ
            // =========================================================================
            function populateSendForm() {
                const catSelect = document.getElementById('sendCategory');
                catSelect.innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                const serverSelect = document.getElementById('sendServer');
                serverSelect.innerHTML = ARIZONA_SERVERS.map(s => `<option value="${s}">${s}</option>`).join('');
                const priceInput = document.getElementById('sendPrice');
                priceInput.removeEventListener('input', formatPriceInputHandler);
                priceInput.addEventListener('input', formatPriceInputHandler);
            }

            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!currentAuthUser) return;
                const mode = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const itemName = document.getElementById('sendName').value.trim();
                const priceRaw = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const images = document.getElementById('sendImages').value.trim();
                const server = document.getElementById('sendServer').value;

                if (!itemName || !priceRaw || !description) {
                    showAlert('Ошибка', 'Заполните все обязательные поля');
                    return;
                }
                const linkCheck = checkLinksString(images);
                if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }

                const newAd = {
                    mode, category, item_name: itemName, price: parsePriceToNumber(priceRaw),
                    description, images, server, author_id: currentAuthUser.id,
                    author_username: currentAuthUser.username, status: 'pending', created_at: new Date().toISOString()
                };

                try {
                    await supabaseClient.from('ads').insert(newAd);
                    playSfx('success');
                    showToast('Объявление отправлено на модерацию', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось отправить объявление');
                }
            });

            async function loadMyAds() {
                const container = document.getElementById('myAdsList');
                if (!currentAuthUser) { container.innerHTML = '<div class="empty-state">Нет объявлений</div>'; return; }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const { data } = await supabaseClient.from('ads').select('*').eq('author_id', currentAuthUser.id).order('created_at', { ascending: false });
                    myAds = data || [];
                    if (!myAds.length) { container.innerHTML = '<div class="empty-state">У вас нет объявлений</div>'; return; }
                    let html = '';
                    myAds.forEach(ad => {
                        let statusBadge = ad.status === 'pending' ? '<span class="badge status-pending">🟡 На модерации</span>' : (ad.status === 'deleted' ? '<span class="badge status-deleted">🔴 Удалено</span>' : '<span class="badge status-approved">🟢 Активно</span>');
                        html += `
                            <div class="card ${ad.status==='deleted'?'inactive-card':''}">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>

                                </div>
                            </div>

                            e.stopPropagation();
                            showConfirm('Удаление', 'Удалить объявление навсегда?', async () => {
                                await supabaseClient.from('ads').delete().eq('id', btn.dataset.permanentDelete);

                        if (type === 'click' && gameState.money >= gameState.clickCost) {
                            gameState.money -= gameState.clickCost;
                            gameState.clickPower += 1;
                            gameState.clickCost = Math.floor(gameState.clickCost * 1.5);
                            document.getElementById('costClick').textContent = 'Цена: ' + formatPrice(gameState.clickCost) + ' $';
                            playSfx('buy');
                        } else if (type === 'auto' && gameState.money >= gameState.autoCost) {
                            gameState.money -= gameState.autoCost;
                            gameState.autoIncome += 5;
                            gameState.autoCost = Math.floor(gameState.autoCost * 1.6);
                            document.getElementById('costAuto').textContent = 'Цена: ' + formatPrice(gameState.autoCost) + ' $';
                            playSfx('buy');
                        } else if (type === 'pro' && gameState.money >= gameState.proCost) {
                            gameState.money -= gameState.proCost;
                            gameState.autoIncome += 25;
                            gameState.proCost = Math.floor(gameState.proCost * 1.65);
                            document.getElementById('costPro').textContent = 'Цена: ' + formatPrice(gameState.proCost) + ' $';
                            playSfx('buy');
                        } else if (type === 'shop' && gameState.money >= gameState.shopCost) {
                            gameState.money -= gameState.shopCost;
                            gameState.autoIncome += 120;
                            gameState.shopCost = Math.floor(gameState.shopCost * 1.7);
                            document.getElementById('costShop').textContent = 'Цена: ' + formatPrice(gameState.shopCost) + ' $';
                            playSfx('buy');
                        }
                        document.getElementById('gameMoneyDisplay').textContent = formatPrice(gameState.money) + ' $';
                    });
                });
            }

            // Автодоход для игры Барыга
            setInterval(() => {
                if (gameState.autoIncome > 0) {
                    gameState.money += Math.floor(gameState.autoIncome / 2);
                    const disp = document.getElementById('gameMoneyDisplay');
                    if (disp) disp.textContent = formatPrice(gameState.money) + ' $';
                }
            }, 500);

            function openSettingsModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Настройки аккаунта</h3>
                    <div style="margin-bottom:16px;">
                        <p style="font-size:14px;margin-bottom:6px;">Текущий пользователь: <strong>@${currentAuthUser ? currentAuthUser.username : 'Гость'}</strong></p>
                        <p style="font-size:14px;margin-bottom:12px;">Статус: <strong>${isAdmin ? 'Администратор' : 'Игрок'}</strong></p>
                    </div>
                    <button class="btn danger w-full mb-8" id="logoutBtn">🚪 Выйти из аккаунта</button>
                    <button class="btn secondary w-full" id="resetPassFromSettingsBtn">🔄 Сменить пароль</button>
                `);
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('arizona_current_user');
                    location.reload();
                });
                document.getElementById('resetPassFromSettingsBtn').addEventListener('click', () => {
                    document.getElementById('modalOverlay').remove();
                    showPasswordResetModal();
                });
            }

            // =========================================================================
            // 12. АДМИН-ПАНЕЛЬ
            // =========================================================================
            async function loadAdminPanel() {
                const container = document.getElementById('adminPanelContent');
                if (!isAdmin) { container.innerHTML = '<div class="empty-state">Нет доступа</div>'; return; }
                container.innerHTML = '<div class="loader"></div>';

                try {
                    const [pendingRes, appealsRes, reportsRes] = await Promise.all([
                        supabaseClient.from('ads').select('*').eq('status', 'pending').order('created_at', { ascending: false }),
                        supabaseClient.from('appeals').select('*').eq('status', 'pending').order('created_at', { ascending: false }),
                        supabaseClient.from('reports').select('*').eq('status', 'pending').order('created_at', { ascending: false })
                    ]);
                    pendingAds = pendingRes.data || [];
                    pendingAppeals = appealsRes.data || [];
                    pendingReports = reportsRes.data || [];

                    let html = '<h3>📋 Объявления на модерации</h3>';
                    if (!pendingAds.length) html += '<div class="empty-state">Нет объявлений на проверке</div>';
                    else pendingAds.forEach(ad => {
                        html += `
                            <div class="card">
                                <div style="font-weight:700;">${ad.item_name}</div>
                                <div style="font-size:12px;color:var(--muted);">${ad.server} • @${ad.author_username || ad.author_id} • ${formatPrice(ad.price)}</div>
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve="${ad.id}">${icon('approve')} Одобрить</button>
                                    <button class="btn danger" data-reject="${ad.id}">${icon('reject')} Отклонить</button>
                                </div>
                            </div>
                        `;
                    });

                    html += '<h3 style="margin-top:20px;">📨 Апелляции</h3>';
                    if (!pendingAppeals.length) html += '<div class="empty-state">Нет апелляций</div>';
                    else pendingAppeals.forEach(app => {
                        html += `
                            <div class="card">
                                <div style="font-weight:700;">Объявление ID: ${app.ad_id}</div>
                                <div style="font-size:12px;color:var(--muted);">Причина: ${app.reason}</div>
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve-appeal="${app.id}">${icon('approve')} Одобрить</button>
                                    <button class="btn danger" data-reject-appeal="${app.id}">${icon('reject')} Отклонить</button>
                                </div>
                            </div>
                        `;
                    });

                    if (isOwner) {
                        html += `
                            <h3 style="margin-top:20px;">👤 Управление пользователями</h3>
                            <div class="form-group"><input type="text" id="targetUsernameInput" placeholder="Введите username игрока"></div>
                            <div class="flex-between gap-8 mb-8">
                                <button class="btn danger w-full" id="banUserBtn">${icon('ban')} Забанить</button>
                                <button class="btn success w-full" id="unbanUserBtn">${icon('unban')} Разбанить</button>
                            </div>
                            <button class="btn danger w-full mt-12" id="clearAllFeedBtn">${icon('delete')} Очистить всю ленту</button>
                        `;
                    }

                    container.innerHTML = html;
                    bindAdminEvents();
                } catch (e) {
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки админ-панели</div>';
                }
            }

            function bindAdminEvents() {
                document.querySelectorAll('[data-approve]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('ads').update({ status: 'approved' }).eq('id', btn.dataset.approve);
                        playSfx('success');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-reject]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-approve-appeal]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const app = pendingAppeals.find(a => a.id == btn.dataset.approveAppeal);
                        if (app) await supabaseClient.from('ads').update({ status: 'approved' }).eq('id', app.ad_id);
                        await supabaseClient.from('appeals').update({ status: 'approved' }).eq('id', btn.dataset.approveAppeal);
                        playSfx('success');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-reject-appeal]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('appeals').update({ status: 'rejected' }).eq('id', btn.dataset.rejectAppeal);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });

                if (isOwner) {
                    document.getElementById('banUserBtn').addEventListener('click', async () => {
                        const uname = document.getElementById('targetUsernameInput').value.trim().toLowerCase();
                        if (!uname) return;
                        await supabaseClient.from('app_users').update({ banned: true }).eq('username', uname);
                        playSfx('success');
                        showToast(`Пользователь @${uname} забанен`, 'success');
                    });
                    document.getElementById('unbanUserBtn').addEventListener('click', async () => {
                        const uname = document.getElementById('targetUsernameInput').value.trim().toLowerCase();
                        if (!uname) return;
                        await supabaseClient.from('app_users').update({ banned: false }).eq('username', uname);
                        playSfx('success');
                        showToast(`Пользователь @${uname} разбанен`, 'success');
                    });
                    document.getElementById('clearAllFeedBtn').addEventListener('click', () => {
                        showConfirm('Очистка ленты', 'Удалить все объявления из базы данных?', async () => {
                            await supabaseClient.from('ads').delete().neq('id', 0);
                            playSfx('success');
                            loadAdminPanel();
                        });
                    });
                }
            }

            // =========================================================================
            // 13. ПОИСК
            // =========================================================================
            function openSearchModal() {
                showModal(`
                    <h3 class="modal-title">🔍 Поиск по объявлениям</h3>
                    <div class="form-group"><input type="text" id="modalSearchInput" placeholder="Введите название предмета..."></div>
                    <div id="searchResultsContainer" style="max-height:350px;overflow-y:auto;"></div>
                `);
                const input = document.getElementById('modalSearchInput');
                input.focus();
                input.addEventListener('input', async () => {
                    const q = input.value.trim();
                    const container = document.getElementById('searchResultsContainer');
                    if (q.length < 2) { container.innerHTML = ''; return; }
                    try {
                        const { data } = await supabaseClient.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(15);
                        if (!data || !data.length) { container.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
                        let html = '';
                        data.forEach(ad => {
                            html += `
                                <div class="card" data-search-ad-id="${ad.id}">
                                    <div style="font-weight:700;">${ad.item_name}</div>
                                    <div style="font-size:13px;color:var(--accent);">${formatPrice(ad.price)} • ${ad.server}</div>
                                </div>
                            `;
                        });
                        container.innerHTML = html;
                        container.querySelectorAll('[data-search-ad-id]').forEach(card => {
                            card.addEventListener('click', () => {
                                const ad = data.find(a => a.id == card.dataset.searchAdId);
                                document.getElementById('modalOverlay').remove();
                                if (ad) openAdDetail(ad);
                            });
                        });
                    } catch (e) {}
                });
            }

            // ЗАПУСК ПРИЛОЖЕНИЯ
            window.addEventListener('DOMContentLoaded', () => {
                initTelegram();
                initSupabase();
                checkAuth();
            });

        })();
    </script>
</body>
</html>
