            '<p style="text-align:center;color:var(--muted);font-style:italic;margin-bottom:1rem;">' + authorIdOrUsername + '</p>' +
            '<div class="links-list mb-12">' +
                '<div class="link-item" data-link="https://t.me/bounqy31"><span class="link-icon">👨‍💼</span><span class="link-label">Менеджер</span></div>' +
                '<div class="link-item" data-link="https://t.me/Bounty_Squad31"><span class="link-icon">📣</span><span class="link-label">Телеграм канал</span></div>' +
                '<div class="link-item" data-link="https://vk.com/bountyarz"><span class="link-icon">📢</span><span class="link-label">ВК канал</span></div>' +
            '</div>' +
            '<button class="btn danger w-full mb-12" id="profileReportUserBtn">👤 Пожаловаться</button>' +
            '<div id="profileAdsList"><div class="loader"></div></div>'
        );
        document.querySelectorAll('.link-item').forEach(function(item) {
            item.addEventListener('click', function() { window.open(item.dataset.link, '_blank'); });
        });
        document.getElementById('profileReportUserBtn').addEventListener('click', function() { openReportUserModal(userId); });
        if (!userId) {
            document.getElementById('profileAdsList').innerHTML = '<div class="empty-state">Пользователь не найден</div>';
            return;
        }
        try {
            const res = await withTimeout(
                supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false)
                    .eq('author_id', userId).order('created_at', { ascending: false }),
                5000
            );
            const ads = res.data || [];
            const cRes = await supabaseClient.from('ads').select('*', { count: 'exact', head: true }).eq('author_id', userId);
            const cont = document.getElementById('profileAdsList');
            let html = '<div style="margin-bottom:1rem;font-size:.85rem;text-align:center;color:var(--muted);">Объявлений: <strong style="color:var(--accent);">' + (cRes.count || 0) + '</strong></div>';
            if (!ads.length) html += '<div class="empty-state">Нет активных объявлений</div>';
            else html += ads.map(function(ad) {
                return '<div class="card" data-prof-ad="' + ad.id + '" style="padding:.75rem;">' +
                    '<div style="font-weight:700;">' + ad.item_name + '</div>' +
                    '<div style="font-size:.75rem;color:var(--muted);">' + ad.server + ' • ' + formatPrice(ad.price) + '</div>' +
                '</div>';
            }).join('');
            cont.innerHTML = html;
            cont.querySelectorAll('[data-prof-ad]').forEach(function(card) {
                card.addEventListener('click', function() {
                    const ad = ads.find(function(a) { return a.id == card.dataset.profAd; });
                    if (ad) { ref.closeModal(); openAdDetail(ad); }
                });
            });
        } catch (e) {
            document.getElementById('profileAdsList').innerHTML = '<div class="empty-state">⚠️ Ошибка</div>';
        }
    }

    /* ============================================================
       ВСЕ РАЗДЕЛЫ
       ============================================================ */
    function loadAllTiles() {
        const tiles = [
            { id: 'looks', icon: '📸', label: 'Лента «Луков»' },
            { id: 'companions', icon: '👥', label: 'Попутчики' },
            { id: 'music', icon: '🎵', label: 'Музыка' },
            { id: 'settings', icon: '⚙️', label: 'Настройки' },
            { id: 'chat', icon: '💬', label: 'Переписки' },
            { id: 'notifications', icon: '🔔', label: 'Уведомления' }
        ];
        const cont = document.getElementById('allTiles');
        cont.innerHTML = tiles.map(function(t) {
            return '<div class="grid-tile" data-tile="' + t.id + '"><span class="tile-icon">' + t.icon + '</span><span>' + t.label + '</span></div>';
        }).join('');
        cont.querySelectorAll('[data-tile]').forEach(function(tile) {
            tile.addEventListener('click', function() {
                const id = tile.dataset.tile;
                if (id === 'looks') openLooksModal();
                if (id === 'companions') openCompanionsModal();
                if (id === 'music') openMusicModal();
                if (id === 'settings') openSettingsModal();
                if (id === 'chat') openChatModal();
                if (id === 'notifications') openNotificationsModal();
            });
        });
    }

    /* ============================================================
       НАСТРОЙКИ
       ============================================================ */
    function openSettingsModal() {
        const ref = showModal(
            '<h3 class="modal-title">⚙️ Настройки</h3>' +
            '<div class="form-group flex-between"><label>🔊 Звуки</label><input type="checkbox" id="settingsSfx" ' + (sfxEnabled ? 'checked' : '') + ' style="width:1.5rem;height:1.5rem;accent-color:var(--accent);"></div>' +
            '<div class="form-group flex-between"><label>🌙 Тёмная тема</label><input type="checkbox" id="settingsDark" ' + (currentTheme === 'dark' ? 'checked' : '') + ' style="width:1.5rem;height:1.5rem;accent-color:var(--accent);"></div>' +
            '<div class="ornament">◈ ◈ ◈</div>' +
            '<button class="btn danger w-full mt-12" id="settingsLogoutBtn">🚪 Выйти</button>'
        );
        document.getElementById('settingsSfx').addEventListener('change', async function(e) {
            sfxEnabled = e.target.checked;
            if (currentUser) await supabaseClient.from('user_settings').update({ sfx_enabled: sfxEnabled }).eq('user_id', currentUser.id);
        });
        document.getElementById('settingsDark').addEventListener('change', async function(e) {
            currentTheme = e.target.checked ? 'dark' : 'light';
            applyTheme();
            if (currentUser) await supabaseClient.from('user_settings').update({ theme: currentTheme }).eq('user_id', currentUser.id);
        });
        document.getElementById('settingsLogoutBtn').addEventListener('click', function() {
            localStorage.removeItem('arizona_current_user');
            currentUser = null;
            ref.closeModal();
            location.reload();
        });
    }

    /* ============================================================
       ЧАТ / УВЕДОМЛЕНИЯ
       ============================================================ */
    function openChatModal() {
        const ref = showModal(
            '<h3 class="modal-title">💬 Переписки</h3>' +
            '<div class="empty-state">Переписки ведутся напрямую в Telegram</div>' +
            '<button class="btn primary w-full mt-12" id="chatTgBtn">📱 Перейти в Telegram</button>'
        );
        document.getElementById('chatTgBtn').addEventListener('click', function() {
            if (tg && tg.openTelegramLink) tg.openTelegramLink('https://t.me/');
            else window.open('https://t.me/', '_blank');
            ref.closeModal();
        });
    }

    async function openNotificationsModal() {
        showModal('<h3 class="modal-title">🔔 Уведомления</h3><div id="notificationsList"><div class="loader"></div></div>');
        try {
            const res = await withTimeout(
                supabaseClient.from('notifications').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }),
                5000
            );
            if (res.error) throw res.error;
            const notif = res.data || [];
            const cont = document.getElementById('notificationsList');
            if (!notif.length) { cont.innerHTML = '<div class="empty-state">Нет уведомлений</div>'; return; }
            cont.innerHTML = notif.map(function(n) {
                return '<div class="card ' + (!n.read ? 'inactive-card' : '') + '" style="cursor:default;">' +
                    '<div style="font-weight:600;font-size:.9rem;">' + n.message + '</div>' +
                    '<div style="font-size:.7rem;color:var(--muted);margin-top:.3rem;">' + new Date(n.created_at).toLocaleString('ru-RU') + '</div>' +
                '</div>';
            }).join('');
            await supabaseClient.from('notifications').update({ read: true }).eq('user_id', currentUser.id).eq('read', false);
            unreadNotifications = 0;
        } catch (e) {
            document.getElementById('notificationsList').innerHTML = '<div class="empty-state">⚠️ Ошибка</div>';
        }
    }

    /* ============================================================
       ЛУКИ
       ============================================================ */
    function openLooksModal() {
        showModal(
            '<h3 class="modal-title">📸 Лента «Луков»</h3>' +
            '<div class="form-group"><label>Ссылка на фото</label><input type="text" id="lookImg" placeholder="https://..."></div>' +
            '<div class="form-group"><label>Описание</label><input type="text" id="lookDesc" placeholder="Мой лук"></div>' +
            '<button class="btn primary w-full mb-12" id="lookSubmitBtn">Опубликовать</button>' +
            '<div id="looksList"><div class="loader"></div></div>'
        );
        loadLooksFeed();
        document.getElementById('lookSubmitBtn').addEventListener('click', async function() {
            const img = document.getElementById('lookImg').value.trim();
            const desc = document.getElementById('lookDesc').value.trim();
            const lc = checkLinksString(img);
            if (!lc.valid) { showAlert('Ошибка', lc.message); return; }
            await supabaseClient.from('looks').insert({
                author_id: currentUser.id, author_username: currentUser.username,
                image_url: img, description: desc, created_at: new Date().toISOString()
            });
            playSfx('success');
            document.getElementById('lookImg').value = '';
            document.getElementById('lookDesc').value = '';
            loadLooksFeed();
        });
    }

    async function loadLooksFeed() {
        const cont = document.getElementById('looksList');
        if (!cont) return;
        const res = await withTimeout(
            supabaseClient.from('looks').select('*').order('created_at', { ascending: false }), 5000
        );
        if (res.error) { cont.innerHTML = '<div class="empty-state">⚠️ Ошибка</div>'; return; }
        const looks = res.data || [];
        if (!looks.length) { cont.innerHTML = '<div class="empty-state">📸 Образов пока нет</div>'; return; }
        cont.innerHTML = looks.map(function(l) {
            return '<div class="card" style="cursor:default;">' +
                '<div class="img-container" style="height:200px;border-radius:8px;background:var(--border);">' +
                    '<div class="skeleton" style="position:absolute;inset:0;border-radius:8px;"></div>' +
                    '<img src="' + l.image_url + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;border-radius:8px;" onload="this.classList.add(\'loaded\');this.previousElementSibling&&this.previousElementSibling.remove();" onerror="this.style.display=\'none\';">' +
                '</div>' +
                '<div style="font-weight:700;font-size:.9rem;margin-top:.5rem;color:var(--accent);">' + (l.author_username || l.author_id) + '</div>' +
                '<p style="font-size:.82rem;color:var(--muted);">' + (l.description || '') + '</p>' +
                (l.author_id === currentUser.id ? '<button class="btn danger mt-8" data-del-look="' + l.id + '" style="min-height:34px;padding:.35rem .8rem;font-size:.72rem;">🗑 Удалить</button>' : '') +
            '</div>';
        }).join('');
        cont.querySelectorAll('[data-del-look]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                await supabaseClient.from('looks').delete().eq('id', btn.dataset.delLook);
                loadLooksFeed();
            });
        });
    }

    /* ============================================================
       ПОПУТЧИКИ
       ============================================================ */
    function openCompanionsModal() {
        showModal(
            '<h3 class="modal-title">👥 Попутчики</h3>' +
            '<div class="form-group"><label>Цель</label><input type="text" id="compTarget" placeholder="Например: еду на шахту"></div>' +
            '<div class="form-group"><label>Контакты</label><input type="text" id="compContact" placeholder="@username"></div>' +
            '<button class="btn primary w-full mb-12" id="compSubmitBtn">Найти напарника</button>' +
            '<div id="companionsList"><div class="loader"></div></div>'
        );
        loadCompanionsFeed();
        document.getElementById('compSubmitBtn').addEventListener('click', async function() {
            const target = document.getElementById('compTarget').value.trim();
            const contact = document.getElementById('compContact').value.trim();
            if (!target || !contact) { showAlert('Ошибка', 'Заполните все поля'); return; }
            await supabaseClient.from('companions').insert({
                author_id: currentUser.id, author_username: currentUser.username,
                target: target, contact: contact, created_at: new Date().toISOString()
            });
            playSfx('success');
            document.getElementById('compTarget').value = '';
            document.getElementById('compContact').value = '';
            loadCompanionsFeed();
        });

    async function loadCompanionsFeed() {
        const cont = document.getElementById('companionsList');
        if (!cont) return;
        const res = await withTimeout(
            supabaseClient.from('companions').select('*').order('created_at', { ascending: false }), 5000
        );
        if (res.error) { cont.innerHTML = '<div class="empty-state">⚠️ Ошибка</div>'; return; }
        const comps = res.data || [];
        if (!comps.length) { cont.innerHTML = '<div class="empty-state">👥 Заявок нет</div>'; return; }
        cont.innerHTML = comps.map(function(c) {
            return '<div class="card" style="cursor:default;">' +
                '<div style="font-weight:700;">' + c.target + '</div>' +
                '<div style="font-size:.75rem;color:var(--muted);">Автор: ' + (c.author_username || c.author_id) + ' • Контакт: ' + c.contact + '</div>' +
                (c.author_id === currentUser.id ? '<button class="btn danger mt-8" data-del-comp="' + c.id + '" style="min-height:34px;padding:.35rem .8rem;font-size:.72rem;">🗑</button>' : '') +
            '</div>';
        }).join('');
        cont.querySelectorAll('[data-del-comp]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                await supabaseClient.from('companions').delete().eq('id', btn.dataset.delComp);
                loadCompanionsFeed();
            });
        });

    /* ============================================================
       МУЗЫКА
       ============================================================ */
    function openMusicModal() {
        showModal(
            '<h3 class="modal-title">🎵 Музыка</h3>' +
            '<div class="form-group"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://..."></div>' +
            '<div class="flex-between gap-8 mb-12">' +
                '<button class="btn primary w-full" id="musicPlayBtn">▶️ Играть</button>' +
                '<button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button>' +
            '</div>' +
            '<button class="btn danger w-full" id="musicResetBtn">⏹ Сбросить</button>'
        );
        let activeAudio = window.appCurrentAudio || null;
        document.getElementById('musicPlayBtn').addEventListener('click', function() {
            const url = document.getElementById('musicUrl').value.trim();
            if (url) {
                if (activeAudio) activeAudio.pause();
                activeAudio = new Audio(url);
                window.appCurrentAudio = activeAudio;
                activeAudio.play().catch(function() { showAlert('Ошибка', 'Не удалось воспроизвести'); });
            } else if (activeAudio) activeAudio.play();
        });
        document.getElementById('musicPauseBtn').addEventListener('click', function() { if (activeAudio) activeAudio.pause(); });
        document.getElementById('musicResetBtn').addEventListener('click', function() {
            if (activeAudio) { activeAudio.pause(); window.appCurrentAudio = null; }
            document.getElementById('musicUrl').value = '';
        });
    }

    /* ============================================================
       ПОИСК
       ============================================================ */
    function openSearchModal() {
        const ref = showModal(
            '<h3 class="modal-title">🔍 Поиск</h3>' +
            '<div class="form-group"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off"></div>' +
            '<div class="flex-between gap-8 mb-12">' +
                '<button class="btn primary w-full" id="searchItemBtn">📦 Предмет</button>' +
                '<button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button>' +
            '</div>' +
            '<div id="searchSuggestions"></div>' +
            '<div id="searchHistory"></div>' +
            '<div id="searchResults"></div>'
        );
        const input = document.getElementById('searchInput');
        setTimeout(function() { input.focus(); }, 150);
        const sugg = document.getElementById('searchSuggestions');
        const res = document.getElementById('searchResults');
        const hist = document.getElementById('searchHistory');

        function renderHist() {
            if (!searchHistory.length) { hist.innerHTML = ''; return; }
            hist.innerHTML = '<div style="font-size:.75rem;color:var(--muted);margin-bottom:.5rem;">📜 История:</div>' +
                searchHistory.map(function(h) {
                    return '<span class="badge" style="cursor:pointer;margin:.15rem;background:var(--accent-soft);color:var(--accent);" data-hist="' + h + '">' + h + '</span>';
                }).join('');
            hist.querySelectorAll('[data-hist]').forEach(function(el) {
                el.addEventListener('click', function() {
                    input.value = el.dataset.hist;
                    input.dispatchEvent(new Event('input'));
                });
            });
        }
        renderHist();

        input.addEventListener('input', async function() {
            const q = input.value.trim().toLowerCase();
            if (!q) { sugg.innerHTML = ''; res.innerHTML = ''; return; }
            const r = await withTimeout(
                supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false)
                    .ilike('item_name', '%' + q + '%').limit(5), 5000
            );
            if (r.error) return;
            const items = r.data || [];
            sugg.innerHTML = items.map(function(ad) {
                return '<div class="search-suggestion" data-sug="' + ad.id + '">📦 ' + ad.item_name + ' • ' + formatPrice(ad.price) + '</div>';
            }).join('');
            sugg.querySelectorAll('[data-sug]').forEach(function(el) {
                el.addEventListener('click', function() {
                    const ad = items.find(function(a) { return a.id == el.dataset.sug; });
                    if (ad) { saveSearchQuery(q); ref.closeModal(); openAdDetail(ad); }
                });
            });
        });

        document.getElementById('searchItemBtn').addEventListener('click', async function() {
            const q = input.value.trim().toLowerCase();
            if (!q) return;
            saveSearchQuery(q);
            const r = await withTimeout(
                supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false)
                    .ilike('item_name', '%' + q + '%'), 5000
            );
            if (r.error) return;
            const items = r.data || [];
            if (!items.length) { res.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
            res.innerHTML = items.map(function(ad) {
                return '<div class="card" data-res-id="' + ad.id + '" style="padding:.75rem;">' +
                    '<div style="font-weight:700;">' + ad.item_name + '</div>' +
                    '<div style="font-size:.75rem;color:var(--muted);">' + ad.server + ' • ' + formatPrice(ad.price) + '</div>' +
                '</div>';
            }).join('');
            res.querySelectorAll('[data-res-id]').forEach(function(card) {
                card.addEventListener('click', function() {
                    const ad = items.find(function(a) { return a.id == card.dataset.resId; });
                    if (ad) { ref.closeModal(); openAdDetail(ad); }
                });
            });
        });

        document.getElementById('searchProfileBtn').addEventListener('click', function() {
            const q = input.value.trim();
            if (q) { ref.closeModal(); openProfileModal(q); }
        });
    }

    /* ============================================================
       ЗАПУСК
       ============================================================ */
    function bootApp() {
        log('Boot started');
        const startTime = Date.now();
        const tgUsername = initTelegram();
        const supabaseOk = initSupabase();

        if (!supabaseOk) {
            setTimeout(function() {
                const pre = document.getElementById('preloader');
                if (pre) pre.classList.add('hidden');
                document.body.innerHTML = '<div style="text-align:center;margin-top:50vh;padding:2rem;color:#C62828;font-family:sans-serif;">Ошибка подключения к базе данных. Обновите страницу.</div>';
            }, PRELOADER_MIN_TIME);
            return;
        }

        const proceed = async function() {
            const elapsed = Date.now() - startTime;
            const wait = Math.max(0, PRELOADER_MIN_TIME - elapsed);
            setTimeout(async function() {
                const preloader = document.getElementById('preloader');
                if (preloader) preloader.classList.add('hidden');

                const saved = localStorage.getItem('arizona_current_user');
                if (!saved) {
                    showAuthScreen(tgUsername || '');
                    return;
                }
                try {
                    currentUser = JSON.parse(saved);
                    log('Проверка сессии для', currentUser.username);
                    const res = await supabaseClient
                        .from('app_users').select('*').eq('id', currentUser.id).maybeSingle();

                    if (res.error) {
                        warn('session check error', res.error);
                        localStorage.removeItem('arizona_current_user');
                        currentUser = null;
                        showAuthScreen(tgUsername || '');
                        return;
                    }
                    if (!res.data || res.data.banned) {
                        if (res.data && res.data.banned) { showBanScreen(); return; }
                        localStorage.removeItem('arizona_current_user');
                        currentUser = null;
                        showAuthScreen(tgUsername || '');
                        return;
                    }
                    currentUser = res.data;
                    hidePreloaderAndShowApp();
                } catch (e) {
                    warn('boot session error', e);
                    localStorage.removeItem('arizona_current_user');
                    currentUser = null;
                    showAuthScreen(tgUsername || '');
                }
            }, wait);
        };

        proceed();
    }

    /* ============================================================
       ГЛОБАЛЬНЫЕ СОБЫТИЯ
       ============================================================ */
    document.addEventListener('click', function(e) {
        const selectors = '.btn,.nav-item,.card,.grid-tile,.link-item,.search-suggestion,.theme-toggle,.header-logo,.header-search,.modal-close,.auth-theme-toggle,.star-rating span';
        if (e.target.closest(selectors)) {
            playSfx('click');
            hapticFeedback('light');
        }
    });

    document.addEventListener('touchmove', function(e) {
        if (document.querySelector('.modal-overlay.show') && !e.target.closest('.modal')) {
            e.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('DOMContentLoaded', bootApp);

})();
</script>
