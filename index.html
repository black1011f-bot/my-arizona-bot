<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дурак Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #1a3a1a;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            touch-action: manipulation;
        }
        #app {
            width: 100%; height: 100%; max-width: 800px;
            margin: 0 auto;
            background: #2a6b2a;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        #splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
            padding: 30px;
            transition: opacity 0.4s ease;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #splash h1 { color: #ffd700; font-size: 3em; text-shadow: 0 0 20px #000; }
        #splash .options { display: flex; flex-direction: column; gap: 10px; }
        #splash label {
            color: #fff; font-size: 1.2em; background: rgba(255,255,255,0.1);
            padding: 10px 20px; border-radius: 20px; display: flex; align-items: center; gap: 10px; cursor: pointer;
        }
        #splash .start-btn {
            font-size: 1.5em; padding: 12px 40px; background: #ffd700; border: none;
            border-radius: 30px; color: #1a3a1a; font-weight: bold; cursor: pointer;
        }
        #table {
            flex: 1; position: relative;
            background: radial-gradient(circle at 50% 50%, #3a8a3a, #1e5a1e);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .zone { display: flex; justify-content: center; align-items: center; position: relative; }
        #bot-zone { flex: 0 0 90px; background: rgba(0,0,0,0.1); }
        #center-zone {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative; padding: 10px;
        }
        #player-zone { flex: 0 0 130px; background: rgba(0,0,0,0.1); position: relative; }
        
        .card-pair { position: relative; width: 60px; height: 84px; margin: 0 5px; }
        
        .card {
            width: 60px; height: 84px; background: #fff; border-radius: 6px;
            border: 1px solid #333; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 4px; font-weight: bold; font-size: 0.9em; position: absolute;
        }
        .card.back { background: #1a3a8a; border: 2px solid #fff; }
        .card.red { color: #c00; }
        .card.black { color: #000; }
        .card.trump-card { border: 2px solid gold; }
        .card.highlight { box-shadow: 0 0 12px 3px #ffd700; border-color: #ffd700; z-index: 10; }
        .card .top { display: flex; flex-direction: column; line-height: 1; }
        .card .bottom { display: flex; flex-direction: column; line-height: 1; transform: rotate(180deg); align-self: flex-end; }
        
        .card-pair .attack-card { left: 0; top: 0; z-index: 1; }
        .card-pair .defense-card { left: 12px; top: 12px; z-index: 2; }
        
        #deck-area { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; }
        #deck-area .card { position: relative; }
        #trump-info { color: #fff; font-weight: bold; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 10px; }
        
        #controls { display: flex; justify-content: center; gap: 10px; padding: 10px; background: rgba(0,0,0,0.4); }
        #controls button {
            padding: 10px 18px; border: none; border-radius: 20px; font-weight: bold;
            background: #ffd700; color: #1a3a1a; cursor: pointer;
        }
        #controls button:disabled { opacity: 0.3; pointer-events: none; }
        #status { color: #fff; text-align: center; padding: 8px; background: rgba(0,0,0,0.5); font-size: 0.95em; }

        @media (max-width: 480px) {
            .card { width: 48px; height: 68px; font-size: 0.8em; }
            .card-pair { width: 48px; height: 68px; }
            #player-zone { flex-basis: 110px; }
            #bot-zone { flex-basis: 75px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="splash">
        <h1>♠ Дурак ♥</h1>
        <div class="options">
            <label><input type="radio" name="mode" value="podkid" checked> Подкидной</label>
        </div>
        <button class="start-btn" id="startBtn">Играть</button>
    </div>

    <div id="table">
        <div id="bot-zone" class="zone"></div>
        <div id="center-zone">
            <div id="pairs-container" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;"></div>
            <div id="deck-area">
                <div class="card back" id="deckCard"></div>
                <div id="trump-info">♠</div>
            </div>
        </div>
        <div id="player-zone" class="zone"></div>
    </div>

    <div id="status">Загрузка...</div>
    <div id="controls">
        <button id="btnPass" disabled>Отбой</button>
        <button id="btnTake" disabled>Взять</button>
        <button id="btnNewGame">Заново</button>
    </div>
</div>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); }

    class Card {
        constructor(suit, rank) {
            this.suit = suit; this.rank = rank; this.id = suit + rank;
        }
        get name() {
            const names = { 6:'6',7:'7',8:'8',9:'9',10:'10',11:'В',12:'Д',13:'К',14:'Т' };
            return names[this.rank] || this.rank;
        }
        get isRed() { return this.suit === '♥' || this.suit === '♦'; }
        beats(other, trumpSuit) {
            if (this.suit === trumpSuit && other.suit !== trumpSuit) return true;
            if (this.suit !== trumpSuit && other.suit === trumpSuit) return false;
            if (this.suit === other.suit) return this.rank > other.rank;
            return false;
        }
    }

    function createDeck() {
        const suits = ['♠','♥','♦','♣'], ranks = [6,7,8,9,10,11,12,13,14], deck = [];
        for (let s of suits) for (let r of ranks) deck.push(new Card(s, r));
        return deck.sort(() => Math.random() - 0.5);
    }

    class Game {
        constructor() {
            this.deck = createDeck();
            this.trumpCard = this.deck[0];
            this.trumpSuit = this.trumpCard.suit;
            this.playerHand = [];
            this.botHand = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.isPlayerTurn = true;
            this.isAttacking = true;
            this.gameOver = false;
            this.waitingForPass = false;
        }

        init() {
            for (let i = 0; i < 6; i++) {
                if (this.deck.length) this.playerHand.push(this.deck.pop());
                if (this.deck.length) this.botHand.push(this.deck.pop());
            }
            this.sortHands();
            this.startTurn();
        }

        sortHands() {
            const score = c => (c.suit === this.trumpSuit ? 100 : 0) + c.rank;
            this.playerHand.sort((a,b) => score(a) - score(b));
            this.botHand.sort((a,b) => score(a) - score(b));
        }

        startTurn() {
            this.updateUI();
            if (this.checkGameOver()) return;

            if (this.isPlayerTurn) {
                this.setStatus('Ваш ход. Выберите карту.');
                this.enableControls(false, false);
            } else {
                this.setStatus('Ход бота...');
                setTimeout(() => this.botAttack(), 800);
            }
        }

        playerPlayCard(card) {
            if (this.gameOver) return;

            if (this.isPlayerTurn && this.isAttacking) {
                if (this.attackingCards.length > 0) {
                    const ranks = [...this.attackingCards, ...this.defendingCards].map(c => c.rank);
                    if (!ranks.includes(card.rank)) return;
                }
                this.playerHand = this.playerHand.filter(c => c !== card);
                this.attackingCards.push(card);
                this.updateUI();
                this.setStatus('Бот отбивается...');
                this.enableControls(false, false);
                setTimeout(() => this.botDefend(), 800);

            } else if (!this.isPlayerTurn && !this.isAttacking) {
                const target = this.attackingCards[this.defendingCards.length];
                if (card.beats(target, this.trumpSuit)) {
                    this.playerHand = this.playerHand.filter(c => c !== card);
                    this.defendingCards.push(card);
                    this.updateUI();

                    if (this.defendingCards.length === this.attackingCards.length) {
                        this.setStatus('Вы отбились! Ваш ход.');
                        this.enableControls(true, false);
                    } else {
                        this.setStatus('Отбейте следующую карту или возьмите.');
                        this.enableControls(false, true);
                    }
                }
            }
        }

        botAttack() {
            if (this.gameOver) return;
            const card = this.botHand.find(c => c.suit !== this.trumpSuit) || this.botHand[0];
            if (!card) { this.finishTurn(true); return; }

            this.botHand = this.botHand.filter(c => c !== card);
            this.attackingCards.push(card);
            this.isAttacking = false;
            this.updateUI();
            this.setStatus('Бот походил. Отбивайтесь!');
            this.enableControls(false, true);
        }

        botDefend() {
            const target = this.attackingCards[this.defendingCards.length];
            const card = this.botHand.find(c => c.beats(target, this.trumpSuit));

            if (card) {
                this.botHand = this.botHand.filter(c => c !== card);
                this.defendingCards.push(card);
                this.updateUI();

                if (this.defendingCards.length === this.attackingCards.length) {
                    this.enableControls(true, false);
                    this.setStatus('Бот отбился. Нажмите "Отбой".');
                } else {
                    setTimeout(() => this.botDefend(), 600);
                }
            } else {
                this.setStatus('Бот берет карты! Подкиньте еще или нажмите "Отбой".');
                this.botHand.push(...this.attackingCards, ...this.defendingCards);
                this.attackingCards = [];
                this.defendingCards = [];
                this.waitingForPass = true;
                this.enableControls(true, false);
            }
        }

        onPass() {
            if (this.waitingForPass) {
                this.waitingForPass = false;
                this.finishTurn(true); // Ход остается игроку, т.к. бот взял
            } else if (this.defendingCards.length === this.attackingCards.length) {
                const nextTurn = !this.isPlayerTurn;
                this.finishTurn(nextTurn);
            }
        }

        onTake() {
            this.playerHand.push(...this.attackingCards, ...this.defendingCards);
            this.attackingCards = [];
            this.defendingCards = [];
            this.finishTurn(false); // Ход переходит боту
        }

        finishTurn(nextIsPlayer) {
            this.attackingCards = [];
            this.defendingCards = [];
            
            while (this.playerHand.length < 6 && this.deck.length) this.playerHand.push(this.deck.pop());
            while (this.botHand.length < 6 && this.deck.length) this.botHand.push(this.deck.pop());
            
            this.sortHands();
            this.isPlayerTurn = nextIsPlayer;
            this.isAttacking = true;
            this.startTurn();
        }

        checkGameOver() {
            if (this.deck.length === 0) {
                if (this.playerHand.length === 0) { this.setStatus('🎉 Вы выиграли!'); this.gameOver = true; }
                else if (this.botHand.length === 0) { this.setStatus('😞 Бот выиграл.'); this.gameOver = true; }
            }
            return this.gameOver;
        }

        setStatus(msg) { document.getElementById('status').textContent = msg; }
        enableControls(pass, take) {
            document.getElementById('btnPass').disabled = !pass;
            document.getElementById('btnTake').disabled = !take;
        }

        updateUI() {
            // Отрисовка руки игрока
            const pZone = document.getElementById('player-zone');
            pZone.innerHTML = '';
            const total = this.playerHand.length;
            this.playerHand.forEach((card, i) => {
                const el = this.createCardEl(card);
                const offset = (i - (total - 1) / 2) * 35;
                el.style.transform = `translateX(${offset}px)`;
                el.onclick = () => this.playerPlayCard(card);
                pZone.appendChild(el);
            });

            // Отрисовка бота
            const bZone = document.getElementById('bot-zone');
            bZone.innerHTML = `<span style="color:#fff">Карт у бота: ${this.botHand.length}</span>`;

            // Отрисовка стола
            const pairsContainer = document.getElementById('pairs-container');
            pairsContainer.innerHTML = '';
            this.attackingCards.forEach((atk, i) => {
                const pair = document.createElement('div');
                pair.className = 'card-pair';
                const atkEl = this.createCardEl(atk);
                atkEl.classList.add('attack-card');
                pair.appendChild(atkEl);

                if (this.defendingCards[i]) {
                    const defEl = this.createCardEl(this.defendingCards[i]);
                    defEl.classList.add('defense-card');
                    pair.appendChild(defEl);
                }
                pairsContainer.appendChild(pair);
            });

            // Колода
            document.getElementById('deckCard').style.display = this.deck.length ? 'block' : 'none';
            document.getElementById('deckCard').textContent = this.deck.length;
            document.getElementById('trump-info').textContent = 'Козырь: ' + this.trumpSuit;
        }

        createCardEl(card) {
            const div = document.createElement('div');
            div.className = `card ${card.isRed ? 'red' : 'black'} ${card.suit === this.trumpSuit ? 'trump-card' : ''}`;
            div.innerHTML = `<div class="top"><span>${card.name}</span><span>${card.suit}</span></div>
                             <div class="bottom"><span>${card.name}</span><span>${card.suit}</span></div>`;
            return div;
        }
    }

    let game;
    document.getElementById('startBtn').onclick = () => {
        document.getElementById('splash').classList.add('hidden');
        game = new Game();
        game.init();
    };
    document.getElementById('btnPass').onclick = () => game?.onPass();
    document.getElementById('btnTake').onclick = () => game?.onTake();
    document.getElementById('btnNewGame').onclick = () => {
        document.getElementById('splash').classList.remove('hidden');
    };
</script>
</body>
</html>
