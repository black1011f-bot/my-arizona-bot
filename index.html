<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona Online — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ ========== */
        :root {
            --bg: #F9FAFB;
            --card: #FFFFFF;
            --border: #E5E7EB;
            --accent: #4F46E5;
            --accent-hover: #4338CA;
            --gold: #F59E0B;
            --text: #111827;
            --muted: #6B7280;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --radius: 16px;
            --radius-sm: 10px;
            --btn-min-height: 48px;
            --container-width: 480px;
            --nav-height: 64px;
            --header-height: 60px;
            --font: 'Inter', sans-serif;
            --transition: 0.2s ease;
            --base-font-size: 16px;
            --logo-light: url('https://i.postimg.cc/nV1HDjcb/1788346659518.jpg');
            --logo-dark: url('https://i.postimg.cc/zfWNX3c5/1788346752679.jpg');
        }
        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --border: #334155;
            --accent: #818CF8;
            --accent-hover: #6366F1;
            --gold: #FBBF24;
            --text: #F1F5F9;
            --muted: #94A3B8;
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        html { font-size: var(--base-font-size); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            font-size: clamp(0.875rem, 0.8rem + 0.5vw, 1rem);
        }
        .container {
            max-width: min(100% - 2rem, var(--container-width)); margin: 0 auto; padding: 0 1rem;
            padding-top: calc(var(--header-height) + 1rem);
            padding-bottom: calc(var(--nav-height) + 2rem);
            transition: max-width 0.3s;
        }
        @media (min-width: 768px) { :root { --container-width:720px; --base-font-size:17px; } .ads-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; } .ad-card { width:100%; } }
        @media (min-width: 1024px) { :root { --container-width:1200px; --base-font-size:18px; } .ads-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width: 420px) {
            :root { --base-font-size:15px; --btn-min-height:44px; --header-height:56px; --nav-height:60px; }
            .header-title { font-size: clamp(1rem, 4vw, 1.3rem); }
            .header-logo { width:32px; height:32px; border-radius:8px; }
            .nav-item .nav-icon { font-size:20px; }
            .nav-item { font-size: clamp(0.65rem, 2.5vw, 0.8rem); min-height:40px; }
            .ad-card-img { width:64px; height:84px; }
            .ad-card-title { font-size: clamp(0.8rem, 3vw, 1rem); }
            .ad-card-price { font-size: clamp(0.9rem, 3.5vw, 1.1rem); }
            .card { padding:0.8rem; }
            .modal { padding:1rem; max-width:100%; }
            .grid-tiles { grid-template-columns:repeat(2,1fr); gap:0.8rem; }
            .btn { padding:0.7rem 1rem; font-size:0.85rem; min-height:42px; }
            .form-group input, .form-group select, .form-group textarea { padding:0.7rem 0.9rem; font-size:0.9rem; }
        }
        /* ========== HEADER ========== */
        .header { position:fixed; top:0; left:0; right:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0.6rem 1rem; height:var(--header-height); gap:0.6rem; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        .header-logo { width:36px; height:36px; border-radius:10px; overflow:hidden; flex-shrink:0; cursor:pointer; transition:transform 0.2s; }
        .header-logo img { width:100%; height:100%; object-fit:cover; display:block; }
        .header-title { font-weight:800; font-size:clamp(1rem, 4vw, 1.5rem); white-space:nowrap; letter-spacing:-0.02em; }
        .header-search { flex:1; min-width:0; cursor:pointer; }
        .header-search input { width:100%; padding:0.6rem 1rem; border-radius:50px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:0.9rem; outline:none; pointer-events:none; box-shadow:var(--shadow); }
        .theme-toggle { background:none; border:none; font-size:1.5rem; cursor:pointer; padding:0.2rem; border-radius:8px; flex-shrink:0; }
        /* ========== BOTTOM NAV ========== */
        .nav-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; background:var(--bg); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; height:var(--nav-height); padding-bottom:env(safe-area-inset-bottom); }
        .nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--muted); font-size:clamp(0.65rem, 2vw, 0.8rem); font-weight:600; cursor:pointer; padding:0.25rem 0.3rem; border-radius:12px; transition:color 0.2s, transform 0.1s; flex:1; max-width:80px; min-height:48px; }
        .nav-item .nav-icon { font-size:clamp(1.2rem, 5vw, 1.6rem); line-height:1; }
        .nav-item.active { color:var(--accent); background:rgba(79,70,229,0.08); }
        .nav-item:active { transform:scale(0.92); }
        /* ========== SECTIONS ========== */
        .section { display:none; opacity:0; transform:translateY(10px); transition:opacity 0.25s, transform 0.25s; }
        .section.active { display:block; opacity:1; transform:translateY(0); }
        /* ========== CARDS ========== */
        .card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); padding:0.9rem; margin-bottom:0.9rem; transition:background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s; cursor:pointer; }
        .card:active { transform:scale(0.98); }
        .card.inactive-card { opacity:0.7; background:rgba(128,128,128,0.06); }
        [data-theme="dark"] .card.inactive-card { background:rgba(255,255,255,0.03); }
        .ad-card { display:flex; gap:0.8rem; align-items:flex-start; }
        .ad-card-img { width:80px; height:100px; border-radius:12px; object-fit:cover; background:var(--border); flex-shrink:0; }
        .ad-card-info { flex:1; min-width:0; }
        .ad-card-title { font-weight:700; font-size:clamp(0.8rem, 2.5vw, 1rem); margin-bottom:0.2rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ad-card-price { font-weight:800; font-size:clamp(0.9rem, 3vw, 1.2rem); color:var(--accent); margin-bottom:0.2rem; }
        .ad-card-badges { display:flex; flex-wrap:wrap; gap:0.25rem; margin-bottom:0.2rem; }
        .badge { padding:0.15rem 0.6rem; border-radius:20px; font-size:0.7rem; font-weight:700; background:var(--border); color:var(--text); white-space:nowrap; }
        .badge.sell { background:#10B981; color:#fff; }
        .badge.buy { background:#F97316; color:#fff; }
        .badge.server { background:var(--gold); color:#1a1a1a; }
        .badge.category { background:var(--accent); color:#fff; }
        .badge.status-pending { background:#FBBF24; color:#1a1a1a; }
        .badge.status-deleted { background:#EF4444; color:#fff; }
        .badge.status-approved { background:#10B981; color:#fff; }
        .ad-card-author { font-size:0.7rem; color:var(--muted); }
        .countdown-timer { font-size:0.7rem; color:var(--muted); margin-top:0.2rem; font-weight:500; }
        /* ========== BUTTONS ========== */
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.4rem; padding:0.7rem 1.1rem; border-radius:var(--radius-sm); border:none; background:var(--accent); color:#fff; font-weight:700; font-size:clamp(0.8rem, 2.5vw, 0.95rem); cursor:pointer; transition:background 0.2s, transform 0.1s, opacity 0.2s; touch-action:manipulation; min-height:var(--btn-min-height); }
        .btn:hover { background:var(--accent-hover); }
        .btn:active { transform:scale(0.97); }
        .btn.secondary { background:var(--border); color:var(--text); }
        .btn.danger { background:#EF4444; color:#fff; }
        .btn.gold { background:var(--gold); color:#1a1a1a; }
        .btn.success { background:#10B981; color:#fff; }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .btn.w-full { width:100%; }
        /* ========== MODAL ========== */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:1rem; opacity:0; transition:opacity 0.25s; backdrop-filter:blur(4px); }
        .modal-overlay.show { opacity:1; }
        .modal { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:85vh; overflow-y:auto; padding:1.5rem; position:relative; transform:translateY(20px); transition:transform 0.25s; }
        .modal-overlay.show .modal { transform:translateY(0); }
        .modal-close { position:absolute; top:0.7rem; right:0.7rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--muted); padding:0.2rem; line-height:1; z-index:5; }
        .modal-title { font-weight:800; font-size:clamp(1rem, 3vw, 1.4rem); margin-bottom:1rem; padding-right:2rem; letter-spacing:-0.02em; }
        /* ========== FORMS ========== */
        .form-group { margin-bottom:1rem; }
        .form-group label { display:block; font-weight:600; font-size:0.8rem; margin-bottom:0.3rem; color:var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:0.7rem 1rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.9rem; outline:none; transition:border-color 0.2s, background 0.3s; font-family:var(--font); }
        .form-group textarea { min-height:100px; resize:vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }
        /* ========== AUTH ========== */
        .auth-container { position:fixed; top:0; left:0; right:0; bottom:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:1rem; overflow:hidden; }
        .auth-background { position:absolute; top:0; left:0; right:0; bottom:0; background-position:center; background-size:cover; z-index:-1; }
        .auth-box { width:100%; max-width:400px; background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:1.8rem; box-shadow:var(--shadow-lg); position:relative; z-index:1; }
        .auth-tab { flex:1; padding:0.6rem; background:none; border:none; cursor:pointer; font-weight:700; transition:color 0.2s, border-color 0.2s; }
        .auth-tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }
        .auth-tab:not(.active) { color:var(--muted); border-bottom:2px solid transparent; }
        .auth-theme-toggle { position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; z-index:2; }
        /* ========== SPLASH ========== */
        #splash-screen { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:3000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.8rem; transition:opacity 0.5s ease, visibility 0.5s; }
        #splash-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .splash-icon { width:clamp(72px, 20vw, 120px); height:clamp(72px, 20vw, 120px); border-radius:24px; overflow:hidden; box-shadow:var(--shadow-lg); animation:splashZoom 1.2s ease-out; }
        .splash-icon img { width:100%; height:100%; object-fit:cover; display:block; }
        .splash-title { font-weight:900; font-size:clamp(1.5rem, 6vw, 2.5rem); color:var(--text); letter-spacing:-0.02em; animation:splashFadeUp 1s ease 0.3s both; }
        .splash-subtitle { font-size:clamp(0.9rem, 3vw, 1.2rem); color:var(--muted); font-weight:600; animation:splashFadeUp 1s ease 0.6s both; }
        @keyframes splashZoom { 0% { transform:scale(0.3); opacity:0; } 100% { transform:scale(1); opacity:1; } }
        @keyframes splashFadeUp { 0% { transform:translateY(20px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }
        /* ========== TOAST ========== */
        .toast-container { position:fixed; top:70px; right:1rem; z-index:999; display:flex; flex-direction:column; gap:0.5rem; max-width:320px; }
        .toast { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:0.8rem 1rem; box-shadow:var(--shadow-lg); font-size:0.8rem; font-weight:500; color:var(--text); animation:slideIn 0.3s ease; }
        .toast.success { border-left:4px solid #10B981; }
        .toast.error { border-left:4px solid #EF4444; }
        .toast.info { border-left:4px solid var(--accent); }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        /* ========== SKELETON ========== */
        .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--card) 50%, var(--border) 75%); background-size:200% 100%; animation:skeleton-loading 1.5s infinite; border-radius:var(--radius-sm); }
        @keyframes skeleton-loading { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
        .img-container { position:relative; overflow:hidden; }
        .img-container img { opacity:0; transition:opacity 0.3s; }
        .img-container img.loaded { opacity:1; }
        /* ========== LINKS ========== */
        .links-list { display:flex; flex-direction:column; gap:0.6rem; }
        .link-item { display:flex; align-items:center; gap:0.8rem; padding:0.8rem; background:var(--bg); border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; transition:transform 0.2s, background 0.2s; }
        .link-item:active { transform:scale(0.97); }
        .link-item .link-icon { font-size:1.5rem; width:2.2rem; text-align:center; }
        .link-item .link-label { flex:1; font-weight:600; }
        .link-item .link-value { color:var(--accent); font-size:0.8rem; display:none; }
        /* ========== LOADER ========== */
        .loader { border:3px solid var(--border); border-top:3px solid var(--accent); border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; margin:20px auto; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--border); border-radius:4px; }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
        /* ========== GAME ========== */
        .game-click-area { width:100%; max-width:220px; aspect-ratio:1; margin:0 auto 1rem; cursor:pointer; border-radius:20px; overflow:hidden; border:4px solid var(--border); transition:transform 0.1s, border-color 0.3s; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
        .game-click-area:active { transform:scale(0.92); }
        .game-click-area img { width:100%; height:100%; object-fit:cover; pointer-events:none; display:block; }
        /* ========== UPGRADES ========== */
        .upgrade-card { display:flex; justify-content:space-between; align-items:center; padding:0.8rem; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:0.6rem; background:var(--card); }
        .upgrade-info { flex:1; }
        .upgrade-name { font-weight:700; font-size:0.9rem; }
        .upgrade-cost { font-size:0.75rem; color:var(--muted); }
        /* ========== STAR RATING ========== */
        .star-rating { display:flex; gap:0.4rem; font-size:2rem; cursor:pointer; }
        .star-rating span { color:var(--border); transition:color 0.2s, transform 0.2s; }
        .star-rating span.active { color:var(--gold); }
        .star-rating span:hover { transform:scale(1.2); }
        /* ========== REVIEWS ========== */
        .review-item { border-bottom:1px solid var(--border); padding:0.6rem 0; }
        .review-item:last-child { border-bottom:none; }
        /* ========== PROGRESS BAR ========== */
        .progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:0.3rem 0; }
        .progress-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 0.3s; }
        /* ========== GRID TILES ========== */
        .grid-tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:0.8rem; }
        .grid-tile { padding:1rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); text-align:center; cursor:pointer; font-weight:700; font-size:0.8rem; transition:transform 0.2s, border-color 0.2s, background 0.2s; }
        .grid-tile:active { transform:scale(0.95); }
        .grid-tile .tile-icon { font-size:2rem; display:block; margin-bottom:0.4rem; }
        .grid-tile.active { border-color:var(--accent); background:rgba(79,70,229,0.08); }
        .search-suggestion { padding:0.6rem 0.9rem; border-radius:8px; cursor:pointer; font-size:0.8rem; transition:background 0.2s; }
        .search-suggestion:hover, .search-suggestion:active { background:var(--border); }
        .hidden { display:none!important; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; gap:0.5rem; }
        .mt-8 { margin-top:0.5rem; }
        .mt-12 { margin-top:0.8rem; }
        .mb-8 { margin-bottom:0.5rem; }
        .mb-12 { margin-bottom:0.8rem; }
        .w-full { width:100%; }
        .gap-8 { gap:0.5rem; }
        .gap-12 { gap:0.8rem; }
        .text-center { text-align:center; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="splash-icon">
            <img src="https://i.postimg.cc/mgk2RL4g/1788361335674.jpg" alt="Arizona Online" loading="lazy" onerror="this.style.display='none'">
        </div>
        <div class="splash-title">Arizona Online</div>
        <div class="splash-subtitle">Market</div>
    </div>

    <header class="header" id="appHeader" style="display:none;">
        <div class="header-logo" id="logoBtn">
            <img id="headerLogoImg" src="https://i.postimg.cc/nV1HDjcb/1788346659518.jpg" alt="Arizona Online" loading="lazy">
        </div>
        <div class="header-title">Arizona Online</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn">🌓</button>
    </header>

    <main class="container" id="mainContainer" style="display:none;">
        <section class="section active" id="section-home">
            <div id="serverSelector" style="margin-bottom:1rem;">
                <button class="btn secondary w-full" id="serverSelectBtn">🌐 Все сервера</button>
            </div>
            <div class="ads-grid" id="homeFeed"></div>
            <div id="loadMoreTrigger" style="height:20px;"></div>
        </section>
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:1rem;font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <section class="section" id="section-send">
            <h2 style="margin-bottom:1rem;font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group"><label>Тип сделки</label><button class="btn secondary w-full" id="sendTypeBtn">Продажа</button></div>
                <div class="form-group"><label>Категория</label><button class="btn secondary w-full" id="sendCategoryBtn">Выберите категорию</button></div>
                <div class="form-group"><label>Название</label><input type="text" id="sendName" placeholder="Введите название"></div>
                <div class="form-group"><label>Цена</label><input type="text" id="sendPrice" placeholder="Например: 5к или 1000000"></div>
                <div class="form-group"><label>Описание</label><textarea id="sendDescription" placeholder="Подробное описание"></textarea></div>
                <div class="form-group"><label>Скриншоты (ссылки через запятую)</label><input type="text" id="sendImages" placeholder="https://..."><div style="margin-top:0.3rem;font-size:0.7rem;color:var(--muted);">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div></div>
                <div class="form-group"><label>Сервер</label><button class="btn secondary w-full" id="sendServerBtn">Выберите сервер</button></div>
                <div id="vipOptions" class="hidden">
                    <div class="flex-between gap-8">
                        <button class="btn secondary w-full" id="sendVipBtn">⭐ VIP объявление (10 Stars)</button>
                        <button class="btn secondary w-full" id="sendRegularBtn">Обычное</button>
                    </div>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>
        </section>
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:1rem;font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 style="margin-bottom:1rem;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
            <h3 style="margin:1.5rem 0 0.8rem;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>
        <section class="section" id="section-moderator-log">
            <h2>📜 Журнал модераторов</h2>
            <div id="moderatorLogList"></div>

                if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const freqs = { click:800, success:1200, error:300, buy:1000, splash:600 };
                osc.frequency.value = freqs[type] || 600;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 0.005);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.04);

        function formatPrice(value) {
            if(!value) return '0';
            let num = typeof value==='string'? value.toLowerCase() : value.toString();
            if(num.includes('к')) {
                let base = parseFloat(num.split('к')[0])||0;
                let kCount = (num.match(/к/g)||[]).length;
                if(kCount===1) base*=1000; else if(kCount===2) base*=1000000; else if(kCount===3) base*=1000000000;
                return Math.floor(base).toString();
            }
            num = parseInt(num)||0;
            if(num>=1000000000) return (num/1000000000).toFixed(num%1000000000===0?0:2)+'ккк';
            if(num>=1000000) return (num/1000000).toFixed(num%1000000===0?0:1)+'кк';
            if(num>=1000) return (num/1000).toFixed(num%1000===0?0:1)+'к';
            return num.toString();
        }
        function parsePriceToNumber(str) {
            if(!str) return 0;
            str = str.toLowerCase().trim();
            let num = parseInt(str.replace(/[^0-9]/g,''))||0;
            let kCount = (str.match(/к/g)||[]).length;
            if(kCount===1) num*=1000; else if(kCount===2) num*=1000000; else if(kCount===3) num*=1000000000;
            return num;
        }

            if(kCount===1) num*=1000; else if(kCount===2) num*=1000000; else if(kCount===3) num*=1000000000;
            input.value = formatPrice(num);
        }

        }

            const salt = 'ArizonaOnlineSalt_2024';
            const data = new TextEncoder().encode(salt + password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
        }

                            if(error) throw error;

                            if(data.password_hash!==hashedPassword){ registerFailedLogin(); errEl.textContent='Неверный логин или пароль'; isSubmitting=false; btn.disabled=false; btn.textContent='Войти'; return; }
                            if(data.banned){ showBanScreen(); return; }
                            resetLoginAttempts();
                            currentAuthUser = data;
                            localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                            localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                            await loadUserSettingsAndProgress(); playSfx('success'); container.innerHTML=''; hideSplashAndShowApp();
                        } else {
                            const { data: existingTelegram } = await withTimeout(supabaseClient.from('app_users').select('id').eq('telegram_id', currentUser.id).maybeSingle(),5000);
                            if(existingTelegram){ errEl.textContent='Этот Telegram уже привязан к аккаунту. Войдите.'; isSubmitting=false; btn.disabled=false; btn.textContent='Создать аккаунт'; return; }
                            const { data: existing } = await withTimeout(supabaseClient.from('app_users').select('id').eq('username',username).maybeSingle(),5000);
                            if(existing){ errEl.textContent='Такой пользователь уже существует'; isSubmitting=false; btn.disabled=false; btn.textContent='Создать аккаунт'; return; }
                            const newUser = { username, password_hash:hashedPassword, telegram_id: currentUser.id||null, telegram_username: currentUser.username||null, banned:false, is_admin: username===OWNER_USERNAME, created_at:new Date().toISOString() };
                            const { data: inserted, error: insertErr } = await withTimeout(supabaseClient.from('app_users').insert(newUser).select().single(),5000);
                            if(insertErr) throw insertErr;
                            currentAuthUser = inserted;
                            localStorage.setItem('arizona_current_user_full', JSON.stringify(currentAuthUser));
                            localStorage.setItem('arizona_current_user', JSON.stringify({ id: currentAuthUser.id }));
                            await supabaseClient.from('user_settings').insert({user_id:currentAuthUser.id, theme:'light', sfx_enabled:true, admin_password_hash:null});
                            await supabaseClient.from('user_progress').insert({user_id:currentAuthUser.id, tutorial_completed:false, admin_tutorial_completed:false});
                            await loadUserSettingsAndProgress(); playSfx('success'); container.innerHTML=''; hideSplashAndShowApp();
                        }
                    } catch(e) { console.error('Auth error',e); let msg='Ошибка соединения.'; if(e.message==='Timeout') msg='Превышено время ожидания.'; errEl.textContent=msg; isSubmitting=false; btn.disabled=false; btn.textContent = mode==='login'?'Войти':'Создать аккаунт'; }
                });
            }
            renderAuthForm();
        }

        function setupServerSelector(){

            btn.addEventListener('click', ()=>{

                </div>`);

        function updateServerButtonText(){ const btn = document.getElementById('serverSelectBtn'); if(btn) btn.textContent = currentFilterServer ? `🌐 ${currentFilterServer}` : '🌐 Все сервера'; }
        function setupInfiniteScroll() {
            const trigger = document.getElementById('loadMoreTrigger');
            if (!trigger) return;
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !isLoadingFeed && hasMoreAds) loadHomeFeed(false);
                });
            }, { rootMargin: '200px' });
            observer.observe(trigger);
        }
        async function loadHomeFeed(reset = true) {
            if (isLoadingFeed) return;
            isLoadingFeed = true;
            if (reset) { feedPage = 0; homeAds = []; hasMoreAds = true; document.getElementById('homeFeed').innerHTML = '<div class="loader"></div>'; }
            try {
                const from = feedPage * FEED_PAGE_SIZE;
                const to = from + FEED_PAGE_SIZE - 1;
                let query = supabaseClient.from('ads').select('*').eq('status','approved').eq('hidden',false).order('created_at',{ascending:false}).range(from,to);
                if(currentFilterServer) query = query.eq('server', currentFilterServer);
                const { data, error } = await withTimeout(query, 8000);
                if(error) throw error;
                const newAds = data || [];
                const validAds = newAds.filter(ad => !ad.expires_at || new Date(ad.expires_at) > new Date());
                if(reset) homeAds = validAds; else homeAds = [...homeAds, ...validAds];
                if(newAds.length < FEED_PAGE_SIZE) hasMoreAds = false;
                renderHomeFeed();
                feedPage++;
            } catch(e) {
                if(reset) document.getElementById('homeFeed').innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
                else showToast('Не удалось загрузить ещё объявления', 'error');
            } finally { isLoadingFeed = false; }
        }
        function renderHomeFeed(){
            const cont = document.getElementById('homeFeed');
            if(!homeAds.length){ cont.innerHTML='<div class="empty-state">📭 Объявлений пока нет</div>'; return; }
            let html = '';
            homeAds.forEach(ad=>{
                const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                const img = firstImg || DEFAULT_AD_IMAGE;
                const modeBadge = ad.mode==='sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
                const catLabel = ALL_CATEGORIES.find(c=>c.id===ad.category)?.label || ad.category;
                const isVip = ad.is_vip ? '<span class="badge gold">⭐ VIP</span>' : '';
                let timer = '';
                if(ad.expires_at){
                    const diff = new Date(ad.expires_at) - new Date();
                    if(diff > 0){
                        const total = Math.floor(diff/1000);
                        const h = Math.floor(total/3600);
                        const m = Math.floor((total%3600)/60);
                        const s = total%60;
                        timer = `<div class="countdown-timer">⏳ Удаление через: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}</div>`;
                    } else { timer = '<div class="countdown-timer">⚠️ Удалено</div>'; }
                }
                html += `<div class="card ad-card" data-ad-id="${ad.id}">
                    <div class="img-container" style="width:80px;height:100px;border-radius:12px;flex-shrink:0;background:var(--border);">
                        <div class="skeleton" style="position:absolute;inset:0;border-radius:12px;"></div>
                        <img src="${img}" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;" onload="this.classList.add('loaded')" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--border);border-radius:12px;z-index:0;">📷</div>
                    </div>
                    <div class="ad-card-info">
                        <div class="ad-card-title">${ad.item_name || 'Без названия'}</div>
                        <div class="ad-card-price">${formatPrice(ad.price)}</div>
                        <div class="ad-card-badges">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span>${isVip}</div>
                        <div class="ad-card-author">Автор: ${ad.author_username || ad.author_id}</div>
                        ${timer}
                    </div>
                </div>`;
            });
            cont.innerHTML = html;
            cont.querySelectorAll('.ad-card').forEach(card=>card.addEventListener('click', ()=>{ const id = card.dataset.adId; const ad = homeAds.find(a=>a.id == id); if(ad) openAdDetail(ad); }));
        }

                const images = document.getElementById('sendImages').value.trim();
                if(!itemName || !priceRaw || !description){ showAlert('Ошибка','Заполните все обязательные поля'); return; }
                const forbidden = checkForbiddenWords(itemName + ' ' + description);
                if (forbidden) { showAlert('Ошибка', forbidden); return; }
                const linkCheck = checkLinksString(images);
                if(!linkCheck.valid){ showAlert('Ошибка', linkCheck.message); return; }
                for (let link of linkCheck.links) { const safety = await checkLinkSafety(link); if (!safety.safe) { showAlert('Ошибка', safety.message); return; } }
                const last = localStorage.getItem('arizona_last_submit_time');
                if(last){ const diff = Date.now() - parseInt(last); if(diff < 120000){ showAlert('Подождите', `Следующая отправка через ${Math.ceil((120000-diff)/1000)} сек.`); return; } }
                if(!sendFormData.category || !sendFormData.server){ showAlert('Ошибка','Выберите категорию и сервер'); return; }
                const userAge = Date.now() - new Date(currentAuthUser.created_at).getTime();
                const isNewUser = userAge < 24 * 60 * 60 * 1000;
                if (isNewUser) {
                    const { count } = await supabaseClient.from('ads').select('*', { count: 'exact', head: true }).eq('author_id', currentAuthUser.id);
                    if (count >= NEW_USER_LIMIT) { showAlert('Лимит', `Новые пользователи могут размещать не более ${NEW_USER_LIMIT} объявлений в первые 24 часа.`); return; }
                }
                if (sendFormData.isVip) showVipPaymentModal('ad', itemName, priceRaw, description, images, sendFormData);
                else await submitAd(itemName, priceRaw, description, images, sendFormData, false);
            });
        }
        async function submitAd(itemName, priceRaw, description, images, formData, isVip) {
            const newAd = { mode: formData.type, category: formData.category, item_name: itemName, price: parsePriceToNumber(priceRaw), description, images, server: formData.server, author_id: currentAuthUser.id, author_username: currentAuthUser.username, status:'pending', created_at:new Date().toISOString(), expires_at:null, is_vip:isVip, hidden:false };
            try {
                await withTimeout(supabaseClient.from('ads').insert(newAd), 5000);
                localStorage.setItem('arizona_last_submit_time', Date.now().toString());
                playSfx('success'); showToast(isVip?'VIP объявление отправлено':'Объявление отправлено','success');
                document.getElementById('sendName').value=''; document.getElementById('sendPrice').value=''; document.getElementById('sendDescription').value=''; document.getElementById('sendImages').value='';
                sendFormData.isVip = false; document.getElementById('sendVipBtn').classList.remove('active'); document.getElementById('sendRegularBtn').classList.add('active');
            } catch(e) { showAlert('Ошибка','Не удалось отправить объявление'); }
        }
        function showVipPaymentModal(type, ...args) {
            let title, description, priceStars;
            if (type==='ad') { title='⭐ VIP объявление'; description='Ваше объявление будет закреплено вверху ленты на 24 часа.'; priceStars=VIP_AD_PRICE_STARS; }
            else { title='👑 VIP подписка'; description='Подписка даёт возможность размещать VIP объявления без дополнительной оплаты, а также приоритетную поддержку.'; priceStars=VIP_SUBSCRIPTION_PRICE_STARS; }
            showModal(`<h3 class="modal-title">${title}</h3><p style="color:var(--muted);margin-bottom:1rem;">${description}</p><p style="font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:1rem;">${priceStars} ⭐</p><button class="btn w-full" id="payStarsBtn">Оплатить через Telegram Stars</button><button class="btn secondary w-full mt-8" id="cancelPayBtn">Отмена</button>`);
            document.getElementById('payStarsBtn').addEventListener('click', async ()=>{
                if (tg && tg.openInvoice) {

                            if(type==='ad') { const [itemName, priceRaw, description, images, formData] = args; submitAd(itemName, priceRaw, description, images, formData, true); }
                            else supabaseClient.from('user_settings').update({ vip_subscription:true }).eq('user_id',currentAuthUser.id);

                        } else showToast('Оплата не завершена','error');
                    });
                } else showAlert('Ошибка','Оплата Stars недоступна в этом клиенте.');
            });

            document.querySelectorAll('[data-approve-report]').forEach(btn=>btn.addEventListener('click', async ()=>{ const rp = pendingReports.find(r=>r.id == btn.dataset.approveReport); if(rp) await supabaseClient.from('ads').update({status:'deleted'}).eq('id', rp.ad_id); await supabaseClient.from('reports').update({status:'approved'}).eq('id', btn.dataset.approveReport); await logModeratorAction('approve_report', btn.dataset.approveReport); loadAdminPanel(); }));

        function showWarnHideModal(){
            const target = document.getElementById('adminUsernameInput').value.trim();

                    await logModeratorAction('warn_user', user.id);

                    if (count >= 3) { await supabaseClient.from('app_users').update({ banned:true, ban_expires: new Date(Date.now() + 7*24*60*60*1000).toISOString() }).eq('id', user.id); await supabaseClient.from('notifications').insert({ user_id: user.id, message:'Вы получили 3 предупреждения и забанены на 7 дней.', read:false, created_at:new Date().toISOString() }); }
                    else await supabaseClient.from('notifications').insert({ user_id: user.id, message:`Вам выдано предупреждение: ${reason}`, read:false, created_at:new Date().toISOString() });

                try{
                    let q = supabaseClient.from('app_users').select('*');

                    const { data: users, error } = await withTimeout(q, 5000);
                    if(error || !users.length){ showAlert('Ошибка','Пользователь не найден'); return; }
                    const user = users[0];
                    await supabaseClient.from('ads').update({ hidden:true }).eq('author_id', user.id).eq('status','approved');
                    await logModeratorAction('hide_ads', user.id);
                    showAlert('Успех','Объявления скрыты'); document.getElementById('modalOverlay').remove(); loadAdminPanel();
                } catch(e){ showAlert('Ошибка','Не удалось скрыть объявления'); }
            });

        async function adminUserAction(action){
            const target = document.getElementById('adminUsernameInput').value.trim();
            if(!target){ showAlert('Ошибка','Введите username или ID'); return; }
            try{
                let q = supabaseClient.from('app_users').select('*');
                if(!isNaN(target)) q = q.eq('id', target); else q = q.eq('username', target);
                const { data: users, error } = await withTimeout(q, 5000);
                if(error) throw error;
                if(!users.length){ showAlert('Ошибка','Пользователь не найден'); return; }
                const user = users[0];
                if(action==='ban') { await supabaseClient.from('app_users').update({ banned:true }).eq('id', user.id); await logModeratorAction('ban_user', user.id); }
                else if(action==='unban') { await supabaseClient.from('app_users').update({ banned:false }).eq('id', user.id); await logModeratorAction('unban_user', user.id); }
                else if(action==='make_admin') { await supabaseClient.from('app_users').update({ is_admin:true }).eq('id', user.id); await logModeratorAction('make_admin', user.id); }
                else if(action==='remove_admin') { await supabaseClient.from('app_users').update({ is_admin:false }).eq('id', user.id); await logModeratorAction('remove_admin', user.id); }
                playSfx('success'); showAlert('Успех','Действие выполнено'); loadAdminPanel();
            } catch(e) { showAlert('Ошибка','Не удалось выполнить'); }
        }

        function openBarygaGame(){
            loadGameState().then(()=>{
                showModal(`<h3 class="modal-title">🎮 Игра «Барыга»</h3><div style="text-align:center;font-size:1.5rem;font-weight:900;margin-bottom:0.5rem;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div><div class="game-click-area" id="gameClickArea"><img src="https://i.postimg.cc/3RnGkVNw/4827782b1f3adf82a5db028d6ed0e8a7.jpg" loading="lazy" alt="Клик"></div><div style="font-size:0.75rem;color:var(--muted);text-align:center;" id="gameStatsDisplay">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div><div class="mt-12" id="gameUpgradesContainer"></div>`, ()=>{ barygaStateLoaded = false; saveGameState(); });
                const clickArea = document.getElementById('gameClickArea');
                const upgradesCont = document.getElementById('gameUpgradesContainer');
                upgradesCont.innerHTML = renderUpgrades();
                let lastAuto = Date.now();
                function loop(){ if(!document.getElementById('gameClickArea')) return; const now = Date.now(); if(now - lastAuto >= 1000){ if(gameState.autoIncome > 0){ gameState.money += gameState.autoIncome; gameState.last_seen = new Date().toISOString(); updateGameUIFast(); saveGameStateDebounced(); } lastAuto = now; } requestAnimationFrame(loop); }
                requestAnimationFrame(loop);
                clickArea.addEventListener('click', ()=>{ gameState.money += gameState.clickPower; updateGameUIFast(); saveGameStateDebounced(); clickArea.style.transform = 'scale(0.92)'; setTimeout(()=>clickArea.style.transform='', 80); });
                upgradesCont.addEventListener('click', (e)=>{ const btn = e.target.closest('[data-upgrade]'); if(!btn) return; const idx = parseInt(btn.dataset.upgrade); const up = getUpgradesList()[idx]; if(gameState.money >= up.cost){ gameState.money -= up.cost; up.action(); updateGameUIFast(); saveGameStateDebounced(); playSfx('buy'); } });
                window.addEventListener('beforeunload', saveGameState);
                document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveGameState(); });
            });
        }
        function getUpgradesList(){ return [ { name:'Клик +1', cost: gameState.clickCost, action: ()=>{ gameState.clickPower += 1; gameState.clickCost *= 2; } }, { name:'Авто +5/сек', cost: gameState.autoCost, action: ()=>{ gameState.autoIncome += 5; gameState.autoCost *= 2; } }, { name:'Про +20/сек', cost: gameState.proCost, action: ()=>{ gameState.autoIncome += 20; gameState.proCost *= 2; } }, { name:'Магазин +50/сек', cost: gameState.shopCost, action: ()=>{ gameState.autoIncome += 50; gameState.shopCost *= 2; } }, { name:'Элита: клик +10', cost: gameState.eliteCost, action: ()=>{ gameState.clickPower += 10; gameState.eliteCost *= 2; } }, { name:'Нефть +200/сек', cost: gameState.oilCost, action: ()=>{ gameState.autoIncome += 200; gameState.oilCost *= 2; } }, { name:'Крипта +1000/сек', cost: gameState.cryptoCost, action: ()=>{ gameState.autoIncome += 1000; gameState.cryptoCost *= 2; } }, { name:'Скупка лома +500/сек', cost: gameState.scrapCost, action: ()=>{ gameState.autoIncome += 500; gameState.scrapCost *= 2; } } ]; }
        function renderUpgrades(){ return getUpgradesList().map((u,i)=>`<div class="upgrade-card"><div class="upgrade-info"><div class="upgrade-name">${u.name}</div><div class="upgrade-cost" data-cost-idx="${i}">💰 ${formatPrice(u.cost)}</div></div><button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button></div>`).join(''); }
        function updateGameUIFast(){ const moneyEl = document.getElementById('gameMoneyDisplay'); if(moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money); const statsEl = document.getElementById('gameStatsDisplay'); if(statsEl) statsEl.textContent = `Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек`; getUpgradesList().forEach((u,i)=>{ const btn = document.querySelector(`[data-upgrade="${i}"]`); const cost = document.querySelector(`[data-cost-idx="${i}"]`); if(btn && cost){ cost.textContent = '💰 ' + formatPrice(u.cost); if(gameState.money < u.cost) btn.setAttribute('disabled','true'); else btn.removeAttribute('disabled'); } }); }
        function saveGameStateDebounced(){ if(saveGameTimeout) clearTimeout(saveGameTimeout); saveGameTimeout = setTimeout(saveGameState, 1000); }
        async function saveGameState(){ if(!currentAuthUser) return; try{ const { data } = await supabaseClient.from('baryga').select('id').eq('user_id', currentAuthUser.id).single(); if(data) await supabaseClient.from('baryga').update({ money:gameState.money, click_power:gameState.clickPower, click_cost:gameState.clickCost, auto_income:gameState.autoIncome, auto_cost:gameState.autoCost, pro_cost:gameState.proCost, shop_cost:gameState.shopCost, elite_cost:gameState.eliteCost, oil_cost:gameState.oilCost, crypto_cost:gameState.cryptoCost, scrap_cost:gameState.scrapCost, last_seen:new Date().toISOString() }).eq('id', data.id); else await supabaseClient.from('baryga').insert({ ...gameState, user_id:currentAuthUser.id }); } catch(e){ console.warn('saveGameState', e); } }

        // ---------- ПОИСК ----------
        function openSearchModal(){
            showModal(`<h3 class="modal-title">🔍 Поиск</h3><div class="form-group"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off"></div><div class="flex-between gap-8 mb-12"><button class="btn w-full" id="searchItemBtn">📦 Предмет</button><button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button></div><div id="searchSuggestions"></div><div id="searchHistory"></div><div id="searchResults"></div>`);
            const input = document.getElementById('searchInput'); setTimeout(()=>input.focus(),100);
            const sugg = document.getElementById('searchSuggestions'), res = document.getElementById('searchResults'), hist = document.getElementById('searchHistory');
            function renderHist(){ if(!searchHistory.length){ hist.innerHTML=''; return; } hist.innerHTML = '<div style="font-size:0.75rem;color:var(--muted);margin-bottom:0.5rem;">📜 История:</div>' + searchHistory.map(h=>`<span class="badge" style="cursor:pointer;margin:0.15rem;" data-hist="${h}">${h}</span>`).join(''); hist.querySelectorAll('[data-hist]').forEach(el=>el.addEventListener('click', ()=>{ input.value = el.dataset.hist; input.dispatchEvent(new Event('input')); })); }
            renderHist();
            input.addEventListener('input', async ()=>{
                const q = input.value.trim().toLowerCase(); if(!q){ sugg.innerHTML=''; res.innerHTML=''; return; }
                const { data, error } = await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('hidden',false).ilike('item_name', `%${q}%`).limit(5), 5000);
                if(error) return;
                const items = data || [];
                sugg.innerHTML = items.map(ad=>`<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`).join('');
                sugg.querySelectorAll('[data-sug]').forEach(el=>el.addEventListener('click', ()=>{ const ad = items.find(a=>a.id == el.dataset.sug); if(ad){ saveSearchQuery(q); document.getElementById('modalOverlay').remove(); openAdDetail(ad); } }));
            });
            document.getElementById('searchItemBtn').addEventListener('click', async ()=>{
                const q = input.value.trim().toLowerCase(); if(!q) return; saveSearchQuery(q);
                const { data, error } = await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('hidden',false).ilike('item_name', `%${q}%`), 5000);
                if(error) return;
                const items = data || [];
                if(!items.length){ res.innerHTML='<div class="empty-state">Ничего не найдено</div>'; return; }
                res.innerHTML = items.map(ad=>`<div class="card" data-res-id="${ad.id}"><div style="font-weight:700;">${ad.item_name}</div><div style="font-size:0.75rem;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div></div>`).join('');
                res.querySelectorAll('[data-res-id]').forEach(card=>card.addEventListener('click', ()=>{ const ad = items.find(a=>a.id == card.dataset.resId); if(ad){ document.getElementById('modalOverlay').remove(); openAdDetail(ad); } }));
            });
            document.getElementById('searchProfileBtn').addEventListener('click', ()=>{ const q = input.value.trim(); if(q) openProfileModal(q); });
        }

        // ---------- НАСТРОЙКИ ----------
        function openSettingsModal(){
            showModal(`<h3 class="modal-title">⚙️ Настройки</h3>
                <div class="form-group flex-between"><label>🔊 Звуки</label><input type="checkbox" id="settingsSfx" ${sfxEnabled?'checked':''} style="width:1.5rem;height:1.5rem;"></div>
                <div class="form-group flex-between"><label>🌙 Тёмная тема</label><input type="checkbox" id="settingsDark" ${currentTheme==='dark'?'checked':''} style="width:1.5rem;height:1.5rem;"></div>
                <button class="btn secondary w-full mt-12" id="settingsLogoutBtn">🚪 Выйти</button>
                <button class="btn danger w-full mt-8" id="settingsDeleteBtn">🗑 Удалить аккаунт</button>`);
            document.getElementById('settingsSfx').addEventListener('change', async (e)=>{ sfxEnabled = e.target.checked; if(currentAuthUser) await supabaseClient.from('user_settings').update({ sfx_enabled: sfxEnabled }).eq('user_id', currentAuthUser.id); });
            document.getElementById('settingsDark').addEventListener('change', async (e)=>{ currentTheme = e.target.checked ? 'dark' : 'light'; applyTheme(); if(currentAuthUser) await supabaseClient.from('user_settings').update({ theme: currentTheme }).eq('user_id', currentAuthUser.id); });
            document.getElementById('settingsLogoutBtn').addEventListener('click', ()=>{ localStorage.removeItem('arizona_current_user'); localStorage.removeItem('arizona_current_user_full'); sessionStorage.clear(); currentAuthUser = null; document.getElementById('modalOverlay').remove(); showAuthScreen(); });
            document.getElementById('settingsDeleteBtn').addEventListener('click', showDeleteAccountModal);
        }
        function showDeleteAccountModal(){
            showModal(`<h3 class="modal-title">🗑 Удаление аккаунта</h3><p style="color:var(--muted);margin-bottom:1rem;">Введите пароль для подтверждения.</p><div class="form-group"><label>Пароль</label><input type="password" id="deletePassInput"></div><button class="btn danger w-full" id="confirmDeleteBtn">Удалить</button><p id="deleteError" style="color:#EF4444;font-size:0.75rem;margin-top:0.4rem;"></p>`);
            document.getElementById('confirmDeleteBtn').addEventListener('click', async ()=>{
                const pass = document.getElementById('deletePassInput').value.trim(); const errEl = document.getElementById('deleteError');
                if(!pass){ errEl.textContent='Введите пароль'; return; }
                const hash = await hashPassword(pass);
                if(hash !== currentAuthUser.password_hash){ errEl.textContent='Неверный пароль'; return; }
                showConfirm('Удаление','Удалить аккаунт и все данные?', async ()=>{
                    try{
                        await supabaseClient.from('app_users').delete().eq('id', currentAuthUser.id);
                        await supabaseClient.from('user_settings').delete().eq('user_id', currentAuthUser.id);
                        await supabaseClient.from('user_progress').delete().eq('user_id', currentAuthUser.id);
                        await supabaseClient.from('ads').delete().eq('author_id', currentAuthUser.id);
                        await supabaseClient.from('favorites').delete().eq('user_id', currentAuthUser.id);
                        await supabaseClient.from('search_history').delete().eq('user_id', currentAuthUser.id);
                        await supabaseClient.from('baryga').delete().eq('user_id', currentAuthUser.id);
                        await supabaseClient.from('looks').delete().eq('author_id', currentAuthUser.id);
                        await supabaseClient.from('companions').delete().eq('author_id', currentAuthUser.id);
                        await supabaseClient.from('notifications').delete().eq('user_id', currentAuthUser.id);
                        await supabaseClient.from('reviews').delete().eq('author_id', currentAuthUser.id);
                        await supabaseClient.from('appeals').delete().eq('author_id', currentAuthUser.id);
                        await supabaseClient.from('reports').delete().eq('reporter_id', currentAuthUser.id);
                        await supabaseClient.from('user_reports').delete().eq('reporter_id', currentAuthUser.id);
                        await supabaseClient.from('warnings').delete().eq('user_id', currentAuthUser.id);
                        localStorage.removeItem('arizona_current_user'); localStorage.removeItem('arizona_current_user_full');
                        currentAuthUser = null; document.getElementById('modalOverlay').remove(); showAuthScreen(); showToast('Аккаунт удалён','success');
                    } catch(e){ showAlert('Ошибка','Не удалось удалить аккаунт'); }
                });
            });
        }

        // ---------- ЧАТ, УВЕДОМЛЕНИЯ, ЛУКИ, ПОПУТЧИКИ, МУЗЫКА ----------
        function openChatModal(){ showModal(`<h3 class="modal-title">💬 Переписки</h3><div class="empty-state">Переписки ведутся напрямую в Telegram.</div><button class="btn w-full mt-12" id="chatTgBtn">📱 Перейти в Telegram</button>`); document.getElementById('chatTgBtn').addEventListener('click', ()=>window.open('https://t.me/','_blank')); }
        async function openNotificationsModal(){
            showModal(`<h3 class="modal-title">🔔 Уведомления</h3><div id="notificationsList"><div class="loader"></div></div>`);
            try{
                const { data, error } = await withTimeout(supabaseClient.from('notifications').select('*').eq('user_id', currentAuthUser.id).order('created_at',{ascending:false}), 5000);
                if(error) throw error;
                const notif = data || []; const cont = document.getElementById('notificationsList');
                if(!notif.length){ cont.innerHTML='<div class="empty-state">Нет уведомлений</div>'; return; }
                cont.innerHTML = notif.map(n=>`<div class="card ${!n.read?'inactive-card':''}"><div style="font-weight:600;">${n.message}</div><div style="font-size:0.7rem;color:var(--muted);">${new Date(n.created_at).toLocaleString('ru-RU')}</div></div>`).join('');
                await supabaseClient.from('notifications').update({ read:true }).eq('user_id', currentAuthUser.id).eq('read', false);
                unreadNotifications = 0;
            } catch(e){ document.getElementById('notificationsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>'; }
        }
        function openLooksModal(){
            showModal(`<h3 class="modal-title">📸 Лента «Луков»</h3><div class="form-group"><label>Ссылка на фото</label><input type="text" id="lookImg" placeholder="https://..."></div><div class="form-group"><label>Описание</label><input type="text" id="lookDesc" placeholder="Мой лук"></div><button class="btn w-full mb-12" id="lookSubmitBtn">Опубликовать</button><div id="looksList"><div class="loader"></div></div>`);
            loadLooksFeed();
            document.getElementById('lookSubmitBtn').addEventListener('click', async ()=>{ const img = document.getElementById('lookImg').value.trim(); const desc = document.getElementById('lookDesc').value.trim(); const lc = checkLinksString(img); if(!lc.valid){ showAlert('Ошибка', lc.message); return; } await supabaseClient.from('looks').insert({ author_id: currentAuthUser.id, author_username: currentAuthUser.username, image_url: img, description: desc, created_at: new Date().toISOString() }); playSfx('success'); document.getElementById('lookImg').value=''; document.getElementById('lookDesc').value=''; loadLooksFeed(); });
        }
        async function loadLooksFeed(){ const cont = document.getElementById('looksList'); if(!cont) return; const { data, error } = await withTimeout(supabaseClient.from('looks').select('*').order('created_at',{ascending:false}), 5000); if(error){ cont.innerHTML='<div class="empty-state">⚠️ Ошибка</div>'; return; } const looks = data || []; if(!looks.length){ cont.innerHTML='<div class="empty-state">📸 Образов пока нет</div>'; return; } cont.innerHTML = looks.map(l=>`<div class="card"><div class="img-container" style="height:200px;border-radius:12px;background:var(--border);"><div class="skeleton" style="position:absolute;inset:0;border-radius:12px;"></div><img src="${l.image_url}" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;" onload="this.classList.add('loaded')" onerror="this.style.display='none';"></div><div style="font-weight:700;font-size:0.85rem;">${l.author_username||l.author_id}</div><p style="font-size:0.8rem;color:var(--muted);">${l.description||''}</p>${l.author_id===currentAuthUser.id?`<button class="btn danger mt-8" data-del-look="${l.id}">🗑</button>`:''}</div>`).join(''); cont.querySelectorAll('[data-del-look]').forEach(btn=>btn.addEventListener('click', async ()=>{ await supabaseClient.from('looks').delete().eq('id', btn.dataset.delLook); loadLooksFeed(); })); }
        function openCompanionsModal(){
            showModal(`<h3 class="modal-title">👥 Попутчики</h3><div class="form-group"><label>Цель</label><input type="text" id="compTarget" placeholder="Например: еду на шахту"></div><div class="form-group"><label>Контакты</label><input type="text" id="compContact" placeholder="@username"></div><button class="btn w-full mb-12" id="compSubmitBtn">Найти напарника</button><div id="companionsList"><div class="loader"></div></div>`);
            loadCompanionsFeed();
            document.getElementById('compSubmitBtn').addEventListener('click', async ()=>{ const target = document.getElementById('compTarget').value.trim(); const contact = document.getElementById('compContact').value.trim(); if(!target || !contact){ showAlert('Ошибка','Заполните все поля'); return; } await supabaseClient.from('companions').insert({ author_id: currentAuthUser.id, author_username: currentAuthUser.username, target, contact, created_at: new Date().toISOString() }); playSfx('success'); document.getElementById('compTarget').value=''; document.getElementById('compContact').value=''; loadCompanionsFeed(); });
        }
        async function loadCompanionsFeed(){ const cont = document.getElementById('companionsList'); if(!cont) return; const { data, error } = await withTimeout(supabaseClient.from('companions').select('*').order('created_at',{ascending:false}), 5000); if(error){ cont.innerHTML='<div class="empty-state">⚠️ Ошибка</div>'; return; } const comps = data || []; if(!comps.length){ cont.innerHTML='<div class="empty-state">👥 Заявок нет</div>'; return; } cont.innerHTML = comps.map(c=>`<div class="card"><div style="font-weight:700;">${c.target}</div><div style="font-size:0.75rem;color:var(--muted);">Автор: ${c.author_username||c.author_id} • Контакт: ${c.contact}</div>${c.author_id===currentAuthUser.id?`<button class="btn danger mt-8" data-del-comp="${c.id}">🗑</button>`:''}</div>`).join(''); cont.querySelectorAll('[data-del-comp]').forEach(btn=>btn.addEventListener('click', async ()=>{ await supabaseClient.from('companions').delete().eq('id', btn.dataset.delComp); loadCompanionsFeed(); })); }
        function openMusicModal(){
            showModal(`<h3 class="modal-title">🎵 Музыка</h3><div class="form-group"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://..."></div><div class="flex-between gap-8 mb-12"><button class="btn w-full" id="musicPlayBtn">▶️ Играть</button><button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button></div><button class="btn danger w-full" id="musicResetBtn">⏹ Сбросить</button>`);
            let activeAudio = window.appCurrentAudio || null;
            document.getElementById('musicPlayBtn').addEventListener('click', ()=>{ const url = document.getElementById('musicUrl').value.trim(); if(url){ if(activeAudio) activeAudio.pause(); activeAudio = new Audio(url); window.appCurrentAudio = activeAudio; activeAudio.play().catch(()=>showAlert('Ошибка','Не удалось воспроизвести')); } else if(activeAudio) activeAudio.play(); });
            document.getElementById('musicPauseBtn').addEventListener('click', ()=>{ if(activeAudio) activeAudio.pause(); });
            document.getElementById('musicResetBtn').addEventListener('click', ()=>{ if(activeAudio){ activeAudio.pause(); window.appCurrentAudio = null; } document.getElementById('musicUrl').value=''; });
        }

        // ---------- ЗАПУСК ----------
        function bootApp() {
            console.log('Boot started');
            // Принудительно скрываем сплэш через 5 секунд, если что-то пошло не так
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash && !splash.classList.contains('hidden')) {
                    splash.classList.add('hidden');
                    if (!currentAuthUser) showAuthScreen();
                }
            }, 5000);
            const telegramOk = initTelegram();
            console.log('Telegram OK:', telegramOk);
            if (!telegramOk) {
                hideSplashAndShowAuth();
                return;
            }
            const supabaseOk = initSupabase();
            console.log('Supabase OK:', supabaseOk);
            if (!supabaseOk) {
                hideSplashAndShowAuth();
                return;
            }
            checkAuth().catch(err => {
                console.error('checkAuth failed:', err);
                hideSplashAndShowAuth();
            });
        }

        // Глобальный обработчик кликов
        document.addEventListener('click', function(e) {
            const selectors = ['.btn','.nav-item','.card','.grid-tile','.link-item','.search-suggestion','.game-click-area','.upgrade-card button','.theme-toggle','.header-logo','.header-search','.modal-close','.auth-tab','.auth-theme-toggle','.star-rating span','[data-link]'];
            if (e.target.closest(selectors.join(','))) { playSfx('click'); hapticFeedback('light'); }
        });

        window.addEventListener('DOMContentLoaded', () => {
            bootApp();
        });
    })();
    </script>
</body>
