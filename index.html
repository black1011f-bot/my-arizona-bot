<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Arizona Online — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============ ПЕРЕМЕННЫЕ ============ */
        :root {
            /* Светлая тема */
            --bg:        #F8FAFC;
            --bg-elevated:#FFFFFF;
            --card:      #FFFFFF;
            --border:    #E2E8F0;
            --border-strong:#CBD5E1;
            --text:      #0F172A;
            --text-soft: #334155;
            --muted:     #64748B;
            --accent:    #7C3AED;
            --accent-hi: #A78BFA;
            --accent-soft:rgba(124,58,237,.10);
            --accent-glow:rgba(124,58,237,.35);
            --gold:      #F59E0B;
            --gold-soft: rgba(245,158,11,.15);
            --success:   #10B981;
            --success-soft:rgba(16,185,129,.12);
            --danger:    #EF4444;
            --danger-soft:rgba(239,68,68,.12);
            --warning:   #F59E0B;
            --info:      #3B82F6;
            --info-soft: rgba(59,130,246,.12);

            --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
            --shadow:    0 2px 8px rgba(15,23,42,.06);
            --shadow-md: 0 4px 16px rgba(15,23,42,.08);
            --shadow-lg: 0 10px 30px rgba(15,23,42,.12);

            --radius:    16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --radius-pill:999px;

            --btn-min-height: 48px;
            --header-height:  60px;
            --nav-height:     64px;

            --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        [data-theme="dark"] {
            --bg:        #0B1120;
            --bg-elevated:#111827;
            --card:      #1E293B;
            --border:    #334155;
            --border-strong:#475569;
            --text:      #F1F5F9;
            --text-soft: #CBD5E1;
            --muted:     #94A3B8;
            --accent:    #A78BFA;
            --accent-hi: #C4B5FD;
            --accent-soft:rgba(167,139,250,.15);
            --accent-glow:rgba(167,139,250,.45);
            --gold:      #FBBF24;
            --gold-soft: rgba(251,191,36,.18);
            --success:   #34D399;
            --success-soft:rgba(52,211,153,.15);
            --danger:    #F87171;
            --danger-soft:rgba(248,113,113,.15);
            --warning:   #FBBF24;
            --info:      #60A5FA;
            --info-soft: rgba(96,165,250,.15);

            --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
            --shadow:    0 2px 8px rgba(0,0,0,.35);
            --shadow-md: 0 4px 16px rgba(0,0,0,.45);
            --shadow-lg: 0 10px 30px rgba(0,0,0,.55);
        }

        /* ============ БАЗА ============ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-body);
        }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s ease, color .3s ease;
            overflow-x: hidden;
            touch-action: manipulation;
            font-size: 16px;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        button, input, textarea, select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }
        a { color: var(--accent); text-decoration: none; }
        img { max-width: 100%; display: block; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
        ::selection { background: var(--accent-soft); color: var(--accent); }

        /* ============ КОНТЕЙНЕР ============ */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 1rem;
            padding-top: calc(var(--header-height) + 1rem);
            padding-bottom: calc(var(--nav-height) + 2rem + env(safe-area-inset-bottom));
        }
        @media (min-width: 768px) {
            .container { max-width: 720px; }
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }
        @media (min-width: 1024px) {
            .container { max-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* ============ ХЕДЕР ============ */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: .6rem 1rem;
            padding-top: calc(.6rem + env(safe-area-inset-top));
            height: calc(var(--header-height) + env(safe-area-inset-top));
            gap: .6rem;
        }
        .header-logo {
            width: 38px; height: 38px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform .15s ease;
        }
        .header-logo:active { transform: scale(.94); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -.02em;
            white-space: nowrap;
            background: linear-gradient(135deg, var(--text), var(--text-soft));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .header-search { flex: 1; cursor: pointer; }
        .header-search input {
            width: 100%;
            padding: .6rem 1rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: .9rem;
            outline: none;
            pointer-events: none;
            transition: border-color .2s ease;
        }
        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem;
            cursor: pointer;
            transition: all .15s ease;
            flex-shrink: 0;
        }
        .theme-toggle:active { transform: scale(.92); }

        /* ============ НИЖНЯЯ НАВИГАЦИЯ ============ */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: saturate(180%) blur(14px);
            -webkit-backdrop-filter: saturate(180%) blur(14px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: .68rem;
            font-weight: 600;
            cursor: pointer;
            padding: .25rem .3rem;
            border-radius: 12px;
            flex: 1;
            max-width: 84px;
            min-height: 48px;
            transition: color .2s ease, background .2s ease, transform .1s ease;
            position: relative;
        }
        .nav-item:active { transform: scale(.94); }
        .nav-item .nav-icon {
            font-size: 1.35rem;
            transition: transform .2s ease;
        }
        .nav-item.active {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .nav-item.active .nav-icon { transform: scale(1.1); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            border-radius: 0 0 3px 3px;
            background: var(--accent);
        }

        /* ============ СЕКЦИИ ============ */
        .section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity .25s ease, transform .25s ease;
        }
        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .section h2 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -.02em;
            margin-bottom: .9rem;
            padding-left: .7rem;
            border-left: 4px solid var(--accent);
            line-height: 1.2;
        }
        .section h3 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -.01em;
            margin: 1.2rem 0 .6rem;
        }

        /* ============ КАРТОЧКИ ============ */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: .9rem;
            margin-bottom: .9rem;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
        .card:active { transform: scale(.985); }
        .card.inactive-card {
            opacity: .65;
            background: color-mix(in srgb, var(--card) 80%, transparent);
        }

        /* ============ AD-CARD ============ */
        .ad-card {
            display: flex;
            gap: .8rem;
            align-items: flex-start;
        }
        .ad-card-img {
            width: 84px; height: 104px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: .2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -.01em;
        }
        .ad-card-price {
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--accent);
            letter-spacing: -.02em;
        }
        .ad-card-badges {
            display: flex;
            gap: .25rem;
            flex-wrap: wrap;
            margin: .35rem 0 .3rem;
        }
        .ad-card-author {
            font-size: .7rem;
            color: var(--muted);
            margin-top: .2rem;
        }

        /* ============ БЕЙДЖИ ============ */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: .18rem .55rem;
            border-radius: var(--radius-pill);
            font-size: .68rem;
            font-weight: 700;
            background: var(--border);
            color: var(--text-soft);
            white-space: nowrap;
            letter-spacing: .01em;
            line-height: 1.2;
        }
        .badge.sell {
            background: var(--success);
            color: #fff;
            box-shadow: 0 0 8px var(--success-soft);
        }
        .badge.buy {
            background: var(--info);
            color: #fff;
            box-shadow: 0 0 8px var(--info-soft);
        }
        .badge.server {
            background: var(--gold-soft);
            color: var(--gold);
            font-weight: 700;
        }
        [data-theme="dark"] .badge.server { color: #FCD34D; }
        .badge.category {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .badge.status-pending { background: var(--warning); color: #1a1a1a; }
        .badge.status-deleted { background: var(--danger); color: #fff; }
        .badge.status-approved { background: var(--success); color: #fff; }

        /* ============ КНОПКИ ============ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            padding: .7rem 1.1rem;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-hi));
            color: #fff;
            font-weight: 700;
            font-size: .9rem;
            cursor: pointer;
            min-height: var(--btn-min-height);
            transition: transform .12s ease, box-shadow .2s ease, opacity .2s ease, filter .2s ease;
            box-shadow: 0 2px 8px var(--accent-glow);
            letter-spacing: .01em;
        }
        .btn:hover { filter: brightness(1.05); box-shadow: 0 4px 16px var(--accent-glow); }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn.secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .btn.secondary:hover { background: var(--bg); border-color: var(--border-strong); }
        .btn.danger { background: linear-gradient(135deg, #EF4444, #F87171); box-shadow: 0 2px 8px var(--danger-soft); }
        .btn.gold { background: linear-gradient(135deg, #F59E0B, #FBBF24); color: #1a1a1a; box-shadow: 0 2px 8px var(--gold-soft); }
        .btn.success { background: linear-gradient(135deg, #10B981, #34D399); box-shadow: 0 2px 8px var(--success-soft); }
        .btn.w-full { width: 100%; }

        /* ============ МОДАЛКИ ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity .25s ease;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            position: relative;
            transform: translateY(20px) scale(.98);
            transition: transform .25s cubic-bezier(.2,.8,.2,1);
        }
        .modal-overlay.show .modal { transform: translateY(0) scale(1); }
        .modal-close {
            position: absolute;
            top: .7rem; right: .7rem;
            background: var(--bg);
            border: 1px solid var(--border);
            width: 32px; height: 32px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            color: var(--muted);
            display: flex; align-items: center; justify-content: center;
            transition: background .15s ease;
        }
        .modal-close:hover { background: var(--border); }
        .modal-title {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -.02em;
            margin-bottom: 1rem;
            padding-right: 2.2rem;
        }

        /* ============ ФОРМЫ ============ */
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: .78rem;
            margin-bottom: .35rem;
            color: var(--muted);
            letter-spacing: .01em;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: .75rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: .92rem;
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--card);
        }
        .form-group textarea { min-height: 100px; resize: vertical; font-family: inherit; }

        /* ============ АВТОРИЗАЦИЯ ============ */
        .auth-container {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: var(--bg);
        }
        .auth-background {
            position: absolute;
            inset: 0;
            background-position: center;
            background-size: cover;
            z-index: -1;
            filter: brightness(.4) blur(2px);
        }
        .auth-background::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 25%, transparent), color-mix(in srgb, var(--bg) 85%, transparent));
        }
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 1.8rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
            animation: authIn .4s ease-out;
        }
        @keyframes authIn {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .auth-title {
            text-align: center;
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: -.03em;
            margin-bottom: .25rem;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .auth-subtitle {
            text-align: center;
            font-size: .82rem;
            color: var(--muted);
            margin-bottom: 1.4rem;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .auth-tab {
            flex: 1;
            padding: .7rem .4rem;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: .9rem;
            transition: color .2s ease;
            position: relative;
        }
        .auth-tab.active { color: var(--accent); }
        .auth-tab.active::after {
            content: '';
            position: absolute;
            left: 20%; right: 20%;
            bottom: -1px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }
        .auth-tab:not(.active) { color: var(--muted); }
        .auth-theme-toggle {
            position: absolute;
            top: 1rem; right: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 36px; height: 36px;
            font-size: 1.05rem;
            cursor: pointer;
            z-index: 2;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-error {
            color: var(--danger);
            font-size: .78rem;
            margin-top: .6rem;
            text-align: center;
            min-height: 1rem;
        }
        .auth-hint {
            color: var(--muted);
            font-size: .72rem;
            margin-top: .4rem;
            text-align: center;
        }

        /* ============ SPLASH ============ */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, var(--bg), color-mix(in srgb, var(--accent) 8%, var(--bg)));
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .8rem;
            transition: opacity .4s ease, visibility .4s ease;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-icon {
            width: 100px; height: 100px;
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 15px 40px var(--accent-glow);
            animation: zoom 1s cubic-bezier(.2,.8,.2,1);
        }
        .splash-icon img { width: 100%; height: 100%; object-fit: cover; }
        .splash-title {
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: -.03em;
            margin-top: .5rem;
            background: linear-gradient(135deg, var(--accent), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .splash-subtitle {
            font-size: .95rem;
            color: var(--muted);
            font-weight: 500;
            letter-spacing: .2em;
            text-transform: uppercase;
        }
        @keyframes zoom {
            0%   { transform: scale(.3); opacity: 0; }
            60%  { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ============ TOAST ============ */
        .toast-container {
            position: fixed;
            top: calc(70px + env(safe-area-inset-top));
            right: 1rem;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: .5rem;
            max-width: 320px;
            pointer-events: none;
        }
        .toast {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: .8rem 1rem;
            font-size: .82rem;
            font-weight: 500;
            box-shadow: var(--shadow-md);
            animation: slideIn .3s cubic-bezier(.2,.8,.2,1);
            transition: opacity .3s, transform .3s;
            pointer-events: auto;
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error   { border-left: 4px solid var(--danger); }
        .toast.info    { border-left: 4px solid var(--accent); }
        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        /* ============ LOADER & SKELETON ============ */
        .loader {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 32px; height: 32px;
            animation: spin .8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--card) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: var(--radius-sm);
        }
        @keyframes skeleton-loading {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============ GRID TILES ============ */
        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: .8rem;
        }
        .grid-tile {
            padding: 1rem;
            border-radius: var(--radius-sm);

    /* ---------- HASH ПАРОЛЯ (с fallback) ---------- */
    // Проблема: crypto.subtle недоступен на HTTP и в некоторых старых WebView.
    // Решение: fallback на JS-реализацию SHA-256.
    const SALT = 'ArizonaOnlineSalt_2024';

    function sha256Fallback(ascii) {
        // Простая реализация SHA-256 (public domain)
        function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
        const mathPow = Math.pow;
        const maxWord = mathPow(2, 32);
        let result = '';
        const words = [];
        const asciiBitLength = ascii.length * 8;

        let hash = sha256Fallback.h = sha256Fallback.h || [];
        const k = sha256Fallback.k = sha256Fallback.k || [];
        let primeCounter = k.length;

        const isComposite = {};
        for (let candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
                for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
            }
        }
        ascii += '\x80';
        while (ascii.length % 64 - 56) ascii += '\x00';
        for (let i = 0; i < ascii.length; i++) {
            const j = ascii.charCodeAt(i);
            if (j >> 8) return '';
            words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words.length] = (asciiBitLength / maxWord) | 0;
        words[words.length] = asciiBitLength;

        for (let j = 0; j < words.length;) {
            const w = words.slice(j, j += 16);
            const oldHash = hash;
            hash = hash.slice(0, 8);
            for (let i = 0; i < 64; i++) {
                const w15 = w[i - 15], w2 = w[i - 2];
                const a = hash[0], e = hash[4];
                const temp1 = hash[7]
                    + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                    + ((e & hash[5]) ^ ((~e) & hash[6]))
                    + k[i]
                    + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16]
                        + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                        + w[i - 7]
                        + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                    ) | 0);
                const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                    + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                hash = [(temp1 + temp2) | 0].concat(hash);
                hash[4] = (hash[4] + temp1) | 0;
            }
            for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
        }
        for (let i = 0; i < 8; i++) {
            for (let j = 3; j + 1; j--) {
                const b = (hash[i] >> (j * 8)) & 255;
                result += ((b < 16) ? 0 : '') + b.toString(16);
            }
        }
        return result;
    }

    async function hashPassword(password) {
        const data = SALT + password;

            } catch (e) {
                warn('crypto.subtle.digest упал, используем fallback:', e);

        }
        // Fallback: чистая JS-реализация

            let base = parseFloat(num.split('к')[0]) || 0;
            let kCount = (num.match(/к/g) || []).length;
            if (kCount === 1) base *= 1000;
            else if (kCount === 2) base *= 1000000;
            else if (kCount === 3) base *= 1000000000;
            return Math.floor(base).toString();
        }
        num = parseInt(num) || 0;
        if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';

        return num.toString();

                warn('supabase-js не загружен');
                return false;
            }
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: { persistSession: false, autoRefreshToken: false }
            });

            return true;

            return false;

    /* ===================== МОДАЛКИ ===================== */
    function showModal(html, onClose) {
        const container = document.getElementById('modalContainer');
        container.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal"><button class="modal-close" id="modalCloseBtn" aria-label="Закрыть">✕</button>' + html + '</div></div>';
        const overlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('modalCloseBtn');
        setTimeout(() => overlay.classList.add('show'), 10);
        function closeModal() {
            overlay.classList.remove('show');
            setTimeout(() => {
                if (overlay.parentNode) overlay.remove();
                if (onClose) onClose();
            }, 250);
        }
        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
        return { overlay, closeModal };
    }

    function showAlert(title, message, type = 'info') {
        const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
        const { closeModal } = showModal(
            '<div style="text-align:center;">' +
            '<div style="font-size:3rem;margin-bottom:0.5rem;">' + icon + '</div>' +
            '<h3 class="modal-title" style="text-align:center;padding:0;">' + title + '</h3>' +
            '<p style="color:var(--muted);margin-bottom:1rem;">' + message + '</p>' +
            '<button class="btn w-full" id="alertOkBtn">ОК</button>' +
            '</div>'
        );
        document.getElementById('alertOkBtn').addEventListener('click', closeModal);
    }

    function showConfirm(title, message, onConfirm) {
        const { closeModal } = showModal(
            '<div style="text-align:center;">' +
            '<div style="font-size:2.5rem;margin-bottom:0.5rem;">⚠️</div>' +
            '<h3 class="modal-title" style="text-align:center;padding:0;">' + title + '</h3>' +
            '<p style="color:var(--muted);margin-bottom:1rem;">' + message + '</p>' +
            '<div class="flex-between gap-12">' +
            '<button class="btn secondary w-full" id="confirmCancelBtn">Отмена</button>' +
            '<button class="btn danger w-full" id="confirmOkBtn">Подтвердить</button>' +
            '</div></div>'
        );
        document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
        document.getElementById('confirmOkBtn').addEventListener('click', () => { closeModal(); onConfirm(); });
    }

    /* ===================== АУТЕНТИФИКАЦИЯ ===================== */
    async function loginWithUsername(username, password) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            showToast('Логин: 3-20 символов (латиница, цифры, _)', 'error');
            return false;
        }
        if (!password || password.length < 6) {
            showToast('Пароль не короче 6 символов', 'error');
            return false;
        }
        try {
            log('Логин:', username);
            const hashedPassword = await hashPassword(password);
            log('Хеш пароля готов');

            const { data: user, error } = await withTimeout(
                supabaseClient.from('app_users').select('*').eq('username', username).maybeSingle(),
                8000
            );

            if (error) {
                warn('Ошибка запроса app_users:', error);
                // Показать детали для отладки
                if (error.message && error.message.includes('relation') && error.message.includes('does not exist')) {
                    showAlert('Ошибка БД', 'Таблица app_users не создана в Supabase', 'error');
                } else {
                    showAlert('Ошибка соединения', error.message || 'Не удалось запросить пользователя', 'error');
                }
                return false;
            }
            if (!user) {
                showAlert('Пользователь не найден', 'Проверьте логин или зарегистрируйтесь', 'error');
                return false;
            }
            if (user.password_hash !== hashedPassword) {
                showAlert('Неверный пароль', 'Попробуйте ещё раз', 'error');
                return false;
            }
            if (user.banned) {
                showBanScreen();
                return false;
            }
            // Обновить telegram_id, если он изменился
            if (tg?.initDataUnsafe?.user && user.telegram_id !== tg.initDataUnsafe.user.id) {
                try {
                    await supabaseClient.from('app_users').update({
                        telegram_id: tg.initDataUnsafe.user.id,
                        telegram_username: tg.initDataUnsafe.user.username
                    }).eq('id', user.id);
                } catch (e) { warn('Ошибка обновления tg_id:', e); }
            }
            currentUser = user;
            localStorage.setItem('arizona_current_user', JSON.stringify(user));
            log('Успешный вход:', user.username);
            return true;
        } catch (e) {
            warn('Login error:', e);
            showToast('Ошибка соединения: ' + (e.message || 'неизвестно'), 'error');
            return false;
        }
    }

    async function registerUser(username, password) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            showToast('Логин: 3-20 символов (латиница, цифры, _)', 'error');
            return false;
        }
        if (!password || password.length < 6) {
            showToast('Пароль не короче 6 символов', 'error');
            return false;
        }
        try {
            log('Регистрация:', username);
            const hashedPassword = await hashPassword(password);

            const { data: existing, error: checkError } = await withTimeout(
                supabaseClient.from('app_users').select('id').eq('username', username).maybeSingle(),
                8000
            );
            if (checkError) {
                warn('Ошибка проверки:', checkError);
                showAlert('Ошибка соединения', checkError.message, 'error');
                return false;
            }
            if (existing) {
                showAlert('Ошибка', 'Пользователь с таким именем уже существует', 'error');
                return false;
            }

            const newUser = {
                username: username,
                password_hash: hashedPassword,
                telegram_id: tg?.initDataUnsafe?.user?.id || null,
                telegram_username: tg?.initDataUnsafe?.user?.username || null,
                banned: false,
                is_admin: username === OWNER_USERNAME,
                created_at: new Date().toISOString()
            };

            const { data: inserted, error: insertError } = await withTimeout(
                supabaseClient.from('app_users').insert(newUser).select().single(),
                8000
            );
            if (insertError) {
                warn('Ошибка вставки:', insertError);
                showAlert('Ошибка БД', insertError.message || 'Не удалось создать аккаунт', 'error');
                return false;
            }
            currentUser = inserted;
            localStorage.setItem('arizona_current_user', JSON.stringify(currentUser));
            log('Регистрация успешна:', inserted.username);

            // Создать настройки и прогресс (не критично, если упадёт)
            try {
                await supabaseClient.from('user_settings').insert({
                    user_id: currentUser.id, theme: 'light', sfx_enabled: true, admin_password_hash: null
                });
            } catch (e) { warn('user_settings insert failed:', e); }
            try {
                await supabaseClient.from('user_progress').insert({
                    user_id: currentUser.id, tutorial_completed: false, admin_tutorial_completed: false
                });
            } catch (e) { warn('user_progress insert failed:', e); }

            return true;
        } catch (e) {
            warn('Register error:', e);
            showToast('Ошибка соединения: ' + (e.message || 'неизвестно'), 'error');
            return false;
        }
    }

    function showAuthScreen(prefillUsername) {
        prefillUsername = prefillUsername || '';
        const container = document.getElementById('authContainer');
        let mode = 'login';
        let isSubmitting = false;
        let initialPrefill = prefillUsername;

        function renderAuthForm(errorMsg) {
            errorMsg = errorMsg || '';
            const bgImg = currentTheme === 'dark'
                ? 'https://i.postimg.cc/yNhGbRG4/1788346347547.jpg'
                : 'https://i.postimg.cc/x8phPS4J/1788346275828.jpg';

            container.innerHTML = (
                '<div class="auth-container">' +
                    '<div class="auth-background" style="background-image:url(\'' + bgImg + '\');"></div>' +
                    '<button class="auth-theme-toggle" id="authThemeToggle" aria-label="Тема">🌓</button>' +
                    '<div class="auth-box">' +
                        '<h2 class="auth-title">Arizona Online</h2>' +
                        '<p class="auth-subtitle">Маркетплейс для Arizona RP</p>' +
                        '<div class="auth-tabs">' +
                            '<button class="auth-tab ' + (mode === 'login' ? 'active' : '') + '" id="authTabLogin" type="button">Вход</button>' +
                            '<button class="auth-tab ' + (mode === 'register' ? 'active' : '') + '" id="authTabRegister" type="button">Создать</button>' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label>Логин</label>' +
                            '<input type="text" id="authUsername" placeholder="username" autocomplete="username" value="' + initialPrefill + '">' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label>Пароль</label>' +
                            '<input type="password" id="authPassword" placeholder="Минимум 6 символов" autocomplete="' + (mode === 'login' ? 'current-password' : 'new-password') + '">' +
                        '</div>' +
                        '<button class="btn w-full" id="authSubmitBtn" type="button"' + (isSubmitting ? ' disabled' : '') + '>' +
                            (isSubmitting ? '⏳ Загрузка...' : (mode === 'login' ? 'Войти' : 'Создать аккаунт')) +
                        '</button>' +
                        '<p class="auth-error" id="authError">' + errorMsg + '</p>' +
                        '<p class="auth-hint">' + (mode === 'login' ? 'Введите свои данные' : 'Придумайте уникальный логин') + '</p>' +
                    '</div>' +
                '</div>'
            );

            document.getElementById('authThemeToggle').addEventListener('click', () => {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                applyTheme();
                renderAuthForm();
            });

            document.getElementById('authTabLogin').addEventListener('click', () => {
                if (mode !== 'login') { mode = 'login'; isSubmitting = false; initialPrefill = ''; renderAuthForm(); }
            });
            document.getElementById('authTabRegister').addEventListener('click', () => {
                if (mode !== 'register') { mode = 'register'; isSubmitting = false; initialPrefill = ''; renderAuthForm(); }
            });

            const submitBtn = document.getElementById('authSubmitBtn');
            submitBtn.addEventListener('click', async () => {
                if (isSubmitting) return;
                const errEl = document.getElementById('authError');
                errEl.textContent = '';

                const username = (document.getElementById('authUsername').value || '').trim().toLowerCase();
                const password = (document.getElementById('authPassword').value || '').trim();

                if (!username) { errEl.textContent = 'Введите логин'; return; }
                if (!password) { errEl.textContent = 'Введите пароль'; return; }

                isSubmitting = true;
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Загрузка...';

                try {
                    let success = false;
                    if (mode === 'login') {
                        success = await loginWithUsername(username, password);
                    } else {
                        success = await registerUser(username, password);
                    }
                    if (success) {
                        container.innerHTML = '';
                        hideSplashAndShowApp();
                        return;
                    }
                } catch (e) {
                    warn('Auth handler error:', e);
                    errEl.textContent = 'Ошибка: ' + (e.message || 'неизвестно');
                } finally {
                    isSubmitting = false;
                    if (document.getElementById('authSubmitBtn')) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
                    }
                }
            });

            // Enter = submit
            const pw = document.getElementById('authPassword');
            if (pw) pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitBtn.click(); });

            setTimeout(() => document.getElementById('authUsername')?.focus(), 150);
        }

        renderAuthForm();
    }

    async function loadUserSettingsAndProgress() {

                supabaseClient.from('user_settings').select('*').eq('user_id', currentUser.id).maybeSingle(),
                5000
            );
            if (se) throw se;
            if (sd) {
                userSettings = sd;
                currentTheme = sd.theme || 'light';
                sfxEnabled = sd.sfx_enabled !== false;
            } else {
                try {
                    await supabaseClient.from('user_settings').insert({
                        user_id: currentUser.id, theme: 'light', sfx_enabled: true, admin_password_hash: null
                    });
                } catch (e) { warn('settings insert failed', e); }
                currentTheme = 'light';
                sfxEnabled = true;
            }
            const { data: pd, error: pe } = await withTimeout(
                supabaseClient.from('user_progress').select('*').eq('user_id', currentUser.id).maybeSingle(),
                5000
            );
            if (pe) throw pe;
            userProgress = pd || {};
        } catch (e) {
            warn('loadUserSettings error:', e);
            currentTheme = 'light';
            sfxEnabled = true;
            userProgress = {};
        }
        applyTheme();
    }

                    .order('created_at', { ascending: false }).limit(10),

    async function saveSearchQuery(query) {
        if (!currentUser || !query) return;
        try {
            await supabaseClient.from('search_history').insert({ user_id: currentUser.id, query });
            const { data: ids } = await supabaseClient.from('search_history').select('id')
                .eq('user_id', currentUser.id).order('created_at', { ascending: false }).range(10, 9999);
            if (ids && ids.length) {
                await supabaseClient.from('search_history').delete().in('id', ids.map(r => r.id));
            }
            await loadSearchHistory();
        } catch (e) { warn('saveSearchQuery:', e); }
    }

    async function loadHomeFeed(reset) {
        if (reset === undefined) reset = true;
        if (isLoadingFeed) return;
        isLoadingFeed = true;
        if (reset) {
            feedPage = 0;
            homeAds = [];
            hasMoreAds = true;
            document.getElementById('homeFeed').innerHTML = '<div class="loader"></div>';
        }
        try {
            const from = feedPage * FEED_PAGE_SIZE;
            const to = from + FEED_PAGE_SIZE - 1;
            let query = supabaseClient.from('ads').select('*')
                .eq('status', 'approved')
                .eq('hidden', false)
                .order('created_at', { ascending: false })
                .range(from, to);
            if (currentFilterServer) query = query.eq('server', currentFilterServer);
            const { data, error } = await withTimeout(query, 8000);
            if (error) throw error;
            const newAds = data || [];
            const validAds = newAds.filter(ad => !ad.expires_at || new Date(ad.expires_at) > new Date());
            homeAds = reset ? validAds : homeAds.concat(validAds);
            if (newAds.length < FEED_PAGE_SIZE) hasMoreAds = false;
            renderHomeFeed();
            feedPage++;
        } catch (e) {
            warn('loadHomeFeed error:', e);
            if (reset) {
                document.getElementById('homeFeed').innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
            } else {
                showToast('Не удалось загрузить ещё объявления', 'error');
            }
        } finally {
            isLoadingFeed = false;
        }
    }

    function renderHomeFeed() {
        const cont = document.getElementById('homeFeed');
        if (!homeAds.length) {
            cont.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>';
            return;
        }
        let html = '';
        homeAds.forEach(ad => {
            const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
            const img = firstImg || DEFAULT_AD_IMAGE;
            const modeBadge = ad.mode === 'sell'
                ? '<span class="badge sell">Продажа</span>'
                : '<span class="badge buy">Покупка</span>';
            const catLabel = (ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category || '');
            let timer = '';
            if (ad.expires_at) {
                const diff = new Date(ad.expires_at) - new Date();
                if (diff > 0) {
                    const total = Math.floor(diff / 1000);
                    const h = Math.floor(total / 3600);
                    const m = Math.floor((total % 3600) / 60);
                    const s = total % 60;
                    timer = '<div class="countdown-timer">⏳ ' + h.toString().padStart(2, '0') + ':' + m.toString().padStart(2, '0') + ':' + s.toString().padStart(2, '0') + '</div>';
                } else {
                    timer = '<div class="countdown-timer">⚠️ Удалено</div>';
                }
            }
            html += (
                '<div class="card ad-card" data-ad-id="' + ad.id + '">' +
                    '<div class="img-container" style="width:84px;height:104px;border-radius:12px;flex-shrink:0;background:var(--border);">' +
                        '<div class="skeleton" style="position:absolute;inset:0;border-radius:12px;"></div>' +
                        '<img src="' + img + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;position:relative;z-index:1;" onload="this.classList.add(\'loaded\');this.previousElementSibling&&this.previousElementSibling.remove();" onerror="this.style.display=\'none\';">' +
                    '</div>' +
                    '<div class="ad-card-info">' +
                        '<div class="ad-card-title">' + (ad.item_name || 'Без названия') + '</div>' +
                        '<div class="ad-card-price">' + formatPrice(ad.price) + '</div>' +
                        '<div class="ad-card-badges">' + modeBadge + '<span class="badge server">' + ad.server + '</span><span class="badge category">' + catLabel + '</span></div>' +
                        '<div class="ad-card-author">Автор: ' + (ad.author_username || ad.author_id) + '</div>' +
                        timer +
                    '</div>' +
                '</div>'
            );
        });
        cont.innerHTML = html;
        cont.querySelectorAll('.ad-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = card.dataset.adId;
                const ad = homeAds.find(a => a.id == id);
                if (ad) openAdDetail(ad);
            });
        });
    }

    function initSendForm() {
        const priceInput = document.getElementById('sendPrice');
        priceInput.removeEventListener('input', formatPriceInputHandler);
        priceInput.addEventListener('input', formatPriceInputHandler);

        const typeBtn = document.getElementById('sendTypeBtn');
        typeBtn.onclick = () => {
            const { closeModal } = showModal(
                '<h3 class="modal-title">Тип сделки</h3>' +

                '</div>'
            );
            document.querySelectorAll('#modalOverlay [data-type]').forEach(t => {
                t.addEventListener('click', () => {
                    sendFormData.type = t.dataset.type;
                    typeBtn.textContent = t.dataset.type === 'sell' ? 'Продажа' : 'Покупка';
                    closeModal();
                });
            });
        };

        const catBtn = document.getElementById('sendCategoryBtn');
        catBtn.onclick = () => {
            const { closeModal } = showModal(
                '<h3 class="modal-title">Категория</h3>' +
                '<div class="grid-tiles">' +
                    ALL_CATEGORIES.map(c => '<div class="grid-tile ' + (sendFormData.category === c.id ? 'active' : '') + '" data-cat="' + c.id + '">' + c.label + '</div>').join('') +
                '</div>'
            );
            document.querySelectorAll('#modalOverlay [data-cat]').forEach(t => {
                t.addEventListener('click', () => {
                    sendFormData.category = t.dataset.cat;
                    catBtn.textContent = ALL_CATEGORIES.find(c => c.id === t.dataset.cat).label;
                    closeModal();
                });
            });
        };

        const serverBtn = document.getElementById('sendServerBtn');
        serverBtn.onclick = () => {
            const { closeModal } = showModal(
                '<h3 class="modal-title">Сервер</h3>' +
                '<div class="grid-tiles">' +
                    ALL_SERVERS.map(s => '<div class="grid-tile ' + (sendFormData.server === s ? 'active' : '') + '" data-server="' + s + '">' + s + '</div>').join('') +
                '</div>'
            );
            document.querySelectorAll('#modalOverlay [data-server]').forEach(t => {
                t.addEventListener('click', () => {
                    sendFormData.server = t.dataset.server;
                    serverBtn.textContent = t.dataset.server;
                    closeModal();
                });
            });
        };

        const submitBtn = document.getElementById('sendSubmitBtn');
        submitBtn.onclick = async () => {
            if (!currentUser) { showAlert('Ошибка', 'Вы не авторизованы'); return; }
            const itemName = document.getElementById('sendName').value.trim();
            const priceRaw = document.getElementById('sendPrice').value.trim();
            const description = document.getElementById('sendDescription').value.trim();
            const images = document.getElementById('sendImages').value.trim();

            if (!itemName || !priceRaw || !description) {
                showAlert('Ошибка', 'Заполните все обязательные поля');
                return;
            }
            const forbidden = checkForbiddenWords(itemName + ' ' + description);
            if (forbidden) { showAlert('Ошибка', forbidden); return; }

            const linkCheck = checkLinksString(images);
            if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
            for (let link of linkCheck.links) {
                const safety = await checkLinkSafety(link);
                if (!safety.safe) { showAlert('Ошибка', safety.message); return; }
            }

            const last = localStorage.getItem('arizona_last_submit_time');
            if (last) {
                const diff = Date.now() - parseInt(last);
                if (diff < SUBMIT_COOLDOWN_MS) {
                    showAlert('Подождите', 'Следующая отправка через ' + Math.ceil((SUBMIT_COOLDOWN_MS - diff) / 1000) + ' сек.');
                    return;
                }
            }
            if (!sendFormData.category || !sendFormData.server) {
                showAlert('Ошибка', 'Выберите категорию и сервер');
                return;
            }

            const userAge = Date.now() - new Date(currentUser.created_at).getTime();
            const isNewUser = userAge < 24 * 60 * 60 * 1000;
            if (isNewUser) {
                try {
                    const { count } = await supabaseClient.from('ads')
                        .select('*', { count: 'exact', head: true }).eq('author_id', currentUser.id);
                    if (count >= NEW_USER_LIMIT) {
                        showAlert('Лимит', 'Новые пользователи могут размещать не более ' + NEW_USER_LIMIT + ' объявлений в первые 24 часа.');
                        return;
                    }
                } catch (e) { warn('limit check failed', e); }
            }

            await submitAd(itemName, priceRaw, description, images, sendFormData);
        };
    }

    async function submitAd(itemName, priceRaw, description, images, formData) {
        const newAd = {
            mode: formData.type,
            category: formData.category,
            item_name: itemName,
            price: parsePriceToNumber(priceRaw),
            description: description,
            images: images,
            server: formData.server,
            author_id: currentUser.id,
            author_username: currentUser.username,
            status: 'pending',
            created_at: new Date().toISOString(),
            expires_at: null,
            hidden: false
        };
        try {
            const { error } = await withTimeout(supabaseClient.from('ads').insert(newAd), 8000);
            if (error) throw error;
            localStorage.setItem('arizona_last_submit_time', Date.now().toString());
            playSfx('success');
            showToast('Объявление отправлено на модерацию', 'success');
            document.getElementById('sendName').value = '';
            document.getElementById('sendPrice').value = '';
            document.getElementById('sendDescription').value = '';
            document.getElementById('sendImages').value = '';
            sendFormData = { type: 'sell', category: null, server: null };
            document.getElementById('sendTypeBtn').textContent = 'Продажа';
            document.getElementById('sendCategoryBtn').textContent = 'Выберите категорию';
            document.getElementById('sendServerBtn').textContent = 'Выберите сервер';
            if (currentSection === 'all') loadMyAds();
        } catch (e) {
            warn('submitAd error:', e);
            showAlert('Ошибка', 'Не удалось отправить: ' + (e.message || ''));
        }
    }

    function bindAdminEvents() {
        document.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', async () => {
            const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
            await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', btn.dataset.approve);
            await logModeratorAction('approve_ad', btn.dataset.approve);
            loadAdminPanel();
            loadHomeFeed(true);
        }));
        document.querySelectorAll('[data-reject]').forEach(btn => btn.addEventListener('click', async () => {
            await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
            await logModeratorAction('reject_ad', btn.dataset.reject);
            loadAdminPanel();
        }));
        document.querySelectorAll('[data-edit-ad]').forEach(btn => btn.addEventListener('click', () => {
            const ad = pendingAds.find(a => a.id == btn.dataset.editAd);
            if (ad) openAdminEditModal(ad);
        }));
        document.querySelectorAll('[data-approve-appeal]').forEach(btn => btn.addEventListener('click', async () => {
            const ap = pendingAppeals.find(a => a.id == btn.dataset.approveAppeal);
            if (ap) {
                const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();
                await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', ap.ad_id);
            }
            await supabaseClient.from('appeals').update({ status: 'approved' }).eq('id', btn.dataset.approveAppeal);
            await logModeratorAction('approve_appeal', btn.dataset.approveAppeal);
            loadAdminPanel();
        }));
        document.querySelectorAll('[data-reject-appeal]').forEach(btn => btn.addEventListener('click', async () => {
            await supabaseClient.from('appeals').update({ status: 'rejected' }).eq('id', btn.dataset.rejectAppeal);
            await logModeratorAction('reject_appeal', btn.dataset.rejectAppeal);
            loadAdminPanel();
        }));
        document.querySelectorAll('[data-approve-report]').forEach(btn => btn.addEventListener('click', async () => {
            const rp = pendingReports.find(r => r.id == btn.dataset.approveReport);
            if (rp) await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', rp.ad_id);
            await supabaseClient.from('reports').update({ status: 'approved' }).eq('id', btn.dataset.approveReport);
            await logModeratorAction('approve_report', btn.dataset.approveReport);
            loadAdminPanel();
        }));
        document.querySelectorAll('[data-reject-report]').forEach(btn => btn.addEventListener('click', async () => {
            await supabaseClient.from('reports').update({ status: 'rejected' }).eq('id', btn.dataset.rejectReport);
            await logModeratorAction('reject_report', btn.dataset.rejectReport);
            loadAdminPanel();
        }));
        document.querySelectorAll('[data-ignore-user-report]').forEach(btn => btn.addEventListener('click', async () => {
            await supabaseClient.from('user_reports').update({ status: 'rejected' }).eq('id', btn.dataset.ignoreUserReport);
            loadAdminPanel();
        }));
        if (isOwner) {
            document.getElementById('adminBanBtn')?.addEventListener('click', () => adminUserAction('ban'));
            document.getElementById('adminUnbanBtn')?.addEventListener('click', () => adminUserAction('unban'));
            document.getElementById('adminMakeAdminBtn')?.addEventListener('click', () => adminUserAction('make_admin'));
            document.getElementById('adminRemoveAdminBtn')?.addEventListener('click', () => adminUserAction('remove_admin'));
            document.getElementById('adminAllFunctionsBtn')?.addEventListener('click', openAdminAllFunctions);
            document.getElementById('adminClearFeedBtn')?.addEventListener('click', async () => {
                showConfirm('Очистка', 'Удалить ВСЕ объявления?', async () => {
                    await supabaseClient.from('ads').delete().neq('id', 0);
                    await supabaseClient.from('favorites').delete().neq('id', 0);
                    await logModeratorAction('clear_feed', 'all');
                    loadAdminPanel();
                    loadHomeFeed(true);
                });
            });
            document.querySelectorAll('[data-ban-user]').forEach(btn => btn.addEventListener('click', async () => {
                await supabaseClient.from('app_users').update({ banned: true }).eq('id', btn.dataset.banUser);
                await supabaseClient.from('user_reports').update({ status: 'approved' }).eq('reported_user_id', btn.dataset.banUser);
                await logModeratorAction('ban_user', btn.dataset.banUser);
                loadAdminPanel();

    async function loadModeratorLogsForUser(username) {
        username = username || '';
        let query = supabaseClient.from('moderator_logs').select('*').order('created_at', { ascending: false }).limit(100);
        if (username) query = query.or('details.ilike.%' + username + '%,moderator_username.ilike.%' + username + '%');
        const { data, error } = await withTimeout(query, 5000);
        if (error) { showAlert('Ошибка', 'Не удалось загрузить журнал'); return; }
        const logs = data || [];
        if (!logs.length) { showAlert('Пусто', 'Записей не найдено'); return; }
        const html = logs.map(log => {
            const time = new Date(log.created_at).toLocaleString('ru-RU');
            return (
                '<div class="card" style="cursor:default;">' +
                    '<div><strong>' + (log.moderator_username || log.moderator_id) + '</strong> (ID: ' + log.moderator_id + ')</div>' +
                    '<div style="font-size:.8rem;">Действие: ' + log.action + '</div>' +
                    '<div style="font-size:.75rem;color:var(--muted);">Детали: ' + log.details + '</div>' +
                    '<div style="font-size:.7rem;color:var(--muted);">' + time + '</div>' +
                '</div>'
            );
        }).join('');
        showModal('<h3 class="modal-title">📜 Журнал модераторов</h3>' + html);
    }

    async function loadAdminAuditForUser(username) {
        username = username || '';
        let query = supabaseClient.from('moderator_logs').select('*').order('created_at', { ascending: false }).limit(500);
        if (username) query = query.or('details.ilike.%' + username + '%,moderator_username.ilike.%' + username + '%');
        const { data, error } = await withTimeout(query, 5000);
        if (error) { showAlert('Ошибка', 'Не удалось загрузить аудит'); return; }
        const logs = data || [];
        if (!logs.length) { showAlert('Пусто', 'Действий не найдено'); return; }
        const stats = {};
        logs.forEach(log => { stats[log.action] = (stats[log.action] || 0) + 1; });
        let html = '<h4>Статистика действий</h4>';
        for (const action in stats) html += '<div>' + action + ': ' + stats[action] + '</div>';
        html += '<hr style="margin:.8rem 0;border:none;border-top:1px solid var(--border);">';
        html += logs.slice(0, 20).map(log => (
            '<div style="font-size:.75rem;padding:.3rem 0;">' +
                log.moderator_username + ' — ' + log.action + ' — ' + log.details + ' — ' +
                new Date(log.created_at).toLocaleString('ru-RU') +
            '</div>'
        )).join('');
        showModal('<h3 class="modal-title">🔍 Аудит модераторов</h3>' + html);
    }

    async function adminUserAction(action) {
        const target = document.getElementById('adminUsernameInput').value.trim();
        if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
        try {
            let q = supabaseClient.from('app_users').select('*');
            if (!isNaN(target)) q = q.eq('id', target);
            else q = q.eq('username', target);
            const { data: users, error } = await withTimeout(q, 5000);
            if (error) throw error;
            if (!users.length) { showAlert('Ошибка', 'Пользователь не найден'); return; }
            const user = users[0];
            if (action === 'ban') await supabaseClient.from('app_users').update({ banned: true }).eq('id', user.id);
            else if (action === 'unban') await supabaseClient.from('app_users').update({ banned: false }).eq('id', user.id);
            else if (action === 'make_admin') await supabaseClient.from('app_users').update({ is_admin: true }).eq('id', user.id);
            else if (action === 'remove_admin') await supabaseClient.from('app_users').update({ is_admin: false }).eq('id', user.id);
            await logModeratorAction(action, user.id);
            playSfx('success');
            showAlert('Успех', 'Действие выполнено');
            loadAdminPanel();
        } catch (e) { showAlert('Ошибка', 'Не удалось выполнить'); }
    }

    async function checkIfInCart(adId) {
        if (!currentUser) return false;
        try {
            const { data } = await supabaseClient.from('favorites').select('*').eq('user_id', currentUser.id).eq('ad_id', adId).maybeSingle();
            return !!data;
        } catch (e) { return false; }
    }

    async function loadReviews(adId) {
        const cont = document.getElementById('detailReviewsSection');
        if (!cont) return;
        try {
            const { data: reviews, error } = await withTimeout(
                supabaseClient.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false }),
                5000
            );
            if (error) throw error;
            const revs = reviews || [];
            if (!revs.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:.85rem;margin-top:1rem;">⭐ Отзывов пока нет</p>'; return; }
            const avg = revs.reduce((s, r) => s + r.stars, 0) / revs.length;
            let html = (
                '<div style="margin-top:1rem;">' +
                    '<div style="font-size:1.1rem;font-weight:800;">⭐ ' + avg.toFixed(1) + ' <span style="color:var(--muted);font-size:.85rem;font-weight:500;">(' + revs.length + ' отзывов)</span></div>' +
                    '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>' +
                '</div>'
            );
            revs.forEach(r => {
                const canEdit = r.author_id === currentUser.id && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                const canDelete = r.author_id === currentUser.id || isOwner;
                const isSeller = r.author_id === currentUser.id;
                html += (
                    '<div class="review-item">' +
                        '<div style="font-weight:600;font-size:.9rem;">' + (r.author_username || r.author_id) +
                            ' <span style="color:var(--gold);">' + '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars) + '</span>' +
                        '</div>' +
                        '<div style="font-size:.7rem;color:var(--muted);">' + new Date(r.created_at).toLocaleDateString('ru-RU') + '</div>' +
                        '<p style="font-size:.82rem;margin:.3rem 0;white-space:pre-wrap;word-break:break-word;">' + (r.text || '') + '</p>' +
                        (r.media_links ? '<div style="font-size:.7rem;color:var(--accent);word-break:break-all;">' + r.media_links + '</div>' : '')
                );
                if (r.reply_text) {
                    html += '<div style="margin-left:1rem;padding:.5rem;background:var(--bg);border-radius:8px;margin-top:.4rem;"><strong style="font-size:.75rem;">Ответ продавца:</strong><div style="font-size:.8rem;">' + r.reply_text + '</div></div>';
                } else if (isSeller || isOwner) {
                    html += '<button class="btn secondary mt-8" data-reply-review="' + r.id + '" style="min-height:36px;padding:.4rem .8rem;font-size:.75rem;">💬 Ответить</button>';
                }
                if (canEdit || canDelete) {
                    html += '<div class="flex-between gap-8 mt-8">';
                    if (canEdit) html += '<button class="btn secondary" data-edit-review="' + r.id + '" style="min-height:36px;padding:.4rem .8rem;font-size:.75rem;">✏️</button>';
                    if (canDelete) html += '<button class="btn danger" data-del-review="' + r.id + '" style="min-height:36px;padding:.4rem .8rem;font-size:.75rem;">🗑</button>';
                    html += '</div>';
                }
                html += '</div>';
            });
            cont.innerHTML = html;
            cont.querySelectorAll('[data-edit-review]').forEach(btn => btn.addEventListener('click', () => {
                const r = revs.find(x => x.id == btn.dataset.editReview);
                if (r) openEditReviewModal(r);
            }));
            cont.querySelectorAll('[data-del-review]').forEach(btn => btn.addEventListener('click', async () => {
                await supabaseClient.from('reviews').delete().eq('id', btn.dataset.delReview);

    function openReviewsModal(adId) {
        const { closeModal } = showModal(
            '<h3 class="modal-title">⭐ Оставить отзыв</h3>' +
            '<div class="form-group"><label>Оценка</label>' +
                '<div class="star-rating" id="reviewStars">' +
                    [1, 2, 3, 4, 5].map(i => '<span data-star="' + i + '">☆</span>').join('') +
                '</div>' +
            '</div>' +
            '<div class="form-group"><label>Ссылки на медиа (опционально)</label><input type="text" id="reviewMedia" placeholder="https://..."></div>' +
            '<div class="form-group"><label>Текст</label><textarea id="reviewText" placeholder="Поделитесь впечатлением..."></textarea></div>' +
            '<button class="btn w-full" id="reviewSubmitBtn">Отправить</button>'
        );
        let selected = 0;
        const stars = document.getElementById('reviewStars');
        stars.querySelectorAll('span').forEach(s => s.addEventListener('click', () => {
            selected = parseInt(s.dataset.star);
            updateStars(stars, selected);
        }));
        document.getElementById('reviewSubmitBtn').addEventListener('click', async () => {
            if (!selected) { showAlert('Ошибка', 'Выберите оценку'); return; }
            const text = document.getElementById('reviewText').value.trim();
            const forbidden = checkForbiddenWords(text);
            if (forbidden) { showAlert('Ошибка', forbidden); return; }
            const media = document.getElementById('reviewMedia').value.trim();
            const lc = checkLinksString(media);
            if (!lc.valid) { showAlert('Ошибка', lc.message); return; }
            for (let link of lc.links) {
                const safety = await checkLinkSafety(link);
                if (!safety.safe) { showAlert('Ошибка', safety.message); return; }
            }
            try {
                await supabaseClient.from('reviews').insert({
                    ad_id: adId, author_id: currentUser.id, author_username: currentUser.username,
                    stars: selected, text: text, media_links: media, created_at: new Date().toISOString()
                });
                playSfx('success');
                showAlert('Успех', 'Отзыв отправлен');
                closeModal();
                loadReviews(adId);
            } catch (e) { showAlert('Ошибка', 'Не удалось отправить отзыв'); }
        });
    }

    function updateStars(container, selected) {
        container.querySelectorAll('span').forEach(s => {
            const v = parseInt(s.dataset.star);
            s.textContent = v <= selected ? '★' : '☆';
            s.classList.toggle('active', v <= selected);
        });
    }

            if (!searchHistory.length) { hist.innerHTML = ''; return; }
            hist.innerHTML = '<div style="font-size:.75rem;color:var(--muted);margin-bottom:.5rem;">📜 История:</div>' +
                searchHistory.map(h => '<span class="badge" style="cursor:pointer;margin:.15rem;background:var(--accent-soft);color:var(--accent);" data-hist="' + h + '">' + h + '</span>').join('');
            hist.querySelectorAll('[data-hist]').forEach(el => el.addEventListener('click', () => {
                input.value = el.dataset.hist;
                input.dispatchEvent(new Event('input'));
            }));
        }
        renderHist();

        input.addEventListener('input', async () => {
            const q = input.value.trim().toLowerCase();
            if (!q) { sugg.innerHTML = ''; res.innerHTML = ''; return; }
            const { data, error } = await withTimeout(
                supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false)
                    .ilike('item_name', '%' + q + '%').limit(5), 5000
            );
            if (error) return;
            const items = data || [];
            sugg.innerHTML = items.map(ad => '<div class="search-suggestion" data-sug="' + ad.id + '">📦 ' + ad.item_name + ' • ' + formatPrice(ad.price) + '</div>').join('');
            sugg.querySelectorAll('[data-sug]').forEach(el => el.addEventListener('click', () => {
                const ad = items.find(a => a.id == el.dataset.sug);
                if (ad) { saveSearchQuery(q); closeModal(); openAdDetail(ad); }
            }));
        });

        document.getElementById('searchItemBtn').addEventListener('click', async () => {
            const q = input.value.trim().toLowerCase();
            if (!q) return;
            saveSearchQuery(q);
            const { data, error } = await withTimeout(
                supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false)
                    .ilike('item_name', '%' + q + '%'), 5000
            );
            if (error) return;
            const items = data || [];
            if (!items.length) { res.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
            res.innerHTML = items.map(ad =>
                '<div class="card" data-res-id="' + ad.id + '">' +
                    '<div style="font-weight:700;">' + ad.item_name + '</div>' +
                    '<div style="font-size:.75rem;color:var(--muted);">' + ad.server + ' • ' + formatPrice(ad.price) + '</div>' +
                '</div>'
            ).join('');
            res.querySelectorAll('[data-res-id]').forEach(card => card.addEventListener('click', () => {
                const ad = items.find(a => a.id == card.dataset.resId);
                if (ad) { closeModal(); openAdDetail(ad); }
            }));
        });

        document.getElementById('searchProfileBtn').addEventListener('click', () => {
            const q = input.value.trim();
            if (q) { closeModal(); openProfileModal(q); }
        });
    }

    /* ===================== ЗАПУСК ===================== */
    function bootApp() {
        log('Boot started');
        const tgUsername = initTelegram();
        const supabaseOk = initSupabase();

        if (!supabaseOk) {
            document.body.innerHTML = '<div style="text-align:center;margin-top:50vh;padding:2rem;color:#EF4444;font-family:sans-serif;">Ошибка подключения к базе данных. Обновите страницу.</div>';
            return;
        }

        setTimeout(async () => {
            const splash = document.getElementById('splash-screen');
            if (!splash) return;
            splash.classList.add('hidden');

            const saved = localStorage.getItem('arizona_current_user');
            if (!saved) {
                showAuthScreen(tgUsername || '');
                return;
            }
            try {
                currentUser = JSON.parse(saved);
                log('Проверка сессии для', currentUser.username);
                const { data, error } = await supabaseClient
                    .from('app_users').select('*').eq('id', currentUser.id).maybeSingle();

                if (error) {
                    warn('session check error', error);
                    localStorage.removeItem('arizona_current_user');
                    currentUser = null;
                    showAuthScreen(tgUsername || '');
                    return;
                }
                if (!data || data.banned) {
                    if (data && data.banned) { showBanScreen(); return; }
                    localStorage.removeItem('arizona_current_user');
                    currentUser = null;
                    showAuthScreen(tgUsername || '');
                    return;
                }
                currentUser = data;
                hideSplashAndShowApp();
            } catch (e) {
                warn('boot session error', e);
                localStorage.removeItem('arizona_current_user');
                currentUser = null;
                showAuthScreen(tgUsername || '');
            }
        }, SPLASH_DURATION);
    }

    /* ===================== ГЛОБАЛЬНЫЕ СОБЫТИЯ ===================== */
    document.addEventListener('click', function(e) {
        const selectors = '.btn,.nav-item,.card,.grid-tile,.link-item,.search-suggestion,.theme-toggle,.header-logo,.header-search,.modal-close,.auth-theme-toggle,.star-rating span';
        if (e.target.closest(selectors)) {
            playSfx('click');
            hapticFeedback('light');
        }
    });

    // Предотвратить случайный скролл body когда открыта модалка
    document.addEventListener('touchmove', function(e) {
        if (document.querySelector('.modal-overlay.show') && !e.target.closest('.modal')) {
            e.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('DOMContentLoaded', bootApp);

})();
</script>
