<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arizona RP — Wildberries Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preload" as="image" href="https://i.postimg.cc/WzMP51cN/1786185439356.png">
    <link rel="preload" as="image" href="https://i.postimg.cc/63ZPKJ0V/becbb63958da140ca4a1c73b8e0fce12-(2).jpg">
    <style>
        /* ============================================================
           ГЛАВНЫЕ ПЕРЕМЕННЫЕ (Wildberries-стиль)
           ============================================================ */
        :root {
            /* Цвета и фоны */
            --app-bg: #f7f7fa;
            --app-card-bg: #ffffff;
            --app-header-bg: #ffffff;
            --app-card-border: #e5e5ea;
            --app-accent: #cb11ab;
            --app-accent-secondary: #ff5ecf;
            --app-accent-gold: #ffb800;
            --app-accent-red: #ff3b30;
            --app-text-main: #1c1c1e;
            --app-text-muted: #8e8e93;

            /* Градиенты кнопок */
            --app-btn-bg: linear-gradient(135deg, #cb11ab 0%, #7b0e6a 100%);
            --app-btn-hover: linear-gradient(135deg, #e022c0 0%, #8f1180 100%);
            --app-btn-text: #ffffff;

            /* Радиусы */
            --app-radius-sm: 12px;
            --app-radius-md: 16px;
            --app-radius-lg: 20px;
            --app-radius-xl: 24px;
            --app-radius-round: 50%;

            /* Тени */
            --app-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --app-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);

            /* Шрифты */
            --app-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

            /* Анимации */
            --app-transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);

            /* Отступы */
            --app-spacing-xs: 4px;
            --app-spacing-sm: 8px;
            --app-spacing-md: 12px;
            --app-spacing-lg: 16px;
            --app-spacing-xl: 20px;
            --app-spacing-xxl: 32px;

            /* Размеры */
            --app-max-width: 1200px;
            --app-tab-bar-height: 60px;
            --app-header-height: 52px;
            --app-border-width: 1px;
            --app-card-gap: 14px;

            /* Шрифтовые размеры */
            --app-font-size-xs: 10px;
            --app-font-size-sm: 12px;
            --app-font-size-md: 14px;
            --app-font-size-lg: 16px;
            --app-font-size-xl: 20px;
            --app-font-size-xxl: 24px;

            /* Кнопки */
            --app-btn-padding: 10px 16px;
            --app-btn-font-size: 13px;

            /* Поля ввода */
            --app-input-padding: 10px 14px;
            --app-input-font-size: 13px;

            /* Бейджи */
            --app-badge-radius: 12px;

            /* Карточки */
            --app-card-radius: 18px;

            /* Модальные окна */
            --app-modal-radius: 24px;

            /* Прочее */
            --app-overlay-bg: rgba(0, 0, 0, 0.6);
            --app-scrollbar-width: 4px;
            --app-scrollbar-thumb: #c4c4c6;
            --app-focus-ring: 0 0 0 2px rgba(203, 17, 171, 0.5);
            --app-disabled-opacity: 0.5;
            --app-user-select: none;
            --app-tap-highlight: transparent;
        }

        /* Тёмная тема */
        body.theme-dark {
            --app-bg: #0f0f0f;
            --app-card-bg: #1c1c1e;
            --app-header-bg: #171717;
            --app-card-border: #2c2c2e;
            --app-accent: #cb11ab;
            --app-accent-secondary: #ff5ecf;
            --app-accent-gold: #ffb800;
            --app-accent-red: #ff3b30;
            --app-text-main: #ffffff;
            --app-text-muted: #8e8e93;
            --app-btn-bg: linear-gradient(135deg, #cb11ab 0%, #7b0e6a 100%);
            --app-btn-hover: linear-gradient(135deg, #e022c0 0%, #8f1180 100%);
            --app-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --app-shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.45);
            --app-overlay-bg: rgba(0, 0, 0, 0.75);
            --app-scrollbar-thumb: #3a3a3c;
        }

        /* ============================================================
           СБРОС СТИЛЕЙ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--app-font);
            background: var(--app-bg);
            color: var(--app-text-main);
            line-height: 1.5;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background var(--app-transition), color var(--app-transition);
            margin: 0;
            padding: 0;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            loading: lazy;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            color: inherit;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: all var(--app-transition);
        }

        button:focus-visible {
            box-shadow: var(--app-focus-ring);
        }

        input,
        textarea,
        select {
            font-family: inherit;
            font-size: var(--app-input-font-size);
            width: 100%;
            padding: var(--app-input-padding);
            border-radius: var(--app-radius-md);
            border: 1px solid var(--app-card-border);
            background: var(--app-card-bg);
            color: var(--app-text-main);
            outline: none;
            transition: border-color var(--app-transition), box-shadow var(--app-transition);
            -webkit-appearance: none;
            appearance: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--app-accent);
            box-shadow: var(--app-focus-ring);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        label {
            display: block;
            font-size: var(--app-font-size-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--app-text-muted);
            margin-bottom: 4px;
        }

        ::-webkit-scrollbar {
            width: var(--app-scrollbar-width);
            height: var(--app-scrollbar-width);
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--app-scrollbar-thumb);
            border-radius: 4px;
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕЙНЕР
           ============================================================ */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: var(--app-max-width);
            width: 100%;
            margin: 0 auto;
            padding: 0 12px 80px;
            position: relative;
            transition: max-width var(--app-transition);
        }

        /* ============================================================
           ШАПКА
           ============================================================ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--app-header-bg);
            border-bottom: 1px solid var(--app-card-border);
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: var(--app-header-height);
            transition: background var(--app-transition), border-color var(--app-transition);
        }
        .app-header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 18px;
            color: var(--app-text-main);
            text-decoration: none;
        }
        .app-header-brand-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--app-accent);
        }
        .app-header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--app-card-bg);
            border: 1px solid var(--app-card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            position: relative;
        }
        .app-icon-btn .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background: var(--app-accent-red);
            border-radius: 50%;
            border: 2px solid var(--app-card-bg);
            display: none;
        }
        .app-icon-btn .badge-dot.visible {
            display: block;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* ============================================================
           БАННЕР УВЕДОМЛЕНИЯ
           ============================================================ */
        .broadcast-banner {
            background: var(--app-accent);
            color: #fff;
            padding: 10px 40px 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0;
            cursor: pointer;
            position: relative;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }
        .broadcast-banner .close-broadcast {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }

        /* ============================================================
           ШИРОКИЙ БАННЕР
           ============================================================ */
        .welcome-banner-wide {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 12px 0;
        }
        .welcome-banner-wide img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ============================================================
           НИЖНЯЯ НАВИГАЦИЯ
           ============================================================ */
        .tab-bar {
            display: flex;
            justify-content: space-around;
            background: var(--app-header-bg);
            border-top: 1px solid var(--app-card-border);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            min-height: 60px;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        .tab-bar-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--app-text-muted);
            font-size: 10px;
            font-weight: 600;
            position: relative;
        }
        .tab-bar-item .tab-icon {
            font-size: 22px;
        }
        .tab-bar-item.active {
            color: var(--app-accent);
        }
        .tab-bar-item.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            right: 25%;
            height: 3px;
            background: var(--app-accent);
            border-radius: 0 0 4px 4px;
        }

        /* ============================================================
           ОСНОВНОЙ КОНТЕНТ
           ============================================================ */
        .app-content {
            flex: 1;
            padding: 12px 0;
            padding-bottom: calc(var(--app-tab-bar-height) + 20px + env(safe-area-inset-bottom, 0));
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .section {
            display: none;
            animation: fadeIn 0.25s ease-out;
        }
        .section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           КАРТОЧКИ
           ============================================================ */
        .card {
            background: var(--app-card-bg);
            border-radius: var(--app-card-radius);
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--app-shadow);
        }

        /* ============================================================
           СЕТКИ ОБЪЯВЛЕНИЙ
           ============================================================ */
        .ads-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .ads-container.grid-view {
            grid-template-columns: repeat(2, 1fr);
        }
        .ad-card {
            background: var(--app-card-bg);
            border-radius: 18px;
            padding: 12px;
            box-shadow: var(--app-shadow);
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: all var(--app-transition);
        }
        .ad-card:hover {
            box-shadow: var(--app-shadow-lg);
        }
        .ad-card .ad-title {
            font-size: 16px;
            font-weight: 700;
        }
        .ad-card .ad-price {
            font-size: 15px;
            font-weight: 700;
            color: var(--app-accent-gold);
        }
        .ad-card .ad-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
        }
        .ad-card .ad-actions {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }
        .ad-card .ad-actions .btn {
            flex: 1;
            padding: 6px 10px;
            font-size: 11px;
        }

        /* ============================================================
           БЕЙДЖИ
           ============================================================ */
        .forum-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .badge-sell {
            background: rgba(0,122,255,0.1);
            color: #007aff;
        }
        .badge-buy {
            background: rgba(255,184,0,0.1);
            color: var(--app-accent-gold);
        }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 16px;
            background: var(--app-btn-bg);
            color: #fff;
            width: 100%;
            transition: all var(--app-transition);
        }
        .btn:hover {
            background: var(--app-btn-hover);
            box-shadow: var(--app-shadow);
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 12px;
        }
        .btn-outline {
            background: var(--app-card-bg);
            color: var(--app-text-main);
            border: 1px solid var(--app-card-border);
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #a71d2a);
        }
        .btn-success {
            background: var(--app-btn-bg);
        }

        /* ============================================================
           МОДАЛЬНЫЕ ОКНА
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--app-overlay-bg);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-overlay.visible {
            display: flex;
        }
        .modal-content {
            background: var(--app-card-bg);
            border-radius: 24px;
            padding: 20px;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--app-card-bg);
            border: 1px solid var(--app-card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* ============================================================
           ФОРМЫ
           ============================================================ */
        .form-group {
            margin-bottom: 12px;
        }
        .custom-select-trigger {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            border: 1px solid var(--app-card-border);
            border-radius: 12px;
            background: var(--app-card-bg);
        }

        /* ============================================================
           ФУТЕР
           ============================================================ */
        .app-footer {
            text-align: center;
            padding: 8px;
            font-size: 12px;
            color: var(--app-text-muted);
            border-top: 1px solid var(--app-card-border);
            background: var(--app-header-bg);
        }
        .app-footer .footer-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-weight: 600;
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (min-width: 768px) {
            .ads-container:not(.grid-view) { grid-template-columns: repeat(2, 1fr); }
            .ads-container.grid-view { grid-template-columns: repeat(3, 1fr); }
            .ad-card .ad-image { height: 160px; }
        }
        @media (min-width: 1024px) {
            .app-container { max-width: 1100px; }
            .tab-bar { position: static; flex-direction: row; border-top: none; border-bottom: 1px solid var(--app-card-border); min-height: 52px; padding-bottom: 0; justify-content: flex-start; gap: 8px; padding: 0 16px; }
            .tab-bar-item { flex: 0 1 auto; flex-direction: row; gap: 6px; font-size: 14px; }
            .tab-bar-item.active::after { top: auto; bottom: 0; left: 15%; right: 15%; height: 2px; border-radius: 4px 4px 0 0; }
            .ads-container:not(.grid-view) { grid-template-columns: repeat(3, 1fr); }
            .ads-container.grid-view { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 767px) {
            .app-content { padding: 8px 0; }
        }
    </style>
</head>

        <main class="app-content">
            <section class="section active" id="tabFeed">

        function playSfx(type) {
            if (!sfxEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                const now = ctx.currentTime;
                if (type === 'cash') { osc.type='triangle'; osc.frequency.setValueAtTime(800,now); osc.frequency.setValueAtTime(1200,now+0.08); gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.35); osc.start(now); osc.stop(now+0.35); }
                else if (type === 'success') { osc.type='sine'; osc.frequency.setValueAtTime(440,now); osc.frequency.setValueAtTime(880,now+0.15); gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.3); osc.start(now); osc.stop(now+0.3); }
                else { osc.type='square'; osc.frequency.setValueAtTime(300,now); gain.gain.setValueAtTime(0.08,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.05); osc.start(now); osc.stop(now+0.05); }
            } catch(e) {}
        }

        function updateMskClock() {
            const now = new Date();
            const msk = new Date(now.getTime() + (now.getTimezoneOffset() + 180) * 60000);
            document.getElementById('mskTime').innerText = msk.toTimeString().split(' ')[0] + ' МСК';
        }
        setInterval(updateMskClock, 1000); updateMskClock();

        // ==========================================================================
        // РЕАЛЬНЫЙ ОНЛАЙН (heartbeat)
        // ==========================================================================
        function updateOnlineHeartbeat() {
            const now = Date.now();
            localStorage.setItem('heartbeat_' + currentUserId, now.toString());
            // Удаляем старые записи (старше 5 минут)
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('heartbeat_')) {
                    const ts = parseInt(localStorage.getItem(key) || '0');
                    if (now - ts > 300000) { // 5 минут
                        localStorage.removeItem(key);
                    }
                }
            }
            updateCounters();
        }
        updateOnlineHeartbeat();
        setInterval(updateOnlineHeartbeat, 30000); // каждые 30 секунд

            const now = Date.now();

                const key = localStorage.key(i);
                if (key && key.startsWith('heartbeat_')) {

                    if (now - ts < 300000) online++;
                }
            }
            document.getElementById('onlineCount').innerText = `🟢 ${online}`;
        }
