<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дурак (офлайн)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a3a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        #app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            background: #2a6b2a;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 8px solid #5a3a1a;
        }
        /* Меню */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
            padding: 20px;
        }
        #menu h1 {
            color: #ffd700;
            font-size: 3em;
            text-shadow: 0 0 20px #000;
            margin: 0;
        }
        #menu label {
            color: #fff;
            font-size: 1.3em;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        #menu label:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        #menu label input {
            transform: scale(1.5);
            cursor: pointer;
        }
        #menu button {
            font-size: 1.8em;
            padding: 15px 60px;
            background: #ffd700;
            border: none;
            border-radius: 60px;
            color: #1a3a1a;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #b8860b;
            transition: 0.1s linear;
        }
        #menu button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #b8860b;
        }
        #menu .info {
            color: #ddd;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

        /* Игровое поле */
        #table {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at 20% 30%, #3a8a3a, #1e5a1e);
            border-radius: 20px;
            margin: 8px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px;
            padding: 4px;
            position: relative;
        }
        #bot-zone {
            flex: 0 0 80px;
            border-bottom: 2px dashed rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.15);
            border-radius: 12px 12px 0 0;
        }
        #center-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 8px;
            min-height: 120px;
        }
        .center-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px;
            width: 100%;
        }
        .center-label {
            font-size: 0.8em;
            font-weight: bold;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 2px 14px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px #000;
            margin: 0 6px;
        }
        .center-label.attack {
            background: rgba(200, 50, 50, 0.7);
        }
        .center-label.defense {
            background: rgba(50, 100, 200, 0.7);
        }
        #player-zone {
            flex: 0 0 110px;
            border-top: 2px dashed rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.15);
            border-radius: 0 0 12px 12px;
        }
        /* Индикатор хода */
        .turn-indicator {
            position: absolute;
            top: -10px;
            right: 10px;
            background: #ffd700;
            color: #1a3a1a;
            font-weight: bold;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8em;
            box-shadow: 0 0 15px #ffd700;
            z-index: 5;
        }
        #deck-area {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        #deck-area .card {
            width: 50px;
            height: 70px;
            font-size: 1.2em;
            background: #1a3a8a;
            color: #fff;
            border: 2px solid #aaa;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        #trump-info {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            font-size: 1.1em;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            text-align: center;
        }
        /* Карта */
        .card {
            width: 60px;
            height: 84px;
            background: #fff;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 1.1em;
            font-weight: bold;
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }
        .card .top {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }
        .card .bottom {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transform: rotate(180deg);
            line-height: 1.1;
        }
        .card .suit {
            font-size: 1.2em;
        }
        .card.red {
            color: #c00;
        }
        .card.black {
            color: #000;
        }
        .card.back {
            background: linear-gradient(135deg, #1a3a8a, #2a5a9a);
            border-color: #0a1a4a;
            color: transparent;
            background-image: repeating-linear-gradient(45deg, #3a6aba 0px, #3a6aba 4px, #4a7aca 4px, #4a7aca 8px);
            cursor: default;
        }
        .card.back .top, .card.back .bottom {
            display: none;
        }
        .card.highlight {
            box-shadow: 0 0 15px 5px #ffd700;
            transform: scale(1.05);
        }
        .card.disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }
        .card.attack-card {
            border-color: #d44;
            box-shadow: 0 0 10px rgba(200, 50, 50, 0.5);
        }
        .card.defense-card {
            border-color: #44d;
            box-shadow: 0 0 10px rgba(50, 100, 200, 0.5);
        }
        .card.trump-card {
            border: 3px solid gold;
        }
        /* Кнопки управления */
        #controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 8px 10px 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            margin: 0 12px 10px;
            flex-wrap: wrap;
        }
        #controls button {
            padding: 8px 18px;
            border: none;
            border-radius: 40px;
            font-size: 1.0em;
            font-weight: bold;
            background: #ffd700;
            color: #1a3a1a;
            cursor: pointer;
            box-shadow: 0 3px 0 #b8860b;
            transition: 0.1s linear;
            min-width: 70px;
        }
        #controls button:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        #controls button:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: none;
            pointer-events: none;
        }
        #controls button.secondary {
            background: #ddd;
            color: #222;
            box-shadow: 0 3px 0 #999;
        }
        #status {
            color: #fff;
            font-size: 1.2em;
            text-align: center;
            text-shadow: 0 0 12px #000;
            padding: 5px;
            min-height: 2.2em;
            background: rgba(0,0,0,0.3);
            border-radius: 30px;
            margin: 0 12px 4px;
            font-weight: 500;
        }
        /* Адаптив */
        @media (max-width: 600px) {
            .card {
                width: 48px;
                height: 67px;
                font-size: 0.9em;
                padding: 3px 4px;
            }
            #bot-zone { flex-basis: 65px; }
            #player-zone { flex-basis: 85px; }
            #deck-area .card { width: 40px; height: 56px; font-size: 1em; }
            #controls button { padding: 6px 12px; font-size: 0.9em; min-width: 60px; }
            #menu h1 { font-size: 2em; }
            .center-label { font-size: 0.7em; }
        }
        @media (max-width: 420px) {
            .card {
                width: 40px;
                height: 56px;
                font-size: 0.75em;
                padding: 2px 3px;
            }
            #bot-zone { flex-basis: 55px; }
            #player-zone { flex-basis: 70px; }
            #center-zone { min-height: 90px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Меню -->
    <div id="menu">
        <h1>♠ Дурак ♥</h1>
        <label><input type="radio" name="mode" value="podkid" checked> Подкидной</label>
        <label><input type="radio" name="mode" value="perevod"> Переводной</label>
        <button id="startBtn">Начать игру</button>
        <div class="info">Офлайн‑версия. Вы играете против компьютера.</div>
    </div>

    <!-- Игровой стол -->
    <div id="table">
        <!-- Зона бота -->
        <div id="bot-zone" class="zone">
            <span class="turn-indicator" id="botTurnIndicator" style="display:none;">🤖 ходит</span>
        </div>

        <!-- Центральная зона (стол) -->
        <div id="center-zone">
            <!-- Ряд защиты (сверху) -->
            <div class="center-row" id="defenseRow">
                <span class="center-label defense">🛡 Защита</span>
                <div id="defenseCards" style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"></div>
            </div>
            <!-- Ряд атаки (снизу) -->
            <div class="center-row" id="attackRow">
                <span class="center-label attack">⚔ Атака</span>
                <div id="attackCards" style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;"></div>
            </div>
            <!-- Козырь и колода -->
            <div id="deck-area">
                <div class="card back" id="deckCard"></div>
                <div id="trump-info">♠</div>
            </div>
        </div>

        <!-- Зона игрока -->
        <div id="player-zone" class="zone">
            <span class="turn-indicator" id="playerTurnIndicator" style="display:none;">👤 ваш ход</span>
        </div>
    </div>

    <div id="status">Нажмите «Начать игру»</div>
    <div id="controls">
        <button id="btnPass" disabled>Отбой</button>
        <button id="btnTake" disabled>Взять</button>
        <button id="btnAdd" disabled>Подкинуть</button>
        <button id="btnNewGame" class="secondary">Новая игра</button>
    </div>
</div>

<script>
    // ================== КЛАСС КАРТЫ ==================
    class Card {
        constructor(suit, rank) {
            this.suit = suit; // '♠','♥','♦','♣'
            this.rank = rank; // 6,7,8,9,10,11(В),12(Д),13(К),14(Т)
            this.id = suit + rank;
        }
        get name() {
            const names = { 6:'6',7:'7',8:'8',9:'9',10:'10',11:'В',12:'Д',13:'К',14:'Т' };
            return names[this.rank] || this.rank;
        }
        get isRed() {
            return this.suit === '♥' || this.suit === '♦';
        }
        get suitSymbol() {
            return this.suit;
        }
        beats(other, trumpSuit) {
            if (this.suit === trumpSuit && other.suit !== trumpSuit) return true;
            if (this.suit !== trumpSuit && other.suit === trumpSuit) return false;
            if (this.suit === other.suit) return this.rank > other.rank;
            return false;
        }
    }

    // ================== КОЛОДА ==================
    function createDeck() {
        const suits = ['♠','♥','♦','♣'];
        const ranks = [6,7,8,9,10,11,12,13,14];
        const deck = [];
        for (let s of suits) {
            for (let r of ranks) {
                deck.push(new Card(s, r));
            }
        }
        return deck;
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ================== ИГРА ==================
    class Game {
        constructor(mode) {
            this.mode = mode; // 'podkid' или 'perevod'
            this.deck = [];
            this.trumpSuit = null;
            this.trumpCard = null;
            this.playerHand = [];
            this.botHand = [];
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.isPlayerTurn = true;
            this.isAttacking = true;
            this.gameOver = false;
            this.waitingForPlayerAction = false;
            this.cardsToDeal = 6;
            this.onUpdate = null;
        }

        init() {
            this.deck = shuffle(createDeck());
            this.trumpCard = this.deck.pop();
            this.trumpSuit = this.trumpCard.suit;
            this.playerHand = [];
            this.botHand = [];
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.gameOver = false;
            this.isPlayerTurn = true;
            this.isAttacking = true;
            for (let i = 0; i < this.cardsToDeal; i++) {
                if (this.deck.length === 0) break;
                this.playerHand.push(this.deck.pop());
                if (this.deck.length === 0) break;
                this.botHand.push(this.deck.pop());
            }
            this.sortHand(this.playerHand);
            this.sortHand(this.botHand);
            this.updateUI();
            this.checkGameOver();
            if (this.isPlayerTurn && !this.gameOver) {
                this.waitingForPlayerAction = true;
                this.setStatus('Ваш ход. Выберите карту для атаки.');
                this.enableControls(false, false, false);
            } else if (!this.isPlayerTurn && !this.gameOver) {
                this.botTurn();
            }
        }

        sortHand(hand) {
            const order = { '♠':0, '♥':1, '♦':2, '♣':3 };
            hand.sort((a,b) => {
                if (a.suit === this.trumpSuit && b.suit !== this.trumpSuit) return -1;
                if (a.suit !== this.trumpSuit && b.suit === this.trumpSuit) return 1;
                if (a.suit !== b.suit) return order[a.suit] - order[b.suit];
                return b.rank - a.rank;
            });
        }

        // ===== ХОД ИГРОКА =====
        playerAttack(card) {
            if (!this.waitingForPlayerAction || !this.isAttacking || !this.isPlayerTurn || this.gameOver) return false;
            const idx = this.playerHand.indexOf(card);
            if (idx === -1) return false;
            if (this.tableCards.length > 0) {
                const ranksOnTable = this.attackingCards.map(c => c.rank);
                if (!ranksOnTable.includes(card.rank)) {
                    this.setStatus('Можно подкинуть только карту того же достоинства, что уже есть на столе.');
                    return false;
                }
            }
            this.playerHand.splice(idx, 1);
            this.tableCards.push(card);
            this.attackingCards.push(card);
            this.updateUI();
            this.waitingForPlayerAction = false;
            this.enableControls(false, false, false);
            const canAdd = this.canPlayerAdd();
            if (canAdd) {
                this.setStatus('Вы можете подкинуть карту того же достоинства или нажать "Отбой".');
                this.enableControls(true, false, true);
                this.waitingForPlayerAction = true;
            } else {
                this.playerPassAttack();
            }
            return true;
        }

        canPlayerAdd() {
            if (this.attackingCards.length === 0) return false;
            const ranks = this.attackingCards.map(c => c.rank);
            return this.playerHand.some(c => ranks.includes(c.rank));
        }

        playerPassAttack() {
            if (this.gameOver) return;
            this.waitingForPlayerAction = false;
            this.enableControls(false, false, false);
            this.setStatus('Бот отбивается...');
            this.botDefend();
        }

        botDefend() {
            if (this.gameOver) return;
            const cardsToBeat = this.attackingCards;
            let defense = [];
            let usedIndices = [];
            let success = true;
            for (let atkCard of cardsToBeat) {
                let found = false;
                for (let i = 0; i < this.botHand.length; i++) {
                    if (usedIndices.includes(i)) continue;
                    let card = this.botHand[i];
                    if (card.beats(atkCard, this.trumpSuit)) {
                        defense.push(card);
                        usedIndices.push(i);
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    success = false;
                    break;
                }
            }
            if (success) {
                for (let card of defense) {
                    const idx = this.botHand.indexOf(card);
                    if (idx !== -1) this.botHand.splice(idx, 1);
                }
                this.tableCards.push(...defense);
                this.defendingCards.push(...defense);
                this.updateUI();
                this.clearTable();
                this.setStatus('Бот отбился! Ваш ход.');
                this.isPlayerTurn = true;
                this.isAttacking = true;
                this.dealCards();
                this.updateUI();
                this.checkGameOver();
                if (!this.gameOver) {
                    this.waitingForPlayerAction = true;
                    this.enableControls(false, false, false);
                    this.setStatus('Ваш ход. Выберите карту для атаки.');
                }
            } else {
                this.botHand.push(...this.tableCards);
                this.tableCards = [];
                this.attackingCards = [];
                this.defendingCards = [];
                this.updateUI();
                this.setStatus('Бот взял карты. Ваш ход.');
                this.isPlayerTurn = true;
                this.isAttacking = true;
                this.dealCards();
                this.updateUI();
                this.checkGameOver();
                if (!this.gameOver) {
                    this.waitingForPlayerAction = true;
                    this.enableControls(false, false, false);
                    this.setStatus('Ваш ход. Выберите карту для атаки.');
                }
            }
        }

        playerDefend(card) {
            if (!this.waitingForPlayerAction || this.isAttacking || !this.isPlayerTurn || this.gameOver) return false;
            const attackCards = this.attackingCards;
            // Определяем, какую карту бьём (первую неотбитую)
            let targetIdx = this.defendingCards.length;
            if (targetIdx >= attackCards.length) {
                this.setStatus('Все карты уже отбиты.');
                return false;
            }
            const atkCard = attackCards[targetIdx];
            if (!card.beats(atkCard, this.trumpSuit)) {
                this.setStatus('Эта карта не бьёт ' + atkCard.name + atkCard.suit);
                return false;
            }
            const idx = this.playerHand.indexOf(card);
            if (idx === -1) return false;
            this.playerHand.splice(idx, 1);
            this.defendingCards.push(card);
            this.tableCards.push(card);
            this.updateUI();
            if (this.defendingCards.length === this.attackingCards.length) {
                this.clearTable();
                this.setStatus('Вы отбились! Ваш ход.');
                this.isPlayerTurn = true;
                this.isAttacking = true;
                this.dealCards();
                this.updateUI();
                this.checkGameOver();
                if (!this.gameOver) {
                    this.waitingForPlayerAction = true;
                    this.enableControls(false, false, false);
                    this.setStatus('Ваш ход. Выберите карту для атаки.');
                }
            } else {
                this.setStatus('Отбейте следующую карту или возьмите все.');
                this.waitingForPlayerAction = true;
                this.enableControls(false, true, false);
            }
            return true;
        }

        playerTake() {
            if (!this.waitingForPlayerAction || this.isAttacking || !this.isPlayerTurn || this.gameOver) return;
            this.playerHand.push(...this.tableCards);
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.updateUI();
            this.setStatus('Вы взяли карты. Теперь ход бота.');
            this.isPlayerTurn = false;
            this.isAttacking = true;
            this.dealCards();
            this.updateUI();
            this.checkGameOver();
            if (!this.gameOver) {
                this.waitingForPlayerAction = false;
                this.enableControls(false, false, false);
                this.botTurn();
            }
        }

        botTurn() {
            if (this.gameOver) return;
            if (this.isPlayerTurn) return;
            if (this.botHand.length === 0) {
                this.checkGameOver();
                return;
            }
            this.isAttacking = true;
            // Бот выбирает самую младшую карту (не козырь, если есть)
            let card = this.botHand[0];
            this.botHand.splice(0, 1);
            this.tableCards.push(card);
            this.attackingCards.push(card);
            this.updateUI();
            this.setStatus('Бот атакует картой ' + card.name + card.suit);
            this.isPlayerTurn = true;
            this.isAttacking = false;
            this.waitingForPlayerAction = true;
            this.enableControls(false, true, false);
            this.setStatus('Отбейтесь картой или нажмите "Взять".');
        }

        playerAdd() {
            if (!this.waitingForPlayerAction || !this.isAttacking || !this.isPlayerTurn || this.gameOver) return;
            if (!this.canPlayerAdd()) {
                this.setStatus('Нет карт для подкидывания.');
                return;
            }
            this.setStatus('Выберите карту для подкидывания (того же достоинства).');
        }

        clearTable() {
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.updateUI();
        }

        dealCards() {
            while (this.playerHand.length < 6 && this.deck.length > 0) {
                this.playerHand.push(this.deck.pop());
            }
            while (this.botHand.length < 6 && this.deck.length > 0) {
                this.botHand.push(this.deck.pop());
            }
            this.sortHand(this.playerHand);
            this.sortHand(this.botHand);
        }

        checkGameOver() {
            if (this.deck.length === 0 && (this.playerHand.length === 0 || this.botHand.length === 0)) {
                this.gameOver = true;
                this.waitingForPlayerAction = false;
                this.enableControls(false, false, false);
                if (this.playerHand.length === 0) {
                    this.setStatus('🎉 Вы выиграли!');
                } else if (this.botHand.length === 0) {
                    this.setStatus('😞 Бот выиграл.');
                } else {
                    this.setStatus('Ничья?');
                }
                return true;
            }
            return false;
        }

        setStatus(msg) {
            const el = document.getElementById('status');
            if (el) el.textContent = msg;
        }

        enableControls(pass, take, add) {
            document.getElementById('btnPass').disabled = !pass;
            document.getElementById('btnTake').disabled = !take;
            document.getElementById('btnAdd').disabled = !add;
        }

        updateUI() {
            this.renderPlayerHand();
            this.renderBotHand();
            this.renderTable();
            this.renderDeck();
            // Индикаторы хода
            const botInd = document.getElementById('botTurnIndicator');
            const playerInd = document.getElementById('playerTurnIndicator');
            if (this.gameOver) {
                botInd.style.display = 'none';
                playerInd.style.display = 'none';
            } else if (this.isPlayerTurn) {
                botInd.style.display = 'none';
                playerInd.style.display = 'block';
            } else {
                botInd.style.display = 'block';
                playerInd.style.display = 'none';
            }
        }

        renderPlayerHand() {
            const zone = document.getElementById('player-zone');
            // Удаляем старые карты, но оставляем индикатор
            const indicator = zone.querySelector('.turn-indicator');
            zone.innerHTML = '';
            zone.appendChild(indicator);
            this.playerHand.forEach((card, idx) => {
                const el = this.createCardElement(card, false);
                el.dataset.index = idx;
                el.addEventListener('click', () => {
                    this.onCardClick(card);
                });
                zone.appendChild(el);
            });
        }

        renderBotHand() {
            const zone = document.getElementById('bot-zone');
            const indicator = zone.querySelector('.turn-indicator');
            zone.innerHTML = '';
            zone.appendChild(indicator);
            this.botHand.forEach((card, idx) => {
                const el = this.createCardElement(card, true);
                el.dataset.index = idx;
                zone.appendChild(el);
            });
            // Счётчик карт
            const count = document.createElement('div');
            count.style.cssText = 'color:#fff; font-weight:bold; background:rgba(0,0,0,0.5); padding:2px 12px; border-radius:20px; font-size:0.8em; margin-left:4px;';
            count.textContent = this.botHand.length + ' карт';
            zone.appendChild(count);
        }

        renderTable() {
            // Атакующие карты
            const attackContainer = document.getElementById('attackCards');
            attackContainer.innerHTML = '';
            this.attackingCards.forEach((card) => {
                const el = this.createCardElement(card, false);
                el.classList.add('attack-card');
                el.style.cursor = 'default';
                el.style.pointerEvents = 'none';
                attackContainer.appendChild(el);
            });
            // Защитные карты
            const defenseContainer = document.getElementById('defenseCards');
            defenseContainer.innerHTML = '';
            this.defendingCards.forEach((card) => {
                const el = this.createCardElement(card, false);
                el.classList.add('defense-card');
                el.style.cursor = 'default';
                el.style.pointerEvents = 'none';
                defenseContainer.appendChild(el);
            });
            // Подписи кто атакует
            const attackLabel = document.querySelector('.center-label.attack');
            const defenseLabel = document.querySelector('.center-label.defense');
            if (this.isPlayerTurn && this.isAttacking) {
                attackLabel.textContent = '⚔ Ваша атака';
                defenseLabel.textContent = '🛡 Защита бота';
            } else if (!this.isPlayerTurn && this.isAttacking) {
                attackLabel.textContent = '⚔ Атака бота';
                defenseLabel.textContent = '🛡 Ваша защита';
            } else {
                attackLabel.textContent = '⚔ Атака';
                defenseLabel.textContent = '🛡 Защита';
            }
        }

        renderDeck() {
            const deckCard = document.getElementById('deckCard');
            if (this.deck.length > 0) {
                deckCard.style.display = 'flex';
                deckCard.textContent = this.deck.length;
            } else {
                deckCard.style.display = 'none';
            }
            document.getElementById('trump-info').textContent = 'Козырь: ' + this.trumpSuit;
        }

        createCardElement(card, hidden) {
            const div = document.createElement('div');
            div.className = 'card';
            if (hidden) {
                div.classList.add('back');
                return div;
            }
            const color = card.isRed ? 'red' : 'black';
            div.classList.add(color);
            if (card.suit === this.trumpSuit) {
                div.classList.add('trump-card');
            }
            const top = document.createElement('div');
            top.className = 'top';
            top.innerHTML = `<span>${card.name}</span><span class="suit">${card.suitSymbol}</span>`;
            const bottom = document.createElement('div');
            bottom.className = 'bottom';
            bottom.innerHTML = `<span>${card.name}</span><span class="suit">${card.suitSymbol}</span>`;
            div.appendChild(top);
            div.appendChild(bottom);
            return div;
        }

        onCardClick(card) {
            if (this.gameOver) return;
            if (!this.waitingForPlayerAction) {
                this.setStatus('Сейчас не ваш ход.');
                return;
            }
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerAttack(card);
            } else if (!this.isAttacking && this.isPlayerTurn) {
                this.playerDefend(card);
            } else {
                this.setStatus('Нельзя сыграть этой картой сейчас.');
            }
        }

        onPass() {
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerPassAttack();
            } else {
                this.setStatus('Сейчас нельзя отбиться.');
            }
        }

        onTake() {
            if (!this.isAttacking && this.isPlayerTurn) {
                this.playerTake();
            } else {
                this.setStatus('Сейчас нельзя взять карты.');
            }
        }

        onAdd() {
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerAdd();
            } else {
                this.setStatus('Сейчас нельзя подкинуть.');
            }
        }
    }

    // ================== ЗАПУСК ==================
    let game = null;

    function startGame(mode) {
        game = new Game(mode);
        game.init();
        document.getElementById('menu').style.display = 'none';
        document.getElementById('btnPass').onclick = () => { if (game) game.onPass(); };
        document.getElementById('btnTake').onclick = () => { if (game) game.onTake(); };
        document.getElementById('btnAdd').onclick = () => { if (game) game.onAdd(); };
        document.getElementById('btnNewGame').onclick = () => {
            document.getElementById('menu').style.display = 'flex';
            game = null;
        };
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        startGame(mode);
    });

    document.getElementById('menu').style.display = 'flex';
</script>
</body>
</html>
