    <script>
    // Функции туториала
    let currentTutorialSlide = 0;
    const totalSlides = 5;

    function showTutorial() {
        document.getElementById('tutorialOverlay').style.display = 'flex';
        updateTutorialSlide();
    }

    function hideTutorial() {
        document.getElementById('tutorialOverlay').style.display = 'none';
    }

    function nextTutorialSlide() {
        if (currentTutorialSlide < totalSlides - 1) {
            currentTutorialSlide++;
            updateTutorialSlide();
        } else {
            completeTutorial();
        }
    }

    function prevTutorialSlide() {
        if (currentTutorialSlide > 0) {
            currentTutorialSlide--;
            updateTutorialSlide();
        }
    }

    function skipTutorial() {
        completeTutorial();
    }

    function updateTutorialSlide() {
        const slides = document.querySelectorAll('.tutorial-slide');
        slides.forEach((slide, index) => {
            slide.classList.toggle('active', index === currentTutorialSlide);
        });

        // Обновляем точки
        const dots = document.querySelectorAll('.tutorial-dot');
        dots.forEach((dot, index) => {
            dot.classList.toggle('active', index === currentTutorialSlide);
        });

        // Управление кнопками
        document.getElementById('tutorialPrevBtn').style.display = currentTutorialSlide === 0 ? 'none' : 'block';
        const nextBtn = document.getElementById('tutorialNextBtn');
        nextBtn.textContent = currentTutorialSlide === totalSlides - 1 ? 'Завершить' : 'Далее';
    }

    async function completeTutorial() {
        hideTutorial();
        // Сохраняем флаг в CloudStorage Telegram
        if (window.Telegram?.WebApp?.CloudStorage) {
            try {
                await window.Telegram.WebApp.CloudStorage.setItem('tutorial_completed', '1');
            } catch (e) {
                console.warn('CloudStorage error:', e);
            }
        }
        // Также сохраняем в localStorage как запасной вариант
        localStorage.setItem('arizona_tutorial_completed', '1');
        // Показываем основной интерфейс
        document.querySelector('.app-container').style.display = 'block';
    }

    async function checkTutorial() {
        let completed = false;
        // Проверяем CloudStorage
        if (window.Telegram?.WebApp?.CloudStorage) {
            try {
                const result = await window.Telegram.WebApp.CloudStorage.getItem('tutorial_completed');
                completed = result === '1';
            } catch (e) {
                console.warn('CloudStorage read error:', e);
            }
        }
        // Если не в CloudStorage, проверяем localStorage
        if (!completed) {
            completed = localStorage.getItem('arizona_tutorial_completed') === '1';
        }
        if (!completed) {
            // Скрываем основной интерфейс и показываем туториал
            document.querySelector('.app-container').style.display = 'none';
            showTutorial();
        } else {
            document.querySelector('.app-container').style.display = 'block';
        }
    }

    // Исправление бага с рассылкой: при изменении версии очищаем старые данные
    function clearOldDataIfNeeded() {
        const storedBuild = localStorage.getItem('arizona_app_build');
        if (storedBuild !== CURRENT_APP_BUILD) {
            const keysToRemove = [
                'arizona_broadcast_text',
                'arizona_broadcast_history',
                'arizona_pending_ads',
                'arizona_ads_feed',
                'arizona_global_chats_db',
                'arizona_fashion_looks',
                'arizona_travel_ads'
            ];
            keysToRemove.forEach(key => localStorage.removeItem(key));
            localStorage.setItem('arizona_app_build', CURRENT_APP_BUILD);
        }
    }

    // Вызываем очистку при загрузке
    clearOldDataIfNeeded();

    // Инициализация приложения
    function init() {
        // ... (все предыдущие инициализации) ...
        // Затем проверяем туториал
        checkTutorial();
    }

    // Запуск
    if (document.readyState === 'complete') {
        init();
    } else {
        document.addEventListener('DOMContentLoaded', init);
    }
    </script>
