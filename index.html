<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
            will-change: transform, opacity;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width 0.3s;
        }
        @media (min-width: 768px) {
            :root { --container-width: 720px; }
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .ad-card { width: 100%; }
        }
        @media (min-width: 1024px) {
            :root { --container-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            height: var(--header-height);
            gap: 8px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-logo {
            width: 36px; height: 36px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-logo:active { transform: scale(0.9); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; }
        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .header-search input::placeholder { color: var(--muted); }
        .header-search input:focus { border-color: var(--accent); }
        .theme-toggle {
            background: none; border: none;
            font-size: 22px; cursor: pointer;
            padding: 4px; border-radius: 8px;
            flex-shrink: 0;
        }
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none; border: none;
            color: var(--muted);
            font-size: 10px; font-weight: 600;
            cursor: pointer; padding: 4px 8px;
            border-radius: 8px;
            flex: 1; max-width: 80px;
            min-height: var(--btn-min-height);
            transition: color 0.2s, background 0.2s;
        }
        .nav-item .nav-icon { font-size: 22px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0, 91, 255, 0.08); }
        .section { display: none; animation: fadeIn 0.2s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px; margin-bottom: 10px;
            transition: transform 0.15s;
            cursor: pointer;
        }
        .card:active { transform: scale(0.98); }
        .ad-card { display: flex; gap: 10px; align-items: flex-start; }
        .ad-card-img { width: 80px; height: 100px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 800; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .badge { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; background: var(--border); color: var(--text); white-space: nowrap; }
        .badge.sell { background: #34c759; color: #fff; }
        .badge.buy { background: #ff9500; color: #fff; }
        .badge.server { background: var(--gold); color: #1a1a1a; }
        .badge.category { background: var(--accent); color: #fff; }
        .badge.status-pending { background: #ffcc00; color: #1a1a1a; }
        .badge.status-deleted { background: #ff3b30; color: #fff; }
        .badge.status-approved { background: #34c759; color: #fff; }
        .ad-card-author { font-size: 11px; color: var(--muted); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 10px 18px; border-radius: var(--radius);
            border: none; background: var(--accent); color: #fff;
            font-weight: 700; font-size: 14px; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            min-height: var(--btn-min-height); touch-action: manipulation;
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #ff3b30; color: #fff; }
        .btn.gold { background: var(--gold); color: #1a1a1a; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            padding: 16px; backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--card); border-radius: var(--radius);
            border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            width: 100%; max-width: 520px; max-height: 85vh;
            overflow-y: auto; padding: 20px; position: relative;
        }
        .modal-close {
            position: absolute; top: 12px; right: 12px;
            background: none; border: none; font-size: 24px;
            cursor: pointer; color: var(--muted); padding: 4px; z-index: 5;
        }
        .modal-title { font-weight: 800; font-size: 18px; margin-bottom: 16px; padding-right: 30px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border-radius: var(--radius);
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 14px; outline: none;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-weight: 500; }
        .tutorial-overlay, .fullscreen-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 300; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .fullscreen-overlay { z-index: 400; }
        .tutorial-slide { max-width: 420px; width: 100%; }
        .tutorial-slide h2 { font-weight: 900; font-size: 24px; margin-bottom: 12px; }
        .tutorial-slide p { font-size: 15px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
        .star-rating { display: flex; gap: 4px; font-size: 28px; cursor: pointer; }
        .star-rating span { color: var(--border); transition: color 0.2s; }
        .star-rating span.active { color: var(--gold); }
        .review-item { border-bottom: 1px solid var(--border); padding: 10px 0; }
        .game-click-area {
            width: 100%; max-width: 220px; aspect-ratio: 1; margin: 0 auto 16px;
            cursor: pointer; border-radius: 50%; overflow: hidden; border: 4px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 64px;
            background: var(--card); transition: transform 0.1s;
        }
        .game-click-area:active { transform: scale(0.92); }
        .upgrade-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 8px; background: var(--card);
        }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: 700; font-size: 13px; }
        .upgrade-cost { font-size: 11px; color: var(--muted); }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .category-tile {
            padding: 12px 8px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--card); text-align: center; cursor: pointer; font-weight: 600; font-size: 11px;
        }
        .category-tile .cat-icon { font-size: 24px; display: block; margin-bottom: 4px; }
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile {
            padding: 16px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--card); text-align: center; cursor: pointer; font-weight: 700; font-size: 13px;
        }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .image-gallery { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; scroll-snap-type: x mandatory; }
        .image-gallery img { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; scroll-snap-align: start; flex-shrink: 0; background: var(--border); }
        .search-suggestion { padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .search-suggestion:hover { background: var(--border); }
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .text-muted { color: var(--muted); }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-8 { margin-bottom: 8px; }
        .mb-12 { margin-bottom: 12px; }
        .w-full { width: 100%; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
    </style>
</head>
<body>
    <header class="header" id="appHeader">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Logo">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search">
            <input type="text" id="globalSearchInput" placeholder="🔍 Поиск товаров..." autocomplete="off">
        </div>
        <button class="theme-toggle" id="themeToggleBtn" title="Тема">🌓</button>
    </header>

    <main class="container" id="mainContainer">
        <section class="section active" id="section-home">
            <div class="ads-grid" id="homeFeed"></div>
        </section>
        <section class="section" id="section-cart">
            <h2 class="mb-12" style="font-weight:800;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>
        <section class="section" id="section-send">
            <h2 class="mb-12" style="font-weight:800;">➕ Отправка объявления</h2>
            <div class="card">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <select id="sendType">
                        <option value="sell">Продажа</option>
                        <option value="buy">Покупка</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="sendCategory"></select>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (ссылки через запятую, до 20)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                    <div class="text-muted mt-8" style="font-size:11px;">Разрешены: youtube.com, youtu.be, radikal.cloud, allwebs.ru, postimages.org, ru.imgbb.com</div>
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <select id="sendServer"></select>
                </div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить на модерацию</button>
            </div>
            <h3 class="mb-8 mt-12" style="font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>
        <section class="section" id="section-admin">
            <h2 class="mb-12" style="font-weight:800;">🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 class="mb-12" style="font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" data-section="cart">
            <span class="nav-icon">🛒</span>
            <span>Корзина</span>
        </button>
        <button class="nav-item" data-section="send">
            <span class="nav-icon">➕</span>
            <span>Отправка</span>
        </button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin">
            <span class="nav-icon">🛡️</span>
            <span>Админ</span>
        </button>
        <button class="nav-item" data-section="all">
            <span class="nav-icon">☰</span>
            <span>Разделы</span>
        </button>
    </nav>

    <div id="modalContainer"></div>

    <script>
        (function() {
            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Phoenix', 'Tucson', 'Scottdale', 'Chandler', 'Brainburg', 'Saint-Rose', 'Mesa', 'Red-Rock', 'Yuma',
                'Surprise', 'Prescott', 'Glendale', 'Kingman', 'Winslow', 'Payson', 'Gilbert', 'Show-Low', 'Casa-Grande',
                'Page', 'Sun-City', 'Queen-Creek', 'Sedona', 'Holiday', 'Wednesday', 'Yava', 'Faraway', 'Bumble-Bee',
                'Christmas', 'Mirage', 'Love', 'Drake', 'Space', 'Home', 'Mobile I', 'Mobile II', 'Mobile III'
            ];
            const ALL_CATEGORIES = [
                { id: 'accessories', label: '💍 Аксессуары и вещи' },
                { id: 'transport', label: '🚗 Транспорт' },
                { id: 'realestate', label: '🏠 Недвижимость' },
                { id: 'business', label: '💼 Бизнесы' },
                { id: 'weapons', label: '🔫 Оружие и материалы' },
                { id: 'clothing', label: '👕 Одежда' },
                { id: 'electronics', label: '📱 Электроника' }
            ];
            const APPEAL_REASONS = [
                'Несправедливая блокировка', 'Ошибка модерации', 'Объявление удалили по ошибке',
                'Нарушение правил другой стороной', 'Техническая проблема', 'Возврат средств',
                'Жалоба на пользователя', 'Взлом аккаунта', 'Другое', 'Не знаю'
            ];
            const ALLOWED_DOMAINS = ['youtube.com', 'youtu.be', 'radikal.cloud', 'allwebs.ru', 'postimages.org', 'ru.imgbb.com'];
            const DEFAULT_AD_IMAGE = 'https://i.postimg.cc/zDwTPKwq/0465dd7cc4f5446e5e908000ec4379bb.jpg';
            const SUPABASE_URL = 'https://sbtitlayqkpllnaiyeld.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_bVZYBWwjdsPMfbbRglAFbw_fP-8ClPO';

            let tg = null;
            let currentUser = { id: 123456789, username: 'testuser', first_name: 'Тест' };
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    tg = window.Telegram.WebApp;
                    tg.expand();
                    tg.ready();
                    const initData = tg.initDataUnsafe || {};
                    if (initData.user) {
                        currentUser = {
                            id: initData.user.id || currentUser.id,
                            username: initData.user.username || '',
                            first_name: initData.user.first_name || currentUser.first_name
                        };
                    }
                }
            } catch (e) {}

            let supabase = null;
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            } catch (e) {}

            let currentSection = 'home';
            let currentTheme = localStorage.getItem('theme') || 'light';
            let sfxEnabled = localStorage.getItem('sfx') !== 'off';
            let currentFilterCategory = null;
            let currentUserServer = ALL_SERVERS[0];
            let currentUserData = null;
            let isAdmin = false;
            let isOwner = false;
            let audioCtx = null;
            let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
            let appealAdId = null;
            let cartAds = [];
            let myAds = [];
            let pendingAds = [];
            let pendingAppeals = [];
            let homeAds = [];
            let tutorialCompleted = localStorage.getItem(`arizona_${currentUser.id}_tutorial_completed`) === '1';
            let adminTutorialCompleted = localStorage.getItem(`arizona_${currentUser.id}_admin_tutorial_completed`) === '1';

            function withTimeout(promise, ms = 8000) {
                return Promise.race([
                    promise,
                    new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))
                ]);
            }

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.05;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);
                } catch (e) {}
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', currentTheme);
                localStorage.setItem('theme', currentTheme);
            }
            applyTheme();

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return base;
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function formatPriceInput(input) {
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

            function isAllowedLink(url) {
                try {
                    const u = new URL(url);
                    const host = u.hostname.replace('www.', '');
                    return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                } catch (e) { return false; }
            }

            function checkLinksString(str) {
                if (!str.trim()) return { valid: true, links: [] };
                const links = str.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
                for (let link of links) {
                    if (!isAllowedLink(link)) return { valid: false, message: `Ссылка ${link} не разрешена` };
                }

            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div class="modal-overlay" id="modalOverlay">
                        <div class="modal" id="modalBox">
                            <button class="modal-close" id="modalCloseBtn">✕</button>
                            ${html}
                        </div>
                    </div>
                `;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                function closeModal() {
                    overlay.remove();
                    if (onClose) onClose();
                }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
                return { overlay, closeModal };
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            let gameState = { money: 0, clickPower: 1, clickCost: 50, autoIncome: 0, autoCost: 200, proCost: 800, shopCost: 3000 };
            async function loadGameState() {
                if (!supabase) return;

            function openBarygaGame() {
                loadGameState().then(() => {
                    showModal(`
                        <h3 class="modal-title">🎮 Игра «Барыга»</h3>
                        <div style="text-align:center;font-size:26px;font-weight:900;margin-bottom:12px;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div>
                        <div class="game-click-area" id="gameClickArea">📦</div>
                        <div class="text-muted text-center" style="font-size:12px;margin-bottom:12px;">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div>
                        <div id="gameUpgrades">${renderUpgrades()}</div>
                    `);
                    const clickArea = document.getElementById('gameClickArea');
                    clickArea.addEventListener('click', () => {
                        gameState.money += gameState.clickPower;
                        updateGameUI();
                        playSfx('click');
                        saveGameState();
                    });
                    setInterval(() => {
                        if (gameState.autoIncome > 0) {
                            gameState.money += gameState.autoIncome / 10;
                            updateGameUI();
                            saveGameState();
                        }
                    }, 100);
                });
            }

            function renderUpgrades() {
                const upgrades = [
                    { name: 'Клик +1', cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                    { name: 'Авто +5/сек', cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                    { name: 'Продавец +20/сек', cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                    { name: 'Магазин +50/сек', cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } }
                ];
                return upgrades.map((u, i) => `
                    <div class="upgrade-card">
                        <div class="upgrade-info">
                            <div class="upgrade-name">${u.name}</div>
                            <div class="upgrade-cost">💰 ${formatPrice(u.cost)}</div>
                        </div>
                        <button class="btn secondary" data-upgrade="${i}" ${gameState.money < u.cost ? 'disabled' : ''}>Купить</button>
                    </div>
                `).join('');
            }

            function updateGameUI() {
                const moneyEl = document.getElementById('gameMoneyDisplay');
                if (moneyEl) moneyEl.textContent = '💰 ' + formatPrice(gameState.money);
                const upgradesContainer = document.getElementById('gameUpgrades');
                if (upgradesContainer) upgradesContainer.innerHTML = renderUpgrades();
                document.querySelectorAll('[data-upgrade]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const idx = parseInt(btn.dataset.upgrade);
                        const upgrades = [
                            { cost: gameState.clickCost, action: () => { gameState.clickPower += 1; gameState.clickCost *= 2; } },
                            { cost: gameState.autoCost, action: () => { gameState.autoIncome += 5; gameState.autoCost *= 2; } },
                            { cost: gameState.proCost, action: () => { gameState.autoIncome += 20; gameState.proCost *= 2; } },
                            { cost: gameState.shopCost, action: () => { gameState.autoIncome += 50; gameState.shopCost *= 2; } }
                        ];
                        const up = upgrades[idx];
                        if (gameState.money >= up.cost) {
                            gameState.money -= up.cost;
                            up.action();
                            updateGameUI();
                            saveGameState();
                            playSfx('buy');
                        }
                    });
                });
            }

            async function saveGameState() {
                if (!supabase) return;
                try {
                    await withTimeout(supabase.from('baryga').update({
                        money: gameState.money, click_power: gameState.clickPower, click_cost: gameState.clickCost,
                        auto_income: gameState.autoIncome, auto_cost: gameState.autoCost, pro_cost: gameState.proCost,
                        shop_cost: gameState.shopCost
                    }).eq('user_id', currentUser.id.toString()));
                } catch (e) {}
            }

                input.addEventListener('input', async () => {
                    const q = input.value.trim().toLowerCase();
                    if (!q) { suggestions.innerHTML = ''; results.innerHTML = ''; return; }
                    try {
                        const { data } = await withTimeout(
                            supabase.from('ads').select('*').eq('status', 'approved').ilike('item_name', `%${q}%`).limit(10)
                        );
                        const items = data || [];
                        suggestions.innerHTML = items.map(ad => `
                            <div class="search-suggestion" data-sug="${ad.id}">
                                📦 <b>${ad.item_name}</b> • ${formatPrice(ad.price)} (${ad.server})
                            </div>
                        `).join('');
                        suggestions.querySelectorAll('[data-sug]').forEach(el => {
                            el.addEventListener('click', () => {
                                const ad = items.find(a => a.id == el.dataset.sug);
                                if (ad) {
                                    document.getElementById('modalOverlay').remove();
                                    openAdDetail(ad);
                                }
                            });
                        });
                    } catch (e) {}
                });
            }

            // ===== Дополнительные разделы (Луки, Попутчики, Музыка, Настройки, Менеджер, Чаты) =====
            function openFashionModal() {
                showModal(`
                    <h3 class="modal-title">📸 Лента «Луков»</h3>
                    <div class="empty-state">Раздел в разработке. Скоро здесь появятся лучшие образы игроков!</div>
                `);
            }

            function openTravelModal() {
                showModal(`
                    <h3 class="modal-title">🤝 Попутчики</h3>
                    <div class="empty-state">Поиск попутчиков для совместных поездок и фана.</div>
                `);
            }

            function openMusicModal() {
                showModal(`
                    <h3 class="modal-title">🎵 Музыка</h3>
                    <div class="empty-state">Радио Arizona RP и треки для игры.</div>
                `);
            }

            function openSettingsModal() {
                showModal(`
                    <h3 class="modal-title">⚙️ Настройки</h3>
                    <div class="form-group">
                        <label>Звуковые эффекты</label>
                        <button class="btn secondary w-full" id="toggleSfxBtn">${sfxEnabled ? '🔊 Включены' : '🔇 Выключены'}</button>
                    </div>
                `);
                document.getElementById('toggleSfxBtn').addEventListener('click', function() {
                    sfxEnabled = !sfxEnabled;
                    localStorage.setItem('sfx', sfxEnabled ? 'on' : 'off');
                    this.textContent = sfxEnabled ? '🔊 Включены' : '🔇 Выключены';
                    playSfx('click');
                });
            }

            function openManagerModal() {
                showModal(`
                    <h3 class="modal-title">📩 Связь с менеджером</h3>
                    <p class="text-muted mb-12">По всем вопросам сотрудничества и технической поддержки:</p>
                    <button class="btn w-full" onclick="window.open('https://t.me/${OWNER_USERNAME}', '_blank')">Написать @${OWNER_USERNAME}</button>
                `);
            }

            function openChatsModal() {
                showModal(`
                    <h3 class="modal-title">💬 Активные переписки</h3>
                    <div class="empty-state">Список чатов с продавцами и покупателями.</div>
                `);
            }

            // Инициализация при загрузке
            initUserData().then(() => {
                loadHomeFeed();
            });

        })();
    </script>
</body>
</html>
