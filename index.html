<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #F9FAFB;
            --card: #FFFFFF;
            --border: #E5E7EB;
            --accent: #4F46E5;
            --accent-hover: #4338CA;
            --gold: #F59E0B;
            --text: #111827;
            --muted: #6B7280;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --radius: 16px;
            --radius-sm: 10px;
            --btn-min-height: 48px;
            --container-width: 480px;
            --nav-height: 64px;
            --header-height: 60px;
            --font: 'Inter', sans-serif;
            --transition: 0.2s ease;
        }
        [data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --border: #334155;
            --accent: #818CF8;
            --accent-hover: #6366F1;
            --gold: #FBBF24;
            --text: #F1F5F9;
            --muted: #94A3B8;
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.5), 0 4px 6px -2px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            font-size: 15px;
        }
        .container {
            max-width: var(--container-width); margin: 0 auto; padding: 0 16px;
            padding-top: calc(var(--header-height) + 12px);
            padding-bottom: calc(var(--nav-height) + 24px);
            transition: max-width 0.3s;
        }
        @media (min-width:768px) { :root { --container-width:720px; } .ads-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; } .ad-card { width:100%; } }
        @media (min-width:1024px) { :root { --container-width:1200px; } .ads-grid { grid-template-columns:repeat(3,1fr); } }
        @media (max-width:420px) {
            .header-title { font-size:16px; } .header-logo { width:32px; height:32px; border-radius:8px; }
            .nav-item .nav-icon { font-size:20px; } .nav-item { font-size:9px; min-height:40px; }
            .ad-card-img { width:64px; height:84px; } .ad-card-title { font-size:14px; } .ad-card-price { font-size:15px; }
            .card { padding:12px; } .modal { padding:16px; max-width:100%; } .grid-tiles { grid-template-columns:repeat(2,1fr); }
            .btn { padding:10px 16px; font-size:13px; min-height:42px; }
            .form-group input, .form-group select, .form-group textarea { padding:10px 12px; font-size:14px; }
        }
        @media (max-width:360px) {
            .header-title { font-size:14px; } .nav-item .nav-icon { font-size:18px; } .nav-item { font-size:8px; min-height:36px; }
            .ad-card-img { width:54px; height:70px; } .ad-card-title { font-size:12px; } .badge { font-size:9px; }
        }
        /* Header */
        .header { position:fixed; top:0; left:0; right:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:10px 16px; height:var(--header-height); gap:10px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        .header-logo { width:36px; height:36px; border-radius:10px; overflow:hidden; flex-shrink:0; cursor:pointer; transition:transform 0.2s; }
        .header-logo:active { transform:scale(0.9); }
        .header-logo img { width:100%; height:100%; object-fit:cover; }
        .header-title { font-weight:800; font-size:18px; white-space:nowrap; letter-spacing:-0.02em; }
        .header-search { flex:1; min-width:0; cursor:pointer; }
        .header-search input { width:100%; padding:10px 14px; border-radius:50px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; outline:none; pointer-events:none; box-shadow:var(--shadow); }
        .theme-toggle { background:none; border:none; font-size:22px; cursor:pointer; padding:4px; border-radius:8px; transition:transform 0.2s; flex-shrink:0; }
        .theme-toggle:active { transform:scale(0.9); }
        /* Bottom nav */
        .nav-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; background:var(--bg); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; height:var(--nav-height); padding-bottom:env(safe-area-inset-bottom); }
        .nav-item { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; color:var(--muted); font-size:10px; font-weight:600; cursor:pointer; padding:4px 6px; border-radius:12px; transition:color 0.2s, transform 0.1s; flex:1; max-width:80px; min-height:48px; }
        .nav-item .nav-icon { font-size:22px; line-height:1; }
        .nav-item.active { color:var(--accent); background:rgba(79,70,229,0.08); }
        .nav-item:active { transform:scale(0.92); }
        /* Sections */
        .section { display:none; opacity:0; transform:translateY(10px); transition:opacity 0.25s, transform 0.25s; }
        .section.active { display:block; opacity:1; transform:translateY(0); }
        /* Cards */
        .card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); padding:14px; margin-bottom:12px; transition:background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s; cursor:pointer; }
        .card:active { transform:scale(0.98); }
        .card.inactive-card { background:rgba(128,128,128,0.06); opacity:0.7; }
        [data-theme="dark"] .card.inactive-card { background:rgba(255,255,255,0.03); opacity:0.6; }
        .ad-card { display:flex; gap:12px; align-items:flex-start; }
        .ad-card-img { width:80px; height:100px; border-radius:12px; object-fit:cover; background:var(--border); flex-shrink:0; }
        .ad-card-info { flex:1; min-width:0; }
        .ad-card-title { font-weight:700; font-size:15px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .ad-card-price { font-weight:800; font-size:17px; color:var(--accent); margin-bottom:4px; }
        .ad-card-badges { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:4px; }
        .badge { padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; background:var(--border); color:var(--text); white-space:nowrap; }
        .badge.sell { background:#10B981; color:#fff; }
        .badge.buy { background:#F97316; color:#fff; }
        .badge.server { background:var(--gold); color:#1a1a1a; }
        .badge.category { background:var(--accent); color:#fff; }
        .badge.status-pending { background:#FBBF24; color:#1a1a1a; }
        .badge.status-deleted { background:#EF4444; color:#fff; }
        .badge.status-approved { background:#10B981; color:#fff; }
        .badge.active { background:var(--accent); color:#fff; }
        .ad-card-author { font-size:11px; color:var(--muted); }
        .countdown-timer { font-size:11px; color:var(--muted); margin-top:4px; font-weight:500; }
        /* Buttons */
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:12px 18px; border-radius:var(--radius-sm); border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; transition:background 0.2s, transform 0.1s, opacity 0.2s; touch-action:manipulation; min-height:var(--btn-min-height); }
        .btn:hover { background:var(--accent-hover); }
        .btn:active { transform:scale(0.97); }
        .btn.secondary { background:var(--border); color:var(--text); }
        .btn.danger { background:#EF4444; color:#fff; }
        .btn.gold { background:var(--gold); color:#1a1a1a; }
        .btn.success { background:#10B981; color:#fff; }
        .btn:disabled { opacity:0.5; pointer-events:none; }
        .btn.w-full { width:100%; }
        .btn svg { width:18px; height:18px; fill:currentColor; }
        /* Modal */
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity 0.25s; backdrop-filter:blur(4px); }
        .modal-overlay.show { opacity:1; }
        .modal { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow-lg); width:100%; max-width:480px; max-height:85vh; overflow-y:auto; padding:24px; position:relative; transform:translateY(20px); transition:transform 0.25s; }
        .modal-overlay.show .modal { transform:translateY(0); }
        .modal-close { position:absolute; top:12px; right:12px; background:none; border:none; font-size:24px; cursor:pointer; color:var(--muted); padding:4px; line-height:1; z-index:5; }
        .modal-title { font-weight:800; font-size:20px; margin-bottom:20px; padding-right:30px; letter-spacing:-0.02em; }
        /* Forms */
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:600; font-size:13px; margin-bottom:6px; color:var(--muted); }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; transition:border-color 0.2s, background 0.3s; font-family:var(--font); }
        .form-group textarea { min-height:100px; resize:vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }
        /* Empty state */
        .empty-state { text-align:center; padding:40px 20px; color:var(--muted); font-weight:500; }
        /* Tutorial */
        .tutorial-overlay, .fullscreen-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
        .tutorial-slide { max-width:420px; width:100%; }
        .tutorial-slide h2 { font-weight:900; font-size:24px; margin-bottom:12px; letter-spacing:-0.02em; }
        .tutorial-slide p { font-size:15px; color:var(--muted); line-height:1.6; margin-bottom:24px; }
        .tutorial-nav { display:flex; gap:10px; margin-top:20px; }
        /* Star rating */
        .star-rating { display:flex; gap:8px; font-size:32px; cursor:pointer; }
        .star-rating span { color:var(--border); transition:color 0.2s, transform 0.2s; }
        .star-rating span.active { color:var(--gold); }
        .star-rating span:hover { transform:scale(1.2); }
        /* Reviews */
        .review-item { border-bottom:1px solid var(--border); padding:12px 0; }
        .review-item:last-child { border-bottom:none; }
        /* Game */
        .game-click-area { width:100%; max-width:250px; aspect-ratio:1; margin:0 auto 20px; cursor:pointer; border-radius:50%; overflow:hidden; border:4px solid var(--border); transition:transform 0.1s, border-color 0.3s; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
        .game-click-area:active { transform:scale(0.92); }
        .game-click-area img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
        /* Upgrades */
        .upgrade-card { display:flex; justify-content:space-between; align-items:center; padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; background:var(--card); }
        .upgrade-info { flex:1; }
        .upgrade-name { font-weight:700; font-size:14px; }
        .upgrade-cost { font-size:12px; color:var(--muted); }
        /* Progress bar */
        .progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:6px 0; }
        .progress-fill { height:100%; background:var(--accent); border-radius:3px; transition:width 0.3s; }
        /* Grid tiles */
        .grid-tiles { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .grid-tile { padding:16px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); text-align:center; cursor:pointer; font-weight:700; font-size:13px; transition:transform 0.2s, border-color 0.2s, background 0.2s; }
        .grid-tile:active { transform:scale(0.95); }
        .grid-tile .tile-icon { font-size:32px; display:block; margin-bottom:8px; }
        .grid-tile.active { border-color:var(--accent); background:rgba(79,70,229,0.08); }
        /* Search */
        .search-suggestion { padding:10px 14px; border-radius:8px; cursor:pointer; font-size:13px; transition:background 0.2s; }
        .search-suggestion:hover, .search-suggestion:active { background:var(--border); }
        /* Utilities */
        .hidden { display:none!important; }
        .flex-between { display:flex; justify-content:space-between; align-items:center; gap:8px; }
        .mt-8 { margin-top:8px; } .mt-12 { margin-top:12px; } .mb-8 { margin-bottom:8px; } .mb-12 { margin-bottom:12px; } .w-full { width:100%; } .gap-8 { gap:8px; } .gap-12 { gap:12px; } .text-center { text-align:center; }
        /* Auth */
        .auth-container { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
        .auth-box { width:100%; max-width:400px; background:var(--card); border-radius:var(--radius); border:1px solid var(--border); padding:28px; box-shadow:var(--shadow-lg); }
        .auth-tab { flex:1; padding:10px; background:none; border:none; cursor:pointer; font-weight:700; transition:color 0.2s, border-color 0.2s; }
        .auth-tab.active { color:var(--accent); border-bottom:2px solid var(--accent); }
        .auth-tab:not(.active) { color:var(--muted); border-bottom:2px solid transparent; }
        /* Preloader */
        #preloader { position:fixed; top:0; left:0; right:0; bottom:0; background:var(--bg); z-index:2000; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; transition:opacity 0.3s; }
        #preloader.hidden { opacity:0; pointer-events:none; }
        .loader-text { font-weight:600; color:var(--muted); }
        /* Links list */
        .links-list { display:flex; flex-direction:column; gap:10px; }
        .link-item { display:flex; align-items:center; gap:12px; padding:14px; background:var(--bg); border-radius:var(--radius-sm); border:1px solid var(--border); cursor:pointer; transition:transform 0.2s, background 0.2s; }
        .link-item:active { transform:scale(0.97); }
        .link-item .link-icon { font-size:24px; width:40px; text-align:center; }
        .link-item .link-label { flex:1; font-weight:600; }
        .link-item .link-value { color:var(--accent); font-size:13px; }
        /* Loader */
        .loader { border:3px solid var(--border); border-top:3px solid var(--accent); border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; margin:20px auto; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        /* Scrollbar */
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:var(--border); border-radius:4px; }
        ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
        /* Toast */
        .toast-container { position:fixed; top:70px; right:12px; z-index:999; display:flex; flex-direction:column; gap:8px; max-width:320px; }
        .toast { background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; box-shadow:var(--shadow-lg); font-size:13px; font-weight:500; color:var(--text); animation:slideIn 0.3s ease; }
        .toast.success { border-left:4px solid #10B981; }
        .toast.error { border-left:4px solid #EF4444; }
        .toast.info { border-left:4px solid var(--accent); }
        @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
    </style>
</head>

    <div id="preloader">
        <div class="loader"></div>
        <div class="loader-text">Загрузка...</div>

    <header class="header" id="appHeader">

            <div class="card">
                <div class="form-group"><label>Тип сделки</label><button class="btn secondary w-full" id="sendTypeBtn">Продажа</button></div>
                <div class="form-group"><label>Категория</label><button class="btn secondary w-full" id="sendCategoryBtn">Выберите категорию</button></div>
                <div class="form-group"><label>Название</label><input type="text" id="sendName" placeholder="Введите название"></div>

                <button class="btn w-full" id="sendSubmitBtn">Отправить объявление</button>
            </div>

            <div id="myAdsList"></div>
        </section>
        <section class="section" id="section-admin">

            <div id="adminPanelContent"></div>
        </section>
        <section class="section" id="section-all">
            <h2 style="margin-bottom:16px;font-weight:800;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
        </section>
    </main>

    <nav class="nav-bar" id="navBar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Все</span></button>

    <div id="tutorialContainer"></div>

    <div class="toast-container" id="toastContainer"></div>

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }
            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;

            async function loadHomeFeed(reset=true){
                if(reset) feedPage=0;
                const cont=document.getElementById('homeFeed'); if(reset) cont.innerHTML='<div class="loader"></div>';
                try{
                    let query = supabaseClient.from('ads').select('*').eq('status','approved').order('created_at',{ascending:false}).range(feedPage*FEED_PAGE_SIZE,(feedPage+1)*FEED_PAGE_SIZE-1);
                    if(currentFilterServer) query = query.eq('server', currentFilterServer);
                    const {data,error}=await withTimeout(query,8000); if(error) throw error;
                    const newAds = data || [];
                    const validAds = newAds.filter(ad=>!ad.expires_at || new Date(ad.expires_at)>new Date());
                    if(reset) homeAds=validAds; else homeAds=[...homeAds,...validAds];
                    renderHomeFeed(); feedPage++;
                }catch(e){ cont.innerHTML='<div class="empty-state">⚠️ Ошибка загрузки</div>'; }
            }
            function renderHomeFeed(){
                const cont=document.getElementById('homeFeed'); if(!homeAds.length){cont.innerHTML='<div class="empty-state">📭 Объявлений пока нет</div>';return;}
                let html=''; homeAds.forEach(ad=>{
                    const firstImg=ad.images?ad.images.split(',')[0].trim():''; const img=firstImg||DEFAULT_AD_IMAGE;
                    const modeBadge=ad.mode==='sell'?'<span class="badge sell">Продажа</span>':'<span class="badge buy">Покупка</span>';
                    const catLabel=ALL_CATEGORIES.find(c=>c.id===ad.category)?.label||ad.category;
                    let timer='';
                    if(ad.expires_at){
                        const diff=new Date(ad.expires_at)-new Date();
                        if(diff>0){ const total=Math.floor(diff/1000),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60; timer=`<div class="countdown-timer">⏳ Удаление через: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}</div>`; }
                        else timer='<div class="countdown-timer">⚠️ Удалено</div>';
                    }
                    html+=`<div class="card ad-card" data-ad-id="${ad.id}"><img class="ad-card-img" src="${img}" loading="lazy" onerror="this.src='${DEFAULT_AD_IMAGE}'"><div class="ad-card-info"><div class="ad-card-title">${ad.item_name||'Без названия'}</div><div class="ad-card-price">${formatPrice(ad.price)}</div><div class="ad-card-badges">${modeBadge}<span class="badge server">${ad.server}</span><span class="badge category">${catLabel}</span></div><div class="ad-card-author">Автор: ${ad.author_username||ad.author_id}</div>${timer}</div></div>`;
                });
                cont.innerHTML=html;
                cont.querySelectorAll('.ad-card').forEach(card=>card.addEventListener('click',()=>{const id=card.dataset.adId; const ad=homeAds.find(a=>a.id==id); if(ad)openAdDetail(ad);}));
                const loadMore=document.createElement('button'); loadMore.className='btn secondary w-full mt-12'; loadMore.textContent='Загрузить ещё'; loadMore.addEventListener('click',()=>loadHomeFeed(false)); cont.appendChild(loadMore);
            }

                    html+='<h3 style="margin-top:20px;">🚨 Жалобы</h3>'; if(!pendingReports.length)html+='<div class="empty-state">Нет жалоб</div>'; else pendingReports.forEach(rp=>{ html+=`<div class="card"><div style="font-weight:700;">Объявление ID: ${rp.ad_id}</div><div style="font-size:12px;color:var(--muted);">От: ${rp.reporter_username||rp.reporter_id}</div><div style="font-size:12px;">Причина: ${rp.reason}</div><div class="flex-between gap-8 mt-8"><button class="btn success" data-approve-report="${rp.id}">✅</button><button class="btn danger" data-reject-report="${rp.id}">❌</button></div></div>`; });

            function bindAdminEvents(){

            async function adminUserAction(action){ const target=document.getElementById('adminUsernameInput').value.trim(); if(!target){showAlert('Ошибка','Введите username или ID');return;} try{ let q=supabaseClient.from('app_users').select('*'); if(!isNaN(target))q=q.eq('id',target); else q=q.eq('username',target); const {data:users,error}=await withTimeout(q,5000); if(error)throw error; if(!users.length){showAlert('Ошибка','Пользователь не найден');return;} const user=users[0]; let updates={}; if(action==='ban')updates.banned=true; else if(action==='unban')updates.banned=false; else if(action==='make_admin')updates.is_admin=true; else if(action==='remove_admin')updates.is_admin=false; await supabaseClient.from('app_users').update(updates).eq('id',user.id); playSfx('success'); showAlert('Успех','Действие выполнено'); loadAdminPanel(); }catch(e){showAlert('Ошибка','Не удалось выполнить');} }

            // ===================== ДЕТАЛИ =====================
            async function openAdDetail(ad){

                const overlay=document.getElementById('modalOverlay');
                if(ad.status==='approved'){
                    document.getElementById('detailContactBtn').addEventListener('click',()=>window.open(`https://t.me/${ad.author_username||ad.author_id}`,'_blank'));
                    const cartBtn=document.getElementById('detailCartToggleBtn'); cartBtn.textContent=isFav?'🛒 Убрать из корзины':'🛒 В корзину';
                    cartBtn.addEventListener('click',async()=>{ if(isFav){await supabaseClient.from('favorites').delete().eq('user_id',currentAuthUser.id).eq('ad_id',ad.id); cartBtn.textContent='🛒 В корзину';} else {await supabaseClient.from('favorites').insert({user_id:currentAuthUser.id,ad_id:ad.id}); cartBtn.textContent='🛒 Убрать из корзины';} loadCart(); });
                    document.getElementById('detailReviewsBtn').addEventListener('click',()=>openReviewsModal(ad.id));
                    if(ad.author_id===currentAuthUser.id) document.getElementById('detailDeleteBtn').addEventListener('click',async()=>{showConfirm('Удаление','Удалить объявление?',async()=>{await supabaseClient.from('ads').update({status:'deleted'}).eq('id',ad.id); overlay.remove(); loadHomeFeed();});});
                    document.getElementById('detailReportBtn').addEventListener('click',()=>{ showModal(`<h3 class="modal-title">🚨 Пожаловаться</h3><div class="form-group"><label>Причина</label><textarea id="reportReason"></textarea></div><button class="btn w-full" id="reportSubmitBtn">Отправить</button>`); document.getElementById('reportSubmitBtn').addEventListener('click',async()=>{ const reason=document.getElementById('reportReason').value.trim(); if(!reason){showAlert('Ошибка','Введите причину');return;} await supabaseClient.from('reports').insert({ad_id:ad.id,reporter_id:currentAuthUser.id,reporter_username:currentAuthUser.username,reason,status:'pending',created_at:new Date().toISOString()}); showAlert('Успех','Жалоба отправлена'); document.getElementById('modalOverlay').remove(); }); });

            async function checkIfInCart(adId){ if(!currentAuthUser)return false; const {data,error}=await supabaseClient.from('favorites').select('*').eq('user_id',currentAuthUser.id).eq('ad_id',adId).maybeSingle(); if(error)return false; return !!data; }
            async function loadReviews(adId){ const cont=document.getElementById('detailReviewsSection'); if(!cont)return; try{ const {data:reviews,error}=await withTimeout(supabaseClient.from('reviews').select('*').eq('ad_id',adId).order('created_at',{ascending:false}),5000); if(error)throw error; const revs=reviews||[]; if(!revs.length){cont.innerHTML='<p style="color:var(--muted);">⭐ Отзывов пока нет</p>';return;} const avg=revs.reduce((s,r)=>s+r.stars,0)/revs.length; let html=`<div style="font-size:20px;font-weight:800;">⭐ ${avg.toFixed(1)} (${revs.length})</div><div class="progress-bar mb-12"><div class="progress-fill" style="width:${(avg/5*100)}%;"></div></div>`; revs.forEach(r=>{ const canEdit=r.author_id===currentAuthUser.id&&(Date.now()-new Date(r.created_at).getTime())<7*24*60*60*1000; html+=`<div class="review-item"><div style="font-weight:600;">${r.author_username||r.author_id} <span style="color:var(--gold);">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span></div><div style="font-size:12px;color:var(--muted);">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div><p style="font-size:13px;margin:4px 0;">${r.text||''}</p>${r.media_links?`<div style="font-size:11px;color:var(--accent);">${r.media_links}</div>`:''}${canEdit?`<div class="flex-between gap-8 mt-8"><button class="btn secondary" data-edit-review="${r.id}">✏️</button><button class="btn danger" data-del-review="${r.id}">🗑</button></div>`:''}</div>`; }); cont.innerHTML=html; cont.querySelectorAll('[data-edit-review]').forEach(btn=>btn.addEventListener('click',()=>{const r=revs.find(x=>x.id==btn.dataset.editReview); if(r)openEditReviewModal(r);})); cont.querySelectorAll('[data-del-review]').forEach(btn=>btn.addEventListener('click',async()=>{await supabaseClient.from('reviews').delete().eq('id',btn.dataset.delReview); loadReviews(adId);})); }catch(e){cont.innerHTML='<p style="color:var(--muted);">⚠️ Не удалось загрузить отзывы</p>';} }
            async function loadSimilarAds(category,currentId){ const cont=document.getElementById('detailSimilarAds'); if(!cont)return; try{ const {data}=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('category',category).neq('id',currentId).limit(3).order('created_at',{ascending:false}),5000); const similar=data||[]; if(!similar.length){cont.innerHTML='<p style="color:var(--muted);">Похожих нет</p>';return;} cont.innerHTML=similar.map(ad=>`<div class="card" data-sim="${ad.id}"><span style="font-weight:700;">${ad.item_name}</span> • ${formatPrice(ad.price)}</div>`).join(''); cont.querySelectorAll('[data-sim]').forEach(el=>el.addEventListener('click',()=>{const found=similar.find(a=>a.id==el.dataset.sim); if(found){document.getElementById('modalOverlay').remove(); openAdDetail(found);}})); }catch(e){} }
            function openReviewsModal(adId){ showModal(`<h3 class="modal-title">⭐ Оставить отзыв</h3><div class="form-group"><label>Оценка</label><div class="star-rating" id="reviewStars">${[1,2,3,4,5].map(i=>`<span data-star="${i}">☆</span>`).join('')}</div></div><div class="form-group"><label>Ссылки</label><input type="text" id="reviewMedia" placeholder="https://..."></div><div class="form-group"><label>Текст</label><textarea id="reviewText"></textarea></div><button class="btn w-full" id="reviewSubmitBtn">Отправить</button>`); let selected=0; const stars=document.getElementById('reviewStars'); stars.querySelectorAll('span').forEach(s=>s.addEventListener('click',()=>{selected=parseInt(s.dataset.star); updateStars(stars,selected);})); document.getElementById('reviewSubmitBtn').addEventListener('click',async()=>{ if(!selected){showAlert('Ошибка','Выберите оценку');return;} const text=document.getElementById('reviewText').value.trim(); const media=document.getElementById('reviewMedia').value.trim(); const lc=checkLinksString(media); if(!lc.valid){showAlert('Ошибка',lc.message);return;} try{ await supabaseClient.from('reviews').insert({ad_id:adId,author_id:currentAuthUser.id,author_username:currentAuthUser.username,stars:selected,text,media_links:media,created_at:new Date().toISOString()}); playSfx('success'); showAlert('Успех','Отзыв отправлен'); document.getElementById('modalOverlay').remove(); loadReviews(adId); }catch(e){showAlert('Ошибка','Не удалось отправить отзыв');} }); }
            function updateStars(container,selected){ container.querySelectorAll('span').forEach(s=>{ s.textContent=parseInt(s.dataset.star)<=selected?'★':'☆'; s.classList.toggle('active',parseInt(s.dataset.star)<=selected); }); }
            function openEditReviewModal(review){ showModal(`<h3 class="modal-title">✏️ Редактировать отзыв</h3><div class="form-group"><label>Оценка</label><div class="star-rating" id="editReviewStars">${[1,2,3,4,5].map(i=>`<span data-star="${i}" class="${i<=review.stars?'active':''}">${i<=review.stars?'★':'☆'}</span>`).join('')}</div></div><div class="form-group"><label>Ссылки</label><input type="text" id="editReviewMedia" value="${review.media_links||''}"></div><div class="form-group"><label>Текст</label><textarea id="editReviewText">${review.text||''}</textarea></div><button class="btn w-full" id="editReviewSubmitBtn">Сохранить</button>`); let selected=review.stars; const stars=document.getElementById('editReviewStars'); stars.querySelectorAll('span').forEach(s=>s.addEventListener('click',()=>{selected=parseInt(s.dataset.star); updateStars(stars,selected);})); document.getElementById('editReviewSubmitBtn').addEventListener('click',async()=>{ const text=document.getElementById('editReviewText').value.trim(); const media=document.getElementById('editReviewMedia').value.trim(); const lc=checkLinksString(media); if(!lc.valid){showAlert('Ошибка',lc.message);return;} await supabaseClient.from('reviews').update({stars:selected,text,media_links:media}).eq('id',review.id); playSfx('success'); document.getElementById('modalOverlay').remove(); loadReviews(review.ad_id); }); }

            // ===================== ИГРА БАРЫГА =====================
            async function loadGameState(){
                if(!currentAuthUser)return; if(barygaStateLoaded)return;
                const {data,error}=await withTimeout(supabaseClient.from('baryga').select('*').eq('user_id',currentAuthUser.id).maybeSingle(),5000); if(error)console.warn(error);
                if(data){
                    gameState={money:data.money||0,clickPower:data.click_power||1,clickCost:data.click_cost||50,autoIncome:data.auto_income||0,autoCost:data.auto_cost||200,proCost:data.pro_cost||800,shopCost:data.shop_cost||3000,eliteCost:data.elite_cost||10000,oilCost:data.oil_cost||35000,cryptoCost:data.crypto_cost||150000,scrapCost:data.scrap_cost||500,last_seen:data.last_seen||new Date().toISOString()};
                    const last=new Date(gameState.last_seen).getTime(); const diff=Math.min((Date.now()-last)/1000,3600); if(diff>0&&gameState.autoIncome>0){gameState.money+=gameState.autoIncome*diff; gameState.last_seen=new Date().toISOString(); saveGameState();}
                } else { gameState={...gameState,user_id:currentAuthUser.id,last_seen:new Date().toISOString()}; await supabaseClient.from('baryga').insert(gameState); }
                barygaStateLoaded=true;
            }
            function openBarygaGame(){
                loadGameState().then(()=>{
                    showModal(`<h3 class="modal-title">🎮 Игра «Барыга»</h3><div style="text-align:center;font-size:24px;font-weight:900;margin-bottom:8px;" id="gameMoneyDisplay">💰 ${formatPrice(gameState.money)}</div><div class="game-click-area" id="gameClickArea"><img src="https://i.postimg.cc/3RnGkVNw/4827782b1f3adf82a5db028d6ed0e8a7.jpg" alt="Клик"></div><div style="font-size:12px;color:var(--muted);text-align:center;" id="gameStatsDisplay">Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек</div><div class="mt-12" id="gameUpgradesContainer"></div>`, ()=>saveGameState());
                    const clickArea=document.getElementById('gameClickArea'); const upgradesCont=document.getElementById('gameUpgradesContainer'); upgradesCont.innerHTML=renderUpgrades();
                    let lastAuto=Date.now();
                    function loop(){ if(!document.getElementById('gameClickArea'))return; const now=Date.now(); if(now-lastAuto>=1000){ if(gameState.autoIncome>0){ gameState.money+=gameState.autoIncome; gameState.last_seen=new Date().toISOString(); updateGameUIFast(); saveGameStateDebounced(); } lastAuto=now; } requestAnimationFrame(loop); }
                    requestAnimationFrame(loop);
                    clickArea.addEventListener('click',()=>{gameState.money+=gameState.clickPower; updateGameUIFast(); saveGameStateDebounced(); clickArea.style.transform='scale(0.92)'; setTimeout(()=>clickArea.style.transform='',80);});
                    upgradesCont.addEventListener('click',(e)=>{const btn=e.target.closest('[data-upgrade]'); if(!btn)return; const idx=parseInt(btn.dataset.upgrade); const up=getUpgradesList()[idx]; if(gameState.money>=up.cost){gameState.money-=up.cost; up.action(); updateGameUIFast(); saveGameStateDebounced(); playSfx('buy');}});
                });
            }
            function getUpgradesList(){ return [ {name:'Клик +1',cost:gameState.clickCost,action:()=>{gameState.clickPower+=1;gameState.clickCost*=2;}}, {name:'Авто +5/сек',cost:gameState.autoCost,action:()=>{gameState.autoIncome+=5;gameState.autoCost*=2;}}, {name:'Про +20/сек',cost:gameState.proCost,action:()=>{gameState.autoIncome+=20;gameState.proCost*=2;}}, {name:'Магазин +50/сек',cost:gameState.shopCost,action:()=>{gameState.autoIncome+=50;gameState.shopCost*=2;}}, {name:'Элита: клик +10',cost:gameState.eliteCost,action:()=>{gameState.clickPower+=10;gameState.eliteCost*=2;}}, {name:'Нефть +200/сек',cost:gameState.oilCost,action:()=>{gameState.autoIncome+=200;gameState.oilCost*=2;}}, {name:'Крипта +1000/сек',cost:gameState.cryptoCost,action:()=>{gameState.autoIncome+=1000;gameState.cryptoCost*=2;}}, {name:'Скупка лома +500/сек',cost:gameState.scrapCost,action:()=>{gameState.autoIncome+=500;gameState.scrapCost*=2;}} ]; }
            function renderUpgrades(){ return getUpgradesList().map((u,i)=>`<div class="upgrade-card"><div class="upgrade-info"><div class="upgrade-name">${u.name}</div><div class="upgrade-cost" data-cost-idx="${i}">💰 ${formatPrice(u.cost)}</div></div><button class="btn secondary" data-upgrade="${i}" ${gameState.money<u.cost?'disabled':''}>Купить</button></div>`).join(''); }
            function updateGameUIFast(){ const moneyEl=document.getElementById('gameMoneyDisplay'); if(moneyEl)moneyEl.textContent='💰 '+formatPrice(gameState.money); const statsEl=document.getElementById('gameStatsDisplay'); if(statsEl)statsEl.textContent=`Клик: +${gameState.clickPower} | Авто: +${gameState.autoIncome}/сек`; getUpgradesList().forEach((u,i)=>{ const btn=document.querySelector(`[data-upgrade="${i}"]`); const cost=document.querySelector(`[data-cost-idx="${i}"]`); if(btn&&cost){cost.textContent='💰 '+formatPrice(u.cost); if(gameState.money<u.cost)btn.setAttribute('disabled','true'); else btn.removeAttribute('disabled');} }); }
            function saveGameStateDebounced(){ if(saveGameTimeout)clearTimeout(saveGameTimeout); saveGameTimeout=setTimeout(saveGameState,1000); }
            async function saveGameState(){ if(!currentAuthUser)return; try{ const {data}=await supabaseClient.from('baryga').select('id').eq('user_id',currentAuthUser.id).single(); if(data){ await supabaseClient.from('baryga').update({money:gameState.money,click_power:gameState.clickPower,click_cost:gameState.clickCost,auto_income:gameState.autoIncome,auto_cost:gameState.autoCost,pro_cost:gameState.proCost,shop_cost:gameState.shopCost,elite_cost:gameState.eliteCost,oil_cost:gameState.oilCost,crypto_cost:gameState.cryptoCost,scrap_cost:gameState.scrapCost,last_seen:new Date().toISOString()}).eq('id',data.id); } else { await supabaseClient.from('baryga').insert({...gameState,user_id:currentAuthUser.id}); } }catch(e){console.warn('saveGameState',e);} }

            // ===================== ПОИСК =====================
            function openSearchModal(){ showModal(`<h3 class="modal-title">🔍 Поиск</h3><div class="form-group"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off"></div><div class="flex-between gap-8 mb-12"><button class="btn w-full" id="searchItemBtn">📦 Предмет</button><button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button></div><div id="searchSuggestions"></div><div id="searchHistory"></div><div id="searchResults"></div>`); const input=document.getElementById('searchInput'); setTimeout(()=>input.focus(),100); const sugg=document.getElementById('searchSuggestions'), res=document.getElementById('searchResults'), hist=document.getElementById('searchHistory'); function renderHist(){ if(!searchHistory.length){hist.innerHTML='';return;} hist.innerHTML='<div style="font-size:12px;color:var(--muted);margin-bottom:8px;">📜 История:</div>'+searchHistory.map(h=>`<span class="badge" style="cursor:pointer;margin:2px;" data-hist="${h}">${h}</span>`).join(''); hist.querySelectorAll('[data-hist]').forEach(el=>el.addEventListener('click',()=>{input.value=el.dataset.hist; input.dispatchEvent(new Event('input'));})); } renderHist(); input.addEventListener('input',async()=>{ const q=input.value.trim().toLowerCase(); if(!q){sugg.innerHTML='';res.innerHTML='';return;} const {data,error}=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').ilike('item_name',`%${q}%`).limit(5),5000); if(error)return; const items=data||[]; sugg.innerHTML=items.map(ad=>`<div class="search-suggestion" data-sug="${ad.id}">📦 ${ad.item_name} • ${formatPrice(ad.price)}</div>`).join(''); sugg.querySelectorAll('[data-sug]').forEach(el=>el.addEventListener('click',()=>{const ad=items.find(a=>a.id==el.dataset.sug); if(ad){saveSearchQuery(q); document.getElementById('modalOverlay').remove(); openAdDetail(ad);}})); }); document.getElementById('searchItemBtn').addEventListener('click',async()=>{ const q=input.value.trim().toLowerCase(); if(!q)return; saveSearchQuery(q); const {data,error}=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').ilike('item_name',`%${q}%`),5000); if(error)return; const items=data||[]; if(!items.length){res.innerHTML='<div class="empty-state">Ничего не найдено</div>';return;} res.innerHTML=items.map(ad=>`<div class="card" data-res-id="${ad.id}"><div style="font-weight:700;">${ad.item_name}</div><div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div></div>`).join(''); res.querySelectorAll('[data-res-id]').forEach(card=>card.addEventListener('click',()=>{const ad=items.find(a=>a.id==card.dataset.resId); if(ad){document.getElementById('modalOverlay').remove(); openAdDetail(ad);}})); }); document.getElementById('searchProfileBtn').addEventListener('click',()=>{const q=input.value.trim(); if(q)openProfileModal(q);}); }
            async function openProfileModal(authorIdOrUsername){ let userId=authorIdOrUsername; if(typeof authorIdOrUsername==='string'&&authorIdOrUsername.startsWith('@')){ const username=authorIdOrUsername.substring(1); const {data}=await supabaseClient.from('app_users').select('id').eq('username',username).maybeSingle(); if(data)userId=data.id; else userId=null; } showModal(`<h3 class="modal-title">👤 Профиль: ${authorIdOrUsername}</h3><div id="profileAdsList"><div class="loader"></div></div>`); if(!userId){document.getElementById('profileAdsList').innerHTML='<div class="empty-state">Пользователь не найден</div>';return;} try{ const {data}=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('author_id',userId).order('created_at',{ascending:false}),5000); const ads=data||[]; const {count}=await supabaseClient.from('ads').select('*',{count:'exact',head:true}).eq('author_id',userId); const {data:reviews}=await supabaseClient.from('reviews').select('stars').eq('ad_id',userId); const avg=reviews&&reviews.length?(reviews.reduce((s,r)=>s+r.stars,0)/reviews.length).toFixed(1):'—'; const cont=document.getElementById('profileAdsList'); let html=`<div style="margin-bottom:16px;"><strong>Объявлений:</strong> ${count||0} • <strong>Средняя оценка:</strong> ⭐${avg}</div>`; if(!ads.length)html+='<div class="empty-state">Нет активных объявлений</div>'; else html+=ads.map(ad=>`<div class="card" data-prof-ad="${ad.id}"><div style="font-weight:700;">${ad.item_name}</div><div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div></div>`).join(''); cont.innerHTML=html; cont.querySelectorAll('[data-prof-ad]').forEach(card=>card.addEventListener('click',()=>{const ad=ads.find(a=>a.id==card.dataset.profAd); if(ad){document.getElementById('modalOverlay').remove(); openAdDetail(ad);}})); }catch(e){document.getElementById('profileAdsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>';} }

            // ===================== ВСЕ РАЗДЕЛЫ =====================
            function loadAllTiles(){ const tiles=[ {id:'looks',icon:'📸',label:'Лента «Луков»'}, {id:'companions',icon:'👥',label:'Попутчики'}, {id:'music',icon:'🎵',label:'Музыка'}, {id:'baryga',icon:'🎮',label:'Игра «Барыга»'}, {id:'settings',icon:'⚙️',label:'Настройки'}, {id:'manager',icon:'👨‍💼',label:'Менеджер'}, {id:'chat',icon:'💬',label:'Переписки'}, {id:'notifications',icon:'🔔',label:'Уведомления'}, {id:'achievements',icon:'🏆',label:'Достижения'} ]; const cont=document.getElementById('allTiles'); cont.innerHTML=tiles.map(t=>`<div class="grid-tile" data-tile="${t.id}"><span class="tile-icon">${t.icon}</span><span>${t.label}</span></div>`).join(''); cont.querySelectorAll('[data-tile]').forEach(tile=>tile.addEventListener('click',()=>{ const id=tile.dataset.tile; if(id==='looks')openLooksModal(); if(id==='companions')openCompanionsModal(); if(id==='music')openMusicModal(); if(id==='baryga')openBarygaGame(); if(id==='settings')openSettingsModal(); if(id==='manager')openManagerModal(); if(id==='chat')openChatModal(); if(id==='notifications')openNotificationsModal(); if(id==='achievements')openAchievementsModal(); })); }

            // ===================== ЛУКИ, ПОПУТЧИКИ, МУЗЫКА =====================
            function openLooksModal(){ showModal(`<h3 class="modal-title">📸 Лента «Луков»</h3><div class="form-group"><label>Ссылка на фото</label><input type="text" id="lookImg" placeholder="https://..."></div><div class="form-group"><label>Описание</label><input type="text" id="lookDesc" placeholder="Мой лук"></div><button class="btn w-full mb-12" id="lookSubmitBtn">Опубликовать</button><div id="looksList"><div class="loader"></div></div>`); loadLooksFeed(); document.getElementById('lookSubmitBtn').addEventListener('click',async()=>{ const img=document.getElementById('lookImg').value.trim(); const desc=document.getElementById('lookDesc').value.trim(); const lc=checkLinksString(img); if(!lc.valid){showAlert('Ошибка',lc.message);return;} await supabaseClient.from('looks').insert({author_id:currentAuthUser.id,author_username:currentAuthUser.username,image_url:img,description:desc,created_at:new Date().toISOString()}); playSfx('success'); document.getElementById('lookImg').value=''; document.getElementById('lookDesc').value=''; loadLooksFeed(); }); }
            async function loadLooksFeed(){ const cont=document.getElementById('looksList'); if(!cont)return; const {data,error}=await withTimeout(supabaseClient.from('looks').select('*').order('created_at',{ascending:false}),5000); if(error){cont.innerHTML='<div class="empty-state">⚠️ Ошибка</div>';return;} const looks=data||[]; if(!looks.length){cont.innerHTML='<div class="empty-state">📸 Образов пока нет</div>';return;} cont.innerHTML=looks.map(l=>`<div class="card"><img src="${l.image_url}" loading="lazy" style="width:100%;height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px;" onerror="this.style.display='none'"><div style="font-weight:700;font-size:13px;">${l.author_username||l.author_id}</div><p style="font-size:13px;color:var(--muted);">${l.description||''}</p>${l.author_id===currentAuthUser.id?`<button class="btn danger mt-8" data-del-look="${l.id}">🗑</button>`:''}</div>`).join(''); cont.querySelectorAll('[data-del-look]').forEach(btn=>btn.addEventListener('click',async()=>{await supabaseClient.from('looks').delete().eq('id',btn.dataset.delLook); loadLooksFeed();})); }
            function openCompanionsModal(){ showModal(`<h3 class="modal-title">👥 Попутчики</h3><div class="form-group"><label>Цель</label><input type="text" id="compTarget" placeholder="Например: еду на шахту"></div><div class="form-group"><label>Контакты</label><input type="text" id="compContact" placeholder="@username"></div><button class="btn w-full mb-12" id="compSubmitBtn">Найти напарника</button><div id="companionsList"><div class="loader"></div></div>`); loadCompanionsFeed(); document.getElementById('compSubmitBtn').addEventListener('click',async()=>{ const target=document.getElementById('compTarget').value.trim(); const contact=document.getElementById('compContact').value.trim(); if(!target||!contact){showAlert('Ошибка','Заполните все поля');return;} await supabaseClient.from('companions').insert({author_id:currentAuthUser.id,author_username:currentAuthUser.username,target,contact,created_at:new Date().toISOString()}); playSfx('success'); document.getElementById('compTarget').value=''; document.getElementById('compContact').value=''; loadCompanionsFeed(); }); }
            async function loadCompanionsFeed(){ const cont=document.getElementById('companionsList'); if(!cont)return; const {data,error}=await withTimeout(supabaseClient.from('companions').select('*').order('created_at',{ascending:false}),5000); if(error){cont.innerHTML='<div class="empty-state">⚠️ Ошибка</div>';return;} const comps=data||[]; if(!comps.length){cont.innerHTML='<div class="empty-state">👥 Заявок нет</div>';return;} cont.innerHTML=comps.map(c=>`<div class="card"><div style="font-weight:700;">${c.target}</div><div style="font-size:12px;color:var(--muted);">Автор: ${c.author_username||c.author_id} • Контакт: ${c.contact}</div>${c.author_id===currentAuthUser.id?`<button class="btn danger mt-8" data-del-comp="${c.id}">🗑</button>`:''}</div>`).join(''); cont.querySelectorAll('[data-del-comp]').forEach(btn=>btn.addEventListener('click',async()=>{await supabaseClient.from('companions').delete().eq('id',btn.dataset.delComp); loadCompanionsFeed();})); }
            function openMusicModal(){ showModal(`<h3 class="modal-title">🎵 Музыка</h3><div class="form-group"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://..."></div><div class="flex-between gap-8 mb-12"><button class="btn w-full" id="musicPlayBtn">▶️ Играть</button><button class="btn secondary w-full" id="musicPauseBtn">⏸ Пауза</button></div><button class="btn danger w-full" id="musicResetBtn">⏹ Сбросить</button>`); let activeAudio=window.appCurrentAudio||null; document.getElementById('musicPlayBtn').addEventListener('click',()=>{ const url=document.getElementById('musicUrl').value.trim(); if(url){ if(activeAudio)activeAudio.pause(); activeAudio=new Audio(url); window.appCurrentAudio=activeAudio; activeAudio.play().catch(()=>showAlert('Ошибка','Не удалось воспроизвести')); } else if(activeAudio)activeAudio.play(); }); document.getElementById('musicPauseBtn').addEventListener('click',()=>{if(activeAudio)activeAudio.pause();}); document.getElementById('musicResetBtn').addEventListener('click',()=>{if(activeAudio){activeAudio.pause();window.appCurrentAudio=null;} document.getElementById('musicUrl').value='';}); }

            // ===================== НАСТРОЙКИ =====================
            function openSettingsModal(){ showModal(`<h3 class="modal-title">⚙️ Настройки</h3><div class="form-group flex-between"><label>🔊 Звуки</label><input type="checkbox" id="settingsSfx" ${sfxEnabled?'checked':''} style="width:22px;height:22px;"></div><div class="form-group flex-between"><label>🌙 Тёмная тема</label><input type="checkbox" id="settingsDark" ${currentTheme==='dark'?'checked':''} style="width:22px;height:22px;"></div><button class="btn secondary w-full mt-12" id="settingsLogoutBtn">🚪 Выйти</button><button class="btn danger w-full mt-8" id="settingsDeleteBtn">🗑 Удалить аккаунт</button>`); document.getElementById('settingsSfx').addEventListener('change',async(e)=>{sfxEnabled=e.target.checked; if(currentAuthUser)await supabaseClient.from('user_settings').update({sfx_enabled:sfxEnabled}).eq('user_id',currentAuthUser.id);}); document.getElementById('settingsDark').addEventListener('change',async(e)=>{currentTheme=e.target.checked?'dark':'light'; applyTheme(); if(currentAuthUser)await supabaseClient.from('user_settings').update({theme:currentTheme}).eq('user_id',currentAuthUser.id);}); document.getElementById('settingsLogoutBtn').addEventListener('click',()=>{localStorage.removeItem('arizona_current_user'); currentAuthUser=null; document.getElementById('modalOverlay').remove(); showAuthScreen();}); document.getElementById('settingsDeleteBtn').addEventListener('click',showDeleteAccountModal); }
            function showDeleteAccountModal(){ showModal(`<h3 class="modal-title">🗑 Удаление аккаунта</h3><p style="color:var(--muted);margin-bottom:16px;">Введите пароль для подтверждения.</p><div class="form-group"><label>Пароль</label><input type="password" id="deletePassInput"></div><button class="btn danger w-full" id="confirmDeleteBtn">Удалить</button><p id="deleteError" style="color:#EF4444;font-size:12px;margin-top:8px;"></p>`); document.getElementById('confirmDeleteBtn').addEventListener('click',async()=>{ const pass=document.getElementById('deletePassInput').value.trim(); const errEl=document.getElementById('deleteError'); if(!pass){errEl.textContent='Введите пароль';return;} const hash=await hashPassword(pass); if(hash!==currentAuthUser.password_hash){errEl.textContent='Неверный пароль';return;} showConfirm('Удаление','Удалить аккаунт и все данные?',async()=>{ try{ await supabaseClient.from('app_users').delete().eq('id',currentAuthUser.id); await supabaseClient.from('user_settings').delete().eq('user_id',currentAuthUser.id); await supabaseClient.from('user_progress').delete().eq('user_id',currentAuthUser.id); await supabaseClient.from('ads').delete().eq('author_id',currentAuthUser.id); await supabaseClient.from('favorites').delete().eq('user_id',currentAuthUser.id); await supabaseClient.from('search_history').delete().eq('user_id',currentAuthUser.id); await supabaseClient.from('baryga').delete().eq('user_id',currentAuthUser.id); await supabaseClient.from('looks').delete().eq('author_id',currentAuthUser.id); await supabaseClient.from('companions').delete().eq('author_id',currentAuthUser.id); await supabaseClient.from('notifications').delete().eq('user_id',currentAuthUser.id); await supabaseClient.from('reviews').delete().eq('author_id',currentAuthUser.id); await supabaseClient.from('appeals').delete().eq('author_id',currentAuthUser.id); await supabaseClient.from('reports').delete().eq('reporter_id',currentAuthUser.id); localStorage.removeItem('arizona_current_user'); currentAuthUser=null; document.getElementById('modalOverlay').remove(); showAuthScreen(); showToast('Аккаунт удалён','success'); }catch(e){showAlert('Ошибка','Не удалось удалить аккаунт');} }); }); }

            // ===================== МЕНЕДЖЕР (только менеджер и ВК) =====================
            function openManagerModal(){ showModal(`<h3 class="modal-title">👨‍💼 Менеджер / Поддержка</h3><div class="links-list"><div class="link-item" data-link="https://t.me/bounqy31"><span class="link-icon">👨‍💼</span><span class="link-label">Менеджер</span><span class="link-value">@bounqy31</span></div><div class="link-item" data-link="https://vk.com/bountyarz"><span class="link-icon">👥</span><span class="link-label">ВК сообщество</span><span class="link-value">@bountyarz</span></div></div>`); document.querySelectorAll('.link-item').forEach(item=>item.addEventListener('click',()=>{window.open(item.dataset.link,'_blank');document.getElementById('modalOverlay').remove();})); }

            // ===================== ПЕРЕПИСКИ, УВЕДОМЛЕНИЯ, ДОСТИЖЕНИЯ =====================
            function openChatModal(){ showModal(`<h3 class="modal-title">💬 Переписки</h3><div class="empty-state">Переписки ведутся напрямую в Telegram.</div><button class="btn w-full mt-12" id="chatTgBtn">📱 Перейти в Telegram</button>`); document.getElementById('chatTgBtn').addEventListener('click',()=>window.open('https://t.me/','_blank')); }
            async function openNotificationsModal(){ showModal(`<h3 class="modal-title">🔔 Уведомления</h3><div id="notificationsList"><div class="loader"></div></div>`); try{ const {data,error}=await withTimeout(supabaseClient.from('notifications').select('*').eq('user_id',currentAuthUser.id).order('created_at',{ascending:false}),5000); if(error)throw error; const notif=data||[]; const cont=document.getElementById('notificationsList'); if(!notif.length){cont.innerHTML='<div class="empty-state">Нет уведомлений</div>';return;} cont.innerHTML=notif.map(n=>`<div class="card ${!n.read?'inactive-card':''}"><div style="font-weight:600;">${n.message}</div><div style="font-size:11px;color:var(--muted);">${new Date(n.created_at).toLocaleString('ru-RU')}</div></div>`).join(''); await supabaseClient.from('notifications').update({read:true}).eq('user_id',currentAuthUser.id).eq('read',false); unreadNotifications=0; }catch(e){document.getElementById('notificationsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>';} }
            async function openAchievementsModal(){ showModal(`<h3 class="modal-title">🏆 Достижения</h3><div id="achievementsList"><div class="loader"></div></div>`); try{ const [ua,ur,uf,ul,uc]=await Promise.all([supabaseClient.from('ads').select('id').eq('author_id',currentAuthUser.id),supabaseClient.from('reviews').select('id').eq('author_id',currentAuthUser.id),supabaseClient.from('favorites').select('id').eq('user_id',currentAuthUser.id),supabaseClient.from('looks').select('id').eq('author_id',currentAuthUser.id),supabaseClient.from('companions').select('id').eq('author_id',currentAuthUser.id)]); const achievements=[ {name:'Новичок',desc:'Создайте первое объявление',achieved:(ua.data?.length||0)>=1,icon:'📝'}, {name:'Активный',desc:'Создайте 10 объявлений',achieved:(ua.data?.length||0)>=10,icon:'📈'}, {name:'Критик',desc:'Оставьте первый отзыв',achieved:(ur.data?.length||0)>=1,icon:'⭐'}, {name:'Коллекционер',desc:'Добавьте 5 в корзину',achieved:(uf.data?.length||0)>=5,icon:'🛒'}, {name:'Модник',desc:'Опубликуйте свой лук',achieved:(ul.data?.length||0)>=1,icon:'📸'}, {name:'Компаньон',desc:'Найдите попутчика',achieved:(uc.data?.length||0)>=1,icon:'👥'} ]; const cont=document.getElementById('achievementsList'); cont.innerHTML=achievements.map(a=>`<div class="card" style="opacity:${a.achieved?'1':'0.5'};"><div class="flex-between"><div><span style="font-size:24px;">${a.icon}</span> <strong>${a.name}</strong></div><span>${a.achieved?'✅':'🔒'}</span></div><div style="font-size:12px;color:var(--muted);">${a.desc}</div></div>`).join(''); }catch(e){document.getElementById('achievementsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>';} }

            // ===================== ЗАПУСК =====================
            const telegramOk = initTelegram();
            if (!telegramOk) return;
            if (!initSupabase()) return;
            checkAuth();
            window.addEventListener('online', () => { if (currentSection === 'home') loadHomeFeed(); });
            document.addEventListener('DOMContentLoaded', () => setupServerSelector());
            console.log('Arizona RP App fully initialized');
        })();
    </script>
</body>
</html>
