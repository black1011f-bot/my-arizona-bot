<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс (Full Ultra)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ И СТИЛИ ========== */
        :root {
            --bg: #F4F5F9;
            --card: #FFFFFF;
            --border: #E2E4EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
            --radius: 14px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 58px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.2s;
        }
        [data-theme="dark"] {
            --bg: #121214;
            --card: #1E1E22;
            --border: #2C2C32;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #9E9EA5;
            --shadow: 0 4px 20px rgba(0,0,0,0.35);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: var(--font); }
        body {
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; overflow-x: hidden;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }

        /* Загрузочный экран (предотвращает мигание главной перед регистрацией) */
        #appLoader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 2000; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; transition: opacity 0.3s ease;
        }

        .container {
            max-width: var(--container-width); margin: 0 auto; padding: 0 12px;
            padding-top: calc(var(--header-height) + 12px);
            padding-bottom: calc(var(--nav-height) + 24px);
        }

        /* Хедер */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 8px 12px;
            height: var(--header-height); gap: 10px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        /* Квадратная миниатюрная иконка с полукруглыми углами */
        .header-logo {
            width: 38px; height: 38px; border-radius: 10px;
            overflow: hidden; flex-shrink: 0; cursor: pointer;
            border: 1px solid var(--border); background: var(--card);
            transition: transform 0.15s ease;
        }
        .header-logo:active { transform: scale(0.92); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-weight: 900; font-size: 17px; color: var(--text); flex-shrink: 0; }
        .header-search { flex: 1; min-width: 0; cursor: pointer; }
        .header-search input {
            width: 100%; padding: 8px 12px; border-radius: 20px;
            border: 1px solid var(--border); background: var(--card);
            color: var(--text); font-size: 13px; outline: none; pointer-events: none;
        }
        .theme-toggle {
            background: none; border: none; font-size: 20px; cursor: pointer;
            padding: 4px; border-radius: 8px; flex-shrink: 0;
        }

        /* Навигация */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: var(--bg); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
            height: var(--nav-height); padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2px; background: none; border: none; color: var(--muted);
            font-size: 10px; font-weight: 700; cursor: pointer; padding: 4px 8px;
            border-radius: 10px; flex: 1; max-width: 80px; min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon { font-size: 20px; line-height: 1; }
        .nav-item.active { color: var(--accent); background: rgba(0, 91, 255, 0.08); }
        .nav-item:active { transform: scale(0.93); }

        /* Секции */
        .section { display: none; opacity: 0; transform: translateY(8px); transition: opacity 0.2s ease, transform 0.2s ease; }
        .section.active { display: block; opacity: 1; transform: translateY(0); }

        /* Фильтр серверов в ленте */
        .server-pills {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px;
            margin-bottom: 12px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .server-pills::-webkit-scrollbar { display: none; }
        .server-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 700;
            background: var(--card); border: 1px solid var(--border); color: var(--text);
            white-space: nowrap; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;
        }
        .server-pill.active { background: var(--accent); color: #FFF; border-color: var(--accent); }

        /* Карточки объявлений */
        .ads-grid { display: flex; flex-direction: column; gap: 10px; }
        .card {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: var(--shadow); padding: 12px; transition: transform 0.15s; cursor: pointer;
        }
        .card:active { transform: scale(0.985); }
        .ad-card { display: flex; gap: 12px; align-items: flex-start; }
        .ad-card-img { width: 85px; height: 95px; border-radius: 10px; object-fit: cover; background: var(--border); flex-shrink: 0; }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title { font-weight: 800; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ad-card-price { font-weight: 900; font-size: 16px; color: var(--accent); margin-bottom: 6px; }
        .ad-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; background: var(--border); color: var(--text); }
        .badge.sell { background: #34C759; color: #FFF; }
        .badge.buy { background: #FF9500; color: #FFF; }
        .badge.server { background: var(--gold); color: #1A1A1A; }

        /* Кнопки */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 18px; border-radius: var(--radius); border: none; background: var(--accent);
            color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
            transition: transform 0.15s, opacity 0.2s; min-height: var(--btn-min-height);
        }
        .btn:active { transform: scale(0.96); }
        .btn.secondary { background: var(--border); color: var(--text); }
        .btn.danger { background: #FF3B30; color: #FFF; }
        .btn.gold { background: var(--gold); color: #1A1A1A; }
        .btn.success { background: #34C759; color: #FFF; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        .btn.w-full { width: 100%; }

        /* Модальные окна */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65); z-index: 500; display: flex;
            align-items: center; justify-content: center; padding: 16px;
            opacity: 0; transition: opacity 0.2s ease; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: 0 10px 32px rgba(0,0,0,0.3); width: 100%; max-width: 480px;
            max-height: 85vh; overflow-y: auto; padding: 20px; position: relative;
            transform: translateY(16px); transition: transform 0.2s ease;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close {
            position: absolute; top: 12px; right: 12px; background: none; border: none;
            font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px;
        }

        /* Плитки Все разделы */
        .grid-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-tile {
            padding: 18px 12px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--card); text-align: center; cursor: pointer; font-weight: 800;
            font-size: 13px; transition: transform 0.15s, border-color 0.2s; box-shadow: var(--shadow);
        }
        .grid-tile:active { transform: scale(0.95); }
        .grid-tile .tile-icon { font-size: 32px; display: block; margin-bottom: 8px; }

        /* Формы */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 4px; color: var(--muted); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 13px; outline: none;
        }
        .form-group textarea { min-height: 75px; resize: vertical; }

        /* Кликер Игра Барыга */
        .baryga-container { text-align: center; padding: 10px; }
        .baryga-click-btn {
            width: 170px; height: 170px; border-radius: 50%; border: 4px solid var(--accent);
            background: linear-gradient(135deg, #005BFF, #00C6FF); color: #fff;
            font-size: 45px; display: flex; align-items: center; justify-content: center;
            margin: 15px auto; cursor: pointer; box-shadow: 0 8px 24px rgba(0,91,255,0.4);
            transition: transform 0.08s; user-select: none;
        }
        .baryga-click-btn:active { transform: scale(0.9); }
        .upgrade-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border: 1px solid var(--border); border-radius: 10px;
            margin-bottom: 8px; background: var(--card);
        }

        /* Утилиты */
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .toast-container { position: fixed; top: 70px; right: 12px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
        .toast { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); font-size: 12px; font-weight: 700; }
        .toast.success { border-left: 4px solid #34C759; }
        .toast.error { border-left: 4px solid #FF3B30; }

        .auth-container {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 1500; display: flex;
            align-items: center; justify-content: center; padding: 16px;
        }
        .auth-box { width: 100%; max-width: 380px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow); }
        .auth-nav { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
        .auth-tab { flex: 1; padding: 8px; background: none; border: none; font-weight: 800; color: var(--muted); cursor: pointer; font-size: 12px; text-align: center; }
        .auth-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    </style>
</head>
<body>

    <!-- ЗАГРУЗОЧНЫЙ ЭКРАН -->
    <div id="appLoader">
        <div style="font-size: 42px;">⚡</div>
        <div style="font-weight: 800; font-size: 16px;">Загрузка Arizona RP...</div>
    </div>

    <!-- ХЕДЕР -->
    <header class="header">
        <div class="header-logo" id="logoBtn">
            <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" alt="Arizona RP">
        </div>
        <div class="header-title">Arizona RP</div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск товаров..." readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn">🌓</button>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <main class="container">

        <!-- ГЛАВНАЯ (ЛЕНТА С СЕРВЕРАМИ) -->
        <section class="section active" id="section-home">
            <div class="server-pills" id="homeServers"></div>
            <div class="ads-grid" id="homeFeed"></div>
        </section>

        <!-- КОРЗИНА -->
        <section class="section" id="section-cart">
            <h2 style="margin-bottom:12px;font-weight:900;">🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <!-- ОТПРАВКА -->
        <section class="section" id="section-send">
            <h2 style="margin-bottom:12px;font-weight:900;">➕ Подать объявление</h2>
            <div class="card">
                <div class="form-group"><label>Тип сделки</label><select id="sendType"><option value="sell">Продажа</option><option value="buy">Покупка</option></select></div>
                <div class="form-group"><label>Категория</label><select id="sendCategory"></select></div>
                <div class="form-group"><label>Название товара</label><input type="text" id="sendName" placeholder="Например: Аксессуар Шар +12"></div>
                <div class="form-group"><label>Цена (можно с 'к' или 'кк')</label><input type="text" id="sendPrice" placeholder="Пример: 50кк или 50000000"></div>
                <div class="form-group"><label>Описание</label><textarea id="sendDescription" placeholder="Подробное описание товара"></textarea></div>
                <div class="form-group"><label>Скриншоты (ссылки через запятую)</label><input type="text" id="sendImages" placeholder="https://i.postimg.cc/..."></div>
                <div class="form-group"><label>Сервер Arizona RP</label><select id="sendServer"></select></div>
                <button class="btn w-full" id="sendSubmitBtn">Отправить на модерацию</button>
            </div>
            <h3 style="margin:16px 0 8px;font-weight:800;">📦 Мои объявления</h3>
            <div id="myAdsList"></div>
        </section>

        <!-- АДМИН-ПАНЕЛЬ -->
        <section class="section" id="section-admin">
            <h2 style="margin-bottom:12px;font-weight:900;">🛡️ Админ-Панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <!-- ВСЕ РАЗДЕЛЫ -->
        <section class="section" id="section-all">
            <h2 style="margin-bottom:12px;font-weight:900;">☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
            <div id="subViewContainer" style="margin-top:16px;"></div>
        </section>
    </main>

    <!-- НАВИГАЦИЯ -->
    <nav class="nav-bar">
        <button class="nav-item active" data-section="home"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send"><span class="nav-icon">➕</span><span>Подать</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all"><span class="nav-icon">☰</span><span>Разделы</span></button>
    </nav>

    <!-- МОДАЛКИ И АВТОРИЗАЦИЯ -->
    <div id="modalContainer"></div>
    <div id="authContainer"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // =========================================================================
            // 1. КОНСТАНТЫ И ДАННЫЕ
            // =========================================================================
            const OWNER_USERNAME = 'bounqy';
            const ALL_SERVERS = [
                'Phoenix', 'Tucson', 'Scottdale', 'Chandler', 'Brainburg', 'Saint-Rose', 'Mesa', 'Red-Rock', 'Yuma',
                'Surprise', 'Prescott', 'Glendale', 'Kingman', 'Winslow', 'Payson', 'Gilbert', 'Show-Low', 'Casa-Grande',
                'Page', 'Sun-City', 'Queen-Creek', 'Sedona', 'Holiday', 'Wednesday', 'Yava', 'Faraway', 'Bumble-Bee',
                'Christmas', 'Mirage', 'Love', 'Drake', 'Space', 'Home', 'Mobile 1', 'Mobile 2', 'Mobile 3'
            ];
            const ALL_CATEGORIES = [
                { id: 'accessories', label: '💍 Аксессуары' },
                { id: 'transport', label: '🚗 Транспорт' },
                { id: 'realestate', label: '🏠 Недвижимость' },
                { id: 'business', label: '💼 Бизнесы' },
                { id: 'weapons', label: '🔫 Оружие/Детали' },
                { id: 'clothing', label: '👕 Одежда/Скины' },
                { id: 'electronics', label: '📱 Электроника' }
            ];

            const SUPABASE_URL = 'https://sbtitlayqkpllnaiyeld.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_bVZYBWwjdsPMfbbRglAFbw_fP-8ClPO';

            // Глобальное состояние
            let supabaseClient = null;
            let currentAuthUser = null;
            let currentServerFilter = 'ALL';
            let currentTheme = 'light';
            let isAdmin = false;
            let isOwner = false;

            // Игра Барыга
            let barygaState = { money: 0, clickPower: 1, clickCost: 50, autoIncome: 0, autoCost: 200 };

            // =========================================================================
            // 2. ИНИЦИАЛИЗАЦИЯ SUPABASE И УТИЛИТЫ
            // =========================================================================
            function initSupabase() {
                try {
                    if (window.supabase && window.supabase.createClient) {
                        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        return true;
                    }
                } catch(e) { console.error('Supabase Error:', e); }
                return false;
            }

            function showToast(msg, type = 'success') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            async function hashPassword(pass) {
                const msgBuffer = new TextEncoder().encode(pass);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            }

            function formatPrice(val) {
                let num = parseInt(val) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(1) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(1) + 'к';
                return num.toString();
            }

            function parsePrice(str) {
                if (!str) return 0;
                let s = str.toString().toLowerCase().trim();
                let mult = 1;
                if (s.includes('ккк')) mult = 1000000000;
                else if (s.includes('кк')) mult = 1000000;
                else if (s.includes('к')) mult = 1000;
                let clean = parseFloat(s.replace(/[^0-9.]/g, '')) || 0;
                return Math.floor(clean * mult);
            }

            // =========================================================================
            // 3. АВТОРИЗАЦИЯ И СБРОС ПАРОЛЕЙ (Быстрый запуск без задержек)
            // =========================================================================
            async function checkAuth() {
                initSupabase();
                const loader = document.getElementById('appLoader');

                const saved = localStorage.getItem('arizona_user');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const { data } = await supabaseClient.from('app_users').select('*').eq('id', parsed.id).maybeSingle();
                        if (data) {
                            if (data.banned) {
                                loader.innerHTML = '<h2 style="color:#FF3B30;">🚫 Вы забанены</h2>';
                                return;
                            }
                            currentAuthUser = data;
                            finishAuth();
                            return;
                        }
                    } catch(e) {}
                }
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
                showAuthScreen();
            }

            function finishAuth() {
                isAdmin = currentAuthUser.is_admin || currentAuthUser.username.toLowerCase() === OWNER_USERNAME;
                isOwner = currentAuthUser.username.toLowerCase() === OWNER_USERNAME;
                if (isAdmin) document.getElementById('adminNavBtn').classList.remove('hidden');

                const loader = document.getElementById('appLoader');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);

                initServersFilter();
                loadHomeFeed();
            }

            function showAuthScreen() {
                const container = document.getElementById('authContainer');
                let mode = 'login';

                function render() {
                    container.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-box">
                                <h2 style="text-align:center;margin-bottom:6px;font-weight:900;">Arizona RP</h2>
                                <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px;">Маркетплейс серверов</p>
                                <div class="auth-nav">
                                    <button class="auth-tab ${mode==='login'?'active':''}" id="tLogin">Вход</button>
                                    <button class="auth-tab ${mode==='reg'?'active':''}" id="tReg">Создать</button>
                                    <button class="auth-tab ${mode==='reset'?'active':''}" id="tReset">Сброс</button>
                                </div>
                                <div class="form-group">
                                    <label>Логин (Username)</label>
                                    <input type="text" id="aUser" placeholder="Введите логин">
                                </div>
                                ${mode !== 'reset' ? `
                                <div class="form-group">
                                    <label>Пароль</label>
                                    <input type="password" id="aPass" placeholder="Введите пароль">
                                </div>` : `
                                <div class="form-group">
                                    <label>Новый пароль</label>
                                    <input type="password" id="aNewPass" placeholder="Новый пароль">
                                </div>`}
                                <button class="btn w-full mt-12" id="aSubmit">
                                    ${mode==='login'?'Войти':(mode==='reg'?'Зарегистрироваться':'Сбросить пароль')}
                                </button>
                                <p id="aErr" style="color:#FF3B30;font-size:12px;margin-top:10px;text-align:center;"></p>
                            </div>
                        </div>
                    `;

                    document.getElementById('tLogin').onclick = () => { mode = 'login'; render(); };
                    document.getElementById('tReg').onclick = () => { mode = 'reg'; render(); };
                    document.getElementById('tReset').onclick = () => { mode = 'reset'; render(); };

                    document.getElementById('aSubmit').onclick = async () => {
                        const err = document.getElementById('aErr');
                        err.textContent = '';
                        const u = document.getElementById('aUser').value.trim().toLowerCase();
                        if (!u) return err.textContent = 'Введите логин';

                        if (mode === 'reset') {
                            const newP = document.getElementById('aNewPass').value.trim();
                            if (!newP) return err.textContent = 'Введите новый пароль';
                            const hash = await hashPassword(newP);
                            const { error } = await supabaseClient.from('app_users').update({ password_hash: hash }).eq('username', u);
                            if (error) return err.textContent = 'Ошибка сброса. Пользователь не найден.';
                            showToast('Пароль успешно изменён! Войдите.', 'success');
                            mode = 'login'; render();
                            return;
                        }

                        const p = document.getElementById('aPass').value.trim();
                        if (!p) return err.textContent = 'Введите пароль';
                        const hash = await hashPassword(p);

                        if (mode === 'login') {
                            const { data } = await supabaseClient.from('app_users').select('*').eq('username', u).maybeSingle();
                            if (!data || data.password_hash !== hash) return err.textContent = 'Неверный логин или пароль';
                            if (data.banned) return err.textContent = 'Ваш аккаунт забанен';
                            currentAuthUser = data;
                            localStorage.setItem('arizona_user', JSON.stringify(data));
                            container.innerHTML = '';
                            finishAuth();
                        } else {
                            // Регистрация
                            if (u === OWNER_USERNAME) return err.textContent = 'Этот логин зарезервирован владельцем';
                            const { data: exist } = await supabaseClient.from('app_users').select('id').eq('username', u).maybeSingle();
                            if (exist) return err.textContent = 'Логин уже занят';

                            const newUser = { username: u, password_hash: hash, is_admin: false, banned: false };
                            const { data: created, error } = await supabaseClient.from('app_users').insert(newUser).select().single();
                            if (error) return err.textContent = 'Ошибка создания аккаунта';
                            currentAuthUser = created;
                            localStorage.setItem('arizona_user', JSON.stringify(created));
                            container.innerHTML = '';
                            finishAuth();
                        }
                    };
                }
                render();
            }

            // =========================================================================
            // 4. ОКНО КОНТАКТОВ И БОТОВ ПРИ КЛИКЕ НА ЛОГОТИП В ШАПКЕ
            // =========================================================================
            document.getElementById('logoBtn').addEventListener('click', () => {
                showModal(`
                    <div style="text-align:center;">
                        <img src="https://i.postimg.cc/gj4dLNfB/becbb63958da140ca4a1c73b8e0fce12-(2).jpg" style="width:60px;height:60px;border-radius:14px;margin-bottom:10px;">
                        <h3 class="modal-title" style="text-align:center;margin-bottom:14px;">Проект Bounty Squad</h3>
                        <div style="display:flex;flex-direction:column;gap:10px;">
                            <a class="btn gold w-full" href="https://t.me/arizona_coin_bot" target="_blank">🤖 Бот: @arizona_coin_bot</a>
                            <a class="btn w-full" href="https://t.me/Bounty_Squad31" target="_blank">📢 ТГК: @Bounty_Squad31</a>
                            <a class="btn secondary w-full" href="https://vk.com/bountyarz" target="_blank">🌐 ВК Канал: @bountyarz</a>
                            <a class="btn w-full" href="https://t.me/bounqy31" target="_blank">👨‍💼 Менеджер: @bounqy31</a>
                            <a class="btn secondary w-full" href="https://vk.com/bountyarz" target="_blank">👥 ВК Сообщество: @bountyarz</a>
                        </div>
                    </div>
                `);
            });

            // =========================================================================
            // 5. ФИЛЬТРАЦИЯ СЕРВЕРОВ И ЛЕНТА ОБЪЯВЛЕНИЙ
            // =========================================================================
            function initServersFilter() {
                const box = document.getElementById('homeServers');
                box.innerHTML = `<button class="server-pill active" data-server="ALL">Все сервера</button>`;
                ALL_SERVERS.forEach(srv => {
                    box.innerHTML += `<button class="server-pill" data-server="${srv}">${srv}</button>`;
                });

                box.querySelectorAll('.server-pill').forEach(btn => {
                    btn.addEventListener('click', () => {
                        box.querySelectorAll('.server-pill').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentServerFilter = btn.dataset.server;
                        loadHomeFeed();
                    });
                });
            }

            async function loadHomeFeed() {
                const feed = document.getElementById('homeFeed');
                feed.innerHTML = '<div style="text-align:center;padding:20px;">Загрузка объявлений...</div>';

                try {
                    let query = supabaseClient.from('ads').select('*').eq('status', 'approved').order('created_at', { ascending: false });
                    if (currentServerFilter !== 'ALL') {
                        query = query.eq('server', currentServerFilter);
                    }
                    const { data, error } = await query;
                    if (error || !data || data.length === 0) {
                        feed.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);">Объявлений пока нет</div>';
                        return;
                    }
                    feed.innerHTML = '';
                    data.forEach(ad => {
                        const card = document.createElement('div');
                        card.className = 'card ad-card';
                        card.innerHTML = `
                            <img class="ad-card-img" src="${ad.images && ad.images[0] ? ad.images[0] : 'https://i.postimg.cc/zDwTPKwq/0465dd7cc4f5446e5e908000ec4379bb.jpg'}">
                            <div class="ad-card-info">
                                <div class="ad-card-badges">
                                    <span class="badge ${ad.type}">${ad.type==='sell'?'Продажа':'Покупка'}</span>
                                    <span class="badge server">${ad.server}</span>
                                </div>
                                <div class="ad-card-title">${ad.title}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)} $</div>
                                <div style="font-size:11px;color:var(--muted);">Продавец: ${ad.author_name || 'Аноним'}</div>
                            </div>
                        `;
                        card.onclick = () => showAdDetails(ad);
                        feed.appendChild(card);
                    });
                } catch(e) {
                    feed.innerHTML = '<div style="text-align:center;padding:20px;color:#FF3B30;">Ошибка загрузки</div>';
                }
            }

            function showAdDetails(ad) {
                showModal(`
                    <h3>${ad.title}</h3>
                    <div style="font-size:18px;font-weight:900;color:var(--accent);margin:8px 0;">${formatPrice(ad.price)} $</div>
                    <div class="badge server" style="display:inline-block;margin-bottom:10px;">${ad.server}</div>
                    <p style="font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.4;">${ad.description || 'Без описания'}</p>
                    <div class="flex-between">
                        <button class="btn gold w-full" onclick="window.open('https://t.me/${ad.author_name}','_blank')">Связаться с продавцом</button>
                    </div>
                `);
            }

            // =========================================================================
            // 6. ВСЕ РАЗДЕЛЫ И ИГРА «БАРЫГА»
            // =========================================================================
            function loadAllTiles() {
                const tilesBox = document.getElementById('allTiles');
                tilesBox.innerHTML = `
                    <div class="grid-tile" onclick="openBarygaGame()"><span class="tile-icon">🎮</span>Игра «Барыга»</div>
                    <div class="grid-tile" onclick="openOutfits()"><span class="tile-icon">👗</span>Лента луков</div>
                    <div class="grid-tile" onclick="openRadio()"><span class="tile-icon">🎵</span>Arizona FM</div>
                    <div class="grid-tile" onclick="openSettings()"><span class="tile-icon">⚙️</span>Настройки</div>
                    <div class="grid-tile" onclick="openAppeals()"><span class="tile-icon">📩</span>Поддержка</div>
                    <div class="grid-tile" onclick="openNotifications()"><span class="tile-icon">🔔</span>Уведомления</div>
                `;
            }

            window.openBarygaGame = function() {
                const container = document.getElementById('subViewContainer');
                container.innerHTML = `
                    <div class="card baryga-container">
                        <h3>💼 Симулятор Барыги</h3>
                        <div style="font-size:24px;font-weight:900;color:var(--gold);margin:10px 0;" id="barygaBalance">${barygaState.money} $</div>
                        <div class="baryga-click-btn" id="clickBtn">💰</div>
                        <div style="margin-top:14px;">
                            <div class="upgrade-card">
                                <div><b>Сила перепродажи (+1$)</b><br><small>Цена: ${barygaState.clickCost} $</small></div>
                                <button class="btn" id="upClick">Прокачать</button>
                            </div>
                            <div class="upgrade-card">
                                <div><b>Скупщик (Пассив +2$/сек)</b><br><small>Цена: ${barygaState.autoCost} $</small></div>
                                <button class="btn gold" id="upAuto">Купить</button>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('clickBtn').onclick = () => {
                    barygaState.money += barygaState.clickPower;
                    document.getElementById('barygaBalance').textContent = barygaState.money + ' $';
                };
                document.getElementById('upClick').onclick = () => {
                    if (barygaState.money >= barygaState.clickCost) {
                        barygaState.money -= barygaState.clickCost;
                        barygaState.clickPower += 1;
                        barygaState.clickCost = Math.floor(barygaState.clickCost * 1.5);
                        openBarygaGame();
                    } else showToast('Недостаточно денег!', 'error');
                };
                document.getElementById('upAuto').onclick = () => {
                    if (barygaState.money >= barygaState.autoCost) {
                        barygaState.money -= barygaState.autoCost;
                        barygaState.autoIncome += 2;
                        barygaState.autoCost = Math.floor(barygaState.autoCost * 1.6);
                        openBarygaGame();
                    } else showToast('Недостаточно денег!', 'error');
                };
            };

            setInterval(() => {
                if (barygaState.autoIncome > 0) {
                    barygaState.money += barygaState.autoIncome;
                    const el = document.getElementById('barygaBalance');
                    if (el) el.textContent = barygaState.money + ' $';
                }
            }, 1000);

            window.openOutfits = function() {
                document.getElementById('subViewContainer').innerHTML = `
                    <div class="card">
                        <h3>👗 Лента луков и сетов</h3>
                        <p style="font-size:12px;color:var(--muted);margin-top:4px;">Сеты аксессуаров игроков Arizona RP.</p>
                        <div style="margin-top:12px;text-align:center;color:var(--muted);">Раздел пополняется...</div>
                    </div>
                `;
            };

            window.openRadio = function() {
                document.getElementById('subViewContainer').innerHTML = `
                    <div class="card" style="text-align:center;">
                        <h3>🎵 Arizona FM Radio</h3>
                        <audio controls style="width:100%;margin-top:12px;">
                            <source src="https://stream.radiojar.com/8smy15x13zuuv" type="audio/mpeg">
                        </audio>
                    </div>
                `;
            };

            window.openSettings = function() {
                document.getElementById('subViewContainer').innerHTML = `
                    <div class="card">
                        <h3>⚙️ Настройки аккаунта</h3>
                        <p style="margin:8px 0;font-size:13px;">Логин: <b>@${currentAuthUser.username}</b></p>
                        <button class="btn danger w-full mt-12" id="logoutBtn">Выйти из аккаунта</button>
                    </div>
                `;
                document.getElementById('logoutBtn').onclick = () => {
                    localStorage.removeItem('arizona_user');
                    location.reload();
                };
            };

            window.openAppeals = function() {
                document.getElementById('subViewContainer').innerHTML = `
                    <div class="card">
                        <h3>📩 Служба поддержки</h3>
                        <div class="form-group" style="margin-top:10px;">
                            <label>Ваша проблема / Жалоба</label>
                            <textarea id="appText" placeholder="Опишите ситуацию"></textarea>
                        </div>
                        <button class="btn w-full" id="sendAppBtn">Отправить обращение</button>
                    </div>
                `;
                document.getElementById('sendAppBtn').onclick = () => {
                    showToast('Обращение отправлено администраторам!', 'success');
                    document.getElementById('appText').value = '';
                };
            };

            window.openNotifications = function() {
                document.getElementById('subViewContainer').innerHTML = `
                    <div class="card">
                        <h3>🔔 Уведомления</h3>
                        <p style="font-size:12px;color:var(--muted);margin-top:6px;">У вас нет новых уведомлений.</p>
                    </div>
                `;
            };

            // =========================================================================
            // 7. ФОРМА ПОДАЧИ ОБЪЯВЛЕНИЙ И АДМИН-ПАНЕЛЬ
            // =========================================================================
            function populateSendForm() {
                const catSelect = document.getElementById('sendCategory');
                const srvSelect = document.getElementById('sendServer');
                catSelect.innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                srvSelect.innerHTML = ALL_SERVERS.map(s => `<option value="${s}">${s}</option>`).join('');
            }

            document.getElementById('sendSubmitBtn').onclick = async () => {
                const title = document.getElementById('sendName').value.trim();
                const price = parsePrice(document.getElementById('sendPrice').value);
                const description = document.getElementById('sendDescription').value.trim();
                const server = document.getElementById('sendServer').value;
                const type = document.getElementById('sendType').value;
                const img = document.getElementById('sendImages').value.trim();

                if (!title || !price) return showToast('Заполните название и цену!', 'error');

                const newAd = {
                    title, price, description, server, type,
                    author_name: currentAuthUser.username,
                    status: 'pending',
                    images: img ? [img] : []
                };

                const { error } = await supabaseClient.from('ads').insert(newAd);
                if (error) showToast('Ошибка при отправке!', 'error');
                else {
                    showToast('Объявление отправлено на модерацию!', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                }
            };

            async function loadAdminPanel() {
                const box = document.getElementById('adminPanelContent');
                box.innerHTML = '<div style="text-align:center;">Загрузка данных админки...</div>';

                const { data } = await supabaseClient.from('ads').select('*').eq('status', 'pending');
                if (!data || data.length === 0) {
                    box.innerHTML = '<div class="card">На модерации нет объявлений.</div>';
                    return;
                }

                box.innerHTML = '';
                data.forEach(ad => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.innerHTML = `
                        <h4>${ad.title} (${ad.server})</h4>
                        <p style="font-size:12px;color:var(--muted);">${ad.description}</p>
                        <div class="flex-between mt-12">
                            <button class="btn success w-full" onclick="approveAd(${ad.id})">Одобрить</button>
                            <button class="btn danger w-full" onclick="rejectAd(${ad.id})">Отклонить</button>
                        </div>
                    `;
                    box.appendChild(el);
                });
            }

            window.approveAd = async function(id) {
                await supabaseClient.from('ads').update({ status: 'approved' }).eq('id', id);
                showToast('Объявление одобрено!', 'success');
                loadAdminPanel();
            };
            window.rejectAd = async function(id) {
                await supabaseClient.from('ads').update({ status: 'rejected' }).eq('id', id);
                showToast('Объявление отклонено!', 'error');
                loadAdminPanel();
            };

            // =========================================================================
            // 8. МОДАЛКИ И НАВИГАЦИЯ
            // =========================================================================
            function showModal(html) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div class="modal-overlay" id="mOverlay">
                        <div class="modal">
                            <button class="modal-close" onclick="document.getElementById('mOverlay').remove()">✕</button>
                            ${html}
                        </div>
                    </div>
                `;
                setTimeout(() => document.getElementById('mOverlay').classList.add('show'), 10);
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                    btn.classList.add('active');

                    const sec = btn.dataset.section;
                    document.getElementById('section-' + sec).classList.add('active');

                    if (sec === 'send') populateSendForm();
                    if (sec === 'admin') loadAdminPanel();
                    if (sec === 'all') loadAllTiles();
                });
            });

            document.getElementById('themeToggleBtn').onclick = () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', currentTheme);
            };

            // Старт приложения
            checkAuth();
        })();
    </script>
</body>
</html>
