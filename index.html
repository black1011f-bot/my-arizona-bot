    async function loadHomeFeed(reset) {
        if (reset === undefined) reset = true;
        if (isLoadingFeed) return;
        isLoadingFeed = true;
        if (reset) {
            feedPage = 0;
            homeAds = [];
            hasMoreAds = true;
            const cached = loadAdsCache();
            if (cached && !currentFilterServer) {
                homeAds = cached;
                renderHomeFeed();
            } else {
                renderSkeletonFeed();
            }
        }
        try {
            showTopProgress();
            const from = feedPage * FEED_PAGE_SIZE;
            const to = from + FEED_PAGE_SIZE - 1;
            let query = supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false).order('created_at', { ascending: false }).range(from, to);
            if (currentFilterServer) query = query.eq('server', currentFilterServer);
            const res = await withTimeout(query, 8000);
            hideTopProgress();
            if (res.error) throw res.error;
            const newAds = res.data || [];
            const validAds = newAds.filter(function(ad) {
                return !ad.expires_at || new Date(ad.expires_at) > new Date();
            });
            homeAds = reset ? validAds : homeAds.concat(validAds);
            if (newAds.length < FEED_PAGE_SIZE) hasMoreAds = false;
            renderHomeFeed();
            feedPage++;
            if (reset && !currentFilterServer) saveAdsCache(validAds);
        } catch (e) {
            hideTopProgress();
            warn('loadHomeFeed:', e);
            if (reset) {
                const cached = loadAdsCache();
                if (cached) {
                    homeAds = cached;
                    renderHomeFeed();
                    showToast('Показаны сохранённые объявления', 'info');
                } else {
                    document.getElementById('homeFeed').innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки. Проверьте соединение.</div>';
                }
            } else {
                showToast('Не удалось загрузить ещё', 'error');
            }
        } finally {
            isLoadingFeed = false;
        }
    }

    function renderHomeFeed() {
        const cont = document.getElementById('homeFeed');
        if (!homeAds.length) {
            cont.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>';
            return;
        }
        let html = '';
        homeAds.forEach(function(ad, idx) {
            const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
            const img = firstImg || DEFAULT_AD_IMAGE;
            const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' : '<span class="badge buy">Покупка</span>';
            const cat = ALL_CATEGORIES.find(function(c) { return c.id === ad.category; });
            const catLabel = cat ? cat.label : (ad.category || '');
            const isFav = cartIds.has(ad.id);
            const isViewed = viewedIds.has(ad.id);
            const rating = getRatingForAuthor(ad.author_id);
            const isVerified = rating && rating.avg >= VERIFIED_MIN_RATING && rating.count >= 3;
            let timer = '';
            if (ad.expires_at) {
                const diff = new Date(ad.expires_at) - new Date();
                if (diff > 0) {
                    const total = Math.floor(diff / 1000);
                    const h = Math.floor(total / 3600);
                    const m = Math.floor((total % 3600) / 60);
                    const s = total % 60;
                    timer = '<div class="countdown-timer">⏳ ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '</div>';
                }
            }
            const animClass = 'anim-' + (idx % 4);
            const delay = Math.min(idx * 35, 300);
            html += (
                '<div class="card ad-card ' + animClass + ' ' + (isViewed ? 'viewed' : '') + '" data-ad-id="' + ad.id + '" style="animation-delay:' + delay + 'ms;">' +

    function initSendForm() {
        const priceInput = document.getElementById('sendPrice');
        priceInput.removeEventListener('input', formatPriceInputHandler);

        const typeBtn = document.getElementById('sendTypeBtn');
        typeBtn.onclick = function() {

                '</div>'
            );
            document.querySelectorAll('#modalOverlay [data-type]').forEach(function(t) {

                    typeBtn.textContent = t.dataset.type === 'sell' ? 'Продажа' : 'Покупка';
                    ref.closeModal();
                });
            });
        };
        const catBtn = document.getElementById('sendCategoryBtn');
        catBtn.onclick = function() {
            const ref = showModal(
                '<h3 class="modal-title">Категория</h3>' +
                '<div class="grid-tiles">' +
                    ALL_CATEGORIES.map(function(c) {
                        return '<div class="grid-tile ' + (sendFormData.category === c.id ? 'active' : '') + '" data-cat="' + c.id + '">' + c.label + '</div>';
                    }).join('') +
                '</div>'
            );
            document.querySelectorAll('#modalOverlay [data-cat]').forEach(function(t) {
                t.addEventListener('click', function() {
                    sendFormData.category = t.dataset.cat;
                    const cat = ALL_CATEGORIES.find(function(c) { return c.id === t.dataset.cat; });
                    catBtn.textContent = cat ? cat.label : 'Выберите категорию';
                    ref.closeModal();
                });
            });
        };
        const serverBtn = document.getElementById('sendServerBtn');
        serverBtn.onclick = function() {
            const ref = showModal(
                '<h3 class="modal-title">Сервер</h3>' +
                '<div class="grid-tiles">' +
                    ALL_SERVERS.map(function(s) {
                        return '<div class="grid-tile ' + (sendFormData.server === s ? 'active' : '') + '" data-server="' + s + '">' + s + '</div>';
                    }).join('') +
                '</div>'
            );
            document.querySelectorAll('#modalOverlay [data-server]').forEach(function(t) {
                t.addEventListener('click', function() {
                    sendFormData.server = t.dataset.server;
                    serverBtn.textContent = t.dataset.server;
                    ref.closeModal();
                });
            });
        };
        const submitBtn = document.getElementById('sendSubmitBtn');
        submitBtn.onclick = async function() {
            if (!currentUser) { showAlert('Ошибка', 'Вы не авторизованы'); return; }
            const itemName = document.getElementById('sendName').value.trim();
            const priceRaw = document.getElementById('sendPrice').value.trim();
            const description = document.getElementById('sendDescription').value.trim();
            const images = document.getElementById('sendImages').value.trim();
            if (!itemName || !priceRaw || !description) { showAlert('Ошибка', 'Заполните поля'); return; }
            const forbidden = checkForbiddenWords(itemName + ' ' + description);
            if (forbidden) { showAlert('Ошибка', forbidden); return; }
            const linkCheck = checkLinksString(images);
            if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
            for (let i = 0; i < linkCheck.links.length; i++) {
                const safety = await checkLinkSafety(linkCheck.links[i]);
                if (!safety.safe) { showAlert('Ошибка', safety.message); return; }
            }
            const last = localStorage.getItem('arizona_last_submit_time');
            if (last) {
                const diff = Date.now() - parseInt(last);
                if (diff < SUBMIT_COOLDOWN_MS) {
                    showAlert('Подождите', 'Следующая отправка через ' + Math.ceil((SUBMIT_COOLDOWN_MS - diff) / 1000) + ' сек.');
                    return;
                }
            }
            if (!sendFormData.category || !sendFormData.server) { showAlert('Ошибка', 'Выберите категорию и сервер'); return; }
            const userAge = Date.now() - new Date(currentUser.created_at).getTime();
            const isNewUser = userAge < 24 * 60 * 60 * 1000;
            if (isNewUser) {
                try {
                    const cRes = await supabaseClient.from('ads').select('*', { count: 'exact', head: true }).eq('author_id', currentUser.id);
                    if (cRes.count >= NEW_USER_LIMIT) { showAlert('Лимит', 'Не более ' + NEW_USER_LIMIT + ' объявлений за 24ч'); return; }
                } catch (e) {}
            }
            await submitAd(itemName, priceRaw, description, images, sendFormData);
        };
    }

    async function submitAd(itemName, priceRaw, description, images, formData) {
        const newAd = {
            mode: formData.type, category: formData.category, item_name: itemName,
            price: parsePriceToNumber(priceRaw), description: description, images: images,
            server: formData.server, author_id: currentUser.id, author_username: currentUser.username,
            status: 'pending', created_at: new Date().toISOString(), expires_at: null, hidden: false
        };
        try {
            showLoader('Отправка...');
            const res = await withTimeout(supabaseClient.from('ads').insert(newAd), 8000);
            hideLoader();
            if (res.error) throw res.error;
            localStorage.setItem('arizona_last_submit_time', Date.now().toString());
            playSfx('success');
            showToast('Объявление отправлено на модерацию', 'success');
            document.getElementById('sendName').value = '';
            document.getElementById('sendPrice').value = '';
            document.getElementById('sendDescription').value = '';
            document.getElementById('sendImages').value = '';
            sendFormData = { type: 'sell', category: null, server: null };
            document.getElementById('sendTypeBtn').textContent = 'Продажа';
            document.getElementById('sendCategoryBtn').textContent = 'Выберите категорию';
            document.getElementById('sendServerBtn').textContent = 'Выберите сервер';
            if (currentSection === 'all') loadMyAds();
        } catch (e) {
            hideLoader();
            warn('submitAd:', e);
            showAlert('Ошибка', 'Не удалось отправить');
        }
    }

        document.querySelectorAll('[data-approve]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                showLoader('Одобрение...');

                await supabaseClient.from('ads').update({ status: 'approved', expires_at: expiresAt }).eq('id', btn.dataset.approve);
                await logModeratorAction('approve_ad', btn.dataset.approve);
                hideLoader();
                loadAdminPanel();
                loadHomeFeed(true);
            });
        });
        document.querySelectorAll('[data-reject]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset.reject);
                await logModeratorAction('reject_ad', btn.dataset.reject);
                loadAdminPanel();
            });
        });

            btn.addEventListener('click', function() {
                const ad = pendingAds.find(function(a) { return a.id == btn.dataset.editAd; });
                if (ad) openAdminEditModal(ad);
            });
        });
        document.querySelectorAll('[data-approve-appeal]').forEach(function(btn) {
            btn.addEventListener('click', async function() {
                const ap = pendingAppeals.find(function(a) { return a.id == btn.dataset.approveAppeal; });
                if (ap) {
                    const expiresAt = new Date(Date.now() + AD_EXPIRY_HOURS * 60 * 60 * 1000).toISOString();

    async function loadModeratorLogsForUser(username) {
        username = username || '';
        let query = supabaseClient.from('moderator_logs').select('*').order('created_at', { ascending: false }).limit(100);
        if (username) query = query.or('details.ilike.%' + username + '%,moderator_username.ilike.%' + username + '%');
        const res = await withTimeout(query, 5000);
        if (res.error || !res.data) { showAlert('Ошибка', 'Не удалось'); return; }
        const logs = res.data;
        if (!logs.length) { showAlert('Пусто', 'Не найдено'); return; }
        const html = logs.map(function(log) {
            return '<div class="card" style="cursor:default;">' +
                '<div><strong>' + (log.moderator_username || log.moderator_id) + '</strong></div>' +
                '<div style="font-size:.78rem;">' + log.action + '</div>' +
                '<div style="font-size:.72rem;color:var(--muted);">' + log.details + '</div>' +
                '<div style="font-size:.68rem;color:var(--muted);">' + new Date(log.created_at).toLocaleString('ru-RU') + '</div>' +
            '</div>';
        }).join('');
        showModal('<h3 class="modal-title">📜 Журнал</h3>' + html);
    }
    async function loadAdminAuditForUser(username) {
        username = username || '';
        let query = supabaseClient.from('moderator_logs').select('*').order('created_at', { ascending: false }).limit(500);
        if (username) query = query.or('details.ilike.%' + username + '%,moderator_username.ilike.%' + username + '%');
        const res = await withTimeout(query, 5000);
        if (res.error || !res.data) { showAlert('Ошибка', 'Не удалось'); return; }
        const logs = res.data;
        if (!logs.length) { showAlert('Пусто', 'Не найдено'); return; }
        const stats = {};
        logs.forEach(function(log) { stats[log.action] = (stats[log.action] || 0) + 1; });
        let html = '<h4 style="margin-bottom:.4rem;">Статистика</h4>';
        for (const action in stats) html += '<div style="font-size:.82rem;">' + action + ': ' + stats[action] + '</div>';
        html += '<div class="ornament">◈ ◈ ◈</div>';
        html += logs.slice(0, 20).map(function(log) {
            return '<div style="font-size:.72rem;padding:.25rem 0;">' + log.moderator_username + ' — ' + log.action + ' — ' + new Date(log.created_at).toLocaleString('ru-RU') + '</div>';
        }).join('');
        showModal('<h3 class="modal-title">🔍 Аудит</h3>' + html);
    }

    async function adminUserAction(action) {
        const target = document.getElementById('adminUsernameInput').value.trim();
        if (!target) { showAlert('Ошибка', 'Введите username или ID'); return; }
        try {
            let q = supabaseClient.from('app_users').select('*');
            if (!isNaN(target)) q = q.eq('id', target);
            else q = q.eq('username', target);
            const res = await withTimeout(q, 5000);
            if (res.error || !res.data || !res.data.length) { showAlert('Ошибка', 'Не найден'); return; }
            const user = res.data[0];
            if (action === 'ban') await supabaseClient.from('app_users').update({ banned: true }).eq('id', user.id);
            else if (action === 'unban') await supabaseClient.from('app_users').update({ banned: false }).eq('id', user.id);
            else if (action === 'make_admin') await supabaseClient.from('app_users').update({ is_admin: true }).eq('id', user.id);
            else if (action === 'remove_admin') await supabaseClient.from('app_users').update({ is_admin: false }).eq('id', user.id);
            await logModeratorAction(action, user.id);
            playSfx('success');
            showAlert('Успех', 'Готово');
            loadAdminPanel();
        } catch (e) { showAlert('Ошибка', 'Не удалось'); }
    }

    async function checkIfInCart(adId) {
        if (!currentUser) return false;
        try {
            const res = await supabaseClient.from('favorites').select('*').eq('user_id', currentUser.id).eq('ad_id', adId).maybeSingle();
            if (res.data) cartIds.add(adId);
            return !!res.data;
        } catch (e) { return false; }
    }
    async function loadReviews(adId) {
        const cont = document.getElementById('detailReviewsSection');
        if (!cont) return;
        try {
            const res = await withTimeout(supabaseClient.from('reviews').select('*').eq('ad_id', adId).order('created_at', { ascending: false }), 5000);
            if (res.error) throw res.error;
            const revs = res.data || [];
            if (!revs.length) { cont.innerHTML = '<p style="color:var(--muted);font-size:.82rem;margin-top:.8rem;">⭐ Отзывов пока нет</p>'; return; }
            const avg = revs.reduce(function(s, r) { return s + r.stars; }, 0) / revs.length;
            let html = '<div style="margin-top:1rem;">' +
                '<div style="font-size:1rem;font-weight:800;">⭐ ' + avg.toFixed(1) + ' <span style="color:var(--muted);font-size:.78rem;font-weight:500;">(' + revs.length + ')</span></div>' +
                '<div class="progress-bar mb-12"><div class="progress-fill" style="width:' + (avg / 5 * 100) + '%;"></div></div>' +
            '</div>';
            revs.forEach(function(r) {
                const canEdit = r.author_id === currentUser.id && (Date.now() - new Date(r.created_at).getTime()) < 7 * 24 * 60 * 60 * 1000;
                const canDelete = r.author_id === currentUser.id || isOwner;
                const isSeller = r.author_id === currentUser.id;
                html += '<div class="review-item">' +
                    '<div style="font-weight:600;font-size:.85rem;">' + (r.author_username || r.author_id) + ' <span style="color:var(--accent);">' + '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars) + '</span></div>' +
                    '<div style="font-size:.68rem;color:var(--muted);">' + new Date(r.created_at).toLocaleDateString('ru-RU') + '</div>' +
                    '<p style="font-size:.78rem;margin:.25rem 0;white-space:pre-wrap;word-break:break-word;">' + (r.text || '') + '</p>' +
                    (r.media_links ? '<div style="font-size:.68rem;color:var(--accent);word-break:break-all;">' + r.media_links + '</div>' : '');
                if (r.reply_text) {
                    html += '<div style="margin-left:.8rem;padding:.4rem;background:var(--glass-2);border-radius:6px;margin-top:.3rem;border-left:2px solid var(--accent);"><strong style="font-size:.7rem;color:var(--accent);">Ответ:</strong><div style="font-size:.75rem;">' + r.reply_text + '</div></div>';
                } else if (isSeller || isOwner) {
                    html += '<button class="btn secondary mt-8" data-reply-review="' + r.id + '" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">💬 Ответить</button>';
                }
                if (canEdit || canDelete) {
                    html += '<div class="flex-between gap-8 mt-8" style="justify-content:flex-start;">';
                    if (canEdit) html += '<button class="btn secondary" data-edit-review="' + r.id + '" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">✏️</button>';
                    if (canDelete) html += '<button class="btn danger" data-del-review="' + r.id + '" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">🗑</button>';
                    html += '</div>';
                }
                html += '</div>';
            });
            cont.innerHTML = html;
            cont.querySelectorAll('[data-edit-review]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const r = revs.find(function(x) { return x.id == btn.dataset.editReview; });
                    if (r) openEditReviewModal(r);
                });
            });
            cont.querySelectorAll('[data-del-review]').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    await supabaseClient.from('reviews').delete().eq('id', btn.dataset.delReview);
                    loadReviews(adId);
                });
            });
            cont.querySelectorAll('[data-reply-review]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const r = revs.find(function(x) { return x.id == btn.dataset.replyReview; });
                    if (r) openReplyModal(r);
                });
            });
        } catch (e) {}
    }

    function openMusicModal() {
        if (musicAudio) { try { musicAudio.pause(); } catch (e) {} musicAudio = null; }
        const ref = showModal(
            '<h3 class="modal-title">🎵 Музыка</h3>' +
            '<div class="music-player" id="musicPlayerBox">' +
                '<div class="music-track-info">' +
                    '<div class="music-track-icon">🎵</div>' +
                    '<div style="min-width:0;flex:1;">' +
                        '<div class="music-track-name" id="musicTrackName">Трек не выбран</div>' +
                        '<div class="music-track-status" id="musicTrackStatus">Выберите источник</div>' +
                    '</div>' +
                '</div>' +
                '<div class="music-progress"><div class="music-progress-fill" id="musicProgressFill"></div></div>' +
                '<div class="music-controls">' +
                    '<button class="btn primary" id="musicPlayBtn">▶️ Играть</button>' +
                    '<button class="btn secondary" id="musicPauseBtn">⏸ Пауза</button>' +
                    '<button class="btn danger" id="musicStopBtn">⏹ Сброс</button>' +
                '</div>' +
            '</div>' +
            '<div class="form-group mt-12"><label>Ссылка на трек (mp3)</label><input type="text" id="musicUrl" placeholder="https://example.com/song.mp3"></div>' +
            '<label class="file-upload-btn" for="musicFile"><span>📁 Загрузить свой файл</span><input type="file" id="musicFile" accept="audio/*"></label>' +
            '<p style="font-size:.68rem;color:var(--muted);margin-top:.5rem;text-align:center;">Поддерживаются MP3, WAV, OGG и др.</p>'
        );

        const trackName = document.getElementById('musicTrackName');
        const trackStatus = document.getElementById('musicTrackStatus');
        const progressFill = document.getElementById('musicProgressFill');
        let objectUrl = null;

        function setTrack(name, status) {
            trackName.textContent = name;
            trackStatus.textContent = status;
        }

        function stopProgress() {
            if (musicProgressInterval) {
                clearInterval(musicProgressInterval);
                musicProgressInterval = null;
            }
        }

        function startProgress() {
            stopProgress();
            musicProgressInterval = setInterval(function() {
                if (musicAudio && musicAudio.duration) {
                    const pct = (musicAudio.currentTime / musicAudio.duration) * 100;
                    progressFill.style.width = pct + '%';
                }
            }, 300);
        }

        function playAudio(url, name) {
            if (musicAudio) { try { musicAudio.pause(); } catch (e) {} }
            if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
            musicAudio = new Audio(url);
            musicAudio.addEventListener('ended', function() {
                trackStatus.textContent = 'Завершено';
                stopProgress();
                progressFill.style.width = '0%';
            });
            musicAudio.addEventListener('play', function() { trackStatus.textContent = 'Играет'; });
            musicAudio.addEventListener('pause', function() { if (!musicAudio.ended) trackStatus.textContent = 'На паузе'; });
            setTrack(name, 'Загрузка...');
            musicAudio.play().then(function() {
                trackStatus.textContent = 'Играет';
                startProgress();
            }).catch(function() {
                trackStatus.textContent = 'Ошибка воспроизведения';
                showToast('Не удалось воспроизвести', 'error');
            });
        }

        document.getElementById('musicPlayBtn').addEventListener('click', function() {
            const url = document.getElementById('musicUrl').value.trim();
            if (url) {
                playAudio(url, url.split('/').pop() || 'Трек из интернета');
            } else if (musicAudio) {
                musicAudio.play().catch(function() { showToast('Ошибка', 'error'); });
            } else {
                showToast('Введите ссылку или загрузите файл', 'info');
            }
        });
        document.getElementById('musicPauseBtn').addEventListener('click', function() {
            if (musicAudio) musicAudio.pause();
        });
        document.getElementById('musicStopBtn').addEventListener('click', function() {
            if (musicAudio) { try { musicAudio.pause(); } catch (e) {} musicAudio = null; }
            if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
            stopProgress();
            progressFill.style.width = '0%';
            setTrack('Трек не выбран', 'Выберите источник');
            document.getElementById('musicUrl').value = '';
        });
        document.getElementById('musicFile').addEventListener('change', function(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            objectUrl = URL.createObjectURL(file);
            playAudio(objectUrl, file.name);
        });
    }

    /* ============================================================
       ПОИСК
       ============================================================ */
    function openSearchModal() {
        const ref = showModal(
            '<h3 class="modal-title">🔍 Поиск</h3>' +
            '<div class="form-group"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off"></div>' +
            '<div class="flex-between gap-8 mb-12">' +
                '<button class="btn primary w-full" id="searchItemBtn">📦 Предмет</button>' +
                '<button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button>' +
            '</div>' +
            '<div id="searchSuggestions"></div>' +
            '<div id="searchHistory"></div>' +
            '<div id="searchResults"></div>'
        );
        const input = document.getElementById('searchInput');
        setTimeout(function() { input.focus(); }, 150);
        const sugg = document.getElementById('searchSuggestions');
        const res = document.getElementById('searchResults');
        const hist = document.getElementById('searchHistory');

        function renderHist() {
            if (!searchHistory.length) { hist.innerHTML = ''; return; }
            hist.innerHTML = '<div style="font-size:.72rem;color:var(--muted);margin-bottom:.4rem;">📜 История:</div>' +
                searchHistory.map(function(h) {
                    return '<span class="badge" style="cursor:pointer;margin:.12rem;background:var(--accent-soft);color:var(--accent);" data-hist="' + h + '">' + h + '</span>';
                }).join('');
            hist.querySelectorAll('[data-hist]').forEach(function(el) {
                el.addEventListener('click', function() {
                    input.value = el.dataset.hist;
                    input.dispatchEvent(new Event('input'));
                });
            });
        }
        renderHist();

        input.addEventListener('input', async function() {
            const q = input.value.trim().toLowerCase();
            if (!q) { sugg.innerHTML = ''; res.innerHTML = ''; return; }
            const r = await withTimeout(supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false).ilike('item_name', '%' + q + '%').limit(5), 5000);
            if (r.error) return;
            const items = r.data || [];
            sugg.innerHTML = items.map(function(ad) {
                return '<div class="search-suggestion" data-sug="' + ad.id + '">📦 ' + ad.item_name + ' • ' + formatPrice(ad.price) + '</div>';
            }).join('');
            sugg.querySelectorAll('[data-sug]').forEach(function(el) {
                el.addEventListener('click', function() {
                    const ad = items.find(function(a) { return a.id == el.dataset.sug; });
                    if (ad) { saveSearchQuery(q); ref.closeModal(); openAdDetail(ad); }
                });
            });
        });

        document.getElementById('searchItemBtn').addEventListener('click', async function() {
            const q = input.value.trim().toLowerCase();
            if (!q) return;
            saveSearchQuery(q);
            const r = await withTimeout(supabaseClient.from('ads').select('*').eq('status', 'approved').eq('hidden', false).ilike('item_name', '%' + q + '%'), 5000);
            if (r.error) return;
            const items = r.data || [];
            if (!items.length) { res.innerHTML = '<div class="empty-state">Ничего не найдено</div>'; return; }
            res.innerHTML = items.map(function(ad) {
                return '<div class="card" data-res-id="' + ad.id + '" style="padding:.65rem;">' +
                    '<div style="font-weight:700;">' + ad.item_name + '</div>' +
                    '<div style="font-size:.72rem;color:var(--muted);">' + ad.server + ' • ' + formatPrice(ad.price) + '</div>' +
                '</div>';
            }).join('');
            res.querySelectorAll('[data-res-id]').forEach(function(card) {
                card.addEventListener('click', function() {
                    const ad = items.find(function(a) { return a.id == card.dataset.resId; });
                    if (ad) { ref.closeModal(); openAdDetail(ad); }
                });
            });
        });

        document.getElementById('searchProfileBtn').addEventListener('click', function() {
            const q = input.value.trim();
            if (q) { ref.closeModal(); openProfileModal(q); }
        });
    }

    /* ============================================================
       BOOT
       ============================================================ */
    function bootApp() {
        const tgUsername = initTelegram();
        const supabaseOk = initSupabase();

        if (!supabaseOk) {
            setTimeout(function() {
                hideSplash();
                document.body.innerHTML = '<div style="text-align:center;margin-top:50vh;padding:2rem;color:#EF4444;font-family:sans-serif;">Ошибка подключения к базе данных. Обновите страницу.</div>';
            }, SPLASH_DURATION);
            return;
        }

        setTimeout(async function() {
            hideSplash();
            const saved = localStorage.getItem('arizona_current_user');
            if (!saved) {
                showAuthScreen(tgUsername || '');
                return;
            }
            try {
                currentUser = JSON.parse(saved);
                const res = await supabaseClient.from('app_users').select('*').eq('id', currentUser.id).maybeSingle();
                if (res.error || !res.data || res.data.banned) {
                    if (res.data && res.data.banned) { showBanScreen(); return; }
                    localStorage.removeItem('arizona_current_user');
                    currentUser = null;
                    showAuthScreen(tgUsername || '');
                    return;
                }
                currentUser = res.data;
                showApp();
                try { initApp(); } catch (e) { warn('initApp:', e); }
            } catch (e) {
                warn('boot:', e);
                localStorage.removeItem('arizona_current_user');
                currentUser = null;
                showAuthScreen(tgUsername || '');
            }
        }, SPLASH_DURATION);
    }

    // Делегирование кликов (один обработчик вместо множества)
    document.addEventListener('click', function(e) {
        const t = e.target.closest('.btn,.nav-item,.card,.grid-tile,.link-item,.search-suggestion,.theme-toggle,.header-logo,.header-search,.modal-close,.auth-theme-toggle,.star-rating span,.auth-tab,.back-to-top,.fav-heart,.file-upload-btn');
        if (t) {
            playSfx('click');
            hapticFeedback('light');
        }
    }, { passive: true });

    // Блокировать scroll body при открытой модалке
    document.addEventListener('touchmove', function(e) {
        if (document.querySelector('.modal-overlay.show') && !e.target.closest('.modal')) {
            e.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('DOMContentLoaded', bootApp);

})();
</script>
