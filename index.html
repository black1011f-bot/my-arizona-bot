<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Дурак (офлайн)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1a3a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        #app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 900px;
            background: #2a6b2a;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 8px solid #5a3a1a;
        }
        /* Меню */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            gap: 20px;
            padding: 20px;
        }
        #menu h1 {
            color: #ffd700;
            font-size: 3em;
            text-shadow: 0 0 20px #000;
            margin: 0;
        }
        #menu label {
            color: #fff;
            font-size: 1.3em;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 30px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        #menu label:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        #menu label input {
            transform: scale(1.5);
            cursor: pointer;
        }
        #menu button {
            font-size: 1.8em;
            padding: 15px 60px;
            background: #ffd700;
            border: none;
            border-radius: 60px;
            color: #1a3a1a;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #b8860b;
            transition: 0.1s linear;
        }
        #menu button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #b8860b;
        }
        #menu .info {
            color: #ddd;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

        /* Игровое поле */
        #table {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at 20% 30%, #3a8a3a, #1e5a1e);
            border-radius: 20px;
            margin: 10px;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
            min-height: 0;
        }
        /* Зоны */
        .zone {
            position: absolute;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        #bot-zone {
            top: 5px;
            left: 5%;
            right: 5%;
            height: 80px;
            justify-content: center;
        }
        #center-zone {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 40%;
            gap: 10px;
            pointer-events: none;
        }
        #center-zone .card {
            pointer-events: none;
        }
        #player-zone {
            bottom: 5px;
            left: 5%;
            right: 5%;
            height: 110px;
            justify-content: center;
            gap: 2px;
        }
        #deck-zone {
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 60px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        #deck-zone .card {
            width: 50px;
            height: 70px;
            font-size: 1.4em;
            background: #1a3a8a;
            color: #fff;
            border: 2px solid #aaa;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        #trump-info {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 8px #000;
            font-size: 1.2em;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            text-align: center;
        }
        /* Карта */
        .card {
            width: 60px;
            height: 84px;
            background: #fff;
            border-radius: 8px;
            border: 2px solid #333;
            box-shadow: 2px 4px 8px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 1.1em;
            font-weight: bold;
            transition: left 0.3s ease, top 0.3s ease, transform 0.2s, opacity 0.3s;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
        }
        .card .top {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }
        .card .bottom {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            transform: rotate(180deg);
            line-height: 1.1;
        }
        .card .suit {
            font-size: 1.2em;
        }
        .card.red {
            color: #c00;
        }
        .card.black {
            color: #000;
        }
        .card.back {
            background: linear-gradient(135deg, #1a3a8a, #2a5a9a);
            border-color: #0a1a4a;
            color: transparent;
            background-image: repeating-linear-gradient(45deg, #3a6aba 0px, #3a6aba 4px, #4a7aca 4px, #4a7aca 8px);
            cursor: default;
        }
        .card.back .top, .card.back .bottom {
            display: none;
        }
        .card.highlight {
            box-shadow: 0 0 15px 5px #ffd700;
            transform: scale(1.05);
        }
        .card.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        /* Кнопки управления */
        #controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 10px 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            margin: 0 15px 10px;
            flex-wrap: wrap;
        }
        #controls button {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            font-size: 1.1em;
            font-weight: bold;
            background: #ffd700;
            color: #1a3a1a;
            cursor: pointer;
            box-shadow: 0 3px 0 #b8860b;
            transition: 0.1s linear;
            min-width: 80px;
        }
        #controls button:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        #controls button:disabled {
            opacity: 0.4;
            transform: translateY(3px);
            box-shadow: none;
            pointer-events: none;
        }
        #controls button.secondary {
            background: #ddd;
            color: #222;
            box-shadow: 0 3px 0 #999;
        }
        #status {
            color: #fff;
            font-size: 1.2em;
            text-align: center;
            text-shadow: 0 0 10px #000;
            padding: 5px;
            min-height: 2em;
        }
        /* Адаптив */
        @media (max-width: 600px) {
            .card {
                width: 48px;
                height: 67px;
                font-size: 0.9em;
                padding: 3px 4px;
            }
            #bot-zone { height: 65px; }
            #player-zone { height: 85px; }
            #deck-zone .card { width: 40px; height: 56px; font-size: 1.1em; }
            #controls button { padding: 6px 12px; font-size: 0.9em; min-width: 60px; }
            #menu h1 { font-size: 2em; }
        }
        @media (max-width: 420px) {
            .card { width: 40px; height: 56px; font-size: 0.75em; padding: 2px 3px; }
            #bot-zone { height: 55px; }
            #player-zone { height: 70px; }
            #center-zone { width: 80%; height: 30%; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- Меню -->
    <div id="menu">
        <h1>♠ Дурак ♥</h1>
        <label><input type="radio" name="mode" value="podkid" checked> Подкидной</label>
        <label><input type="radio" name="mode" value="perevod"> Переводной</label>
        <button id="startBtn">Начать игру</button>
        <div class="info">Офлайн‑версия. Вы играете против компьютера.</div>
    </div>

    <!-- Игровой стол -->
    <div id="table">
        <div id="bot-zone" class="zone"></div>
        <div id="center-zone" class="zone"></div>
        <div id="deck-zone">
            <div class="card back" id="deckCard"></div>
            <div id="trump-info">♠</div>
        </div>
        <div id="player-zone" class="zone"></div>
    </div>

    <div id="status">Нажмите «Начать игру»</div>
    <div id="controls">
        <button id="btnPass" disabled>Отбой</button>
        <button id="btnTake" disabled>Взять</button>
        <button id="btnAdd" disabled>Подкинуть</button>
        <button id="btnNewGame" class="secondary">Новая игра</button>
    </div>
</div>

<script>
    // ================== КЛАСС КАРТЫ ==================
    class Card {
        constructor(suit, rank) {
            this.suit = suit; // '♠','♥','♦','♣'
            this.rank = rank; // 6,7,8,9,10,11(В),12(Д),13(К),14(Т)
            this.id = suit + rank;
        }
        get name() {
            const names = { 6:'6',7:'7',8:'8',9:'9',10:'10',11:'В',12:'Д',13:'К',14:'Т' };
            return names[this.rank] || this.rank;
        }
        get isRed() {
            return this.suit === '♥' || this.suit === '♦';
        }
        get suitSymbol() {
            return this.suit;
        }
        // Сравнение по старшинству с учётом козыря
        beats(other, trumpSuit) {
            if (this.suit === trumpSuit && other.suit !== trumpSuit) return true;
            if (this.suit !== trumpSuit && other.suit === trumpSuit) return false;
            if (this.suit === other.suit) return this.rank > other.rank;
            return false; // разные масти, не козыри – не бьёт
        }
    }

    // ================== КОЛОДА ==================
    function createDeck() {
        const suits = ['♠','♥','♦','♣'];
        const ranks = [6,7,8,9,10,11,12,13,14];
        const deck = [];
        for (let s of suits) {
            for (let r of ranks) {
                deck.push(new Card(s, r));
            }
        }
        return deck;
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ================== ИГРА ==================
    class Game {
        constructor(mode) {
            this.mode = mode; // 'podkid' или 'perevod'
            this.deck = [];
            this.trumpSuit = null;
            this.trumpCard = null;
            this.playerHand = [];
            this.botHand = [];
            this.tableCards = []; // карты на столе (атакующие и защитные)
            this.attackingCards = []; // только атакующие (для подкидывания)
            this.defendingCards = []; // только защитные
            this.isPlayerTurn = true; // кто ходит (атакует)
            this.isAttacking = true; // фаза атаки или защиты
            this.gameOver = false;
            this.passCount = 0; // для отбоя
            this.waitingForPlayerAction = false;
            // Кол-во карт для раздачи
            this.cardsToDeal = 6;
            // События
            this.onUpdate = null;
        }

        init() {
            this.deck = shuffle(createDeck());
            this.trumpCard = this.deck.pop();
            this.trumpSuit = this.trumpCard.suit;
            this.playerHand = [];
            this.botHand = [];
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.gameOver = false;
            this.passCount = 0;
            this.isPlayerTurn = true; // игрок ходит первым
            this.isAttacking = true;
            // Раздача
            for (let i = 0; i < this.cardsToDeal; i++) {
                if (this.deck.length === 0) break;
                this.playerHand.push(this.deck.pop());
                if (this.deck.length === 0) break;
                this.botHand.push(this.deck.pop());
            }
            // Если карт в колоде меньше, то ничего
            this.sortHand(this.playerHand);
            this.sortHand(this.botHand);
            this.updateUI();
            this.checkGameOver();
            // Если игрок ходит, ждём его хода
            if (this.isPlayerTurn && !this.gameOver) {
                this.waitingForPlayerAction = true;
                this.setStatus('Ваш ход. Выберите карту для атаки.');
                this.enableControls(false, false, false);
            } else if (!this.isPlayerTurn && !this.gameOver) {
                this.botTurn();
            }
        }

        sortHand(hand) {
            const order = { '♠':0, '♥':1, '♦':2, '♣':3 };
            hand.sort((a,b) => {
                if (a.suit === this.trumpSuit && b.suit !== this.trumpSuit) return -1;
                if (a.suit !== this.trumpSuit && b.suit === this.trumpSuit) return 1;
                if (a.suit !== b.suit) return order[a.suit] - order[b.suit];
                return b.rank - a.rank;
            });
        }

        // ===== ХОД ИГРОКА =====
        playerAttack(card) {
            if (!this.waitingForPlayerAction || !this.isAttacking || !this.isPlayerTurn || this.gameOver) return false;
            // Проверяем, есть ли карта в руке
            const idx = this.playerHand.indexOf(card);
            if (idx === -1) return false;
            // Можно ли положить? Если на столе нет карт - можно любую.
            if (this.tableCards.length > 0) {
                // Можно подкинуть только карту того же достоинства, что уже есть на столе (атакующие)
                const ranksOnTable = this.attackingCards.map(c => c.rank);
                if (!ranksOnTable.includes(card.rank)) {
                    this.setStatus('Можно подкинуть только карту того же достоинства, что уже есть на столе.');
                    return false;
                }
            }
            // Убираем из руки
            this.playerHand.splice(idx, 1);
            // Кладём на стол как атакующую
            this.tableCards.push(card);
            this.attackingCards.push(card);
            this.updateUI();
            // Переключаемся на защиту (игрок защищается, если атаковал бот? Нет, сейчас атаковал игрок, значит бот защищается)
            // Но в подкидном: после хода атакующий может подкидывать, защищающийся отбивается.
            // У нас сейчас игрок атаковал, значит бот будет защищаться.
            // Переключаем фазу на защиту, но ход остаётся у игрока? Нет, ход переходит к боту для защиты, но игрок может подкинуть ещё.
            // В классике: атакующий может подкидывать до тех пор, пока защищающийся не отобьётся или не возьмёт.
            // Поэтому после хода игрока мы даём возможность подкинуть (если игрок - атакующий) или защититься (если бот - атакующий)
            // Здесь игрок атакует, значит бот защищается. Мы не переключаем ход, а даём игроку выбор: подкинуть ещё или закончить атаку (нажать "Отбой" - т.е. больше не подкидывать)
            // Или можно сделать: после хода игрока сразу включается режим защиты для бота, но игрок может подкинуть, пока бот не отбился.
            // Проще: после атаки игрока мы ждём, пока он нажмёт "Подкинуть" или "Отбой" (закончить атаку). Если "Отбой", то бот должен отбиваться.
            // Но как бот будет отбиваться? Он автоматически.
            // Сделаем так: после атаки игрока, включаем режим, где игрок может либо подкинуть (если есть карта того же ранга), либо нажать "Отбой" (тогда бот попытается отбиться).
            // Также можно нажать "Взять" - но это для защищающегося, а здесь защищается бот.
            // Поэтому для игрока-атакующего кнопки: "Подкинуть" (если есть возможность) и "Отбой" (закончить атаку).
            // Кнопка "Взять" неактивна.
            this.waitingForPlayerAction = false;
            this.enableControls(false, false, false);
            // Проверяем, есть ли у игрока карты для подкидывания
            const canAdd = this.canPlayerAdd();
            if (canAdd) {
                this.setStatus('Вы можете подкинуть карту того же достоинства или нажать "Отбой".');
                this.enableControls(true, false, true);
                this.waitingForPlayerAction = true;
            } else {
                // Нет карт для подкидывания - сразу отбой
                this.playerPassAttack();
            }
            return true;
        }

        canPlayerAdd() {
            if (this.attackingCards.length === 0) return false;
            const ranks = this.attackingCards.map(c => c.rank);
            return this.playerHand.some(c => ranks.includes(c.rank));
        }

        playerPassAttack() {
            // Завершить атаку (отбой) - теперь бот должен отбиваться
            if (this.gameOver) return;
            this.waitingForPlayerAction = false;
            this.enableControls(false, false, false);
            this.setStatus('Бот отбивается...');
            // Бот защищается
            this.botDefend();
        }

        // Бот защищается
        botDefend() {
            if (this.gameOver) return;
            // Попытка отбиться
            const cardsToBeat = this.attackingCards; // все атакующие карты
            // Бот пытается найти защитные карты для каждой атакующей
            let defense = [];
            let success = true;
            let usedIndices = [];
            for (let atkCard of cardsToBeat) {
                let found = false;
                for (let i = 0; i < this.botHand.length; i++) {
                    if (usedIndices.includes(i)) continue;
                    let card = this.botHand[i];
                    if (card.beats(atkCard, this.trumpSuit)) {
                        defense.push(card);
                        usedIndices.push(i);
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    success = false;
                    break;
                }
            }
            if (success) {
                // Убираем защитные карты из руки бота
                const sortedDef = defense.slice().sort((a,b) => {
                    // Сортировка для красоты
                    return 0;
                });
                for (let card of sortedDef) {
                    const idx = this.botHand.indexOf(card);
                    if (idx !== -1) this.botHand.splice(idx, 1);
                }
                // Добавляем на стол как защитные
                this.tableCards.push(...sortedDef);
                this.defendingCards.push(...sortedDef);
                this.updateUI();
                // Все карты уходят в отбой (сброс)
                this.clearTable();
                this.setStatus('Бот отбился! Ваш ход.');
                this.isPlayerTurn = true;
                this.isAttacking = true;
                // Добираем карты до 6
                this.dealCards();
                this.updateUI();
                this.checkGameOver();
                if (!this.gameOver) {
                    this.waitingForPlayerAction = true;
                    this.enableControls(false, false, false);
                    this.setStatus('Ваш ход. Выберите карту для атаки.');
                }
            } else {
                // Бот не отбился - берёт все карты
                this.botHand.push(...this.tableCards);
                this.tableCards = [];
                this.attackingCards = [];
                this.defendingCards = [];
                this.updateUI();
                this.setStatus('Бот взял карты. Ваш ход.');
                this.isPlayerTurn = true;
                this.isAttacking = true;
                this.dealCards();
                this.updateUI();
                this.checkGameOver();
                if (!this.gameOver) {
                    this.waitingForPlayerAction = true;
                    this.enableControls(false, false, false);
                    this.setStatus('Ваш ход. Выберите карту для атаки.');
                }
            }
        }

        // Игрок защищается (когда бот атакует)
        playerDefend(card) {
            if (!this.waitingForPlayerAction || this.isAttacking || !this.isPlayerTurn || this.gameOver) return false;
            // Игрок защищается от атакующих карт бота
            const attackCards = this.attackingCards;
            // Определяем, какую карту бьём (по порядку)
            // Просто берём первую неотбитую атакующую карту
            const beaten = this.defendingCards.map(c => c.rank);
            let targetIdx = -1;
            for (let i = 0; i < attackCards.length; i++) {
                const atk = attackCards[i];
                // проверяем, есть ли уже защита для этой карты
                const alreadyDef = this.defendingCards.some((d, idx) => {
                    // упрощённо: считаем, что защита ставится в том же порядке
                    return idx < this.defendingCards.length && this.defendingCards[idx] === d;
                });
                // Чтобы не заморачиваться, будем считать, что игрок бьёт первую неотбитую
                if (i >= this.defendingCards.length) {
                    targetIdx = i;
                    break;
                }
            }
            if (targetIdx === -1) {
                this.setStatus('Все карты уже отбиты.');
                return false;
            }
            const atkCard = attackCards[targetIdx];
            if (!card.beats(atkCard, this.trumpSuit)) {
                this.setStatus('Эта карта не бьёт ' + atkCard.name + atkCard.suit);
                return false;
            }
            // Проверяем, есть ли карта в руке
            const idx = this.playerHand.indexOf(card);
            if (idx === -1) return false;
            this.playerHand.splice(idx, 1);
            this.defendingCards.push(card);
            this.tableCards.push(card);
            this.updateUI();
            // Проверяем, все ли отбиты
            if (this.defendingCards.length === this.attackingCards.length) {
                // Отбился! Все карты в отбой
                this.clearTable();
                this.setStatus('Вы отбились! Ваш ход.');
                this.isPlayerTurn = true;
                this.isAttacking = true;
                this.dealCards();
                this.updateUI();
                this.checkGameOver();
                if (!this.gameOver) {
                    this.waitingForPlayerAction = true;
                    this.enableControls(false, false, false);
                    this.setStatus('Ваш ход. Выберите карту для атаки.');
                }
            } else {
                // Ещё остались атакующие карты
                this.setStatus('Отбейте следующую карту или возьмите все.');
                this.waitingForPlayerAction = true;
                this.enableControls(false, true, false);
            }
            return true;
        }

        playerTake() {
            if (!this.waitingForPlayerAction || this.isAttacking || !this.isPlayerTurn || this.gameOver) return;
            // Игрок берёт все карты со стола
            this.playerHand.push(...this.tableCards);
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.updateUI();
            this.setStatus('Вы взяли карты. Теперь ход бота.');
            this.isPlayerTurn = false;
            this.isAttacking = true;
            this.dealCards();
            this.updateUI();
            this.checkGameOver();
            if (!this.gameOver) {
                this.waitingForPlayerAction = false;
                this.enableControls(false, false, false);
                this.botTurn();
            }
        }

        // Бот атакует
        botTurn() {
            if (this.gameOver) return;
            if (this.isPlayerTurn) return;
            if (this.botHand.length === 0) {
                // Бот не может ходить, ход переходит игроку? Но если карт нет - он проиграл.
                this.checkGameOver();
                return;
            }
            this.isAttacking = true;
            // Бот выбирает самую младшую карту для атаки (или козырь?)
            let card = this.botHand[0];
            // Если есть козырь, может выбрать его? Для простоты берём первую.
            this.botHand.splice(0, 1);
            this.tableCards.push(card);
            this.attackingCards.push(card);
            this.updateUI();
            this.setStatus('Бот атакует картой ' + card.name + card.suit);
            // Теперь игрок должен защищаться
            this.isPlayerTurn = true;
            this.isAttacking = false;
            this.waitingForPlayerAction = true;
            this.enableControls(false, true, false);
            this.setStatus('Отбейтесь картой или нажмите "Взять".');
        }

        // Игрок нажимает "Подкинуть" - добавить карту в атаку (если его ход и он атакует)
        playerAdd() {
            if (!this.waitingForPlayerAction || !this.isAttacking || !this.isPlayerTurn || this.gameOver) return;
            if (!this.canPlayerAdd()) {
                this.setStatus('Нет карт для подкидывания.');
                return;
            }
            // Показываем выбор карты для подкидывания (в UI)
            // Мы можем сделать так: при нажатии "Подкинуть" активируем выбор карты среди тех, что подходят.
            // В нашей реализации мы при клике на карту в руке будем определять, атака это или защита.
            // Поэтому просто установим флаг, что игрок может выбрать карту для подкидывания.
            this.setStatus('Выберите карту для подкидывания (того же достоинства).');
            // В обработчике клика по карте будем проверять, если мы в режиме атаки и можно подкинуть, то вызываем playerAttack с этой картой.
            // Но мы уже имеем функцию playerAttack, которая проверяет, можно ли подкинуть. Просто вызовем её.
            // Поэтому ничего не делаем, просто ждём клик.
        }

        clearTable() {
            this.tableCards = [];
            this.attackingCards = [];
            this.defendingCards = [];
            this.updateUI();
        }

        dealCards() {
            // Добираем до 6
            while (this.playerHand.length < 6 && this.deck.length > 0) {
                this.playerHand.push(this.deck.pop());
            }
            while (this.botHand.length < 6 && this.deck.length > 0) {
                this.botHand.push(this.deck.pop());
            }
            this.sortHand(this.playerHand);
            this.sortHand(this.botHand);
        }

        checkGameOver() {
            if (this.deck.length === 0 && (this.playerHand.length === 0 || this.botHand.length === 0)) {
                this.gameOver = true;
                this.waitingForPlayerAction = false;
                this.enableControls(false, false, false);
                if (this.playerHand.length === 0) {
                    this.setStatus('🎉 Вы выиграли!');
                } else if (this.botHand.length === 0) {
                    this.setStatus('😞 Бот выиграл.');
                } else {
                    this.setStatus('Ничья?');
                }
                return true;
            }
            return false;
        }

        setStatus(msg) {
            const el = document.getElementById('status');
            if (el) el.textContent = msg;
        }

        enableControls(pass, take, add) {
            document.getElementById('btnPass').disabled = !pass;
            document.getElementById('btnTake').disabled = !take;
            document.getElementById('btnAdd').disabled = !add;
        }

        updateUI() {
            // Рендерим руки и стол
            this.renderPlayerHand();
            this.renderBotHand();
            this.renderTable();
            this.renderDeck();
        }

        renderPlayerHand() {
            const zone = document.getElementById('player-zone');
            zone.innerHTML = '';
            this.playerHand.forEach((card, idx) => {
                const el = this.createCardElement(card, false);
                el.dataset.index = idx;
                el.addEventListener('click', () => {
                    this.onCardClick(card);
                });
                zone.appendChild(el);
            });
        }

        renderBotHand() {
            const zone = document.getElementById('bot-zone');
            zone.innerHTML = '';
            this.botHand.forEach((card, idx) => {
                const el = this.createCardElement(card, true);
                el.dataset.index = idx;
                zone.appendChild(el);
            });
            // Показываем количество карт
            const count = document.createElement('div');
            count.style.cssText = 'color:#fff; font-weight:bold; background:rgba(0,0,0,0.5); padding:2px 10px; border-radius:20px; font-size:0.9em;';
            count.textContent = this.botHand.length + ' карт';
            zone.appendChild(count);
        }

        renderTable() {
            const zone = document.getElementById('center-zone');
            zone.innerHTML = '';
            // Показываем атакующие и защитные карты
            const all = [...this.attackingCards, ...this.defendingCards];
            all.forEach((card, idx) => {
                const el = this.createCardElement(card, false);
                el.style.cursor = 'default';
                el.style.pointerEvents = 'none';
                // Немного смещения для красоты
                if (idx < this.attackingCards.length) {
                    el.style.transform = `translateY(-10px)`;
                } else {
                    el.style.transform = `translateY(10px)`;
                }
                zone.appendChild(el);
            });
            // Показываем козырь на столе
            if (this.trumpCard) {
                const trumpEl = this.createCardElement(this.trumpCard, false);
                trumpEl.style.position = 'absolute';
                trumpEl.style.right = '5px';
                trumpEl.style.bottom = '5px';
                trumpEl.style.width = '40px';
                trumpEl.style.height = '56px';
                trumpEl.style.fontSize = '0.8em';
                trumpEl.style.cursor = 'default';
                trumpEl.style.pointerEvents = 'none';
                trumpEl.style.border = '3px solid gold';
                zone.appendChild(trumpEl);
            }
        }

        renderDeck() {
            const deckCard = document.getElementById('deckCard');
            if (this.deck.length > 0) {
                deckCard.style.display = 'flex';
                deckCard.textContent = this.deck.length;
            } else {
                deckCard.style.display = 'none';
            }
            const trumpInfo = document.getElementById('trump-info');
            trumpInfo.textContent = 'Козырь: ' + this.trumpSuit;
        }

        createCardElement(card, hidden) {
            const div = document.createElement('div');
            div.className = 'card';
            if (hidden) {
                div.classList.add('back');
                return div;
            }
            const color = card.isRed ? 'red' : 'black';
            div.classList.add(color);
            // Верх
            const top = document.createElement('div');
            top.className = 'top';
            top.innerHTML = `<span>${card.name}</span><span class="suit">${card.suitSymbol}</span>`;
            // Низ
            const bottom = document.createElement('div');
            bottom.className = 'bottom';
            bottom.innerHTML = `<span>${card.name}</span><span class="suit">${card.suitSymbol}</span>`;
            div.appendChild(top);
            div.appendChild(bottom);
            // Если козырь - подсветка
            if (card.suit === this.trumpSuit) {
                div.style.boxShadow = '0 0 10px 2px gold';
            }
            return div;
        }

        onCardClick(card) {
            if (this.gameOver) return;
            if (!this.waitingForPlayerAction) {
                this.setStatus('Сейчас не ваш ход.');
                return;
            }
            // Определяем, что делаем: атака или защита
            if (this.isAttacking && this.isPlayerTurn) {
                // Попытка атаковать или подкинуть
                this.playerAttack(card);
            } else if (!this.isAttacking && this.isPlayerTurn) {
                // Защита
                this.playerDefend(card);
            } else {
                this.setStatus('Нельзя сыграть этой картой сейчас.');
            }
        }

        // Действия кнопок
        onPass() {
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerPassAttack();
            } else {
                this.setStatus('Сейчас нельзя отбиться.');
            }
        }

        onTake() {
            if (!this.isAttacking && this.isPlayerTurn) {
                this.playerTake();
            } else {
                this.setStatus('Сейчас нельзя взять карты.');
            }
        }

        onAdd() {
            if (this.isAttacking && this.isPlayerTurn) {
                this.playerAdd();
            } else {
                this.setStatus('Сейчас нельзя подкинуть.');
            }
        }
    }

    // ================== ЗАПУСК ==================
    let game = null;

    function startGame(mode) {
        game = new Game(mode);
        game.init();
        // Обновляем интерфейс
        document.getElementById('menu').style.display = 'none';
        // Привязка кнопок
        document.getElementById('btnPass').onclick = () => { if (game) game.onPass(); };
        document.getElementById('btnTake').onclick = () => { if (game) game.onTake(); };
        document.getElementById('btnAdd').onclick = () => { if (game) game.onAdd(); };
        document.getElementById('btnNewGame').onclick = () => {
            document.getElementById('menu').style.display = 'flex';
            game = null;
        };
    }

    document.getElementById('startBtn').addEventListener('click', () => {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        startGame(mode);
    });

    // Предзагрузка (показываем меню)
    document.getElementById('menu').style.display = 'flex';
</script>
</body>
</html>
