<!DOCTYPE html>
<html lang="ru" data-font-size="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arizona Online × Bounty Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0F0A1E;--bg-2:#150F28;--card:#1A1230;--card-2:#221844;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
  --text:#F5F1FA;--text-soft:#D4CCE8;--muted:#8A7FA8;--muted-2:#5A517A;
  --accent:#8B5CF6;--accent-2:#22D3EE;--accent-3:#EC4899;
  --accent-soft:rgba(139,92,246,.18);--accent-glow:rgba(139,92,246,.35);
  --success:#22C55E;--success-soft:rgba(34,197,94,.15);
  --danger:#EF4444;--danger-soft:rgba(239,68,68,.18);
  --warning:#F59E0B;--warning-soft:rgba(245,158,11,.15);
  --info:#3B82F6;--info-soft:rgba(59,130,246,.15);
  --cyan-soft:rgba(34,211,238,.15);--pink-soft:rgba(236,72,153,.15);
  --grad-aurora:linear-gradient(135deg,#8B5CF6,#22D3EE);
  --grad-sunset:linear-gradient(135deg,#F97316,#EC4899 50%,#8B5CF6);
  --grad-mix:linear-gradient(135deg,#8B5CF6,#EC4899 50%,#F97316);
  --grad-flow:linear-gradient(90deg,#8B5CF6,#22D3EE,#EC4899,#F97316,#8B5CF6);
  --glass:rgba(26,18,48,.85);--glass-2:rgba(255,255,255,.04);
  --radius:16px;--radius-sm:10px;--radius-xs:6px;--radius-pill:999px;
  --header-height:60px;--nav-height:64px;
  --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Space Grotesk',monospace;
  --fs-base:15px;--fs-sm:.72rem;--fs-lg:1.05rem;
}
[data-theme="light"]{
  --bg:#FFF8F5;--bg-2:#FDF2F8;--card:#FFFFFF;--card-2:#FEF8FE;
  --border:rgba(15,10,30,.08);--border-strong:rgba(15,10,30,.16);
  --text:#1A0F2E;--text-soft:#3D2E5C;--muted:#7A6B94;--muted-2:#B0A2C9;
  --accent:#7C3AED;--accent-2:#0891B2;--accent-3:#DB2777;
  --accent-soft:rgba(124,58,237,.10);--accent-glow:rgba(124,58,237,.25);
  --success:#16A34A;--success-soft:rgba(22,163,74,.12);
  --danger:#DC2626;--danger-soft:rgba(220,38,38,.12);
  --warning:#D97706;--warning-soft:rgba(217,119,6,.12);
  --info:#2563EB;--info-soft:rgba(37,99,235,.12);
  --cyan-soft:rgba(8,145,178,.10);--pink-soft:rgba(219,39,119,.10);
  --glass:rgba(255,255,255,.9);--glass-2:rgba(15,10,30,.03);
}
html[data-font-size="small"]{--fs-base:13px;--fs-sm:.66rem;--fs-lg:.95rem}
html[data-font-size="medium"]{--fs-base:15px;--fs-sm:.72rem;--fs-lg:1.05rem}
html[data-font-size="large"]{--fs-base:17px;--fs-sm:.82rem;--fs-lg:1.18rem}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:var(--font-body)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;overflow-x:hidden;touch-action:manipulation;font-size:var(--fs-base);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}
::selection{background:var(--accent-soft);color:var(--accent)}
@keyframes brand-shift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.brand-animated{background:var(--grad-flow);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand-shift 5s linear infinite}
.brand-team-animated{background:var(--grad-flow);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand-shift 6s linear infinite reverse}
/* SPLASH */
#splash-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;transition:opacity .4s,visibility .4s}
#splash-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-icon{width:88px;height:88px;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px var(--accent-glow),0 0 0 2px var(--border-strong);animation:splash-zoom 1.2s ease-out}
.splash-icon img{width:100%;height:100%;object-fit:cover}
.splash-title{font-weight:800;font-size:1.8rem;letter-spacing:-.02em;margin-top:.4rem}
.splash-subtitle{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
@keyframes splash-zoom{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
/* LOADER */
.loader-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.loader-overlay.show{opacity:1;visibility:visible}
.loader-spinner-big{width:54px;height:54px;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent-2);border-radius:50%;animation:spin .9s linear infinite}
.loader-overlay-text{color:#fff;font-size:.88rem;font-weight:600;letter-spacing:.05em}
@keyframes spin{to{transform:rotate(360deg)}}
.loader{border:2px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent-2);border-radius:50%;width:30px;height:30px;animation:spin .9s linear infinite;margin:20px auto}
/* TOP PROGRESS */
.top-progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--grad-aurora);z-index:9997;transform:scaleX(0);transform-origin:left;transition:transform .25s,opacity .25s;opacity:0}
.top-progress.active{transform:scaleX(1);opacity:1}
/* OFFLINE */
.offline-banner{position:fixed;top:0;left:0;right:0;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--danger);color:#fff;font-size:.75rem;font-weight:600;text-align:center;z-index:9998;transform:translateY(-100%);transition:transform .25s}
.offline-banner.visible{transform:translateY(0)}
/* GUEST BANNER */
.guest-banner{position:fixed;top:calc(var(--header-height) + env(safe-area-inset-top));left:0;right:0;padding:8px 12px;background:var(--grad-sunset);color:#fff;font-size:.75rem;font-weight:600;text-align:center;z-index:99;display:none}
.guest-banner.visible{display:block}
.guest-banner button{background:rgba(255,255,255,.25);border:none;color:#fff;padding:.25rem .6rem;border-radius:6px;font-weight:700;font-size:.7rem;margin-left:.5rem;cursor:pointer}
/* BACK TO TOP */
.back-to-top{position:fixed;bottom:calc(var(--nav-height) + 14px + env(safe-area-inset-bottom));right:14px;width:42px;height:42px;border-radius:12px;background:var(--grad-aurora);color:#fff;border:none;box-shadow:0 4px 16px var(--accent-glow);cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;visibility:hidden;transform:translateY(15px);transition:opacity .25s,visibility .25s,transform .25s}
.back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}
/* CONTAINER */
.container{max-width:100%;margin:0 auto;padding:.85rem;padding-top:calc(var(--header-height) + .85rem);padding-bottom:calc(var(--nav-height) + 1.5rem + env(safe-area-inset-bottom))}
@media(min-width:640px){.container{max-width:640px;padding:1rem;padding-top:calc(var(--header-height) + 1rem)}}
@media(min-width:900px){.container{max-width:900px}.ads-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.ads-grid .card{margin-bottom:0}}
@media(min-width:1200px){.container{max-width:1200px}.ads-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1500px){.container{max-width:1440px}.ads-grid{grid-template-columns:repeat(4,1fr)}}
/* HEADER */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:.5rem .85rem;padding-top:calc(.5rem + env(safe-area-inset-top));height:calc(var(--header-height) + env(safe-area-inset-top));gap:.6rem}
.header-logo{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;cursor:pointer;border:1.5px solid var(--accent);transition:transform .2s}
.header-logo:active{transform:scale(.92)}
.header-logo img{width:100%;height:100%;object-fit:cover}
.header-brand{display:flex;align-items:center;gap:.5rem;flex-shrink:0;cursor:pointer;min-width:0}
.header-brand-text{display:flex;flex-direction:column;line-height:1}
.header-title{font-weight:800;font-size:.95rem;letter-spacing:-.02em;line-height:1.15}
.header-team{margin-top:3px;font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;line-height:1;white-space:nowrap}
@media(max-width:400px){.header-logo{width:34px;height:34px}.header-title{font-size:.85rem}.header-team{font-size:.55rem}}
.header-search{flex:1;cursor:pointer;min-width:0;position:relative}
.header-search input{width:100%;padding:.55rem .9rem;padding-right:2.2rem;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.82rem;outline:none;pointer-events:none}
.header-search .voice-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--muted);font-size:1rem;cursor:pointer;pointer-events:auto;padding:4px}
.theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:.95rem;cursor:pointer;flex-shrink:0;color:var(--text)}
/* NAV */
.nav-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;height:var(--nav-height);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--muted);font-size:.62rem;font-weight:600;cursor:pointer;padding:.25rem .3rem;border-radius:10px;flex:1;max-width:78px;min-height:46px;transition:color .15s,background .15s;position:relative}
.nav-item .nav-icon{font-size:1.15rem;transition:transform .15s}
.nav-item.active{color:var(--accent);background:var(--accent-soft)}
.nav-item.active .nav-icon{transform:scale(1.08)}
.nav-item.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:2px;border-radius:0 0 2px 2px;background:var(--accent)}
/* SECTIONS */
.section{display:none}
.section.active{display:block}
.section h2{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.9rem}
.section h3{font-size:1rem;font-weight:700;margin:1.2rem 0 .6rem}
/* CARDS */
@keyframes cardSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardSlideLeft{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes cardScaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes cardBlurIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:.9rem;margin-bottom:.75rem;cursor:pointer;transition:transform .12s,border-color .15s;position:relative}
.card:hover{border-color:var(--border-strong)}
.card:active{transform:scale(.99)}
.card.inactive-card{opacity:.55}
.card.viewed{opacity:.75}
.card.viewed .ad-card-title{color:var(--muted)}
.card.anim-0{animation:cardSlideUp .4s ease backwards}
.card.anim-1{animation:cardSlideLeft .4s ease backwards}
.card.anim-2{animation:cardScaleIn .4s ease backwards}
.card.anim-3{animation:cardBlurIn .4s ease backwards}
/* AD-CARD */
.ad-card{display:flex;gap:.75rem;align-items:flex-start;position:relative}
.ad-card-info{flex:1;min-width:0}
.ad-card-title{font-weight:700;font-size:.95rem;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.ad-card-price{font-family:var(--font-mono);font-weight:700;font-size:1.15rem;background:var(--grad-mix);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em;line-height:1.15}
.ad-card-badges{display:flex;gap:.25rem;flex-wrap:wrap;margin:.35rem 0 .25rem}
.ad-card-author{font-size:.7rem;color:var(--muted);margin-top:.2rem;font-weight:500;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.ad-card-rating{display:inline-flex;align-items:center;gap:.1rem;font-size:.66rem;color:var(--warning);font-weight:700}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;background:var(--grad-aurora);border-radius:50%;color:#fff;font-size:.5rem;font-weight:900}
.fav-heart{position:absolute;top:0;right:0;width:28px;height:28px;border-radius:8px;background:var(--glass-2);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;transition:all .15s;z-index:2}
.fav-heart.active{background:var(--pink-soft);color:var(--accent-3);border-color:var(--accent-3)}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:.18rem .55rem;border-radius:6px;font-size:.62rem;font-weight:700;background:var(--glass-2);color:var(--text-soft);white-space:nowrap;letter-spacing:.03em;line-height:1.3;text-transform:uppercase;border:1px solid var(--border)}
.badge.sell{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.buy{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.server{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.category{background:var(--cyan-soft);color:var(--accent-2);border-color:transparent}
.badge.status-pending{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.badge.status-deleted{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.status-approved{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.video{background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(236,72,153,.15));color:#F87171;border-color:transparent}
/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:.82rem;cursor:pointer;min-height:46px;transition:transform .12s,background .15s,border-color .15s;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--grad-aurora);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--glass-2);color:var(--text);border-color:var(--border)}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.gold{background:var(--grad-sunset);color:#fff;border-color:transparent}
.btn.success{background:transparent;color:var(--success);border-color:var(--success)}
.btn.success:hover{background:var(--success);color:#fff}
.btn.w-full{width:100%}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .18s;overscroll-behavior:contain}
.modal-overlay.show{opacity:1}
.modal{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:1.4rem;position:relative;transform:translateY(12px);transition:transform .2s;-webkit-overflow-scrolling:touch}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-close{position:absolute;top:.7rem;right:.7rem;background:var(--glass-2);border:1px solid var(--border);width:30px;height:30px;border-radius:8px;font-size:.9rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:2}
.modal-close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-title{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-bottom:.9rem;padding-right:2.2rem}
/* FORMS */
.form-group{margin-bottom:.85rem}
.form-group label{display:block;font-weight:600;font-size:.7rem;margin-bottom:.35rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.7rem .9rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:.88rem;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group input::placeholder,.form-group textarea::placeholder{color:var(--muted-2)}
.form-group textarea{min-height:90px;resize:vertical;font-family:inherit}
.input-with-voice{position:relative}
.input-with-voice input,.input-with-voice textarea{padding-right:2.4rem}
.input-with-voice .voice-input-btn{position:absolute;right:6px;top:8px;background:var(--accent-soft);border:1px solid var(--border);color:var(--accent);width:28px;height:28px;border-radius:8px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.input-with-voice .voice-input-btn.listening{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse-rec 1s infinite}
@keyframes pulse-rec{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* AUTH */
.auth-container{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--bg);overflow-y:auto}
.auth-background{position:absolute;inset:0;background-position:center;background-size:cover;z-index:-1;filter:brightness(.35) saturate(.7)}
.auth-background::after{content:'';position:absolute;inset:0;background:radial-gradient(800px 500px at 50% 30%,var(--accent-soft),transparent 70%),linear-gradient(135deg,rgba(15,10,30,.85),rgba(15,10,30,.95))}
[data-theme="light"] .auth-background::after{background:radial-gradient(800px 500px at 50% 30%,var(--accent-soft),transparent 70%),linear-gradient(135deg,rgba(255,248,245,.85),rgba(253,242,248,.95))}
.auth-box{width:100%;max-width:400px;background:var(--card);border-radius:20px;border:1px solid var(--border);padding:1.8rem 1.6rem;position:relative;z-index:1;margin:auto}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.4rem}
.auth-logo{width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid transparent;background-image:linear-gradient(var(--card),var(--card)),var(--grad-aurora);background-origin:border-box;background-clip:padding-box,border-box;padding:2px;flex-shrink:0}
.auth-brand-text{display:flex;flex-direction:column;line-height:1}
.auth-title{font-weight:800;font-size:1.3rem;letter-spacing:-.03em;line-height:1.1}
.auth-team{font-family:var(--font-mono);font-weight:700;font-size:.72rem;letter-spacing:.14em;margin-top:4px}
.auth-tabs{display:flex;margin-bottom:1.2rem;background:var(--glass-2);border-radius:10px;padding:3px}
.auth-tab{flex:1;padding:.6rem .4rem;background:none;border:none;cursor:pointer;font-weight:700;font-size:.8rem;transition:color .15s,background .15s;color:var(--muted);letter-spacing:.03em;border-radius:8px}
.auth-tab.active{color:#fff;background:var(--grad-aurora)}
.auth-theme-toggle{position:absolute;top:.8rem;right:.8rem;background:var(--glass-2);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;color:var(--text)}
.auth-guest-btn{margin-top:.8rem;width:100%;background:transparent;border:1px dashed var(--border-strong);color:var(--muted);padding:.6rem;border-radius:var(--radius-sm);font-weight:600;font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem}
.auth-guest-btn:hover{border-color:var(--accent);color:var(--accent)}
.auth-error{color:var(--danger);font-size:.75rem;margin-top:.5rem;text-align:center;min-height:.9rem}
.auth-hint{color:var(--muted);font-size:.7rem;margin-top:.4rem;text-align:center}
/* TOAST */
.toast-container{position:fixed;top:calc(72px + env(safe-area-inset-top));right:.85rem;z-index:999;display:flex;flex-direction:column;gap:.4rem;max-width:320px;pointer-events:none}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem 1rem;font-size:.78rem;font-weight:500;animation:toastIn .25s;transition:opacity .25s,transform .25s;pointer-events:auto}
.toast.success{border-left:3px solid var(--success)}

function formatPrice(v){

  let n=typeof v==='string'?v.toLowerCase():v.toString();
  if(n.indexOf('к')!==-1){let b=parseFloat(n.split('к')[0])||0;let kc=(n.match(/к/g)||[]).length;if(kc===1)b*=1000;else if(kc===2)b*=1000000;else if(kc===3)b*=1000000000;return Math.floor(b).toString()}
  n=parseInt(n)||0;
  if(n>=1000000000)return(n/1000000000).toFixed(n%1000000000===0?0:2)+'ккк';
  if(n>=1000000)return(n/1000000).toFixed(n%1000000===0?0:1)+'кк';
  if(n>=1000)return(n/1000).toFixed(n%1000===0?0:1)+'к';

function getVideoEmbedUrl(url){
  if(!url)return null;
  try{
    const u=new URL(url);const h=u.hostname.replace('www.','');
    if(h==='youtube.com'){
      const v=u.searchParams.get('v');
      if(v)return 'https://www.youtube.com/embed/'+v;
      if(u.pathname.startsWith('/shorts/')){const id=u.pathname.split('/')[2];if(id)return 'https://www.youtube.com/embed/'+id}
      if(u.pathname.startsWith('/embed/'))return url;
    }
    if(h==='youtu.be'){const id=u.pathname.slice(1);if(id)return 'https://www.youtube.com/embed/'+id}
    if(h==='vk.com'||h==='vkvideo.ru'){
      const m=u.pathname.match(/video(-?\d+)_(\d+)/);
      if(m)return 'https://vk.com/video_ext.php?oid='+m[1]+'&id='+m[2]+'&hd=2';
      const m2=u.pathname.match(/clip(-?\d+)_(\d+)/);
      if(m2)return 'https://vk.com/clip_ext.php?oid='+m2[1]+'&id='+m2[2];
    }
    return null;
  }catch(e){return null}
}

/* ============ CONFETTI ============ */
function launchConfetti(duration){
  duration=duration||2800;
  const cv=$('confetti-canvas');
  if(!cv||confettiActive)return;
  confettiActive=true;
  const ctx=cv.getContext('2d');
  let w=cv.width=window.innerWidth,h=cv.height=window.innerHeight;
  const colors=['#8B5CF6','#22D3EE','#EC4899','#F97316','#FACC15','#22C55E'];
  const parts=[];
  for(let i=0;i<120;i++){
    parts.push({
      x:Math.random()*w,y:-20-Math.random()*h*.4,
      vx:(Math.random()-.5)*6,vy:2+Math.random()*4,
      r:4+Math.random()*6,color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,shape:Math.random()<.5?'rect':'circle'
    });
  }
  let start=Date.now();
  function draw(){
    const el=Date.now()-start;
    if(el>duration){ctx.clearRect(0,0,w,h);confettiActive=false;return}
    ctx.clearRect(0,0,w,h);
    parts.forEach(p=>{
      p.vy+=.1;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;
      if(p.shape==='rect')ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4);
      else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill()}
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize',()=>{w=cv.width=window.innerWidth;h=cv.height=window.innerHeight},{once:true});
}

/* ============ УМНЫЙ ПОИСК ============ */
function levenshtein(a,b){
  if(a===b)return 0;
  if(!a.length)return b.length;if(!b.length)return a.length;
  const m=[];
  for(let i=0;i<=b.length;i++)m[i]=[i];
  for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++){
    if(b.charAt(i-1)===a.charAt(j-1))m[i][j]=m[i-1][j-1];
    else m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
  }
  return m[b.length][a.length];
}
function smartMatch(query,text){
  if(!query||!text)return false;
  const q=query.toLowerCase().trim();const tx=text.toLowerCase();
  if(tx.indexOf(q)!==-1)return true;
  if(q.length<3)return false;
  const words=tx.split(/\s+/);
  const qWords=q.split(/\s+/).filter(w=>w.length>2);
  return qWords.some(qw=>words.some(tw=>levenshtein(qw,tw)<=2||tw.indexOf(qw)!==-1));
}
function findSuggestions(q){
  if(!q||q.length<3)return null;
  const known=[];
  ALL_CATEGORIES.forEach(c=>{c.label.split(' ').forEach(w=>{if(w.length>3)known.push(w.toLowerCase())})});
  ALL_SERVERS.forEach(s=>known.push(s.toLowerCase()));
  const ql=q.toLowerCase();
  const words=ql.split(/\s+/);
  let fixed=null;
  for(const w of words){
    if(w.length<3)continue;
    let best=null,bestDist=3;
    for(const k of known){
      const d=levenshtein(w,k);
      if(d<bestDist){bestDist=d;best=k}
    }
    if(best&&best!==w&&bestDist<=2){fixed=best;break}
  }
  return fixed;
}

const DEFAULT_SHORTCUTS={search:'k',new:'n',home:'h',cart:'c',settings:',',help:'/'};
function loadShortcuts(){try{const r=localStorage.getItem('az_shortcuts');shortcutMap=r?JSON.parse(r):{...DEFAULT_SHORTCUTS}}catch(e){shortcutMap={...DEFAULT_SHORTCUTS}}}
function saveShortcuts(){try{localStorage.setItem('az_shortcuts',JSON.stringify(shortcutMap))}catch(e){}}
function setupShortcuts(){
  loadShortcuts();
  const isPc=isDesktop;
  if(isPc&&!localStorage.getItem('az_shortcuts_shown')){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='toast shortcuts';
      el.innerHTML='⌨️ Ctrl+K — поиск<br>Ctrl+N — новое<br>Ctrl+/ — все';
      $('toastContainer').appendChild(el);
      setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},4000);
      localStorage.setItem('az_shortcuts_shown','1');
    },1200);
  }
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea,select'))return;
    if(!e.ctrlKey&&!e.metaKey)return;
    const k=e.key.toLowerCase();
    if(k===shortcutMap.search){e.preventDefault();openSearchModal()}
    else if(k===shortcutMap.new){e.preventDefault();if(isGuest){showToast('Гостям нельзя','info');return}switchSection('send')}
    else if(k===shortcutMap.home){e.preventDefault();switchSection('home')}
    else if(k===shortcutMap.cart){e.preventDefault();if(isGuest){showToast('Гостям нельзя','info');return}switchSection('cart')}
    else if(k===shortcutMap.settings){e.preventDefault();openSettingsModal()}
    else if(k===shortcutMap.help){e.preventDefault();openShortcutsModal()}
    else if(k==='escape'){if(activeModal)activeModal.closeModal()}
  });
}
function openShortcutsModal(){
  let html='<h3 class="modal-title">⌨️ '+t('shortcuts')+'</h3>';
  const labels={search:t('search'),new:'Новое объявление',home:t('home'),cart:t('cart'),settings:t('settings'),help:'Помощь'};
  for(const key in DEFAULT_SHORTCUTS){
    html+='<div class="shortcut-row"><span>'+labels[key]+'</span><span class="shortcut-key" data-key="'+key+'">Ctrl+'+shortcutMap[key].toUpperCase()+'</span></div>';
  }
  html+='<p style="font-size:.72rem;color:var(--muted);text-align:center;margin-top:.8rem;">Нажмите на клавишу, чтобы изменить</p>';
  html+='<button class="btn secondary w-full mt-12" id="resetShortcutsBtn">Сбросить по умолчанию</button>';
  const r=showModal(html);
  $$('.shortcut-key').forEach(el=>{
    el.addEventListener('click',()=>{
      el.textContent='Нажмите...';
      el.classList.add('listening');
      const handler=(e)=>{
        e.preventDefault();
        if(e.key==='Escape'){renderShortcutLabels();el.classList.remove('listening');return}
        const key=e.key.toLowerCase();
        shortcutMap[el.dataset.key]=key;
        saveShortcuts();
        document.removeEventListener('keydown',handler);
        openShortcutsModal();
      };
      document.addEventListener('keydown',handler,{once:false});
    });
  });
  $('resetShortcutsBtn').addEventListener('click',()=>{shortcutMap={...DEFAULT_SHORTCUTS};saveShortcuts();openShortcutsModal()});
}

    const r=showModal('<h3 class="modal-title">Тип сделки</h3><div class="grid-tiles"><div class="grid-tile '+(sendFormData.type==='sell'?'active':'')+'" data-type="sell"><span class="tile-icon">💰</span>Продажа</div><div class="grid-tile '+(sendFormData.type==='buy'?'active':'')+'" data-type="buy"><span class="tile-icon">🛒</span>Покупка</div></div>');
    $$('#modalOverlay [data-type]').forEach(t=>t.addEventListener('click',()=>{sendFormData.type=t.dataset.type;$('sendTypeBtn').textContent=t.dataset.type==='sell'?'Продажа':'Покупка';r.closeModal()}));
  };
  $('sendCategoryBtn').onclick=()=>{
    const r=showModal('<h3 class="modal-title">Категория</h3><div class="grid-tiles">'+ALL_CATEGORIES.map(c=>'<div class="grid-tile '+(sendFormData.category===c.id?'active':'')+'" data-cat="'+c.id+'">'+c.label+'</div>').join('')+'</div>');
    $$('#modalOverlay [data-cat]').forEach(t=>t.addEventListener('click',()=>{sendFormData.category=t.dataset.cat;const cat=ALL_CATEGORIES.find(c=>c.id===t.dataset.cat);$('sendCategoryBtn').textContent=cat?cat.label:'Выберите категорию';r.closeModal()}));
  };
  $('sendServerBtn').onclick=()=>{
    const r=showModal('<h3 class="modal-title">Сервер</h3><div class="grid-tiles">'+ALL_SERVERS.map(s=>'<div class="grid-tile '+(sendFormData.server===s?'active':'')+'" data-server="'+s+'">'+s+'</div>').join('')+'</div>');
    $$('#modalOverlay [data-server]').forEach(t=>t.addEventListener('click',()=>{sendFormData.server=t.dataset.server;$('sendServerBtn').textContent=t.dataset.server;r.closeModal()}));
  };
  $('sendSubmitBtn').onclick=async()=>{
    if(isGuest||!currentUser){showAlert('Ошибка','Войдите в аккаунт');return}
    const itemName=$('sendName').value.trim();
    const priceRaw=$('sendPrice').value.trim();
    const description=$('sendDescription').value.trim();
    const images=$('sendImages').value.trim();
    const video=$('sendVideo').value.trim();
    if(!itemName||!priceRaw||!description){showAlert('Ошибка','Заполните поля');return}
    const fb=checkForbiddenWords(itemName+' '+description);
    if(fb){showAlert('Ошибка',fb);return}
    const lc=checkLinksString(images);
    if(!lc.valid){showAlert('Ошибка',lc.message);return}
    if(video&&!isVideoLink(video)){showAlert('Ошибка','Видео: только YouTube или VK');return}
    const last=localStorage.getItem('arizona_last_submit_time');
    if(last){const d=Date.now()-parseInt(last);if(d<SUBMIT_COOLDOWN_MS){showAlert('Подождите','Следующая отправка через '+Math.ceil((SUBMIT_COOLDOWN_MS-d)/1000)+' сек.');return}}
    if(!sendFormData.category||!sendFormData.server){showAlert('Ошибка','Выберите категорию и сервер');return}
    const userAge=Date.now()-new Date(currentUser.created_at).getTime();
    if(userAge<24*60*60*1000){
      try{const cr=await supabaseClient.from('ads').select('*',{count:'exact',head:true}).eq('author_id',currentUser.id);if(cr.count>=NEW_USER_LIMIT){showAlert('Лимит','Не более '+NEW_USER_LIMIT+' объявлений за 24ч');return}}catch(e){}
    }
    await submitAd(itemName,priceRaw,description,images,video,sendFormData);
  };
}
async function submitAd(itemName,priceRaw,description,images,video,formData){
  const isFirst=myAds.length===0&&!localStorage.getItem('az_first_ad_done');
  const na={mode:formData.type,category:formData.category,item_name:itemName,price:parsePriceToNumber(priceRaw),description:description,images:images,video_url:video||null,server:formData.server,author_id:currentUser.id,author_username:currentUser.username,status:'pending',created_at:new Date().toISOString(),expires_at:null,hidden:false};
  try{
    showLoader('Отправка...');
    const r=await withTimeout(supabaseClient.from('ads').insert(na),8000);
    hideLoader();
    if(r.error)throw r.error;
    localStorage.setItem('arizona_last_submit_time',Date.now().toString());
    playSfx('success');
    showToast('Объявление на модерации','success');
    if(isFirst){localStorage.setItem('az_first_ad_done','1');launchConfetti();setTimeout(()=>showAlert('🎉 Поздравляем!','Ваше первое объявление отправлено на модерацию!','success'),800)}
    $('sendName').value='';$('sendPrice').value='';$('sendDescription').value='';$('sendImages').value='';$('sendVideo').value='';
    sendFormData={type:'sell',category:null,server:null,video:''};
    $('sendTypeBtn').textContent='Продажа';$('sendCategoryBtn').textContent='Выберите категорию';$('sendServerBtn').textContent='Выберите сервер';
    if(currentSection==='all')loadMyAds();
  }catch(e){hideLoader();warn('submit',e);showAlert('Ошибка','Не удалось отправить')}
}

async function loadMyAds(){

    let h='';

    });

      e.stopPropagation();

        try{await supabaseClient.from('ads').delete().eq('id',b.dataset.permDel);await supabaseClient.from('favorites').delete().eq('ad_id',b.dataset.permDel);loadMyAds()}catch(e){showToast('Ошибка','error')}

async function adminUserAction(action){
  const target=$('adminUsernameInput').value.trim();
  if(!target){showAlert('Ошибка','Введите username или ID');return}
  try{
    let q=supabaseClient.from('app_users').select('*');
    if(!isNaN(target))q=q.eq('id',target);else q=q.eq('username',target);
    const r=await withTimeout(q,5000);
    if(r.error||!r.data||!r.data.length){showAlert('Ошибка','Не найден');return}
    const u=r.data[0];
    if(action==='ban')await supabaseClient.from('app_users').update({banned:true}).eq('id',u.id);
    else if(action==='unban')await supabaseClient.from('app_users').update({banned:false}).eq('id',u.id);
    else if(action==='make_admin')await supabaseClient.from('app_users').update({is_admin:true}).eq('id',u.id);
    else if(action==='remove_admin')await supabaseClient.from('app_users').update({is_admin:false}).eq('id',u.id);
    else if(action==='verify'){try{await supabaseClient.from('app_users').update({is_verified:true}).eq('id',u.id)}catch(e){await supabaseClient.rpc('noop')}}
    else if(action==='unverify'){try{await supabaseClient.from('app_users').update({is_verified:false}).eq('id',u.id)}catch(e){}}
    await logModeratorAction(action,u.id);playSfx('success');showAlert('Успех','Готово');loadAdminPanel();
  }catch(e){showAlert('Ошибка','Не удалось')}
}

async function openAdDetail(ad){
  markViewed(ad.id);
  recordPrice(ad.id,ad.price);
  const images=ad.images?ad.images.split(',').map(s=>s.trim()).filter(s=>s):[];
  const gallery=images.length?'<div class="image-gallery">'+images.map(i=>'<img src="'+i+'" loading="lazy" onerror="this.style.display=\'none\'">').join('')+'</div>':'';
  const videoHtml=ad.video_url?buildVideoEmbed(ad.video_url):'';
  const cat=ALL_CATEGORIES.find(c=>c.id===ad.category);
  const catLabel=cat?cat.label:(ad.category||'');
  const modeBadge=ad.mode==='sell'?'<span class="badge sell">Продажа</span>':'<span class="badge buy">Покупка</span>';
  const rating=getRatingForAuthor(ad.author_id);
  const isVerified=rating&&rating.avg>=VERIFIED_MIN_RATING&&rating.count>=3;
  const priceHistoryList=getPriceHistory(ad.id);
  let priceHistHtml='';
  if(priceHistoryList.length>1){
    priceHistHtml='<div class="price-history-list"><div style="font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:.3rem;">📊 История цен:</div>';
    priceHistoryList.slice().reverse().forEach((p,i)=>{
      const isCurrent=i===0;
      const prev=priceHistoryList[priceHistoryList.length-1-i-1];
      let delta='';
      if(prev&&prev.p!==p.p){const diff=p.p-prev.p;delta='<span class="price-history-delta '+(diff<0?'down':'')+'">'+(diff>0?'+':'')+formatPrice(Math.abs(diff))+'</span>'}
      priceHistHtml+='<div class="price-history-row '+(isCurrent?'current':'')+'"><span>'+new Date(p.t).toLocaleDateString('ru-RU')+'</span><span>'+formatPrice(p.p)+' '+delta+'</span></div>';
    });
    priceHistHtml+='</div>';
  }
  let statusHtml='';
  if(ad.status==='pending')statusHtml='<div class="empty-state">⏳ На модерации</div>';
  else if(ad.status==='deleted'){statusHtml='<div class="empty-state">🗑️ Удалено</div>';if(currentUser&&ad.author_id===currentUser.id)statusHtml+='<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 Апелляция</button>'}
  else{
    if(isGuest){
      statusHtml='<div class="empty-state">👀 Гостевой режим — войдите, чтобы совершать действия</div>';
    }else{
      statusHtml='<button class="btn primary w-full mb-8" id="detailContactBtn">💬 '+t('write_author')+'</button>'+
        '<button class="btn secondary w-full mb-8" id="detailCartToggleBtn">🛒 '+t('add_cart')+'</button>'+
        '<button class="btn secondary w-full mb-8" id="detailReviewsBtn">⭐ '+t('reviews')+'</button>'+
        (ad.author_id===currentUser.id?'<button class="btn danger w-full mb-8" id="detailDeleteBtn">🗑 '+t('delete')+'</button>':'')+
        '<div class="ornament">◈ ◈ ◈</div>'+
        '<button class="btn secondary w-full mt-8" id="detailReportBtn">🚨 '+t('report')+'</button>'+
        '<button class="btn secondary w-full mt-8" id="detailReportUserBtn">👤 Жалоба на автора</button>'+
        '<button class="btn secondary w-full mt-8" id="detailShareBtn">📤 '+t('share')+'</button>';
    }
  }
  let isFav=false;
  if(currentUser&&!isGuest)isFav=await checkIfInCart(ad.id);
  const r=showModal('<h3 class="modal-title">'+escapeHtml(ad.item_name)+'</h3><div class="ad-card-badges mb-8">'+modeBadge+'<span class="badge server">'+ad.server+'</span><span class="badge category">'+catLabel+'</span>'+(ad.video_url?'<span class="badge video">🎬 Видео</span>':'')+'</div>'+videoHtml+gallery+'<div class="ad-card-price" style="font-size:1.6rem;margin-bottom:.5rem;">'+formatPrice(ad.price)+'</div>'+priceHistHtml+'<p style="color:var(--muted);margin-bottom:.8rem;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:.88rem;">'+escapeHtml(ad.description||'Нет описания')+'</p><div style="font-size:.72rem;color:var(--muted);margin-bottom:.9rem;">Автор: '+(isVerified?'<span class="verified-badge">✓</span> ':'')+'<span id="detailAuthorLink" style="cursor:pointer;color:var(--accent);font-weight:600;">'+escapeHtml(ad.author_username||ad.author_id)+'</span>'+(rating?' <span class="ad-card-rating">⭐ '+rating.avg.toFixed(1)+' ('+rating.count+')</span>':'')+'</div>'+statusHtml+'<div id="detailReviewsSection"></div><div class="ornament" style="margin-top:1rem;">◈ ◈ ◈</div><h4 style="margin:.4rem 0 .6rem;font-weight:700;">📌 Похожие</h4><div id="detailSimilarAds"></div>');
  if(ad.status==='approved'&&!isGuest){
    $('detailContactBtn')?.addEventListener('click',()=>window.open('https://t.me/'+(ad.author_username||ad.author_id),'_blank'));
    const cb=$('detailCartToggleBtn');
    if(cb){
      cb.textContent=isFav?'🛒 '+t('remove_cart'):'🛒 '+t('add_cart');
      cb.addEventListener('click',async()=>{
        try{
          if(isFav){await supabaseClient.from('favorites').delete().eq('user_id',currentUser.id).eq('ad_id',ad.id);cartIds.delete(ad.id);cb.textContent='🛒 '+t('add_cart');isFav=false}
          else{await supabaseClient.from('favorites').insert({user_id:currentUser.id,ad_id:ad.id});cartIds.add(ad.id);cb.textContent='🛒 '+t('remove_cart');isFav=true}
          loadCart();
        }catch(e){showToast('Ошибка','error')}
      });
    }
    $('detailReviewsBtn')?.addEventListener('click',()=>openReviewsModal(ad.id));
    if(ad.author_id===currentUser.id){
      $('detailDeleteBtn')?.addEventListener('click',()=>showConfirm('Удаление','Удалить?',async()=>{await supabaseClient.from('ads').update({status:'deleted'}).eq('id',ad.id);r.closeModal();loadHomeFeed(true)}));
    }
    $('detailReportBtn')?.addEventListener('click',()=>{
      const r2=showModal('<h3 class="modal-title">🚨 Пожаловаться</h3><div class="form-group"><label>Причина</label><textarea id="reportReason"></textarea></div><button class="btn primary w-full" id="reportSubmitBtn">Отправить</button>');
      $('reportSubmitBtn').addEventListener('click',async()=>{
        const reason=$('reportReason').value.trim();
        if(!reason){showAlert('Ошибка','Введите причину');return}
        await supabaseClient.from('reports').insert({ad_id:ad.id,reporter_id:currentUser.id,reporter_username:currentUser.username,reason:reason,status:'pending',created_at:new Date().toISOString()});
        showAlert('Успех','Отправлено');r2.closeModal();
      });
    });
    $('detailReportUserBtn')?.addEventListener('click',()=>openReportUserModal(ad.author_id));
    $('detailShareBtn')?.addEventListener('click',()=>shareAd(ad));
  }
  if(ad.status==='deleted'&&currentUser&&ad.author_id===currentUser.id){
    $('detailAppealBtn')?.addEventListener('click',()=>{appealAdId=ad.id;openAppealModal()});
  }
  $('detailAuthorLink')?.addEventListener('click',()=>openProfileModal(ad.author_id));
  loadReviews(ad.id);
  loadSimilarAds(ad.category,ad.id);
}
function buildVideoEmbed(url){
  const embed=getVideoEmbedUrl(url);
  if(!embed)return'';
  return'<div class="video-embed"><iframe src="'+embed+'" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
}
async function checkIfInCart(adId){
  if(!currentUser||isGuest)return false;
  try{const r=await supabaseClient.from('favorites').select('*').eq('user_id',currentUser.id).eq('ad_id',adId).maybeSingle();if(r.data)cartIds.add(adId);return!!r.data}catch(e){return false}
}
async function loadReviews(adId){
  const c=$('detailReviewsSection');if(!c)return;
  try{
    const r=await withTimeout(supabaseClient.from('reviews').select('*').eq('ad_id',adId).order('created_at',{ascending:false}),5000);
    if(r.error)throw r.error;
    const revs=r.data||[];
    if(!revs.length){c.innerHTML='<p style="color:var(--muted);font-size:.82rem;margin-top:.8rem;">⭐ Отзывов пока нет</p>';return}
    const avg=revs.reduce((s,x)=>s+x.stars,0)/revs.length;
    let h='<div style="margin-top:1rem;"><div style="font-size:1rem;font-weight:800;">⭐ '+avg.toFixed(1)+' <span style="color:var(--muted);font-size:.78rem;font-weight:500;">('+revs.length+')</span></div><div class="progress-bar mb-12"><div class="progress-fill" style="width:'+(avg/5*100)+'%;"></div></div></div>';
    revs.forEach(rv=>{
      const canEdit=currentUser&&rv.author_id===currentUser.id&&(Date.now()-new Date(rv.created_at).getTime())<7*24*60*60*1000;
      const canDelete=currentUser&&(rv.author_id===currentUser.id||isOwner);
      const isSeller=currentUser&&rv.author_id===currentUser.id;
      h+='<div class="review-item"><div style="font-weight:600;font-size:.85rem;">'+escapeHtml(rv.author_username||rv.author_id)+' <span style="color:var(--accent);">'+'★'.repeat(rv.stars)+'☆'.repeat(5-rv.stars)+'</span></div><div style="font-size:.68rem;color:var(--muted);">'+new Date(rv.created_at).toLocaleDateString('ru-RU')+'</div><p style="font-size:.78rem;margin:.25rem 0;white-space:pre-wrap;word-break:break-word;">'+escapeHtml(rv.text||'')+'</p>'+(rv.media_links?'<div style="font-size:.68rem;color:var(--accent);word-break:break-all;">'+escapeHtml(rv.media_links)+'</div>':'');
      if(rv.reply_text)h+='<div style="margin-left:.8rem;padding:.4rem;background:var(--glass-2);border-radius:6px;margin-top:.3rem;border-left:2px solid var(--accent);"><strong style="font-size:.7rem;color:var(--accent);">Ответ:</strong><div style="font-size:.75rem;">'+escapeHtml(rv.reply_text)+'</div></div>';
      else if(!isGuest&&(isSeller||isOwner))h+='<button class="btn secondary mt-8" data-reply-review="'+rv.id+'" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">💬 Ответить</button>';
      if(!isGuest&&(canEdit||canDelete)){
        h+='<div class="flex-between gap-8 mt-8" style="justify-content:flex-start;">';
        if(canEdit)h+='<button class="btn secondary" data-edit-review="'+rv.id+'" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">✏️</button>';
        if(canDelete)h+='<button class="btn danger" data-del-review="'+rv.id+'" style="min-height:32px;padding:.3rem .7rem;font-size:.68rem;">🗑</button>';
        h+='</div>';
      }
      h+='</div>';
    });
    c.innerHTML=h;
    c.querySelectorAll('[data-edit-review]').forEach(b=>b.addEventListener('click',()=>{const rv=revs.find(x=>x.id==b.dataset.editReview);if(rv)openEditReviewModal(rv)}));
    c.querySelectorAll('[data-del-review]').forEach(b=>b.addEventListener('click',async()=>{await supabaseClient.from('reviews').delete().eq('id',b.dataset.delReview);loadReviews(adId)}));
    c.querySelectorAll('[data-reply-review]').forEach(b=>b.addEventListener('click',()=>{const rv=revs.find(x=>x.id==b.dataset.replyReview);if(rv)openReplyModal(rv)}));
  }catch(e){}
}

/* ============ MUSIC (исправлен) ============ */
function openMusicModal(){
  if(musicAudio){try{musicAudio.pause()}catch(e){}musicAudio=null}
  const ref=showModal('<h3 class="modal-title">🎵 Музыка</h3>'+
    '<div class="music-player">'+
      '<div class="music-track-info"><div class="music-track-icon">🎵</div><div style="min-width:0;flex:1;"><div class="music-track-name" id="musicTrackName">Трек не выбран</div><div class="music-track-status" id="musicTrackStatus">Выберите источник</div></div></div>'+
      '<div class="music-progress"><div class="music-progress-fill" id="musicProgressFill"></div></div>'+
      '<div class="music-controls"><button class="btn primary" id="musicPlayBtn">▶️ Играть</button><button class="btn secondary" id="musicPauseBtn">⏸ Пауза</button><button class="btn danger" id="musicStopBtn">⏹ Сброс</button></div>'+
    '</div>'+
    '<div class="form-group mt-12"><label>Ссылка (mp3/ogg)</label><input type="text" id="musicUrl" placeholder="https://example.com/song.mp3"></div>'+
    '<label class="file-upload-btn" for="musicFile"><span>📁 Загрузить свой файл</span><input type="file" id="musicFile" accept="audio/*"></label>'+
    '<p style="font-size:.68rem;color:var(--muted);margin-top:.5rem;text-align:center;">Поддерживаются MP3, WAV, OGG, M4A и др.</p>');
  const tn=$('musicTrackName'),ts=$('musicTrackStatus'),pf=$('musicProgressFill');
  function setTrack(n,s){tn.textContent=n;ts.textContent=s}
  function stopProg(){if(musicProgressInterval){clearInterval(musicProgressInterval);musicProgressInterval=null}}
  function startProg(){stopProg();musicProgressInterval=setInterval(()=>{if(musicAudio&&musicAudio.duration){const pct=(musicAudio.currentTime/musicAudio.duration)*100;pf.style.width=pct+'%'}},300)}
  function playAudio(url,name){
    if(musicAudio){try{musicAudio.pause()}catch(e){}}
    if(musicObjectUrl&&musicObjectUrl!==url){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}musicObjectUrl=null}
    musicAudio=new Audio(url);
    musicAudio.addEventListener('ended',()=>{ts.textContent='Завершено';stopProg();pf.style.width='0%'});
    musicAudio.addEventListener('play',()=>{ts.textContent='Играет'});
    musicAudio.addEventListener('pause',()=>{if(musicAudio&&!musicAudio.ended)ts.textContent='На паузе'});
    setTrack(name,'Загрузка...');
    const promise=musicAudio.play();
    if(promise&&promise.then)promise.then(()=>{ts.textContent='Играет';startProg()}).catch(err=>{ts.textContent='Ошибка воспроизведения';showToast('Файл не воспроизводится','error')});
    else{ts.textContent='Играет';startProg()}
  }
  $('musicPlayBtn').addEventListener('click',()=>{
    const url=$('musicUrl').value.trim();
    if(url){playAudio(url,url.split('/').pop()||'Трек из интернета')}
    else if(musicAudio){musicAudio.play().catch(()=>showToast('Ошибка','error'))}
    else showToast('Введите ссылку или загрузите файл','info');
  });
  $('musicPauseBtn').addEventListener('click',()=>{if(musicAudio)musicAudio.pause()});
  $('musicStopBtn').addEventListener('click',()=>{
    if(musicAudio){try{musicAudio.pause()}catch(e){}musicAudio=null}
    if(musicObjectUrl){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}musicObjectUrl=null}
    stopProg();pf.style.width='0%';setTrack('Трек не выбран','Выберите источник');$('musicUrl').value='';
    const fi=$('musicFile');if(fi)fi.value='';
  });
  $('musicFile').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f){showToast('Файл не выбран','error');return}
    if(f.size>20*1024*1024){showToast('Файл больше 20 МБ','error');return}
    if(musicObjectUrl){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}}
    try{
      musicObjectUrl=URL.createObjectURL(f);
      playAudio(musicObjectUrl,f.name);
    }catch(err){
      showToast('Ошибка создания URL: '+err.message,'error');
    }
  });
}

function bindVoiceInputsInModal(modalRef){
  setTimeout(()=>{
    const scope=modalRef&&modalRef.overlay?modalRef.overlay:document;
    scope.querySelectorAll('.voice-input-btn').forEach(btn=>{
      btn.addEventListener('click',e=>{
        e.preventDefault();
        const targetId=btn.dataset.target;
        const target=scope.querySelector('#'+targetId)||document.getElementById(targetId);
        if(!target){showToast('Поле не найдено','error');return}
        btn.classList.add('listening');
        startVoiceInput(target,()=>btn.classList.remove('listening'));
        setTimeout(()=>btn.classList.remove('listening'),15000);
      });
    });
  },100);
}

    if(!n.length){c.innerHTML='<div class="empty-state">Нет уведомлений</div>';return}
    c.innerHTML=n.map(x=>'<div class="card '+(x.read?'':'inactive-card')+'" style="cursor:default;"><div style="font-weight:600;font-size:.85rem;">'+escapeHtml(x.message)+'</div><div style="font-size:.68rem;color:var(--muted);margin-top:.25rem;">'+new Date(x.created_at).toLocaleString('ru-RU')+'</div></div>').join('');
    await supabaseClient.from('notifications').update({read:true}).eq('user_id',currentUser.id).eq('read',false);
    unreadNotifications=0;
  }catch(e){$('notificationsList').innerHTML='<div class="empty-state">⚠️ Ошибка</div>'}
}

/* ============ SEARCH ============ */
function openSearchModal(){openSearchModalWithQuery('')}
async function openSearchModalWithQuery(initial){
  const ref=showModal('<h3 class="modal-title">🔍 Поиск</h3><div class="form-group"><div class="input-with-voice"><input type="text" id="searchInput" placeholder="Введите запрос..." autocomplete="off" value="'+escapeHtml(initial)+'"><button class="voice-input-btn" data-target="searchInput" type="button">🎤</button></div></div><div class="flex-between gap-8 mb-12"><button class="btn primary w-full" id="searchItemBtn">📦 Предмет</button><button class="btn secondary w-full" id="searchProfileBtn">👤 Профиль</button></div><div id="searchSuggestions"></div><div id="searchHistory"></div><div id="searchResults"></div>');
  bindVoiceInputsInModal(ref);
  const input=$('searchInput');
  setTimeout(()=>input.focus(),150);
  const sugg=$('searchSuggestions'),res=$('searchResults'),hist=$('searchHistory');
  function renderHist(){
    if(!searchHistory.length){hist.innerHTML='';return}
    hist.innerHTML='<div style="font-size:.72rem;color:var(--muted);margin-bottom:.4rem;">📜 История:</div>'+searchHistory.map(h=>'<span class="badge" style="cursor:pointer;margin:.12rem;background:var(--accent-soft);color:var(--accent);" data-hist="'+escapeHtml(h)+'">'+escapeHtml(h)+'</span>').join('');
    hist.querySelectorAll('[data-hist]').forEach(el=>el.addEventListener('click',()=>{input.value=el.dataset.hist;input.dispatchEvent(new Event('input'))}));
  }
  renderHist();
  async function doSearch(q){
    if(!q)return[];
    try{
      const r=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('hidden',false),5000);
      if(r.error||!r.data)return[];
      return r.data.filter(ad=>smartMatch(q,ad.item_name||'')||smartMatch(q,ad.description||''));
    }catch(e){return[]}
  }
  input.addEventListener('input',async()=>{
    const q=input.value.trim().toLowerCase();
    if(!q){sugg.innerHTML='';res.innerHTML='';return}
    const fixed=findSuggestions(q);
    const items=await doSearch(q);
    const top=items.slice(0,5);
    let hint=fixed&&fixed!==q?'<div style="font-size:.68rem;color:var(--muted);padding:.3rem .5rem;">💡 Возможно вы имели в виду: <strong style="color:var(--accent);">'+escapeHtml(fixed)+'</strong></div>':'';
    sugg.innerHTML=hint+top.map(ad=>'<div class="search-suggestion" data-sug="'+ad.id+'">📦 '+escapeHtml(ad.item_name)+' • '+formatPrice(ad.price)+'</div>').join('');
    sugg.querySelectorAll('[data-sug]').forEach(el=>el.addEventListener('click',()=>{
      const ad=items.find(a=>a.id==el.dataset.sug);
      if(ad){if(currentUser)saveSearchQuery(q);ref.closeModal();openAdDetail(ad)}
    }));
  });
  $('searchItemBtn').addEventListener('click',async()=>{
    const q=input.value.trim().toLowerCase();
    if(!q)return;
    if(currentUser)saveSearchQuery(q);
    const items=await doSearch(q);
    if(!items.length){
      const fixed=findSuggestions(q);
      if(fixed&&fixed!==q){res.innerHTML='<div class="empty-state">Ничего не найдено. Попробуйте: <strong style="color:var(--accent);">'+escapeHtml(fixed)+'</strong></div>';return}
      res.innerHTML='<div class="empty-state">Ничего не найдено</div>';return;
    }
    res.innerHTML=items.map(ad=>'<div class="card" data-res-id="'+ad.id+'" style="padding:.65rem;"><div style="font-weight:700;">'+escapeHtml(ad.item_name)+'</div><div style="font-size:.72rem;color:var(--muted);">'+ad.server+' • '+formatPrice(ad.price)+'</div></div>').join('');
    res.querySelectorAll('[data-res-id]').forEach(card=>card.addEventListener('click',()=>{
      const ad=items.find(a=>a.id==card.dataset.resId);
      if(ad){ref.closeModal();openAdDetail(ad)}
    }));
  });
  $('searchProfileBtn').addEventListener('click',()=>{
    const q=input.value.trim();
    if(q){ref.closeModal();openProfileModal(q)}
  });
  if(initial){input.dispatchEvent(new Event('input'));setTimeout(()=>$('searchItemBtn').click(),300)}
}

/* ============ BOOT ============ */
function detectDesktop(){
  const ua=navigator.userAgent.toLowerCase();
  const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
  const isMobile=/android|iphone|ipad|ipod|mobile|webos|blackberry|opera mini|iemobile/i.test(ua);
  isDesktop=!isTouch&&!isMobile;
}
function bootApp(){
  detectDesktop();
  const tgUser=initTelegram();
  const supOk=initSupabase();
  if(!supOk){
    setTimeout(()=>{hideSplash();document.body.innerHTML='<div style="text-align:center;margin-top:50vh;padding:2rem;color:#EF4444;font-family:sans-serif;">Ошибка подключения к БД. Обновите.</div>'},SPLASH_DURATION);
    return;
  }
  setTimeout(async()=>{
    hideSplash();
    const saved=localStorage.getItem('arizona_current_user');
    if(!saved){showAuthScreen(tgUser||'');return}
    try{
      currentUser=JSON.parse(saved);
      const r=await supabaseClient.from('app_users').select('*').eq('id',currentUser.id).maybeSingle();
      if(r.error||!r.data||r.data.banned){
        if(r.data&&r.data.banned){showBanScreen();return}
        localStorage.removeItem('arizona_current_user');
        currentUser=null;showAuthScreen(tgUser||'');return;
      }
      currentUser=r.data;
      addAccountToStorage(currentUser);
      showApp();
      try{initApp()}catch(e){warn('init',e)}
    }catch(e){
      warn('boot',e);
      localStorage.removeItem('arizona_current_user');
      currentUser=null;showAuthScreen(tgUser||'');
    }
  },SPLASH_DURATION);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('.btn,.nav-item,.card,.grid-tile,.link-item,.search-suggestion,.theme-toggle,.header-logo,.header-search,.modal-close,.auth-theme-toggle,.star-rating span,.auth-tab,.back-to-top,.fav-heart,.file-upload-btn,.shortcut-key,.voice-input-btn,.voice-btn,.account-row,.auth-guest-btn');
  if(t){playSfx('click');haptic('light')}
},{passive:true});
document.addEventListener('touchmove',e=>{if(document.querySelector('.modal-overlay.show')&&!e.target.closest('.modal'))e.preventDefault()},{passive:false});
window.addEventListener('DOMContentLoaded',bootApp);

})();
</script>
