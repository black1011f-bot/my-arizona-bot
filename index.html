<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arizona RP — Маркетплейс</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <style>
        /* ========== ПЕРЕМЕННЫЕ ========== */
        :root {
            --bg: #FFFFFF;
            --card: #FFFFFF;
            --border: #E8E8EC;
            --accent: #005BFF;
            --gold: #FF9900;
            --text: #1A1A1A;
            --muted: #8A8A8E;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
            --btn-min-height: 44px;
            --container-width: 480px;
            --nav-height: 60px;
            --header-height: 56px;
            --font: 'Montserrat', sans-serif;
            --transition-speed: 0.25s;
        }
        [data-theme="dark"] {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --border: #3A3A3C;
            --accent: #0A84FF;
            --gold: #FFD60A;
            --text: #FFFFFF;
            --muted: #A0A0A5;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        /* ========== СБРОС ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font);
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* ========== КОНТЕЙНЕР ========== */
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 12px;
            padding-top: calc(var(--header-height) + 10px);
            padding-bottom: calc(var(--nav-height) + 20px);
            transition: max-width 0.3s;
        }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (min-width: 768px) {
            :root {
                --container-width: 720px;
            }
            .ads-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .ad-card {
                width: 100%;
            }
        }
        @media (min-width: 1024px) {
            :root {
                --container-width: 1200px;
            }
            .ads-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 420px) {
            .header-title {
                font-size: 15px;
            }
            .header-logo {
                width: 30px;
                height: 30px;
            }
            .nav-item .nav-icon {
                font-size: 18px;
            }
            .nav-item {
                font-size: 9px;
                padding: 2px 4px;
                min-height: 36px;
            }
            .ad-card-img {
                width: 60px;
                height: 80px;
            }
            .ad-card-title {
                font-size: 13px;
            }
            .ad-card-price {
                font-size: 14px;
            }
            .card {
                padding: 10px;
            }
            .modal {
                padding: 14px;
                max-width: 98%;
            }
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-tiles {
                grid-template-columns: repeat(2, 1fr);
            }
            .btn {
                padding: 8px 14px;
                font-size: 12px;
                min-height: 36px;
            }
            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 8px 10px;
                font-size: 13px;
            }
        }
        @media (min-width: 1200px) {
            .container {
                padding-left: 20px;
                padding-right: 20px;
            }
            .ads-grid {
                gap: 16px;
            }
            .ad-card-img {
                width: 100px;
                height: 130px;
            }
        }
        @media (max-width: 360px) {
            .header-title {
                font-size: 13px;
            }
            .nav-item .nav-icon {
                font-size: 16px;
            }
            .nav-item {
                font-size: 8px;
                min-height: 32px;
            }
            .ad-card-img {
                width: 50px;
                height: 66px;
            }
            .ad-card-title {
                font-size: 12px;
            }
            .badge {
                font-size: 8px;
                padding: 1px 6px;
            }
        }

        /* ========== ХЕДЕР ========== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            height: var(--header-height);
            gap: 8px;
            transition: background 0.3s, border-color 0.3s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-logo:active {
            transform: scale(0.9);
        }
        .header-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-title {
            font-weight: 800;
            font-size: 18px;
            color: var(--text);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .header-search {
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }
        .header-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
            pointer-events: none;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .theme-toggle:active {
            transform: scale(0.9);
        }

        /* ========== НАВИГАЦИЯ ========== */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
            transition: background 0.3s, border-color 0.3s;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: color 0.3s, transform 0.2s, background 0.2s;
            flex: 1;
            max-width: 80px;
            min-height: var(--btn-min-height);
        }
        .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1;
        }
        .nav-item.active {
            color: var(--accent);
            background: rgba(0, 91, 255, 0.08);
        }
        .nav-item:active {
            transform: scale(0.92);
        }

        /* ========== СЕКЦИИ ========== */
        .section {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }
        .section.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* ========== КАРТОЧКИ ========== */
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            padding: 12px;
            margin-bottom: 10px;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.15s, opacity 0.3s;
            cursor: pointer;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card.inactive-card {
            background: rgba(128, 128, 128, 0.12) !important;
            opacity: 0.75;
        }
        [data-theme="dark"] .card.inactive-card {
            background: rgba(255, 255, 255, 0.04) !important;
            opacity: 0.65;
        }
        .ad-card {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .ad-card-img {
            width: 80px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }
        .ad-card-info {
            flex: 1;
            min-width: 0;
        }
        .ad-card-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ad-card-price {
            font-weight: 800;
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .ad-card-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 4px;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            background: var(--border);
            color: var(--text);
            white-space: nowrap;
        }
        .badge.sell {
            background: #34c759;
            color: #fff;
        }
        .badge.buy {
            background: #ff9500;
            color: #fff;
        }
        .badge.server {
            background: var(--gold);
            color: #1a1a1a;
        }
        .badge.category {
            background: var(--accent);
            color: #fff;
        }
        .badge.status-pending {
            background: #ffcc00;
            color: #1a1a1a;
        }
        .badge.status-deleted {
            background: #ff3b30;
            color: #fff;
        }
        .badge.status-approved {
            background: #34c759;
            color: #fff;
        }
        .badge.active {
            background: var(--accent);
            color: #fff;
        }
        .ad-card-author {
            font-size: 11px;
            color: var(--muted);
        }

        /* ========== КНОПКИ ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius);
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s, background 0.3s;
            touch-action: manipulation;
            min-height: var(--btn-min-height);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn.danger {
            background: #ff3b30;
            color: #fff;
        }
        .btn.gold {
            background: var(--gold);
            color: #1a1a1a;
        }
        .btn.success {
            background: #34c759;
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .btn.w-full {
            width: 100%;
        }

        /* ========== МОДАЛКИ ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show {
            opacity: 1;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.25s ease, background 0.3s, border-color 0.3s;
        }
        .modal-overlay.show .modal {
            transform: translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            padding: 4px;
            line-height: 1;
            z-index: 5;
            transition: transform 0.2s;
        }
        .modal-close:active {
            transform: scale(0.9);
        }
        .modal-title {
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 16px;
            padding-right: 30px;
        }

        /* ========== ФОРМЫ ========== */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
            font-family: var(--font);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
        }

        /* ========== ПУСТОЕ СОСТОЯНИЕ ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ========== ТУТОРИАЛ / ПОЛНЫЙ ЭКРАН ========== */
        .tutorial-overlay,
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            transition: background 0.3s;
        }
        .tutorial-slide {
            max-width: 420px;
            width: 100%;
        }
        .tutorial-slide h2 {
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 12px;
        }
        .tutorial-slide p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .tutorial-nav {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* ========== ЗВЁЗДЫ ========== */
        .star-rating {
            display: flex;
            gap: 4px;
            font-size: 28px;
            cursor: pointer;
        }
        .star-rating span {
            color: var(--border);
            transition: color 0.2s, transform 0.2s;
        }
        .star-rating span.active {
            color: var(--gold);
        }
        .star-rating span:hover {
            transform: scale(1.2);
        }

        /* ========== ОТЗЫВЫ ========== */
        .review-item {
            border-bottom: 1px solid var(--border);
            padding: 10px 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }

        /* ========== ИГРА ========== */
        .game-click-area {
            width: 100%;
            max-width: 250px;
            aspect-ratio: 1;
            margin: 0 auto 20px;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--border);
            transition: transform 0.1s, border-color 0.3s;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .game-click-area:active {
            transform: scale(0.92);
        }
        .game-click-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* ========== АПГРЕЙДЫ ========== */
        .upgrade-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: var(--card);
            transition: background 0.3s, border-color 0.3s;
        }
        .upgrade-info {
            flex: 1;
        }
        .upgrade-name {
            font-weight: 700;
            font-size: 14px;
        }
        .upgrade-cost {
            font-size: 12px;
            color: var(--muted);
        }

        /* ========== ПРОГРЕСС-БАР ========== */
        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin: 6px 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ========== КАТЕГОРИИ ========== */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .category-tile {
            padding: 12px 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .category-tile:active {
            transform: scale(0.95);
        }
        .category-tile .cat-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        /* ========== ПОИСК ========== */
        .search-suggestion {
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .search-suggestion:hover,
        .search-suggestion:active {
            background: var(--border);
        }

        /* ========== ПЛИТКИ ========== */
        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .grid-tile {
            padding: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: transform 0.2s, border-color 0.3s, background 0.3s;
        }
        .grid-tile:active {
            transform: scale(0.95);
        }
        .grid-tile .tile-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        /* ========== ГАЛЕРЕЯ ========== */
        .image-gallery {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 12px;
            scroll-snap-type: x mandatory;
        }
        .image-gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            scroll-snap-align: start;
            flex-shrink: 0;
            background: var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .image-gallery img:active {
            transform: scale(0.96);
        }

        /* ========== УТИЛИТЫ ========== */
        .hidden {
            display: none !important;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-12 {
            margin-top: 12px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-12 {
            margin-bottom: 12px;
        }
        .w-full {
            width: 100%;
        }
        .gap-8 {
            gap: 8px;
        }
        .gap-12 {
            gap: 12px;
        }
        .text-center {
            text-align: center;
        }

        /* ========== АВТОРИЗАЦИЯ ========== */
        .auth-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: var(--shadow);
        }
        .auth-tab {
            flex: 1;
            padding: 8px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: color 0.2s, border-color 0.2s;
        }
        .auth-tab.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        .auth-tab:not(.active) {
            color: var(--muted);
            border-bottom: 2px solid transparent;
        }

        /* ========== КАТЕГОРИИ В ХЕДЕРЕ ========== */
        #homeCategories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        #homeCategories::-webkit-scrollbar {
            display: none;
        }
        #homeCategories .badge {
            cursor: pointer;
            padding: 6px 12px;
            flex-shrink: 0;
        }
        #homeCategories .badge.active {
            background: var(--accent);
            color: #fff;
        }
        #homeCategories .badge:not(.active) {
            background: var(--border);
            color: var(--text);
        }

        /* ========== АНИМАЦИЯ ЗАГРУЗКИ ========== */
        .loader {
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ========== SCROLLBAR ========== */

    <script>
        (function() {

            // =========================================================================

            let tg = null;

            // =========================================================================
            // 3. ИНИЦИАЛИЗАЦИЯ SUPABASE

            function initSupabase() {
                try {
                    if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {

                        showFatalError('Не удалось загрузить библиотеку Supabase. Проверьте подключение к интернету.');

                        console.log('Supabase connected');
                    }).catch(() => {
                        console.warn('Supabase connection check failed, but will retry on demand');

                } catch (e) {

            function showFatalError(msg) {
                document.body.innerHTML =
                    `<div class="fullscreen-overlay"><h1 style="color:#ff3b30;">⚠️ Ошибка</h1><p style="color:var(--muted);">${msg}</p><button class="btn mt-12" onclick="location.reload()">Повторить</button></div>`;
            }

            // =========================================================================
            // 4. TELEGRAM WEBAPP
            // =========================================================================
            function initTelegram() {
                try {
                    if (window.Telegram && window.Telegram.WebApp) {
                        tg = window.Telegram.WebApp;
                        tg.expand();
                        tg.ready();
                        const initData = tg.initDataUnsafe || {};
                        if (initData.user) {
                            currentUser = {
                                id: initData.user.id || 0,
                                username: initData.user.username || '',
                                first_name: initData.user.first_name || 'Пользователь'
                            };
                        }
                    }
                } catch (e) {
                    console.warn('Telegram WebApp not available', e);
                }
                // Если пользователь не определён — создаём тестового
                if (!currentUser.id) {
                    currentUser = {
                        id: Math.floor(Math.random() * 900000000) + 100000000,
                        username: 'guest_' + Math.floor(Math.random() * 10000),
                        first_name: 'Гость'
                    };
                }
            }

            // =========================================================================
            // 5. УТИЛИТЫ
            // =========================================================================
            function withTimeout(promise, ms = 10000) {
                return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), ms))]);
            }

            function playSfx(type = 'click') {
                if (!sfxEnabled) return;
                try {
                    if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    const freqs = { click: 800, success: 1200, error: 300, buy: 1000 };
                    osc.frequency.value = freqs[type] || 600;
                    osc.type = 'sine';
                    gain.gain.value = 0.1;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch (e) {}
            }

            function applyTheme() {
                document.documentElement.setAttribute('data-theme', currentTheme);
            }
            applyTheme();

            function formatPrice(value) {
                if (!value) return '0';
                let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
                if (num.includes('к')) {
                    let base = parseFloat(num.split('к')[0]) || 0;
                    let kCount = (num.match(/к/g) || []).length;
                    if (kCount === 1) base *= 1000;
                    else if (kCount === 2) base *= 1000000;
                    else if (kCount === 3) base *= 1000000000;
                    return Math.floor(base).toString();
                }
                num = parseInt(num) || 0;
                if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
                if (num >= 1000000) return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
                if (num >= 1000) return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
                return num.toString();
            }

            function parsePriceToNumber(str) {
                if (!str) return 0;
                str = str.toLowerCase().trim();
                let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
                let kCount = (str.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                return num;
            }

            function formatPriceInputHandler(e) {
                const input = e.target;
                let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
                if (!val) { input.value = ''; return; }
                let num = parseInt(val.replace(/к/g, '')) || 0;
                let kCount = (val.match(/к/g) || []).length;
                if (kCount === 1) num *= 1000;
                else if (kCount === 2) num *= 1000000;
                else if (kCount === 3) num *= 1000000000;
                input.value = formatPrice(num);
            }

            function isAllowedLink(url) {
                try {
                    const u = new URL(url);
                    const host = u.hostname.replace('www.', '');
                    return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
                } catch (e) { return false; }
            }

            function checkLinksString(str) {
                if (!str.trim()) return { valid: true, links: [] };
                const links = str.split(',').map(s => s.trim()).filter(s => s.length > 0);
                if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
                for (let link of links) {
                    if (!isAllowedLink(link)) return { valid: false, message: `Ссылка ${link} не разрешена` };
                }
                return { valid: true, links };
            }

            function getUserIdentifier() {
                if (currentAuthUser && currentAuthUser.username) return `@${currentAuthUser.username}`;
                if (currentUser.username) return `@${currentUser.username}`;
                return `ID:${currentUser.id}`;
            }

            function getUserId() {
                return currentAuthUser ? currentAuthUser.id : currentUser.id;
            }

            // =========================================================================
            // 6. МОДАЛКИ
            // =========================================================================
            function showModal(html, onClose) {
                const container = document.getElementById('modalContainer');
                container.innerHTML = `
                    <div class="modal-overlay" id="modalOverlay">
                        <div class="modal" id="modalBox">
                            <button class="modal-close" id="modalCloseBtn">✕</button>
                            ${html}
                        </div>
                    </div>
                `;
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('modalCloseBtn');
                setTimeout(() => overlay.classList.add('show'), 10);

                function closeModal() {
                    overlay.classList.remove('show');
                    setTimeout(() => { overlay.remove(); if (onClose) onClose(); }, 250);
                }
                closeBtn.addEventListener('click', closeModal);
                overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
                return { overlay, closeModal };
            }

            function showAlert(title, message, type = 'info') {
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                const { closeModal } = showModal(`
                    <div style="text-align:center;">
                        <div style="font-size:48px;margin-bottom:12px;">${icon}</div>
                        <h3 class="modal-title" style="text-align:center;">${title}</h3>
                        <p style="color:var(--muted);margin-bottom:16px;">${message}</p>
                        <button class="btn w-full" id="alertOkBtn">ОК</button>
                    </div>
                `);
                document.getElementById('alertOkBtn').addEventListener('click', closeModal);
            }

            function showConfirm(title, message, onConfirm) {
                const { closeModal } = showModal(`
                    <div style="text-align:center;">
                        <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
                        <h3 class="modal-title" style="text-align:center;">${title}</h3>
                        <p style="color:var(--muted);margin-bottom:16px;">${message}</p>
                        <div class="flex-between gap-12">
                            <button class="btn secondary w-full" id="confirmCancelBtn">Отмена</button>
                            <button class="btn danger w-full" id="confirmOkBtn">Подтвердить</button>
                        </div>
                    </div>
                `);
                document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
                document.getElementById('confirmOkBtn').addEventListener('click', () => { closeModal();
                    onConfirm(); });
            }

            // =========================================================================
            // 7. АУТЕНТИФИКАЦИЯ (Supabase)
            // =========================================================================
            async function hashPassword(password) {
                const msgBuffer = new TextEncoder().encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            async function checkAuth() {
                if (!supabaseClient) {
                    if (!initSupabase()) return;
                }

                // Пытаемся восстановить сессию из localStorage
                const saved = localStorage.getItem('arizona_current_user');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Проверяем, что пользователь существует в БД
                        const { data, error } = await supabaseClient
                            .from('app_users')
                            .select('*')
                            .eq('id', parsed.id)
                            .maybeSingle();
                        if (!error && data) {
                            currentAuthUser = data;
                            userIdentifier = getUserIdentifier();
                            if (data.banned) {
                                showBanScreen();
                                return;
                            }
                            await initApp();
                            return;
                        } else {
                            localStorage.removeItem('arizona_current_user');
                        }
                    } catch (e) {
                        localStorage.removeItem('arizona_current_user');
                    }
                }

                // Если есть Telegram пользователь — пробуем найти его в БД
                if (currentUser.id) {
                    const { data, error } = await supabaseClient
                        .from('app_users')
                        .select('*')
                        .eq('telegram_id', currentUser.id)
                        .maybeSingle();
                    if (!error && data) {
                        currentAuthUser = data;
                        localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                        userIdentifier = getUserIdentifier();
                        if (data.banned) {
                            showBanScreen();
                            return;
                        }
                        await initApp();
                        return;
                    }
                }

                // Если пользователь не найден — показываем экран регистрации/входа
                showAuthScreen();
            }

            function showBanScreen() {
                document.body.innerHTML = `
                    <div class="fullscreen-overlay">
                        <h1 style="color:#ff3b30;margin-bottom:12px;">🚫 Вы забанены</h1>
                        <p style="color:var(--muted);">Ваш аккаунт заблокирован администрацией.</p>
                        <button class="btn mt-12" onclick="window.open('https://t.me/${OWNER_USERNAME}','_blank')">Связаться с поддержкой</button>
                    </div>
                `;
            }

            function showAuthScreen() {
                const container = document.getElementById('authContainer');
                let mode = 'login';

                function renderAuthForm() {
                    const hasTelegram = currentUser.id > 0 && currentUser.username;
                    const telegramHint = hasTelegram ?
                        `<p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Вы вошли как <strong>@${currentUser.username}</strong>. Используйте этот логин для входа или создайте аккаунт.</p>` :
                        '<p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Войдите или создайте аккаунт для продолжения.</p>';

                    container.innerHTML = `
                        <div class="auth-container">
                            <div class="auth-box">
                                <h2 style="text-align:center;margin-bottom:4px;">Arizona RP</h2>
                                <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px;">Маркетплейс для Arizona RP</p>
                                ${telegramHint}
                                <div style="display:flex;margin-bottom:16px;border-bottom:1px solid var(--border);">
                                    <button type="button" class="auth-tab ${mode === 'login' ? 'active' : ''}" id="authTabLogin" style="flex:1;">Вход</button>
                                    <button type="button" class="auth-tab ${mode === 'register' ? 'active' : ''}" id="authTabRegister" style="flex:1;">Создать</button>
                                </div>
                                <div class="form-group">
                                    <label>Логин</label>
                                    <input type="text" id="authUsername" placeholder="Введите логин" autocomplete="off" value="${hasTelegram ? currentUser.username : ''}">
                                </div>
                                <div class="form-group">
                                    <label>Пароль</label>
                                    <input type="password" id="authPassword" placeholder="Введите пароль">
                                </div>
                                <button type="button" class="btn w-full" id="authSubmitBtn">${mode === 'login' ? 'Войти' : 'Создать аккаунт'}</button>
                                <p id="authError" style="color:#ff3b30;font-size:12px;margin-top:8px;text-align:center;"></p>
                            </div>
                        </div>
                    `;

                    const tabLogin = document.getElementById('authTabLogin');
                    const tabRegister = document.getElementById('authTabRegister');
                    const submitBtn = document.getElementById('authSubmitBtn');
                    const errorEl = document.getElementById('authError');

                    tabLogin.addEventListener('click', () => { if (mode !== 'login') { mode = 'login';
                            renderAuthForm(); } });
                    tabRegister.addEventListener('click', () => { if (mode !== 'register') { mode = 'register';
                            renderAuthForm(); } });

                    submitBtn.addEventListener('click', async () => {
                        errorEl.textContent = '';
                        const username = document.getElementById('authUsername').value.trim().toLowerCase();
                        const password = document.getElementById('authPassword').value.trim();
                        if (!username || !password) {
                            errorEl.textContent = 'Заполните все поля';
                            return;
                        }
                        try {
                            const hashedPassword = await hashPassword(password);
                            if (mode === 'login') {
                                const { data, error } = await supabaseClient
                                    .from('app_users')
                                    .select('*')
                                    .eq('username', username)
                                    .maybeSingle();
                                if (error) throw error;
                                if (!data || data.password_hash !== hashedPassword) {
                                    errorEl.textContent = 'Неверный логин или пароль';
                                    return;
                                }
                                if (data.banned) {
                                    showBanScreen();
                                    return;
                                }
                                currentAuthUser = data;
                                localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                                userIdentifier = getUserIdentifier();
                                playSfx('success');
                                container.innerHTML = '';
                                await initApp(true);
                            } else {
                                // Регистрация
                                const { data: existing } = await supabaseClient
                                    .from('app_users')
                                    .select('id')
                                    .eq('username', username)
                                    .maybeSingle();
                                if (existing) {
                                    errorEl.textContent = 'Такой пользователь уже существует';
                                    return;
                                }
                                const newUser = {
                                    username: username,
                                    password_hash: hashedPassword,
                                    telegram_id: currentUser.id || null,
                                    telegram_username: currentUser.username || null,
                                    banned: false,
                                    is_admin: username === OWNER_USERNAME,
                                    created_at: new Date().toISOString()
                                };
                                const { data: inserted, error: insertErr } = await supabaseClient
                                    .from('app_users')
                                    .insert(newUser)
                                    .select()
                                    .single();
                                if (insertErr) throw insertErr;
                                currentAuthUser = inserted;
                                localStorage.setItem('arizona_current_user', JSON.stringify(currentAuthUser));
                                userIdentifier = getUserIdentifier();
                                playSfx('success');
                                container.innerHTML = '';
                                await initApp(true);
                            }
                        } catch (e) {
                            console.error('Auth error:', e);
                            errorEl.textContent = 'Ошибка соединения. Попробуйте ещё раз.';
                        }
                    });
                }
                renderAuthForm();
            }

            // =========================================================================
            // 8. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
            // =========================================================================
            let userIdentifier = '';

            async function initApp(isFirstLogin = false) {
                if (!currentAuthUser) {
                    showAuthScreen();
                    return;
                }
                userIdentifier = getUserIdentifier();
                await loadUserData();
                checkTutorials(isFirstLogin);
                switchSection('home');
                // Запрашиваем Wake Lock
                requestWakeLock();
            }

            async function loadUserData() {
                try {
                    const { data, error } = await supabaseClient
                        .from('app_users')
                        .select('*')
                        .eq('id', currentAuthUser.id)
                        .single();
                    if (error) throw error;
                    currentAuthUser = data;
                    isAdmin = data.is_admin || (data.username === OWNER_USERNAME);
                    isOwner = data.username === OWNER_USERNAME;
                    if (data.banned) {
                        showBanScreen();
                        return;
                    }
                } catch (e) {
                    console.warn('loadUserData error', e);
                    isAdmin = currentAuthUser?.username === OWNER_USERNAME;
                    isOwner = isAdmin;
                }
                const adminBtn = document.getElementById('adminNavBtn');
                if (isAdmin) adminBtn.classList.remove('hidden');
                else adminBtn.classList.add('hidden');
            }

            function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
                    }
                } catch (e) {}
            }

            // =========================================================================
            // 9. ТУТОРИАЛЫ
            // =========================================================================
            function checkTutorials(isFirstLogin = false) {
                if (!currentAuthUser) return;
                const userKey = currentAuthUser.id;
                const tutorialDone = localStorage.getItem(`arizona_${userKey}_tutorial_completed`) === '1';
                if (isFirstLogin || !tutorialDone) showUserTutorial(userKey);
            }

            function showUserTutorial(userKey) {
                const slides = [
                    { title: '⚠️ Предупреждение',
                    text: 'Мы не несём ответственности за скам. Запрещена продажа/покупка аккаунтов. Продолжая использование, вы соглашаетесь с правилами.' },
                    { title: 'Добро пожаловать!',
                    text: 'Это приложение для размещения объявлений на серверах Arizona RP.' },
                    { title: '🏠 Главная', text: 'Здесь отображаются все одобренные объявления. Нажмите на карточку, чтобы увидеть подробности.' },
                    { title: '🛒 Корзина', text: 'Сохраняйте понравившиеся объявления. Удалённые отмечены серым фоном.' },
                    { title: '➕ Отправка', text: 'Создавайте свои объявления, после модерации они появятся в ленте.' },
                    { title: '☰ Все разделы', text: 'Игра «Барыга», лента луков, попутчики, музыка и настройки.' },
                    { title: '🔍 Поиск', text: 'Используйте строку поиска вверху для быстрого поиска товаров.' }
                ];
                let currentSlide = 0;
                const container = document.getElementById('tutorialContainer');

                function renderSlide() {
                    const slide = slides[currentSlide];
                    const isLast = currentSlide === slides.length - 1;
                    container.innerHTML = `
                        <div class="tutorial-overlay">
                            <div class="tutorial-slide">
                                <h2>${slide.title}</h2>
                                <p>${slide.text}</p>
                                <div class="tutorial-nav">
                                    <button class="btn secondary" id="tutBackBtn" ${currentSlide === 0 ? 'disabled' : ''}>← Назад</button>
                                    <button class="btn" id="tutNextBtn">${isLast ? 'Завершить' : 'Вперёд →'}</button>
                                </div>
                            </div>
                        </div>
                    `;
                    const backBtn = document.getElementById('tutBackBtn');
                    const nextBtn = document.getElementById('tutNextBtn');
                    backBtn.addEventListener('click', () => { if (currentSlide > 0) { currentSlide--;
                            renderSlide(); } });
                    nextBtn.addEventListener('click', () => {
                        if (currentSlide < slides.length - 1) { currentSlide++;
                            renderSlide(); } else {
                            localStorage.setItem(`arizona_${userKey}_tutorial_completed`, '1');
                            container.innerHTML = '';
                            // Показываем админ-туториал, если админ
                            if (isAdmin) showAdminTutorial();
                        }
                    });
                }
                renderSlide();
            }

            function showAdminTutorial() {
                if (!currentAuthUser || !isAdmin) return;
                const userKey = currentAuthUser.id;
                const done = localStorage.getItem(`arizona_${userKey}_admin_tutorial_completed`) === '1';
                if (done) return;

                const slides = [
                    { title: '🔧 Админ-панель', text: 'Здесь вы управляете объявлениями: одобрение, отклонение, редактирование.' },
                    { title: '📨 Апелляции', text: 'Вы можете одобрять или отклонять апелляции пользователей.' },
                    { title: '⚖️ Управление пользователями', text: 'Владелец может банить, разбанивать, назначать админов.' },
                    { title: '🧹 Дополнительно', text: 'Доступна очистка всей ленты. Все изменения сохраняются автоматически.' }
                ];
                let currentSlide = 0;
                const container = document.getElementById('tutorialContainer');

                function renderSlide() {
                    const slide = slides[currentSlide];
                    const isLast = currentSlide === slides.length - 1;
                    container.innerHTML = `
                        <div class="tutorial-overlay">
                            <div class="tutorial-slide">
                                <h2>${slide.title}</h2>
                                <p>${slide.text}</p>
                                <button class="btn w-full mt-12" id="adminTutNextBtn">${isLast ? 'Закрыть' : 'Вперёд →'}</button>
                            </div>
                        </div>
                    `;
                    const btn = document.getElementById('adminTutNextBtn');
                    btn.addEventListener('click', () => {
                        if (currentSlide < slides.length - 1) { currentSlide++;
                            renderSlide(); } else {
                            localStorage.setItem(`arizona_${userKey}_admin_tutorial_completed`, '1');
                            container.innerHTML = '';
                        }
                    });
                }
                renderSlide();
            }

            // =========================================================================
            // 10. НАВИГАЦИЯ
            // =========================================================================
            function switchSection(section) {
                currentSection = section;
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                const target = document.getElementById('section-' + section);
                if (target) target.classList.add('active');
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const navBtn = document.querySelector(`.nav-item[data-section="${section}"]`);
                if (navBtn) navBtn.classList.add('active');

                if (section === 'home') loadHomeFeed();
                if (section === 'cart') loadCart();
                if (section === 'send') { populateSendForm();
                    loadMyAds(); }
                if (section === 'admin') {
                    loadAdminPanel();
                    if (isAdmin) showAdminTutorial();
                }
                if (section === 'all') loadAllTiles();
                playSfx('click');
                requestWakeLock();
            }

            document.querySelectorAll('.nav-item[data-section]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sec = btn.dataset.section;
                    if (sec === 'admin' && !isAdmin) return;
                    switchSection(sec);
                });
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                currentTheme = currentTheme === 'light' ? 'dark' : 'light';
                localStorage.setItem('theme', currentTheme);
                applyTheme();
                playSfx('click');
            });

            document.getElementById('headerSearchTrigger').addEventListener('click', () => openSearchModal());
            document.getElementById('logoBtn').addEventListener('click', () => { currentFilterCategory = null;
                switchSection('home'); });

            // =========================================================================
            // 11. ГЛАВНАЯ ЛЕНТА
            // =========================================================================
            async function loadHomeFeed() {
                const catContainer = document.getElementById('homeCategories');
                catContainer.innerHTML = `
                    <button class="badge ${!currentFilterCategory ? 'active' : ''}" data-cat-filter="">Все</button>
                    ${ALL_CATEGORIES.map(c => `<button class="badge ${currentFilterCategory === c.id ? 'active' : ''}" data-cat-filter="${c.id}">${c.label}</button>`).join('')}
                `;
                catContainer.querySelectorAll('[data-cat-filter]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        currentFilterCategory = btn.dataset.catFilter || null;
                        loadHomeFeed();
                    });
                });

                const container = document.getElementById('homeFeed');
                container.innerHTML = '<div class="loader"></div>';
                try {
                    let query = supabaseClient.from('ads').select('*').eq('status', 'approved').order('created_at',
                    { ascending: false });
                    if (currentFilterCategory) query = query.eq('category', currentFilterCategory);
                    const { data, error } = await withTimeout(query);
                    if (error) throw error;
                    homeAds = data || [];
                    renderHomeFeed();
                } catch (e) {
                    console.warn('loadHomeFeed error', e);
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки. Проверьте интернет.</div>';
                }
            }

            function renderHomeFeed() {
                const container = document.getElementById('homeFeed');
                if (!homeAds.length) {
                    container.innerHTML = '<div class="empty-state">📭 Объявлений пока нет</div>';
                    return;
                }
                let html = '';
                homeAds.forEach(ad => {
                    const firstImg = ad.images ? ad.images.split(',')[0].trim() : '';
                    const imgSrc = firstImg || DEFAULT_AD_IMAGE;
                    const modeBadge = ad.mode === 'sell' ? '<span class="badge sell">Продажа</span>' :
                        '<span class="badge buy">Покупка</span>';
                    const catLabel = ALL_CATEGORIES.find(c => c.id === ad.category)?.label || ad.category;
                    html += `
                        <div class="card ad-card" data-ad-id="${ad.id}">
                            <img class="ad-card-img" src="${imgSrc}" onerror="this.src='${DEFAULT_AD_IMAGE}'" alt="">
                            <div class="ad-card-info">
                                <div class="ad-card-title">${ad.item_name || 'Без названия'}</div>
                                <div class="ad-card-price">${formatPrice(ad.price)}</div>
                                <div class="ad-card-badges">
                                    ${modeBadge}
                                    <span class="badge server">${ad.server}</span>
                                    <span class="badge category">${catLabel}</span>
                                </div>
                                <div class="ad-card-author">Автор: ${ad.author_id}</div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                container.querySelectorAll('.ad-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const id = card.dataset.adId;
                        const ad = homeAds.find(a => a.id == id);
                        if (ad) openAdDetail(ad);
                    });
                });
            }

            // =========================================================================
            // 12. КОРЗИНА
            // =========================================================================
            async function loadCart() {
                const container = document.getElementById('cartList');
                if (!currentAuthUser) {
                    container.innerHTML = '<div class="empty-state">🛒 Корзина пуста</div>';
                    return;
                }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const userId = getUserId().toString();
                    const { data: favs, error: favErr } = await supabaseClient
                        .from('favorites')
                        .select('ad_id')
                        .eq('user_id', userId);
                    if (favErr) throw favErr;
                    const adIds = favs.map(f => f.ad_id);
                    if (!adIds.length) {
                        container.innerHTML = '<div class="empty-state">🛒 Корзина пуста</div>';
                        return;
                    }
                    const { data: ads, error: adsErr } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .in('id', adIds)
                        .order('created_at', { ascending: false });
                    if (adsErr) throw adsErr;
                    cartAds = ads || [];
                    if (!cartAds.length) {
                        container.innerHTML = '<div class="empty-state">🛒 Корзина пуста</div>';
                        return;
                    }
                    let html = '';
                    cartAds.forEach(ad => {
                        const isDeleted = ad.status === 'deleted';
                        const statusBadge = isDeleted ?
                            '<span class="badge status-deleted">🔴 Удалено</span>' :
                            '<span class="badge status-approved">🟢 Висит</span>';
                        const cardClass = isDeleted ? 'card inactive-card' : 'card';
                        html += `
                            <div class="${cardClass}" data-ad-id="${ad.id}">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:13px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                        <div style="margin-top:4px;">${statusBadge}</div>
                                    </div>
                                    <button class="btn danger" data-remove-cart="${ad.id}">Удалить</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-remove-cart]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const adId = btn.dataset.removeCart;
                            await supabaseClient.from('favorites').delete().eq('user_id', getUserId().toString())
                                .eq('ad_id', adId);
                            playSfx('click');
                            loadCart();
                        });
                    });
                    container.querySelectorAll('.card[data-ad-id]').forEach(card => {
                        card.addEventListener('click', (e) => {
                            if (e.target.tagName === 'BUTTON') return;
                            const id = card.dataset.adId;
                            const ad = cartAds.find(a => a.id == id);
                            if (ad) openAdDetail(ad);
                        });
                    });
                } catch (e) {
                    console.warn('loadCart error', e);
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
                }
            }

            // =========================================================================
            // 13. ОТПРАВКА ОБЪЯВЛЕНИЯ
            // =========================================================================
            function populateSendForm() {
                const catSelect = document.getElementById('sendCategory');
                catSelect.innerHTML = ALL_CATEGORIES.map(c => `<option value="${c.id}">${c.label}</option>`).join('');
                const serverSelect = document.getElementById('sendServer');
                serverSelect.innerHTML = ALL_SERVERS.map(s => `<option value="${s}">${s}</option>`).join('');
                serverSelect.value = currentUserServer;
                const priceInput = document.getElementById('sendPrice');
                priceInput.removeEventListener('input', formatPriceInputHandler);
                priceInput.addEventListener('input', formatPriceInputHandler);
            }

            document.getElementById('sendSubmitBtn').addEventListener('click', async () => {
                if (!currentAuthUser) { showAlert('Ошибка', 'Вы не авторизованы'); return; }
                const mode = document.getElementById('sendType').value;
                const category = document.getElementById('sendCategory').value;
                const itemName = document.getElementById('sendName').value.trim();
                const priceRaw = document.getElementById('sendPrice').value.trim();
                const description = document.getElementById('sendDescription').value.trim();
                const images = document.getElementById('sendImages').value.trim();
                const server = document.getElementById('sendServer').value;

                if (!itemName || !priceRaw || !description) {
                    showAlert('Ошибка', 'Заполните все обязательные поля');
                    return;
                }
                const linkCheck = checkLinksString(images);
                if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }

                const newAd = {
                    mode,
                    category,
                    item_name: itemName,
                    price: parsePriceToNumber(priceRaw),
                    description,
                    images,
                    server,
                    author_id: userIdentifier,
                    author_user_id: getUserId().toString(),
                    status: 'pending',
                    created_at: new Date().toISOString()
                };

                try {
                    await supabaseClient.from('ads').insert(newAd);
                    playSfx('success');
                    showAlert('Успех', 'Объявление отправлено на модерацию', 'success');
                    document.getElementById('sendName').value = '';
                    document.getElementById('sendPrice').value = '';
                    document.getElementById('sendDescription').value = '';
                    document.getElementById('sendImages').value = '';
                    loadMyAds();
                } catch (e) {
                    showAlert('Ошибка', 'Не удалось отправить объявление');
                }
            });

            async function loadMyAds() {
                const container = document.getElementById('myAdsList');
                if (!currentAuthUser) {
                    container.innerHTML = '<div class="empty-state">У вас пока нет объявлений</div>';
                    return;
                }
                container.innerHTML = '<div class="loader"></div>';
                try {
                    const { data, error } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .eq('author_id', userIdentifier)
                        .order('created_at', { ascending: false });
                    if (error) throw error;
                    myAds = data || [];
                    if (!myAds.length) {
                        container.innerHTML = '<div class="empty-state">У вас пока нет объявлений</div>';
                        return;
                    }
                    let html = '';
                    myAds.forEach(ad => {
                        let statusBadge = '';
                        if (ad.status === 'pending') statusBadge = '<span class="badge status-pending">🟡 На модерации</span>';
                        else if (ad.status === 'deleted') statusBadge = '<span class="badge status-deleted">🔴 Удалено</span>';
                        else statusBadge = '<span class="badge status-approved">🟢 Висит</span>';
                        const cardClass = ad.status === 'deleted' ? 'card inactive-card' : 'card';
                        html += `
                            <div class="${cardClass}">
                                <div class="flex-between">
                                    <div>
                                        <div style="font-weight:700;">${ad.item_name}</div>
                                        <div style="font-size:12px;color:var(--muted);">${ad.server} • ${formatPrice(ad.price)}</div>
                                        <div style="margin-top:4px;">${statusBadge}</div>
                                    </div>
                                    <div class="flex-between gap-8">
                                        <button class="btn danger" data-permanent-delete="${ad.id}">🗑 Удалить</button>
                                        ${ad.status === 'deleted' ? `<button class="btn gold" data-appeal-ad="${ad.id}">📨 Апелляция</button>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('[data-permanent-delete]').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const id = btn.dataset.permanentDelete;
                            showConfirm('Удаление', 'Стереть объявление из базы навсегда?', async () => {
                                await supabaseClient.from('ads').delete().eq('id', id);
                                await supabaseClient.from('favorites').delete().eq('ad_id', id);
                                playSfx('click');
                                loadMyAds();
                            });
                        });
                    });
                    container.querySelectorAll('[data-appeal-ad]').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            appealAdId = btn.dataset.appealAd;
                            openAppealModal();
                        });
                    });
                } catch (e) {
                    console.warn('loadMyAds error', e);
                    container.innerHTML = '<div class="empty-state">⚠️ Ошибка загрузки</div>';
                }
            }

            // =========================================================================
            // 14. АПЕЛЛЯЦИИ
            // =========================================================================
            let appealAdId = null;

            function openAppealModal() {
                if (!appealAdId) return;
                showModal(`
                    <h3 class="modal-title">📨 Апелляция</h3>
                    <div class="form-group"><label>Причина</label><select id="appealReason">${APPEAL_REASONS.map(r => `<option>${r}</option>`).join('')}</select></div>
                    <div class="form-group"><label>Доказательства (ссылки)</label><input type="text" id="appealEvidence" placeholder="https://..."></div>
                    <button class="btn w-full" id="appealSubmitBtn">Отправить</button>
                `);
                document.getElementById('appealSubmitBtn').addEventListener('click', async () => {
                    const reason = document.getElementById('appealReason').value;
                    const evidence = document.getElementById('appealEvidence').value.trim();
                    const linkCheck = checkLinksString(evidence);
                    if (!linkCheck.valid) { showAlert('Ошибка', linkCheck.message); return; }
                    await supabaseClient.from('appeals').insert({
                        ad_id: appealAdId,
                        author_id: userIdentifier,
                        reason,
                        evidence,
                        status: 'pending',
                        created_at: new Date().toISOString()
                    });
                    playSfx('success');
                    showAlert('Успех', 'Апелляция отправлена');
                    document.getElementById('modalOverlay').remove();
                });
            }

            // =========================================================================
            // 15. АДМИН-ПАНЕЛЬ
            // =========================================================================

                try {
                    const { data: pendingData, error: pendingErr } = await supabaseClient
                        .from('ads')
                        .select('*')
                        .eq('status', 'pending')
                        .order('created_at', { ascending: false });
                    if (pendingErr) throw pendingErr;
                    pendingAds = pendingData || [];

                    const { data: appealsData, error: appealsErr } = await supabaseClient
                        .from('appeals')
                        .select('*')
                        .eq('status', 'pending')
                        .order('created_at', { ascending: false });

                    pendingAppeals = appealsData || [];

                        html += `
                            <div class="card">
                                <div style="font-weight:700;">${ad.item_name}</div>

                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve="${ad.id}">✅ Одобрить</button>
                                    <button class="btn danger" data-reject="${ad.id}">❌ Отклонить</button>
                                    <button class="btn secondary" data-edit-ad="${ad.id}">✏️</button>
                                </div>
                            </div>
                        `;
                    });

                    html += '<h3 style="margin-top:20px;">📨 Апелляции</h3>';
                    if (!pendingAppeals.length) html += '<div class="empty-state">Нет апелляций</div>';
                    else pendingAppeals.forEach(appeal => {

                                <div style="font-weight:700;">Объявление ID: ${appeal.ad_id}</div>

                                <div style="font-size:12px;color:var(--muted);">Причина: ${appeal.reason}</div>
                                ${appeal.evidence ? `<div style="font-size:11px;color:var(--accent);">Доказательства: ${appeal.evidence}</div>` : ''}
                                <div class="flex-between gap-8 mt-8">
                                    <button class="btn success" data-approve-appeal="${appeal.id}">✅ Одобрить</button>
                                    <button class="btn danger" data-reject-appeal="${appeal.id}">❌ Отклонить</button>
                                </div>
                            </div>
                        `;
                    });

                    if (isOwner) {
                        html += `
                            <h3 style="margin-top:20px;">👤 Управление пользователями</h3>
                            <div class="form-group"><input type="text" id="adminUsernameInput" placeholder="username или ID"></div>
                            <div class="flex-between gap-8 mb-8">
                                <button class="btn danger w-full" id="adminBanBtn">🔨 Забанить</button>
                                <button class="btn success w-full" id="adminUnbanBtn">🔓 Разбанить</button>
                            </div>
                            <div class="flex-between gap-8 mb-8">
                                <button class="btn w-full" id="adminMakeAdminBtn">👑 Сделать админом</button>
                                <button class="btn secondary w-full" id="adminRemoveAdminBtn">⬇️ Снять админа</button>
                            </div>
                            <button class="btn danger w-full mt-8" id="adminClearFeedBtn">🧹 Очистить ленту</button>
                        `;
                    }
                    container.innerHTML = html;

                document.querySelectorAll('[data-approve]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('ads').update({ status: 'approved' }).eq('id', btn.dataset
                        .approve);
                        playSfx('success');
                        loadAdminPanel();
                        loadHomeFeed();
                    });
                });
                document.querySelectorAll('[data-reject]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('ads').update({ status: 'deleted' }).eq('id', btn.dataset
                        .reject);
                        playSfx('click');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-edit-ad]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const ad = pendingAds.find(a => a.id == btn.dataset.editAd);
                        if (ad) openAdminEditModal(ad);
                    });
                });
                document.querySelectorAll('[data-approve-appeal]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('appeals').update({ status: 'approved' }).eq('id', btn.dataset
                            .approveAppeal);
                        playSfx('success');
                        loadAdminPanel();
                    });
                });
                document.querySelectorAll('[data-reject-appeal]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        await supabaseClient.from('appeals').update({ status: 'rejected' }).eq('id', btn.dataset
                            .rejectAppeal);
                        playSfx('click');
                        loadAdminPanel();
                    });
