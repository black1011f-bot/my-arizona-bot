<!DOCTYPE html>
<html lang="ru" data-font-size="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arizona Online × Bounty Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
/* ============================================================
   ROOT
   ============================================================ */
:root{
  --bg:#0F0A1E;--bg-2:#150F28;--card:#1A1230;--card-2:#221844;
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
  --text:#F5F1FA;--text-soft:#D4CCE8;--muted:#8A7FA8;--muted-2:#5A517A;
  --accent:#8B5CF6;--accent-2:#22D3EE;--accent-3:#EC4899;
  --accent-soft:rgba(139,92,246,.18);--accent-glow:rgba(139,92,246,.45);
  --cyan-soft:rgba(34,211,238,.15);--pink-soft:rgba(236,72,153,.15);
  --success:#22C55E;--success-soft:rgba(34,197,94,.15);
  --danger:#EF4444;--danger-soft:rgba(239,68,68,.18);
  --warning:#F59E0B;--warning-soft:rgba(245,158,11,.15);
  --info:#3B82F6;--info-soft:rgba(59,130,246,.15);
  --grad-aurora:linear-gradient(135deg,#8B5CF6,#22D3EE);
  --grad-sunset:linear-gradient(135deg,#F97316,#EC4899 50%,#8B5CF6);
  --grad-mix:linear-gradient(135deg,#8B5CF6,#EC4899 50%,#F97316);
  --grad-flow:linear-gradient(90deg,#8B5CF6,#22D3EE,#EC4899,#F97316,#8B5CF6);
  --glass:rgba(26,18,48,.75);--glass-2:rgba(255,255,255,.04);
  --shadow:0 4px 16px rgba(0,0,0,.45);--shadow-md:0 8px 24px rgba(0,0,0,.5);
  --radius:18px;--radius-sm:12px;--radius-xs:8px;
  --header-height:64px;--nav-height:68px;
  --font-body:'Plus Jakarta Sans',-apple-system,sans-serif;
  --font-mono:'Space Grotesk',monospace;
}
[data-theme="light"]{
  --bg:#FFF8F5;--bg-2:#FDF2F8;--card:#FFFFFF;--card-2:#FEF8FE;
  --border:rgba(15,10,30,.08);--border-strong:rgba(15,10,30,.16);
  --text:#1A0F2E;--text-soft:#3D2E5C;--muted:#7A6B94;--muted-2:#B0A2C9;
  --accent:#7C3AED;--accent-2:#0891B2;--accent-3:#DB2777;
  --accent-soft:rgba(124,58,237,.10);--accent-glow:rgba(124,58,237,.30);
  --cyan-soft:rgba(8,145,178,.10);--pink-soft:rgba(219,39,119,.10);
  --success:#16A34A;--success-soft:rgba(22,163,74,.12);
  --danger:#DC2626;--danger-soft:rgba(220,38,38,.12);
  --warning:#D97706;--warning-soft:rgba(217,119,6,.12);
  --info:#2563EB;--info-soft:rgba(37,99,235,.12);
  --glass:rgba(255,255,255,.78);--glass-2:rgba(15,10,30,.03);
  --shadow:0 4px 16px rgba(15,10,30,.08);--shadow-md:0 8px 24px rgba(15,10,30,.10);
}
/* === FONT SIZE — через font-size на html, работает со всеми rem === */
html[data-font-size="small"]{font-size:14px}
html[data-font-size="medium"]{font-size:16px}
html[data-font-size="large"]{font-size:18px}
html.theme-changing *,html.theme-changing *::before,html.theme-changing *::after{transition:none!important;animation-duration:0s!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:var(--font-body)}
html,body{height:100%}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;touch-action:manipulation;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:.4rem;height:.4rem}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:.4rem}
@keyframes brand-shift{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.brand-animated{background:var(--grad-flow);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand-shift 5s linear infinite}
.brand-team-animated{background:var(--grad-flow);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand-shift 6s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splash-zoom{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes pulse-rec{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.1)}}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes cardSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardSlideLeft{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes cardScaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes cardBlurIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}

/* SPLASH */
#splash-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;transition:opacity .4s,visibility .4s}
#splash-screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.splash-icon{width:5.5rem;height:5.5rem;border-radius:1.25rem;overflow:hidden;box-shadow:0 8px 32px var(--accent-glow);animation:splash-zoom 1.2s ease-out}
.splash-icon img{width:100%;height:100%;object-fit:cover}
.splash-title{font-weight:800;font-size:1.8rem;margin-top:.25rem}
.splash-subtitle{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}

/* LOADER */
.loader-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.loader-overlay.show{opacity:1;visibility:visible}
.loader-spinner-big{width:3.4rem;height:3.4rem;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent-2);border-radius:50%;animation:spin .9s linear infinite}
.loader-overlay-text{color:#fff;font-size:.88rem;font-weight:600}
.loader{border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;width:1.9rem;height:1.9rem;animation:spin .9s linear infinite;margin:1.25rem auto}

/* TOP PROGRESS */
.top-progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--grad-aurora);z-index:9997;transform:scaleX(0);transform-origin:left;transition:transform .25s,opacity .25s;opacity:0}
.top-progress.active{transform:scaleX(1);opacity:1}

/* OFFLINE */
.offline-banner{position:fixed;top:0;left:0;right:0;padding:.4rem .75rem;padding-top:calc(.4rem + env(safe-area-inset-top));background:var(--danger);color:#fff;font-size:.75rem;font-weight:600;text-align:center;z-index:9998;transform:translateY(-100%);transition:transform .25s}
.offline-banner.visible{transform:translateY(0)}

/* GUEST */
.guest-banner{position:fixed;top:calc(var(--header-height) + env(safe-area-inset-top));left:0;right:0;padding:.5rem .75rem;background:var(--grad-sunset);color:#fff;font-size:.75rem;font-weight:600;text-align:center;z-index:99;display:none}
.guest-banner.visible{display:block}
.guest-banner button{background:rgba(255,255,255,.25);border:none;color:#fff;padding:.15rem .4rem;border-radius:.4rem;font-weight:700;font-size:.7rem;margin-left:.3rem;cursor:pointer}

/* BACK TO TOP */
.back-to-top{position:fixed;bottom:calc(var(--nav-height) + .9rem + env(safe-area-inset-bottom));right:.9rem;width:2.6rem;height:2.6rem;border-radius:.75rem;background:var(--grad-aurora);color:#fff;border:none;box-shadow:0 4px 16px var(--accent-glow);cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;visibility:hidden;transform:translateY(1rem);transition:opacity .25s,visibility .25s,transform .25s}
.back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0)}

/* CONTAINER */
.container{max-width:100%;margin:0 auto;padding:.85rem;padding-top:calc(var(--header-height) + .85rem);padding-bottom:calc(var(--nav-height) + 1.5rem + env(safe-area-inset-bottom))}
@media(min-width:640px){.container{max-width:40rem;padding:1rem;padding-top:calc(var(--header-height) + 1rem)}}
@media(min-width:900px){.container{max-width:56rem}.ads-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}.ads-grid .card{margin-bottom:0}}
@media(min-width:1200px){.container{max-width:75rem}.ads-grid{grid-template-columns:repeat(3,1fr)}}

/* HEADER */
.header{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:.5rem .85rem;padding-top:calc(.5rem + env(safe-area-inset-top));height:calc(var(--header-height) + env(safe-area-inset-top));gap:.6rem}
.header-logo{width:2.4rem;height:2.4rem;border-radius:.6rem;overflow:hidden;flex-shrink:0;cursor:pointer;border:1.5px solid var(--accent);transition:transform .2s}
.header-logo:active{transform:scale(.92)}
.header-logo img{width:100%;height:100%;object-fit:cover}
.header-brand{display:flex;align-items:center;gap:.5rem;flex-shrink:0;cursor:pointer;min-width:0}
.header-brand-text{display:flex;flex-direction:column;line-height:1}
.header-title{font-weight:800;font-size:.95rem;line-height:1.15}
.header-team{margin-top:.2rem;font-family:var(--font-mono);font-size:.6rem;font-weight:700;letter-spacing:.1em;line-height:1;white-space:nowrap}
@media(max-width:400px){.header-logo{width:2.1rem;height:2.1rem}.header-title{font-size:.85rem}.header-team{font-size:.55rem}}
.header-search{flex:1;cursor:pointer;min-width:0;position:relative}
.header-search input{width:100%;padding:.55rem .9rem;padding-right:4rem;border-radius:.6rem;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:.82rem;outline:none;pointer-events:none}
.voice-btn{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);background:var(--accent-soft);border:1px solid var(--border);border-radius:.5rem;color:var(--accent);font-size:.95rem;cursor:pointer;padding:.2rem .4rem;z-index:2}
.voice-btn.listening{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse-rec 1s infinite}
.theme-toggle{background:var(--card);border:1px solid var(--border);border-radius:.6rem;width:2.2rem;height:2.2rem;display:flex;align-items:center;justify-content:center;font-size:.95rem;cursor:pointer;flex-shrink:0;color:var(--text)}

/* NAV */
.nav-bar{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;height:var(--nav-height);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;background:none;border:none;color:var(--muted);font-size:.62rem;font-weight:600;cursor:pointer;padding:.3rem;border-radius:.6rem;flex:1;max-width:4.8rem;min-height:2.8rem;position:relative;transition:color .2s,background .2s}
.nav-item:active{transform:scale(.95)}
.nav-item .nav-icon{width:1.4rem;height:1.4rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s,filter .2s;opacity:.85}
.nav-item.active{color:var(--accent);background:var(--accent-soft)}
.nav-item.active .nav-icon{opacity:1;transform:scale(1.1) translateY(-1px);filter:drop-shadow(0 0 6px var(--accent-glow))}
.nav-item.active::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:1.4rem;height:2px;border-radius:0 0 2px 2px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}

/* SECTIONS */
.section{display:none}
.section.active{display:block}
.section h2{font-size:1.3rem;font-weight:800;margin-bottom:.9rem}
.section h3{font-size:1rem;font-weight:700;margin:1.2rem 0 .6rem}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:.9rem;margin-bottom:.75rem;cursor:pointer;transition:transform .12s,border-color .15s;position:relative;contain:content}
.card:hover{border-color:var(--border-strong)}
.card:active{transform:scale(.99)}
.card.inactive-card{opacity:.55}
.card.viewed{opacity:.75}
.card.anim-0{animation:cardSlideUp .35s ease backwards}
.card.anim-1{animation:cardSlideLeft .35s ease backwards}
.card.anim-2{animation:cardScaleIn .35s ease backwards}
.card.anim-3{animation:cardBlurIn .35s ease backwards}
.ad-card{display:flex;gap:.75rem;align-items:flex-start;position:relative}
.ad-card-info{flex:1;min-width:0}
.ad-card-title{font-weight:700;font-size:.95rem;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:3.7rem}
.ad-card-price{font-family:var(--font-mono);font-weight:700;font-size:1.15rem;background:var(--grad-mix);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.ad-card-badges{display:flex;gap:.25rem;flex-wrap:wrap;margin:.35rem 0 .25rem}
.ad-card-author{font-size:.7rem;color:var(--muted);margin-top:.2rem;font-weight:500;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap}
.ad-card-rating{display:inline-flex;align-items:center;gap:.1rem;font-size:.66rem;color:var(--warning);font-weight:700}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:.85rem;height:.85rem;background:var(--grad-aurora);border-radius:50%;color:#fff;font-size:.5rem;font-weight:900}
.fav-heart{position:absolute;top:0;right:0;width:1.75rem;height:1.75rem;border-radius:.5rem;background:var(--glass-2);border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;z-index:2}
.fav-heart.active{background:var(--pink-soft);color:var(--accent-3);border-color:var(--accent-3)}
.admin-del-btn{position:absolute;top:0;right:2.1rem;width:1.75rem;height:1.75rem;border-radius:.5rem;background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:.85rem;cursor:pointer;z-index:2;transition:all .15s}
.admin-del-btn:hover{background:var(--danger);color:#fff}
.admin-del-btn:active{transform:scale(.9)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:.15rem .5rem;border-radius:.4rem;font-size:.62rem;font-weight:700;background:var(--glass-2);color:var(--text-soft);white-space:nowrap;letter-spacing:.03em;line-height:1.3;text-transform:uppercase;border:1px solid var(--border)}
.badge.sell{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.buy{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.server{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.category{background:var(--cyan-soft);color:var(--accent-2);border-color:transparent}
.badge.status-pending{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.badge.status-deleted{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.status-approved{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.video{background:linear-gradient(135deg,rgba(239,68,68,.18),rgba(236,72,153,.18));color:#F87171;border-color:transparent}
.badge.appeal-pending{background:var(--warning-soft);color:var(--warning);border-color:transparent}
.badge.appeal-approved{background:var(--success-soft);color:var(--success);border-color:transparent}
.badge.appeal-rejected{background:var(--danger-soft);color:var(--danger);border-color:transparent}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:.82rem;cursor:pointer;min-height:2.9rem;transition:transform .12s,background .15s,border-color .15s;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--grad-aurora);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--glass-2);color:var(--text);border-color:var(--border)}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.gold{background:var(--grad-sunset);color:#fff;border-color:transparent}
.btn.success{background:transparent;color:var(--success);border-color:var(--success)}
.btn.success:hover{background:var(--success);color:#fff}
.btn.w-full{width:100%}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;transition:opacity .18s;overscroll-behavior:contain}
.modal-overlay.show{opacity:1}
.modal{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);width:100%;max-width:30rem;max-height:85vh;overflow-y:auto;padding:1.4rem;position:relative;transform:translateY(.7rem);transition:transform .2s;-webkit-overflow-scrolling:touch}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-close{position:absolute;top:.7rem;right:.7rem;background:var(--glass-2);border:1px solid var(--border);width:1.9rem;height:1.9rem;border-radius:.5rem;font-size:.9rem;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;z-index:2}
.modal-close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-title{font-weight:800;font-size:1.15rem;margin-bottom:.9rem;padding-right:2.2rem}

/* FORMS */
.form-group{margin-bottom:.85rem}
.form-group label{display:block;font-weight:600;font-size:.7rem;margin-bottom:.35rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:.7rem .9rem;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card-2);color:var(--text);font-size:.88rem;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{min-height:5.6rem;resize:vertical;font-family:inherit}
.input-with-voice{position:relative}
.input-with-voice input,.input-with-voice textarea{padding-right:2.6rem}
.voice-input-btn{position:absolute;right:.35rem;top:.5rem;background:var(--accent-soft);border:1px solid var(--border);color:var(--accent);width:1.9rem;height:1.9rem;border-radius:.5rem;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3}
.voice-input-btn.listening{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse-rec 1s infinite}

/* AUTH */
.auth-container{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;background:var(--bg);overflow-y:auto}
.auth-background{position:absolute;inset:0;background-position:center;background-size:cover;z-index:-1}
.auth-background::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,10,30,.35),rgba(15,10,30,.55))}
[data-theme="light"] .auth-background::after{background:linear-gradient(135deg,rgba(255,248,245,.35),rgba(253,242,248,.55))}
.auth-box{width:100%;max-width:25rem;background:var(--card);border-radius:1.25rem;border:1px solid var(--border);padding:1.8rem 1.6rem;position:relative;z-index:1;margin:auto}
.auth-brand{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.4rem}
.auth-logo{width:3.25rem;height:3.25rem;border-radius:.875rem;object-fit:cover;border:2px solid transparent;background-image:linear-gradient(var(--card),var(--card)),var(--grad-aurora);background-origin:border-box;background-clip:padding-box,border-box;padding:2px;flex-shrink:0}
.auth-brand-text{display:flex;flex-direction:column;line-height:1}
.auth-title{font-weight:800;font-size:1.3rem;line-height:1.1}
.auth-team{font-family:var(--font-mono);font-weight:700;font-size:.72rem;letter-spacing:.14em;margin-top:.25rem}
.auth-tabs{display:flex;margin-bottom:1.2rem;background:var(--glass-2);border-radius:.6rem;padding:.2rem}
.auth-tab{flex:1;padding:.6rem .4rem;background:none;border:none;cursor:pointer;font-weight:700;font-size:.8rem;color:var(--muted);border-radius:.5rem;font-family:inherit}
.auth-tab.active{color:#fff;background:var(--grad-aurora)}
.auth-theme-toggle{position:absolute;top:.8rem;right:.8rem;background:var(--glass-2);border:1px solid var(--border);border-radius:.6rem;width:2.1rem;height:2.1rem;font-size:.95rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;color:var(--text)}

function t(k){return (I18N[currentLang]&&I18N[currentLang][k])||I18N.ru[k]||k}
function categoryLabel(cat){if(!cat)return'';const l=currentLang==='en'?'en':currentLang==='uk'?'uk':null;return l?(cat[l]||cat.label):cat.label}
function appealReasonLabel(r){const f=APPEAL_REASONS.find(x=>x.ru===r);if(!f)return r;return f[currentLang]||f.ru}

   ============================================================ */
function applyTranslations(){
  // Статические элементы с data-i18n
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    const val=t(key);
    if(val&&val!==key)el.textContent=val;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key=el.dataset.i18nPh;
    const val=t(key);
    if(val&&val!==key)el.placeholder=val;
  });
  // Динамические кнопки отправки/аппеляций
  if($('sendTypeBtn')&&!sendFormData.type) $('sendTypeBtn').textContent=t('sell');
  if($('sendCategoryBtn')&&!sendFormData.category) $('sendCategoryBtn').textContent=t('choose_category');
  if($('sendServerBtn')&&!sendFormData.server) $('sendServerBtn').textContent=t('choose_server');
  if($('serverSelectBtn')) $('serverSelectBtn').textContent=currentFilterServer?'🌐 '+currentFilterServer:t('all_servers');
  // Обновляем title документа (кроме имени приложения)
  document.title='Arizona Online × Bounty Team';
}

function withTimeout(p,ms){ms=ms||10000;return Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Timeout')),ms))])}

/* ============================================================
   SHA-256
   ============================================================ */
const SALT='ArizonaOnlineSalt_2024';
function sha256Fallback(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a))}
  const mp=Math.pow,mw=mp(2,32);let res='';const w=[];const abl=ascii.length*8;
  let h=sha256Fallback.h=sha256Fallback.h||[];const k=sha256Fallback.k=sha256Fallback.k||[];let pc=k.length;const ic={};
  for(let c=2;pc<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(let i=0;i<ascii.length;i++){const j=ascii.charCodeAt(i);if(j>>8)return'';w[i>>2]|=j<<((3-i)%4)*8}
  w[w.length]=(abl/mw)|0;w[w.length]=abl;
  for(let j=0;j<w.length;){const ww=w.slice(j,j+=16);const oh=h;h=h.slice(0,8);for(let i=0;i<64;i++){const w15=ww[i-15],w2=ww[i-2];const a=h[0],e=h[4];const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(ww[i]=(i<16)?ww[i]:(ww[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+ww[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0}for(let i=0;i<8;i++)h[i]=(h[i]+oh[i])|0}
  for(let i=0;i<8;i++){for(let j=3;j+1;j--){const b=(h[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}}
  return res;
}
async function hashPassword(pw){
  const data=SALT+pw;
  if(window.crypto&&window.crypto.subtle&&typeof window.crypto.subtle.digest==='function'){
    try{const buf=new TextEncoder().encode(data);const hb=await window.crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(hb)).map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
  }
  return sha256Fallback(unescape(encodeURIComponent(data)))
}

function formatPrice(v){
  if(!v&&v!==0)return'0';
  let n=typeof v==='string'?v.toLowerCase():v.toString();
  if(n.indexOf('к')!==-1){let b=parseFloat(n.split('к')[0])||0;let kc=(n.match(/к/g)||[]).length;if(kc===1)b*=1000;else if(kc===2)b*=1000000;else if(kc===3)b*=1000000000;return Math.floor(b).toString()}
  n=parseInt(n)||0;
  if(n>=1000000000)return(n/1000000000).toFixed(n%1000000000===0?0:2)+'ккк';
  if(n>=1000000)return(n/1000000).toFixed(n%1000000===0?0:1)+'кк';
  if(n>=1000)return(n/1000).toFixed(n%1000===0?0:1)+'к';
  return n.toString();
}
function parsePriceToNumber(s){if(!s)return 0;s=s.toLowerCase().trim();let n=parseInt(s.replace(/[^0-9]/g,''))||0;let kc=(s.match(/к/g)||[]).length;if(kc===1)n*=1000;else if(kc===2)n*=1000000;else if(kc===3)n*=1000000000;return n}
function formatPriceInputHandler(e){const i=e.target;let v=i.value.toLowerCase().replace(/[^0-9к]/g,'');if(!v){i.value='';return}let n=parseInt(v.replace(/к/g,''))||0;let kc=(v.match(/к/g)||[]).length;if(kc===1)n*=1000;else if(kc===2)n*=1000000;else if(kc===3)n*=1000000000;i.value=formatPrice(n)}

function startRealtimeChannel(){
  if(!supabaseClient||realtimeChannel)return;
  try{
    realtimeChannel=supabaseClient.channel('ads-live')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'ads'},(payload)=>{
        const ad=payload.new;
        if(ad.status==='approved'&&!ad.hidden&&!homeAds.find(a=>a.id===ad.id)){
          homeAds.unshift(ad);
          showToast(t('new_ad_toast'),'success',2000);
          renderHomeFeed();
        }
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ads'},(payload)=>{
        const ad=payload.new;
        const idx=homeAds.findIndex(a=>a.id===ad.id);
        if(idx!==-1){if(ad.status==='approved'&&!ad.hidden){homeAds[idx]=ad;renderHomeFeed()}else{homeAds.splice(idx,1);renderHomeFeed()}}
      })
      .subscribe();
  }catch(e){warn('Realtime:',e)}
}

function launchConfetti(duration){
  duration=duration||2800;const cv=$('confetti-canvas');if(!cv||confettiActive)return;confettiActive=true;
  const ctx=cv.getContext('2d');let w=cv.width=window.innerWidth,h=cv.height=window.innerHeight;
  const colors=['#8B5CF6','#22D3EE','#EC4899','#F97316','#FACC15','#22C55E'];const parts=[];
  for(let i=0;i<100;i++)parts.push({x:Math.random()*w,y:-20-Math.random()*h*.4,vx:(Math.random()-.5)*6,vy:2+Math.random()*4,r:4+Math.random()*6,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.3,shape:Math.random()<.5?'rect':'circle'});
  const start=Date.now();
  function draw(){const el=Date.now()-start;if(el>duration){ctx.clearRect(0,0,w,h);confettiActive=false;return}ctx.clearRect(0,0,w,h);parts.forEach(p=>{p.vy+=.1;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;if(p.shape==='rect')ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.4);else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill()}ctx.restore()});requestAnimationFrame(draw)}
  draw();
}

const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const SpeechSupported=!!SpeechRec;
async function ensureMicPermission(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return{ok:false,reason:'unsupported'};
  if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return{ok:false,reason:'https'};
  try{if(navigator.permissions&&navigator.permissions.query){const p=await navigator.permissions.query({name:'microphone'});if(p.state==='granted')return{ok:true}}}catch(e){}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(tr=>tr.stop());return{ok:true}}catch(err){if(err.name==='NotAllowedError')return{ok:false,reason:'denied'};if(err.name==='NotFoundError')return{ok:false,reason:'no-device'};return{ok:false,reason:'unknown'}}
}
function createRecognizer(){if(!SpeechSupported)return null;try{const r=new SpeechRec();r.lang=currentLang==='en'?'en-US':currentLang==='uk'?'uk-UA':'ru-RU';r.continuous=false;r.interimResults=false;r.maxAlternatives=1;return r}catch(e){return null}}
function stopVoice(){if(voiceRecognition){try{voiceRecognition.onresult=null;voiceRecognition.onend=null;voiceRecognition.onerror=null;voiceRecognition.abort()}catch(e){}voiceRecognition=null}voiceIsListening=false;document.querySelectorAll('.voice-input-btn.listening,.voice-btn.listening').forEach(b=>b.classList.remove('listening'))}
async function startVoiceForField(targetEl,btnEl){
  if(!SpeechSupported){showToast(t('voice_not_supported'),'error');return}
  if(voiceIsListening){stopVoice();return}
  stopVoice();if(btnEl)btnEl.classList.add('listening');
  const perm=await ensureMicPermission();
  if(!perm.ok){if(btnEl)btnEl.classList.remove('listening');showToast(t('voice_permission'),'error');return}
  const rec=createRecognizer();if(!rec){if(btnEl)btnEl.classList.remove('listening');return}
  voiceRecognition=rec;voiceIsListening=true;
  rec.onresult=(e)=>{const txt=e.results[0][0].transcript.trim();if(targetEl&&txt){if(targetEl.tagName==='TEXTAREA')targetEl.value=targetEl.value?targetEl.value+' '+txt:txt;else targetEl.value=txt;targetEl.dispatchEvent(new Event('input',{bubbles:true}))}if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false};
  rec.onerror=()=>{if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false};
  rec.onend=()=>{if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false};
  try{rec.start()}catch(e){if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false}
}
async function startVoiceForSearch(btnEl){
  if(!SpeechSupported){showToast(t('voice_not_supported'),'error');return}
  if(voiceIsListening){stopVoice();return}
  stopVoice();if(btnEl)btnEl.classList.add('listening');
  const perm=await ensureMicPermission();
  if(!perm.ok){if(btnEl)btnEl.classList.remove('listening');showToast(t('voice_permission'),'error');return}
  const rec=createRecognizer();if(!rec){if(btnEl)btnEl.classList.remove('listening');return}
  voiceRecognition=rec;voiceIsListening=true;
  rec.onresult=(e)=>{const q=e.results[0][0].transcript.trim();if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false;if(q){showToast('🔍 '+q,'info',1200);setTimeout(()=>openSearchModalWithQuery(q),200)}};
  rec.onerror=()=>{if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false};
  rec.onend=()=>{if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false};
  try{rec.start()}catch(e){if(btnEl)btnEl.classList.remove('listening');voiceIsListening=false}
}

let globalHandlersBound=false;
function bindGlobalHandlers(){
  if(globalHandlersBound)return;globalHandlersBound=true;
  document.addEventListener('click',function(e){
    const searchBtn=e.target.closest('#voiceSearchBtn');
    if(searchBtn){e.preventDefault();e.stopPropagation();startVoiceForSearch(searchBtn);return}
    const fieldBtn=e.target.closest('.voice-input-btn');

  },true);
  document.addEventListener('keydown',function(e){

    const inInput=tag==='input'||tag==='textarea'||tag==='select';
    if(e.key==='Escape'){if(activeModal){try{activeModal.closeModal()}catch(x){}}if(voiceIsListening)stopVoice();return}
    if(inInput)return;
    if(!e.ctrlKey&&!e.metaKey)return;

    function m(sk){if(!sk)return false;const s=sk.toLowerCase();if(code.startsWith('Key')&&code.slice(3).toLowerCase()===s)return true;if(code.startsWith('Digit')&&code.slice(5)===s)return true;return(e.key||'').toLowerCase()===s}

function levenshtein(a,b){if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++){if(b.charAt(i-1)===a.charAt(j-1))m[i][j]=m[i-1][j-1];else m[i][j]=Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1)}return m[b.length][a.length]}
function smartMatch(q,t){if(!q||!t)return false;const ql=q.toLowerCase().trim();const tx=t.toLowerCase();if(tx.indexOf(ql)!==-1)return true;if(ql.length<3)return false;const words=tx.split(/\s+/);const qWords=ql.split(/\s+/).filter(w=>w.length>2);return qWords.some(qw=>words.some(tw=>levenshtein(qw,tw)<=2||tw.indexOf(qw)!==-1))}
function findSuggestions(q){if(!q||q.length<3)return null;const known=[];ALL_CATEGORIES.forEach(c=>c.label.split(' ').forEach(w=>{if(w.length>3)known.push(w.toLowerCase())}));ALL_SERVERS.forEach(s=>known.push(s.toLowerCase()));const ql=q.toLowerCase();const words=ql.split(/\s+/);let fixed=null;for(const w of words){if(w.length<3)continue;let best=null,bd=3;for(const k of known){const d=levenshtein(w,k);if(d<bd){bd=d;best=k}}if(best&&best!==w&&bd<=2){fixed=best;break}}return fixed}

function initSendForm(){
  const pi=$('sendPrice');pi.removeEventListener('input',formatPriceInputHandler);pi.addEventListener('input',formatPriceInputHandler);
  $('sendTypeBtn').onclick=()=>{const r=showModal('<h3 class="modal-title">'+t('type_deal')+'</h3><div class="grid-tiles"><div class="grid-tile '+(sendFormData.type==='sell'?'active':'')+'" data-type="sell"><span class="tile-icon">💰</span>'+t('sell')+'</div><div class="grid-tile '+(sendFormData.type==='buy'?'active':'')+'" data-type="buy"><span class="tile-icon">🛒</span>'+t('buy')+'</div></div>');$$('#modalOverlay [data-type]').forEach(tt=>tt.addEventListener('click',()=>{sendFormData.type=tt.dataset.type;$('sendTypeBtn').textContent=tt.dataset.type==='sell'?t('sell'):t('buy');r.closeModal()}))};
  $('sendCategoryBtn').onclick=()=>{const r=showModal('<h3 class="modal-title">'+t('category')+'</h3><div class="grid-tiles">'+ALL_CATEGORIES.map(cc=>'<div class="grid-tile '+(sendFormData.category===cc.id?'active':'')+'" data-cat="'+cc.id+'">'+categoryLabel(cc)+'</div>').join('')+'</div>');$$('#modalOverlay [data-cat]').forEach(tt=>tt.addEventListener('click',()=>{sendFormData.category=tt.dataset.cat;const cat=ALL_CATEGORIES.find(cc=>cc.id===tt.dataset.cat);$('sendCategoryBtn').textContent=categoryLabel(cat);r.closeModal()}))};
  $('sendServerBtn').onclick=()=>{const r=showModal('<h3 class="modal-title">'+t('server')+'</h3><div class="grid-tiles">'+ALL_SERVERS.map(s=>'<div class="grid-tile '+(sendFormData.server===s?'active':'')+'" data-server="'+s+'">'+s+'</div>').join('')+'</div>');$$('#modalOverlay [data-server]').forEach(tt=>tt.addEventListener('click',()=>{sendFormData.server=tt.dataset.server;$('sendServerBtn').textContent=tt.dataset.server;r.closeModal()}))};
  $('sendSubmitBtn').onclick=async()=>{
    if(isGuest||!currentUser){showAlert(t('error'),t('login_required'));return}
    const itemName=$('sendName').value.trim();const priceRaw=$('sendPrice').value.trim();const description=$('sendDescription').value.trim();const images=$('sendImages').value.trim();const video=$('sendVideo').value.trim();
    if(!itemName||!priceRaw||!description){showAlert(t('error'),t('fill_fields'));return}
    const fb=checkForbiddenWords(itemName+' '+description);if(fb){showAlert(t('error'),fb);return}
    const lc=checkLinksString(images);if(!lc.valid){showAlert(t('error'),lc.message);return}
    if(video&&!isVideoLink(video)){showAlert(t('error'),t('video_only'));return}
    const last=localStorage.getItem('arizona_last_submit_time');
    if(last){const d=Date.now()-parseInt(last);if(d<SUBMIT_COOLDOWN_MS){showAlert(t('wait'),t('next_send')+' '+Math.ceil((SUBMIT_COOLDOWN_MS-d)/1000)+' '+t('sec'));return}}
    if(!sendFormData.category||!sendFormData.server){showAlert(t('error'),t('choose_category')+' / '+t('choose_server'));return}
    const userAge=Date.now()-new Date(currentUser.created_at).getTime();
    if(userAge<24*60*60*1000){try{const cr=await supabaseClient.from('ads').select('*',{count:'exact',head:true}).eq('author_id',currentUser.id);if(cr.count>=NEW_USER_LIMIT){showAlert(t('error'),t('limit_reached'));return}}catch(e){}}
    await submitAd(itemName,priceRaw,description,images,video,sendFormData)
  }
}
async function submitAd(itemName,priceRaw,description,images,video,formData){
  const isFirst=!localStorage.getItem('az_first_ad_done_v8');
  const na={mode:formData.type,category:formData.category,item_name:itemName,price:parsePriceToNumber(priceRaw),description,images,video_url:video||null,server:formData.server,author_id:currentUser.id,author_username:currentUser.username,status:'pending',created_at:new Date().toISOString(),expires_at:null,hidden:false};
  try{showLoader(t('send_loading'));const r=await withTimeout(supabaseClient.from('ads').insert(na),8000);hideLoader();
    if(r.error)throw r.error;
    localStorage.setItem('arizona_last_submit_time',Date.now().toString());
    playSfx('success');showToast(t('ad_sent'),'success');
    if(isFirst){localStorage.setItem('az_first_ad_done_v8','1');launchConfetti();setTimeout(()=>showAlert(t('first_ad'),t('first_ad_text'),'success'),800)}
    $('sendName').value='';$('sendPrice').value='';$('sendDescription').value='';$('sendImages').value='';$('sendVideo').value='';
    sendFormData={type:'sell',category:null,server:null,video:''};
    $('sendTypeBtn').textContent=t('sell');$('sendCategoryBtn').textContent=t('choose_category');$('sendServerBtn').textContent=t('choose_server');
    if(currentSection==='all'){loadMyAds();loadMyAppeals()}
  }catch(e){hideLoader();showAlert(t('error'),t('cannot_load'))}
}

    await logModeratorAction('approve_ad',b.dataset.approve);

  // Reject
  $$('[data-reject]').forEach(b=>b.addEventListener('click',async()=>{

  $$('[data-approve-appeal]').forEach(b=>b.addEventListener('click',async()=>{
    const ap=pendingAppeals.find(a=>a.id==b.dataset.approveAppeal);
    if(ap){const ex=new Date(Date.now()+AD_EXPIRY_HOURS*60*60*1000).toISOString();await supabaseClient.from('ads').update({status:'approved',expires_at:ex}).eq('id',ap.ad_id)}
    await supabaseClient.from('appeals').update({status:'approved'}).eq('id',b.dataset.approveAppeal);
    await logModeratorAction('approve_appeal',b.dataset.approveAppeal);
    loadAdminPanel();
  }));
  $$('[data-reject-appeal]').forEach(b=>b.addEventListener('click',async()=>{
    await supabaseClient.from('appeals').update({status:'rejected'}).eq('id',b.dataset.rejectAppeal);
    await logModeratorAction('reject_appeal',b.dataset.rejectAppeal);
    loadAdminPanel();
  }));
  // Reports
  $$('[data-approve-report]').forEach(b=>b.addEventListener('click',async()=>{
    const rp=pendingReports.find(r=>r.id==b.dataset.approveReport);
    if(rp)await supabaseClient.from('ads').update({status:'deleted'}).eq('id',rp.ad_id);
    await supabaseClient.from('reports').update({status:'approved'}).eq('id',b.dataset.approveReport);
    await logModeratorAction('approve_report',b.dataset.approveReport);
    loadAdminPanel();
  }));
  $$('[data-reject-report]').forEach(b=>b.addEventListener('click',async()=>{
    await supabaseClient.from('reports').update({status:'rejected'}).eq('id',b.dataset.rejectReport);
    await logModeratorAction('reject_report',b.dataset.rejectReport);

    await supabaseClient.from('user_reports').update({status:'rejected'}).eq('id',b.dataset.ignoreUserReport);
    loadAdminPanel();
  }));
  $$('[data-ban-user]').forEach(b=>b.addEventListener('click',async()=>{
    await supabaseClient.from('app_users').update({banned:true}).eq('id',b.dataset.banUser);
    await supabaseClient.from('user_reports').update({status:'approved'}).eq('reported_user_id',b.dataset.banUser);
    await logModeratorAction('ban_user',b.dataset.banUser);
    loadAdminPanel();
  }));
  // Owner
  if(isOwner){
    const bindAction=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
    bindAction('adminBanBtn',()=>adminUserAction('ban'));
    bindAction('adminUnbanBtn',()=>adminUserAction('unban'));

      await supabaseClient.from('ads').delete().neq('id',0);
      await supabaseClient.from('favorites').delete().neq('id',0);
      await logModeratorAction('clear_feed','all');
      hideLoader();loadAdminPanel();loadHomeFeed(true);
    }));
  }
}

async function loadModeratorLogs(u){
  u=u||'';
  let q=supabaseClient.from('moderator_logs').select('*').order('created_at',{ascending:false}).limit(100);
  if(u)q=q.or('details.ilike.%'+u+'%,moderator_username.ilike.%'+u+'%');

  if(r.error||!r.data||!r.data.length){showAlert(t('empty'),'');return}

async function loadAdminAudit(u){

async function adminUserAction(action){
  const target=$('adminUsernameInput')?$('adminUsernameInput').value.trim():'';
  if(!target){showAlert(t('error'),t('not_found'));return}
  try{
    let q=supabaseClient.from('app_users').select('*');
    if(!isNaN(target))q=q.eq('id',target);else q=q.eq('username',target);
    const r=await withTimeout(q,5000);
    if(r.error||!r.data||!r.data.length){showAlert(t('error'),t('not_found'));return}
    const u=r.data[0];
    if(action==='ban')await supabaseClient.from('app_users').update({banned:true}).eq('id',u.id);
    else if(action==='unban')await supabaseClient.from('app_users').update({banned:false}).eq('id',u.id);
    else if(action==='make_admin')await supabaseClient.from('app_users').update({is_admin:true}).eq('id',u.id);
    else if(action==='remove_admin')await supabaseClient.from('app_users').update({is_admin:false}).eq('id',u.id);
    else if(action==='verify'){try{await supabaseClient.from('app_users').update({is_verified:true}).eq('id',u.id)}catch(e){}verifiedUsers.add(u.id)}
    else if(action==='unverify'){try{await supabaseClient.from('app_users').update({is_verified:false}).eq('id',u.id)}catch(e){}verifiedUsers.delete(u.id)}
    await logModeratorAction(action,u.id);
    playSfx('success');showAlert(t('success'),'');loadAdminPanel();
  }catch(e){showAlert(t('error'),t('error'))}
}

async function openAdDetail(ad){
  markViewed(ad.id);recordPrice(ad.id,ad.price);
  const images=ad.images?ad.images.split(',').map(s=>s.trim()).filter(s=>s):[];
  const gallery=images.length?'<div class="image-gallery">'+images.map(i=>'<img src="'+i+'" loading="lazy" onerror="this.style.display=\'none\'">').join('')+'</div>':'';
  const videoHtml=ad.video_url?buildVideoEmbed(ad.video_url):'';
  const cat=ALL_CATEGORIES.find(c=>c.id===ad.category);
  const catLabel=categoryLabel(cat);
  const modeBadge=ad.mode==='sell'?'<span class="badge sell">'+t('sell')+'</span>':'<span class="badge buy">'+t('buy')+'</span>';
  const rating=getRatingForAuthor(ad.author_id);
  const isVerified=verifiedUsers.has(ad.author_id)||(rating&&rating.avg>=VERIFIED_MIN_RATING&&rating.count>=3);
  const priceHistoryList=getPriceHistory(ad.id);
  let priceHistHtml='';
  if(priceHistoryList.length>1){
    priceHistHtml='<div class="price-history-list"><div style="font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:.3rem;">'+t('price_history')+'</div>';
    priceHistoryList.slice().reverse().forEach((p,i)=>{const isCurrent=i===0;const prevIdx=priceHistoryList.length-i-2;const prev=prevIdx>=0?priceHistoryList[prevIdx]:null;let delta='';if(prev&&prev.p!==p.p){const diff=p.p-prev.p;delta='<span class="price-history-delta '+(diff<0?'down':'')+'">'+(diff>0?'+':'-')+formatPrice(Math.abs(diff))+'</span>'}priceHistHtml+='<div class="price-history-row '+(isCurrent?'current':'')+'"><span>'+new Date(p.t).toLocaleDateString()+'</span><span>'+formatPrice(p.p)+' '+delta+'</span></div>'});
    priceHistHtml+='</div>';
  }
  const isMyAd=currentUser&&!isGuest&&ad.author_id===currentUser.id;
  let statusHtml='';
  if(ad.status==='pending')statusHtml='<div class="empty-state">'+t('on_moderation')+'</div>';
  else if(ad.status==='deleted'){
    statusHtml='<div class="empty-state">'+t('deleted')+'</div>';
    // Кнопка аппеляции для автора, если объявление удалено (в том числе админом)
    if(isMyAd)statusHtml+='<button class="btn gold w-full mt-8" id="detailAppealBtn">📨 '+t('appeal')+'</button>';
  } else {
    if(isGuest){statusHtml='<div class="empty-state">'+t('guest_mode')+'</div>'}
    else {
      statusHtml='<button class="btn primary w-full mb-8" id="detailContactBtn">'+t('write_author')+'</button>'+
        '<button class="btn secondary w-full mb-8" id="detailCartToggleBtn">'+t('add_cart')+'</button>'+
        '<button class="btn secondary w-full mb-8" id="detailReviewsBtn">'+t('reviews')+'</button>'+

async function checkIfInCart(adId){if(!currentUser||isGuest)return false;try{const r=await supabaseClient.from('favorites').select('*').eq('user_id',currentUser.id).eq('ad_id',adId).maybeSingle();if(r.data)cartIds.add(adId);return!!r.data}catch(e){return false}}
async function loadReviews(adId){
  const c=$('detailReviewsSection');if(!c)return;
  try{
    const r=await withTimeout(supabaseClient.from('reviews').select('*').eq('ad_id',adId).order('created_at',{ascending:false}),5000);
    if(r.error)throw r.error;
    const revs=r.data||[];
    if(!revs.length){c.innerHTML='<p style="color:var(--muted);font-size:.82rem;margin-top:.8rem;">'+t('no_reviews')+'</p>';return}
    const avg=revs.reduce((s,x)=>s+x.stars,0)/revs.length;
    let h='<div style="margin-top:1rem;"><div style="font-size:1rem;font-weight:800;">⭐ '+avg.toFixed(1)+' <span style="color:var(--muted);font-size:.78rem;">('+revs.length+')</span></div><div class="progress-bar mb-12"><div class="progress-fill" style="width:'+(avg/5*100)+'%;"></div></div></div>';
    revs.forEach(rv=>{
      const canEdit=currentUser&&!isGuest&&rv.author_id===currentUser.id&&(Date.now()-new Date(rv.created_at).getTime())<7*24*60*60*1000;
      const canDelete=currentUser&&!isGuest&&(rv.author_id===currentUser.id||isOwner);
      const isSeller=currentUser&&!isGuest&&rv.author_id===currentUser.id;
      h+='<div class="review-item"><div style="font-weight:600;font-size:.85rem;">'+escapeHtml(rv.author_username||rv.author_id)+' <span style="color:var(--accent);">'+'★'.repeat(rv.stars)+'☆'.repeat(5-rv.stars)+'</span></div><div style="font-size:.68rem;color:var(--muted);">'+new Date(rv.created_at).toLocaleDateString()+'</div><p style="font-size:.78rem;margin:.25rem 0;white-space:pre-wrap;word-break:break-word;">'+escapeHtml(rv.text||'')+'</p>'+(rv.media_links?'<div style="font-size:.68rem;color:var(--accent);word-break:break-all;">'+escapeHtml(rv.media_links)+'</div>':'');
      if(rv.reply_text)h+='<div style="margin-left:.8rem;padding:.4rem;background:var(--glass-2);border-radius:.4rem;margin-top:.3rem;border-left:2px solid var(--accent);"><strong style="font-size:.7rem;">'+t('answer')+':</strong><div style="font-size:.75rem;">'+escapeHtml(rv.reply_text)+'</div></div>';
      else if(!isGuest&&(isSeller||isOwner))h+='<button class="btn secondary mt-8" data-reply-review="'+rv.id+'" style="min-height:2rem;padding:.3rem .7rem;font-size:.68rem;">💬</button>';
      if(!isGuest&&(canEdit||canDelete)){h+='<div class="flex-between gap-8 mt-8" style="justify-content:flex-start;">';if(canEdit)h+='<button class="btn secondary" data-edit-review="'+rv.id+'" style="min-height:2rem;padding:.3rem .7rem;font-size:.68rem;">✏️</button>';if(canDelete)h+='<button class="btn danger" data-del-review="'+rv.id+'" style="min-height:2rem;padding:.3rem .7rem;font-size:.68rem;">🗑</button>';h+='</div>'}
      h+='</div>'
    });
    c.innerHTML=h;
    c.querySelectorAll('[data-edit-review]').forEach(b=>b.addEventListener('click',()=>{const rv=revs.find(x=>x.id==b.dataset.editReview);if(rv)openEditReviewModal(rv)}));
    c.querySelectorAll('[data-del-review]').forEach(b=>b.addEventListener('click',async()=>{await supabaseClient.from('reviews').delete().eq('id',b.dataset.delReview);loadReviews(adId)}));
    c.querySelectorAll('[data-reply-review]').forEach(b=>b.addEventListener('click',()=>{const rv=revs.find(x=>x.id==b.dataset.replyReview);if(rv)openReplyModal(rv)}))
  }catch(e){}
}

  h+='<button class="btn primary w-full mt-12" id="addAccountBtn">'+t('add_account')+'</button>';

  ref.overlay.querySelectorAll('[data-account-id]').forEach(row=>row.addEventListener('click',async e=>{if(e.target.closest('[data-remove-account]'))return;const id=row.dataset.accountId;if(currentUser&&currentUser.id===id)return;showLoader(t('switching'));try{const r=await supabaseClient.from('app_users').select('*').eq('id',id).maybeSingle();hideLoader();if(!r.data)return;if(r.data.banned){showBanScreen();return}currentUser=r.data;localStorage.setItem('arizona_current_user',JSON.stringify(r.data));ref.closeModal();setTimeout(()=>location.reload(),500)}catch(e){hideLoader()}}));
  ref.overlay.querySelectorAll('[data-remove-account]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();accountsList=accountsList.filter(a=>a.id!==b.dataset.removeAccount);saveAccounts();ref.closeModal();openAccountsModal()}));
  $('addAccountBtn').addEventListener('click',()=>{ref.closeModal();openAddAccountModal()})
}
function openAddAccountModal(){const ref=showModal('<h3 class="modal-title">'+t('add_account')+'</h3><div class="form-group"><label>'+t('login_label')+'</label><input type="text" id="addAccUsername"></div><div class="form-group"><label>'+t('password_label')+'</label><input type="password" id="addAccPassword"></div><button class="btn primary w-full" id="addAccBtn">'+t('ok')+'</button><p id="addAccError" style="color:var(--danger);font-size:.75rem;"></p>');$('addAccBtn').addEventListener('click',async()=>{const u=$('addAccUsername').value.trim().toLowerCase();const p=$('addAccPassword').value.trim();const err=$('addAccError');if(!/^[a-zA-Z0-9_]{3,20}$/.test(u)){err.textContent=t('login_short');return}if(!p||p.length<6){err.textContent=t('password_short');return}try{showLoader(t('loading'));const h=await hashPassword(p);const r=await supabaseClient.from('app_users').select('*').eq('username',u).maybeSingle();hideLoader();if(!r.data){err.textContent=t('not_found');return}if(r.data.password_hash!==h){err.textContent=t('wrong_password');return}if(r.data.banned){err.textContent=t('banned');return}addAccountToStorage(r.data);ref.closeModal();openAccountsModal()}catch(e){hideLoader();err.textContent=t('error')}})}

function openLooksModal(){showModal('<h3 class="modal-title">'+t('looks_feed')+'</h3>'+(isGuest?'':'<div class="form-group"><input type="text" id="lookImg" placeholder="URL"></div><div class="form-group"><input type="text" id="lookDesc" placeholder="'+t('description')+'"></div><button class="btn primary w-full mb-12" id="lookSubmitBtn">'+t('send_msg')+'</button>')+'<div id="looksList"><div class="loader"></div></div>');loadLooksFeed();if(!isGuest)$('lookSubmitBtn')?.addEventListener('click',async()=>{const img=$('lookImg').value.trim(),desc=$('lookDesc').value.trim();const lc=checkLinksString(img);if(!lc.valid){showAlert(t('error'),lc.message);return}await supabaseClient.from('looks').insert({author_id:currentUser.id,author_username:currentUser.username,image_url:img,description:desc,created_at:new Date().toISOString()});playSfx('success');$('lookImg').value='';$('lookDesc').value='';loadLooksFeed()})}
async function loadLooksFeed(){const c=$('looksList');if(!c)return;const r=await withTimeout(supabaseClient.from('looks').select('*').order('created_at',{ascending:false}),5000);if(r.error||!r.data||!r.data.length){c.innerHTML='<div class="empty-state">'+t('empty')+'</div>';return}c.innerHTML=r.data.map(l=>'<div class="card" style="cursor:default;"><div class="img-container" style="height:11rem;background:var(--card-2);"><img src="'+l.image_url+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:.6rem;" onload="this.classList.add(\'loaded\')" onerror="this.style.display=\'none\'"></div><div style="font-weight:700;font-size:.85rem;margin-top:.4rem;color:var(--accent);">'+escapeHtml(l.author_username||l.author_id)+'</div><p style="font-size:.78rem;color:var(--muted);">'+escapeHtml(l.description||'')+'</p>'+(currentUser&&!isGuest&&l.author_id===currentUser.id?'<button class="btn danger mt-8" data-del-look="'+l.id+'" style="min-height:2rem;padding:.3rem .7rem;font-size:.68rem;">🗑</button>':'')+'</div>').join('');c.querySelectorAll('[data-del-look]').forEach(b=>b.addEventListener('click',async()=>{await supabaseClient.from('looks').delete().eq('id',b.dataset.delLook);loadLooksFeed()}))}
function openCompanionsModal(){showModal('<h3 class="modal-title">'+t('companions')+'</h3>'+(isGuest?'':'<div class="form-group"><input type="text" id="compTarget" placeholder="'+t('description')+'"></div><div class="form-group"><input type="text" id="compContact" placeholder="@username"></div><button class="btn primary w-full mb-12" id="compSubmitBtn">'+t('send_msg')+'</button>')+'<div id="companionsList"><div class="loader"></div></div>');loadCompanionsFeed();if(!isGuest)$('compSubmitBtn')?.addEventListener('click',async()=>{const tt=$('compTarget').value.trim(),cc=$('compContact').value.trim();if(!tt||!cc)return;await supabaseClient.from('companions').insert({author_id:currentUser.id,author_username:currentUser.username,target:tt,contact:cc,created_at:new Date().toISOString()});playSfx('success');$('compTarget').value='';$('compContact').value='';loadCompanionsFeed()})}
async function loadCompanionsFeed(){const c=$('companionsList');if(!c)return;const r=await withTimeout(supabaseClient.from('companions').select('*').order('created_at',{ascending:false}),5000);if(r.error||!r.data||!r.data.length){c.innerHTML='<div class="empty-state">'+t('empty')+'</div>';return}c.innerHTML=r.data.map(x=>'<div class="card" style="cursor:default;"><div style="font-weight:700;">'+escapeHtml(x.target)+'</div><div style="font-size:.72rem;color:var(--muted);">'+escapeHtml(x.author_username||x.author_id)+' • '+escapeHtml(x.contact)+'</div>'+(currentUser&&!isGuest&&x.author_id===currentUser.id?'<button class="btn danger mt-8" data-del-comp="'+x.id+'" style="min-height:2rem;padding:.3rem .7rem;font-size:.68rem;">🗑</button>':'')+'</div>').join('');c.querySelectorAll('[data-del-comp]').forEach(b=>b.addEventListener('click',async()=>{await supabaseClient.from('companions').delete().eq('id',b.dataset.delComp);loadCompanionsFeed()}))}
function openMusicModal(){
  if(musicAudio){try{musicAudio.pause()}catch(e){}musicAudio=null}
  showModal('<h3 class="modal-title">'+t('music_title')+'</h3>'+
    '<div class="music-player">'+
      '<div class="music-track-info"><div class="music-track-icon">🎵</div><div style="min-width:0;flex:1;"><div class="music-track-name" id="musicTrackName">—</div><div class="music-track-status" id="musicTrackStatus">—</div></div></div>'+
      '<div class="music-progress" id="musicProgressBar"><div class="music-progress-fill" id="musicProgressFill"></div></div>'+
      '<div class="music-controls"><button class="btn primary" id="musicPlayBtn">'+t('play')+'</button><button class="btn secondary" id="musicPauseBtn">'+t('pause')+'</button><button class="btn danger" id="musicStopBtn">'+t('reset')+'</button></div>'+
    '</div>'+
    '<div class="form-group mt-12"><label>'+t('link_track')+'</label><input type="text" id="musicUrl" placeholder="https://..."></div>'+
    '<label class="file-upload-btn" for="musicFile"><span>'+t('upload_file')+'</span><input type="file" id="musicFile" accept="audio/*"></label>');
  const tn=$('musicTrackName'),ts=$('musicTrackStatus'),pf=$('musicProgressFill'),pb=$('musicProgressBar');
  function setTrack(n,s){tn.textContent=n;ts.textContent=s}
  function stopProg(){if(musicProgressInterval){clearInterval(musicProgressInterval);musicProgressInterval=null}}
  function startProg(){stopProg();musicProgressInterval=setInterval(()=>{if(musicAudio&&musicAudio.duration&&isFinite(musicAudio.duration)){const pct=(musicAudio.currentTime/musicAudio.duration)*100;pf.style.width=pct+'%'}},300)}
  function playAudio(url,name,isObjectUrl){if(musicAudio){try{musicAudio.pause()}catch(e){}}if(musicObjectUrl&&musicObjectUrl!==url){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}musicObjectUrl=null}if(isObjectUrl)musicObjectUrl=url;musicAudio=new Audio();musicAudio.preload='auto';musicAudio.src=url;musicAudio.addEventListener('ended',()=>{ts.textContent='—';stopProg();pf.style.width='0%'});musicAudio.addEventListener('play',()=>{ts.textContent='▶'});musicAudio.addEventListener('pause',()=>{if(musicAudio&&!musicAudio.ended)ts.textContent='⏸'});setTrack(name,'...');const promise=musicAudio.play();if(promise&&promise.then)promise.then(()=>{ts.textContent='▶';startProg()}).catch(()=>{ts.textContent='✗'});else{ts.textContent='▶';startProg()}}
  $('musicPlayBtn').addEventListener('click',()=>{const url=$('musicUrl').value.trim();if(url)playAudio(url,url.split('/').pop()||'URL');else if(musicAudio&&musicAudio.src)musicAudio.play().catch(()=>{})});
  $('musicPauseBtn').addEventListener('click',()=>{if(musicAudio)musicAudio.pause()});
  $('musicStopBtn').addEventListener('click',()=>{if(musicAudio){try{musicAudio.pause()}catch(e){}musicAudio=null}if(musicObjectUrl){try{URL.revokeObjectURL(musicObjectUrl)}catch(e){}musicObjectUrl=null}stopProg();pf.style.width='0%';setTrack('—','—');$('musicUrl').value=''});
  pb.addEventListener('click',(e)=>{if(!musicAudio||!musicAudio.duration||!isFinite(musicAudio.duration))return;const rect=pb.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));musicAudio.currentTime=pct*musicAudio.duration});
  $('musicFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>50*1024*1024){showToast(t('error'),'error');return}try{const url=URL.createObjectURL(f);playAudio(url,f.name,true)}catch(err){}})
}
function openChatModal(){const r=showModal('<h3 class="modal-title">'+t('chats')+'</h3><div class="empty-state">'+t('chats_in_tg')+'</div><button class="btn primary w-full mt-12" id="chatTgBtn">'+t('open_tg')+'</button>');$('chatTgBtn').addEventListener('click',()=>{if(tg&&tg.openTelegramLink)tg.openTelegramLink('https://t.me/');else window.open('https://t.me/','_blank');r.closeModal()})}
async function openNotificationsModal(){
  if(isGuest||!currentUser){showToast(t('login_required'),'info');return}
  showModal('<h3 class="modal-title">'+t('notif_title')+'</h3><div id="notificationsList"><div class="loader"></div></div>');
  try{const r=await withTimeout(supabaseClient.from('notifications').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}),5000);const n=r.data||[];const c=$('notificationsList');if(!n.length){c.innerHTML='<div class="empty-state">'+t('no_notifications')+'</div>';return}c.innerHTML=n.map(x=>'<div class="card '+(x.read?'':'inactive-card')+'" style="cursor:default;"><div style="font-weight:600;font-size:.85rem;">'+escapeHtml(x.message)+'</div><div style="font-size:.68rem;color:var(--muted);margin-top:.25rem;">'+new Date(x.created_at).toLocaleString()+'</div></div>').join('');await supabaseClient.from('notifications').update({read:true}).eq('user_id',currentUser.id).eq('read',false);unreadNotifications=0}catch(e){$('notificationsList').innerHTML='<div class="empty-state">'+t('error')+'</div>'}

function openSearchModal(){openSearchModalWithQuery('')}
async function openSearchModalWithQuery(initial){
  const ref=showModal('<h3 class="modal-title">🔍 '+t('search')+'</h3><div class="form-group"><div class="input-with-voice"><input type="text" id="searchInput" placeholder="'+t('search')+'" value="'+escapeHtml(initial)+'"><button class="voice-input-btn" data-target="searchInput" type="button">🎤</button></div></div><div class="flex-between gap-8 mb-12"><button class="btn primary w-full" id="searchItemBtn">📦</button><button class="btn secondary w-full" id="searchProfileBtn">👤</button></div><div id="searchSuggestions"></div><div id="searchHistory"></div><div id="searchResults"></div>');
  const input=$('searchInput');setTimeout(()=>input.focus(),150);
  const sugg=$('searchSuggestions'),res=$('searchResults'),hist=$('searchHistory');
  function renderHist(){if(!searchHistory.length){hist.innerHTML='';return}hist.innerHTML=searchHistory.map(h=>'<span class="badge" style="cursor:pointer;margin:.12rem;" data-hist="'+escapeHtml(h)+'">'+escapeHtml(h)+'</span>').join('');hist.querySelectorAll('[data-hist]').forEach(el=>el.addEventListener('click',()=>{input.value=el.dataset.hist;input.dispatchEvent(new Event('input'))}))}
  renderHist();
  async function doSearch(q){if(!q)return[];try{const r=await withTimeout(supabaseClient.from('ads').select('*').eq('status','approved').eq('hidden',false),5000);if(r.error||!r.data)return[];return r.data.filter(ad=>smartMatch(q,ad.item_name||'')||smartMatch(q,ad.description||''))}catch(e){return[]}}
  input.addEventListener('input',async()=>{const q=input.value.trim().toLowerCase();if(!q){sugg.innerHTML='';res.innerHTML='';return}const fixed=findSuggestions(q);const items=await doSearch(q);const top=items.slice(0,5);let hint=fixed&&fixed!==q?'<div class="search-hint">💡 '+escapeHtml(fixed)+'</div>':'';sugg.innerHTML=hint+top.map(ad=>'<div class="search-suggestion" data-sug="'+ad.id+'">📦 '+escapeHtml(ad.item_name)+' • '+formatPrice(ad.price)+'</div>').join('');sugg.querySelectorAll('[data-sug]').forEach(el=>el.addEventListener('click',()=>{const ad=items.find(a=>a.id==el.dataset.sug);if(ad){if(currentUser&&!isGuest)saveSearchQuery(q);ref.closeModal();openAdDetail(ad)}}))});
  $('searchItemBtn').addEventListener('click',async()=>{const q=input.value.trim().toLowerCase();if(!q)return;if(currentUser&&!isGuest)saveSearchQuery(q);const items=await doSearch(q);if(!items.length){res.innerHTML='<div class="empty-state">'+t('found_nothing')+'</div>';return}res.innerHTML=items.map(ad=>'<div class="card" data-res-id="'+ad.id+'" style="padding:.65rem;"><div style="font-weight:700;">'+escapeHtml(ad.item_name)+'</div><div style="font-size:.72rem;color:var(--muted);">'+ad.server+' • '+formatPrice(ad.price)+'</div></div>').join('');res.querySelectorAll('[data-res-id]').forEach(card=>card.addEventListener('click',()=>{const ad=items.find(a=>a.id==card.dataset.resId);if(ad){ref.closeModal();openAdDetail(ad)}}))});
  $('searchProfileBtn').addEventListener('click',()=>{const q=input.value.trim();if(q){ref.closeModal();openProfileModal(q)}});
  if(initial){input.dispatchEvent(new Event('input'));setTimeout(()=>$('searchItemBtn').click(),300)}
}

/* ============================================================
   BOOT
   ============================================================ */
function detectDesktop(){const ua=navigator.userAgent.toLowerCase();const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0);const isMobile=/android|iphone|ipad|ipod|mobile|webos|blackberry|opera mini|iemobile/i.test(ua);isDesktop=!isTouch&&!isMobile}
function bootApp(){
  detectDesktop();loadShortcuts();bindGlobalHandlers();
  const tgUser=initTelegram();const supOk=initSupabase();
  if(!supOk){setTimeout(()=>{hideSplash();document.body.innerHTML='<div style="text-align:center;margin-top:50vh;padding:2rem;color:#EF4444;font-family:sans-serif;">'+t('error_connection')+'</div>'},SPLASH_DURATION);return}
  setTimeout(async()=>{
    hideSplash();
    checkURLForAd();
    const saved=localStorage.getItem('arizona_current_user');
    if(!saved){showAuthScreen(tgUser||'');return}
    try{
      currentUser=JSON.parse(saved);
      const r=await supabaseClient.from('app_users').select('*').eq('id',currentUser.id).maybeSingle();
      if(r.error||!r.data||r.data.banned){if(r.data&&r.data.banned){showBanScreen();return}localStorage.removeItem('arizona_current_user');currentUser=null;showAuthScreen(tgUser||'');return}
      currentUser=r.data;addAccountToStorage(currentUser);showApp();
      try{initApp()}catch(e){warn('init',e)}
    }catch(e){warn('boot',e);localStorage.removeItem('arizona_current_user');currentUser=null;showAuthScreen(tgUser||'')}
  },SPLASH_DURATION)
}
document.addEventListener('click',e=>{
  const tt=e.target.closest('.btn,.nav-item,.card,.grid-tile,.link-item,.search-suggestion,.theme-toggle,.header-logo,.header-search,.modal-close,.auth-theme-toggle,.star-rating span,.auth-tab,.back-to-top,.fav-heart,.file-upload-btn,.account-row,.auth-guest-btn,.empty-cta,.shortcut-key,.voice-input-btn,.voice-btn,.admin-del-btn');
  if(tt){playSfx('click');haptic('light')}
},{passive:true});
document.addEventListener('touchmove',e=>{if(document.querySelector('.modal-overlay.show')&&!e.target.closest('.modal'))e.preventDefault()},{passive:false});
window.addEventListener('DOMContentLoaded',bootApp);

})();
