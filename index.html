<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Arizona Online × Bounty Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ============================================================
           AURORA × SUNSET — OPTIMIZED
           ============================================================ */

        :root {
            --bg:              #0F0A1E;
            --bg-2:            #150F28;
            --card:            #1A1230;
            --card-2:          #221844;
            --border:          rgba(255,255,255,.08);
            --border-strong:   rgba(255,255,255,.16);

            --text:            #F5F1FA;
            --text-soft:       #D4CCE8;
            --muted:           #8A7FA8;
            --muted-2:         #5A517A;

            --accent:          #8B5CF6;
            --accent-2:        #22D3EE;
            --accent-3:        #EC4899;
            --accent-soft:     rgba(139,92,246,.18);
            --accent-glow:     rgba(139,92,246,.35);

            --success:         #22C55E;
            --success-soft:    rgba(34,197,94,.15);
            --danger:          #EF4444;
            --danger-soft:     rgba(239,68,68,.18);
            --warning:         #F59E0B;
            --warning-soft:    rgba(245,158,11,.15);
            --info:            #3B82F6;
            --info-soft:       rgba(59,130,246,.15);
            --cyan-soft:       rgba(34,211,238,.15);
            --pink-soft:       rgba(236,72,153,.15);

            --grad-aurora:     linear-gradient(135deg, #8B5CF6 0%, #22D3EE 100%);
            --grad-sunset:     linear-gradient(135deg, #F97316 0%, #EC4899 50%, #8B5CF6 100%);
            --grad-mix:        linear-gradient(135deg, #8B5CF6 0%, #EC4899 50%, #F97316 100%);
            --grad-flow:       linear-gradient(90deg, #8B5CF6, #22D3EE, #EC4899, #F97316, #8B5CF6);

            --glass:           rgba(26,18,48,.85);
            --glass-2:         rgba(255,255,255,.04);

            --shadow-sm:       0 1px 2px rgba(0,0,0,.4);
            --shadow:          0 2px 8px rgba(0,0,0,.35);
            --shadow-md:       0 4px 16px rgba(0,0,0,.4);
            --shadow-lg:       0 12px 40px rgba(0,0,0,.5);

            --radius:          16px;
            --radius-sm:       10px;
            --radius-xs:       6px;
            --radius-pill:     999px;

            --btn-min-height:  46px;
            --header-height:   60px;
            --nav-height:      64px;

            --font-body:       'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono:       'Space Grotesk', monospace;
        }

        [data-theme="light"] {
            --bg:              #FFF8F5;
            --bg-2:            #FDF2F8;
            --card:            #FFFFFF;
            --card-2:          #FEF8FE;
            --border:          rgba(15,10,30,.08);
            --border-strong:   rgba(15,10,30,.16);

            --text:            #1A0F2E;
            --text-soft:       #3D2E5C;
            --muted:           #7A6B94;
            --muted-2:         #B0A2C9;

            --accent:          #7C3AED;
            --accent-2:        #0891B2;
            --accent-3:        #DB2777;
            --accent-soft:     rgba(124,58,237,.10);
            --accent-glow:     rgba(124,58,237,.25);

            --success:         #16A34A;
            --success-soft:    rgba(22,163,74,.12);
            --danger:          #DC2626;
            --danger-soft:     rgba(220,38,38,.12);
            --warning:         #D97706;
            --warning-soft:    rgba(217,119,6,.12);
            --info:            #2563EB;
            --info-soft:       rgba(37,99,235,.12);
            --cyan-soft:       rgba(8,145,178,.10);
            --pink-soft:       rgba(219,39,119,.10);

            --grad-aurora:     linear-gradient(135deg, #7C3AED 0%, #0891B2 100%);
            --grad-sunset:     linear-gradient(135deg, #EA580C 0%, #DB2777 50%, #7C3AED 100%);
            --grad-mix:        linear-gradient(135deg, #7C3AED 0%, #DB2777 50%, #EA580C 100%);
            --grad-flow:       linear-gradient(90deg, #7C3AED, #0891B2, #DB2777, #EA580C, #7C3AED);

            --glass:           rgba(255,255,255,.9);
            --glass-2:         rgba(15,10,30,.03);

            --shadow-sm:       0 1px 2px rgba(15,10,30,.05);
            --shadow:          0 2px 8px rgba(15,10,30,.06);
            --shadow-md:       0 4px 16px rgba(15,10,30,.08);
            --shadow-lg:       0 12px 40px rgba(15,10,30,.12);
        }

        /* ============================================================
           БАЗА — ОПТИМИЗИРОВАННАЯ
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-body);
        }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s ease, color .3s ease;
            overflow-x: hidden;
            touch-action: manipulation;
            font-size: 15px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        button, input, textarea, select {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
        }
        a { color: var(--accent); text-decoration: none; }
        img { max-width: 100%; display: block; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 6px;
        }
        ::selection { background: var(--accent-soft); color: var(--accent); }

        /* ============================================================
           ГРАДИЕНТНЫЙ БРЕНДИНГ (лёгкий — только на тексте)
           ============================================================ */
        @keyframes brand-shift {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .brand-animated {
            background: var(--grad-flow);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: brand-shift 5s linear infinite;
        }
        .brand-team-animated {
            background: var(--grad-flow);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: brand-shift 6s linear infinite reverse;
        }

        /* ============================================================
           SPLASH (старая анимация zoom)
           ============================================================ */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .7rem;
            transition: opacity .4s ease, visibility .4s ease;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px var(--accent-glow), 0 0 0 2px var(--border-strong);
            animation: splash-zoom 1.2s ease-out;
        }
        .splash-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .splash-title {
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: -.02em;
            margin-top: .4rem;
        }
        .splash-subtitle {
            font-family: var(--font-mono);
            font-size: .82rem;
            color: var(--muted);
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        @keyframes splash-zoom {
            0%   { transform: scale(.3); opacity: 0; }
            60%  { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ============================================================
           LOADER OVERLAY — для загрузки/проблем
           ============================================================ */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }
        .loader-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .loader-spinner-big {
            width: 54px;
            height: 54px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-right: 3px solid var(--accent-2);
            border-radius: 50%;
            animation: spin .9s linear infinite;
        }
        .loader-overlay-text {
            color: #fff;
            font-size: .88rem;
            font-weight: 600;
            letter-spacing: .05em;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader {
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-right: 2px solid var(--accent-2);
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin .9s linear infinite;
            margin: 20px auto;
        }

        /* ============================================================
           TOP PROGRESS
           ============================================================ */
        .top-progress {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--grad-aurora);
            z-index: 9997;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .25s ease, opacity .25s ease;
            opacity: 0;
        }
        .top-progress.active {
            transform: scaleX(1);
            opacity: 1;
        }

        /* ============================================================
           OFFLINE BANNER
           ============================================================ */
        .offline-banner {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 6px 12px;
            padding-top: calc(6px + env(safe-area-inset-top));
            background: var(--danger);
            color: #fff;
            font-size: .75rem;
            font-weight: 600;
            text-align: center;
            z-index: 9998;
            transform: translateY(-100%);
            transition: transform .25s ease;
        }
        .offline-banner.visible { transform: translateY(0); }

        /* ============================================================
           BACK TO TOP
           ============================================================ */
        .back-to-top {
            position: fixed;
            bottom: calc(var(--nav-height) + 14px + env(safe-area-inset-bottom));
            right: 14px;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--grad-aurora);
            color: #fff;
            border: none;
            box-shadow: 0 4px 16px var(--accent-glow);
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: opacity .25s ease, visibility .25s ease, transform .25s ease;
        }
        .back-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .back-to-top:active { transform: scale(.92); }

        /* ============================================================
           КОНТЕЙНЕР — АДАПТИВНЫЙ
           ============================================================ */
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: .85rem;
            padding-top: calc(var(--header-height) + .85rem);
            padding-bottom: calc(var(--nav-height) + 1.5rem + env(safe-area-inset-bottom));
        }
        @media (min-width: 640px) {
            .container { max-width: 640px; padding: 1rem; padding-top: calc(var(--header-height) + 1rem); }
        }
        @media (min-width: 900px) {
            .container { max-width: 900px; }
            .ads-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .ads-grid .card { margin-bottom: 0; }
        }
        @media (min-width: 1200px) {
            .container { max-width: 1200px; }
            .ads-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1500px) {
            .container { max-width: 1440px; }
            .ads-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ============================================================
           ХЕДЕР — БЕЗ BLUR ДЛЯ ПРОИЗВОДИТЕЛЬНОСТИ
           ============================================================ */
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: .5rem .85rem;
            padding-top: calc(.5rem + env(safe-area-inset-top));
            height: calc(var(--header-height) + env(safe-area-inset-top));
            gap: .6rem;
        }
        .header-logo {
            width: 38px; height: 38px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            border: 1.5px solid var(--accent);
            transition: transform .2s ease;
        }
        .header-logo:active { transform: scale(.92); }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        .header-brand {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-shrink: 0;
            cursor: pointer;
            min-width: 0;
        }
        .header-brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .header-title {
            font-weight: 800;
            font-size: .95rem;
            letter-spacing: -.02em;
            line-height: 1.15;
        }
        .header-team {
            margin-top: 3px;
            font-family: var(--font-mono);
            font-size: .6rem;
            font-weight: 700;
            letter-spacing: .1em;
            line-height: 1;
            white-space: nowrap;
        }
        @media (max-width: 400px) {
            .header-logo { width: 34px; height: 34px; }
            .header-title { font-size: .85rem; }
            .header-team { font-size: .55rem; }
        }
        .header-search { flex: 1; cursor: pointer; min-width: 0; }
        .header-search input {
            width: 100%;
            padding: .55rem .9rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            font-size: .82rem;
            outline: none;
            pointer-events: none;
        }
        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            font-size: .95rem;
            cursor: pointer;
            transition: all .15s ease;
            flex-shrink: 0;
            color: var(--text);
        }
        .theme-toggle:active { transform: scale(.92); }

        /* ============================================================
           НИЖНЯЯ НАВИГАЦИЯ
           ============================================================ */
        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--nav-height);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: .62rem;
            font-weight: 600;
            cursor: pointer;
            padding: .25rem .3rem;
            border-radius: 10px;
            flex: 1;
            max-width: 78px;
            min-height: 46px;
            transition: color .15s ease, background .15s ease;
            position: relative;
            letter-spacing: .02em;
        }
        .nav-item .nav-icon {
            font-size: 1.15rem;
            transition: transform .15s ease;
        }
        .nav-item.active {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .nav-item.active .nav-icon { transform: scale(1.08); }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            border-radius: 0 0 2px 2px;
            background: var(--accent);
        }

        /* ============================================================
           СЕКЦИИ
           ============================================================ */
        .section { display: none; }
        .section.active { display: block; }
        .section h2 {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -.03em;
            margin-bottom: .9rem;
            color: var(--text);
        }
        .section h3 {
            font-size: 1rem;
            font-weight: 700;
            margin: 1.2rem 0 .6rem;
            color: var(--text);
        }

        /* ============================================================
           КАРТОЧКИ — 4 РАЗНЫХ АНИМАЦИИ
           ============================================================ */
        @keyframes cardSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardSlideLeft {
            from { opacity: 0; transform: translateX(-14px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes cardScaleIn {
            from { opacity: 0; transform: scale(.94); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes cardBlurIn {
            from { opacity: 0; filter: blur(6px); }
            to   { opacity: 1; filter: blur(0); }
        }
        .card { opacity: 1; }
        .card.anim-0 { animation: cardSlideUp .4s ease backwards; }
        .card.anim-1 { animation: cardSlideLeft .4s ease backwards; }
        .card.anim-2 { animation: cardScaleIn .4s ease backwards; }
        .card.anim-3 { animation: cardBlurIn .4s ease backwards; }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: .9rem;
            margin-bottom: .75rem;
            cursor: pointer;
            transition: transform .12s ease, border-color .15s ease;
            position: relative;
        }
        .card:hover { border-color: var(--border-strong); }
        .card:active { transform: scale(.99); }
        .card.inactive-card { opacity: .55; }
        .card.viewed { opacity: .75; }
        .card.viewed .ad-card-title { color: var(--muted); }

        /* ============================================================
           AD-CARD
           ============================================================ */
        .ad-card {
            display: flex;
            gap: .75rem;
            align-items: flex-start;
            position: relative;
        }
        .ad-card-info { flex: 1; min-width: 0; }
        .ad-card-title {
            font-weight: 700;
            font-size: .95rem;
            margin-bottom: .15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -.01em;
            color: var(--text);
            padding-right: 30px;
        }
        .ad-card-price {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.15rem;
            background: var(--grad-mix);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -.02em;
            line-height: 1.15;
        }
        .ad-card-badges {
            display: flex;
            gap: .25rem;
            flex-wrap: wrap;
            margin: .35rem 0 .25rem;
        }
        .ad-card-author {
            font-size: .7rem;
            color: var(--muted);
            margin-top: .2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: .3rem;
            flex-wrap: wrap;
        }
        .ad-card-rating {
            display: inline-flex;
            align-items: center;
            gap: .1rem;
            font-size: .66rem;
            color: var(--warning);
            font-weight: 700;
        }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
            background: var(--grad-aurora);
            border-radius: 50%;
            color: #fff;
            font-size: .5rem;
            font-weight: 900;
        }
        .fav-heart {
            position: absolute;
            top: 0;
            right: 0;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: var(--glass-2);
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .85rem;
            cursor: pointer;
            transition: all .15s ease;
            z-index: 2;
        }
        .fav-heart.active {
            background: var(--pink-soft);
            color: var(--accent-3);
            border-color: var(--accent-3);
        }

        /* ============================================================
           БЕЙДЖИ
           ============================================================ */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: .18rem .55rem;
            border-radius: 6px;
            font-size: .62rem;
            font-weight: 700;
            background: var(--glass-2);
            color: var(--text-soft);
            white-space: nowrap;
            letter-spacing: .03em;
            line-height: 1.3;
            text-transform: uppercase;
            border: 1px solid var(--border);
        }
        .badge.sell { background: var(--success-soft); color: var(--success); border-color: transparent; }
        .badge.buy { background: var(--info-soft); color: var(--info); border-color: transparent; }
        .badge.server { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
        .badge.category { background: var(--cyan-soft); color: var(--accent-2); border-color: transparent; }
        .badge.status-pending { background: var(--warning-soft); color: var(--warning); border-color: transparent; }
        .badge.status-deleted { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
        .badge.status-approved { background: var(--success-soft); color: var(--success); border-color: transparent; }

        /* ============================================================
           КНОПКИ
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            padding: .7rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-weight: 700;
            font-size: .82rem;
            cursor: pointer;
            min-height: var(--btn-min-height);
            transition: transform .12s ease, background .15s ease, border-color .15s ease;
            letter-spacing: .01em;
        }
        .btn:active { transform: scale(.97); }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn.primary {
            background: var(--grad-aurora);
            color: #fff;
            border-color: transparent;
        }
        .btn.primary:hover { filter: brightness(1.08); }
        .btn.secondary {
            background: var(--glass-2);
            color: var(--text);
            border-color: var(--border);
        }
        .btn.secondary:hover { border-color: var(--accent); color: var(--accent); }
        .btn.danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn.danger:hover { background: var(--danger); color: #fff; }
        .btn.gold {
            background: var(--grad-sunset);
            color: #fff;
            border-color: transparent;
        }
        .btn.success {
            background: transparent;
            color: var(--success);
            border-color: var(--success);
        }
        .btn.success:hover { background: var(--success); color: #fff; }
        .btn.w-full { width: 100%; }

        /* ============================================================
           МОДАЛКИ — БЕЗ БАГОВ И ЛАГОВ
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.65);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity .18s ease;
            overscroll-behavior: contain;
        }
        .modal-overlay.show { opacity: 1; }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.4rem;
            position: relative;
            transform: translateY(12px);
            transition: transform .2s ease;
            -webkit-overflow-scrolling: touch;
        }
        .modal-overlay.show .modal { transform: translateY(0); }
        .modal-close {
            position: absolute;
            top: .7rem; right: .7rem;
            background: var(--glass-2);
            border: 1px solid var(--border);
            width: 30px; height: 30px;
            border-radius: 8px;
            font-size: .9rem;
            cursor: pointer;
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            transition: background .15s ease;
            z-index: 2;
        }
        .modal-close:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .modal-title {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -.02em;
            margin-bottom: .9rem;
            padding-right: 2.2rem;
            color: var(--text);
        }

        /* ============================================================
           ФОРМЫ
           ============================================================ */
        .form-group { margin-bottom: .85rem; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: .7rem;
            margin-bottom: .35rem;
            color: var(--muted);
            letter-spacing: .05em;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: .7rem .9rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card-2);
            color: var(--text);
            font-size: .88rem;
            outline: none;
            transition: border-color .15s ease;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder { color: var(--muted-2); }
        .form-group textarea {
            min-height: 90px;
            resize: vertical;
            font-family: inherit;
        }

        /* ============================================================
           АВТОРИЗАЦИЯ
           ============================================================ */
        .auth-container {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: var(--bg);
            overflow-y: auto;
        }
        .auth-background {
            position: absolute;
            inset: 0;
            background-position: center;
            background-size: cover;
            z-index: -1;
            filter: brightness(.35) saturate(.7);
        }
        .auth-background::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(800px 500px at 50% 30%, var(--accent-soft), transparent 70%),
                linear-gradient(135deg, rgba(15,10,30,.85), rgba(15,10,30,.95));
        }
        [data-theme="light"] .auth-background::after {
            background:
                radial-gradient(800px 500px at 50% 30%, var(--accent-soft), transparent 70%),
                linear-gradient(135deg, rgba(255,248,245,.85), rgba(253,242,248,.95));
        }
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 1.8rem 1.6rem;
            position: relative;
            z-index: 1;
            margin: auto;
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .7rem;
            margin-bottom: 1.4rem;
        }
        .auth-logo {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid transparent;
            background-image: linear-gradient(var(--card), var(--card)), var(--grad-aurora);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            padding: 2px;
            flex-shrink: 0;
        }
        .auth-brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .auth-title {
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: -.03em;
            line-height: 1.1;
        }
        .auth-team {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: .72rem;
            letter-spacing: .14em;
            margin-top: 4px;
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 1.2rem;
            background: var(--glass-2);
            border-radius: 10px;
            padding: 3px;
        }
        .auth-tab {
            flex: 1;
            padding: .6rem .4rem;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-size: .8rem;
            transition: color .15s ease, background .15s ease;
            color: var(--muted);
            letter-spacing: .03em;
            border-radius: 8px;
        }
        .auth-tab.active {
            color: #fff;
            background: var(--grad-aurora);
        }
        .auth-theme-toggle {
            position: absolute;
            top: .8rem; right: .8rem;
            background: var(--glass-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 34px; height: 34px;
            font-size: .95rem;
            cursor: pointer;
            z-index: 2;
            display: flex; align-items: center; justify-content: center;
            color: var(--text);
            transition: border-color .15s ease;
        }
        .auth-theme-toggle:hover { border-color: var(--accent); }
        .auth-error {
            color: var(--danger);
            font-size: .75rem;
            margin-top: .5rem;
            text-align: center;
            min-height: .9rem;
        }
        .auth-hint {
            color: var(--muted);
            font-size: .7rem;
            margin-top: .4rem;
            text-align: center;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            top: calc(72px + env(safe-area-inset-top));
            right: .85rem;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: .4rem;
            max-width: 300px;
            pointer-events: none;
        }
        .toast {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: .75rem 1rem;
            font-size: .78rem;
            font-weight: 500;
            animation: toastIn .25s ease;
            transition: opacity .25s, transform .25s;
            pointer-events: auto;
        }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error   { border-left: 3px solid var(--danger); }
        .toast.info    { border-left: 3px solid var(--accent); }
        @keyframes toastIn {
            from { transform: translateX(120%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           SKELETON
           ============================================================ */
        .skeleton {
            background: linear-gradient(90deg, var(--border) 25%, var(--card-2) 50%, var(--border) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.4s infinite;
            border-radius: var(--radius-sm);
        }
        @keyframes skeleton-loading {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-card {
            display: flex;
            gap: .75rem;
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: .9rem;
            margin-bottom: .75rem;
        }
        .skeleton-img {
            width: 80px; height: 100px;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .skeleton-info { flex: 1; display: flex; flex-direction: column; gap: .45rem; }
        .skeleton-line { height: 12px; border-radius: 6px; }
        .skeleton-line.short { width: 40%; }
        .skeleton-line.medium { width: 65%; }
        .skeleton-line.price { height: 20px; width: 50%; }
        .skeleton-line.badge { height: 16px; width: 30%; border-radius: 5px; }

        /* ============================================================
           GRID TILES
           ============================================================ */
        .grid-tiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: .6rem;
        }
        .grid-tile {
            padding: .9rem .8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--card);
            text-align: center;
            cursor: pointer;
            font-weight: 700;
            font-size: .78rem;
            transition: all .15s ease;
            color: var(--text-soft);
        }
        .grid-tile:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .grid-tile:active { transform: scale(.96); }
        .grid-tile.active {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }
        .grid-tile .tile-icon {
            font-size: 1.6rem;
            display: block;
            margin-bottom: .4rem;
        }

        /* ============================================================
           LINKS LIST
           ============================================================ */
        .links-list { display: flex; flex-direction: column; gap: .5rem; }
        .link-item {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .75rem .9rem;
            background: var(--glass-2);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all .15s ease;
        }
        .link-item:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .link-item .link-icon {
            font-size: 1.2rem;
            width: 2rem;
            text-align: center;
        }
        .link-item .link-label {
            flex: 1;
            font-weight: 600;
            font-size: .85rem;
            color: var(--text);
        }

        /* ============================================================
           GALLERY
           ============================================================ */
        .img-container { position: relative; overflow: hidden; border-radius: 10px; }
        .img-container img { opacity: 0; transition: opacity .25s ease; }
        .img-container img.loaded { opacity: 1; }
        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: .35rem;
            margin: .5rem 0;
        }
        .image-gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        .search-suggestion {
            padding: .6rem .8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: .82rem;
            transition: background .12s ease;
            color: var(--text-soft);
        }
        .search-suggestion:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        /* ============================================================
           PROGRESS / COUNTDOWN
           ============================================================ */
        .countdown-timer {
            font-family: var(--font-mono);
            font-size: .68rem;
            color: var(--accent);
            margin-top: .25rem;
            font-weight: 600;
            letter-spacing: .03em;
        }
        .progress-bar {
            height: 4px;
            background: var(--glass-2);
            border-radius: 2px;
            overflow: hidden;
            margin: .3rem 0;
        }
        .progress-fill {
            height: 100%;
            background: var(--grad-aurora);
            border-radius: 2px;
            transition: width .3s ease;
        }

        /* ============================================================
           ОТЗЫВЫ
           ============================================================ */
        .review-item {
            border-bottom: 1px solid var(--border);
            padding: .75rem 0;
        }
        .review-item:last-child { border-bottom: none; }
        .star-rating {
            display: flex;
            gap: .35rem;
            font-size: 1.8rem;
            cursor: pointer;
            user-select: none;
            justify-content: center;
            padding: .4rem 0;
        }
        .star-rating span {
            color: var(--muted-2);
            transition: color .15s ease;
        }
        .star-rating span.active { color: var(--accent); }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 1.8rem 1rem;
            color: var(--muted);
            font-size: .85rem;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            background: var(--glass-2);
        }

        /* ============================================================
           BAN SCREEN
           ============================================================ */
        .ban-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 1rem;
            text-align: center;
            padding: 2rem;
            background: var(--bg);
        }
        .ban-screen h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--danger);
        }
        .ban-screen p { color: var(--muted); }
        .ban-screen a { color: var(--accent); text-decoration: underline; }
        .ban-brand {
            font-family: var(--font-mono);
            font-size: .78rem;
            letter-spacing: .1em;
            margin-top: .5rem;
        }

        /* ============================================================
           MUSIC PLAYER
           ============================================================ */
        .music-player {
            background: var(--glass-2);
            border-radius: var(--radius-sm);
            padding: .9rem;
            margin-top: .5rem;
        }
        .music-track-info {
            display: flex;
            align-items: center;
            gap: .7rem;
            margin-bottom: .7rem;
        }
        .music-track-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--grad-aurora);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .music-track-name {
            font-size: .82rem;
            font-weight: 600;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .music-track-status {
            font-size: .68rem;
            color: var(--muted);
            margin-top: .15rem;
        }
        .music-controls {
            display: flex;
            gap: .5rem;
        }
        .music-controls .btn {
            flex: 1;
            min-height: 40px;
            padding: .5rem;
            font-size: .75rem;
        }
        .music-progress {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin: .7rem 0;
            overflow: hidden;
        }
        .music-progress-fill {
            height: 100%;
            background: var(--grad-aurora);
            width: 0%;
            transition: width .2s linear;
        }
        .file-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            padding: .65rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px dashed var(--border-strong);
            background: var(--glass-2);
            color: var(--text);
            font-weight: 600;
            font-size: .78rem;
            cursor: pointer;
            width: 100%;
            min-height: 42px;
            transition: all .15s ease;
        }
        .file-upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .file-upload-btn input { display: none; }

        /* ============================================================
           UTIL
           ============================================================ */
        .hidden { display: none !important; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
        .mt-8  { margin-top: .5rem; }
        .mt-12 { margin-top: .75rem; }
        .mb-8  { margin-bottom: .5rem; }
        .mb-12 { margin-bottom: .75rem; }
        .w-full { width: 100%; }
        .gap-8  { gap: .5rem; }
        .gap-12 { gap: .75rem; }
        .text-center { text-align: center; }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
            margin: .7rem 0;
            color: var(--muted-2);
            font-size: .75rem;
            letter-spacing: .35em;
        }
        .ornament::before,
        .ornament::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
        }

        .brand-footer {
            text-align: center;
            padding: 1.2rem 1rem .8rem;
            font-family: var(--font-mono);
            font-size: .72rem;
            letter-spacing: .09em;
        }
    </style>
</head>
<body>

    <!-- SPLASH -->
    <div id="splash-screen">
        <div class="splash-icon">
            <img src="https://i.postimg.cc/mgk2RL4g/1788361335674.jpg" alt="Arizona Online">
        </div>
        <div class="splash-title brand-animated">Arizona Online</div>
        <div class="splash-subtitle brand-team-animated">× Bounty Team</div>
    </div>

    <!-- LOADER -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-spinner-big"></div>
        <div class="loader-overlay-text" id="loaderOverlayText">Загрузка...</div>
    </div>

    <!-- TOP PROGRESS -->
    <div class="top-progress" id="topProgress"></div>

    <!-- OFFLINE BANNER -->
    <div class="offline-banner" id="offlineBanner">📶 Нет подключения к интернету</div>

    <!-- HEADER -->
    <header class="header" id="appHeader" style="display:none;">
        <div class="header-logo" id="logoBtn" role="button" aria-label="Сообщества">
            <img id="headerLogoImg" src="https://i.postimg.cc/nV1HDjcb/1788346659518.jpg" alt="Logo">
        </div>
        <div class="header-brand" id="headerBrand">
            <div class="header-brand-text">
                <div class="header-title brand-animated">Arizona Online</div>
                <div class="header-team brand-team-animated">× Bounty Team</div>
            </div>
        </div>
        <div class="header-search" id="headerSearchTrigger">
            <input type="text" placeholder="🔍 Поиск" readonly>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" aria-label="Переключить тему">🌓</button>
    </header>

    <!-- MAIN -->
    <main class="container" id="mainContainer" style="display:none;">
        <section class="section active" id="section-home">
            <div id="serverSelector">
                <button class="btn secondary w-full" id="serverSelectBtn">🌐 Все сервера</button>
            </div>
            <div class="ads-grid mt-12" id="homeFeed"></div>
            <div id="loadMoreTrigger"></div>
        </section>

        <section class="section" id="section-cart">
            <h2>🛒 Корзина</h2>
            <div id="cartList"></div>
        </section>

        <section class="section" id="section-send">
            <h2>➕ Отправка объявления</h2>
            <div class="card" style="cursor:default;">
                <div class="form-group">
                    <label>Тип сделки</label>
                    <button class="btn secondary w-full" id="sendTypeBtn" type="button">Продажа</button>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <button class="btn secondary w-full" id="sendCategoryBtn" type="button">Выберите категорию</button>
                </div>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="sendName" placeholder="Введите название" maxlength="80">
                </div>
                <div class="form-group">
                    <label>Цена</label>
                    <input type="text" id="sendPrice" placeholder="Например: 5к или 1000000">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="sendDescription" placeholder="Подробное описание" maxlength="800"></textarea>
                </div>
                <div class="form-group">
                    <label>Скриншоты (через запятую)</label>
                    <input type="text" id="sendImages" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Сервер</label>
                    <button class="btn secondary w-full" id="sendServerBtn" type="button">Выберите сервер</button>
                </div>
                <button class="btn primary w-full" id="sendSubmitBtn" type="button">Отправить объявление</button>
            </div>
        </section>

        <section class="section" id="section-admin">
            <h2>🛡️ Админ-панель</h2>
            <div id="adminPanelContent"></div>
        </section>

        <section class="section" id="section-all">
            <h2>☰ Все разделы</h2>
            <div class="grid-tiles" id="allTiles"></div>
            <h3>📦 Мои объявления</h3>
            <div id="myAdsList"></div>
            <div class="brand-footer"><span class="brand-animated">Arizona Online</span> <span class="brand-team-animated">× Bounty Team</span></div>
        </section>
    </main>

    <!-- BACK TO TOP -->
    <button class="back-to-top" id="backToTop" aria-label="Наверх">↑</button>

    <!-- NAV -->
    <nav class="nav-bar" id="navBar" style="display:none;">
        <button class="nav-item active" data-section="home" aria-label="Главная"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" data-section="cart" aria-label="Корзина"><span class="nav-icon">🛒</span><span>Корзина</span></button>
        <button class="nav-item" data-section="send" aria-label="Отправка"><span class="nav-icon">➕</span><span>Отправка</span></button>
        <button class="nav-item hidden" id="adminNavBtn" data-section="admin" aria-label="Админ"><span class="nav-icon">🛡️</span><span>Админ</span></button>
        <button class="nav-item" data-section="all" aria-label="Все"><span class="nav-icon">☰</span><span>Все</span></button>
    </nav>

            osc.connect(gain);

            const freqs = { click: 800, success: 1200, error: 300, buy: 1000, splash: 600 };
            osc.frequency.value = freqs[type] || 600;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);

    /* ---------- SHA-256 ---------- */
    const SALT = 'ArizonaOnlineSalt_2024';
    function sha256Fallback(ascii) {
        function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
        const mathPow = Math.pow;
        const maxWord = mathPow(2, 32);
        let result = '';
        const words = [];
        const asciiBitLength = ascii.length * 8;
        let hash = sha256Fallback.h = sha256Fallback.h || [];
        const k = sha256Fallback.k = sha256Fallback.k || [];
        let primeCounter = k.length;
        const isComposite = {};
        for (let candidate = 2; primeCounter < 64; candidate++) {
            if (!isComposite[candidate]) {
                for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
                k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
            }
        }
        ascii += '\x80';
        while (ascii.length % 64 - 56) ascii += '\x00';
        for (let i = 0; i < ascii.length; i++) {
            const j = ascii.charCodeAt(i);
            if (j >> 8) return '';
            words[i >> 2] |= j << ((3 - i) % 4) * 8;
        }
        words[words.length] = (asciiBitLength / maxWord) | 0;
        words[words.length] = asciiBitLength;
        for (let j = 0; j < words.length;) {
            const w = words.slice(j, j += 16);
            const oldHash = hash;
            hash = hash.slice(0, 8);
            for (let i = 0; i < 64; i++) {
                const w15 = w[i - 15], w2 = w[i - 2];
                const a = hash[0], e = hash[4];
                const temp1 = hash[7]
                    + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                    + ((e & hash[5]) ^ ((~e) & hash[6]))
                    + k[i]
                    + (w[i] = (i < 16) ? w[i] : (
                        w[i - 16]
                        + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                        + w[i - 7]
                        + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                    ) | 0);
                const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                    + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                hash = [(temp1 + temp2) | 0].concat(hash);
                hash[4] = (hash[4] + temp1) | 0;
            }
            for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
        }
        for (let i = 0; i < 8; i++) {
            for (let j = 3; j + 1; j--) {
                const b = (hash[i] >> (j * 8)) & 255;
                result += ((b < 16) ? 0 : '') + b.toString(16);
            }
        }
        return result;
    }
    async function hashPassword(password) {
        const data = SALT + password;
        if (window.crypto && window.crypto.subtle && typeof window.crypto.subtle.digest === 'function') {
            try {
                const buf = new TextEncoder().encode(data);
                const hashBuffer = await window.crypto.subtle.digest('SHA-256', buf);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            } catch (e) { warn('crypto fallback:', e); }
        }
        return sha256Fallback(unescape(encodeURIComponent(data)));
    }

    /* ---------- ЦЕНА ---------- */
    function formatPrice(value) {
        if (!value && value !== 0) return '0';
        let num = typeof value === 'string' ? value.toLowerCase() : value.toString();
        if (num.indexOf('к') !== -1) {
            let base = parseFloat(num.split('к')[0]) || 0;
            let kCount = (num.match(/к/g) || []).length;
            if (kCount === 1) base *= 1000;
            else if (kCount === 2) base *= 1000000;
            else if (kCount === 3) base *= 1000000000;
            return Math.floor(base).toString();
        }
        num = parseInt(num) || 0;
        if (num >= 1000000000) return (num / 1000000000).toFixed(num % 1000000000 === 0 ? 0 : 2) + 'ккк';
        if (num >= 1000000)    return (num / 1000000).toFixed(num % 1000000 === 0 ? 0 : 1) + 'кк';
        if (num >= 1000)       return (num / 1000).toFixed(num % 1000 === 0 ? 0 : 1) + 'к';
        return num.toString();
    }
    function parsePriceToNumber(str) {
        if (!str) return 0;
        str = str.toLowerCase().trim();
        let num = parseInt(str.replace(/[^0-9]/g, '')) || 0;
        let kCount = (str.match(/к/g) || []).length;
        if (kCount === 1) num *= 1000;
        else if (kCount === 2) num *= 1000000;
        else if (kCount === 3) num *= 1000000000;
        return num;
    }
    function formatPriceInputHandler(e) {
        const input = e.target;
        let val = input.value.toLowerCase().replace(/[^0-9к]/g, '');
        if (!val) { input.value = ''; return; }
        let num = parseInt(val.replace(/к/g, '')) || 0;
        let kCount = (val.match(/к/g) || []).length;
        if (kCount === 1) num *= 1000;
        else if (kCount === 2) num *= 1000000;
        else if (kCount === 3) num *= 1000000000;
        input.value = formatPrice(num);
    }

    /* ---------- ССЫЛКИ ---------- */
    function isAllowedLink(url) {
        try {
            const u = new URL(url);
            const host = u.hostname.replace('www.', '');
            return ALLOWED_DOMAINS.some(function(d) { return host === d || host.endsWith('.' + d); });
        } catch (e) { return false; }
    }
    function checkLinksString(str) {
        if (!str || !str.trim()) return { valid: true, links: [] };
        const links = str.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
        if (links.length > 20) return { valid: false, message: 'Максимум 20 ссылок' };
        for (let i = 0; i < links.length; i++) {
            if (!isAllowedLink(links[i])) return { valid: false, message: 'Ссылка ' + links[i] + ' не разрешена' };
        }
        return { valid: true, links: links };
    }
    function checkForbiddenWords(text) {
        if (!text) return null;
        const lower = text.toLowerCase();
        const found = FORBIDDEN_WORDS.some(function(word) { return lower.indexOf(word) !== -1; });
        return found ? '⚠️ Текст содержит запрещённые слова' : null;
    }
    async function checkLinkSafety(url) {
        const suspiciousDomains = ['phishing.com', 'malware.org', 'scam.net'];
        try {
            const domain = new URL(url).hostname.replace('www.', '');
            if (suspiciousDomains.some(function(d) { return domain.indexOf(d) !== -1; })) {
                return { safe: false, message: '⚠️ Ссылка может быть опасной' };
            }
            return { safe: true };
        } catch (e) { return { safe: false, message: 'Некорректная ссылка' }; }
    }

    function showModal(html, onClose) {
        // Закрыть предыдущую
        if (activeModal) {
            try { activeModal.overlay.remove(); } catch (e) {}
            activeModal = null;
        }
        const container = document.getElementById('modalContainer');
        container.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal"><button class="modal-close" id="modalCloseBtn" aria-label="Закрыть">✕</button>' + html + '</div></div>';
        const overlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('modalCloseBtn');
        const state = { overlay: overlay, closed: false };
        activeModal = state;

        // Показ через двойной RAF — избегает баги с transition
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                if (!state.closed) overlay.classList.add('show');
            });
        });

        function closeModal() {
            if (state.closed) return;
            state.closed = true;
            overlay.classList.remove('show');
            setTimeout(function() {
                if (overlay.parentNode) overlay.remove();
                if (activeModal === state) activeModal = null;
                if (onClose) onClose();
            }, 200);
        }
        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
        return { overlay: overlay, closeModal: closeModal };
    }

            '<p style="color:var(--muted);margin-bottom:1rem;font-size:.85rem;">' + message + '</p>' +
            '<button class="btn primary w-full" id="alertOkBtn">ОК</button>' +
            '</div>'
        );
        document.getElementById('alertOkBtn').addEventListener('click', ref.closeModal);
    }

    async function loginWithUsername(username, password) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            showToast('Логин: 3-20 символов (латиница, цифры, _)', 'error');
            return false;
        }
        if (!password || password.length < 6) {
            showToast('Пароль не короче 6 символов', 'error');
            return false;
        }
        try {
            showTopProgress();
            const hashedPassword = await hashPassword(password);
            const res = await withTimeout(
                supabaseClient.from('app_users').select('*').eq('username', username).maybeSingle(),
                8000
            );
            hideTopProgress();
            if (res.error) {
                showAlert('Ошибка соединения', res.error.message || 'Не удалось запросить пользователя', 'error');
                return false;
            }
            const user = res.data;
            if (!user) { showAlert('Пользователь не найден', 'Проверьте логин или зарегистрируйтесь', 'error'); return false; }
            if (user.password_hash !== hashedPassword) { showAlert('Неверный пароль', 'Попробуйте ещё раз', 'error'); return false; }
            if (user.banned) { showBanScreen(); return false; }
            currentUser = user;
            localStorage.setItem('arizona_current_user', JSON.stringify(user));
            return true;
        } catch (e) {
            hideTopProgress();
            showToast('Ошибка: ' + (e.message || 'неизвестно'), 'error');
            return false;
        }
    }
    async function registerUser(username, password) {
        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
            showToast('Логин: 3-20 символов (латиница, цифры, _)', 'error');
            return false;
        }
        if (!password || password.length < 6) {
            showToast('Пароль не короче 6 символов', 'error');
            return false;
        }
        try {
            showTopProgress();
            const hashedPassword = await hashPassword(password);
            const checkRes = await withTimeout(
                supabaseClient.from('app_users').select('id').eq('username', username).maybeSingle(),
                8000
            );
            if (checkRes.error) { hideTopProgress(); showAlert('Ошибка соединения', checkRes.error.message, 'error'); return false; }
            if (checkRes.data) { hideTopProgress(); showAlert('Ошибка', 'Пользователь с таким именем уже существует', 'error'); return false; }

            const newUser = {
                username: username,
                password_hash: hashedPassword,
                telegram_id: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null,
                telegram_username: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.username : null,
                banned: false,
                is_admin: username === OWNER_USERNAME,
                created_at: new Date().toISOString()
            };
            const insertRes = await withTimeout(
                supabaseClient.from('app_users').insert(newUser).select().single(),
                8000
            );
            hideTopProgress();
            if (insertRes.error) { showAlert('Ошибка БД', insertRes.error.message || 'Не удалось создать аккаунт', 'error'); return false; }
            currentUser = insertRes.data;
            localStorage.setItem('arizona_current_user', JSON.stringify(currentUser));
            try { await supabaseClient.from('user_settings').insert({ user_id: currentUser.id, theme: 'dark', sfx_enabled: true, admin_password_hash: null }); } catch (e) {}
            try { await supabaseClient.from('user_progress').insert({ user_id: currentUser.id, tutorial_completed: false, admin_tutorial_completed: false }); } catch (e) {}
            return true;
        } catch (e) {
            hideTopProgress();
            showToast('Ошибка: ' + (e.message || 'неизвестно'), 'error');
            return false;
        }
    }

        const container = document.getElementById('authContainer');
        let mode = 'login';
        let isSubmitting = false;
        let savedUsername = prefillUsername;
        let savedPassword = '';

        // Собираем HTML один раз
        function renderAuthForm(errorMsg) {
            errorMsg = errorMsg || '';
            container.innerHTML = (
                '<div class="auth-container">' +
                    '<div class="auth-background"></div>' +
                    '<button class="auth-theme-toggle" id="authThemeToggle" aria-label="Тема">🌓</button>' +
                    '<div class="auth-box">' +
                        '<div class="auth-brand">' +
                            '<img id="authLogoImg" class="auth-logo" alt="Logo">' +
                            '<div class="auth-brand-text">' +
                                '<h2 class="auth-title brand-animated">Arizona Online</h2>' +
                                '<p class="auth-team brand-team-animated">× BOUNTY TEAM</p>' +
                            '</div>' +
                        '</div>' +
                        '<div class="auth-tabs">' +
                            '<button class="auth-tab ' + (mode === 'login' ? 'active' : '') + '" id="authTabLogin" type="button">Вход</button>' +
                            '<button class="auth-tab ' + (mode === 'register' ? 'active' : '') + '" id="authTabRegister" type="button">Создать</button>' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label>Логин</label>' +
                            '<input type="text" id="authUsername" placeholder="username" autocomplete="username" value="' + savedUsername + '">' +
                        '</div>' +
                        '<div class="form-group">' +
                            '<label>Пароль</label>' +
                            '<input type="password" id="authPassword" placeholder="Минимум 6 символов" autocomplete="' + (mode === 'login' ? 'current-password' : 'new-password') + '" value="' + savedPassword + '">' +
                        '</div>' +
                        '<button class="btn primary w-full" id="authSubmitBtn" type="button"' + (isSubmitting ? ' disabled' : '') + '>' +
                            (isSubmitting ? '⏳ Загрузка...' : (mode === 'login' ? 'Войти' : 'Создать аккаунт')) +
                        '</button>' +
                        '<p class="auth-error" id="authError">' + errorMsg + '</p>' +
                        '<p class="auth-hint">' + (mode === 'login' ? 'Введите свои данные' : 'Придумайте уникальный логин') + '</p>' +
                    '</div>' +
                '</div>'
            );

            // Обновить картинки
            const bg = container.querySelector('.auth-background');
            if (bg) bg.style.backgroundImage = currentTheme === 'dark'
                ? "url('https://i.postimg.cc/yNhGbRG4/1788346347547.jpg')"
                : "url('https://i.postimg.cc/x8phPS4J/1788346275828.jpg')";
            const logo = container.querySelector('#authLogoImg');
            if (logo) logo.src = currentTheme === 'dark'
                ? 'https://i.postimg.cc/zfWNX3c5/1788346752679.jpg'
                : 'https://i.postimg.cc/nV1HDjcb/1788346659518.jpg';

            // Тема — без ререндера, только смена атрибута
            document.getElementById('authThemeToggle').addEventListener('click', function() {
                // Сохранить текущие значения полей
                const u = document.getElementById('authUsername');
                const p = document.getElementById('authPassword');
                if (u) savedUsername = u.value;
                if (p) savedPassword = p.value;

                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', currentTheme);

                // Обновить фон и логотипы без ререндера
                if (bg) bg.style.backgroundImage = currentTheme === 'dark'
                    ? "url('https://i.postimg.cc/yNhGbRG4/1788346347547.jpg')"
                    : "url('https://i.postimg.cc/x8phPS4J/1788346275828.jpg')";
                if (logo) logo.src = currentTheme === 'dark'
                    ? 'https://i.postimg.cc/zfWNX3c5/1788346752679.jpg'
                    : 'https://i.postimg.cc/nV1HDjcb/1788346659518.jpg';

                if (tg && tg.setHeaderColor) tg.setHeaderColor(currentTheme === 'dark' ? '#0F0A1E' : '#FFF8F5');
                if (tg && tg.setBackgroundColor) tg.setBackgroundColor(currentTheme === 'dark' ? '#0F0A1E' : '#FFF8F5');
            });

            document.getElementById('authTabLogin').addEventListener('click', function() {
                if (mode !== 'login') {
                    // Сохранить поля
                    const u = document.getElementById('authUsername');
                    const p = document.getElementById('authPassword');
                    if (u) savedUsername = u.value;
                    if (p) savedPassword = '';
                    mode = 'login';
                    isSubmitting = false;
                    renderAuthForm();
                }
            });
            document.getElementById('authTabRegister').addEventListener('click', function() {
                if (mode !== 'register') {
                    const u = document.getElementById('authUsername');
                    const p = document.getElementById('authPassword');
                    if (u) savedUsername = u.value;
                    if (p) savedPassword = '';
                    mode = 'register';
                    isSubmitting = false;
                    renderAuthForm();
                }
            });

            const submitBtn = document.getElementById('authSubmitBtn');
            submitBtn.addEventListener('click', async function() {
                if (isSubmitting) return;
                const errEl = document.getElementById('authError');
                errEl.textContent = '';
                const username = (document.getElementById('authUsername').value || '').trim().toLowerCase();
                const password = (document.getElementById('authPassword').value || '').trim();
                if (!username) { errEl.textContent = 'Введите логин'; return; }
                if (!password) { errEl.textContent = 'Введите пароль'; return; }
                isSubmitting = true;
                submitBtn.disabled = true;
                submitBtn.textContent = '⏳ Загрузка...';
                try {
                    let success = false;
                    if (mode === 'login') success = await loginWithUsername(username, password);
                    else success = await registerUser(username, password);
                    if (success) {
                        container.innerHTML = '';
                        showApp();
                        try { initApp(); } catch (e) { warn('initApp:', e); }
                        return;
                    }
                } catch (e) {
                    warn('Auth handler:', e);
                    errEl.textContent = 'Ошибка: ' + (e.message || 'неизвестно');
                } finally {
                    isSubmitting = false;
                    if (document.getElementById('authSubmitBtn')) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = mode === 'login' ? 'Войти' : 'Создать аккаунт';
                    }
                }
            });
            const pw = document.getElementById('authPassword');
            if (pw) pw.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitBtn.click(); });
            setTimeout(function() {
                const u = document.getElementById('authUsername');
                if (u && !u.value) u.focus();
            }, 150);
        }
        renderAuthForm();
    }

    async function loadUserSettingsAndProgress() {
        if (!currentUser) return;
        try {
            const se = await withTimeout(supabaseClient.from('user_settings').select('*').eq('user_id', currentUser.id).maybeSingle(), 5000);
            if (se.error) throw se.error;
            if (se.data) {
                userSettings = se.data;
                currentTheme = se.data.theme || 'dark';
                sfxEnabled = se.data.sfx_enabled !== false;
            } else {
                try { await supabaseClient.from('user_settings').insert({ user_id: currentUser.id, theme: 'dark', sfx_enabled: true, admin_password_hash: null }); } catch (e) {}
                currentTheme = 'dark';
                sfxEnabled = true;
            }
            const pe = await withTimeout(supabaseClient.from('user_progress').select('*').eq('user_id', currentUser.id).maybeSingle(), 5000);
            if (pe.error) throw pe.error;
            userProgress = pe.data || {};
        } catch (e) {
            warn('settings:', e);
            currentTheme = 'dark';
            sfxEnabled = true;
            userProgress = {};
        }
        applyTheme();
    }
    async function loadSearchHistory() {
        if (!currentUser) return;
        try {
            const res = await withTimeout(supabaseClient.from('search_history').select('query').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(10), 5000);
            if (res.error) throw res.error;
            searchHistory = res.data ? res.data.map(function(i) { return i.query; }) : [];
        } catch (e) { searchHistory = []; }
    }
    async function saveSearchQuery(query) {
        if (!currentUser || !query) return;
        try {
            await supabaseClient.from('search_history').insert({ user_id: currentUser.id, query: query });
            const idsRes = await supabaseClient.from('search_history').select('id').eq('user_id', currentUser.id).order('created_at', { ascending: false }).range(10, 9999);
            if (idsRes.data && idsRes.data.length) {
                await supabaseClient.from('search_history').delete().in('id', idsRes.data.map(function(r) { return r.id; }));
            }
            await loadSearchHistory();
        } catch (e) {}
    }
    async function loadNotificationsCount() {
        if (!currentUser) return;
        try {
            const res = await withTimeout(supabaseClient.from('notifications').select('*', { count: 'exact', head: true }).eq('user_id', currentUser.id).eq('read', false), 5000);
            if (!res.error) unreadNotifications = res.count || 0;
        } catch (e) { unreadNotifications = 0; }
    }
    async function loadUserRatings() {
        try {
            const res = await withTimeout(supabaseClient.from('reviews').select('ad_id, stars, ads(author_id)').limit(500), 5000);
            if (res.error || !res.data) return;
            const map = {};
            res.data.forEach(function(r) {
                const authorId = r.ads && r.ads.author_id;
                if (!authorId) return;
                if (!map[authorId]) map[authorId] = { sum: 0, count: 0 };
                map[authorId].sum += r.stars;
                map[authorId].count++;
            });
            for (const id in map) {
                userRatings[id] = { avg: map[id].sum / map[id].count, count: map[id].count };
            }
        } catch (e) {}
    }
    function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').then(function(lock) { wakeLock = lock; }).catch(function() {});
            }
        } catch (e) {}
    }
    function setupBackToTop() {
        const btn = document.getElementById('backToTop');
        if (!btn) return;
        let ticking = false;
        window.addEventListener('scroll', function() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function() {
                if (window.scrollY > 600) btn.classList.add('visible');
                else btn.classList.remove('visible');
                ticking = false;
            });
        }, { passive: true });
        btn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }
    function setupNetworkListeners() {
        const banner = document.getElementById('offlineBanner');
        function update() {
            if (!navigator.onLine) banner.classList.add('visible');
            else banner.classList.remove('visible');
        }
        window.addEventListener('online', update);
        window.addEventListener('offline', update);
        update();
    }
